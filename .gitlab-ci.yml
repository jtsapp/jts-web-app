variables:
  GITLAB_RUNNER_TAG: justtostudy.kz
  GIT_STRATEGY: fetch
  GIT_CHECKOUT: fetch
  # Без $CI_PIPELINE_ID: с ним каждый пайплайн получал новую папку на диске
  # раннера, GIT_STRATEGY: fetch не мог её переиспользовать (fetch'ить
  # нечего — папка каждый раз пустая), и старые чекауты копились вечно —
  # 34ГБ на сервере набежало именно так. Одна папка на ветку — раннер сам
  # дотягивает изменения в неё, как и задумывает fetch.
  GIT_CLONE_PATH: '$CI_BUILDS_DIR/$CI_COMMIT_BRANCH/$CI_PROJECT_NAME'

stages:
  - deploy
  - diag
  - trash

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        APP_ENV: production
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        APP_ENV: development

# Отдельного build-стейджа, в отличие от backend, не нужно — сборка Next.js
# (`npm ci` + `npm run build`) целиком внутри Dockerfile (multi-stage), её
# запускает сам `docker compose ... --build` на шаге deploy.
deploy:
  environment:
    name: $APP_ENV
  tags:
    - $GITLAB_RUNNER_TAG
  stage: deploy
  script:
    - echo $APP_ENV
    # ВАЖНО: НЕ переиспользовать голое "-p $APP_ENV", как у backend — сервис
    # тут тоже называется "postgres", и с одинаковым project name Docker
    # Compose считает это ТЕМ ЖЕ контейнером, что и у backend, и пересоздаёт
    # его под наш образ (реальный инцидент 2026-07-30 — снёс development-
    # postgres-1 бэкенда). "jts-$APP_ENV" даёт отдельное namespace.
    - docker compose -f compose.yaml -f compose-app.yaml -p jts-$APP_ENV up -d --build --force-recreate
  # dev отработал стабильно (реальное потребление RAM проверено) — добавляем
  # main для прода. POSTGRES_PORT/APP_PORT для production ДОЛЖНЫ быть заданы
  # отдельными от dev значениями в GitLab CI/CD Variables (иначе конфликт
  # портов на одном хосте — dev уже держит 5433/8090).
  only:
    - develop
    - main

# Кнопка «показать замеры мозга». Раннер и так крутится на этом хосте, поэтому
# логи контейнера он достаёт без SSH — а доступа к серверу есть не у всех, кому
# нужны цифры.
#
# Строка `[brain]` (см. api/voice/brain/chat/completions) говорит, сколько
# времени ход провёл ВНУТРИ приложения. Сравнивать её надо с `llm_ttft` из
# `lk agent logs`: разница между ними — это дорога от воркера в us-east до
# стенда, и без такого сопоставления её не отделить от медленного сервера.
#
# when: manual — сама не запускается; allow_failure, чтобы отсутствие строк
# (никто не звонил) не красило пайплайн.
#
# Без `environment:` НАМЕРЕННО, хотя у deploy он есть. Окружение в GitLab может
# быть защищённым, и тогда ручной запуск требует прав на деплой — кнопка есть,
# а нажатие отваливается «An error occurred while making the request» (поймали
# 06.09.2026). Задача ничего не разворачивает, только читает логи, привязка к
# окружению ей не нужна. `$APP_ENV` приходит из workflow.rules, а не отсюда.
brain-logs:
  tags:
    - $GITLAB_RUNNER_TAG
  stage: diag
  when: manual
  allow_failure: true
  variables:
    # Сколько времени назад смотреть. Переопределяется при ручном запуске:
    # кнопка Run пускает задать переменные.
    SINCE: 30m
  script:
    - echo "Замеры мозга за последние $SINCE — стенд jts-$APP_ENV"
    - docker logs --since "$SINCE" "jts-$APP_ENV-web-1" 2>&1 | grep '\[brain\]' || echo "строк [brain] нет — либо звонков не было, либо сборка старая"
  only:
    - develop
    - main

trash:
  tags:
    - $GITLAB_RUNNER_TAG
  stage: trash
  script:
    # until=720h (30 дней) на build cache не освобождал ничего: при частых
    # деплоях кэш не доживает до месяца — проверено на сервере вживую
    # (0B reclaimed). Кэш чистим без пощады к возрасту, образы/контейнеры —
    # только старше суток, с запасом на откат.
    - docker builder prune -a -f
    - docker system prune -f --all --filter "until=24h"
  only:
    - develop
    - main

after_script:
  - echo "End CI"
