# Сам Next.js-сервис. Комбинируется с compose.yaml (Postgres) в одном
# `-p $APP_ENV` проекте — тогда DATABASE_URL можно указывать на internal-имя
# сервиса `postgres`, без выхода наружу (см. compose.yaml).
#
# ВАЖНО (урок из миграции backend): пустой env на CI незаметно подставляется
# как пустая строка, а не «переменная отсутствует» — поэтому все секреты ниже
# ДОЛЖНЫ быть явно заданы в GitLab CI/CD Variables (per-environment scope),
# без надежды на дефолты внутри контейнера.
services:
  web:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* вшивается в бандл на этапе `next build` — должен быть
        # доступен уже на build-стадии, обычный `environment:` тут не поможет.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Джарвис (dev-only тьютор). Переменная задаётся только в dev-scope
        # GitLab CI; в прод-окружении её быть не должно.
        NEXT_PUBLIC_ENABLE_JARVIS: ${NEXT_PUBLIC_ENABLE_JARVIS:-}
        # Google Sign-In (см. src/lib/googleAuth.js). Пусто → кнопка неактивна,
        # ничего не ломается — но раз задали в GitLab CI, должна доехать сюда.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      # Мозг тьютора + оценка IELTS
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # LiveKit — токены + подпись webhook (сам голосовой агент деплоится
      # отдельно на LiveKit Cloud, сюда не относится)
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      # Своя БД (см. compose.yaml) — заменяет Neon
      DATABASE_URL: ${DATABASE_URL}
      # Сервисный ключ агент↔Next (Bearer на /api/voice/brain)
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Публичный адрес ИМЕННО ЭТОГО стенда: уезжает в метаданные комнаты, и
      # общий на дев/прод агент по нему понимает, в какую базу писать память и
      # звонки. Пусто → агент пишет туда, куда смотрит его JTS_API_URL.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Домены лендинга через запятую (прод: justtostudy-english.kz,
      # www.justtostudy-english.kz). На них корень отдаёт лендинг, а экраны
      # приложения уводятся на APP_PUBLIC_URL; на остальных доменах /landing —
      # 404 (src/proxy.js). Пусто → лендинг выключен везде, кроме локалки.
      LANDING_HOSTS: ${LANDING_HOSTS:-}
      # 1 → /landing открывается и на этом стенде (посмотреть на деве до домена).
      LANDING_PREVIEW: ${LANDING_PREVIEW:-}
      # LANDING_LEAD_KEY (ключ заявки в amoCRM) — ниже, в конце списка: его
      # завели раньше лендинга, а второй такой же ключ compose не примет.
      # Ключ шифрования имени и номера на пути «лендинг → регистрация». Пусто —
      # берётся INTERNAL_API_KEY; нет и его — регистрация начнётся с начала.
      LANDING_HANDOFF_SECRET: ${LANDING_HANDOFF_SECRET:-}
      # IELTS — опционально, каждая часть деградирует сама при пустом ключе
      SONIOX_API_KEY: ${SONIOX_API_KEY}
      # Кэш озвучки /api/tts — общий для dev и прода Redis из
      # compose-redis.yaml (имя tts-redis в сети jts-tts-redis). Не секрет,
      # поэтому дефолт здесь, а не в GitLab.
      REDIS_URL: ${REDIS_URL:-redis://tts-redis:6379}
      TTS_CACHE_TTL_DAYS: ${TTS_CACHE_TTL_DAYS:-90}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      ELEVEN_VOICE_ID_DEXTER: ${ELEVEN_VOICE_ID_DEXTER}
      ELEVENLABS_API_KEY_JARVIS: ${ELEVENLABS_API_KEY_JARVIS:-}
      ELEVEN_VOICE_ID_JARVIS: ${ELEVEN_VOICE_ID_JARVIS:-}
      ELEVENLABS_MODEL_JARVIS: ${ELEVENLABS_MODEL_JARVIS:-}
      # Айзере (dev-only) — тот же клон, что у стенда; пусто → общий ключ и
      # зашитый в роут id.
      ELEVENLABS_API_KEY_AIZERE: ${ELEVENLABS_API_KEY_AIZERE:-}
      ELEVEN_VOICE_ID_AIZERE: ${ELEVEN_VOICE_ID_AIZERE:-}
      # Fish Audio — голос Джарвиса (dev-only тьютор). Пусто → его карточки на
      # прод-сборке и так нет, роут просто не отдаст fish-провайдера.
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_VOICE_ID_JARVIS: ${FISH_VOICE_ID_JARVIS:-}
      # OpenAI TTS — ВРЕМЕННЫЙ голос Джарвиса вместо клона Fish (голос ash).
      # Только озвучка: мозг тьютора ходит в Anthropic, ключ ему не нужен.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_VOICE_JARVIS: ${OPENAI_TTS_VOICE_JARVIS:-}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON}
      # Тот же секрет, что LANDING_LEAD_KEY на бэкенде. Серверный, не NEXT_PUBLIC_.
      LANDING_LEAD_KEY: ${LANDING_LEAD_KEY:-}
    restart: always
    depends_on:
      - postgres
    ports:
      - ${APP_PORT}:3000
    mem_limit: 1g
    memswap_limit: 2g
    # default — своя сеть стенда (postgres); tts — общая с Redis кэша озвучки.
    # Раз сети перечислены явно, default обязан быть в списке, иначе web
    # потеряет postgres.
    networks:
      - default
      - tts
# Внешняя: её создаёт CI до деплоя (.gitlab-ci.yml). Локальный
# `docker compose up` без неё не стартует — `docker network create jts-tts-redis`.
networks:
  tts:
    name: jts-tts-redis
    external: true
