{ id:"a1-tec-website", level:"A1", genre:"technology", title:"The First Website", cover:{emoji:"💻"},
  task:{en:"Read and find out: who made the first website?",ru:"Прочитайте и узнайте: кто сделал первый сайт?",kz:"Оқып, біліңіз: алғашқы веб-сайтты кім жасады?"},
  words:[
    {en:"website",tr:"/ˈwebsaɪt/",ru:"сайт",kz:"веб-сайт",ex:"The first website in the world is still online."},
    {en:"online",tr:"/ˌɒnˈlaɪn/",ru:"онлайн, в сети",kz:"онлайн, желіде",ex:"The first website in the world is still online."},
    {en:"simple",tr:"/ˈsɪmpl/",ru:"простой",kz:"қарапайым",ex:"It is very simple."},
    {en:"link",tr:"/lɪŋk/",ru:"ссылка",kz:"сілтеме",ex:"Only black text and blue links."},
    {en:"information",tr:"/ˌɪnfəˈmeɪʃn/",ru:"информация",kz:"ақпарат",ex:"They had a lot of information on many computers."},
    {en:"free",tr:"/friː/",ru:"бесплатный",kz:"тегін",ex:"Tim's idea was free for everybody."}
  ],
  text:[
    "The first website in the world is still online. It is very simple. There are no pictures, no colours, no videos. Only black text and blue links. And it is very important.",
    "Tim Berners-Lee from England made it in 1991. His job was at CERN in Switzerland. Scientists there had a problem. They had a lot of information on many computers. Tim had an idea: links between all the pages.",
    "The idea was the World Wide Web. It is the “www” in every address. Tim's idea was free for everybody. He said: “This is for the whole world.” Today there are more than a billion websites. And the first was one page of text."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"The first website has got …",o:["many videos","only text and links","a lot of pictures"],a:1,
       e:{en:"Only black text and blue links — no pictures, no colours, no videos.",ru:"Только чёрный текст и синие ссылки — без картинок, цветов и видео.",kz:"Тек қара мәтін мен көк сілтемелер — суретсіз, түссіз, бейнесіз."}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"It has got no pictures.",a:true,e:{en:"“There are no pictures, no colours, no videos.”",ru:"«There are no pictures…»",kz:"«There are no pictures…»"}},
      {s:"Tim Berners-Lee was from England.",a:true,e:{en:"“Tim Berners-Lee from England made it in 1991.”",ru:"«Tim Berners-Lee from England…»",kz:"«Tim Berners-Lee from England…»"}},
      {s:"The first website is not online today.",a:false,e:{en:"“The first website in the world is still online.”",ru:"«…is still online» — он всё ещё в сети.",kz:"«…is still online» — ол әлі де желіде."}},
      {s:"Today there are more than a billion websites.",a:true,e:{en:"“Today there are more than a billion websites.”",ru:"«…more than a billion websites» — больше миллиарда.",kz:"«…more than a billion websites» — миллиардтан астам."}},
      {s:"CERN is in France.",a:false,e:{en:"“His job was at CERN in Switzerland.”",ru:"«…at CERN in Switzerland» — в Швейцарии.",kz:"«…at CERN in Switzerland» — Швейцарияда."}}
    ]},
    {type:"match",instruction:INS.matchE,explanation:EXPL.match,pairs:[
      {l:"website",r:"🌐",alt:{en:"website",ru:"сайт",kz:"веб-сайт"}},{l:"computer",r:"💻",alt:{en:"computer",ru:"компьютер",kz:"компьютер"}},
      {l:"link",r:"🔗",alt:{en:"link",ru:"ссылка",kz:"сілтеме"}},{l:"scientist",r:"👩‍🔬",alt:{en:"scientist",ru:"учёный",kz:"ғалым"}},
      {l:"page",r:"📄",alt:{en:"page",ru:"страница",kz:"бет"}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"The first website is still {online}. It has got only black text and blue {links}. Tim Berners-Lee made it in {1991}. Scientists had a lot of {information}. Tim's idea was {free} for everybody.",
     extra:["2001","pictures"]},
    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "Scientists at CERN have got information on many computers.","Tim Berners-Lee has an idea: links between the pages.","In 1991 he makes the first website.","It is one page of black text and blue links.","Today there are more than a billion websites."
    ]}
  ]},

/* ───────── 14 · NATURE ───────── */
{ id:"a1-nat-otters", level:"A1", genre:"nature", title:"Otters Hold Hands", cover:{emoji:"🦦"},
  task:{en:"Read and find out: why do otters hold hands?",ru:"Прочитайте и узнайте: почему выдры держатся за руки?",kz:"Оқып, біліңіз: кәмшаттар неге қол ұстасады?"},
  words:[
    {en:"otter",tr:"/ˈɒtə/",ru:"выдра",kz:"кәмшат",ex:"Sea otters sleep in the water."},
    {en:"hold",tr:"/həʊld/",ru:"держать",kz:"ұстау",ex:"They hold hands!"},
    {en:"kelp",tr:"/kelp/",ru:"морская водоросль",kz:"теңіз балдыры",ex:"They put sea plants — kelp — around their bodies."},
    {en:"fur",tr:"/fɜː/",ru:"мех",kz:"жүн",ex:"Sea otters have got very thick fur."},
    {en:"tool",tr:"/tuːl/",ru:"инструмент",kz:"құрал",ex:"They also use tools."},
    {en:"shell",tr:"/ʃel/",ru:"раковина",kz:"бақалшақ",ex:"It opens shells with the stone."}
  ],
  text:[
    "Sea otters sleep in the water. But the sea moves. How do they stay together? They hold hands! A mother and a baby. Or a group of friends. They sleep on their backs, hand in hand.",
    "Otters have got a trick, too. They put sea plants — kelp — around their bodies. The kelp is like a bed. So the otter doesn't go away in the night.",
    "Sea otters have got very thick fur. No animal has got fur like this. They also use tools. An otter has got a favourite stone. It keeps it in a pocket under its arm. It opens shells with the stone. Clever, right?"
  ],
  exercises:[
    {type:"mc",instruction:INS.mc,items:[
      {q:"Where do sea otters sleep?",o:["on the beach","in a tree","in the water"],a:2,e:{en:"“Sea otters sleep in the water.”",ru:"«Sea otters sleep in the water.» — в воде.",kz:"«Sea otters sleep in the water.» — суда."}},

{ id:"a2-sci-pitch", level:"A2", genre:"science", title:"The Longest Experiment in the World", cover:{emoji:"🧪"},
  task:{en:"Read and find out: why has nobody ever seen the drop fall?",ru:"Прочитайте и узнайте: почему никто никогда не видел, как падает капля?",kz:"Оқып, біліңіз: тамшының түскенін неге ешкім көрмеген?"},
  words:[
    {en:"patient",tr:"/ˈpeɪʃnt/",ru:"терпеливый",kz:"шыдамды",ex:"You must be patient. Very patient."},
    {en:"experiment",tr:"/ɪkˈsperɪmənt/",ru:"эксперимент",kz:"тәжірибе",ex:"Would you like to watch an experiment?"},
    {en:"solid",tr:"/ˈsɒlɪd/",ru:"твёрдое тело; твёрдый",kz:"қатты зат; қатты",ex:"It looks like a solid: you can break it with a hammer."},
    {en:"liquid",tr:"/ˈlɪkwɪd/",ru:"жидкость",kz:"сұйықтық",ex:"Parnell said it was really a liquid."},
    {en:"funnel",tr:"/ˈfʌnl/",ru:"воронка",kz:"шұңғыма (воронка)",ex:"He put it in a glass funnel and waited."},
    {en:"drop",tr:"/drɒp/",ru:"капля",kz:"тамшы",ex:"The first drop fell in 1938."},
    {en:"flow",tr:"/fləʊ/",ru:"течь",kz:"ағу",ex:"Pitch flows billions of times more slowly than water."}
  ],
  text:[
    "Would you like to watch an experiment? You must be patient. Very patient. This one started in 1927, and it is still going on today.",
    "In 1927, Thomas Parnell, a professor in Brisbane, Australia, wanted to show his students something surprising. Pitch is a black material. It looks like a solid: you can break it with a hammer. But Parnell said it was really a liquid — a very, very slow one. He heated some pitch, put it in a glass funnel and waited.",
    "The first drop fell in 1938. The second fell in 1947. Since 1927, only nine drops have fallen — about one drop every ten years. Pitch flows billions of times more slowly than water.",
    "Here is the strange part: nobody has ever seen a drop fall. In 2000 a camera watched the funnel, but it stopped working at the wrong moment. In 2014 the drop fell during a change of the glass. Today the experiment has a webcam, and thousands of people watch it online. The next drop is going to fall… one day. Maybe you will be the first person to see it."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"An experiment started in 1927 and it is still going on. What is it about?",o:["a very slow liquid","a very old tree","a very long film"],a:0,
       e:{en:"It is about pitch — a liquid that flows billions of times more slowly than water.",ru:"Это о пёке — жидкости, которая течёт в миллиарды раз медленнее воды.",kz:"Бұл шайыр туралы — судан миллиардтаған есе баяу ағатын сұйықтық."}}
    ]},
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"Pitch is white.",a:"F",e:{en:"“Pitch is a black material.”",ru:"«Pitch is a black material.» — чёрный.",kz:"«Pitch is a black material.» — қара."}},
      {s:"Thomas Parnell worked in Australia.",a:"T",e:{en:"“…a professor in Brisbane, Australia.”",ru:"«…a professor in Brisbane, Australia.»",kz:"«…a professor in Brisbane, Australia.»"}},
      {s:"Parnell's students loved the experiment.",a:"NG",e:{en:"The text does not say what the students thought.",ru:"В тексте не сказано, что думали студенты.",kz:"Мәтінде студенттердің не ойлағаны айтылмаған."}},
      {s:"Nine drops have fallen since 1927.",a:"T",e:{en:"“Since 1927, only nine drops have fallen.”",ru:"«…only nine drops have fallen.» — девять.",kz:"«…only nine drops have fallen.» — тоғыз."}},
      {s:"Parnell was born in England.",a:"NG",e:{en:"The text says nothing about where he was born.",ru:"В тексте нет информации о том, где он родился.",kz:"Мәтінде оның қай жерде туғаны туралы ештеңе жоқ."}},
      {s:"A camera filmed the drop in 2000.",a:"F",e:{en:"“…it stopped working at the wrong moment.”",ru:"«…it stopped working at the wrong moment.» — камера сломалась.",kz:"«…it stopped working at the wrong moment.» — камера істемей қалды."}}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"In the text, “patient” means…",o:["able to wait a long time","sick","very clever"],a:0,e:{en:"Patient = you can wait without getting angry.",ru:"Patient — умеющий ждать, терпеливый.",kz:"Patient — күте алатын, шыдамды."}},
      {q:"“solid” means…",o:["something soft like water","something hard, not a liquid","something hot"],a:1,e:{en:"“It looks like a solid: you can break it with a hammer.”",ru:"Solid — твёрдое тело, не жидкость.",kz:"Solid — қатты зат, сұйықтық емес."}},
      {q:"A “funnel” is…",o:["a kind of camera","a black material","a glass tool with a wide top and a small hole at the bottom"],a:2,e:{en:"The pitch slowly goes down through the small hole of the funnel.",ru:"Воронка: широкая сверху, узкая снизу.",kz:"Шұңғыма: үсті кең, асты тар."}},
      {q:"“flows” means…",o:["breaks","moves like a liquid","stops"],a:1,e:{en:"Water flows, rivers flow — and pitch flows, very slowly.",ru:"Flow — течь, как вода в реке.",kz:"Flow — ағу, өзендегі су сияқты."}}
    ]},

     text:"The experiment started in {1927} in Brisbane. Pitch looks like a {solid}, but it is really a very slow {liquid}. Parnell put the pitch in a glass {funnel}. Only nine {drops} have fallen. Nobody has ever {seen} a drop fall.",
     extra:["camera","water"]},
    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[
      {l:{en:"Paragraph 1",ru:"Абзац 1",kz:"1-абзац"},r:"A test of patience"},

{ id:"a2-adv-dekker", level:"A2", genre:"adventure", title:"Alone Around the World at Fourteen", cover:{emoji:"⛵"},
  task:{en:"Read and find out: how long did Laura's trip take?",ru:"Прочитайте и узнайте: сколько длилось путешествие Лауры?",kz:"Оқып, біліңіз: Лаураның сапары қанша уақытқа созылды?"},
  words:[
    {en:"port",tr:"/pɔːt/",ru:"порт",kz:"порт",ex:"Laura was born in a port in New Zealand."},
    {en:"decision",tr:"/dɪˈsɪʒn/",ru:"решение",kz:"шешім",ex:"At thirteen she made a big decision."},
    {en:"dangerous",tr:"/ˈdeɪndʒərəs/",ru:"опасный",kz:"қауіпті",ex:"“It is too dangerous,” they said."},
    {en:"court",tr:"/kɔːt/",ru:"суд",kz:"сот",ex:"A court in the Netherlands stopped her for a year."},
    {en:"give up",tr:"/ɡɪv ˈʌp/",ru:"сдаваться",kz:"бас тарту, беріле салу",ex:"But Laura didn't give up."},
    {en:"storm",tr:"/stɔːm/",ru:"шторм, буря",kz:"дауыл",ex:"She saw dolphins, terrible storms and beautiful islands."},
    {en:"island",tr:"/ˈaɪlənd/",ru:"остров",kz:"арал",ex:"Sint Maarten is an island in the Caribbean."}
  ],
  text:[
    "Laura Dekker was born on a boat. Her parents sailed around the world for seven years, and Laura was born in a port in New Zealand. Her first home was the sea. Maybe that is why, at thirteen, she made a big decision: she wanted to sail around the world alone.",
    "Many people said no. “She is too young,” they said. “It is too dangerous.” A court in the Netherlands stopped her for a year. But Laura didn't give up. She prepared her boat, Guppy, and she studied hard. In August 2010, when she was fourteen, she finally left the port of Gibraltar.",
    "The trip took more than a year. Laura crossed the Atlantic Ocean and the Pacific Ocean. She saw dolphins, terrible storms and beautiful islands. She was often alone for weeks. She did her school homework on the boat and sent it by email.",
    "In January 2012, Laura arrived in Sint Maarten, an island in the Caribbean. She was sixteen. Thousands of people met her at the port. She was the youngest person in the world to sail around the planet alone. “The sea was my teacher,” she said later."
  ],

{ id:"a2-mys-footprints", level:"A2", genre:"mystery", title:"The Footprints in the Snow", cover:{emoji:"❄️"},
  task:{en:"Read and find out: why did the footprints stop?",ru:"Прочитайте и узнайте: почему следы оборвались?",kz:"Оқып, біліңіз: іздер неге үзіліп қалды?"},
  words:[
    {en:"footprint",tr:"/ˈfʊtprɪnt/",ru:"след (ноги)",kz:"аяқ ізі",ex:"There were footprints in the snow — big boots."},
    {en:"missing",tr:"/ˈmɪsɪŋ/",ru:"пропавший",kz:"жоғалған",ex:"Ten apples were missing from his store."},
    {en:"thief",tr:"/θiːf/",ru:"вор",kz:"ұры",ex:"“Did the thief fly away?” Sabit asked."},
    {en:"closely",tr:"/ˈkləʊsli/",ru:"внимательно",kz:"мұқият",ex:"Ainur looked at the footprints closely."},
    {en:"backwards",tr:"/ˈbækwədz/",ru:"назад, задом наперёд",kz:"кері, артқа қарай",ex:"He walked back — backwards, in his own footprints."},
    {en:"neighbour",tr:"/ˈneɪbə/",ru:"сосед",kz:"көрші",ex:"The neighbour's son, Marat, opened the door."},
    {en:"notebook",tr:"/ˈnəʊtbʊk/",ru:"блокнот",kz:"дәптер",ex:"Ainur wrote in her notebook: The Footprints That Stopped."}
  ],
  text:[
    "It snowed all night in the village of Karagash. In the morning, old Sabit went to his garden and stopped. Ten apples were missing from his store. There were footprints in the snow — big boots. They went from the gate to the store, but they didn't come back. They just stopped.",
    "“Did the thief fly away?” Sabit asked. He called his granddaughter Ainur, who was twelve and loved detective books. Ainur looked at the footprints closely. “Grandpa,” she said, “these prints are deeper at the front. And each print has two lines inside.”",
    "Ainur smiled. “The thief didn't fly. He walked to the store, took the apples and walked back — backwards, in his own footprints. That's why there are two lines.” She followed the prints to the next house. The neighbour's son, Marat, opened the door. His boots were wet, and there was an apple in his hand.",
    "“I'm sorry,” Marat said. “I was going to bring them back.” Sabit laughed. “Next time, just ask.” Ainur wrote in her notebook: The Footprints That Stopped. Solved."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"Footprints go to a store and stop. They don't come back. What happened?",o:["The thief flew away.","The thief walked back in his own footprints.","The snow covered the prints."],a:1,
       e:{en:"He walked backwards in his own footprints — that is why they stopped.",ru:"Он вернулся задом наперёд по своим же следам — поэтому они оборвались.",kz:"Ол өз іздерімен кері жүрді — сондықтан іздер үзілді."}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"Sabit lost ten apples.",a:true,e:{en:"“Ten apples were missing from his store.”",ru:"«Ten apples were missing…»",kz:"«Ten apples were missing…»"}},

      {s:"Ainur is Sabit's daughter.",a:false,e:{en:"“He called his granddaughter Ainur…”",ru:"«…his granddaughter Ainur» — внучка.",kz:"«…his granddaughter Ainur» — немересі."}},
      {s:"Each footprint had two lines inside.",a:true,e:{en:"“And each print has two lines inside.”",ru:"«…each print has two lines inside.»",kz:"«…each print has two lines inside.»"}},
      {s:"Marat wanted to keep the apples forever.",a:false,e:{en:"“I was going to bring them back.”",ru:"«I was going to bring them back.» — собирался вернуть.",kz:"«I was going to bring them back.» — қайтармақ болған."}}

     extra:["forwards","dry"]},

      {l:"Who lost the apples?",r:"Sabit"},{l:"Who solved the mystery?",r:"Ainur"},{l:"Where did the footprints stop?",r:"at the store"},
      {l:"Who took the apples?",r:"Marat, the neighbour's son"},{l:"What did Ainur write in her notebook?",r:"The Footprints That Stopped"}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“missing” means…",o:["broken","not there","very old"],a:1,e:{en:"Missing = not in its place; you can't find it.",ru:"Missing — пропавший, не на месте.",kz:"Missing — жоғалған, орнында жоқ."}},

      {q:"“closely” means…",o:["with a lot of attention","from far away","quickly"],a:0,e:{en:"To look closely = to look with attention.",ru:"Closely — внимательно.",kz:"Closely — мұқият."}},

{ id:"a2-his-goldenman", level:"A2", genre:"history", title:"The Golden Man", cover:{emoji:"👑"},
  task:{en:"Read and find out: what is still a mystery about the Golden Man?",ru:"Прочитайте и узнайте: что до сих пор остаётся загадкой Золотого человека?",kz:"Оқып, біліңіз: Алтын адамның қандай сыры әлі ашылмаған?"},
  words:[
    {en:"kurgan",tr:"/kʊəˈɡɑːn/",ru:"курган",kz:"қорған",ex:"It was a kurgan — a grave from the time of the Saka people."},
    {en:"archaeologist",tr:"/ˌɑːkiˈɒlədʒɪst/",ru:"археолог",kz:"археолог",ex:"Archaeologists came, and the leader was Kemal Akishev."},
    {en:"skeleton",tr:"/ˈskelɪtn/",ru:"скелет",kz:"қаңқа",ex:"They found the skeleton of a young person."},
    {en:"cup",tr:"/kʌp/",ru:"чаша, кубок",kz:"тостаған",ex:"There was also a silver cup with twenty-six strange signs."},
    {en:"sign",tr:"/saɪn/",ru:"знак",kz:"белгі, таңба",ex:"Nobody has read the signs yet."},
    {en:"warrior",tr:"/ˈwɒriə/",ru:"воин",kz:"жауынгер",ex:"Some believe it was a young woman, a warrior princess."},
    {en:"symbol",tr:"/ˈsɪmbl/",ru:"символ",kz:"символ, нышан",ex:"Today the Golden Man is a symbol of Kazakhstan."}
  ],
  text:[
    "In 1969, workers near the village of Issyk, not far from Almaty, started to build a road. They had to move an old hill. But it was not a hill. It was a kurgan — a grave from the time of the Saka people, more than two thousand years old.",
    "Archaeologists came, and the leader was Kemal Akishev. Inside, they found the skeleton of a young person, sixteen to eighteen years old, and about four thousand pieces of gold. The clothes, the boots and the tall hat all had gold on them. Scientists called the person “the Golden Man”.",
    "There was also a silver cup with twenty-six strange signs. Nobody has read them yet. Some scientists think it is the oldest writing in Central Asia. Others are not sure. And there is one more question: was the Golden Man really a man? Some archaeologists believe it was a young woman, a warrior princess.",
    "Today the Golden Man is a symbol of Kazakhstan. You can see him on the Independence Monument in Almaty, and copies of his clothes travel to museums around the world. The workers finished the road too — a little later than they planned."
  ],
  exercises:[
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"The Golden Man was about forty years old.",a:"F",e:{en:"“…a young person, sixteen to eighteen years old.”",ru:"«…sixteen to eighteen years old.» — 16–18 лет.",kz:"«…sixteen to eighteen years old.» — 16–18 жаста."}},
      {s:"The workers found the kurgan when they built a road.",a:"T",e:{en:"“…started to build a road. They had to move an old hill.”",ru:"«…started to build a road.»",kz:"«…started to build a road.»"}},
      {s:"Kemal Akishev was born in Almaty.",a:"NG",e:{en:"The text does not say where Akishev was born.",ru:"В тексте не сказано, где родился Акишев.",kz:"Мәтінде Ақышевтың қайда туғаны айтылмаған."}},
      {s:"Nobody has read the signs on the cup yet.",a:"T",e:{en:"“Nobody has read them yet.”",ru:"«Nobody has read them yet.»",kz:"«Nobody has read them yet.»"}},
      {s:"The road near Issyk is the longest road in Kazakhstan.",a:"NG",e:{en:"The text says nothing about the length of the road.",ru:"О длине дороги в тексте ничего нет.",kz:"Мәтінде жолдың ұзындығы туралы ештеңе жоқ."}},
      {s:"Copies of the gold clothes travel to museums.",a:"T",e:{en:"“…copies of his clothes travel to museums around the world.”",ru:"«…copies of his clothes travel to museums…»",kz:"«…copies of his clothes travel to museums…»"}}
    ]},
    {type:"mc",instruction:INS.mc,items:[
      {q:"When did the workers find the kurgan?",o:["in 1969","in 1996","in 1909"],a:0,e:{en:"“In 1969, workers near the village of Issyk…”",ru:"«In 1969…»",kz:"«In 1969…»"}},

    ]},

{ id:"a2-tec-sms", level:"A2", genre:"technology", title:"Merry Christmas: The First Text Message", cover:{emoji:"📱"},
  task:{en:"Read and find out: why couldn't Papworth get an answer?",ru:"Прочитайте и узнайте: почему Папворт не мог получить ответ?",kz:"Оқып, біліңіз: Папворт неге жауап ала алмады?"},
  words:[
    {en:"engineer",tr:"/ˌendʒɪˈnɪə/",ru:"инженер",kz:"инженер",ex:"A young engineer in England sat down at a computer."},
    {en:"type",tr:"/taɪp/",ru:"печатать",kz:"теру",ex:"He typed two words: “Merry Christmas”."},
    {en:"message",tr:"/ˈmesɪdʒ/",ru:"сообщение",kz:"хабарлама",ex:"It was the first text message in the world."},
    {en:"receive",tr:"/rɪˈsiːv/",ru:"получать",kz:"алу, қабылдау",ex:"In 1992 phones could receive texts, but they couldn't send them."},
    {en:"character",tr:"/ˈkærəktə/",ru:"символ, знак",kz:"таңба",ex:"160 characters were enough for a message."},
    {en:"rule",tr:"/ruːl/",ru:"правило",kz:"ереже",ex:"That rule has stayed for forty years."},
    {en:"digital",tr:"/ˈdɪdʒɪtl/",ru:"цифровой",kz:"цифрлық",ex:"Vodafone sold it as a digital object."}
  ],
  text:[
    "On 3 December 1992, a young engineer in England sat down at a computer and typed two words: “Merry Christmas”. Then he pressed “send”. Neil Papworth was twenty-two. He didn't know that he had just made history.",
    "The message went to a phone. Richard Jarvis, a director at Vodafone, was at a Christmas party. He read the two words on his big grey phone and smiled. It was the first text message in the world. Papworth didn't get an answer: in 1992 phones could receive texts, but they couldn't send them. People had to write messages on a computer.",
    "Why are text messages so short? In 1985, a German engineer, Friedhelm Hillebrand, decided that 160 characters were enough for a message. He typed many sentences on a typewriter and counted. Most of them were shorter than 160 characters. That rule has stayed for forty years.",
    "Today people send billions of messages a day, but most of them go through apps, not SMS. And that first “Merry Christmas”? In 2021, Vodafone sold it as a digital object for more than one hundred thousand euros. Not bad for two words."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"What were the first two words in a text message?",o:["Hello world","Merry Christmas","Call me"],a:1,
       e:{en:"“Merry Christmas” — sent on 3 December 1992.",ru:"«Merry Christmas» — отправлено 3 декабря 1992 года.",kz:"«Merry Christmas» — 1992 жылғы 3 желтоқсанда жіберілді."}}
    ]},
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"Richard Jarvis was at a party.",a:"T",e:{en:"“…was at a Christmas party.”",ru:"«…was at a Christmas party.»",kz:"«…was at a Christmas party.»"}},
      {s:"Neil Papworth sent the message from a phone.",a:"F",e:{en:"“…sat down at a computer and typed two words.”",ru:"«…sat down at a computer» — с компьютера.",kz:"«…sat down at a computer» — компьютерден."}},
      {s:"Papworth later worked for Vodafone.",a:"NG",e:{en:"The text says nothing about Papworth's later job.",ru:"О дальнейшей работе Папворта в тексте ничего нет.",kz:"Мәтінде Папворттың кейінгі жұмысы туралы ештеңе жоқ."}},
      {s:"Hillebrand used a typewriter to test his idea.",a:"T",e:{en:"“He typed many sentences on a typewriter and counted.”",ru:"«He typed many sentences on a typewriter…»",kz:"«He typed many sentences on a typewriter…»"}},
      {s:"In 1992, phones could send text messages.",a:"F",e:{en:"“…phones could receive texts, but they couldn't send them.”",ru:"«…they couldn't send them.» — не могли отправлять.",kz:"«…they couldn't send them.» — жібере алмады."}},
      {s:"The first message was sold for more than one hundred thousand euros.",a:"T",e:{en:"“…for more than one hundred thousand euros.”",ru:"«…for more than one hundred thousand euros.»",kz:"«…for more than one hundred thousand euros.»"}}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“receive” means…",o:["get","send","write"],a:0,e:{en:"Receive = get something that somebody sends you.",ru:"Receive — получать.",kz:"Receive — алу, қабылдау."}},
      {q:"“character” in this text means…",o:["a person in a film","a letter, number or sign","a phone"],a:1,e:{en:"160 characters = 160 letters, numbers, spaces and signs.",ru:"Character здесь — символ (буква, цифра, знак).",kz:"Character мұнда — таңба (әріп, сан, белгі)."}},
      {q:"An “engineer” is…",o:["a person who designs and builds machines","a person who sells phones","a person who sings"],a:0,e:{en:"Engineers design and build machines and systems.",ru:"Engineer — инженер.",kz:"Engineer — инженер."}},
      {q:"A “digital object” is…",o:["a thing made of paper","a very old thing","a thing that exists on a computer"],a:2,e:{en:"Digital = on a computer, not on paper.",ru:"Digital — цифровой, существующий на компьютере.",kz:"Digital — цифрлық, компьютерде бар."}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"Neil Papworth typed the message on a {computer}. Richard Jarvis read it at a Christmas {party}. In 1992 phones could {receive} texts but couldn't send them. A message can have 160 {characters}. Today most messages go through {apps}. In 2021 Vodafone {sold} the first message.",
     extra:["bought","phone"]},
    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[
      {l:{en:"Paragraph 1",ru:"Абзац 1",kz:"1-абзац"},r:"Two words that made history"},
      {l:{en:"Paragraph 2",ru:"Абзац 2",kz:"2-абзац"},r:"A message with no answer"},
      {l:{en:"Paragraph 3",ru:"Абзац 3",kz:"3-абзац"},r:"Why 160?"},
      {l:{en:"Paragraph 4",ru:"Абзац 4",kz:"4-абзац"},r:"Billions of messages and one expensive “Merry Christmas”"}

    {type:"reflection",instruction:INS.reflection,q:"How many messages do you send a day? Do you prefer texts, voice messages or calls? Write 2–3 sentences.",

{ id:"a2-nat-godwit", level:"A2", genre:"nature", title:"Eleven Days Without a Stop", cover:{emoji:"🐦‍⬛"},
  task:{en:"Read and find out: how does the bird's body change before the flight?",ru:"Прочитайте и узнайте: как меняется тело птицы перед полётом?",kz:"Оқып, біліңіз: ұшар алдында құстың денесі қалай өзгереді?"},
  words:[
    {en:"journey",tr:"/ˈdʒɜːni/",ru:"путешествие, путь",kz:"сапар, жол",ex:"Imagine a journey of 13,560 kilometres."},
    {en:"tag",tr:"/tæɡ/",ru:"метка, датчик",kz:"белгі, датчик",ex:"Scientists put a tiny tag on its back in Alaska."},
    {en:"satellite",tr:"/ˈsætəlaɪt/",ru:"спутник",kz:"жерсерік, спутник",ex:"The tag sent signals to a satellite."},
    {en:"record",tr:"/ˈrekɔːd/",ru:"рекорд",kz:"рекорд",ex:"That was a new world record for a bird flight without a stop."},
    {en:"fuel",tr:"/ˈfjuːəl/",ru:"топливо",kz:"отын",ex:"Fat is their fuel."},
    {en:"stomach",tr:"/ˈstʌmək/",ru:"желудок",kz:"асқазан",ex:"The stomach becomes smaller."},
    {en:"muscle",tr:"/ˈmʌsl/",ru:"мышца",kz:"бұлшықет",ex:"The heart and the flight muscles become bigger."},
    {en:"weight",tr:"/weɪt/",ru:"вес",kz:"салмақ",ex:"The bird loses about half of its weight."}
  ],
  text:[
    "Imagine a journey of 13,560 kilometres. Now imagine it without food, without water and without a single stop. A small bird did exactly that, and it was only five months old.",
    "The bird was a bar-tailed godwit. In October 2022, scientists put a tiny tag on its back in Alaska. The tag sent signals to a satellite, so the scientists could follow the bird on their computers. On 13 October the young godwit left Alaska and flew south over the Pacific Ocean.",
    "It didn't land on any island. It didn't eat any fish. It flew day and night for eleven days. On 24 October it landed in Tasmania, Australia. That was a new world record for a bird flight without a stop.",
    "How is this possible? Before the journey, godwits eat and eat. Fat is their fuel. Then their bodies change: the stomach becomes smaller, and the heart and the flight muscles become bigger. During the flight the bird loses about half of its weight. Scientists still don't know if godwits sleep in the air. And the young bird found the way alone — its parents didn't show it."
  ],
  exercises:[

      {q:"How did scientists follow the bird?",o:["with a tag and a satellite","with a small plane","with binoculars from a ship"],a:0,e:{en:"“The tag sent signals to a satellite…”",ru:"«The tag sent signals to a satellite…»",kz:"«The tag sent signals to a satellite…»"}},
      {q:"Where did the bird land?",o:["in Alaska","in New Zealand","in Tasmania"],a:2,e:{en:"“On 24 October it landed in Tasmania, Australia.”",ru:"«…it landed in Tasmania, Australia.»",kz:"«…it landed in Tasmania, Australia.»"}},
      {q:"What is the bird's fuel?",o:["fish","fat","water"],a:1,e:{en:"“Fat is their fuel.”",ru:"«Fat is their fuel.» — жир.",kz:"«Fat is their fuel.» — май."}}
    ]},
    {type:"match",instruction:INS.matchD,explanation:EXPL.match,pairs:[
      {l:"journey",r:{en:"a long trip",ru:"путешествие",kz:"сапар"}},{l:"tag",r:{en:"a small device that sends signals",ru:"метка, датчик",kz:"белгі, датчик"}},
      {l:"fuel",r:{en:"something that gives energy",ru:"топливо",kz:"отын"}},{l:"stomach",r:{en:"the part of the body where food goes",ru:"желудок",kz:"асқазан"}},
      {l:"record",r:{en:"the best result ever",ru:"рекорд",kz:"рекорд"}},{l:"weight",r:{en:"how heavy something is",ru:"вес",kz:"салмақ"}}
    ]},

    {type:"finish",instruction:INS.finish,items:[

      {s:"Before the journey, godwits",o:["eat and eat","sleep a lot","swim"],a:0,e:{en:"“Before the journey, godwits eat and eat.”",ru:"«…godwits eat and eat.»",kz:"«…godwits eat and eat.»"}},
      {s:"During the flight the bird loses",o:["its tag","about half of its weight","its feathers"],a:1,e:{en:"“…the bird loses about half of its weight.”",ru:"«…about half of its weight.» — половину веса.",kz:"«…about half of its weight.» — салмағының жартысын."}},
      {s:"The young bird found the way",o:["with its parents","with a map","alone"],a:2,e:{en:"“…the young bird found the way alone.”",ru:"«…found the way alone.» — сама.",kz:"«…found the way alone.» — өзі."}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"The tag sent signals to a satellite.",a:true,e:{en:"“The tag sent signals to a satellite.”",ru:"«The tag sent signals to a satellite.»",kz:"«The tag sent signals to a satellite.»"}},

      {s:"Godwits become very thin before the journey.",a:false,e:{en:"They eat and eat — they become fat.",ru:"Они едят и едят — становятся толстыми.",kz:"Олар жеп-жеп, семіреді."}},

{ id:"a2-peo-forest", level:"A2", genre:"people", title:"The Man Who Planted a Forest", cover:{emoji:"🌳"},
  task:{en:"Read and find out: what did Jadav need — help or something else?",ru:"Прочитайте и узнайте: что было нужно Джадаву — помощь или что-то другое?",kz:"Оқып, біліңіз: Джадавқа не керек болды — көмек пе, әлде басқа нәрсе ме?"},
  words:[
    {en:"flood",tr:"/flʌd/",ru:"наводнение",kz:"су тасқыны",ex:"After a big flood, hundreds of snakes lay dead on the hot sand."},
    {en:"shade",tr:"/ʃeɪd/",ru:"тень",kz:"көлеңке",ex:"There were no trees and no shade."},
    {en:"plant",tr:"/plɑːnt/",ru:"сажать",kz:"отырғызу",ex:"He planted them in the sand."},
    {en:"soil",tr:"/sɔɪl/",ru:"почва",kz:"топырақ",ex:"He brought ants to make the soil better."},
    {en:"forest",tr:"/ˈfɒrɪst/",ru:"лес",kz:"орман",ex:"Today, the sand is a forest."},
    {en:"award",tr:"/əˈwɔːd/",ru:"награда",kz:"марапат",ex:"In 2015 he received one of the highest awards in the country."},
    {en:"enough",tr:"/ɪˈnʌf/",ru:"достаточно",kz:"жеткілікті",ex:"He says he has enough time."}
  ],
  text:[
    "In 1979, a boy of sixteen walked along a river in India and saw something terrible. After a big flood, hundreds of snakes lay dead on the hot sand — there were no trees and no shade. Jadav Payeng cried. Then he made a plan.",
    "He came back with twenty small bamboo plants. He planted them in the sand. The next day he planted more. And the next. He carried water in pots. He brought ants to make the soil better. He did this every day — for forty years.",
    "Today, the sand is a forest. It is bigger than Central Park in New York. Elephants, deer, rhinos and even tigers live there. Birds come from far away. Jadav still lives in a small house near the forest, and he still plants trees every morning.",
    "People call him “the Forest Man of India”. In 2015 he received one of the highest awards in the country. “I didn't need help,” he says. “I needed time.” He is more than sixty, but he has a new dream: he is going to plant another forest. He says he has enough time."
  ],

    ]},
    {type:"tf",instruction:INS.tf,items:[

      {s:"Jadav planted the first plants with a big team.",a:false,e:{en:"“I didn't need help,” he says — he did it alone.",ru:"«I didn't need help» — он делал это один.",kz:"«I didn't need help» — ол мұны жалғыз істеді."}},
      {s:"Tigers live in the forest today.",a:true,e:{en:"“Elephants, deer, rhinos and even tigers live there.”",ru:"«…and even tigers live there.»",kz:"«…and even tigers live there.»"}},
      {s:"Jadav has stopped planting trees.",a:false,e:{en:"“…he still plants trees every morning.”",ru:"«…he still plants trees every morning.»",kz:"«…he still plants trees every morning.»"}}

{ id:"a2-cul-nauryz", level:"A2", genre:"culture", title:"Nauryz: When the Steppe Wakes Up", cover:{emoji:"🌱"},
  task:{en:"Read and find out: what should you do before Nauryz?",ru:"Прочитайте и узнайте: что нужно сделать перед Наурызом?",kz:"Оқып, біліңіз: Наурыз алдында не істеу керек?"},
  words:[
    {en:"length",tr:"/leŋθ/",ru:"длина, продолжительность",kz:"ұзындық",ex:"The day and the night become the same length."},
    {en:"celebrate",tr:"/ˈselɪbreɪt/",ru:"праздновать",kz:"тойлау",ex:"Today more than three hundred million people celebrate it."},
    {en:"debt",tr:"/det/",ru:"долг",kz:"қарыз",ex:"Families clean their homes and pay their debts."},
    {en:"relative",tr:"/ˈrelətɪv/",ru:"родственник",kz:"туыс",ex:"People put on traditional clothes and visit older relatives."},
    {en:"square",tr:"/skweə/",ru:"площадь",kz:"алаң",ex:"In the cities, yurts appear in the squares."},
    {en:"ingredient",tr:"/ɪnˈɡriːdiənt/",ru:"ингредиент",kz:"құрам, ингредиент",ex:"Nauryz kozhe is a soup with seven ingredients."},
    {en:"official",tr:"/əˈfɪʃl/",ru:"официальный",kz:"ресми",ex:"Nauryz was not an official holiday for many years."},
    {en:"heritage",tr:"/ˈherɪtɪdʒ/",ru:"наследие",kz:"мұра",ex:"Nauryz has been on the UNESCO list of world heritage."}
  ],
  text:[
    "In March, the day and the night become the same length. For people in Kazakhstan, 22 March is the beginning of the new year: Nauryz, “new day”. The holiday is more than two thousand years old.",
    "Before Nauryz, families clean their homes and pay their debts. You should start the year with a clean house and a clean heart. On the holiday, people put on traditional clothes and visit older relatives. In the cities, yurts appear in the squares, and you can hear the dombra everywhere.",
    "The most important food is Nauryz kozhe, a soup with seven ingredients: water, meat, salt, milk, grain and more. Seven is a lucky number, so you must try seven bowls in seven houses — at least, that is what people say! In the west of Kazakhstan, the holiday starts on 14 March. This day is called Korisu, “the meeting day”.",
    "In Soviet times, Nauryz was not an official holiday for many years. It came back in 1988. Since 2016, Nauryz in Kazakhstan has been on the UNESCO list of world heritage. Today more than three hundred million people celebrate it. Will you try seven bowls this year?"
  ],
  exercises:[
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"Nauryz means “new day”.",a:"T",e:{en:"“…Nauryz, ‘new day’.”",ru:"«…Nauryz, ‘new day’.»",kz:"«…Nauryz, ‘new day’.»"}},
      {s:"Nauryz kozhe is usually eaten with bread.",a:"NG",e:{en:"The text does not say what people eat with kozhe.",ru:"В тексте не сказано, с чем едят коже.",kz:"Мәтінде көжені немен жейтіні айтылмаған."}},
      {s:"The holiday is about two hundred years old.",a:"F",e:{en:"“The holiday is more than two thousand years old.”",ru:"«…more than two thousand years old.» — больше двух тысяч лет.",kz:"«…more than two thousand years old.» — екі мың жылдан астам."}},
      {s:"Nauryz kozhe has seven ingredients.",a:"T",e:{en:"“…a soup with seven ingredients.”",ru:"«…a soup with seven ingredients.»",kz:"«…a soup with seven ingredients.»"}},
      {s:"In Soviet times, people secretly celebrated Nauryz at home.",a:"NG",e:{en:"The text only says it was not an official holiday.",ru:"В тексте сказано лишь, что праздник не был официальным.",kz:"Мәтінде тек ресми мереке болмағаны айтылған."}},
      {s:"Korisu is celebrated in the north of Kazakhstan.",a:"F",e:{en:"“In the west of Kazakhstan, the holiday starts on 14 March.”",ru:"«In the west of Kazakhstan…» — на западе.",kz:"«In the west of Kazakhstan…» — батысында."}},
      {s:"Nauryz came back as a holiday in 1988.",a:"T",e:{en:"“It came back in 1988.”",ru:"«It came back in 1988.»",kz:"«It came back in 1988.»"}}
    ]},
    {type:"mc",instruction:INS.mc,items:[
      {q:"What should you do before Nauryz?",o:["buy new shoes","clean your home and pay your debts","sleep all day"],a:1,e:{en:"“Before Nauryz, families clean their homes and pay their debts.”",ru:"«…clean their homes and pay their debts.»",kz:"«…clean their homes and pay their debts.»"}},
      {q:"What appears in city squares?",o:["yurts","cars","ships"],a:0,e:{en:"“In the cities, yurts appear in the squares…”",ru:"«…yurts appear in the squares…»",kz:"«…yurts appear in the squares…»"}},
      {q:"Which is NOT in the text as an ingredient of kozhe?",o:["milk","meat","apples"],a:2,e:{en:"The text names water, meat, salt, milk and grain.",ru:"В тексте: вода, мясо, соль, молоко, зерно.",kz:"Мәтінде: су, ет, тұз, сүт, дән."}},
      {q:"How many people celebrate Nauryz today?",o:["three million","thirty million","more than three hundred million"],a:2,e:{en:"“Today more than three hundred million people celebrate it.”",ru:"«…more than three hundred million people…»",kz:"«…more than three hundred million people…»"}}
    ]},
    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[
      {l:{en:"Paragraph 1",ru:"Абзац 1",kz:"1-абзац"},r:"A new day and a new year"},
      {l:{en:"Paragraph 2",ru:"Абзац 2",kz:"2-абзац"},r:"Clean house, clean heart"},
      {l:{en:"Paragraph 3",ru:"Абзац 3",kz:"3-абзац"},r:"Seven bowls and a meeting day"},
      {l:{en:"Paragraph 4",ru:"Абзац 4",kz:"4-абзац"},r:"From forgotten holiday to world heritage"}
    ]},
    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[
      "Nauryz is the Kazakh new year, celebrated on 22 March.","Before the holiday, people clean their homes and pay their debts.","On the day, they visit relatives and eat Nauryz kozhe, a soup with seven ingredients.","In the west of Kazakhstan the holiday starts on 14 March, Korisu.","Today Nauryz is on the UNESCO list and hundreds of millions of people celebrate it."
    ]},
    {type:"match",instruction:INS.matchD,explanation:EXPL.match,pairs:[
      {l:"celebrate",r:{en:"have a party for a special day",ru:"праздновать",kz:"тойлау"}},{l:"debt",r:{en:"money that you must give back",ru:"долг",kz:"қарыз"}},
      {l:"relative",r:{en:"a person in your family",ru:"родственник",kz:"туыс"}},{l:"square",r:{en:"an open place in a city",ru:"площадь",kz:"алаң"}},
      {l:"ingredient",r:{en:"one of the foods in a dish",ru:"ингредиент",kz:"ингредиент"}},{l:"heritage",r:{en:"important things from the past",ru:"наследие",kz:"мұра"}}
    ]},
    {type:"reflection",instruction:INS.reflection,q:"How does your family celebrate Nauryz or another holiday? Write 2–3 sentences.",
     keys:[["celebrate","holiday","nauryz"],["family","relatives","grandmother","grandfather","parents","friends"],["eat","cook","food","kozhe","visit","music"]],min:2,
     model:"My family celebrates Nauryz at my grandmother's house. We cook kozhe and baursaks, and all our relatives come to visit. In the evening we go to the square to listen to music."}
  ]},

{ id:"a2-sci-bluecrab", level:"A2", genre:"science", title:"The Animal With Blue Blood", cover:{emoji:"🦀"},
  task:{en:"Read and find out: why do companies need this blue blood?",ru:"Прочитайте и узнайте: зачем компаниям эта голубая кровь?",kz:"Оқып, біліңіз: компанияларға бұл көк қан не үшін керек?"},
  words:[
    {en:"blood",tr:"/blʌd/",ru:"кровь",kz:"қан",ex:"The blood is blue. And it has probably saved your life."},
    {en:"helmet",tr:"/ˈhelmɪt/",ru:"шлем",kz:"дулыға",ex:"It looks like a small brown helmet with a long tail."},
    {en:"copper",tr:"/ˈkɒpə/",ru:"медь",kz:"мыс",ex:"Their blood is blue because it has copper in it."},
    {en:"discover",tr:"/dɪˈskʌvə/",ru:"открывать, обнаруживать",kz:"ашу, табу",ex:"In the 1950s scientists discovered something amazing."},
    {en:"vaccine",tr:"/ˈvæksiːn/",ru:"вакцина",kz:"вакцина",ex:"Every new medicine and every vaccine must pass this blood test."},
    {en:"laboratory",tr:"/ləˈbɒrətri/",ru:"лаборатория",kz:"зертхана",ex:"Laboratories are going to change to the new test."},
    {en:"artificial",tr:"/ˌɑːtɪˈfɪʃl/",ru:"искусственный",kz:"жасанды",ex:"Scientists have made an artificial test."}
  ],
  text:[
    "Every year, people take about half a million animals out of the sea, take some of their blood, and put them back. The blood is blue. And it has probably saved your life.",
    "The animal is the horseshoe crab. It looks like a small brown helmet with a long tail. It is not really a crab — it is closer to spiders. Horseshoe crabs have lived on Earth for 450 million years. They are older than the dinosaurs, and they have not changed much.",
    "Their blood is blue because it has copper in it, not iron like ours. In the 1950s scientists discovered something amazing: when the blood meets dangerous bacteria, it becomes thick like jelly. Today every new medicine and every vaccine must pass this blood test. If the blood stays liquid, the medicine is clean.",
    "Companies pay more than ten thousand dollars for a litre of blue blood. Most crabs go back to the sea alive, but some die. So scientists have made an artificial test, and laboratories are going to change to it. The crabs have helped us for seventy years. Now it is our turn to help them."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"An animal with blue blood has probably saved your life. How?",o:["Doctors use its blood to test medicines.","People drink its blood.","It eats dangerous fish."],a:0,
       e:{en:"Its blood shows if a medicine has dangerous bacteria in it.",ru:"Его кровь показывает, есть ли в лекарстве опасные бактерии.",kz:"Оның қаны дәрідегі қауіпті бактерияларды көрсетеді."}}
    ]},
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"Horseshoe crabs are older than the dinosaurs.",a:"T",e:{en:"“They are older than the dinosaurs…”",ru:"«They are older than the dinosaurs…»",kz:"«They are older than the dinosaurs…»"}},
      {s:"Horseshoe crabs live in the Caspian Sea.",a:"NG",e:{en:"The text does not say where they live.",ru:"В тексте не сказано, где они живут.",kz:"Мәтінде олардың қайда өмір сүретіні айтылмаған."}},
      {s:"The horseshoe crab is a real crab.",a:"F",e:{en:"“It is not really a crab — it is closer to spiders.”",ru:"«It is not really a crab…» — ближе к паукам.",kz:"«It is not really a crab…» — өрмекшілерге жақын."}},
      {s:"The blood is blue because of copper.",a:"T",e:{en:"“Their blood is blue because it has copper in it.”",ru:"«…because it has copper in it.»",kz:"«…because it has copper in it.»"}},
      {s:"All the crabs die after people take their blood.",a:"F",e:{en:"“Most crabs go back to the sea alive, but some die.”",ru:"«Most crabs go back to the sea alive…» — большинство выживает.",kz:"«Most crabs go back to the sea alive…» — көбі тірі қалады."}},
      {s:"Every vaccine must pass the blood test.",a:"T",e:{en:"“…every new medicine and every vaccine must pass this blood test.”",ru:"«…every vaccine must pass this blood test.»",kz:"«…every vaccine must pass this blood test.»"}},
      {s:"The artificial test costs less than the crab blood.",a:"NG",e:{en:"The text says nothing about the price of the new test.",ru:"О цене нового теста в тексте ничего нет.",kz:"Мәтінде жаңа тесттің бағасы туралы ештеңе жоқ."}}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“discovered” means…",o:["found out something new","forgot","sold"],a:0,e:{en:"Discover = find something that nobody knew before.",ru:"Discover — открыть, обнаружить.",kz:"Discover — ашу, табу."}},
      {q:"“thick like jelly” means…",o:["very hot","not liquid, soft and heavy","very blue"],a:1,e:{en:"The blood stops being liquid — it becomes like jelly.",ru:"Кровь перестаёт быть жидкой — становится как желе.",kz:"Қан сұйық болмай, желеге айналады."}},
      {q:"“artificial” means…",o:["natural","very expensive","made by people, not by nature"],a:2,e:{en:"Artificial = made by people, not natural.",ru:"Artificial — искусственный.",kz:"Artificial — жасанды."}},
      {q:"A “laboratory” is…",o:["a place where scientists work","a kind of crab","a hospital bed"],a:0,e:{en:"Scientists test things in a laboratory.",ru:"Laboratory — лаборатория.",kz:"Laboratory — зертхана."}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"The horseshoe crab looks like a small brown {helmet}. Its blood is blue because of {copper}. When the blood meets {bacteria}, it becomes thick. Every new {medicine} must pass the blood test. Companies pay more than ten thousand {dollars} a litre. Scientists have made an {artificial} test.",
     extra:["iron","natural"]},
    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[
      {l:{en:"Paragraph 1",ru:"Абзац 1",kz:"1-абзац"},r:"Half a million animals a year"},
      {l:{en:"Paragraph 2",ru:"Абзац 2",kz:"2-абзац"},r:"Older than the dinosaurs"},
      {l:{en:"Paragraph 3",ru:"Абзац 3",kz:"3-абзац"},r:"A test that saves lives"},
      {l:{en:"Paragraph 4",ru:"Абзац 4",kz:"4-абзац"},r:"Time to help the crabs"}
    ]},
    {type:"reflection",instruction:INS.reflection,q:"Do you think it is right to use animals to test medicines? Why? Write 2–3 sentences.",

{ id:"a2-adv-kolsai", level:"A2", genre:"adventure", title:"The Wrong Path to Kolsai", cover:{emoji:"🏔️"},
  task:{en:"Read and find out: what rule helped Aigerim and Daniyar?",ru:"Прочитайте и узнайте: какое правило помогло Айгерим и Данияру?",kz:"Оқып, біліңіз: Айгерім мен Даниярға қандай ереже көмектесті?"},
  words:[
    {en:"narrow",tr:"/ˈnærəʊ/",ru:"узкий",kz:"тар",ex:"Then the path became narrower and steeper."},
    {en:"steep",tr:"/stiːp/",ru:"крутой",kz:"тік",ex:"Then the path became narrower and steeper."},
    {en:"disappear",tr:"/ˌdɪsəˈpɪə/",ru:"исчезать",kz:"жоғалып кету",ex:"After another hour the path disappeared."},
    {en:"signal",tr:"/ˈsɪɡnəl/",ru:"сигнал, связь",kz:"сигнал, байланыс",ex:"The phone had no signal."},
    {en:"battery",tr:"/ˈbætri/",ru:"батарея, заряд",kz:"батарея, заряд",ex:"…and five per cent of battery."},
    {en:"guide",tr:"/ɡaɪd/",ru:"гид, проводник",kz:"жол бастаушы",ex:"Aigerim remembered a rule from her uncle, a mountain guide."},
    {en:"safe",tr:"/seɪf/",ru:"в безопасности",kz:"аман, қауіпсіз",ex:"They were wet and hungry, but safe."}
  ],
  text:[
    "“It's only three hours,” said Daniyar. “We'll be at the second lake before lunch.” Aigerim wasn't sure: the sky was grey and the path was wet. But they had a map on the phone, so they went.",
    "The first hour was easy. Then the path became narrower and steeper. At a small river they saw two paths, and the phone showed the left one. After another hour the path disappeared. There were only trees, rocks and clouds. The phone had no signal — and five per cent of battery.",
    "“We must go back,” said Aigerim. Then it started to rain. Aigerim remembered a rule from her uncle, a mountain guide: if you are lost, don't go higher — go down to the water and follow it. They found the river again and walked down beside it. It was slow and cold, but the river knew the way.",
    "Three hours later they saw a road and a man with a horse. It was a ranger. “The second lake?” he laughed. “It's on the other side of the mountain!” They were wet and hungry, but safe. The next morning they took the right path. The lake was more beautiful than the photos."
  ],
  exercises:[
    {type:"mc",instruction:INS.mc,items:[
      {q:"How long did Daniyar think the walk would take?",o:["three hours","three days","thirty minutes"],a:0,e:{en:"“It's only three hours,” said Daniyar.",ru:"«It's only three hours.»",kz:"«It's only three hours.»"}},
      {q:"Why did they go the wrong way?",o:["Aigerim chose the path.","The phone showed the wrong path.","A ranger sent them there."],a:1,e:{en:"“…they saw two paths, and the phone showed the left one.”",ru:"«…the phone showed the left one.» — телефон показал не ту тропу.",kz:"«…the phone showed the left one.» — телефон қате жолды көрсетті."}},
      {q:"What was Aigerim's uncle's rule?",o:["Go higher to see better.","Call for help.","Go down to the water and follow it."],a:2,e:{en:"“…don't go higher — go down to the water and follow it.”",ru:"«…go down to the water and follow it.»",kz:"«…go down to the water and follow it.»"}},
      {q:"Who did they meet at the road?",o:["Aigerim's uncle","a ranger with a horse","other tourists"],a:1,e:{en:"“…a man with a horse. It was a ranger.”",ru:"«…a man with a horse. It was a ranger.»",kz:"«…a man with a horse. It was a ranger.»"}}
    ]},
    {type:"match",instruction:INS.matchD,explanation:EXPL.match,pairs:[
      {l:"narrow",r:{en:"not wide",ru:"узкий",kz:"тар"}},{l:"steep",r:{en:"going up very quickly, hard to climb",ru:"крутой",kz:"тік"}},
      {l:"disappear",r:{en:"go away so you can't see it",ru:"исчезать",kz:"жоғалып кету"}},{l:"signal",r:{en:"connection for a phone",ru:"сигнал, связь",kz:"байланыс"}},
      {l:"guide",r:{en:"a person who shows the way",ru:"гид, проводник",kz:"жол бастаушы"}},{l:"safe",r:{en:"not in danger",ru:"в безопасности",kz:"аман"}}
    ]},
    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "Daniyar and Aigerim start walking to the second lake.","At a small river the phone shows the left path.","The path disappears and the phone has no signal.","It starts to rain and Aigerim remembers her uncle's rule.","They follow the river down and meet a ranger.","The next morning they take the right path to the lake."
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"The sky was grey and the path was",o:["dry","wet","wide"],a:1,e:{en:"“…the sky was grey and the path was wet.”",ru:"«…the path was wet.»",kz:"«…the path was wet.»"}},
      {s:"The phone had only",o:["five per cent of battery","fifty per cent of battery","one map"],a:0,e:{en:"“…and five per cent of battery.”",ru:"«…five per cent of battery.»",kz:"«…five per cent of battery.»"}},
      {s:"The ranger said the lake was",o:["very close","under the water","on the other side of the mountain"],a:2,e:{en:"“It's on the other side of the mountain!”",ru:"«It's on the other side of the mountain!»",kz:"«It's on the other side of the mountain!»"}},
      {s:"The lake was more beautiful than",o:["the river","the photos","the road"],a:1,e:{en:"“The lake was more beautiful than the photos.”",ru:"«…more beautiful than the photos.»",kz:"«…more beautiful than the photos.»"}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"They were at the lake before lunch.",a:false,e:{en:"They got lost and found the lake only the next morning.",ru:"Они заблудились и нашли озеро только на следующее утро.",kz:"Олар адасып, көлді келесі күні таңертең ғана тапты."}},
      {s:"The path became narrower and steeper.",a:true,e:{en:"“Then the path became narrower and steeper.”",ru:"«…narrower and steeper.»",kz:"«…narrower and steeper.»"}},
      {s:"Aigerim wanted to go back.",a:true,e:{en:"“We must go back,” said Aigerim.",ru:"«We must go back.»",kz:"«We must go back.»"}},
      {s:"They followed the river up the mountain.",a:false,e:{en:"“…walked down beside it.” — down, not up.",ru:"«…walked down beside it.» — вниз, а не вверх.",kz:"«…walked down beside it.» — жоғары емес, төмен."}},
      {s:"They never found the lake.",a:false,e:{en:"“The next morning they took the right path. The lake was more beautiful than the photos.”",ru:"На следующее утро они нашли озеро.",kz:"Келесі күні таңертең олар көлді тапты."}}
    ]},
    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[
      "Two friends walked to the second Kolsai lake with a map on a phone.","The phone showed the wrong path and then lost its signal.","Aigerim remembered a rule: go down to the water and follow it.","They followed the river and met a ranger at the road.","The next day they found the lake on the right path."
    ]}
  ]},

/* ───────── 11 · MYSTERY ───────── */
{ id:"a2-mys-voynich", level:"A2", genre:"mystery", title:"The Book Nobody Can Read", cover:{emoji:"📜"},
  task:{en:"Read and find out: what do people think the book is?",ru:"Прочитайте и узнайте: что, по мнению людей, представляет собой эта книга?",kz:"Оқып, біліңіз: адамдар бұл кітапты не деп ойлайды?"},
  words:[
    {en:"code-breaker",tr:"/ˈkəʊd breɪkə/",ru:"дешифровщик",kz:"шифр ашушы",ex:"…not the best code-breakers in the world."},
    {en:"skin",tr:"/skɪn/",ru:"кожа",kz:"тері",ex:"The book has about 240 pages of animal skin."},
    {en:"alphabet",tr:"/ˈælfəbet/",ru:"алфавит",kz:"әліпби",ex:"They do not belong to any alphabet on Earth."},
    {en:"exist",tr:"/ɪɡˈzɪst/",ru:"существовать",kz:"бар болу, өмір сүру",ex:"…strange plants that don't exist."},
    {en:"manuscript",tr:"/ˈmænjuskrɪpt/",ru:"рукопись",kz:"қолжазба",ex:"People call it “the Voynich manuscript”."},
    {en:"fake",tr:"/feɪk/",ru:"поддельный, подделка",kz:"жалған",ex:"Some say it is a joke — a fake book from six hundred years ago."},
    {en:"fail",tr:"/feɪl/",ru:"терпеть неудачу",kz:"сәтсіздікке ұшырау",ex:"Everyone else has failed."}
  ],
  text:[
    "In a library at Yale University in the USA, there is a book that nobody can read. Not students, not professors, not the best code-breakers in the world. People have tried for more than a hundred years.",
    "The book has about 240 pages of animal skin from the years between 1404 and 1438. The pages are full of small, neat letters, but they do not belong to any alphabet on Earth. There are pictures too: strange plants that don't exist, stars, and women in green water.",
    "A book dealer, Wilfrid Voynich, bought it in Italy in 1912. That is why people call it “the Voynich manuscript”. During the Second World War, the best code-breakers in America studied it. They broke many secret codes, but not this one. Computers have tried too. Nothing works.",
    "So what is it? Some people think it is a secret language. Others think a doctor wrote it for himself. And some say it is a joke — a fake book from six hundred years ago. Which is it? You can look at every page online. Maybe you should try. Everyone else has failed."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"A book that nobody can read has been in a library for years. What is it?",o:["a children's book in Chinese","a book in an unknown alphabet","a book with empty pages"],a:1,
       e:{en:"The letters do not belong to any alphabet on Earth.",ru:"Буквы не принадлежат ни одному алфавиту на Земле.",kz:"Әріптер жер бетіндегі ешбір әліпбиге жатпайды."}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"The book is in a library in England.",a:false,e:{en:"“…at Yale University in the USA.”",ru:"«…at Yale University in the USA.» — в США.",kz:"«…at Yale University in the USA.» — АҚШ-та."}},
      {s:"The pages come from the fifteenth century.",a:true,e:{en:"“…from the years between 1404 and 1438.”",ru:"«…between 1404 and 1438.» — XV век.",kz:"«…between 1404 and 1438.» — XV ғасыр."}},
      {s:"The plants in the pictures are real plants.",a:false,e:{en:"“…strange plants that don't exist.”",ru:"«…plants that don't exist.» — их не существует.",kz:"«…plants that don't exist.» — олар жоқ."}},
      {s:"Wilfrid Voynich wrote the book.",a:false,e:{en:"He bought it in 1912. Nobody knows who wrote it.",ru:"Он купил её в 1912 году. Кто написал — неизвестно.",kz:"Ол оны 1912 жылы сатып алды. Кім жазғаны белгісіз."}},
      {s:"You can see the pages online.",a:true,e:{en:"“You can look at every page online.”",ru:"«You can look at every page online.»",kz:"«You can look at every page online.»"}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"The book is in a {library} at Yale University. The pages are made of animal {skin}. The letters do not belong to any {alphabet}. The pictures show plants that don't {exist}. Wilfrid Voynich {bought} the book in 1912. Some people say it is a {fake}.",
     extra:["sold","paper"]},
    {type:"wwmatch",instruction:INS.ww,explanation:EXPL.ww,pairs:[
      {l:"Where is the book today?",r:"at Yale University in the USA"},{l:"Who bought the book in 1912?",r:"Wilfrid Voynich"},{l:"What is in the pictures?",r:"strange plants, stars and women in water"},
      {l:"Who studied the book during the war?",r:"American code-breakers"},{l:"What can you do online?",r:"look at every page"}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"A “code-breaker” is…",o:["a person who reads secret writing","a person who breaks books","a computer"],a:0,e:{en:"Code-breakers read secret codes.",ru:"Code-breaker — дешифровщик.",kz:"Code-breaker — шифр ашушы."}},
      {q:"“neat” means…",o:["big and ugly","small and tidy","red"],a:1,e:{en:"Neat letters = tidy, careful letters.",ru:"Neat — аккуратный.",kz:"Neat — ұқыпты."}},
      {q:"“fake” means…",o:["very old","very expensive","not real"],a:2,e:{en:"A fake book only looks real.",ru:"Fake — поддельный.",kz:"Fake — жалған."}},
      {q:"“failed” means…",o:["did not succeed","won","read"],a:0,e:{en:"To fail = to try and not succeed.",ru:"Fail — потерпеть неудачу.",kz:"Fail — сәтсіздікке ұшырау."}}
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"People have tried to read the book for",o:["ten years","more than a hundred years","a thousand years"],a:1,e:{en:"“People have tried for more than a hundred years.”",ru:"«…for more than a hundred years.»",kz:"«…for more than a hundred years.»"}},
      {s:"The book has about",o:["240 pages","24 pages","2,400 pages"],a:0,e:{en:"“The book has about 240 pages…”",ru:"«…about 240 pages…»",kz:"«…about 240 pages…»"}},
      {s:"During the war, the code-breakers",o:["read the book","lost the book","couldn't read the book"],a:2,e:{en:"“They broke many secret codes, but not this one.”",ru:"«…but not this one.» — этот код они не взломали.",kz:"«…but not this one.» — бұл шифрды аша алмады."}},
      {s:"Some people think a doctor wrote it",o:["for himself","for the king","for children"],a:0,e:{en:"“Others think a doctor wrote it for himself.”",ru:"«…a doctor wrote it for himself.»",kz:"«…a doctor wrote it for himself.»"}}
    ]}
  ]},

/* ───────── 12 · HISTORY ───────── */
{ id:"a2-his-pluto", level:"A2", genre:"history", title:"The Girl Who Named a Planet", cover:{emoji:"🔭"},
  task:{en:"Read and find out: how did Venetia's idea get to the USA?",ru:"Прочитайте и узнайте: как идея Венеции попала в США?",kz:"Оқып, біліңіз: Венецияның идеясы АҚШ-қа қалай жетті?"},
  words:[
    {en:"astronomer",tr:"/əˈstrɒnəmə/",ru:"астроном",kz:"астроном",ex:"He told an astronomer at Oxford University."},
    {en:"god",tr:"/ɡɒd/",ru:"бог",kz:"құдай",ex:"Pluto was the god of the dark world under the ground."},
    {en:"telegram",tr:"/ˈtelɪɡræm/",ru:"телеграмма",kz:"жеделхат",ex:"The astronomer sent a telegram to the USA."},
    {en:"officially",tr:"/əˈfɪʃəli/",ru:"официально",kz:"ресми түрде",ex:"On 1 May 1930 the planet officially became Pluto."},
    {en:"prize",tr:"/praɪz/",ru:"приз, награда",kz:"жүлде",ex:"Venetia got five pounds as a prize."},
    {en:"dwarf",tr:"/dwɔːf/",ru:"карликовый",kz:"ергежейлі",ex:"They called it a dwarf planet."},
    {en:"spacecraft",tr:"/ˈspeɪskrɑːft/",ru:"космический корабль",kz:"ғарыш кемесі",ex:"In 2015 a spacecraft flew past Pluto for the first time."}
  ],
  text:[
    "On 14 March 1930, an eleven-year-old girl in Oxford, England, had breakfast with her grandfather. He read the newspaper aloud: “They have found a new planet. It is very far away and very cold. But it has no name yet.”",
    "Venetia Burney loved stories about Greek and Roman gods. She thought for a moment. “Why not call it Pluto?” she said. Pluto was the god of the dark world under the ground. It was a good name for a dark, cold planet.",
    "Her grandfather liked the idea. He told an astronomer at Oxford University, and the astronomer sent a telegram to the USA, to the scientists who found the planet. They had hundreds of ideas, but they chose Venetia's. On 1 May 1930 the planet officially became Pluto. Venetia got five pounds as a prize.",
    "Venetia became a teacher and lived to ninety. In 2006 scientists decided that Pluto was too small for a “real” planet and called it a dwarf planet. “It's still Pluto,” Venetia said. In 2015 a spacecraft flew past Pluto for the first time. On board there was an instrument with her name."
  ],
  exercises:[
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"Venetia's parents didn't like the name.",a:"NG",e:{en:"The text says nothing about her parents.",ru:"О родителях в тексте ничего нет.",kz:"Мәтінде ата-анасы туралы ештеңе жоқ."}},
      {s:"Venetia was eleven years old in 1930.",a:"T",e:{en:"“…an eleven-year-old girl in Oxford…”",ru:"«…an eleven-year-old girl…»",kz:"«…an eleven-year-old girl…»"}},
      {s:"Her grandfather found the planet.",a:"F",e:{en:"Scientists in the USA found it. He only read the newspaper.",ru:"Планету нашли учёные в США. Он лишь читал газету.",kz:"Планетаны АҚШ ғалымдары тапты. Ол тек газет оқыды."}},
      {s:"Venetia loved stories about Greek and Roman gods.",a:"T",e:{en:"“Venetia Burney loved stories about Greek and Roman gods.”",ru:"«…loved stories about Greek and Roman gods.»",kz:"«…loved stories about Greek and Roman gods.»"}},
      {s:"The spacecraft took photos of Pluto.",a:"NG",e:{en:"The text does not mention photos.",ru:"О фотографиях в тексте не сказано.",kz:"Мәтінде фотосуреттер туралы айтылмаған."}},
      {s:"The scientists in the USA had only one idea for the name.",a:"F",e:{en:"“They had hundreds of ideas, but they chose Venetia's.”",ru:"«They had hundreds of ideas…» — сотни идей.",kz:"«They had hundreds of ideas…» — жүздеген идея."}},
      {s:"Venetia became an astronomer.",a:"F",e:{en:"“Venetia became a teacher…”",ru:"«Venetia became a teacher…» — учительницей.",kz:"«Venetia became a teacher…» — мұғалім болды."}}
    ]},
    {type:"mc",instruction:INS.mc,items:[
      {q:"Where did Venetia live?",o:["in Oxford, England","in Arizona, USA","in Athens, Greece"],a:0,e:{en:"“…a girl in Oxford, England…”",ru:"«…in Oxford, England…»",kz:"«…in Oxford, England…»"}},
      {q:"Who was Pluto in the old stories?",o:["the god of the sea","the god of the dark world under the ground","the god of the sun"],a:1,e:{en:"“Pluto was the god of the dark world under the ground.”",ru:"«…the god of the dark world under the ground.»",kz:"«…the god of the dark world under the ground.»"}},
      {q:"How did the idea get to the USA?",o:["by telephone","by letter","by telegram"],a:2,e:{en:"“…the astronomer sent a telegram to the USA…”",ru:"«…sent a telegram to the USA…»",kz:"«…sent a telegram to the USA…»"}},
      {q:"What did scientists decide in 2006?",o:["Pluto is a dwarf planet.","Pluto needs a new name.","Pluto is the biggest planet."],a:0,e:{en:"“…scientists decided that Pluto was too small… and called it a dwarf planet.”",ru:"«…called it a dwarf planet.»",kz:"«…called it a dwarf planet.»"}}
    ]},
    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[

{ id:"a2-tec-cables", level:"A2", genre:"technology", title:"The Internet Under the Sea", cover:{emoji:"🌊"},
  task:{en:"Read and find out: what breaks the cables?",ru:"Прочитайте и узнайте: что повреждает кабели?",kz:"Оқып, біліңіз: кабельдерді не бүлдіреді?"},
  words:[
    {en:"data",tr:"/ˈdeɪtə/",ru:"данные",kz:"деректер",ex:"More than 99 per cent of the data between countries travels through cables."},
    {en:"cable",tr:"/ˈkeɪbl/",ru:"кабель",kz:"кабель",ex:"There are more than five hundred of these cables."},
    {en:"hose",tr:"/həʊz/",ru:"шланг",kz:"шланг",ex:"A cable is not much thicker than a garden hose."},
    {en:"fibre",tr:"/ˈfaɪbə/",ru:"волокно",kz:"талшық",ex:"The data travels as light through thin glass fibres."},
    {en:"anchor",tr:"/ˈæŋkə/",ru:"якорь",kz:"зәкір",ex:"Ships' anchors and fishing nets cause most problems."},
    {en:"net",tr:"/net/",ru:"сеть (рыболовная)",kz:"ау",ex:"Ships' anchors and fishing nets cause most problems."},
    {en:"repair",tr:"/rɪˈpeə/",ru:"чинить, ремонтировать",kz:"жөндеу",ex:"Special ships find the broken cable and repair it."}
  ],
  text:[
    "When you send a photo to a friend in another country, it doesn't fly through the air. It goes down. More than 99 per cent of the data between countries travels through cables at the bottom of the sea.",
    "There are more than five hundred of these cables, about 1.4 million kilometres in total — enough to go around the Earth thirty-five times. In the deep sea a cable is not much thicker than a garden hose. Inside, the data travels as light through thin glass fibres.",
    "The idea is old. In 1858 engineers laid the first cable across the Atlantic Ocean. The Queen of England sent a message to the President of the USA: it was short, but it took sixteen hours to arrive. Three weeks later the cable stopped working. In 1866 a new cable worked for years.",
    "Cables break, of course. Ships' anchors and fishing nets cause most problems, and sometimes a shark bites one. Special ships find the broken cable, lift it from the sea floor and repair it. So when your video call is slow, remember: your words are travelling through the dark water, thousands of metres down."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"How does your photo travel to a friend in another country?",o:["through satellites in space","through cables under the sea","through the air like radio"],a:1,
       e:{en:"More than 99 per cent of international data goes through cables at the bottom of the sea.",ru:"Больше 99% международных данных идёт по кабелям на дне моря.",kz:"Халықаралық деректердің 99%-дан астамы теңіз түбіндегі кабельдер арқылы өтеді."}}
    ]},
    {type:"tfng",instruction:INS.tfng,items:[
      {s:"The cables are about 1.4 million kilometres long in total.",a:"T",e:{en:"“…about 1.4 million kilometres in total…”",ru:"«…about 1.4 million kilometres in total…»",kz:"«…about 1.4 million kilometres in total…»"}},
      {s:"Most international data travels through the air.",a:"F",e:{en:"“It doesn't fly through the air. It goes down.”",ru:"«It doesn't fly through the air.» — не по воздуху.",kz:"«It doesn't fly through the air.» — ауа арқылы емес."}},
      {s:"The Queen's message was in French.",a:"NG",e:{en:"The text does not say what language the message was in.",ru:"В тексте не сказано, на каком языке было сообщение.",kz:"Мәтінде хабардың қай тілде болғаны айтылмаған."}},
      {s:"In the deep sea, a cable is as thick as a tree.",a:"F",e:{en:"“…not much thicker than a garden hose.”",ru:"«…not much thicker than a garden hose.» — как садовый шланг.",kz:"«…not much thicker than a garden hose.» — бақша шлангісіндей."}},
      {s:"Sharks sometimes bite the cables.",a:"T",e:{en:"“…and sometimes a shark bites one.”",ru:"«…sometimes a shark bites one.»",kz:"«…sometimes a shark bites one.»"}},
      {s:"Robots repair most of the broken cables.",a:"NG",e:{en:"The text talks about special ships, not robots.",ru:"В тексте говорится о специальных судах, о роботах — нет.",kz:"Мәтінде арнайы кемелер туралы айтылған, роботтар туралы емес."}},
      {s:"The first cable across the Atlantic worked for many years.",a:"F",e:{en:"“Three weeks later the cable stopped working.”",ru:"«Three weeks later the cable stopped working.» — три недели.",kz:"«Three weeks later the cable stopped working.» — үш апта."}}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“data” means…",o:["information on computers","water","electricity"],a:0,e:{en:"Photos, messages and videos are data.",ru:"Data — данные.",kz:"Data — деректер."}},
      {q:"A “hose” is…",o:["a tall building","a long tube for water","a kind of ship"],a:1,e:{en:"You water a garden with a hose.",ru:"Hose — шланг.",kz:"Hose — шланг."}},
      {q:"“repair” means…",o:["cut","sell","fix something broken"],a:2,e:{en:"Repair = make something work again.",ru:"Repair — чинить.",kz:"Repair — жөндеу."}},
      {q:"An “anchor” is…",o:["a heavy metal thing that holds a ship in one place","a fish","a fishing boat"],a:0,e:{en:"Ships drop an anchor to stay in one place.",ru:"Anchor — якорь.",kz:"Anchor — зәкір."}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"More than 99 per cent of the {data} between countries travels under the sea. A deep-sea cable is not much thicker than a garden {hose}. The data travels as {light} through glass fibres. In 1858 engineers laid the first {cable} across the Atlantic. The Queen's message took sixteen {hours} to arrive. Special ships {repair} broken cables.",
     extra:["minutes","break"]},
    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[
      {l:{en:"Paragraph 1",ru:"Абзац 1",kz:"1-абзац"},r:"Your photo goes down, not up"},
      {l:{en:"Paragraph 2",ru:"Абзац 2",kz:"2-абзац"},r:"Thin as a garden hose"},
      {l:{en:"Paragraph 3",ru:"Абзац 3",kz:"3-абзац"},r:"A message that took sixteen hours"},
      {l:{en:"Paragraph 4",ru:"Абзац 4",kz:"4-абзац"},r:"Anchors, nets and sharks"}
    ]},

     keys:[["internet","wifi","connection","signal"],["slow","doesn't work","not work","broken","off"],["wait","read","book","walk","phone","call","restart","try","talk"]],min:2,

  ]},

{ id:"a2-nat-pando", level:"A2", genre:"nature", title:"One Tree, Forty Thousand Trunks", cover:{emoji:"🍂"},
  task:{en:"Read and find out: why is Pando one tree and not a forest?",ru:"Прочитайте и узнайте: почему Пандо — одно дерево, а не лес?",kz:"Оқып, біліңіз: Пандо неге орман емес, бір ағаш?"},
  words:[
    {en:"trunk",tr:"/trʌŋk/",ru:"ствол",kz:"дің",ex:"The trunks die and new ones grow, but the roots continue."},
    {en:"bark",tr:"/bɑːk/",ru:"кора",kz:"қабық",ex:"They have white bark and small round leaves."},
    {en:"root",tr:"/ruːt/",ru:"корень",kz:"тамыр",ex:"Every tree grows from the same roots under the ground."},
    {en:"spread",tr:"/spred/",ru:"распространяться",kz:"таралу",ex:"Pando means “I spread” in Latin."},
    {en:"enormous",tr:"/ɪˈnɔːməs/",ru:"огромный",kz:"орасан зор",ex:"Below, it is one enormous living thing."},
    {en:"weigh",tr:"/weɪ/",ru:"весить",kz:"салмағы болу",ex:"It weighs about six thousand tonnes."},
    {en:"fence",tr:"/fens/",ru:"забор, ограда",kz:"қоршау",ex:"People have built fences around parts of Pando."}
  ],
  text:[
    "In the mountains of Utah, USA, there is a forest of about forty-seven thousand trees. They have white bark and small round leaves. In autumn they all turn yellow on the same day. Why? Because they are not forty-seven thousand trees. They are one tree.",
    "The forest is called Pando, which means “I spread” in Latin. Every tree grows from the same roots under the ground. Scientists tested the leaves, and all of them have exactly the same DNA. Above the ground, Pando looks like a forest. Below, it is one enormous living thing.",
    "Pando covers forty-three hectares, about sixty football fields, and weighs about six thousand tonnes — heavier than any whale. Scientists think it has lived for thousands of years. The trunks die and new ones grow, but the roots continue.",
    "Pando has a problem. Deer and cows eat almost all the young trunks, so the forest is getting older. People have built fences around parts of Pando, and there new trees are growing. “Pando is the biggest living thing we know,” says one scientist, “and we should not lose it.”"
  ],
  exercises:[
    {type:"mc",instruction:INS.mc,items:[
      {q:"Why do all the trees turn yellow on the same day?",o:["because of the cold wind","because they are one tree","because people paint them"],a:1,e:{en:"“They are not forty-seven thousand trees. They are one tree.”",ru:"«They are one tree.» — это одно дерево.",kz:"«They are one tree.» — бұл бір ағаш."}},
      {q:"What does “Pando” mean?",o:["“I spread”","“big tree”","“yellow leaf”"],a:0,e:{en:"“…Pando, which means ‘I spread’ in Latin.”",ru:"«…‘I spread’ in Latin.»",kz:"«…‘I spread’ in Latin.»"}},
      {q:"How heavy is Pando?",o:["about six tonnes","about six hundred tonnes","about six thousand tonnes"],a:2,e:{en:"“…weighs about six thousand tonnes…”",ru:"«…about six thousand tonnes…»",kz:"«…about six thousand tonnes…»"}},
      {q:"Who eats the young trunks?",o:["birds","deer and cows","people"],a:1,e:{en:"“Deer and cows eat almost all the young trunks…”",ru:"«Deer and cows eat…» — олени и коровы.",kz:"«Deer and cows eat…» — бұғылар мен сиырлар."}}
    ]},
    {type:"match",instruction:INS.matchD,explanation:EXPL.match,pairs:[
      {l:"trunk",r:{en:"the main part of a tree",ru:"ствол",kz:"дің"}},{l:"root",r:{en:"the part of a plant under the ground",ru:"корень",kz:"тамыр"}},
      {l:"enormous",r:{en:"very, very big",ru:"огромный",kz:"орасан зор"}},{l:"spread",r:{en:"grow over a bigger area",ru:"распространяться",kz:"таралу"}},
      {l:"fence",r:{en:"a wall of wood or metal around a place",ru:"забор",kz:"қоршау"}},{l:"weigh",r:{en:"have a weight of",ru:"весить",kz:"салмағы болу"}}
    ]},
    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "Scientists find a forest of about 47,000 trees in Utah.","They test the leaves and find the same DNA in all of them.","They understand that the forest is one tree with one root system.","They give it the name Pando, “I spread”.","They see that deer and cows eat the young trunks.","People build fences to protect parts of the forest."
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"The trees have white bark and",o:["big red leaves","small round leaves","no leaves"],a:1,e:{en:"“They have white bark and small round leaves.”",ru:"«…small round leaves.»",kz:"«…small round leaves.»"}},
      {s:"Below the ground, Pando is",o:["one enormous living thing","many small plants","a river"],a:0,e:{en:"“Below, it is one enormous living thing.”",ru:"«…one enormous living thing.»",kz:"«…one enormous living thing.»"}},
      {s:"Pando is heavier than",o:["a car","any whale","a mountain"],a:1,e:{en:"“…heavier than any whale.”",ru:"«…heavier than any whale.»",kz:"«…heavier than any whale.»"}},
      {s:"New trees are growing",o:["everywhere","only in winter","inside the fences"],a:2,e:{en:"“People have built fences… and there new trees are growing.”",ru:"«…and there new trees are growing.» — за оградами.",kz:"«…and there new trees are growing.» — қоршау ішінде."}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"Pando is in Canada.",a:false,e:{en:"“In the mountains of Utah, USA…”",ru:"«…Utah, USA…» — в США.",kz:"«…Utah, USA…» — АҚШ-та."}},
      {s:"All the leaves have the same DNA.",a:true,e:{en:"“…all of them have exactly the same DNA.”",ru:"«…exactly the same DNA.»",kz:"«…exactly the same DNA.»"}},
      {s:"Pando covers about sixty football fields.",a:true,e:{en:"“…forty-three hectares, about sixty football fields…”",ru:"«…about sixty football fields…»",kz:"«…about sixty football fields…»"}},
      {s:"The roots die every year.",a:false,e:{en:"“The trunks die and new ones grow, but the roots continue.”",ru:"«…but the roots continue.» — корни живут.",kz:"«…but the roots continue.» — тамырлар өмір сүре береді."}},
      {s:"People have built fences around parts of Pando.",a:true,e:{en:"“People have built fences around parts of Pando…”",ru:"«People have built fences…»",kz:"«People have built fences…»"}}
    ]},
    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[
      "In Utah there is a forest of 47,000 trunks that is really one tree.","All the trunks grow from the same roots and have the same DNA.","Pando weighs about 6,000 tonnes and has lived for thousands of years.","Deer and cows eat the young trunks, so the forest is getting older.","People have built fences, and new trees are growing behind them."
    ]}
  ]},
