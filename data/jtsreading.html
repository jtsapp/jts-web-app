<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>JTS · Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   JTS · Reading — design tokens (JTS brandbook)
   ============================================================ */
:root{
  --violet:#874BF8; --violet-dark:#5718c0; --violet-100:#ede3ff; --violet-tint:#f4f0ff;
  --cyan:#0AAFFF; --green:#00D441; --orange:#FF631E; --gold:#FFAD00;
  --ink:#15131a; --ink-soft:#3f3a47; --muted:#504b4b;
  --border:#ece8f5; --bg:#faf8ff; --card:#ffffff; --card-2:#f4f0ff;
  --ok-bg:#e3fbe8; --ok-bd:#00D441; --ok-ink:#0b5c22;
  --bad-bg:#ffe9df; --bad-bd:#FF631E; --bad-ink:#8a2c05;
  --r-card:24px; --r-panel:20px; --r-ctl:12px; --r-pill:999px;
  --sh-card:0 6px 24px rgba(135,75,248,.08);
  --sh-hover:0 12px 32px rgba(135,75,248,.16);
  --sh-pop:0 16px 48px rgba(21,19,26,.22);
  --fs:20px; --lh:1.8; --measure:68ch; --track:0; --wspace:0;
  --hdr:64px; --link:#5718c0;
  --font:'PT Root UI','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-theme="dark"]{
  --ink:#f5f3fa; --ink-soft:#dcd7e6; --muted:#cfc9dc;
  --border:#352e42; --bg:#15131a; --card:#1f1c28; --card-2:#2a2536;
  --violet-100:#3a2a5c; --violet-tint:#26203a; --link:#c9aaff;
  --ok-bg:#123320; --ok-ink:#b8f5c6; --bad-bg:#40200f; --bad-ink:#ffd2bd;
  --sh-card:0 6px 24px rgba(0,0,0,.35); --sh-hover:0 12px 32px rgba(0,0,0,.5);
  --sh-pop:0 16px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font);
  font-size:max(16px, calc(var(--fs) * .85));
  line-height:1.5;
  letter-spacing:var(--track); word-spacing:var(--wspace);
  min-height:100vh; overflow-x:hidden;
}
body.dys em, body.dys i{font-style:normal;font-weight:600}
img,svg{max-width:100%;display:block}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
h1,h2,h3{margin:0;line-height:1.25;font-weight:800}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:40;height:var(--hdr);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);
  font-size:16px;
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:800;font-size:18px;min-height:48px;padding:0 4px;border-radius:var(--r-ctl)}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--violet);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.logo-sub{color:var(--muted);font-weight:600}
.hdr-right{display:flex;align-items:center;gap:6px}
@media (max-width:479.98px){.hdr{padding:0 12px}.logo{gap:8px;padding:0}.logo-sub{display:none}.lang button{padding:0 4px}}
.lang{display:flex;background:var(--violet-tint);border-radius:var(--r-pill);padding:2px;gap:2px}
.lang button{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:var(--r-pill);font-weight:700;padding:0 10px;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--violet);color:#fff}
.lang .lname{display:none;margin-left:4px}
.xp{display:none;align-items:center;gap:6px;background:var(--violet-tint);border-radius:var(--r-pill);padding:0 14px;min-height:48px;font-weight:700;color:var(--ink)}
.icon-btn{min-width:48px;min-height:48px;border:2px solid var(--border);background:var(--card);border-radius:var(--r-ctl);font-size:22px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.icon-btn:hover{border-color:var(--violet);background:var(--violet-tint)}
.icon-btn[aria-expanded="true"]{background:var(--violet);color:#fff;border-color:var(--violet)}
@media (min-width:768px){.xp{display:flex}.lang .lname{display:inline}.hdr{padding:0 24px}}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 22px;border-radius:var(--r-ctl);
  border:2px solid transparent;font-weight:700;font-size:1.05em;text-decoration:none;
  transition:transform .12s,box-shadow .15s,background .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--violet);color:#fff}
.btn-primary:hover{box-shadow:var(--sh-hover)}
.btn-secondary{background:var(--violet-tint);color:var(--link)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--ink)}
.btn-ghost:hover{border-color:var(--violet)}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 14px;font-size:1em}

/* ---------- chips / filters ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.chip{
  min-height:48px;padding:0 18px;border-radius:var(--r-pill);
  border:2px solid var(--border);background:var(--card);font-weight:700;
  display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;
}
.chip:hover:not(:disabled){border-color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.chip .soon{font-size:.8em;font-weight:600;background:var(--violet-tint);color:var(--link);border-radius:var(--r-pill);padding:2px 8px}
.chip:disabled .soon{color:var(--muted)}

/* ---------- layout ---------- */
main{padding:20px 16px 64px;max-width:1440px;margin:0 auto}
@media (min-width:768px){main{padding:28px 24px 72px}}
@media (min-width:1024px){main{padding:32px 32px 80px}}
.page-title{font-size:1.6em;margin-bottom:6px}
.page-sub{color:var(--muted);font-weight:500;margin-bottom:20px}
.section-label{font-size:.9em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}

/* ---------- library grid & cards ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}
@media (min-width:1440px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-card);
  overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border);
  transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}
.cover{
  position:relative;height:150px;display:grid;place-items:center;color:#fff;overflow:hidden;
}
.cover::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.28), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(255,255,255,.18), transparent 40%);
}
.cover .emoji{font-size:64px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25));position:relative}
.cover .lvl{position:absolute;top:12px;left:12px;background:rgba(21,19,26,.55);backdrop-filter:blur(6px);border-radius:var(--r-pill);padding:4px 12px;font-weight:800;font-size:15px}
.cover .done{position:absolute;top:12px;right:12px;background:var(--green);color:var(--ink);border-radius:var(--r-pill);padding:4px 12px;font-weight:800;font-size:15px}
.g-science{background:linear-gradient(135deg,var(--violet),var(--cyan))}
.g-adventure{background:linear-gradient(135deg,var(--orange),var(--gold))}
.g-mystery{background:linear-gradient(135deg,#15131a,var(--violet))}
.g-history{background:linear-gradient(135deg,var(--gold),var(--orange))}
.g-technology{background:linear-gradient(135deg,var(--cyan),var(--violet))}
.g-nature{background:linear-gradient(135deg,var(--green),var(--cyan))}
.g-people{background:linear-gradient(135deg,var(--gold),var(--violet))}
.g-culture{background:linear-gradient(135deg,var(--orange),var(--violet))}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-title{font-size:1.15em;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-weight:600;font-size:.92em}
.meta span{display:inline-flex;align-items:center;gap:5px}
.bar{height:10px;background:var(--violet-tint);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:var(--r-pill);transition:width .3s}
.bar-row{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92em}
.bar-row .bar{flex:1}
.card .btn{margin-top:auto}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-weight:600;background:var(--card);border-radius:var(--r-card);border:1px dashed var(--border)}

/* ---------- reading screen ---------- */
.read-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.read-head .btn{flex:none}
.toolbar{
  position:sticky;top:var(--hdr);z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-panel);
  padding:8px;margin-bottom:16px;box-shadow:var(--sh-card);font-size:16px;
}
.tabs{display:flex;gap:4px;background:var(--violet-tint);border-radius:var(--r-ctl);padding:4px;flex:1}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;border-radius:9px;font-weight:700;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:var(--sh-card);color:var(--link)}
.tb-group{display:flex;gap:6px;align-items:center}
.tb-btn{min-width:48px;min-height:48px;padding:0 12px;border-radius:var(--r-ctl);border:2px solid var(--border);background:var(--card);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb-btn:hover{border-color:var(--violet)}
.tb-btn.on{background:var(--violet);color:#fff;border-color:var(--violet)}
@media (min-width:1024px){.tabs{display:none}}

.read-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.read-grid>*{min-width:0}
.ex,.panel,.hero,.task-box{min-width:0;overflow-wrap:anywhere}
@media (min-width:1024px){
  .read-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px}
  .pane-text{position:sticky;top:calc(var(--hdr) + 84px);max-height:calc(100vh - var(--hdr) - 100px);overflow-y:auto;padding-right:6px}
}
@media (max-width:1023.98px){
  .read-grid[data-tab="text"] .pane-ex{display:none}
  .read-grid[data-tab="ex"] .pane-text{display:none}
}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:20px;margin-bottom:20px}
@media (min-width:768px){.panel{padding:24px}}
.hero{border-radius:var(--r-card);padding:28px 24px;color:#fff;position:relative;overflow:hidden;margin-bottom:20px;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%, rgba(255,255,255,.3), transparent 45%)}
.hero .emoji{position:absolute;right:20px;top:16px;font-size:72px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
.hero h1{font-size:1.7em;position:relative;max-width:75%}
.hero .meta{color:rgba(255,255,255,.95);position:relative}
.task-box{border-left:6px solid var(--gold);background:var(--card-2);border-radius:var(--r-panel);padding:16px 18px;font-weight:600;font-size:var(--fs);line-height:var(--lh);margin-bottom:20px}
.task-box b{display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}

.words{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:600px) and (max-width:1023.98px){.words{grid-template-columns:1fr 1fr}}
.word{background:var(--card-2);border-radius:var(--r-panel);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:calc(var(--fs) * .9);line-height:1.5}
.word-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.word-top{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.word .en{font-weight:800;font-size:1.1em}
.word .tr{color:var(--muted);font-weight:500;font-family:'Inter',system-ui,sans-serif}
.word-tr{font-weight:600;display:flex;gap:6px}
.word .flag{display:inline-block;width:2em;flex:none;font-weight:700;color:var(--muted)}
.word .wex{color:var(--ink-soft);font-style:italic;border-top:1px solid var(--border);padding-top:6px;margin-top:4px}
body.dys .word .wex{font-style:normal}
.word .say{flex:none}
.say{min-width:48px;min-height:48px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:20px;display:grid;place-items:center}
.say:hover{border-color:var(--violet);background:var(--violet-tint)}

.article{font-size:var(--fs);line-height:var(--lh);max-width:var(--measure)}
.article p{margin:0 0 1em}
.article .s{border-radius:6px;transition:background .2s}
.article .s.speaking{background:var(--violet-100);box-shadow:0 0 0 4px var(--violet-100)}
.article .w{cursor:pointer;border-radius:4px;transition:background .12s}
.article .w:hover{background:var(--violet-100)}
.article .w.active{background:var(--violet);color:#fff}
.article .w:focus-visible{outline-offset:1px}
.listen{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hint{color:var(--muted);font-weight:500;font-size:.95em}

/* ---------- exercises ---------- */
.ex{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:20px;margin-bottom:20px;font-size:var(--fs);line-height:var(--lh);scroll-margin-top:calc(var(--hdr) + 90px)}
@media (min-width:768px){.ex{padding:24px}}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;font-size:.8em}
.ex-num{width:2.2em;height:2.2em;border-radius:50%;background:var(--violet);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.ex-type{font-weight:700;color:var(--link);background:var(--violet-tint);border-radius:var(--r-pill);padding:4px 12px}
.ex-xp{margin-left:auto;font-weight:800;color:var(--ok-ink);background:var(--ok-bg);border-radius:var(--r-pill);padding:4px 12px}
html[data-theme="dark"] .ex-xp{color:#b8f5c6}
.ex-inst{font-weight:800;font-size:1.05em;margin-bottom:4px}
.ex-hint{color:var(--muted);font-size:.85em;font-weight:500;margin-bottom:14px}
.ex.is-checked .opt,.ex.is-checked .mt,.ex.is-checked .gap,.ex.is-checked .chip-w,.ex.is-checked .ord button{pointer-events:none}
.q{padding:14px 0;border-top:1px solid var(--border)}
.q:first-child{border-top:0;padding-top:4px}
.q-text{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{
  text-align:left;min-height:48px;padding:10px 16px;border-radius:var(--r-ctl);
  border:2px solid var(--border);background:var(--card);font-weight:600;display:flex;align-items:center;gap:10px;
  transition:border-color .15s,background .15s;
}
.opt::before{content:"";width:.9em;height:.9em;border-radius:50%;border:2px solid var(--muted);flex:none}
.opt:hover{border-color:var(--violet)}
.opt[aria-checked="true"]{border-color:var(--violet);background:var(--violet-tint)}
.opt[aria-checked="true"]::before{background:var(--violet);border-color:var(--violet);box-shadow:inset 0 0 0 3px var(--card)}
.opt.correct{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-ink)}
.opt.wrong{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-ink)}
.opt.correct::before{background:var(--ok-bd);border-color:var(--ok-bd)}
.opt.wrong::before{background:var(--bad-bd);border-color:var(--bad-bd)}
.opts.row .opt{flex:1;min-width:120px;justify-content:center}
.fb{margin-top:8px;padding:10px 14px;border-radius:var(--r-ctl);font-size:.9em;font-weight:600;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok-ink)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad-ink)}
.fb.note{display:block;background:var(--card-2);color:var(--ink)}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mt{
  min-height:56px;padding:10px 12px;border-radius:var(--r-ctl);border:2px solid var(--border);
  background:var(--card);font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;
  transition:border-color .15s,background .15s;position:relative;
}
.mt.emoji{font-size:1.6em;justify-content:center}
.mt:hover{border-color:var(--violet)}
.mt.sel{border-color:var(--violet);background:var(--violet-tint)}
.mt.paired{border-color:var(--cyan)}
.mt .tag{position:absolute;top:-8px;right:-6px;background:var(--cyan);color:#fff;font-size:.65em;font-weight:800;border-radius:var(--r-pill);padding:2px 8px;font-family:'Inter',system-ui,sans-serif}
.mt.correct{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-ink)}
.mt.wrong{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-ink)}
.mt.correct .tag{background:var(--ok-bd);color:var(--ink)}
.mt.wrong .tag{background:var(--bad-bd)}

/* gap fill */
.gap-text{margin-bottom:14px}
.gap{
  display:inline-flex;align-items:center;justify-content:center;min-width:6em;min-height:44px;
  padding:0 12px;margin:2px 2px;border-radius:var(--r-ctl);border:2px dashed var(--violet);
  background:var(--violet-tint);font-weight:700;color:var(--link);vertical-align:middle;
}
.gap.active{border-style:solid;background:var(--violet-100);box-shadow:0 0 0 3px var(--violet-100)}
.gap.filled{border-style:solid;background:var(--card);color:var(--ink)}
.gap.over{background:var(--violet-100);border-style:solid}
.gap.correct{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-ink)}
.gap.wrong{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-ink);text-decoration:line-through}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--card-2);border-radius:var(--r-panel);min-height:64px}
.bank-label{font-size:.8em;font-weight:700;color:var(--muted);width:100%}
.chip-w{min-height:48px;padding:0 16px;border-radius:var(--r-pill);border:2px solid var(--border);background:var(--card);font-weight:700;cursor:grab;touch-action:manipulation}
.chip-w:hover{border-color:var(--violet)}
.chip-w.used{display:none}
.chip-w.dragging{opacity:.5}

/* reflection */
.reflect{width:100%;min-height:130px;font:inherit;line-height:1.6;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r-ctl);background:var(--card);color:var(--ink);resize:vertical;letter-spacing:inherit}
.reflect:focus{border-color:var(--violet)}
.reflect:disabled{background:var(--card-2)}
.fb b{color:var(--ok-ink)}
html[data-theme="dark"] .fb b{color:#b8f5c6}
.ex-expl.model{margin-top:12px}

/* order */
.ord-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:var(--r-ctl);border:2px solid var(--border);background:var(--card);font-weight:600}
.ord .handle{color:var(--muted);cursor:grab;font-size:1.2em;flex:none;user-select:none}
.ord .txt{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{min-width:48px;min-height:24px;border:2px solid var(--border);background:var(--card-2);border-radius:8px;font-weight:800;line-height:1}
.ord .mv button:hover{border-color:var(--violet)}
.ord.dragging{opacity:.5}
.ord.over{border-color:var(--violet);background:var(--violet-tint)}
.ord.correct{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-ink)}
.ord.wrong{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-ink)}
.ord .num{width:1.8em;height:1.8em;border-radius:50%;background:var(--violet-tint);color:var(--link);font-weight:800;font-size:.8em;display:grid;place-items:center;flex:none}

.ex-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.ex-result{width:100%;padding:12px 16px;border-radius:var(--r-ctl);font-weight:800;display:none}
.ex-result.ok{display:block;background:var(--ok-bg);color:var(--ok-ink)}
.ex-result.part{display:block;background:#fff4dc;color:#6b4300}
html[data-theme="dark"] .ex-result.part{background:#3e2f0d;color:#ffe2a8}
.ex-result.bad{display:block;background:var(--bad-bg);color:var(--bad-ink)}
.ex-expl{width:100%;padding:12px 16px;border-radius:var(--r-ctl);background:var(--card-2);font-size:.9em;font-weight:500}
.finish-box{text-align:center;padding:24px;background:var(--card);border-radius:var(--r-card);border:1px solid var(--border);box-shadow:var(--sh-card)}
.finish-box p{margin-bottom:14px;font-weight:600;font-size:var(--fs)}

/* ---------- result ---------- */
.result{max-width:760px;margin:0 auto}
.result .hero{min-height:200px;text-align:center;align-items:center}
.result .hero h1{max-width:none;font-size:2em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-panel);box-shadow:var(--sh-card);padding:18px 12px;text-align:center}
.stat b{display:block;font-size:2em;font-weight:800;color:var(--link);line-height:1.1}
.stat span{font-weight:600;color:var(--muted);font-size:.9em}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review-list li{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card-2);border-radius:var(--r-ctl);font-weight:600}
.review-list li .btn{margin-left:auto}
.words.compact .word{grid-template-columns:1fr auto}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.actions .btn{flex:1;min-width:200px}

/* ---------- settings drawer ---------- */
.backdrop{position:fixed;inset:0;background:rgba(21,19,26,.45);z-index:50}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:60;background:var(--card);
  box-shadow:var(--sh-pop);padding:20px;overflow-y:auto;font-size:16px;display:flex;flex-direction:column;gap:18px;
  transform:translateX(0);transition:transform .2s;
}
.drawer-head{display:flex;align-items:center;justify-content:space-between}
.drawer-head h2{font-size:22px}
.set{display:flex;flex-direction:column;gap:8px}
.set label,.set .lbl{font-weight:700;font-size:17px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:48px;border-radius:var(--r-ctl);border:2px solid var(--border);background:var(--card);font-weight:800}
.seg button:hover{border-color:var(--violet)}
.seg button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:6px 14px;border:2px solid var(--border);border-radius:var(--r-ctl);background:var(--card);font-weight:700;width:100%;text-align:left}
.switch .knob{width:52px;height:30px;border-radius:var(--r-pill);background:var(--border);position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"] .knob{background:var(--green)}
.switch[aria-checked="true"] .knob::after{transform:translateX(22px)}
.preview{padding:14px 16px;background:var(--card-2);border-radius:var(--r-panel);font-size:var(--fs);line-height:var(--lh)}

/* ---------- word popup ---------- */
.pop{
  position:fixed;z-index:70;background:var(--card);color:var(--ink);border-radius:var(--r-panel);
  box-shadow:var(--sh-pop);border:1px solid var(--border);padding:14px 16px;width:min(320px,calc(100vw - 24px));
  font-size:max(16px,calc(var(--fs)*.9));line-height:1.5;
}
.pop-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pop-head .en{font-weight:800;font-size:1.15em;flex:1}
.pop .tr{color:var(--muted);font-family:'Inter',system-ui,sans-serif}
.pop-row{display:flex;gap:8px;font-weight:600;padding:3px 0}
.pop-row .flag{width:2.2em;color:var(--muted);flex:none}
.pop .close{position:absolute;top:6px;right:6px;min-width:40px;min-height:40px;border:0;background:transparent;border-radius:50%;font-size:20px}
.pop .close:hover{background:var(--violet-tint)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:var(--r-pill);font-weight:800;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html[data-theme="dark"] .toast{background:var(--violet);color:#fff}

function L(obj){ if(obj==null) return ''; if(typeof obj==='string') return obj; return obj[S.lang] || obj.en || obj.ru || ''; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffledIdx(n){ const base = Array.from({length:n},(_,i)=>i); if(n<2) return base; let s; do{ s = shuffle(base);}while(s.every((v,i)=>v===i)); return s; }
function norm(w){ return String(w).toLowerCase().replace(/[’']/g,"'").replace(/^[^a-z0-9]+|[^a-z0-9]+$/g,''); }
function wordCount(text){ return text.join(' ').split(/\s+/).filter(Boolean).length; }
function readMin(text){ return Math.max(1, Math.round(wordCount(text)/70)); }
function genreOf(id){ return GENRES.find(g=>g.id===id) || GENRES[0]; }
function textById(id){ for(const lv of LEVELS){ const f=(DATA[lv]||[]).find(x=>x.id===id); if(f) return f; } return null; }
function prog(id){ if(!S.progress[id]) S.progress[id] = {ex:{}, done:false}; return S.progress[id]; }
function textScore(txt){
  const p = S.progress[txt.id]; let got=0,total=0;
  txt.exercises.forEach((ex,i)=>{ const n = exTotal(ex); total+=n; if(p && p.ex[i]) got += Math.min(n, p.ex[i].score); });
  return {got,total,pct: total? Math.round(got/total*100):0};
}
function exTotal(ex){
  switch(ex.type){
    case 'gap': return (ex.text.match(/\{[^}]+\}/g)||[]).length;
    case 'match': case 'wwmatch': case 'headings': return ex.pairs.length;
    case 'order': case 'summary': return ex.items.length;
    case 'reflection': return ex.min || 2;
    default: return ex.items.length;
  }
}
let toastTimer=null;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }
function sentences(par){ return (par.match(/[^.!?…]+(?:[.!?…]+["'”’)]*)?\s*/g)||[par]).map(s=>s.trim()).filter(Boolean); }

/* ---------- TTS ---------- */
const TTS = { playing:false, paused:false, idx:0, list:[], voice:null };
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function pickVoice(){
  if(!hasTTS) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/^en[-_](GB|US)/i.test(v.lang) && /google|natural|premium|enhanced/i.test(v.name))
      || vs.find(v=>/^en[-_](GB|US)/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(hasTTS){ speechSynthesis.onvoiceschanged = ()=>{ TTS.voice = pickVoice(); }; TTS.voice = pickVoice(); }
function speak(text, onend){
  if(!hasTTS){ toast(t('noTTS')); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
  if(!TTS.voice) TTS.voice = pickVoice();
  if(TTS.voice) u.voice = TTS.voice;
  if(onend){ u.onend = onend; u.onerror = onend; }
  speechSynthesis.speak(u);
}
function sayWord(w){ if(hasTTS){ if(TTS.playing) ttsStop(); speechSynthesis.cancel(); } speak(w); }
function ttsStart(){
  if(!hasTTS){ toast(t('noTTS')); return; }
  ttsStop();
  TTS.list = $$('.article .s').map(el=>el.textContent.trim());
  if(!TTS.list.length) return;
  TTS.playing = true; TTS.paused=false; TTS.idx = 0;
  updateTTSButtons(); ttsNext();
}
function ttsNext(){
  if(!TTS.playing) return;
  if(TTS.idx >= TTS.list.length){ ttsStop(); return; }
  highlightSentence(TTS.idx);
  const cur = TTS.idx;
  speak(TTS.list[cur], ()=>{ if(TTS.playing && TTS.idx===cur){ TTS.idx++; ttsNext(); } });
}
function ttsPauseResume(){
  if(!TTS.playing) return;
  if(TTS.paused){ speechSynthesis.resume(); TTS.paused=false; }
  else { speechSynthesis.pause(); TTS.paused=true; }
  updateTTSButtons();
}
function ttsStop(){
  TTS.playing=false; TTS.paused=false;
  if(hasTTS) speechSynthesis.cancel();
  highlightSentence(-1); updateTTSButtons();
}
function highlightSentence(i){
  $$('.article .s').forEach((el,k)=>{
    el.classList.toggle('speaking', k===i);
    if(k===i){ const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; el.scrollIntoView({block:'center', behavior: rm?'auto':'smooth'}); }
  });
}
function updateTTSButtons(){
  const p = $('#tts-play'), pa = $('#tts-pause'), st = $('#tts-stop'), tb = $('#tb-tts');
  if(p){ p.hidden = TTS.playing; }
  if(pa){ pa.hidden = !TTS.playing; pa.textContent = (TTS.paused ? '▶ ' + t('resume') : '⏸ ' + t('pause')); }
  if(st){ st.hidden = !TTS.playing; }
  if(tb){ tb.classList.toggle('on', TTS.playing); tb.setAttribute('aria-pressed', String(TTS.playing)); }
}

/* ---------- word popup ---------- */
function lookup(word, txt){
  const w = norm(word); if(!w) return null;
  if(txt){ const kw = txt.words.find(k=>norm(k.en)===w); if(kw) return {en:kw.en, tr:kw.tr, ru:kw.ru, kz:kw.kz}; }
  const tryKeys = [w];
  if(w.endsWith("'s")) tryKeys.push(w.slice(0,-2));
  if(w.endsWith('ies')) tryKeys.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) tryKeys.push(w.slice(0,-2));
  if(w.endsWith('s')) tryKeys.push(w.slice(0,-1));
  if(w.endsWith('ing')) { tryKeys.push(w.slice(0,-3)); tryKeys.push(w.slice(0,-3)+'e'); }
  if(w.endsWith('ed')) { tryKeys.push(w.slice(0,-2)); tryKeys.push(w.slice(0,-1)); }
  if(w.endsWith('er')) tryKeys.push(w.slice(0,-2));
  for(const k of tryKeys){ if(DICT[k]) { const d = DICT[k]; return {en:word.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,''), ru:d[0], kz:d[1]}; } }
  return null;
}
function showPop(el, txt){
  const pop = $('#pop');
  $$('.article .w.active').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  const d = lookup(el.textContent, txt) || {en: el.textContent.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,''), ru:null, kz:null};
  pop.innerHTML =
    `<button type="button" class="close" data-action="pop-close" aria-label="${esc(t('close'))}">✕</button>
     <div class="pop-head"><span class="en" lang="en">${esc(d.en)}</span>
       <button type="button" class="say" data-say="${esc(d.en)}" aria-label="🔊 ${esc(d.en)}">🔊</button></div>
     ${d.tr ? `<div class="tr">${esc(d.tr)}</div>` : ''}
     ${d.ru!=null ? `<div class="pop-row"><span class="flag">RU</span><span lang="ru">${esc(d.ru)}</span></div>
     <div class="pop-row"><span class="flag">KZ</span><span lang="kk">${esc(d.kz)}</span></div>`
     : `<div class="pop-row hint">${esc(t('noTranslation'))}</div>`}`;
  pop.hidden = false;
  const r = el.getBoundingClientRect(); const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(12, r.left), window.innerWidth - pw - 12);
  let top = r.bottom + 8; if(top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 8);
  pop.style.left = left+'px'; pop.style.top = top+'px';
  sayWord(d.en);
}
function hidePop(){ const pop=$('#pop'); if(!pop.hidden){ pop.hidden=true; $$('.article .w.active').forEach(x=>x.classList.remove('active')); } }

/* ---------- exercises: runtime init ---------- */
function initEx(ex, i){
  const st = {type:ex.type, checked:false, revealed:false, sel:{}, pairs:{}, activeL:null, activeR:null, fill:[], activeGap:null, seq:[], bank:[], answers:[], parts:[]};
  if(ex.type==='gap'){
    const parts = ex.text.split(/\{([^}]+)\}/); // even = text, odd = answers
    st.parts = parts; st.answers = parts.filter((_,k)=>k%2===1);
    st.bank = shuffle(st.answers.concat(ex.extra||[]));
    st.fill = st.answers.map(()=>null);
  } else if(isMatch(ex.type)){
    st.right = shuffledIdx(ex.pairs.length);
  } else if(isOrder(ex.type)){
    st.seq = shuffledIdx(ex.items.length);
  }
  return st;
}
function isChoice(type){ return type==='before'||type==='mc'||type==='finish'||type==='tf'||type==='tfng'||type==='vocab'; }
function isMatch(type){ return type==='match'||type==='wwmatch'||type==='headings'; }
function isOrder(type){ return type==='order'||type==='summary'; }
function choiceItems(ex){
  return ex.items.map(it => ex.type==='tf'
    ? {q: it.s, o:[t('true'), t('false')], a: it.a ? 0 : 1, e: it.e}
    : ex.type==='tfng'
    ? {q: it.s, o:[t('true'), t('false'), t('notGiven')], a: ({T:0,F:1,NG:2})[it.a], e: it.e}
    : {q: it.q || it.s, o: it.o, a: it.a, e: it.e});
}

/* ---------- exercises: HTML ---------- */
function exHTML(x, ex, i){
  const st = EX[i];
  let body='', hint='';
  if(isChoice(ex.type)){
    hint = ex.type==='tf' ? t('hintTF') : ex.type==='tfng' ? t('hintTFNG') : t('hintChoice');
    const rowType = ex.type==='tf' || ex.type==='tfng';
    body = choiceItems(ex).map((it,k)=>`<div class="q" data-k="${k}">
      <p class="q-text" lang="en">${esc(it.q)}${ex.type==='finish'?' …':''}</p>
      <div class="opts ${rowType?'row':''}" role="radiogroup" aria-label="${esc(it.q)}">
        ${it.o.map((o,j)=>`<button type="button" class="opt" role="radio" aria-checked="${String(st.sel[k]===j)}" data-k="${k}" data-j="${j}" ${rowType?'':'lang="en"'}>${esc(o)}</button>`).join('')}
      </div><div class="fb" aria-live="polite"></div></div>`).join('');
  } else if(isMatch(ex.type)){
    hint = ex.type==='headings' ? t('hintHeadings') : t('hintMatch');
    const isEmoji = ex.type==='match' && typeof ex.pairs[0].r==='string' && !/[a-zA-Zа-яА-ЯәіңғүұқөһӘІҢҒҮҰҚӨҺ]/.test(ex.pairs[0].r);
    const left = ex.pairs.map((p,k)=>`<button type="button" class="mt" data-side="l" data-k="${k}" ${typeof p.l==='string'?'lang="en"':''}>${esc(L(p.l))}</button>`);
    const right = st.right.map(k=>`<button type="button" class="mt ${isEmoji?'emoji':''}" data-side="r" data-k="${k}" ${isEmoji?'aria-label="'+esc(L(ex.pairs[k].alt)||ex.pairs[k].r)+'"':''}>${esc(L(ex.pairs[k].r))}</button>`);
    body = `<div class="match">${left.map((l,k)=>l+right[k]).join('')}</div>`;
  } else if(ex.type==='gap'){
    hint = t('hintGap');
    let g=0;
    const txt = st.parts.map((p,k)=> k%2===0 ? esc(p) : `<button type="button" class="gap" data-g="${g++}" aria-label="gap ${g}">____</button>`).join('');
    body = `<p class="gap-text" lang="en">${txt}</p>
      <div class="bank" aria-label="${esc(t('bank'))}"><span class="bank-label">${esc(t('bank'))}</span>${st.bank.map((w,b)=>`<button type="button" class="chip-w" draggable="true" data-b="${b}" lang="en">${esc(w)}</button>`).join('')}</div>`;
  } else if(ex.type==='reflection'){
    hint = t('hintReflect');
    body = `<p class="q-text" lang="en">${esc(ex.q)}</p>
      <textarea class="reflect" rows="4" lang="en" aria-label="${esc(ex.q)}" placeholder="…"></textarea>
      <div class="fb" aria-live="polite"></div>`;
  } else if(isOrder(ex.type)){
    hint = t('hintOrder');
    body = `<ol class="ord-list">${st.seq.map((k,pos)=>`<li class="ord" draggable="true" data-pos="${pos}" data-k="${k}"><span class="num" aria-hidden="true">${pos+1}</span><span class="handle" aria-hidden="true">⋮⋮</span><span class="txt" lang="en">${esc(ex.items[k])}</span>
      <span class="mv"><button type="button" data-mv="-1" aria-label="↑">▲</button><button type="button" data-mv="1" aria-label="↓">▼</button></span></li>`).join('')}</ol>`;
  }
  return `<section class="ex" data-ex="${i}" id="ex-${i}" aria-labelledby="ex-t-${i}">
    <div class="ex-head"><span class="ex-num" aria-hidden="true">${i+1}</span><span class="ex-type">${esc(t('exType')[ex.type])}</span><span class="ex-xp" id="ex-xp-${i}" hidden></span></div>
    <h3 class="ex-inst" id="ex-t-${i}">${esc(L(ex.instruction))}</h3>
    <p class="ex-hint">${esc(hint)}</p>
    <div class="ex-body">${body}</div>
    <div class="ex-foot">
      <div class="ex-result" id="ex-res-${i}"></div>
      <button type="button" class="btn btn-primary" data-check="${i}">✓ ${esc(t('check'))}</button>
      <button type="button" class="btn btn-ghost" data-reveal="${i}">${esc(t('showAnswer'))}</button>
      <button type="button" class="btn btn-secondary" data-retry="${i}" hidden>↻ ${esc(t('tryAgain'))}</button>
    </div></section>`;
}

/* ---------- exercises: interactions ---------- */
function exEl(i){ return $(`#ex-${i}`); }
function refreshMatch(i){
  const el = exEl(i), st = EX[i];
  $$('.mt', el).forEach(b=>{
    const side=b.dataset.side, k=+b.dataset.k;
    b.classList.remove('sel','paired'); const tag=$('.tag',b); if(tag) tag.remove();
    if(side==='l' && st.activeL===k) b.classList.add('sel');
    if(side==='r' && st.activeR===k) b.classList.add('sel');
    let pairNo = null;
    if(side==='l' && st.pairs[k]!==undefined) pairNo = k+1;
    if(side==='r'){ const l = Object.keys(st.pairs).find(l=>st.pairs[l]===k); if(l!==undefined) pairNo = +l+1; }
    if(pairNo){ b.classList.add('paired'); b.insertAdjacentHTML('beforeend', `<span class="tag" aria-hidden="true">${pairNo}</span>`); }
  });
}
function matchTap(i, side, k){
  const st = EX[i]; if(st.checked) return;
  if(side==='l'){
    if(st.pairs[k]!==undefined){ delete st.pairs[k]; st.activeL=null; }
    else st.activeL = (st.activeL===k) ? null : k;
  } else {
    const l = Object.keys(st.pairs).find(l=>st.pairs[l]===k);
    if(l!==undefined){ delete st.pairs[l]; st.activeR=null; }
    else st.activeR = (st.activeR===k) ? null : k;
  }
  if(st.activeL!==null && st.activeR!==null){ st.pairs[st.activeL]=st.activeR; st.activeL=null; st.activeR=null; }
  refreshMatch(i);
}
function refreshGap(i){
  const el = exEl(i), st = EX[i];
  $$('.gap', el).forEach(g=>{
    const k=+g.dataset.g, b = st.fill[k];
    g.classList.toggle('filled', b!==null); g.classList.toggle('active', st.activeGap===k);
    g.textContent = b===null ? '____' : st.bank[b];
  });
  $$('.chip-w', el).forEach(c=>{ c.classList.toggle('used', st.fill.includes(+c.dataset.b)); });
}
function gapPlace(i, k, b){
  const st = EX[i]; if(st.checked) return;
  const prev = st.fill.indexOf(b); if(prev>-1) st.fill[prev]=null;
  st.fill[k]=b; st.activeGap = null;
  const nxt = st.fill.indexOf(null); if(nxt>-1) st.activeGap = nxt;
  refreshGap(i);
}
function gapTap(i, k){
  const st = EX[i]; if(st.checked) return;
  if(st.fill[k]!==null){ st.fill[k]=null; st.activeGap=k; }
  else st.activeGap = (st.activeGap===k) ? null : k;
  refreshGap(i);
}
function chipTap(i, b){
  const st = EX[i]; if(st.checked) return;
  let k = st.activeGap; if(k===null) k = st.fill.indexOf(null);
  if(k===-1 || k===null) return;
  gapPlace(i,k,b);
}
function refreshOrder(i){
  const el = exEl(i), st = EX[i], ex = textById(S.textId).exercises[i];
  $('.ord-list', el).innerHTML = st.seq.map((k,pos)=>`<li class="ord" draggable="true" data-pos="${pos}" data-k="${k}"><span class="num" aria-hidden="true">${pos+1}</span><span class="handle" aria-hidden="true">⋮⋮</span><span class="txt" lang="en">${esc(ex.items[k])}</span>
      <span class="mv"><button type="button" data-mv="-1" aria-label="↑">▲</button><button type="button" data-mv="1" aria-label="↓">▼</button></span></li>`).join('');
}
function orderMove(i, pos, dir, focusDir){
  const st = EX[i]; if(st.checked) return;
  const np = pos+dir; if(np<0 || np>=st.seq.length) return;
  [st.seq[pos], st.seq[np]] = [st.seq[np], st.seq[pos]];
  refreshOrder(i);
  const btn = $(`#ex-${i} .ord[data-pos="${np}"] button[data-mv="${focusDir}"]`); if(btn) btn.focus();
}
function orderDrop(i, from, to){
  const st = EX[i]; if(st.checked || from===to) return;
  const item = st.seq.splice(from,1)[0]; st.seq.splice(to,0,item); refreshOrder(i);
}

/* ---------- exercises: check / reveal / retry ---------- */
let SILENT=false;
function checkEx(i){
  const x = textById(S.textId), ex = x.exercises[i], st = EX[i], el = exEl(i);
  let score=0, total=exTotal(ex);
  if(isChoice(ex.type)){
    choiceItems(ex).forEach((it,k)=>{
      const q = $(`.q[data-k="${k}"]`, el), fb = $('.fb', q), chosen = st.sel[k];
      $$('.opt', q).forEach(o=>{ const j=+o.dataset.j; o.classList.toggle('correct', j===it.a); o.classList.toggle('wrong', chosen===j && j!==it.a); });
      const ok = chosen===it.a; if(ok) score++;
      fb.className = 'fb ' + (ok?'ok':'bad');
      fb.textContent = (ok ? '✅ ' + t('correct') : '❌ ' + t('wrong')) + ' ' + L(it.e);
    });
  } else if(ex.type==='reflection'){
    const ta = $('textarea', el), txt = (ta.value||'').toLowerCase(), fb = $('.fb', el);
    const words = txt.split(/\s+/).filter(Boolean).length;
    const found = ex.keys.filter(alts => alts.some(a => txt.includes(a.toLowerCase())));
    score = words < 8 ? 0 : Math.min(total, found.length);
    ta.disabled = true;
    const missing = ex.keys.filter(k=>!found.includes(k)).map(k=>k[0]);
    fb.className = 'fb ' + (score===total ? 'ok' : 'note');
    fb.innerHTML = (words < 8 ? '✍️ ' + esc(t('reflectShort')) + ' ' : '') + esc(t('reflectFound',{n:found.length,t:ex.keys.length}))
      + (found.length ? ': <b>' + found.map(k=>esc(k[0])).join(', ') + '</b>' : '')
      + (missing.length && score<total ? '<br>💡 ' + esc(t('reflectMissing')) + ' <i>' + missing.map(esc).join(', ') + '</i>' : '');
  } else if(isMatch(ex.type)){
    $$('.mt', el).forEach(b=>{
      const side=b.dataset.side, k=+b.dataset.k;
      let ok;
      if(side==='l') ok = st.pairs[k]===k;
      else { const l = Object.keys(st.pairs).find(l=>st.pairs[l]===k); ok = l!==undefined && +l===k; }
      b.classList.toggle('correct', !!ok); b.classList.toggle('wrong', !ok);
    });
    ex.pairs.forEach((p,k)=>{ if(st.pairs[k]===k) score++; });
  } else if(ex.type==='gap'){
    $$('.gap', el).forEach(g=>{
      const k=+g.dataset.g, b=st.fill[k];
      const ok = b!==null && norm(st.bank[b])===norm(st.answers[k]);
      if(ok) score++;
      g.classList.toggle('correct', ok); g.classList.toggle('wrong', !ok);
      if(!ok){ g.innerHTML = (b!==null? `<s>${esc(st.bank[b])}</s> `:'') + `<b>${esc(st.answers[k])}</b>`; g.style.textDecoration='none'; }
    });
  } else if(isOrder(ex.type)){
    $$('.ord', el).forEach(li=>{ const ok = +li.dataset.k===+li.dataset.pos; li.classList.toggle('correct', ok); li.classList.toggle('wrong', !ok); });
    st.seq.forEach((k,pos)=>{ if(k===pos) score++; });
    if(score<total){ const ord = $('.ord-list', el); ord.insertAdjacentHTML('afterend', `<div class="ex-expl" style="margin-top:12px"><b>✓</b> ${ex.items.map((s,k)=>`${k+1}. ${esc(s)}`).join(' ')}</div>`); }
  }
  st.checked = true; el.classList.add('is-checked');
  const res = $(`#ex-res-${i}`);
  res.className = 'ex-result ' + (score===total ? 'ok' : score>0 ? 'part' : 'bad');
  res.textContent = (score===total ? '🎉 ' + t('allCorrect') : score>0 ? '👍 ' + t('answered',{n:score,t:total}) : '💪 ' + t('none'));
  if(ex.explanation && (score<total || !isChoice(ex.type))){ res.insertAdjacentHTML('afterend', `<div class="ex-expl">💡 ${esc(L(ex.explanation))}</div>`); }
  $(`[data-check="${i}"]`, el).hidden = true; $(`[data-reveal="${i}"]`, el).hidden = score===total && ex.type!=='reflection'; $(`[data-retry="${i}"]`, el).hidden = false;
  // XP & progress
  const p = prog(x.id), prev = p.ex[i] ? p.ex[i].score : 0;
  const newXp = Math.round(XP_PER_EX*score/total), oldXp = Math.round(XP_PER_EX*prev/total);
  if(score>prev){ p.ex[i] = {score, total}; }
  if(newXp>oldXp && !SILENT){ S.xp += newXp-oldXp; toast('⭐ ' + t('xpToast',{n:newXp-oldXp})); $('#xp-val').textContent = S.xp; }
  save(); updateExXP(i);
  res.focus && res.setAttribute('tabindex','-1'); res.focus();
}
function updateExXP(i){
  const x = textById(S.textId), p = S.progress[x.id]; const badge = $(`#ex-xp-${i}`); if(!badge) return;
  if(p && p.ex[i]){ const ex = x.exercises[i]; badge.hidden=false; badge.textContent = `⭐ ${Math.round(XP_PER_EX*p.ex[i].score/exTotal(ex))}/${XP_PER_EX} XP`; }
}
function revealEx(i){
  const x = textById(S.textId), ex = x.exercises[i], st = EX[i], el = exEl(i);
  if(ex.type==='reflection'){
    const foot = $('.ex-foot', el);
    if(!$('.model', el)) foot.insertAdjacentHTML('beforebegin', `<div class="ex-expl model"><b>💬 ${esc(t('modelAnswer'))}:</b> <span lang="en">${esc(ex.model)}</span></div>`);
    $(`[data-reveal="${i}"]`, el).hidden = true; return;
  }
  if(st.checked){ retryEx(i, true); }
  const st2 = EX[i];
  if(isChoice(ex.type)) choiceItems(ex).forEach((it,k)=>{ st2.sel[k]=it.a; });
  else if(isMatch(ex.type)){ st2.pairs={}; ex.pairs.forEach((p,k)=>{ st2.pairs[k]=k; }); refreshMatch(i); }
  else if(ex.type==='gap'){ st2.fill = st2.answers.map(a => st2.bank.indexOf(a)); refreshGap(i); }
  else if(isOrder(ex.type)){ st2.seq = ex.items.map((_,k)=>k); refreshOrder(i); }
  st2.revealed = true;
  if(isChoice(ex.type)) $$('.opt', el).forEach(o=>o.setAttribute('aria-checked', String(st2.sel[+o.dataset.k]===+o.dataset.j)));
  // mark visually without awarding XP
  checkExVisualOnly(i);
}
function checkExVisualOnly(i){
  const x = textById(S.textId), p = prog(x.id), saved = p.ex[i] ? {...p.ex[i]} : null, xp = S.xp;
  SILENT = true; try{ checkEx(i); } finally { SILENT = false; }
  if(saved) p.ex[i] = saved; else delete p.ex[i];
  S.xp = xp; $('#xp-val').textContent = S.xp; save(); updateExXP(i);
  const res = $(`#ex-res-${i}`); res.className='ex-result part'; res.textContent = '👀 ' + t('revealed');
  const el = exEl(i); $(`[data-reveal="${i}"]`, el).hidden = true;
}
function retryEx(i, silent){
  const x = textById(S.textId), ex = x.exercises[i];
  EX[i] = initEx(ex, i);
  const el = exEl(i); el.outerHTML = exHTML(x, ex, i); updateExXP(i);
  if(!silent){ const n = exEl(i); n.scrollIntoView({block:'start'}); const f = $('button', n); if(f) f.focus(); }
}

/* ---------- result view ---------- */
function viewResult(){
  const x = textById(S.textId), p = prog(x.id), sc = textScore(x);
  p.done = true; save();
  const xpText = x.exercises.reduce((a,ex,i)=> a + (p.ex[i] ? Math.round(XP_PER_EX*p.ex[i].score/exTotal(ex)) : 0), 0);
  const doneCount = x.exercises.filter((ex,i)=>p.ex[i]).length;
  const mood = sc.pct>=90 ? t('great') : sc.pct>=60 ? t('good') : t('keep');
  const emoji = sc.pct>=90 ? '🏆' : sc.pct>=60 ? '🎉' : '💪';
  const review = x.exercises.map((ex,i)=>({ex,i,s:p.ex[i]})).filter(o=>!o.s || o.s.score<exTotal(o.ex));
  const list = (DATA[x.level]||[]); const idx = list.findIndex(y=>y.id===x.id);
  let next = null;
  for(let k=1;k<=list.length;k++){ const c = list[(idx+k)%list.length]; if(c.id!==x.id && !(S.progress[c.id]&&S.progress[c.id].done)){ next=c; break; } }
  if(!next && list.length>1) next = list[(idx+1)%list.length];
  return `<div class="result">
    <div class="hero g-${x.genre}"><h1>${emoji} ${esc(mood)}</h1><div class="meta"><span lang="en">${esc(x.title)}</span></div></div>
    <div class="stats">
      <div class="stat"><b>${xpText}</b><span>⭐ ${esc(t('xpEarned'))}</span></div>
      <div class="stat"><b>${sc.pct}%</b><span>✅ ${esc(t('score'))} ${sc.got}/${sc.total}</span></div>
      <div class="stat"><b>${doneCount}/${x.exercises.length}</b><span>✏️ ${esc(t('tasksDone'))}</span></div>
    </div>
    <section class="panel"><h2 class="section-label">🔁 ${esc(t('review'))}</h2>
      ${review.length ? `<ul class="review-list">${review.map(o=>`<li><span>${o.i+1}. ${esc(t('exType')[o.ex.type])}</span><span class="hint">${o.s?o.s.score:0}/${exTotal(o.ex)}</span><button type="button" class="btn btn-secondary btn-sm" data-goto="${o.i}">${esc(t('open'))}</button></li>`).join('')}</ul>` : `<p style="font-weight:600">🌟 ${esc(t('nothingReview'))}</p>`}
    </section>
    <section class="panel"><h2 class="section-label">🔑 ${esc(t('wordsReview'))}</h2>
      <ul class="words compact" style="list-style:none;padding:0;margin:0">${x.words.map(w=>`<li class="word"><div class="word-main"><div class="word-top"><span class="en" lang="en">${esc(w.en)}</span><span class="tr">${esc(w.tr)}</span></div><div class="word-tr"><span class="flag">RU</span><span lang="ru">${esc(w.ru)}</span></div><div class="word-tr"><span class="flag">KZ</span><span lang="kk">${esc(w.kz)}</span></div></div><button type="button" class="say" data-say="${esc(w.en)}" aria-label="🔊 ${esc(w.en)}">🔊</button></li>`).join('')}</ul>
    </section>
    <div class="actions">
      ${next ? `<button type="button" class="btn btn-primary" data-open="${next.id}">${esc(t('readNext'))}: ${esc(next.title)} →</button>` : ''}
      <button type="button" class="btn btn-ghost" data-action="home">📚 ${esc(t('toLibrary'))}</button>
    </div></div>`;
}

/* ---------- events ---------- */
function openText(id){ S.textId = id; S.screen='read'; S.tab='text'; save(); render(); }
document.addEventListener('click', e=>{
  const wEl = e.target.closest('.article .w'); if(wEl){ showPop(wEl, textById(S.textId)); return; }
  const b = e.target.closest('button, a[data-action]');
  if(!b){ if(!e.target.closest('#pop')) hidePop(); return; }
  if(b.dataset.action){
    e.preventDefault();
    switch(b.dataset.action){
      case 'home': S.screen='library'; S.textId=null; render(); return;
      case 'drawer-open': openDrawer(); return;
      case 'drawer-close': closeDrawer(); return;
      case 'pop-close': hidePop(); return;
      case 'tts-start': ttsStart(); return;
      case 'tts-toggle': if(TTS.playing) ttsStop(); else { if(S.tab!=='text' && window.innerWidth<1024){ S.tab='text'; setTab('text'); } ttsStart(); } return;
      case 'tts-pause': ttsPauseResume(); return;
      case 'tts-stop': ttsStop(); return;
      case 'finish': S.screen='result'; render(); return;
    }
  }
  if(b.dataset.lang){ S.lang=b.dataset.lang; save(); if(!$('#drawer').hidden) renderDrawer(); render(); return; }
  if(b.dataset.set){ const v = b.dataset.val; S[b.dataset.set] = isNaN(+v) ? v : +v; save(); applySettings(); renderDrawer(); $(`[data-set="${b.dataset.set}"][data-val="${v}"]`).focus(); return; }
  if(b.dataset.toggle){ S[b.dataset.toggle] = !S[b.dataset.toggle]; save(); applySettings(); renderDrawer(); $(`[data-toggle="${b.dataset.toggle}"]`).focus(); return; }
  if(b.dataset.fs){ const sizes=[16,20,24,30]; let i = sizes.indexOf(S.fs); if(i<0) i=1; i = Math.min(3, Math.max(0, i + (+b.dataset.fs))); S.fs = sizes[i]; save(); applySettings(); return; }
  if(b.dataset.level){ S.level=b.dataset.level; save(); render(); return; }
  if(b.dataset.genre){ S.genre=b.dataset.genre; save(); render(); return; }
  if(b.dataset.open){ openText(b.dataset.open); return; }
  if(b.dataset.tab){ setTab(b.dataset.tab); return; }
  if(b.dataset.say){ sayWord(b.dataset.say); return; }
  if(b.dataset.goto!==undefined){ S.screen='read'; S.tab='ex'; render(); const el = exEl(+b.dataset.goto); if(el){ el.scrollIntoView({block:'start'}); } return; }
  if(b.dataset.check){ checkEx(+b.dataset.check); return; }
  if(b.dataset.reveal){ revealEx(+b.dataset.reveal); return; }
  if(b.dataset.retry){ retryEx(+b.dataset.retry); return; }
  const exSec = b.closest('.ex'); if(exSec){
    const i = +exSec.dataset.ex;
    if(b.classList.contains('opt')){ const st=EX[i]; if(st.checked) return; st.sel[+b.dataset.k]=+b.dataset.j; $$('.opt', b.parentElement).forEach(o=>o.setAttribute('aria-checked', String(o===b))); return; }
    if(b.classList.contains('mt')){ matchTap(i, b.dataset.side, +b.dataset.k); return; }
    if(b.classList.contains('gap')){ gapTap(i, +b.dataset.g); return; }
    if(b.classList.contains('chip-w')){ chipTap(i, +b.dataset.b); return; }
    if(b.dataset.mv){ const li=b.closest('.ord'); orderMove(i, +li.dataset.pos, +b.dataset.mv, b.dataset.mv); return; }
  }
  if(b.classList.contains('w')){ showPop(b, textById(S.textId)); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ hidePop(); if(!$('#drawer').hidden) closeDrawer(); }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('w')){ e.preventDefault(); showPop(e.target, textById(S.textId)); }
});
$('#btn-settings').addEventListener('click', ()=>{ if($('#drawer').hidden) openDrawer(); else closeDrawer(); });
$('#backdrop').addEventListener('click', closeDrawer);
function setTab(tab){ S.tab=tab; const g=$('.read-grid'); if(g) g.dataset.tab=tab; $$('[role="tab"]').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===tab))); }

/* drag & drop: gaps and order */
let DRAG = null;
document.addEventListener('dragstart', e=>{
  const chip = e.target.closest && e.target.closest('.chip-w'); const ord = e.target.closest && e.target.closest('.ord');
  if(chip){ DRAG={kind:'chip', i:+chip.closest('.ex').dataset.ex, b:+chip.dataset.b}; chip.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', chip.textContent);}catch(err){} }
  else if(ord){ DRAG={kind:'ord', i:+ord.closest('.ex').dataset.ex, pos:+ord.dataset.pos}; ord.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', ord.textContent);}catch(err){} }
});
document.addEventListener('dragend', e=>{ $$('.dragging').forEach(x=>x.classList.remove('dragging')); $$('.over').forEach(x=>x.classList.remove('over')); DRAG=null; });
document.addEventListener('dragover', e=>{
  if(!DRAG) return;
  const tgt = DRAG.kind==='chip' ? e.target.closest('.gap') : e.target.closest('.ord');
  if(tgt && +tgt.closest('.ex').dataset.ex===DRAG.i){ e.preventDefault(); e.dataTransfer.dropEffect='move'; $$('.over').forEach(x=>{ if(x!==tgt) x.classList.remove('over'); }); tgt.classList.add('over'); }
});
document.addEventListener('dragleave', e=>{ const tgt = e.target.closest && e.target.closest('.gap, .ord'); if(tgt) tgt.classList.remove('over'); });
document.addEventListener('drop', e=>{
  if(!DRAG) return;
  if(DRAG.kind==='chip'){ const g = e.target.closest('.gap'); if(g && +g.closest('.ex').dataset.ex===DRAG.i){ e.preventDefault(); gapPlace(DRAG.i, +g.dataset.g, DRAG.b); } }
  else { const o = e.target.closest('.ord'); if(o && +o.closest('.ex').dataset.ex===DRAG.i){ e.preventDefault(); orderDrop(DRAG.i, DRAG.pos, +o.dataset.pos); } }
  $$('.over').forEach(x=>x.classList.remove('over')); DRAG=null;
});
window.addEventListener('resize', ()=>{ hidePop(); });
window.addEventListener('beforeunload', ()=>{ if(hasTTS) speechSynthesis.cancel(); });

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', ()=>{ load(); if(!DATA[S.level] || !DATA[S.level].length) S.level='A1'; render(); });
})();
</script>
<script>
/* ============================================================
   DICT — offline word translations for tap-to-translate: word: [RU, KZ]
   Plural / -s / -ing / -ed forms fall back to the base form automatically.
   ============================================================ */

  task:{en:"Read and find out: why is flying on Mars so hard?",ru:"Прочитайте и узнайте: почему летать на Марсе так трудно?",kz:"Оқып, біліңіз: Марста ұшу неге қиын?"},
  words:[

      {s:"The air on Mars is very thin.",a:true,e:{en:"“The air on Mars is very thin.”",ru:"«The air on Mars is very thin.»",kz:"«The air on Mars is very thin.»"}},
      {s:"Ingenuity made 72 flights.",a:true,e:{en:"“But it made 72 flights!”",ru:"«But it made 72 flights!» — 72 полёта.",kz:"«But it made 72 flights!» — 72 рет ұшты."}},
      {s:"Ingenuity can fly for many hours.",a:false,e:{en:"“It can fly for only a few minutes.”",ru:"«It can fly for only a few minutes.» — всего несколько минут.",kz:"«It can fly for only a few minutes.» — бірнеше минут қана."}}
    ]},

{ id:"a1-nat-swift", level:"A1", genre:"nature", title:"Ten Months in the Sky", cover:{emoji:"🐦"},
  task:{en:"Read and find out: how does the swift sleep?",ru:"Прочитайте и узнайте: как спит стриж?",kz:"Оқып, біліңіз: ұзынқанат қалай ұйықтайды?"},
  words:[
    {en:"swift",tr:"/swɪft/",ru:"стриж",kz:"ұзынқанат (құс)",ex:"The bird is the common swift."},
    {en:"month",tr:"/mʌnθ/",ru:"месяц",kz:"ай",ex:"Some birds fly and don't stop for ten months!"},
    {en:"sky",tr:"/skaɪ/",ru:"небо",kz:"аспан",ex:"Then the family goes back into the sky."},
    {en:"brain",tr:"/breɪn/",ru:"мозг",kz:"ми",ex:"One part of its brain sleeps."},
    {en:"nest",tr:"/nest/",ru:"гнездо",kz:"ұя",ex:"Its nest is under a roof."},
    {en:"roof",tr:"/ruːf/",ru:"крыша",kz:"шатыр",ex:"Its nest is under a roof."}
  ],
  text:[
    "Some birds fly and don't stop for ten months! The bird is the common swift. It is small, dark and very fast. It eats in the air. It drinks in the air. It even sleeps in the air.",
    "How can a bird sleep and fly? Scientists think the swift sleeps for short moments. It goes very high in the evening. Then it comes down slowly. One part of its brain sleeps. The other part does not sleep.",
    "The swift only stops to have babies. Its nest is under a roof. The babies learn to fly. Then the family goes back into the sky. Look up in summer. Maybe a swift is over your head now."
  ],
  exercises:[
    {type:"mc",instruction:INS.mc,items:[
      {q:"How long can a swift fly and not stop?",o:["ten days","ten months","ten years"],a:1,e:{en:"“Some birds fly and don't stop for ten months!”",ru:"«…for ten months» — десять месяцев.",kz:"«…for ten months» — он ай."}},
      {q:"Where does the swift eat?",o:["in the air","on the ground","in the water"],a:0,e:{en:"“It eats in the air.”",ru:"«It eats in the air.» — в воздухе.",kz:"«It eats in the air.» — ауада."}},
      {q:"When does the swift go very high?",o:["in the morning","at lunch","in the evening"],a:2,e:{en:"“It goes very high in the evening.”",ru:"«It goes very high in the evening.» — вечером.",kz:"«It goes very high in the evening.» — кешке."}},
      {q:"Why does the swift stop?",o:["to drink","to have babies","to sleep"],a:1,e:{en:"“The swift only stops to have babies.”",ru:"«The swift only stops to have babies.» — чтобы вывести птенцов.",kz:"«The swift only stops to have babies.» — балапан шығару үшін."}}
    ]},
    {type:"wwmatch",instruction:INS.ww,explanation:EXPL.ww,pairs:[
      {l:"What is small, dark and fast?",r:"the swift"},{l:"Where does the swift sleep?",r:"in the air"},{l:"Where is its nest?",r:"under a roof"},
      {l:"What sleeps — but only one part of it?",r:"its brain"},{l:"When can you see swifts?",r:"in summer"}
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"The swift eats and drinks",o:["in the air","in the nest","in the sea"],a:0,e:{en:"“It eats in the air. It drinks in the air.”",ru:"«It eats in the air. It drinks in the air.»",kz:"«It eats in the air. It drinks in the air.»"}},
      {s:"One part of its brain",o:["is very big","sleeps","flies"],a:1,e:{en:"“One part of its brain sleeps.”",ru:"«One part of its brain sleeps.» — спит.",kz:"«One part of its brain sleeps.» — ұйықтайды."}},
      {s:"The babies learn to fly and then",o:["they go to school","they sleep on the roof","the family goes back into the sky"],a:2,e:{en:"“Then the family goes back into the sky.”",ru:"«Then the family goes back into the sky.»",kz:"«Then the family goes back into the sky.»"}},
      {s:"Maybe a swift is",o:["in your house","over your head now","under the roof of your school"],a:1,e:{en:"“Maybe a swift is over your head now.”",ru:"«…over your head now» — над вашей головой.",kz:"«…over your head now» — дәл қазір төбеңізде."}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"The swift can fly for ten {months}. It eats and sleeps in the {air}. In the evening it goes very {high}. Its {nest} is under a roof. Look {up} in summer.",
     extra:["low","water"]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"The swift is big and white.",a:false,e:{en:"“It is small, dark and very fast.”",ru:"«It is small, dark and very fast.» — маленький и тёмный.",kz:"«It is small, dark and very fast.» — кішкентай әрі қара."}},

      {s:"Its nest is under a roof.",a:true,e:{en:"“Its nest is under a roof.”",ru:"«Its nest is under a roof.»",kz:"«Its nest is under a roof.»"}},
      {s:"You can see swifts in summer.",a:true,e:{en:"“Look up in summer.”",ru:"«Look up in summer.» — летом.",kz:"«Look up in summer.» — жазда."}}
    ]}
  ]},

{ id:"a1-peo-windmill", level:"A1", genre:"people", title:"The Boy Who Made Wind Into Light", cover:{emoji:"🌬️"},
  task:{en:"Read and find out: what did William make from a bicycle?",ru:"Прочитайте и узнайте: что Уильям сделал из велосипеда?",kz:"Оқып, біліңіз: Уильям велосипедтен не жасады?"},
  words:[
    {en:"village",tr:"/ˈvɪlɪdʒ/",ru:"деревня",kz:"ауыл",ex:"His home was a village in Malawi, Africa."},
    {en:"library",tr:"/ˈlaɪbrəri/",ru:"библиотека",kz:"кітапхана",ex:"But there was a library in the village."},
    {en:"wind",tr:"/wɪnd/",ru:"ветер",kz:"жел",ex:"William found a book about wind and electricity."},
    {en:"electricity",tr:"/ɪˌlekˈtrɪsəti/",ru:"электричество",kz:"электр",ex:"But the windmill made electricity."},
    {en:"windmill",tr:"/ˈwɪndmɪl/",ru:"ветряная мельница",kz:"жел диірмені",ex:"William made a windmill from old things."},
    {en:"idea",tr:"/aɪˈdɪə/",ru:"идея",kz:"идея",ex:"William saw the pictures and he had an idea."}
  ],
  text:[
    "In 2002 William was fourteen. His home was a village in Malawi, Africa. That year there was no rain. There was no food and no money. There was no money for school.",
    "But there was a library in the village. William found a book about wind and electricity. The book was in English. William saw the pictures and he had an idea.",
    "William made a windmill from old things. He had a bicycle, wood and plastic. People said, “He is crazy!” But the windmill made electricity. There was light in his house! Today William helps children in Africa to study. One book, one idea, one boy."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"A boy of fourteen has got no money and no school. What can he do?",o:["Nothing.","He can go to a library.","He can sleep."],a:1,
       e:{en:"William went to the library and found a book. That was the start.",ru:"Уильям пошёл в библиотеку и нашёл книгу. С этого всё началось.",kz:"Уильям кітапханаға барып, кітап тапты. Бәрі содан басталды."}}
    ]},
    {type:"mc",instruction:INS.mc,items:[
      {q:"Where was William's home?",o:["in a big city","in a village in Africa","in England"],a:1,e:{en:"“His home was a village in Malawi, Africa.”",ru:"«His home was a village in Malawi, Africa.»",kz:"«His home was a village in Malawi, Africa.»"}},
      {q:"What was in the library for William?",o:["a computer","a bicycle","a book about wind"],a:2,e:{en:"“William found a book about wind and electricity.”",ru:"«…a book about wind and electricity» — книга о ветре и электричестве.",kz:"«…a book about wind and electricity» — жел мен электр туралы кітап."}},
      {q:"What was in the windmill?",o:["a bicycle","a car","a phone"],a:0,e:{en:"“He had a bicycle, wood and plastic.”",ru:"«He had a bicycle, wood and plastic.» — велосипед, дерево и пластик.",kz:"«He had a bicycle, wood and plastic.» — велосипед, ағаш және пластик."}},
      {q:"What does William do today?",o:["He makes bicycles.","He helps children to study.","He is a farmer."],a:1,e:{en:"“Today William helps children in Africa to study.”",ru:"«Today William helps children in Africa to study.»",kz:"«Today William helps children in Africa to study.»"}}
    ]},
    {type:"match",instruction:INS.matchT,explanation:EXPL.match,pairs:[
      {l:"windmill",r:{en:"a machine that turns in the wind",ru:"ветряная мельница",kz:"жел диірмені"}},{l:"electricity",r:{en:"it makes lamps work",ru:"электричество",kz:"электр"}},
      {l:"library",r:{en:"a house with many books",ru:"библиотека",kz:"кітапхана"}},{l:"village",r:{en:"a very small town",ru:"деревня",kz:"ауыл"}},
      {l:"idea",r:{en:"a new thought",ru:"идея",kz:"идея"}}
    ]},
    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "There is no rain, no food and no money for school.","William goes to the library.","He finds a book about wind and electricity.","He makes a windmill from a bicycle, wood and plastic.","The windmill makes light for his house."
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"In 2002 William was",o:["ten","fourteen","forty"],a:1,e:{en:"“In 2002 William was fourteen.”",ru:"«In 2002 William was fourteen.» — четырнадцать.",kz:"«In 2002 William was fourteen.» — он төрт."}},
      {s:"William found a book about",o:["Africa","animals","wind and electricity"],a:2,e:{en:"“…a book about wind and electricity.”",ru:"«…a book about wind and electricity.»",kz:"«…a book about wind and electricity.»"}},

{ id:"a1-cul-apples", level:"A1", genre:"culture", title:"The City of Apples", cover:{emoji:"🍎"},
  task:{en:"Read and find out: where do apples come from?",ru:"Прочитайте и узнайте: откуда родом яблоки?",kz:"Оқып, біліңіз: алма қайдан шыққан?"},
  words:[

  text:[

      {s:"The apple festival is in spring.",a:false,e:{en:"“In autumn there is an apple festival.”",ru:"«In autumn» — осенью.",kz:"«In autumn» — күзде."}}

    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,

    {type:"wwmatch",instruction:INS.ww,explanation:EXPL.ww,pairs:[
      {l:"Where do apples come from?",r:"the mountains near Almaty"},{l:"What does alma mean?",r:"apple"},{l:"What is the Aport?",r:"a very big apple"},

    {type:"mc",instruction:INS.mc,items:[
      {q:"What helps scientists to find the home of apples?",o:["a map","DNA","an old book"],a:1,e:{en:"“Scientists found this with the help of DNA.”",ru:"«…with the help of DNA» — с помощью ДНК.",kz:"«…with the help of DNA» — ДНҚ көмегімен."}},

    ]},

{ id:"a1-adv-cave", level:"A1", genre:"adventure", title:"The Cave Under the Hill", cover:{emoji:"🔦"},
  task:{en:"Read and find out: what do the children find on the wall?",ru:"Прочитайте и узнайте: что дети находят на стене?",kz:"Оқып, біліңіз: балалар қабырғадан не табады?"},
  words:[
    {en:"cave",tr:"/keɪv/",ru:"пещера",kz:"үңгір",ex:"Don't go into the cave."},
    {en:"torch",tr:"/tɔːtʃ/",ru:"фонарик",kz:"қол шам",ex:"But Arman and Lena have got a torch."},
    {en:"dark",tr:"/dɑːk/",ru:"тёмный",kz:"қараңғы",ex:"The cave is dark and wet."},

    {en:"hole",tr:"/həʊl/",ru:"дыра, отверстие",kz:"тесік",ex:"It comes from a hole in the wall."},
    {en:"wall",tr:"/wɔːl/",ru:"стена",kz:"қабырға",ex:"There is an old picture on the wall."}
  ],
  text:[
    "“Don't go into the cave,” says Grandpa. But Arman and Lena have got a torch. And they have got a question: what is inside?",
    "The cave is dark and wet. Water drops from the roof. The children walk slowly. Then the torch goes off! It is very dark. Lena can't see her hand. “Don't move,” says Arman. “Wait.”",
    "After a minute they can see a small light. It comes from a hole in the wall. They go to the light. It is a way out! They are on the hill, in the sun. There is an old picture on the wall. It is a horse. Somebody was here a long time ago."
  ],
  exercises:[

      {q:"Who says “Don't go into the cave”?",o:["Lena","Arman","Grandpa"],a:2,e:{en:"“‘Don't go into the cave,’ says Grandpa.”",ru:"Это говорит дедушка.",kz:"Мұны атасы айтады."}},
      {q:"What have the children got?",o:["a torch","a horse","a phone"],a:0,e:{en:"“But Arman and Lena have got a torch.”",ru:"«…have got a torch» — фонарик.",kz:"«…have got a torch» — қол шам."}},
      {q:"What happens in the cave?",o:["It rains.","The torch goes off.","They see Grandpa."],a:1,e:{en:"“Then the torch goes off!”",ru:"«Then the torch goes off!» — фонарик гаснет.",kz:"«Then the torch goes off!» — қол шам сөніп қалады."}},
      {q:"Where does the light come from?",o:["from a hole in the wall","from the torch","from the water"],a:0,e:{en:"“It comes from a hole in the wall.”",ru:"«It comes from a hole in the wall.»",kz:"«It comes from a hole in the wall.»"}}
    ]},
    {type:"wwmatch",instruction:INS.ww,explanation:EXPL.ww,pairs:[

      {l:"What is on the wall?",r:"an old picture of a horse"},{l:"Where are the children at the end?",r:"on the hill, in the sun"}
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"The cave is",o:["hot and dry","dark and wet","big and red"],a:1,e:{en:"“The cave is dark and wet.”",ru:"«The cave is dark and wet.» — тёмная и мокрая.",kz:"«The cave is dark and wet.» — қараңғы әрі дымқыл."}},
      {s:"Lena can't see",o:["her hand","the horse","Grandpa"],a:0,e:{en:"“Lena can't see her hand.”",ru:"«Lena can't see her hand.»",kz:"«Lena can't see her hand.»"}},

    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"Grandpa says: “Don't go into the {cave}.” The children have got a {torch}. Water {drops} from the roof. The light comes from a {hole} in the wall. On the wall there is a picture of a {horse}.",

/* ───────── 11 · MYSTERY ───────── */
{ id:"a1-mys-bread", level:"A1", genre:"mystery", title:"Who Eats the Bread?", cover:{emoji:"🦜"},
  task:{en:"Read and find out: who eats the bread at night?",ru:"Прочитайте и узнайте: кто ест хлеб по ночам?",kz:"Оқып, біліңіз: түнде нанды кім жейді?"},
  words:[
    {en:"bread",tr:"/bred/",ru:"хлеб",kz:"нан",ex:"Every morning the bread is not there."},
    {en:"plan",tr:"/plæn/",ru:"план",kz:"жоспар",ex:"Grandma has got a plan."},
    {en:"kitchen",tr:"/ˈkɪtʃɪn/",ru:"кухня",kz:"ас үй",ex:"She sits in the dark kitchen."},
    {en:"noise",tr:"/nɔɪz/",ru:"шум",kz:"шу",ex:"At two o'clock she hears a noise."},
    {en:"parrot",tr:"/ˈpærət/",ru:"попугай",kz:"тотықұс",ex:"And she sees… her parrot, Kesha!"},
    {en:"cage",tr:"/keɪdʒ/",ru:"клетка",kz:"тор",ex:"The parrot's cage is open."}
  ],
  text:[
    "Every morning the bread is not there. Grandma buys bread in the evening. She puts it on the table. In the morning — no bread! “Who eats my bread?” she says.",
    "Grandma has got a plan. On Sunday night she doesn't go to bed. She sits in the dark kitchen. She waits. At two o'clock she hears a noise. Somebody is in the kitchen! Grandma turns on the light.",
    "And she sees… her parrot, Kesha! The parrot's cage is open. Kesha is on the table with the bread. “Good morning!” says the parrot. Grandma laughs. Now she closes the cage every night. And the bread is always there."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"The bread is not there every morning. Who eats it?",o:["a mouse","a parrot","a neighbour"],a:1,
       e:{en:"It is Grandma's parrot, Kesha! His cage is open at night.",ru:"Это попугай бабушки, Кеша! Ночью его клетка открыта.",kz:"Бұл әженің тотықұсы Кеша! Түнде оның торы ашық тұрады."}}
    ]},
    {type:"mc",instruction:INS.mc,items:[
      {q:"When does Grandma buy bread?",o:["in the morning","at two o'clock","in the evening"],a:2,e:{en:"“Grandma buys bread in the evening.”",ru:"«Grandma buys bread in the evening.» — вечером.",kz:"«Grandma buys bread in the evening.» — кешке."}},
      {q:"Where does Grandma sit on Sunday night?",o:["in the dark kitchen","in bed","in the garden"],a:0,e:{en:"“She sits in the dark kitchen.”",ru:"«She sits in the dark kitchen.»",kz:"«She sits in the dark kitchen.»"}},
      {q:"What is open?",o:["the door","the window","the parrot's cage"],a:2,e:{en:"“The parrot's cage is open.”",ru:"«The parrot's cage is open.» — клетка попугая.",kz:"«The parrot's cage is open.» — тотықұстың торы."}},
      {q:"What does Grandma do now?",o:["She buys no bread.","She closes the cage every night.","She sleeps in the kitchen."],a:1,e:{en:"“Now she closes the cage every night.”",ru:"«Now she closes the cage every night.»",kz:"«Now she closes the cage every night.»"}}
    ]},
    {type:"match",instruction:INS.matchT,explanation:EXPL.match,pairs:[
      {l:"parrot",r:{en:"a bird that can talk",ru:"попугай",kz:"тотықұс"}},{l:"cage",r:{en:"a small house for a bird",ru:"клетка",kz:"тор"}},
      {l:"noise",r:{en:"a sound",ru:"шум",kz:"шу"}},{l:"kitchen",r:{en:"the room where you cook",ru:"кухня",kz:"ас үй"}},
      {l:"plan",r:{en:"an idea of what to do",ru:"план",kz:"жоспар"}}
    ]},
    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "Grandma buys bread in the evening.","In the morning the bread is not there.","On Sunday night Grandma waits in the dark kitchen.","At two o'clock she hears a noise and turns on the light.","She sees her parrot Kesha with the bread!"
    ]},
    {type:"finish",instruction:INS.finish,items:[
      {s:"Every morning the bread",o:["is on the table","is not there","is very old"],a:1,e:{en:"“Every morning the bread is not there.”",ru:"«Every morning the bread is not there.»",kz:"«Every morning the bread is not there.»"}},
      {s:"Grandma hears a noise at",o:["two o'clock","ten o'clock","six o'clock"],a:0,e:{en:"“At two o'clock she hears a noise.”",ru:"«At two o'clock she hears a noise.» — в два часа.",kz:"«At two o'clock she hears a noise.» — сағат екіде."}},
      {s:"The parrot says:",o:["“I am hungry!”","“Good night!”","“Good morning!”"],a:2,e:{en:"“‘Good morning!’ says the parrot.”",ru:"«Good morning!» — «Доброе утро!»",kz:"«Good morning!» — «Қайырлы таң!»"}},
      {s:"Now Grandma closes",o:["the kitchen","the window","the cage"],a:2,e:{en:"“Now she closes the cage every night.”",ru:"«Now she closes the cage every night.» — клетку.",kz:"«Now she closes the cage every night.» — торды."}}
    ]}
  ]},

/* ───────── 12 · HISTORY ───────── */
{ id:"a1-his-shoe", level:"A1", genre:"history", title:"A Shoe From Five Thousand Years Ago", cover:{emoji:"👞"},
  task:{en:"Read and find out: why is the old shoe like new?",ru:"Прочитайте и узнайте: почему старый ботинок как новый?",kz:"Оқып, біліңіз: ескі аяқ киім неге жаңадай?"},
  words:[
    {en:"ground",tr:"/ɡraʊnd/",ru:"земля",kz:"жер",ex:"In the ground they found a shoe."},
    {en:"leather",tr:"/ˈleðə/",ru:"кожа (материал)",kz:"былғары",ex:"It was a small leather shoe with a string."},
    {en:"string",tr:"/strɪŋ/",ru:"шнурок, верёвка",kz:"бау",ex:"It was a small leather shoe with a string."},
    {en:"dry",tr:"/draɪ/",ru:"сухой",kz:"құрғақ",ex:"The cave was dry and cool."},
    {en:"grass",tr:"/ɡrɑːs/",ru:"трава",kz:"шөп",ex:"There was grass in the shoe."},
    {en:"museum",tr:"/mjuˈziːəm/",ru:"музей",kz:"мұражай",ex:"The shoe is now in a museum in Yerevan."}
  ],
  text:[
    "In 2008 scientists went into a cave in Armenia. It was dark and cold. In the ground they found a shoe. It was a small leather shoe with a string. It was 5,500 years old!",
    "The shoe was not broken. Why? The cave was dry and cool. There was grass in the shoe. So the shoe was like new. It is size 37 — a woman's size today.",
    "Whose shoe was it? A man's or a woman's? Nobody knows. But we know one thing. Five thousand years ago people had shoes. They had strings and warm feet. Now the shoe is in a museum in Yerevan."
  ],
  exercises:[
    {type:"tf",instruction:INS.tf,items:[
      {s:"The shoe was in a river.",a:false,e:{en:"“In the ground they found a shoe.” It was in a cave.",ru:"«In the ground they found a shoe.» — в земле, в пещере.",kz:"«In the ground they found a shoe.» — жерден, үңгірде."}},
      {s:"Scientists found the shoe in 2008.",a:true,e:{en:"“In 2008 scientists went into a cave in Armenia.”",ru:"«In 2008 scientists went into a cave…»",kz:"«In 2008 scientists went into a cave…»"}},
      {s:"There was grass in the shoe.",a:true,e:{en:"“There was grass in the shoe.”",ru:"«There was grass in the shoe.»",kz:"«There was grass in the shoe.»"}},
      {s:"The cave was wet and hot.",a:false,e:{en:"“The cave was dry and cool.”",ru:"«The cave was dry and cool.» — сухая и прохладная.",kz:"«The cave was dry and cool.» — құрғақ әрі салқын."}},
      {s:"We know whose shoe it was.",a:false,e:{en:"“Whose shoe was it? … Nobody knows.”",ru:"«Nobody knows.» — никто не знает.",kz:"«Nobody knows.» — ешкім білмейді."}}
    ]},
    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"In 2008 scientists found a {shoe} in a cave. The shoe is 5,500 {years} old. The cave was {dry} and cool. There was {grass} in the shoe. Now the shoe is in a {museum}.",
     extra:["days","wet"]},
    {type:"wwmatch",instruction:INS.ww,explanation:EXPL.ww,pairs:[
      {l:"Where was the cave?",r:"in Armenia"},{l:"What was in the ground?",r:"a small leather shoe"},{l:"What was in the shoe?",r:"grass"},
      {l:"Where is the shoe now?",r:"in a museum in Yerevan"},{l:"Whose shoe was it?",r:"nobody knows"}
    ]},
    {type:"mc",instruction:INS.mc,items:[
      {q:"How old is the shoe?",o:["550 years","5,500 years","55 years"],a:1,e:{en:"“It was 5,500 years old!”",ru:"«It was 5,500 years old!» — 5 500 лет.",kz:"«It was 5,500 years old!» — 5 500 жыл."}},
      {q:"What size is the shoe?",o:["37","42","30"],a:0,e:{en:"“It is size 37 — a woman's size today.”",ru:"«It is size 37» — 37-й размер.",kz:"«It is size 37» — 37-өлшем."}},
      {q:"Why was the shoe like new?",o:["It was in water.","It was in a shop.","The cave was dry and cool."],a:2,e:{en:"“The cave was dry and cool. There was grass in the shoe.”",ru:"Пещера была сухой и прохладной, а в ботинке была трава.",kz:"Үңгір құрғақ әрі салқын болды, ал аяқ киімнің ішінде шөп болды."}}
    ]},
    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "Scientists go into a cold cave in Armenia.","They find a small leather shoe in the ground.","The shoe is 5,500 years old, but it is like new.","Nobody knows whose shoe it was.","Today the shoe is in a museum in Yerevan."
    ]}
  ]},
