{ id:"c1-peo-dispatcher", level:"C1", genre:"people", title:"The Voice on the Line", cover:{emoji:"🎧"},
  task:{en:"Read and find out: what rule did Saule break on the night of the flood, and why?",ru:"Прочитайте и узнайте: какое правило нарушила Сауле в ночь наводнения и почему?",kz:"Оқып, біліңіз: су тасқыны түні Сәуле қандай ережені бұзды және неге?"},
  words:[
    {en:"dispatcher",tr:"/dɪˈspætʃə/",ru:"диспетчер",kz:"диспетчер",ex:"A dispatcher's job is to stay calm so that others can."},
    {en:"headset",tr:"/ˈhedset/",ru:"гарнитура",kz:"гарнитура",ex:"She had worn the same headset for nine years."},
    {en:"evacuate",tr:"/ɪˈvækjueɪt/",ru:"эвакуировать",kz:"эвакуациялау",ex:"Whole districts were being evacuated by boat."},
    {en:"protocol",tr:"/ˈprəʊtəkɒl/",ru:"протокол, регламент",kz:"хаттама, тәртіп",ex:"The protocol says a call should last no more than four minutes."},
    {en:"prioritise",tr:"/praɪˈɒrətaɪz/",ru:"расставлять приоритеты",kz:"басымдық беру",ex:"She had to prioritise calls by the height of the water."},
    {en:"reassure",tr:"/ˌriːəˈʃʊə/",ru:"успокаивать, ободрять",kz:"жұбату, сендіру",ex:"Her job was to reassure people she could not see."},
    {en:"composure",tr:"/kəmˈpəʊʒə/",ru:"самообладание",kz:"сабырлылық",ex:"Composure is the only tool a dispatcher really has."},
    {en:"aftermath",tr:"/ˈɑːftəmɑːθ/",ru:"последствия",kz:"салдары",ex:"In the aftermath, nobody asked about the rule."}
  ],
  text:[
    "The call centre of the emergency service in Aktobe is a room without windows, which Saule Zhaksybekova has always considered a design flaw. On the night of 5 April 2024 everyone knew what the weather was doing. The Ilek river, swollen by a winter's snow melting in three days of unseasonal warmth, had broken its banks the previous afternoon, and by midnight the water was rising through the low districts of the city.",
    "She had been a dispatcher for nine years. The job, as she describes it, consists of being the calmest person in a conversation in which the other person has every reason not to be. You answer, you establish where they are, you find out what is wrong, you send what can be sent, and you end the call, because the next call is waiting and the protocol says four minutes. She had done this with car crashes, heart attacks and house fires. She had not done it with a flood, and nobody in the room had, because there had not been one like it in living memory.",
    "The calls that night did not fit the protocol. They came from people on the roofs of single-storey houses in the districts along the river, in the dark, with water at the level of their windows. The boats — the service had eleven, and the army sent more — were reaching them, but not fast enough, and someone had to decide who was reached first. She learned to ask two questions before any other: how high is the water, and are there children. She learned that people on the phone will tell you the truth about the second and lie about the first.",
    "At around two in the morning she took a call from a woman named Bakhyt, seventy-one, alone in a house on the edge of the flooded zone, with water knee-deep in the kitchen and rising. There was a boat perhaps forty minutes away and eleven calls ahead of her. Saule gave her the standard instructions — highest room, warmest clothes, phone charged, do not enter the water — and reached for the button that ends a call. Then she did not press it. She cannot fully explain it; the woman's voice, she says, had the particular steadiness of someone who is very frightened and has decided not to say so. Saule stayed on the line. She stayed for fifty-three minutes, which is thirteen times the protocol, while a colleague quietly took over her queue.",
    "They talked about nothing. Bakhyt's grandchildren in Astana; the price of meat; a neighbour's dog howling at the water from a roof. Every few minutes Saule asked her to describe where the water was, and every few minutes it was higher: the second stair, the third stair. At 2:51 the boat arrived. Saule heard the men shouting, heard the phone put down on a table, and then the line went dead because the phone had been left behind in the house.",
    "In the aftermath there was a review, as there always is. Across the west of the country over a hundred thousand people had been evacuated, in the worst floods for eighty years. Saule's fifty-three-minute call was in the logs, and she waited to be asked about it. She was not. Her supervisor mentioned, some weeks later and without looking up from his screen, that the protocol was a guideline for ordinary nights and that he had not been aware of any ordinary nights that April.",
    "She has kept the job. Bakhyt sent, through the service, a bag of kurt and a note that Saule keeps in the drawer of her console and declines to quote, except for the last line, which says that she would like, one day, to hear the voice again in person, with tea. But the number is in the system, Saule says, and she knows exactly where the water was."
  ],
  exercises:[

       e:{en:"She stayed on the line with a frightened seventy-one-year-old woman until the boat arrived.",ru:"Она оставалась на линии с испуганной 71-летней женщиной, пока не пришла лодка.",kz:"Ол қорқып отырған 71 жастағы әйелмен қайық келгенше байланыста қалды."}}

    {type:"vocab",instruction:INS.vocab,items:[

      {q:"“howling” means…",o:["swimming","making a long loud crying sound","sleeping"],a:1,e:{en:"“…a neighbour's dog… was howling at the water.”",ru:"Howl — выть.",kz:"Howl — ұлу."}},

    ]},
    {type:"reflection",instruction:INS.reflection,q:"Saule broke a rule and her supervisor chose not to mention it. When is it right to break a professional rule? Write 4–5 sentences.",
     keys:[["rule","rules","protocol","guideline"],["break","broke","follow","ignore","exception"],["because","when","if","think","right"]],min:2,
     model:"I think it is right to break a rule when the rule exists to serve a purpose and, in that particular moment, following it would betray that purpose. The four-minute protocol exists so that everyone gets help; on that night, staying on the line was the help. The important thing is to know why the rule exists, and to be ready to explain yourself afterwards."}

{ id:"c1-cul-yap", level:"C1", genre:"culture", title:"The Money That Never Moves", cover:{emoji:"🪨"},
  task:{en:"Read and find out: why is a stone at the bottom of the sea still counted as wealth?",ru:"Прочитайте и узнайте: почему камень на дне моря всё ещё считается богатством?",kz:"Оқып, біліңіз: теңіз түбіндегі тас неге әлі де байлық саналады?"},
  words:[
    {en:"currency",tr:"/ˈkʌrənsi/",ru:"валюта",kz:"валюта",ex:"The stones functioned as a currency for centuries."},
    {en:"quarry",tr:"/ˈkwɒri/",ru:"каменоломня; добывать камень",kz:"тас кеніші; тас өндіру",ex:"The stone was quarried on an island four hundred kilometres away."},
    {en:"ledger",tr:"/ˈledʒə/",ru:"учётная книга, реестр",kz:"есеп кітабы",ex:"The whole island functioned as a living ledger."},
    {en:"provenance",tr:"/ˈprɒvənəns/",ru:"происхождение (предмета)",kz:"шығу тегі (заттың)",ex:"A stone's value depended on its provenance."},
    {en:"transaction",tr:"/trænˈzækʃn/",ru:"сделка, транзакция",kz:"мәміле, транзакция",ex:"A transaction changed the owner, not the location."},
    {en:"inflation",tr:"/ɪnˈfleɪʃn/",ru:"инфляция",kz:"инфляция",ex:"Iron tools caused a kind of inflation."},
    {en:"consensus",tr:"/kənˈsensəs/",ru:"консенсус, общее согласие",kz:"консенсус, ортақ келісім",ex:"Ownership rested on consensus rather than possession."},
    {en:"abstraction",tr:"/æbˈstrækʃn/",ru:"абстракция",kz:"абстракция",ex:"All money is an abstraction agreed upon by a community."}
  ],
  text:[
    "On the island of Yap, in the western Pacific, there is a coin the size of a car. It stands at the side of a path, a disc of grey limestone with a hole through the middle, and it has not moved in more than a century. It is worth, by local agreement, a great deal, and its owner lives on the other side of the island and has never touched it. To a visiting economist, this arrangement is either absurd or the most honest description of money ever produced.",
    "The stones are called rai, and there are thousands of them on Yap, from the size of a plate to the size of a small room. What makes them remarkable is not the material — limestone is common enough — but where it comes from. There is no limestone on Yap. Every rai was quarried on the island of Palau, four hundred kilometres away across open ocean, and brought back by canoe. For centuries this was the most dangerous activity a Yapese man could undertake. A rai's value depended less on its size than on its provenance. A large, well-carved stone with a boring history was worth less than a small one with a good story.",
    "Because the stones were too heavy to move, they were simply not moved. When a rai changed hands the transaction was announced, everybody remembered it, and the stone stayed exactly where it was, now belonging to someone else. Ownership was a fact held in common by the community rather than a matter of physical possession. The whole island functioned, in effect, as a single ledger.",
    "The most famous illustration of this is a stone that nobody has seen for generations. According to a story recorded by an American anthropologist in the early twentieth century, a particularly large rai was being brought back from Palau when a storm struck, and the crew, to save themselves, cut it loose. It sank in deep water. When the survivors reached Yap, they described the stone, its size and its quality, and the community agreed that it was as valid a rai as any on land — its being at the bottom of the sea was merely an inconvenience. Economists love this stone. It appears in textbooks as a demonstration that money does not need to exist physically in order to work; it needs only to be agreed upon.",
    "The stones also demonstrate what happens when that agreement is disturbed. In the 1870s an Irish-American sailor named David O'Keefe was shipwrecked on Yap and saw an opportunity. He returned with a ship and iron tools, and offered to quarry and transport rai in exchange for coconut products, which he sold in Asia. The result was a flood of new stones — larger, smoother, and produced without danger. The Yapese responded exactly as an economist would predict: the O'Keefe stones were valued far below the old ones, because everybody knew how easily they had been obtained. A century before the term existed, the island had experienced inflation, and had discounted the currency accordingly.",
    "Rai are no longer used for everyday purchases; Yap, a state of the Federated States of Micronesia, uses the US dollar for those. But the stones are still owned, still occasionally transferred at weddings and in settlements between families, and still not moved. Visitors are shown the “stone money banks” — rows of rai along village paths — and are asked, firmly, not to sit on them.",
    "The lesson that economists draw from Yap is usually about the nature of money: that a dollar is, like a rai, valuable because a community has agreed that it is, and for no other reason. That is true. But the islanders themselves might draw a different one. What the stones record is not wealth but history and a society that keeps its history in the open, along the paths where everybody walks, has perhaps understood something that societies with more portable money have not."
  ],

      {l:"ledger",r:{en:"a record of who owns or owes what",ru:"учётная книга",kz:"есеп кітабы"}},{l:"provenance",r:{en:"the origin and history of an object",ru:"происхождение",kz:"шығу тегі"}},
      {l:"inflation",r:{en:"a fall in the value of money as more of it appears",ru:"инфляция",kz:"инфляция"}},{l:"consensus",r:{en:"general agreement among a group",ru:"консенсус",kz:"ортақ келісім"}}

    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[
      "Yapese men quarry limestone on Palau and bring it home by canoe.","A large stone sinks in a storm, and the community agrees it still counts.","In the 1870s David O'Keefe is shipwrecked on Yap.","O'Keefe brings iron tools and a ship and produces a flood of new stones.","The Yapese value the new stones far below the old ones.","Today Yap uses the US dollar, but the stones are still owned and transferred."

      {s:"The coin at the side of the path is the size of",o:["a plate","a car","a house"],a:1,e:{en:"“…there is a coin the size of a car.”",ru:"«…a coin the size of a car.»",kz:"«…a coin the size of a car.»"}},
      {s:"Rai were brought to Yap by",o:["canoe","steamship","aeroplane"],a:0,e:{en:"“…brought back by canoe.”",ru:"«…brought back by canoe.»",kz:"«…brought back by canoe.»"}},
      {s:"A small stone with a good story was worth",o:["less than a large boring one","more than a large boring one","nothing"],a:1,e:{en:"“A large, well-carved stone with a boring history was worth less than a small one with a good story.”",ru:"«…was worth less than a small one with a good story.»",kz:"«…was worth less than a small one with a good story.»"}},
      {s:"The story of the sunken stone was recorded by",o:["a Yapese chief","David O'Keefe","an American anthropologist"],a:2,e:{en:"“According to a story recorded by an American anthropologist…”",ru:"«…recorded by an American anthropologist…»",kz:"«…recorded by an American anthropologist…»"}},
      {s:"Visitors to the stone money banks are asked not to",o:["sit on the stones","photograph the stones","touch the stones"],a:0,e:{en:"“…and are asked, firmly, not to sit on them.”",ru:"«…not to sit on them.»",kz:"«…not to sit on them.»"}}
    ]},
    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[
      "On Yap, huge limestone discs called rai serve as money and are never moved.","The stones were quarried on Palau and brought home by dangerous canoe voyages, which gave them their value.","When a stone changed hands, the community remembered the transaction and the stone stayed in place.","One stone that sank at sea was still counted as wealth because everyone agreed it existed.","When O'Keefe produced many new stones with iron tools, the Yapese valued them far less.","Today the stones are heritage, and economists use them to explain that money is an agreement."
    ]},
    {type:"reflection",instruction:INS.reflection,q:"The text says all money is “valuable because a community has agreed that it is”. Does that make you trust money more or less? Write 4–5 sentences.",
     keys:[["money","currency","dollar","tenge","value"],["trust","agree","agreement","believe","confidence"],["more","less","because","think"]],min:2,
     model:"It makes me trust money a little less and understand it a little more. The tenge in my pocket works only because millions of people agree to accept it tomorrow, and history shows that such agreements can break. But the same is true of language, and I still use words. The trick is to remember that the agreement, not the paper, is the valuable thing."}
  ]}
