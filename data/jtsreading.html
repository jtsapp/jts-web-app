{ id:"b2-mys-buzzer", level:"B2", genre:"mystery", title:"The Radio Station That Never Stops", cover:{emoji:"📻"},
  task:{en:"Read and find out: what do most experts think the station is for?",ru:"Прочитайте и узнайте: для чего, по мнению большинства экспертов, нужна эта станция?",kz:"Оқып, біліңіз: сарапшылардың көпшілігі станция не үшін керек деп ойлайды?"},
  words:[
    {en:"frequency",tr:"/ˈfriːkwənsi/",ru:"частота",kz:"жиілік",ex:"Tune a shortwave radio to the frequency 4625 kilohertz."},
    {en:"buzz",tr:"/bʌz/",ru:"жужжание, гудок",kz:"ызың, гуіл",ex:"You will hear a short, harsh buzz, about twenty-five times a minute."},
    {en:"interrupt",tr:"/ˌɪntəˈrʌpt/",ru:"прерывать",kz:"үзу",ex:"Occasionally the buzzing is interrupted by a human voice."},
    {en:"transmitter",tr:"/trænzˈmɪtə/",ru:"передатчик",kz:"таратқыш",ex:"The transmitter was traced to a military base near Moscow."},
    {en:"abandoned",tr:"/əˈbændənd/",ru:"заброшенный",kz:"тасталған, қараусыз қалған",ex:"Explorers found the base abandoned."},
    {en:"channel marker",tr:"/ˈtʃænl ˌmɑːkə/",ru:"канальный маркер",kz:"арна маркері",ex:"Most experts believe it is a channel marker."},
    {en:"conspiracy",tr:"/kənˈspɪrəsi/",ru:"заговор",kz:"қастандық, астыртын келісім",ex:"The internet is full of conspiracy theories about the Buzzer."},
    {en:"deliberately",tr:"/dɪˈlɪbərətli/",ru:"намеренно",kz:"әдейі",ex:"Nobody has ever deliberately explained what the station is."}
  ],
  text:[
    "Tune a shortwave radio to the frequency 4625 kilohertz, at any hour of the day or night, and you will hear the same thing: a short, harsh buzz, about twenty-five times a minute, like a distant foghorn that has been left on. It has been sounding since the late 1970s. Nobody has ever officially explained what it is for, and radio enthusiasts around the world have given it a name: the Buzzer.",
    "Occasionally — a few times a month, sometimes a few times a year — the buzzing stops and a human voice reads out a message in Russian. It always follows the same pattern: a call sign, a list of names or words, and a string of numbers. “UVB-76. Boris, Roman, Olga, Mikhail, Anna, Larisa. 74, 74, 20, 04.” Then the voice disappears and the buzzing returns as if nothing had happened. The messages have never been decoded, at least not by anyone who is prepared to say so publicly.",
    "For years the station's location was a mystery. Then, in the 1990s, enthusiasts using direction-finding equipment traced the transmitter to a military base near the town of Povarovo, north-west of Moscow. In 2010 the signal suddenly moved: the buzzing was coming from somewhere else, and shortly afterwards a group of explorers walked into the old base and found it abandoned. The rooms were full of dusty equipment and, on the floor, a logbook containing lists of messages that had been sent. The radio had moved on; the paper had been left behind.",
    "What is it? The internet is full of conspiracy theories, and the most dramatic of them claims that the Buzzer is a “dead hand” system: if the buzzing ever stopped, it would mean that the Russian government had been destroyed and nuclear weapons would be launched automatically. There is no evidence for this, and experts point out that a system like that would hardly rely on a signal that anyone with a cheap radio can hear.",
    "The most likely explanation is much less exciting. Most specialists believe that the buzzing is a channel marker — a signal whose only purpose is to keep the frequency occupied and to show that the transmitter is working. The rare voice messages are probably orders or tests for military units, sent in a simple code that only makes sense if you already have the key. Similar stations have been operated by several countries, and some of them, such as Britain's so-called “Lincolnshire Poacher”, have long since been switched off.",
    "And yet the Buzzer continues. In recent years the number of voice messages has increased, and during periods of political tension listeners have noticed that the station becomes busier. Whether that means anything, nobody outside a certain building can say. Perhaps that is why thousands of people around the world still keep a browser tab open, day and night, streaming a sound that has no obvious meaning. It is one of the few mysteries you can listen to live."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"A radio station has been broadcasting a buzzing sound for over forty years. What is the most likely explanation?",o:["It is a signal to aliens.","It is a channel marker that keeps a military frequency occupied.","It is a broken transmitter nobody has noticed."],a:1,
       e:{en:"Most specialists believe the buzzing simply keeps the frequency occupied and shows the transmitter is working.",ru:"Большинство специалистов считают, что гудок просто занимает частоту и показывает, что передатчик работает.",kz:"Мамандардың көпшілігі гуіл жиілікті бос қалдырмай, таратқыштың жұмыс істеп тұрғанын көрсетеді деп санайды."}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"The buzzing sounds about twenty-five times a minute.",a:true,e:{en:"“…a short, harsh buzz, about twenty-five times a minute…”",ru:"«…about twenty-five times a minute…»",kz:"«…about twenty-five times a minute…»"}},

    ]},

     text:"The Buzzer broadcasts on the {frequency} 4625 kilohertz. The buzzing has been sounding since the late {1970s}. Sometimes a voice reads a call sign, names and {numbers}. In the 1990s enthusiasts traced the {transmitter} to a base near Moscow. In 2010 explorers found the base {abandoned}. The most dramatic theory is the so-called “dead {hand}” system. Most specialists think it is a channel {marker}. During periods of political tension the station becomes {busier}.",

{ id:"b2-his-sendler", level:"B2", genre:"history", title:"The List in the Jar", cover:{emoji:"🫙"},
  task:{en:"Read and find out: why did Irena bury jars under an apple tree?",ru:"Прочитайте и узнайте: зачем Ирена закапывала банки под яблоней?",kz:"Оқып, біліңіз: Ирена банкаларды алма ағашының түбіне неге көмді?"},
  words:[
    {en:"ghetto",tr:"/ˈɡetəʊ/",ru:"гетто",kz:"гетто",ex:"Nearly half a million people were locked inside the Warsaw Ghetto."},
    {en:"smuggle",tr:"/ˈsmʌɡl/",ru:"тайно проносить, переправлять",kz:"жасырын алып шығу",ex:"She smuggled children out in ambulances, toolboxes and sacks."},

    {en:"identity",tr:"/aɪˈdentəti/",ru:"личность, имя; документы",kz:"жеке басы, есімі",ex:"Each child was given a new identity and a Christian name."},
    {en:"interrogate",tr:"/ɪnˈterəɡeɪt/",ru:"допрашивать",kz:"жауап алу, тергеу",ex:"She was arrested and interrogated by the Gestapo."},

    {en:"reunite",tr:"/ˌriːjuːˈnaɪt/",ru:"воссоединять",kz:"қайта қосу",ex:"She hoped to reunite the children with their families after the war."},
    {en:"recognition",tr:"/ˌrekəɡˈnɪʃn/",ru:"признание",kz:"мойындау, тану",ex:"Recognition came very late in her life."}
  ],
  text:[
    "In 1943, a young Polish social worker was arrested by the Gestapo, taken to Warsaw's Pawiak prison and tortured. She was sentenced to death. Throughout the interrogation she repeated the same thing: she knew nothing, and there were no lists. In fact, there were lists — and they were buried in glass jars under an apple tree in a friend's garden, a few kilometres away. On them were the names of about 2,500 children.",
    "Irena Sendler was twenty-nine when Germany invaded Poland in 1939. As a nurse and social worker she had permission to enter the Warsaw Ghetto, where nearly half a million Jews had been locked in behind walls, to check for signs of typhus. What she saw there — starvation, disease, whole families dying in the street — convinced her that the people inside would not survive. In 1942 she joined Żegota, a secret organisation that helped Jews, and began to do the one thing she thought possible: get the children out.",
    "The methods were as varied as they were dangerous. Small children were carried out in ambulances, hidden under stretchers, or in toolboxes, potato sacks and even coffins. Older ones were led through the sewers or through the courthouse. A dog was trained to bark whenever German guards approached a vehicle, so that the crying of a baby could not be heard. Once outside, each child was given a new name and false documents, and placed with a Polish family, in a convent or in an orphanage.",
    "The hardest moments, Sendler said many years later, were not with the guards but with the parents. She had to ask mothers and fathers to give up their children, with no guarantee that they would ever see them again. Some refused; many of those families were later murdered in Treblinka. Others agreed, on one condition: that the child's real name would not be lost. That is why Sendler wrote everything down — the real name, the new name, the address — and hid the lists in jars. If she survived, she promised, the children would be reunited with whatever family they had left.",
    "She did survive, though only because Żegota bribed a guard on the day of her planned execution. She spent the rest of the war in hiding and continued her work. After 1945 she dug up the jars and gave the lists to a Jewish organisation. Almost all of the parents had been killed. Most of the children never learned who had saved them.",
    "Recognition came absurdly late. For decades her story was largely ignored. Then, in 1999, four schoolgirls in a small town in Kansas found a single sentence about her while researching a history project. They wrote a play, “Life in a Jar”, and they eventually travelled to Warsaw to meet the woman they had rescued from obscurity. Sendler was by then in her nineties. “I could have done more,” she told them. She died in 2008, at the age of ninety-eight."
  ],

    {type:"reflection",instruction:INS.reflection,q:"Sendler said: “I could have done more.” Why do you think people who do great things often feel this way? Write 3–4 sentences.",

{ id:"b2-tec-alphago", level:"B2", genre:"technology", title:"Move 37", cover:{emoji:"⚫"},
  task:{en:"Read and find out: why did move 37 shock the experts?",ru:"Прочитайте и узнайте: почему 37-й ход шокировал экспертов?",kz:"Оқып, біліңіз: 37-жүріс сарапшыларды неге таңғалдырды?"},
  words:[
    {en:"intuition",tr:"/ˌɪntjuˈɪʃn/",ru:"интуиция",kz:"интуиция, түйсік",ex:"Go was thought to require human intuition."},
    {en:"opponent",tr:"/əˈpəʊnənt/",ru:"соперник",kz:"қарсылас",ex:"Lee Sedol's opponent was not a person but a program."},
    {en:"commentator",tr:"/ˈkɒmənteɪtə/",ru:"комментатор",kz:"комментатор",ex:"The commentators thought it was a mistake."},
    {en:"probability",tr:"/ˌprɒbəˈbɪləti/",ru:"вероятность",kz:"ықтималдық",ex:"The program calculated the probability that a human would play that move at one in ten thousand."},
    {en:"creative",tr:"/kriˈeɪtɪv/",ru:"творческий",kz:"шығармашыл",ex:"Experts called the move beautiful and creative."},
    {en:"defeat",tr:"/dɪˈfiːt/",ru:"поражение; побеждать",kz:"жеңіліс; жеңу",ex:"Lee Sedol suffered his first defeat in the second game."},
    {en:"retire",tr:"/rɪˈtaɪə/",ru:"уйти из спорта, на покой",kz:"спорттан кету, зейнетке шығу",ex:"In 2019 Lee retired from professional Go."},
    {en:"overtake",tr:"/ˌəʊvəˈteɪk/",ru:"обгонять, превосходить",kz:"басып озу",ex:"Machines had overtaken humans in a game that was supposed to be beyond them."}
  ],
  text:[
    "Go is the oldest board game still played in its original form. It was invented in China at least 2,500 years ago, and its rules are simple. Yet the number of possible positions is greater than the number of atoms in the universe. Chess computers beat the world champion in 1997; Go, experts agreed, was different. It required intuition, a feeling for shape and balance that no machine could copy. In 2016, most professionals believed that day was still at least ten years away.",
    "In March of that year, in a hotel in Seoul, the South Korean master Lee Sedol sat down to play five games against AlphaGo, a program developed by the British company DeepMind. Lee had won eighteen international titles and was widely considered the strongest player of his generation. Before the match he told reporters that he expected to win 5–0, or perhaps 4–1.",
    "The program won the first game, and Lee looked shaken. Then, in the second game, came move 37. AlphaGo placed a stone on the fifth line, in a position that every Go textbook described as bad. The commentators fell silent; one of them assumed it was a mistake. AlphaGo's own calculations later showed that the probability of a human professional choosing that move was about one in ten thousand. It was not a mistake. Fifty moves later, the “bad” stone turned out to be the centre of a structure that decided the game. “It's not a human move,” said the European champion Fan Hui, who was watching. “I've never seen a human play this move. So beautiful.”",
    "Lee lost the third game as well, and the match. But in game four he produced something of his own. On move 78 he placed a stone in the middle of AlphaGo's territory — a move so unexpected that the program's evaluation collapsed, and it began making mistakes like a confused beginner. Lee won. Korean commentators called it “God's touch”. It remains the only game a human has ever won against that version of the program in official play.",
    "The final score was 4–1. AlphaGo was retired from competition the following year, and its successors learned the game from scratch, without any human examples at all, in a matter of days. Lee Sedol continued to play professionally until 2019. When he announced his retirement, he gave a reason that many people found sad: “Even if I become the number one, there is an entity that cannot be defeated.”",
    "Move 37 has since become a symbol. To some people it represents the moment when machines overtook humans in a domain that was supposed to belong to us alone. To others it represents something more hopeful: professional players say that studying AlphaGo's games has made them better and more creative, because it showed them ideas that 2,500 years of human play had never found. Perhaps both are true. The stone on the fifth line was, after all, not a defeat. It was a lesson."
  ],

    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“intuition” means…",o:["careful calculation","understanding something by feeling, not by reasoning","a set of written rules"],a:1,e:{en:"Go was thought to require intuition — a feeling for shape and balance.",ru:"Intuition — интуиция.",kz:"Intuition — интуиция, түйсік."}},

    {type:"headings",instruction:INS.headings,explanation:EXPL.headings,pairs:[

    {type:"reflection",instruction:INS.reflection,q:"Lee Sedol retired because “there is an entity that cannot be defeated”. Do you think it is still worth playing a game that a computer plays better? Write 3–4 sentences.",

    {en:"poaching",tr:"/ˈpəʊtʃɪŋ/",ru:"браконьерство",kz:"браконьерлік",ex:"Poaching for horns had already reduced the population."},
    {en:"conservation",tr:"/ˌkɒnsəˈveɪʃn/",ru:"охрана природы",kz:"табиғатты қорғау",ex:"Conservation groups and the government worked together."},
    {en:"recovery",tr:"/rɪˈkʌvəri/",ru:"восстановление",kz:"қалпына келу",ex:"The recovery has been one of the fastest ever recorded."}
  ],
  text:[
    "In May 2015, scientists working on the steppe of central Kazakhstan watched something they still struggle to describe. The saiga antelopes they had come to study — thousands of them, gathered together to give birth — began to die: mothers and newborn calves collapsed within hours of each other, and within three weeks about 200,000 animals, more than half of the world's population at that time, lay dead across an area the size of a small country.",
    "The saiga is one of the strangest and oldest mammals on Earth. With its swollen, trunk-like nose, which warms freezing air in winter and filters dust in summer, it looks like a creature from another age — and it is. Saigas once grazed alongside mammoths, and they survived the ice ages that killed their neighbours. A century ago, millions of them migrated across the grasslands from Ukraine to Mongolia. By the early 2000s, after decades of hunting for their horns, which are used in traditional medicine, fewer than 50,000 remained.",
    "The 2015 die-off, therefore, looked like the end. Scientists from Kazakhstan, Britain and Germany rushed to the site and took samples from the carcasses. The cause turned out to be a bacterium called Pasteurella multocida, which normally lives harmlessly in the animals' noses and throats. Something had turned it into a killer. When the researchers compared the weather records, they found the trigger: in the days before the deaths, the temperature and humidity on the steppe had been higher than at any time since records began in the 1940s. The unusual warmth had apparently allowed the bacteria to enter the bloodstream, and the saigas' immune systems, already stressed by the effort of giving birth, could not respond.",
    "Rather than disappearing, the saiga recovered — and did so at a speed that has rarely been recorded for any large mammal. Kazakhstan had strengthened its laws against poaching and increased the number of rangers on the steppe. Conservation organisations had been working with local communities for years, and the huge, empty grasslands gave the animals room to breed. Saigas also reproduce quickly: females give birth at the age of one, usually to twins. By 2022 there were more than 1.3 million saigas in Kazakhstan; by 2024, according to official counts, nearly three million.",
    "The success has created new problems. Farmers in the north and west of the country complain that herds of saigas eat their crops and damage their fields, and in 2023 the government allowed limited hunting for the first time in decades, which angered many scientists. The debate continues: how do you protect an animal that was almost extinct ten years ago and is now, in some places, too numerous?",
    "For the biologists who watched the steppe in 2015, however, the argument itself is a kind of victory. “We thought we were documenting an extinction,” one of them said later. “Instead we were documenting how fast nature can come back when it is given a chance.”"
  ],

{ id:"b2-peo-maier", level:"B2", genre:"people", title:"The Nanny Who Photographed Everything", cover:{emoji:"📷"},
  task:{en:"Read and find out: how were Vivian Maier's photographs discovered?",ru:"Прочитайте и узнайте: как были найдены фотографии Вивиан Майер?",kz:"Оқып, біліңіз: Вивиан Майердің фотосуреттері қалай табылды?"},
  words:[
    {en:"nanny",tr:"/ˈnæni/",ru:"няня",kz:"күтуші, бала бағушы",ex:"For forty years she worked as a nanny for families in Chicago."},
    {en:"negative",tr:"/ˈneɡətɪv/",ru:"негатив (фотоплёнка)",kz:"негатив (фотоүлдір)",ex:"The boxes contained more than 150,000 negatives."},
    {en:"auction",tr:"/ˈɔːkʃn/",ru:"аукцион",kz:"аукцион",ex:"In 2007 a young man bought a box of negatives at an auction."},
    {en:"storage",tr:"/ˈstɔːrɪdʒ/",ru:"хранение; склад",kz:"сақтау; қойма",ex:"She had stopped paying for her storage unit."},
    {en:"develop",tr:"/dɪˈveləp/",ru:"проявлять (плёнку)",kz:"үлдірді айқындау",ex:"Thousands of rolls of film had never even been developed."},
    {en:"privacy",tr:"/ˈprɪvəsi/",ru:"частная жизнь, уединение",kz:"жеке өмір, оңашалық",ex:"She guarded her privacy fiercely."},
    {en:"posthumous",tr:"/ˈpɒstjʊməs/",ru:"посмертный",kz:"қайтыс болғаннан кейінгі",ex:"Her fame is entirely posthumous."},
    {en:"consent",tr:"/kənˈsent/",ru:"согласие",kz:"келісім",ex:"She never gave her consent to any exhibition."}
  ],
  text:[
    "In the winter of 2007, a twenty-six-year-old man named John Maloof paid about 380 dollars at an auction in Chicago for a box of old photographic negatives. He was writing a book about the history of his neighbourhood and hoped to find a few useful street scenes. What he found instead was a body of work that critics now compare to the greatest photographers of the twentieth century — and a name that nobody recognised: Vivian Maier.",
    "The box had come from a storage unit whose owner had stopped paying the rent. Its contents turned out to include more than 150,000 negatives, thousands of prints and hundreds of rolls of film that had never been developed. Maloof searched for the name online and found nothing. It was only in 2009, when he tried again, that he came across a short death notice. Vivian Maier had died a few days earlier, at the age of eighty-three, after a fall on the ice.",
    "Slowly, the story of her life was put together. She had been born in New York in 1926 to a French mother and an Austrian father, and had spent much of her childhood in a village in the French Alps. From the early 1950s until the end of her working life she was employed as a nanny by families in New York and, later, Chicago. She never went anywhere without a camera around her neck. The children she looked after remembered long walks through the poorest parts of the city, where she photographed anything that caught her eye.",
    "She showed her pictures to almost no one. Her employers knew she took photographs, but none of them had any idea of the quantity or the quality. When she could no longer afford to develop it at all, she simply kept buying film. Money was always a problem. In her final years, the three brothers she had once looked after paid for a small flat for her. They did not know about the storage unit either.",
    "Since 2009, Maier's photographs have been exhibited in dozens of countries, and a documentary about her, “Finding Vivian Maier”, was nominated for an Oscar. Her work is admired for its humour, its sympathy for ordinary people and its extraordinary sense of timing. Photographers who spent their whole lives trying to achieve that effect are astonished that a nanny with no training and no audience did it, day after day, for forty years.",
    "Her fame raises an uncomfortable question. Maier guarded her privacy fiercely. She never sold a print, never held an exhibition and never gave her consent for anyone to see her work. Would she have wanted the books, the films and the crowds? Nobody knows, and there is nobody left to ask. The photographs, meanwhile, keep being found. In 2023 a further collection was discovered in a different set of boxes, and it is likely that more are still waiting somewhere."
  ],

      {q:"“came across” means…",o:["crossed the road","found by chance","travelled to"],a:1,e:{en:"He came across a short death notice.",ru:"Come across — случайно наткнуться.",kz:"Come across — кездейсоқ тап болу."}},

    {type:"reflection",instruction:INS.reflection,q:"Maier never wanted anyone to see her photographs. Was it right to exhibit them after her death? Write 3–4 sentences.",
     keys:[["right","wrong","should","shouldn't"],["private","privacy","consent","wanted","wish"],["because","art","people","world","share"]],min:2,

{ id:"b2-cul-eagles", level:"B2", genre:"culture", title:"Hunting With Eagles", cover:{emoji:"🦅"},
  task:{en:"Read and find out: why does a berkutchi release the eagle after about ten years?",ru:"Прочитайте и узнайте: почему беркутчи отпускает орла примерно через десять лет?",kz:"Оқып, біліңіз: бүркітші бүркітті шамамен он жылдан кейін неге босатады?"},
  words:[
    {en:"falconry",tr:"/ˈfɔːlkənri/",ru:"соколиная охота",kz:"құсбегілік",ex:"Falconry with golden eagles is a tradition at least a thousand years old."},
    {en:"nestling",tr:"/ˈnestlɪŋ/",ru:"птенец",kz:"балапан (ұядағы)",ex:"Traditionally a hunter takes a nestling from a cliff nest."},
    {en:"bond",tr:"/bɒnd/",ru:"связь, узы",kz:"байланыс",ex:"The bond between hunter and bird takes years to build."},
    {en:"prey",tr:"/preɪ/",ru:"добыча",kz:"олжа, жем",ex:"The eagle's prey is usually a fox or a hare."},
    {en:"release",tr:"/rɪˈliːs/",ru:"отпускать на волю",kz:"босату",ex:"After about ten years the eagle is released into the wild."},
    {en:"heritage",tr:"/ˈherɪtɪdʒ/",ru:"наследие",kz:"мұра",ex:"UNESCO lists falconry as intangible cultural heritage."},
    {en:"nomad",tr:"/ˈnəʊmæd/",ru:"кочевник",kz:"көшпенді",ex:"The tradition was born among the nomads of Central Asia."},
    {en:"revive",tr:"/rɪˈvaɪv/",ru:"возрождать",kz:"жаңғырту",ex:"In Kazakhstan the art is being revived."}
  ],
  text:[
    "On a cold morning in the Altai Mountains, a man on horseback raises his right arm. On it sits a golden eagle weighing six kilograms, with a wingspan wider than the man is tall. Somewhere on the slope below, a fox is moving through the snow. The man removes the eagle's hood. Then it drops from the arm, opens its wings, and the hunt that has been practised in these mountains for at least a thousand years begins again.",
    "The men — and, increasingly, the women — who hunt in this way are called berkutchi, from berkut, the Kazakh word for the golden eagle. The tradition was born among the nomads of the Central Asian steppe, who needed fur for the winter and had no guns. Marco Polo described the practice in the thirteenth century. Today it survives mainly among the ethnic Kazakhs of western Mongolia, where perhaps 250 active hunters remain, and in Kazakhstan itself, where the art is being carefully revived.",
    "Traditionally, the hunter climbs to a cliff nest and takes a female nestling — females are larger and more aggressive than males — before it can fly. For the first weeks the bird is kept close, fed by hand and carried everywhere, until it accepts the hunter as the source of all food. Then the training begins: the eagle learns to return to the arm, to fly at a moving fox skin pulled behind a horse, and finally to hunt real prey. The hunters say that the eagle never becomes a pet. It is a partner.",
    "The most unusual part of the tradition comes at the end. After ten years or so, the berkutchi takes it far into the mountains, leaves a sheep as a final gift, and rides away without looking back. The bird is released to breed in the wild. Eagles can live for thirty years or more, and the hunters believe that a bird which has served a family for a decade deserves to spend the rest of its life free.",
    "In recent years the tradition has become famous far beyond the mountains, largely because of a girl. In 2014 a thirteen-year-old Kazakh from Mongolia, Aisholpan Nurgaiv, entered the annual Golden Eagle Festival in Bayan-Ölgii, competing against dozens of men. She won. A documentary about her, “The Eagle Huntress”, was seen around the world, and it changed the answer to a question that had been asked for centuries: girls, it turned out, could be berkutchi too.",
    "Critics argue that the festivals have turned a way of life into a performance for tourists, and that some eagles are now kept only to be photographed. The hunters themselves are more relaxed. The tourists, they point out, bring money that keeps young people in the mountains, and a young person who stays may learn the real skills. In 2021 UNESCO added Kazakhstan's eagle-hunting traditions to the list. It simply drops from the arm and flies."
  ],

    {type:"tfng",instruction:INS.tfng,items:[

      {s:"The word berkut means “hunter” in Kazakh.",a:"F",e:{en:"“…from berkut, the Kazakh word for the golden eagle.”",ru:"«…berkut, the Kazakh word for the golden eagle.»",kz:"«…berkut, the Kazakh word for the golden eagle.»"}},
      {s:"Marco Polo wrote about eagle hunting.",a:"T",e:{en:"“Marco Polo described the practice in the thirteenth century.”",ru:"«Marco Polo described the practice…»",kz:"«Marco Polo described the practice…»"}},
      {s:"Hunters prefer male eagles because they are faster.",a:"F",e:{en:"“…takes a female nestling — females are larger and more aggressive than males…”",ru:"«…females are larger and more aggressive…»",kz:"«…females are larger and more aggressive…»"}},
      {s:"Aisholpan's father was also an eagle hunter.",a:"NG",e:{en:"The text does not mention her father.",ru:"Об отце в тексте не сказано.",kz:"Мәтінде әкесі туралы айтылмаған."}},

    ]},

    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[

    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[

    ]},

{ id:"b2-sci-zombie", level:"B2", genre:"science", title:"The Fungus That Drives Ants", cover:{emoji:"🍄"},
  task:{en:"Read and find out: does the fungus control the ant's brain?",ru:"Прочитайте и узнайте: управляет ли гриб мозгом муравья?",kz:"Оқып, біліңіз: саңырауқұлақ құмырсқаның миын басқара ма?"},
  words:[
    {en:"fungus",tr:"/ˈfʌŋɡəs/",ru:"гриб (микроскопический)",kz:"саңырауқұлақ",ex:"The fungus needs the ant to die in exactly the right place."},
    {en:"spore",tr:"/spɔː/",ru:"спора",kz:"спора",ex:"A single spore lands on an ant's body and works its way inside."},
    {en:"colony",tr:"/ˈkɒləni/",ru:"колония (муравьёв)",kz:"колония (құмырсқа)",ex:"The ant leaves the colony and climbs a plant."},
    {en:"vein",tr:"/veɪn/",ru:"жилка (листа); вена",kz:"тамыр (жапырақ)",ex:"It bites into the main vein of a leaf."},
    {en:"manipulate",tr:"/məˈnɪpjuleɪt/",ru:"манипулировать",kz:"манипуляция жасау, басқару",ex:"How does a fungus manipulate an animal's behaviour?"},
    {en:"muscle fibre",tr:"/ˈmʌsl ˌfaɪbə/",ru:"мышечное волокно",kz:"бұлшықет талшығы",ex:"Fungal cells surround the muscle fibres."},
    {en:"intact",tr:"/ɪnˈtækt/",ru:"нетронутый, целый",kz:"бүтін, зақымдалмаған",ex:"The brain itself was intact."},
    {en:"fossil",tr:"/ˈfɒsl/",ru:"окаменелость",kz:"қазба қалдық",ex:"A 48-million-year-old fossil leaf shows the same bite marks."}
  ],
  text:[
    "In the rainforests of Brazil and Thailand, a carpenter ant sometimes behaves in a way that makes no sense. It leaves its colony in the middle of the day and begins to climb. It climbs a plant to a height of about twenty-five centimetres, walks to the underside of a leaf on the north side of the stem, and, at around midday, bites into the main vein with a force it will never use again. Then it dies, with its jaws locked into the leaf. A few days later, a stalk grows out of the back of its head.",
    "The stalk belongs to a fungus called Ophiocordyceps unilateralis, and everything the ant has done has been for the fungus's benefit. The height, the north-facing side, the time of day: all of these create exactly the temperature and humidity that the fungus needs to grow. When the stalk matures, it releases spores, which fall onto the forest floor — directly onto the trail that the ant's colony uses every day. A single spore lands on a passing ant, works its way through the outer shell, and the cycle begins again. Biologists call the victims “zombie ants”.",
    "For a long time scientists assumed that the fungus was controlling the ant's brain. It seemed the obvious explanation: the ant's behaviour is so precise, so purposeful, that something must be giving it orders. In 2017, however, a team at Pennsylvania State University, led by David Hughes, cut infected ants into extremely thin slices and used a computer to build a three-dimensional map of every fungal cell inside the body. The result was unexpected. Fungal cells had spread through almost the entire ant and had formed networks around the muscle fibres, in some cases penetrating them. The brain, by contrast, was intact. The fungus had not entered it at all.",
    "In other words, the fungus is not persuading the ant to climb; it is moving the ant's body directly, like a puppeteer pulling strings, while the brain, apparently, watches. The researchers believe that the fungus releases chemicals which control the muscles, and possibly other chemicals which keep the brain alive just long enough for the final bite.",
    "The relationship is not new. In 2010, palaeontologists examining a 48-million-year-old fossil leaf from Germany noticed unusual marks on its veins: exactly the pattern of “death grip” bites that zombie ants leave today. The fungus, it appears, has been driving ants around forests since long before humans existed. Hundreds of related species manipulate spiders, caterpillars and beetles, each one specialised for a single host.",
    "Should humans worry? No. Ophiocordyceps cannot infect mammals, whose body temperature is far too high for it. What the zombie ants offer instead is a lesson in how strange evolution can be. Somewhere in the chemistry of a fungus without a brain is a programme that can steer a living animal to a particular leaf at a particular hour."
  ],
  exercises:[

      {q:"A fungus makes an ant climb a plant and bite a leaf before it dies. Which part of the ant does the fungus take over?",o:["the brain","the muscles","the eyes"],a:1,
       e:{en:"The 2017 study found fungal cells around the muscle fibres, while the brain was intact.",ru:"Исследование 2017 года обнаружило клетки гриба вокруг мышечных волокон, а мозг оставался нетронутым.",kz:"2017 жылғы зерттеу саңырауқұлақ жасушаларын бұлшықет талшықтарының айналасынан тапты, ал ми зақымдалмаған."}}
    ]},

      {s:"David Hughes's team worked in Brazil.",a:"NG",e:{en:"The text says the team was at Pennsylvania State University, not where the ants were collected.",ru:"Сказано, что команда из Университета Пенсильвании, но не где собирали муравьёв.",kz:"Топтың Пенсильвания университетінен екені айтылған, бірақ құмырсқаларды қайдан жинағаны жоқ."}},

      {s:"The fossil leaf was found in Germany.",a:"T",e:{en:"“…a 48-million-year-old fossil leaf from Germany…”",ru:"«…fossil leaf from Germany…»",kz:"«…fossil leaf from Germany…»"}},
      {s:"The fungus has been found in Kazakhstan.",a:"NG",e:{en:"The text mentions Brazil, Thailand and a fossil from Germany, not Kazakhstan.",ru:"В тексте — Бразилия, Таиланд и окаменелость из Германии; Казахстана нет.",kz:"Мәтінде Бразилия, Таиланд және Германиядағы қазба; Қазақстан жоқ."}}

    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“purposeful” means…",o:["random","done with a clear aim","dangerous"],a:1,e:{en:"The ant's behaviour is so precise, so purposeful…",ru:"Purposeful — целенаправленный.",kz:"Purposeful — мақсатты."}},
      {q:"“penetrating” means…",o:["going into or through","surrounding","killing"],a:0,e:{en:"“…in some cases penetrating them.”",ru:"Penetrate — проникать.",kz:"Penetrate — ену, өту."}},
      {q:"A “puppeteer” is…",o:["a scientist who studies insects","a person who moves puppets with strings","a kind of fungus"],a:1,e:{en:"“…like a puppeteer pulling strings…”",ru:"Puppeteer — кукловод.",kz:"Puppeteer — қуыршақ ойнатушы."}},
      {q:"A “host” in this text is…",o:["a person who invites guests","an animal that a parasite lives in","a forest"],a:1,e:{en:"“…each one specialised for a single host.”",ru:"Host здесь — хозяин (организм-носитель).",kz:"Host мұнда — иесі (паразит тіршілік ететін организм)."}},
      {q:"“steer” means…",o:["kill","feed","guide in a particular direction"],a:2,e:{en:"“…a programme that can steer a living animal to a particular leaf…”",ru:"Steer — направлять, вести.",kz:"Steer — бағыттау."}}

    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,

{ id:"b2-adv-buran", level:"B2", genre:"adventure", title:"Twenty Hours in the Buran", cover:{emoji:"🌨️"},
  task:{en:"Read and find out: what mistake did Aslan make, and what did he do right?",ru:"Прочитайте и узнайте: какую ошибку допустил Аслан и что он сделал правильно?",kz:"Оқып, біліңіз: Аслан қандай қате жіберді және нені дұрыс істеді?"},
  words:[
    {en:"blizzard",tr:"/ˈblɪzəd/",ru:"метель, буран",kz:"боран",ex:"By four o'clock the blizzard had closed the road."},
    {en:"visibility",tr:"/ˌvɪzəˈbɪləti/",ru:"видимость",kz:"көріну қашықтығы",ex:"Visibility dropped to a few metres."},
    {en:"exhaust pipe",tr:"/ɪɡˈzɔːst paɪp/",ru:"выхлопная труба",kz:"шығару құбыры",ex:"If snow blocks the exhaust pipe, the gas comes into the car."},
    {en:"drift",tr:"/drɪft/",ru:"сугроб; наметать",kz:"күртік; үйілу",ex:"Snowdrifts were growing against the doors."},
    {en:"hypothermia",tr:"/ˌhaɪpəˈθɜːmiə/",ru:"переохлаждение",kz:"тоңу, гипотермия",ex:"The greatest danger was hypothermia."},
    {en:"convoy",tr:"/ˈkɒnvɔɪ/",ru:"колонна (машин)",kz:"колонна",ex:"The rescue convoy moved at walking pace."},
    {en:"ration",tr:"/ˈræʃn/",ru:"нормировать, экономить",kz:"үнемдеп жұмсау",ex:"They rationed the fuel: ten minutes of engine every hour."},
    {en:"instinct",tr:"/ˈɪnstɪŋkt/",ru:"инстинкт",kz:"инстинкт, түйсік",ex:"His instinct was to keep driving."}
  ],
  text:[
    "The forecast had said “snow, strengthening wind”. Aslan looked at the sky over Astana, decided it was fine, and set off for Karaganda at one in the afternoon with his wife Madina and their daughter, who was six. It is a journey of two hundred kilometres on a good road. He had a full tank, a thermos of tea and a bag of sweets for the girl. He did not have a shovel, blankets or a torch, and he had not told anyone when he expected to arrive.",
    "The wind came from the west an hour later, and with it the snow — not falling but flying, horizontally, so that the road ahead disappeared into a moving white wall. Within twenty minutes visibility had dropped to a few metres. Aslan slowed to a crawl, then stopped. By four o'clock the police had shut the road at both ends, and somewhere between the two barriers, in a line of perhaps sixty vehicles, the family was sitting in the dark with the engine running.",
    "Aslan's instinct was to keep the engine on for warmth. It was Madina who remembered the rule that everyone in the north knows: when the snow rises around a stationary car, it blocks the exhaust pipe, and the gas that should go into the air comes into the car instead. So they rationed the fuel — ten minutes of engine every hour — and every hour Aslan climbed out into the wind and cleared the pipe with his hands.",
    "The night was long. The temperature outside fell to minus thirty-one, and inside the car it dropped close to zero. They put on every piece of clothing in the bags and wrapped the girl in the car's floor mats. Madina made a game of it: whoever moved their toes the most would win the last sweet. Aslan's phone had one bar of signal, enough to send their location to his brother and to receive, at three in the morning, a message from the emergency service: a convoy was coming from Karaganda; stay in the vehicle; do not walk.",
    "In a buran, lights that seem a hundred metres away may be a kilometre away, and a person who leaves the car in search of them can lose the road, and their own tracks, within minutes. Twice during the night Aslan saw figures walking past in the white.",
    "The convoy — a tractor with a snowplough and two rescue vehicles — reached them at nine in the morning, twenty hours after they had left Astana. The girl was asleep. Madina's hands were white with cold but recovered by the evening. Aslan now keeps a box in the boot of his car that never comes out: two blankets, a shovel, candles, matches, chocolate and a torch. When the forecast says “strengthening wind”, he stays at home. “The steppe doesn't care how many times you've driven the road,” he says. In Kazakhstan, it seems, the land teaches the same lesson to everyone."
  ],
  exercises:[
    {type:"mc",instruction:INS.mc,items:[
      {q:"Which of these did Aslan NOT have in the car?",o:["a full tank of fuel","a thermos of tea","a shovel"],a:2,e:{en:"“He did not have a shovel, blankets or a torch…”",ru:"«He did not have a shovel, blankets or a torch…»",kz:"«He did not have a shovel, blankets or a torch…»"}},
      {q:"Why is it dangerous to keep the engine running in deep snow?",o:["The car may catch fire.","Snow blocks the exhaust pipe and gas enters the car.","The battery dies quickly."],a:1,e:{en:"“…it blocks the exhaust pipe, and the gas that should go into the air comes into the car instead.”",ru:"«…it blocks the exhaust pipe, and the gas… comes into the car…»",kz:"«…it blocks the exhaust pipe, and the gas… comes into the car…»"}},
      {q:"How did the family keep the girl warm?",o:["They wrapped her in the car's floor mats.","They lit a candle.","They put her under the bonnet."],a:0,e:{en:"“…wrapped the girl in the car's floor mats.”",ru:"«…wrapped the girl in the car's floor mats.»",kz:"«…wrapped the girl in the car's floor mats.»"}},
      {q:"What did the emergency service tell them to do?",o:["Walk towards the lights.","Stay in the vehicle.","Drive slowly to Karaganda."],a:1,e:{en:"“…a convoy was coming from Karaganda; stay in the vehicle; do not walk.”",ru:"«…stay in the vehicle; do not walk.»",kz:"«…stay in the vehicle; do not walk.»"}},
      {q:"When did the convoy reach them?",o:["at three in the morning","at nine in the morning","at four in the afternoon"],a:1,e:{en:"“The convoy… reached them at nine in the morning, twenty hours after they had left Astana.”",ru:"«…reached them at nine in the morning…»",kz:"«…reached them at nine in the morning…»"}}
    ]},
    {type:"match",instruction:INS.matchD,explanation:EXPL.match,pairs:[
      {l:"blizzard",r:{en:"a severe snowstorm with strong wind",ru:"буран, метель",kz:"боран"}},{l:"visibility",r:{en:"how far you can see",ru:"видимость",kz:"көріну қашықтығы"}},
      {l:"drift",r:{en:"a pile of snow made by the wind",ru:"сугроб",kz:"күртік"}},{l:"hypothermia",r:{en:"a dangerously low body temperature",ru:"переохлаждение",kz:"тоңу, гипотермия"}},
      {l:"convoy",r:{en:"a group of vehicles travelling together",ru:"колонна",kz:"колонна"}},{l:"ration",r:{en:"use only a limited amount of something",ru:"нормировать, экономить",kz:"үнемдеп жұмсау"}}
    ]},
    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[
      "Aslan set off from Astana to Karaganda with his family despite a forecast of strengthening wind.","An hour later a buran closed the road, and sixty vehicles were trapped between police barriers.","Madina remembered that a blocked exhaust pipe can kill, so they ran the engine only ten minutes an hour.","The temperature fell to minus thirty-one, and they used clothes and floor mats to stay warm.","The emergency service told them to stay in the car, and a convoy reached them after twenty hours.","Aslan now keeps an emergency box in his car and stays at home when the forecast is bad."

      {s:"During the night Aslan saw",o:["wolves","figures walking past in the snow","the lights of Karaganda"],a:1,e:{en:"“Twice during the night Aslan saw figures walking past in the white.”",ru:"«…figures walking past in the white.»",kz:"«…figures walking past in the white.»"}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"Aslan had told his brother when he expected to arrive.",a:false,e:{en:"“…he had not told anyone when he expected to arrive.”",ru:"«…he had not told anyone…»",kz:"«…he had not told anyone…»"}},
      {s:"The snow was falling straight down.",a:false,e:{en:"“…not falling but flying, horizontally…”",ru:"«…flying, horizontally…»",kz:"«…flying, horizontally…»"}},

{ id:"b2-mys-camera", level:"B2", genre:"mystery", title:"The Film in the Old Camera", cover:{emoji:"🎞️"},
  task:{en:"Read and find out: who was the woman in the photographs?",ru:"Прочитайте и узнайте: кем была женщина на фотографиях?",kz:"Оқып, біліңіз: фотосуреттердегі әйел кім болған?"},
  words:[
    {en:"flea market",tr:"/ˈfliː ˌmɑːkɪt/",ru:"блошиный рынок",kz:"ескі заттар базары",ex:"Arman bought the camera at a flea market for the price of two coffees."},
    {en:"expose",tr:"/ɪkˈspəʊz/",ru:"экспонировать, засветить (плёнку)",kz:"жарық түсіру (үлдірге)",ex:"Twenty-four frames had already been exposed."},
    {en:"faded",tr:"/ˈfeɪdɪd/",ru:"выцветший",kz:"өңі кеткен",ex:"The colours were faded, as if seen through tea."},
    {en:"trace",tr:"/treɪs/",ru:"след; отследить",kz:"із; ізін табу",ex:"There was no trace of the photographer."},
    {en:"landmark",tr:"/ˈlændmɑːk/",ru:"ориентир, приметное здание",kz:"бағдар, көрнекті нысан",ex:"Every landmark in the pictures had changed."},
    {en:"resemblance",tr:"/rɪˈzembləns/",ru:"сходство",kz:"ұқсастық",ex:"The resemblance was impossible to ignore."},
    {en:"reluctant",tr:"/rɪˈlʌktənt/",ru:"неохотный",kz:"ықылассыз, қаламайтын",ex:"The old man was reluctant to talk at first."},
    {en:"closure",tr:"/ˈkləʊʒə/",ru:"завершение, чувство завершённости",kz:"аяқталу сезімі",ex:"For the family, the photographs brought a kind of closure."}
  ],
  text:[
    "The camera cost Arman 1,500 tenge at the Sunday flea market near the old bus station in Almaty — roughly the price of two coffees. It was a Soviet Zenit from the 1980s. He bought it because he collected such things, and because the seller said it had belonged to her late husband. Only when he got home and opened the back did he find that there was a film inside. The counter said twenty-four. Twenty-four frames had been exposed and never developed.",
    "Developing a forty-year-old film is a gamble. Arman found a photographer who still worked with chemicals, and a week later he was holding a strip of negatives and a set of prints. The colours had faded to orange and brown, but the images were clear. A young woman in a white coat on the steps of a building. The same woman laughing, holding a bunch of tulips. A man in a suit at a table with a cake, a “40” written on it in cream. Every frame was dated by the small orange numbers in the corner: April 1986.",
    "Arman posted three of the photographs online with a simple question: does anyone know these people? Within a day, the post had been shared thousands of times. Almaty residents recognised the street — Furmanov Street, now Nazarbayev Avenue — and the building, which had been a polyclinic and was now a bank. Every landmark in the pictures had changed its name, its use or its colour. But nobody recognised the woman.",
    "The answer came from a different direction. A university lecturer wrote to Arman privately. She had seen the pictures, she said, and she thought the woman was her mother, who had worked as a doctor at that polyclinic and had died in 1994, when the lecturer was nine. The resemblance to her own daughter, she added, was impossible to ignore.",
    "They met at the flea market. The seller was there, at the same table, and she was reluctant to talk at first. Then the lecturer showed her the picture of the man with the cake, and the old woman sat down. The man was her husband. In April 1986 he had turned forty, and his colleagues at the polyclinic — he was a driver there — had given him the camera. He had used it for one afternoon and one birthday party, and then, she said, life had happened: the years after 1986 were hard, film was expensive, the camera went into a cupboard. He had died the previous winter.",
    "There is no great secret in this story. Nobody was lost and nobody was found. But the lecturer now has eleven photographs of her mother, laughing in the spring of 1986, that did not exist a month before. The seller has a print of her husband on his fortieth birthday, And Arman has stopped buying cameras without opening the back first, because he has learned that every one of them might be holding somebody's April."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"A man buys an old camera and finds an undeveloped film inside. What is most likely on it?",o:["secret documents","ordinary photographs of a family from decades ago","nothing — old film does not survive"],a:1,
       e:{en:"The film held twenty-four ordinary pictures from April 1986: a woman, children, a birthday.",ru:"На плёнке оказались 24 обычных снимка из апреля 1986-го: женщина, дети, день рождения.",kz:"Үлдірде 1986 жылғы сәуірдегі 24 қарапайым сурет болды: әйел, балалар, туған күн."}}

    {type:"reflection",instruction:INS.reflection,q:"Do you have old family photographs? What do they mean to you, and who will keep them in the future? Write 3–4 sentences.",

{ id:"b2-his-otrar", level:"B2", genre:"history", title:"The City That Started a War", cover:{emoji:"🏺"},
  task:{en:"Read and find out: what happened to the merchants who arrived in Otrar in 1218?",ru:"Прочитайте и узнайте: что случилось с купцами, прибывшими в Отрар в 1218 году?",kz:"Оқып, біліңіз: 1218 жылы Отырарға келген саудагерлерге не болды?"},
  words:[
    {en:"caravan",tr:"/ˈkærəvæn/",ru:"караван",kz:"керуен",ex:"A caravan of several hundred merchants arrived at the gates."},
    {en:"governor",tr:"/ˈɡʌvənə/",ru:"наместник, правитель",kz:"әмірші, билеуші",ex:"The governor of Otrar accused them of being spies."},
    {en:"execute",tr:"/ˈeksɪkjuːt/",ru:"казнить",kz:"өлім жазасына кесу",ex:"The merchants were executed and their goods were taken."},
    {en:"siege",tr:"/siːdʒ/",ru:"осада",kz:"қоршау",ex:"The siege of Otrar lasted five months."},
    {en:"scholar",tr:"/ˈskɒlə/",ru:"учёный (гуманитарий)",kz:"ғалым",ex:"The city was the birthplace of the scholar al-Farabi."},
    {en:"excavation",tr:"/ˌekskəˈveɪʃn/",ru:"раскопки",kz:"қазба жұмыстары",ex:"Excavations began in 1969 and continue today."},
    {en:"legend",tr:"/ˈledʒənd/",ru:"легенда",kz:"аңыз",ex:"According to legend, the library of Otrar was the second largest in the world."},
    {en:"consequence",tr:"/ˈkɒnsɪkwəns/",ru:"последствие",kz:"салдар",ex:"The consequences of one decision changed the map of Asia."}
  ],
  text:[
    "In the spring of 1218, a caravan of about 450 merchants, with 500 camels loaded with silk, silver and furs, arrived at the gates of Otrar, a walled city on the Syr Darya river in what is now southern Kazakhstan. They had been sent by Genghis Khan, and they carried a letter proposing peace and trade with the Khwarazmian Empire. The governor of Otrar, a man named Inalchuq, looked at the caravan, decided — or claimed to decide — that the merchants were spies, and had them all killed. Their goods were taken. A single camel driver escaped and carried the news back east.",
    "Genghis Khan did not go to war immediately. He sent three ambassadors to the Khwarazmian ruler, Shah Muhammad, to demand that the governor be handed over. The Shah executed the chief ambassador and sent the other two back with their beards burned off. The following year the Mongol army crossed the mountains, and the first city it reached was Otrar.",
    "The siege lasted five months. Otrar was well defended — its walls were thick, and the garrison had been strengthened to perhaps twenty thousand men — but the Mongols brought engineers and siege machines. When the outer city fell in February 1220, Inalchuq retreated to the citadel and held out for another month; when the last of his soldiers had died, the sources say, he threw roof tiles at the attackers with his own hands. He was captured alive. According to a story that may or may not be true, the Mongols poured molten silver into his eyes and ears.",
    "What followed was the destruction of the Khwarazmian Empire: Bukhara, Samarkand and Urgench fell within two years. The murder of a caravan at a border town had set in motion a war that changed the map of Asia. The Shah died on an island in the Caspian Sea, a fugitive.",
    "Otrar itself did not disappear. The city was rebuilt, and for another five hundred years it remained a trading centre on the Silk Road. It had been the birthplace, three centuries earlier, of al-Farabi, the philosopher whom the medieval world called “the Second Teacher”, and according to a persistent legend its library had once been the second largest on earth after Alexandria's — a claim for which no evidence has ever been found. In 1405 the conqueror Timur died there. By the eighteenth century, however, the river had shifted, the trade routes had moved, and the city was slowly abandoned to the sand.",
    "Archaeologists have been digging at Otrar since 1969. They have uncovered streets, baths, a mosque and the foundations of the citadel where Inalchuq made his last stand. The site is now protected, and Kazakhstan has proposed it for the UNESCO World Heritage list. Visitors who stand on the mound today see a quiet landscape of dry grass and low walls. The consequences of what happened to the caravan at the gates are still, in a sense, being felt."
  ],

      {s:"The caravan carried a proposal of peace and trade.",a:"T",e:{en:"“…they carried a letter proposing peace and trade…”",ru:"«…a letter proposing peace and trade…»",kz:"«…a letter proposing peace and trade…»"}},

      {s:"Inalchuq was related to the Shah.",a:"NG",e:{en:"The text does not describe any family relationship.",ru:"О родственных связях в тексте не сказано.",kz:"Мәтінде туыстық байланыс туралы айтылмаған."}},

      {q:"What did Inalchuq do when his soldiers were dead?",o:["He surrendered.","He escaped through a tunnel.","He threw roof tiles at the attackers."],a:2,e:{en:"“…he threw roof tiles at the attackers with his own hands.”",ru:"«…he threw roof tiles at the attackers…»",kz:"«…he threw roof tiles at the attackers…»"}},

      {l:"execute",r:{en:"kill someone as a punishment",ru:"казнить",kz:"өлім жазасына кесу"}},{l:"siege",r:{en:"surrounding a city with an army until it surrenders",ru:"осада",kz:"қоршау"}},

    {type:"order",instruction:INS.order,explanation:EXPL.order,items:[

      {s:"The Shah died",o:["in Otrar","on an island in the Caspian Sea","in Samarkand"],a:1,e:{en:"“The Shah died on an island in the Caspian Sea, a fugitive.”",ru:"«…on an island in the Caspian Sea…»",kz:"«…on an island in the Caspian Sea…»"}},

    ]},
    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[
      "In 1218 the governor of Otrar killed a caravan of merchants sent by Genghis Khan.","The Shah then executed a Mongol ambassador, and war became inevitable.","The Mongols besieged Otrar for five months and captured Inalchuq alive.","The Khwarazmian Empire was destroyed within two years.","Otrar was rebuilt and remained a Silk Road city for five hundred years before the sand took it.","Since 1969 archaeologists have been uncovering the city, and Kazakhstan wants it on the UNESCO list."
    ]},
    {type:"reflection",instruction:INS.reflection,q:"One decision by a governor led to a war that changed Asia. Can you think of a small decision in your own life that had big consequences? Write 3–4 sentences.",
     keys:[["decision","decided","chose","choice"],["consequence","consequences","changed","result","led"],["because","later","now","life"]],min:2,
     model:"Ten years ago I decided, almost by accident, to take an English course instead of a computer course. That small decision led to a job in a foreign company and to most of the friends I have now. I often wonder what the other path would have looked like."}

/* ───────── 13 · TECHNOLOGY ───────── */
{ id:"b2-tec-battery", level:"B2", genre:"technology", title:"The Ninety-Seven-Year-Old Nobel Winner", cover:{emoji:"🔋"},
  task:{en:"Read and find out: why did Goodenough's employer let his invention go?",ru:"Прочитайте и узнайте: почему работодатель Гуденафа отказался от его изобретения?",kz:"Оқып, біліңіз: Гуденафтың жұмыс берушісі оның өнертабысынан неге бас тартты?"},
  words:[
    {en:"lithium",tr:"/ˈlɪθiəm/",ru:"литий",kz:"литий",ex:"Almost every phone on Earth runs on a lithium-ion battery."},
    {en:"rechargeable",tr:"/ˌriːˈtʃɑːdʒəbl/",ru:"перезаряжаемый",kz:"қайта зарядталатын",ex:"The first rechargeable lithium battery was dangerous."},
    {en:"catch fire",tr:"/kætʃ ˈfaɪə/",ru:"загореться",kz:"өртену, тұтану",ex:"Early prototypes sometimes caught fire."},
    {en:"electrode",tr:"/ɪˈlektrəʊd/",ru:"электрод",kz:"электрод",ex:"Goodenough replaced one electrode with a new material."},
    {en:"patent",tr:"/ˈpætnt/",ru:"патент",kz:"патент",ex:"The university did not think the patent was worth keeping."},
    {en:"royalty",tr:"/ˈrɔɪəlti/",ru:"авторские отчисления",kz:"роялти, авторлық төлем",ex:"He never received a royalty from the billions of batteries sold."},
    {en:"laureate",tr:"/ˈlɒriət/",ru:"лауреат",kz:"лауреат",ex:"At ninety-seven he became the oldest Nobel laureate in history."},
    {en:"solid-state",tr:"/ˌsɒlɪd ˈsteɪt/",ru:"твердотельный",kz:"қатты денелі",ex:"He spent his last years working on a solid-state battery."}
  ],
  text:[
    "The phone in your pocket, the laptop on your desk, the electric car in the street all depend on the same invention: the lithium-ion battery. It is so common that it has become invisible. Yet in 1980, when a fifty-seven-year-old American physicist at Oxford University worked out the key to making it, almost nobody was interested — including his own employer.",
    "John Goodenough had come to science late. Dyslexic as a child, he did not learn to read properly until he was twelve, and he entered physics only after serving as a meteorologist in the Second World War. By the 1970s he was a respected but not famous scientist at MIT. When his funding was cut, he moved to Oxford, in England, to run its chemistry laboratory — an unusual appointment for a man who, by his own admission, had never taken a chemistry degree.",
    "At that time the idea of a rechargeable lithium battery already existed. Stanley Whittingham, working for the oil company Exxon, had built one in the mid-1970s. Lithium holds an enormous amount of energy, which is why it is dangerous: Whittingham's prototypes sometimes caught fire, and Exxon eventually abandoned the project. Goodenough's insight was to change one of the two electrodes. Instead of pure lithium metal, he used lithium cobalt oxide. The new battery produced twice the voltage of the old one and was far more stable.",
    "Oxford did not want it. The university's lawyers decided that a patent would be expensive and probably worthless. He gave the rights to a British government laboratory, which later licensed them to Sony. In 1991 the Japanese company, using the work of a third scientist, Akira Yoshino, put the first commercial lithium-ion battery on sale. Goodenough never received a royalty. “I didn't know it was going to be worth billions,” he said later, without apparent bitterness. “I just wanted to solve the problem.”",
    "In 2019, at the age of ninety-seven, Goodenough shared the Nobel Prize in Chemistry with Whittingham and Yoshino, becoming the oldest laureate in the history of the prize. He was still going to his laboratory at the University of Texas every day; he had refused to retire on the grounds that he had not finished. His final project, on which he worked into his late nineties, was a solid-state battery — one with no liquid inside. He died in 2023, a month before his hundred-and-first birthday.",
    "There is an obvious lesson in the story about institutions that fail to recognise what is in front of them. There is a less obvious one about time. Goodenough did his most important work at fifty-seven, was awarded for it at ninety-seven, and was still trying to improve on it at ninety-nine. Asked once why he kept working, he answered: “Some of us are turtles. We crawl and struggle along, and by the time we're sixty or seventy, we've learned something.”"
  ],

{ id:"b2-nat-whale", level:"B2", genre:"nature", title:"The Whale That Sings Alone", cover:{emoji:"🐳"},
  task:{en:"Read and find out: why might no other whale answer the 52-hertz call?",ru:"Прочитайте и узнайте: почему на зов на частоте 52 герца, возможно, не отвечает ни один кит?",kz:"Оқып, біліңіз: 52 герц жиілігіндегі дауысқа неге басқа кит жауап бермеуі мүмкін?"},
  words:[
    {en:"hydrophone",tr:"/ˈhaɪdrəfəʊn/",ru:"гидрофон",kz:"гидрофон",ex:"The US Navy used hydrophones to listen for submarines."},
    {en:"pitch",tr:"/pɪtʃ/",ru:"высота (звука)",kz:"дыбыс биіктігі",ex:"The call was at a much higher pitch than any known whale."},
    {en:"hertz",tr:"/hɜːts/",ru:"герц",kz:"герц",ex:"Blue whales sing at about fifteen to twenty hertz; this one sang at fifty-two."},
    {en:"hybrid",tr:"/ˈhaɪbrɪd/",ru:"гибрид",kz:"гибрид, будан",ex:"One theory is that the animal is a hybrid of two species."},
    {en:"migration",tr:"/maɪˈɡreɪʃn/",ru:"миграция",kz:"көші-қон",ex:"Its migration route does not match that of any known population."},
    {en:"deaf",tr:"/def/",ru:"глухой",kz:"саңырау",ex:"Perhaps the whale is deaf and cannot hear that nobody answers."},
    {en:"lonely",tr:"/ˈləʊnli/",ru:"одинокий",kz:"жалғыз",ex:"The press called it the loneliest whale in the world."},
    {en:"project onto",tr:"/prəˈdʒekt ˈɒntuː/",ru:"проецировать на",kz:"телу, өз сезімін жапсыру",ex:"Humans project their own feelings onto the animal."}
  ],
  text:[
    "In 1989, hydrophones that the United States Navy had placed on the floor of the Pacific Ocean to listen for Soviet submarines picked up something that was not a submarine. It was a whale, but it was singing at a pitch that no whale should have. Blue whales call at around fifteen to twenty hertz; fin whales sing a little higher. This animal was calling at fifty-two hertz, roughly the lowest note of a tuba. Nobody had heard anything like it, and, as far as the recordings could tell, nobody was answering.",
    "The Navy passed the recordings to a marine biologist, William Watkins, who followed the whale for twelve years. Every autumn the call appeared somewhere off the coast of California; every winter it moved south, in a route that did not match the migration of any known population. The voice changed slightly as the years passed — it grew deeper, as whale voices do with age — but it remained unique. Watkins published his results in 2004 and died the same year. His paper was cautious and technical. The public reaction was not.",
    "Newspapers named the animal “the loneliest whale in the world”. The idea was irresistible: a creature swimming across an entire ocean, calling out for decades in a language that no other whale could understand. Children sent letters to the scientists asking whether the whale was sad. A crowdfunded expedition set out in 2015 to find it, with a film crew on board. It did not succeed.",
    "Scientists, meanwhile, have offered less romantic explanations. One is that the whale is a hybrid — the offspring of a blue whale and a fin whale, which are known to breed occasionally — and that its unusual body simply produces an unusual voice. Another is that it is deaf, or has some other physical difference, and cannot hear its own strangeness. A third, and perhaps the most important, is that other whales may hear it perfectly well. Whales have excellent hearing across a wide range. In other words, the loneliness may be entirely ours.",
    "There is another possibility, which emerged in 2010, when sensors off California recorded what appeared to be 52-hertz calls at two places at the same time. If that is correct, there is more than one such animal — perhaps a small group, perhaps a family — and the whale that has been swimming alone in the public imagination for thirty years has had company all along.",
    "The animal has never been seen. Nobody knows what it looks like, how long it is, or whether it is still alive; the calls have been recorded as recently as the 2020s, but a whale first heard in 1989 would now be old. What the story reveals, in the end, is less about whales than about people. We heard a voice we could not place, and we gave it the feeling we most feared for ourselves. The whale, presumably, was just singing."
  ],

{ id:"b2-peo-school", level:"B2", genre:"people", title:"Six Pupils and One Teacher", cover:{emoji:"🏫"},
  task:{en:"Read and find out: what argument finally kept the school open?",ru:"Прочитайте и узнайте: какой аргумент в итоге сохранил школу?",kz:"Оқып, біліңіз: мектепті сақтап қалған қандай дәлел болды?"},
  words:[
    {en:"enrol",tr:"/ɪnˈrəʊl/",ru:"зачислять(ся)",kz:"тіркелу, оқуға қабылдау",ex:"Only six children were enrolled for the new school year."},
    {en:"shut down",tr:"/ʃʌt ˈdaʊn/",ru:"закрыть (учреждение)",kz:"жабу",ex:"The district planned to shut the school down."},
    {en:"boarding school",tr:"/ˈbɔːdɪŋ skuːl/",ru:"школа-интернат",kz:"мектеп-интернат",ex:"The children would go to a boarding school forty kilometres away."},
    {en:"petition",tr:"/pəˈtɪʃn/",ru:"петиция",kz:"петиция, өтініш",ex:"The parents wrote a petition to the regional government."},
    {en:"budget",tr:"/ˈbʌdʒɪt/",ru:"бюджет",kz:"бюджет",ex:"The district said the budget could not support such a small school."},
    {en:"multi-grade",tr:"/ˌmʌlti ˈɡreɪd/",ru:"разновозрастный (класс)",kz:"аралас сыныпты",ex:"She teaches a multi-grade class: three subjects, four ages, one room."},
    {en:"outcome",tr:"/ˈaʊtkʌm/",ru:"результат, исход",kz:"нәтиже",ex:"The outcome surprised everyone, including the teacher."},
    {en:"stubborn",tr:"/ˈstʌbən/",ru:"упрямый",kz:"қыңыр, табанды",ex:"“I am not brave,” she says. “I am stubborn.”"}
  ],
  text:[
    "The school in Kyzyl-Tu, a village of ninety houses in the east of Kazakhstan, has one classroom, one stove, one teacher and, as of last September, six pupils. The youngest is seven and the oldest is eleven. They sit in two rows facing a whiteboard that was donated by a company in Öskemen, and Gulzhan Sadykova — who has taught in this room for twenty-three years — moves between them like a chess player making moves on four boards at once. It is called multi-grade teaching.",
    "Two years ago, the district announced that the school would be shut down. The reasoning was not cruel, merely arithmetical: a school with eight pupils, as it then had, cost the budget more per child than any other in the region, and the children could be taken by bus to a boarding school forty kilometres away. Most of the villages, the district noted, had accepted it.",
    "Kyzyl-Tu did not. The parents wrote a petition; the older residents wrote another. Gulzhan did something more unusual. She kept records. For every child who had passed through her classroom in twenty-three years, she wrote down what had happened next. Then she compared her list with the results of the boarding school. Her pupils, it turned out, were more likely to finish secondary school and less likely to drop out at fifteen. The difference was not small.",
    "The district officials were polite but unmoved. Statistics from one village, they said, proved nothing. What changed their minds was a different argument, made by a farmer at a public meeting. If the school closed, he said, the young families would leave, because a village without a school is a village without a future. Three families had already told him they would go. And when they left, the village would need fewer buses, fewer roads and eventually no clinic, and the district would save far more money than it had planned to. “Is that,” he asked, “what you are trying to do?”",
    "The school stayed open, on a condition: it had to reach ten pupils within five years. That was two years ago. Since then two families have moved to Kyzyl-Tu, one of them from the city, specifically because of the small classes. Gulzhan now has six pupils instead of eight, which sounds like the wrong direction, until you learn that two of the eight graduated. The outcome, she admits, is still uncertain. She has started teaching an evening English class for adults in the same room, partly because a school that is used at night is harder to close.",
    "Asked whether she considers herself brave, she laughs. “I am not brave,” she says. “I am stubborn. I have been teaching in one room for twenty-three years. What else would I do?” Outside, the six pupils are running across the yard towards the bus that will take them home — three kilometres, not forty — and the stove is being lit for the evening class."
  ],

{ id:"b2-cul-trains", level:"B2", genre:"culture", title:"Twenty Seconds Early", cover:{emoji:"🚄"},
  task:{en:"Read and find out: why did a railway company apologise in 2017?",ru:"Прочитайте и узнайте: за что железнодорожная компания извинилась в 2017 году?",kz:"Оқып, біліңіз: 2017 жылы теміржол компаниясы не үшін кешірім сұрады?"},
  words:[

    {en:"timetable",tr:"/ˈtaɪmteɪbl/",ru:"расписание",kz:"кесте",ex:"The timetable is written in seconds, not minutes."},

    {en:"gesture",tr:"/ˈdʒestʃə/",ru:"жест",kz:"ым, қимыл",ex:"Drivers point and call out — a gesture for every check."},

    {en:"obsession",tr:"/əbˈseʃn/",ru:"одержимость",kz:"әуестік, шектен тыс құмарлық",ex:"Critics call it an obsession with punctuality."},
    {en:"certificate",tr:"/səˈtɪfɪkət/",ru:"справка",kz:"анықтама",ex:"Passengers receive a delay certificate for their employer."}
  ],
  text:[
    "In November 2017, a railway company north of Tokyo published a statement that was reported around the world. The Tsukuba Express, it said, had left Minami-Nagareyama station at 9:44:20 instead of 9:44:40. The train had departed twenty seconds early. Nobody had complained, and no passenger had been left behind. The company nevertheless issued a formal apology for “the great inconvenience” it had caused. Foreign newspapers found this hilarious. Japanese commuters mostly found it normal.",
    "Japan's railways are the most punctual in the world. The Shinkansen, the high-speed network that opened in 1964, carries around 400,000 passengers a day, and its average delay per train — including delays caused by earthquakes, typhoons and snow — is less than a minute. In sixty years of operation it has never had a fatal accident caused by derailment or collision. On the busiest lines in Tokyo, trains arrive every two to three minutes, and the timetable is written not in minutes but in fifteen-second units.",
    "How is this possible? Part of the answer is engineering: dedicated tracks with no level crossings, trains that are cleaned and turned round in seven minutes, and sensors that stop the whole network automatically when the ground begins to shake. Part of it is a culture that treats a delay as a personal failure. Drivers and platform staff use a system called “pointing and calling”: before every action, the worker points at the signal, the clock or the door and says aloud what they see. Studies have shown that it reduces errors by as much as eighty-five per cent, and it has been copied by railways from New York to Hong Kong.",
    "The system has a human cost. If a train is late by more than five minutes — which, by international standards, would not count as late at all — the company hands out delay certificates that passengers can show their employers, because being late for work without an official reason is considered serious. Critics inside Japan have argued for years that the obsession with the timetable puts too much pressure on drivers. In 2005, a driver in the west of the country, trying to make up a delay of ninety seconds, took a curve too fast; the train left the rails and 107 people died. Rules were changed after the crash. The expectation of perfect punctuality was not.",
    "For visitors, the experience is mostly a pleasure. You can plan a journey across the country to the minute and arrive when the timetable says you will. On the platform, marks on the floor show exactly where each door will stop, and people queue in front of them. When the train comes in, the cleaning staff bow to it. When it leaves, the platform staff bow again.",
    "In 2018 another company, West Japan Railway, apologised because a train had left twenty-five seconds early. This time, one passenger had actually missed it. The apology was longer."
  ],

{ id:"c1-sci-replication", level:"C1", genre:"science", title:"The Study That Checked the Studies", cover:{emoji:"🔬"},
  task:{en:"Read and find out: what proportion of the hundred studies produced the same result when repeated?",ru:"Прочитайте и узнайте: какая доля из ста исследований дала тот же результат при повторении?",kz:"Оқып, біліңіз: жүз зерттеудің қанша бөлігі қайталанғанда сол нәтижені берді?"},
  words:[
    {en:"replicate",tr:"/ˈreplɪkeɪt/",ru:"воспроизводить (эксперимент)",kz:"қайталау (тәжірибені)",ex:"A finding that cannot be replicated is not yet knowledge."},
    {en:"peer-reviewed",tr:"/ˌpɪə rɪˈvjuːd/",ru:"рецензируемый",kz:"сарапшылар тексерген",ex:"All hundred studies had appeared in peer-reviewed journals."},
    {en:"statistically significant",tr:"/stəˌtɪstɪkli sɪɡˈnɪfɪkənt/",ru:"статистически значимый",kz:"статистикалық тұрғыдан маңызды",ex:"Only 36 per cent of the repeated experiments produced a statistically significant result."},
    {en:"incentive",tr:"/ɪnˈsentɪv/",ru:"стимул",kz:"ынталандыру, себеп",ex:"The incentives of academic life reward novelty, not verification."},
    {en:"flexibility",tr:"/ˌfleksəˈbɪləti/",ru:"гибкость (здесь: свобода манипуляций)",kz:"икемділік",ex:"Analytical flexibility allows researchers to find patterns in noise."},
    {en:"preregister",tr:"/ˌpriːˈredʒɪstə/",ru:"предварительно регистрировать (план исследования)",kz:"алдын ала тіркеу",ex:"Researchers now preregister their hypotheses before collecting data."},
    {en:"self-correcting",tr:"/ˌself kəˈrektɪŋ/",ru:"самокорректирующийся",kz:"өзін-өзі түзететін",ex:"Science is supposed to be self-correcting."},
    {en:"humility",tr:"/hjuːˈmɪləti/",ru:"смирение, скромность",kz:"кішіпейілділік",ex:"The episode has taught the field a certain humility."}
  ],
  text:[
    "In August 2015 the journal Science published a paper with 270 authors and a deceptively modest title: “Estimating the reproducibility of psychological science.” Behind it lay four years of work by a loose network of researchers who had done something that almost nobody in their profession does: instead of running new experiments, they had gone back and repeated old ones. They chose one hundred studies, all published in three leading peer-reviewed journals in 2008, and attempted, as faithfully as they could, to reproduce them. The results made headlines around the world, and not because they were reassuring.",
    "Of the original hundred studies, ninety-seven had reported a statistically significant effect — the conventional threshold at which a result is considered real rather than accidental. When the experiments were repeated, only thirty-six did. Where effects did appear, they were on average about half as large as first claimed. Well-known findings crumbled: the idea that adopting a “power pose” for two minutes changes your hormones and your confidence; the claim that willpower is a limited resource which runs out like fuel; the suggestion that reading a passage about old age makes people walk more slowly down a corridor. Each had been cited hundreds of times, taught in textbooks and repeated in bestselling books. None survived intact.",
    "The paper did not accuse anyone of fraud, and fraud, in fact, is the least of the problem. What it exposed was something more ordinary and therefore more troubling: a set of incentives that quietly push honest people towards unreliable conclusions. Academic careers are built on publications, journals prefer novel and positive results, and a study that finds nothing is nearly impossible to publish. Under those conditions, researchers acquire a great deal of what statisticians politely call “analytical flexibility.” They can stop collecting data as soon as the numbers look favourable, test a dozen variables and report the one that worked, or quietly drop the participants who spoil the pattern. None of this feels like cheating from the inside. Each decision is defensible on its own. Together, they allow a scientist to find a signal in pure noise — and to believe it.",
    "The problem, it soon became clear, was not confined to psychology. Similar exercises in cancer biology, economics and medicine produced comparable figures, and in 2016 a survey of 1,500 scientists found that more than half had failed to reproduce their own results at least once. The phrase “replication crisis” entered the language, and with it an uncomfortable question: if a large fraction of the published literature could not be trusted, what exactly had the previous decades of research established?",
    "The response has been, by the standards of academic culture, remarkably fast. Thousands of researchers now preregister their studies — that is, they publish their hypotheses, sample sizes and methods of analysis before collecting a single data point, so that the flexibility described above is no longer available to them. Journals have begun to accept papers on the basis of the question and the design, rather than the result, which removes the pressure to produce a positive finding. Raw data and computer code, once jealously guarded, are increasingly shared by default. Several of the researchers whose famous findings failed to replicate have publicly acknowledged the fact — an act that, a generation earlier, would have been almost unthinkable.",
    "It would be easy to read all this as a story about the failure of science. It is more accurately a story about science doing, slowly and painfully, what it is supposed to do. A finding that has been published is not yet knowledge; it is a claim, and claims must survive attempts to destroy them. For decades the attempts were simply not being made, because nobody was rewarded for making them. The 2015 project was, in a sense, the field remembering its own rules.",
    "The episode has left the discipline with a certain humility, and perhaps with a better sense of what a single study can and cannot show. The next time a headline announces that scientists have proved something surprising about human nature, the appropriate response is neither belief nor cynicism, but a question that the 270 authors would recognise: has anyone tried it twice?"
  ],
