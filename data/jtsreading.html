{ id:"a2-peo-marathon", level:"A2", genre:"people", title:"Grandpa's First Marathon", cover:{emoji:"🏃"},
  task:{en:"Read and find out: what did Bolat Ata do with the armchair?",ru:"Прочитайте и узнайте: что Болат ата сделал с креслом?",kz:"Оқып, біліңіз: Болат ата креслоны не істеді?"},
  words:[
    {en:"armchair",tr:"/ˈɑːmtʃeə/",ru:"кресло",kz:"кресло",ex:"His family gave him a present: a big soft armchair."},
    {en:"rest",tr:"/rest/",ru:"отдыхать",kz:"демалу",ex:"“Now you can rest,” they said."},
    {en:"hurt",tr:"/hɜːt/",ru:"болеть",kz:"ауыру",ex:"His legs hurt, and his neighbours laughed."},
    {en:"further",tr:"/ˈfɜːðə/",ru:"дальше",kz:"алысырақ",ex:"He ran a little further every day."},
    {en:"race",tr:"/reɪs/",ru:"забег, гонка",kz:"жарыс",ex:"The short race is ten kilometres."},
    {en:"finish line",tr:"/ˈfɪnɪʃ laɪn/",ru:"финиш",kz:"мәре сызығы",ex:"When he crossed the finish line, the whole family was there."},
    {en:"whole",tr:"/həʊl/",ru:"весь, целый",kz:"бүкіл",ex:"…the whole family was there."}
  ],
  text:[
    "When Bolat Ata turned seventy, his family gave him a present: a big soft armchair. “Now you can rest,” they said. Bolat Ata looked at the chair, then out of the window. The next morning at six o'clock he put on his old sports shoes and went out.",
    "At first he couldn't run for two minutes. His legs hurt, and his neighbours laughed. “Where are you going, Ata?” “To the shop,” he said. But he went to the park every day and ran a little further: one kilometre, then three, then five.",
    "His granddaughter Aliya found out after a month. She didn't laugh. She bought him new shoes and made a plan. “Ata, the Almaty Marathon is in April,” she said. “The short race is ten kilometres. You should try.” “I'm going to run it faster than you,” he said.",
    "In April, thousands of people ran the Almaty Marathon. Bolat Ata was the oldest runner in his group, but not the slowest. When he crossed the finish line, the whole family was there — with the armchair. “Now you can rest,” they said. He sat down for one minute. Then he got up. “Next year, the half marathon,” he said."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"A man gets an armchair for his seventieth birthday. What does he do the next morning?",o:["He sits in the armchair all day.","He goes out to run.","He sells the armchair."],a:1,
       e:{en:"“The next morning at six o'clock he put on his old sports shoes and went out.”",ru:"«…he put on his old sports shoes and went out.»",kz:"«…he put on his old sports shoes and went out.»"}}
    ]},
    {type:"tf",instruction:INS.tf,items:[
      {s:"At first he couldn't run for two minutes.",a:true,e:{en:"“At first he couldn't run for two minutes.”",ru:"«At first he couldn't run for two minutes.»",kz:"«At first he couldn't run for two minutes.»"}},
      {s:"His family gave him sports shoes for his birthday.",a:false,e:{en:"They gave him an armchair. Aliya bought the shoes later.",ru:"Подарили кресло. Кроссовки позже купила Алия.",kz:"Кресло сыйлады. Аяқ киімді кейін Әлия сатып алды."}},
      {s:"Aliya made a plan for her grandfather.",a:true,e:{en:"“She bought him new shoes and made a plan.”",ru:"«…and made a plan.»",kz:"«…and made a plan.»"}},
      {s:"His neighbours helped him from the first day.",a:false,e:{en:"“…his neighbours laughed.”",ru:"«…his neighbours laughed.» — соседи смеялись.",kz:"«…his neighbours laughed.» — көршілері күлді."}},
      {s:"Bolat Ata was the slowest runner in his group.",a:false,e:{en:"“…the oldest runner in his group, but not the slowest.”",ru:"«…but not the slowest.»",kz:"«…but not the slowest.»"}}

     extra:["hour","slower"]},

      {l:"Who gave Bolat Ata the armchair?",r:"his family"},{l:"Where did he run every day?",r:"in the park"},{l:"Who bought him new shoes?",r:"his granddaughter Aliya"},
      {l:"When is the Almaty Marathon?",r:"in April"},{l:"What is he going to run next year?",r:"the half marathon"}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"“rest” means…",o:["run fast","relax and do nothing","cook"],a:1,e:{en:"Rest = relax, stop working.",ru:"Rest — отдыхать.",kz:"Rest — демалу."}},
      {q:"“further” means…",o:["a longer distance","faster","earlier"],a:0,e:{en:"Further = a longer way.",ru:"Further — дальше.",kz:"Further — алысырақ."}},

      {s:"He told his neighbours he was going",o:["to the park","to the shop","to the marathon"],a:1,e:{en:"“‘To the shop,’ he said. But he went to the park.”",ru:"«To the shop» — в магазин.",kz:"«To the shop» — дүкенге."}},

{ id:"a2-cul-bhutan", level:"A2", genre:"culture", title:"The Country Without Traffic Lights", cover:{emoji:"🚦"},
  task:{en:"Read and find out: what is more important than money in Bhutan?",ru:"Прочитайте и узнайте: что в Бутане важнее денег?",kz:"Оқып, біліңіз: Бутанда ақшадан не маңыздырақ?"},
  words:[
    {en:"capital",tr:"/ˈkæpɪtl/",ru:"столица",kz:"астана",ex:"Thimphu is a capital city with cars, shops and offices."},
    {en:"traffic",tr:"/ˈtræfɪk/",ru:"дорожное движение",kz:"жол қозғалысы",ex:"It has no traffic lights. Not one."},
    {en:"impersonal",tr:"/ɪmˈpɜːsənl/",ru:"безличный, холодный",kz:"жансыз, суық",ex:"“It's too impersonal,” they said."},
    {en:"glove",tr:"/ɡlʌv/",ru:"перчатка",kz:"қолғап",ex:"Police officers in white gloves direct the cars."},
    {en:"polite",tr:"/pəˈlaɪt/",ru:"вежливый",kz:"сыпайы",ex:"Drivers say it is more polite than a machine."},
    {en:"measure",tr:"/ˈmeʒə/",ru:"измерять",kz:"өлшеу",ex:"The country doesn't measure success in money."},
    {en:"government",tr:"/ˈɡʌvənmənt/",ru:"правительство",kz:"үкімет",ex:"The government asks people about their health and their friends."},
    {en:"fee",tr:"/fiː/",ru:"плата, сбор",kz:"төлем",ex:"Tourists must pay a fee for every day of their visit."}
  ],
  text:[
    "Thimphu is a capital city with cars, shops, offices and about one hundred thousand people. But it has something that no other capital in the world has: no traffic lights. Not one.",
    "Bhutan is a small country in the Himalayas. Years ago, the city put one traffic light on the main street, but people didn't like it. “It's too impersonal,” they said, and the city took it away. Today police officers in white gloves direct the cars with their hands. Drivers say it is more polite than a machine.",
    "Bhutan is different in other ways too. Television and the internet arrived only in 1999. The country doesn't measure success in money. In the 1970s the king said that “Gross National Happiness” was more important than money. So the government asks people about their health, their free time and their friends.",
    "The law says that more than sixty per cent of the country must always be forest. Bhutan takes more carbon out of the air than it puts in. Tourists must pay a fee for every day of their visit. It is expensive, but the roads are quiet, the air is clean, and you will never wait at a red light."

{ id:"b1-sci-tickle", level:"B1", genre:"science", title:"Why You Can't Tickle Yourself", cover:{emoji:"🪶"},
  task:{en:"Read and find out: what does the cerebellum do every time you move?",ru:"Прочитайте и узнайте: что делает мозжечок при каждом вашем движении?",kz:"Оқып, біліңіз: сіз қозғалған сайын мишық не істейді?"},

    {en:"ignore",tr:"/ɪɡˈnɔː/",ru:"игнорировать",kz:"елемеу",ex:"When the prediction is correct, the brain ignores the feeling."},
    {en:"unpredictable",tr:"/ˌʌnprɪˈdɪktəbl/",ru:"непредсказуемый",kz:"болжауға келмейтін",ex:"A friend's fingers are unpredictable."},
    {en:"expectation",tr:"/ˌekspekˈteɪʃn/",ru:"ожидание",kz:"күту, үміт",ex:"The brain expects the tickle, and the expectation is enough."}
  ],
  text:[
    "Try it now: tickle your own foot or the side of your body. Nothing happens, right? Now imagine a friend doing the same thing. You would probably laugh, jump or push their hand away. Why does the same touch feel so different?",
    "Scientists have asked this question for a long time. Charles Darwin wrote about it in 1872. But the first real answer came in 1998, when a team at University College London built a tickling machine. Volunteers put their hand under a machine that moved a soft piece of foam across their palm. When they controlled the machine themselves, they felt almost nothing. When the researchers controlled it, the same touch felt ticklish. Then the scientists added a tiny delay between the button and the foam — and suddenly people could tickle themselves.",
    "The explanation is in a part of the brain called the cerebellum. Every time you move, the cerebellum makes a prediction: “If I move my hand like this, I will feel that.” When the prediction is correct, the brain ignores the feeling. That is why you don't notice your own clothes, or your own hand on your knee. A friend's fingers are unpredictable, so the brain pays attention — and you laugh.",
    "Tickling is older than humans. Chimpanzees and gorillas laugh when they are tickled, and rats make happy sounds that are too high for us to hear. Some researchers believe that tickling helped young animals learn to protect their weak points, such as the neck and the stomach. Others think it is simply a way to play.",
    "One more strange fact: some people laugh before the fingers even touch them. The answer is the same — prediction. The brain expects the tickle, and the expectation is enough. So when someone says “I'm going to tickle you” and you start laughing, your cerebellum has already done its job."
  ],

      {s:"The tickling machine was built in Germany.",a:"F",e:{en:"“…a team at University College London built a tickling machine.”",ru:"«…University College London» — в Лондоне.",kz:"«…University College London» — Лондонда."}},

      {s:"The cerebellum makes predictions about movement.",a:"T",e:{en:"“Every time you move, the cerebellum makes a prediction.”",ru:"«…the cerebellum makes a prediction.»",kz:"«…the cerebellum makes a prediction.»"}},

  text:[
    "On Christmas Eve 1971, seventeen-year-old Juliane Koepcke was sitting next to her mother on a flight across Peru. They were flying to meet her father, a scientist who was working in the rainforest. Half an hour after take-off, the plane flew into a huge storm. Lightning hit the wing, and the aircraft broke apart in the air. Juliane, still fastened to her seat, fell three kilometres into the jungle.",
    "She woke up the next morning, alone, under the trees. Her collarbone was broken and one eye was swollen shut, but she was alive. Ninety-one other people, including her mother, had died. Juliane was wearing a thin dress and one sandal. She had no food, no map and no water — but she had something more useful. Her parents were biologists, and she had spent years with them in the rainforest. She knew one rule: if you are lost, find a stream and follow it downstream. Streams become rivers, and people live near rivers.",
    "For ten days she walked, swam and floated. She ate almost nothing — a few sweets from the plane — and drank rainwater. Insects laid eggs in the wound on her arm, and she had to remove the maggots herself. Crocodiles slept on the banks, but she knew they were less dangerous than the stingrays in the shallow water, so she walked in the middle of the stream.",
    "On the tenth day she found a small boat and a hut, and she waited. The next morning, three forest workers came back to the hut and found a thin, dirty girl who could barely stand. They took her by boat to the nearest village, and from there she was flown to hospital. She had survived eleven days in the Amazon.",
    "Juliane didn't stop going into the jungle. She became a biologist, like her parents, and today she runs the research station where her father worked. When people ask how she survived, her answer is simple: “I didn't panic. I just kept walking.”"
  ],

    {en:"explanation",tr:"/ˌekspləˈneɪʃn/",ru:"объяснение",kz:"түсіндірме",ex:"In the back of a notebook, Dana found the explanation."},
    {en:"whether",tr:"/ˈweðə/",ru:"ли (простила ли)",kz:"ма, ме (кешірді ме)",ex:"Whether she forgave Aizhan, nobody knows."}
  ],
  text:[
    "The envelope was yellow and soft, like old paper. It was addressed in neat blue handwriting to Gulnara Serikova, Abai Street 7, Taraz. The postmark said 12 May 1995. Dana turned it over in her hands. Gulnara Serikova was her grandmother — and her grandmother had died in 2019.",
    "“It came this morning,” said the postman. “We found a bag of old letters behind a machine in the sorting office. It has probably been there for thirty years.” Inside the envelope was a single page. “Dear Gulnara,” it began. “By the time you read this, you will be a grown woman. I hope you have become a doctor, like you always wanted. I hope you still play the dombra. And I hope you have forgiven Aizhan for breaking your bicycle.” It was signed: “Your friend from the past.”",
    "Who had written it? Dana asked her mother, who didn't know. She asked her great-aunt, who remembered a girl called Aizhan but nothing about a bicycle. She even visited the sorting office, where a tired manager showed her the bag: three hundred letters, all from May 1995, all undelivered. None of them helped.",
    "The answer came from the handwriting. Dana was looking through her grandmother's old school notebooks when she suddenly stopped. The letters were the same: the round “a”, the long tail on the “y”. Her grandmother had written the letter — to herself. In the back of a notebook, Dana found the explanation: “Project: Letter to the Future. Write to yourself in twenty years. The teacher will post the letters.” The teacher had posted them. The post office had lost them.",
    "Gulnara did become a doctor. She played the dombra until the end of her life. Whether she forgave Aizhan, nobody knows. But last month Dana bought an envelope, sat down at the kitchen table and wrote a letter. It begins: “Dear Dana. By the time you read this…”"
  ],

{ id:"b1-his-anning", level:"B1", genre:"history", title:"The Girl Who Sold Sea Monsters", cover:{emoji:"🦕"},
  task:{en:"Read and find out: why did scientists not give Mary credit for her discoveries?",ru:"Прочитайте и узнайте: почему учёные не признавали открытия Мэри?",kz:"Оқып, біліңіз: ғалымдар Мэридің жаңалықтарын неге мойындамады?"},
  words:[
    {en:"curious",tr:"/ˈkjʊəriəs/",ru:"любопытный, любознательный",kz:"білуге құмар",ex:"After that day she became curious about everything."},
    {en:"cliff",tr:"/klɪf/",ru:"утёс, скала",kz:"жар, жартас",ex:"He collected curiosities from the cliffs near the beach."},
    {en:"skull",tr:"/skʌl/",ru:"череп",kz:"бас сүйек",ex:"Joseph found a huge skull in the cliff."},
    {en:"fossil",tr:"/ˈfɒsl/",ru:"окаменелость",kz:"қазба қалдық",ex:"Famous geologists came to buy her fossils."},
    {en:"reptile",tr:"/ˈreptaɪl/",ru:"рептилия",kz:"бауырымен жорғалаушы",ex:"…a sea reptile with a neck like a snake."},
    {en:"discovery",tr:"/dɪˈskʌvəri/",ru:"открытие",kz:"жаңалық, ашылым",ex:"Scientists often published her discoveries under their own names."},
    {en:"publish",tr:"/ˈpʌblɪʃ/",ru:"публиковать",kz:"жариялау",ex:"Scientists often published her discoveries under their own names."},
    {en:"statue",tr:"/ˈstætʃuː/",ru:"статуя",kz:"мүсін",ex:"In 2022 a statue of Mary was put up on the beach."}
  ],
  text:[
    "In the summer of 1800, a storm hit the small English town of Lyme Regis. Lightning struck a group of people standing under a tree. Three of them died. The fourth was a baby girl, fifteen months old. She survived, and her family said that after that day she became curious about everything. Her name was Mary Anning.",
    "Mary's family was poor. Her father made furniture, and to earn extra money he collected “curiosities” from the cliffs near the beach — strange stones shaped like shells and bones — and sold them to tourists. When he died in 1810, Mary was eleven. She and her brother Joseph continued the work to feed the family.",
    "A year later, Joseph found a huge skull in the cliff. It looked like a crocodile, but with enormous eyes. Mary spent months digging out the rest of the skeleton: more than five metres long. Nobody had seen such an animal before. Scientists called it Ichthyosaurus, “fish lizard”. It had lived in the sea about 200 million years ago. The cliffs of Lyme Regis, it turned out, were full of monsters — and Mary had learned how to find them.",
    "Over the next thirty years she discovered the first complete plesiosaur, a sea reptile with a neck like a snake, and the first British pterosaur, a flying reptile. Famous geologists came from London and Paris to buy her fossils and ask her questions. But Mary was a woman and she was poor, so she could not join the Geological Society, and scientists often published her discoveries under their own names.",
    "Mary Anning died in 1847. For a long time she was almost forgotten; some people say that the tongue-twister “She sells seashells on the seashore” is about her. Today, however, she is called one of the most important fossil hunters in history. In 2022, after a campaign started by an eleven-year-old girl, a statue of Mary was put up on the beach at Lyme Regis — with her dog, and with a hammer in her hand."
  ],

    {type:"summary",instruction:INS.summary,explanation:EXPL.summary,items:[

    {type:"reflection",instruction:INS.reflection,q:"Why do you think Mary Anning was forgotten for so long? Is it different today? Write 3–4 sentences.",

/* ───────── 5 · TECHNOLOGY ───────── */
{ id:"b1-tec-bug", level:"B1", genre:"technology", title:"The First Computer Bug Was a Real Bug", cover:{emoji:"🦋"},
  task:{en:"Read and find out: what did Grace Hopper invent in 1952?",ru:"Прочитайте и узнайте: что Грейс Хоппер изобрела в 1952 году?",kz:"Оқып, біліңіз: Грейс Хоппер 1952 жылы не ойлап тапты?"},
  words:[
    {en:"relay",tr:"/ˈriːleɪ/",ru:"реле",kz:"реле",ex:"It was built from thousands of electric switches called relays."},
    {en:"moth",tr:"/mɒθ/",ru:"мотылёк, моль",kz:"көбелек, күйе",ex:"In relay number 70, they found the problem: a moth."},
    {en:"tweezers",tr:"/ˈtwiːzəz/",ru:"пинцет",kz:"пинцет",ex:"One of the engineers took the moth out with tweezers."},
    {en:"logbook",tr:"/ˈlɒɡbʊk/",ru:"журнал записей",kz:"жазба журналы",ex:"…and taped it into the logbook."},
    {en:"legend",tr:"/ˈledʒənd/",ru:"легенда",kz:"аңыз",ex:"The joke became a legend."},
    {en:"compiler",tr:"/kəmˈpaɪlə/",ru:"компилятор",kz:"компилятор",ex:"In 1952 she wrote the first compiler."},
    {en:"translate",tr:"/trænzˈleɪt/",ru:"переводить",kz:"аудару",ex:"…a program which translates human words into numbers."},
    {en:"retire",tr:"/rɪˈtaɪə/",ru:"выйти на пенсию",kz:"зейнетке шығу",ex:"She was the oldest active officer in the US Navy when she retired."}
  ],
  text:[
    "On 9 September 1947, something went wrong with the Mark II, one of the first computers in the world. The machine filled a room at Harvard University, and it was built from thousands of electric switches called relays. When a calculation failed, engineers opened the panels and began to search. In relay number 70, they found the problem: a moth, dead, stuck between two metal contacts.",
    "One of the engineers took the moth out with tweezers and taped it into the logbook. Next to it, somebody wrote: “First actual case of bug being found.” It was a joke. Engineers had used the word “bug” for a mechanical problem since the nineteenth century — Thomas Edison wrote about “bugs” in his machines in 1878. But now there was a real bug in a computer, and the joke became a legend.",
    "The team was led by Grace Hopper, a mathematician and an officer in the US Navy. She didn't find the moth herself, but she told the story so often that many people think she did. Hopper is famous for much bigger things. In 1952 she wrote the first compiler — a program which translates human words into the numbers that a computer understands. Before that, programmers had to write everything in ones and zeros. “Nobody believed it was possible,” she said later. “They told me computers could only do arithmetic.”",
    "Hopper also helped to create COBOL, a programming language that banks and governments still use today, seventy years later. She liked to give visitors a piece of wire about thirty centimetres long. That, she explained, is how far electricity travels in one nanosecond — a billionth of a second. It was her way of showing why computers must be fast and small.",
    "Grace Hopper worked until she was seventy-nine, and she was the oldest active officer in the US Navy when she retired. A warship has been named after her. And the moth? It is still in the logbook, which is kept in a museum in Washington. If you ever have to “debug” a program, you know who to thank."
  ],

       e:{en:"Engineers found a dead moth between two contacts in the Mark II computer.",ru:"Инженеры нашли мёртвого мотылька между контактами компьютера Mark II.",kz:"Инженерлер Mark II компьютерінің контактілері арасынан өлі көбелек тапты."}}
    ]},

      {s:"Grace Hopper found the moth herself.",a:"F",e:{en:"“She didn't find the moth herself…”",ru:"«She didn't find the moth herself…»",kz:"«She didn't find the moth herself…»"}},

{ id:"b1-nat-aral", level:"B1", genre:"nature", title:"The Sea That Came Back", cover:{emoji:"🌊"},
  task:{en:"Read and find out: what did the Kok-Aral dam change?",ru:"Прочитайте и узнайте: что изменила Кокаральская плотина?",kz:"Оқып, біліңіз: Көкарал бөгеті нені өзгертті?"},
  words:[
    {en:"cannery",tr:"/ˈkænəri/",ru:"консервный завод",kz:"консерві зауыты",ex:"The cannery on the shore sent fish to the whole Soviet Union."},
    {en:"harbour",tr:"/ˈhɑːbə/",ru:"гавань",kz:"айлақ",ex:"If you stand on the old harbour wall, you will see sand and camels."},
    {en:"rusty",tr:"/ˈrʌsti/",ru:"ржавый",kz:"тот басқан",ex:"…the rusty bodies of ships."},
    {en:"canal",tr:"/kəˈnæl/",ru:"канал",kz:"канал",ex:"Thousands of kilometres of canals were built."},
    {en:"shrink",tr:"/ʃrɪŋk/",ru:"уменьшаться, усыхать",kz:"кішірею, тартылу",ex:"The cotton grew, but the sea shrank."},
    {en:"salty",tr:"/ˈsɔːlti/",ru:"солёный",kz:"тұзды",ex:"The fish died because the water became too salty."},
    {en:"dam",tr:"/dæm/",ru:"плотина",kz:"бөгет",ex:"In 2005 Kazakhstan finished a dam, the Kok-Aral."},
    {en:"catch",tr:"/kætʃ/",ru:"улов",kz:"ауланған балық",ex:"The catch is measured in thousands of tonnes."}
  ],
  text:[
    "Sixty years ago, the town of Aralsk in western Kazakhstan was a busy port. Fishing boats came in every morning, and the cannery on the shore sent fish to the whole Soviet Union. Today, if you stand on the old harbour wall, you will see sand, camels and the rusty bodies of ships. This is the story of the Aral Sea — and of its surprising return.",
    "In 1960 the Aral was the fourth-largest lake in the world, bigger than the Netherlands. Two great rivers fed it: the Amu Darya and the Syr Darya. Then Soviet engineers began to take water from both rivers to grow cotton in the desert. Thousands of kilometres of canals were built. The cotton grew, but the sea shrank. By the 1990s it had lost most of its water and had broken into two parts. The fish died because the water became too salty. Storms carried salt and chemicals from the dry seabed into people's homes and lungs.",
    "Many experts said the sea was gone forever. But in 2005 Kazakhstan finished a dam, the Kok-Aral, which separated the smaller northern part from the dying southern part. Water from the Syr Darya no longer disappeared into the desert; it stayed in the North Aral. Within three years the water level had risen by four metres. The sea, which had been seventy kilometres from Aralsk, moved back to about twenty.",
    "Then the fish returned. Fishermen who had moved away came home. Today boats go out again from villages such as Tastubek, and the catch is measured in thousands of tonnes. Bream, carp and pike-perch swim in water that was once too salty for anything to live in. The climate has changed too: there is more rain, and summers are a little cooler.",
    "The South Aral, in Uzbekistan, is still mostly desert, and nobody expects it to come back. But the northern story shows something important. When people damage nature, they can sometimes repair it — if they decide to, and if they are willing to wait."
  ],
  exercises:[

      {q:"How far is the sea from Aralsk now, according to the text?",o:["about twenty kilometres","about seventy kilometres","about two hundred kilometres"],a:0,e:{en:"“…moved back to about twenty.”",ru:"«…moved back to about twenty.»",kz:"«…moved back to about twenty.»"}},

{ id:"b1-peo-cheval", level:"B1", genre:"people", title:"The Postman Who Built a Palace", cover:{emoji:"🏰"},
  task:{en:"Read and find out: where did Cheval get the pictures of temples and castles?",ru:"Прочитайте и узнайте: откуда Шеваль брал картинки храмов и замков?",kz:"Оқып, біліңіз: Шеваль храмдар мен қамалдардың суреттерін қайдан алды?"},
  words:[
    {en:"route",tr:"/ruːt/",ru:"маршрут",kz:"бағыт, жол",ex:"Every day he walked the same route, delivering letters."},
    {en:"deliver",tr:"/dɪˈlɪvə/",ru:"доставлять",kz:"жеткізу",ex:"He copied pictures from the magazines he delivered."},
    {en:"trip",tr:"/trɪp/",ru:"споткнуться",kz:"сүріну",ex:"Cheval tripped on a stone and nearly fell."},
    {en:"wheelbarrow",tr:"/ˈwiːlbærəʊ/",ru:"тачка",kz:"қол арба",ex:"…then a wheelbarrow, which he pushed along his route in the evenings."},
    {en:"cement",tr:"/sɪˈment/",ru:"цемент",kz:"цемент",ex:"He mixed cement, built walls, and pressed the stones into them."},
    {en:"struggle",tr:"/ˈstrʌɡl/",ru:"борьба, тяжёлый труд",kz:"күрес, ауыр еңбек",ex:"10,000 days, 93,000 hours, 33 years of struggle."},
    {en:"authorities",tr:"/ɔːˈθɒrətiz/",ru:"власти",kz:"билік",ex:"The authorities refused to let him be buried inside the palace."},
    {en:"cemetery",tr:"/ˈsemətri/",ru:"кладбище",kz:"зират",ex:"He spent eight years building his own tomb in the village cemetery."}
  ],
  text:[
    "Every day for more than thirty years, Ferdinand Cheval walked the same route: about thirty kilometres through the villages of south-east France, delivering letters. He was not a rich man, he had never studied art, and he had left school at thirteen. Yet today thousands of tourists visit the building he made with his own hands — a palace of towers, animals and giants that seems to come from a dream.",
    "It began in April 1879 with a stone. Cheval, who was forty-three, tripped on it and nearly fell. When he picked it up, he saw that water had shaped it into something strange and beautiful. He put it in his pocket. The next day he found another. Soon he was filling his pockets every day, then a basket, then a wheelbarrow, which he pushed along his route in the evenings. The villagers laughed. “The postman has gone mad,” they said.",
    "For thirty-three years Cheval worked on his palace — at night, by the light of an oil lamp, after a full day of walking. He mixed cement, built walls, and pressed the stones into them one by one. He had seen pictures of Hindu temples, Swiss chalets and Egyptian tombs in the magazines he delivered, and he copied them all. There is a mosque next to a medieval castle, a waterfall next to elephants, and on one wall he wrote: “10,000 days, 93,000 hours, 33 years of struggle.”",
    "The palace was finished in 1912. Cheval was seventy-six. When the authorities refused to let him be buried inside it, he spent another eight years building his own tomb in the village cemetery. He died in 1924, at the age of eighty-eight.",
    "The art world discovered the Palais Idéal after his death. Picasso drew it; the surrealists loved it. In 1969 the French government made it a historic monument, and the minister of culture called it “the only example of naive architecture in the world”. On the palace itself, Cheval left a simpler message for visitors: “The work of one man.”"
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"A postman with no art education built a palace. What did he build it from?",o:["stones he found on his route","old letters","wood from the forest"],a:0,
       e:{en:"He collected strange stones every day and pressed them into cement.",ru:"Он каждый день собирал необычные камни и вдавливал их в цемент.",kz:"Ол күн сайын әдеттен тыс тастар жинап, цементке батырып отырды."}}
    ]},

/* ───────── 8 · CULTURE & TRAVEL ───────── */
{ id:"b1-cul-astana", level:"B1", genre:"culture", title:"The Capital That Moved to the Steppe", cover:{emoji:"🏙️"},
  task:{en:"Read and find out: why did Kazakhstan move its capital from Almaty?",ru:"Прочитайте и узнайте: почему Казахстан перенёс столицу из Алматы?",kz:"Оқып, біліңіз: Қазақстан астананы Алматыдан неге көшірді?"},
  words:[
    {en:"announce",tr:"/əˈnaʊns/",ru:"объявлять",kz:"жариялау",ex:"Imagine that your government announces a plan: the capital will move."},
    {en:"earthquake",tr:"/ˈɜːθkweɪk/",ru:"землетрясение",kz:"жер сілкінісі",ex:"Almaty sits in an earthquake zone."},
    {en:"crowded",tr:"/ˈkraʊdɪd/",ru:"переполненный",kz:"халық көп, тығыз",ex:"It is crowded, and it lies in the far south-east corner of the country."},
    {en:"parliament",tr:"/ˈpɑːləmənt/",ru:"парламент",kz:"парламент",ex:"In 1994 the parliament chose Akmola."},
    {en:"architect",tr:"/ˈɑːkɪtekt/",ru:"архитектор",kz:"сәулетші",ex:"A Japanese architect, Kisho Kurokawa, designed the plan of the new city."},
    {en:"transparent",tr:"/trænsˈpærənt/",ru:"прозрачный",kz:"мөлдір",ex:"Khan Shatyr is a giant transparent tent."},
    {en:"average",tr:"/ˈævərɪdʒ/",ru:"средний",kz:"орташа",ex:"The average age of the city is under thirty-five."},
    {en:"squeak",tr:"/skwiːk/",ru:"скрипеть",kz:"сықырлау",ex:"The snow squeaks under your boots."}
  ],
  text:[
    "Imagine that your government announces a plan: the capital city will move. Not to a bigger city, but to a small, windy town in the middle of the steppe, where winter lasts six months and the temperature can fall to minus forty. That is what happened in Kazakhstan in 1997, and today the result is one of the most unusual capitals in the world.",
    "Almaty is a beautiful city under the mountains, but it has problems: it sits in an earthquake zone, it is crowded, and it lies in the far south-east corner of a huge country. In 1994 the parliament chose Akmola, a town of about 300,000 people on the Ishim river, almost in the centre of Kazakhstan. On 10 December 1997, the capital officially moved. A year later the town was renamed Astana, which simply means “capital”.",
    "Then the building began. A Japanese architect, Kisho Kurokawa, designed the plan of the new city, and famous architects from around the world added their ideas. The Baiterek tower, 97 metres high, looks like a tree with a golden egg at the top — an image from an old Kazakh legend. Khan Shatyr, designed by the British architect Norman Foster, is a giant transparent tent with shops, a river and even a sandy beach inside, where people wear T-shirts while it is minus thirty outside. There is also a glass pyramid, a concert hall shaped like a flower and a library shaped like a doughnut.",
    "The population has grown from 300,000 to more than 1.4 million. The average age of the city is under thirty-five. The name has changed too: from 2019 to 2022 the city was called Nur-Sultan, before it became Astana again.",
    "Visitors are usually surprised by two things: the cold and the light. On a winter morning the sky is bright blue, the snow squeaks under your boots, and the glass towers shine like ice. But if you want to see what a country builds when it starts again from empty land, take the train north."
  ],
  exercises:[

      {s:"Almaty is in an earthquake zone.",a:"T",e:{en:"“…it sits in an earthquake zone…”",ru:"«…it sits in an earthquake zone…»",kz:"«…it sits in an earthquake zone…»"}},

      {s:"The capital moved in December 1997.",a:"T",e:{en:"“On 10 December 1997, the capital officially moved.”",ru:"«On 10 December 1997…»",kz:"«On 10 December 1997…»"}},
      {s:"Kisho Kurokawa was born in Astana.",a:"NG",e:{en:"The text only says he was a Japanese architect.",ru:"Сказано лишь, что он японский архитектор.",kz:"Тек жапон сәулетшісі екені айтылған."}},
      {s:"Khan Shatyr has a beach inside.",a:"T",e:{en:"“…a river and even a sandy beach inside…”",ru:"«…even a sandy beach inside…»",kz:"«…even a sandy beach inside…»"}},
      {s:"The average age in Astana is over fifty.",a:"F",e:{en:"“…the average age of the city is under thirty-five.”",ru:"«…under thirty-five.»",kz:"«…under thirty-five.»"}},
      {s:"Most tourists visit Astana in summer.",a:"NG",e:{en:"The text does not say when tourists visit.",ru:"В тексте не сказано, когда приезжают туристы.",kz:"Мәтінде туристердің қашан келетіні айтылмаған."}}
    ]},

{ id:"b1-sci-marshall", level:"B1", genre:"science", title:"The Doctor Who Drank Bacteria", cover:{emoji:"🧫"},
  task:{en:"Read and find out: why did Marshall test the idea on himself?",ru:"Прочитайте и узнайте: почему Маршалл проверил идею на себе?",kz:"Оқып, біліңіз: Маршалл идеяны неге өзінде сынады?"},
  words:[
    {en:"ulcer",tr:"/ˈʌlsə/",ru:"язва",kz:"ойық жара",ex:"Stomach ulcers are painful wounds inside the stomach."},
    {en:"acid",tr:"/ˈæsɪd/",ru:"кислота",kz:"қышқыл",ex:"The stomach is full of acid, and nothing can live there."},
    {en:"surgeon",tr:"/ˈsɜːdʒən/",ru:"хирург",kz:"хирург",ex:"When that failed, surgeons removed part of the stomach."},
    {en:"microscope",tr:"/ˈmaɪkrəskəʊp/",ru:"микроскоп",kz:"микроскоп",ex:"Warren noticed something strange under his microscope."},
    {en:"reject",tr:"/rɪˈdʒekt/",ru:"отвергать",kz:"қабылдамау",ex:"Their papers were rejected."},
    {en:"permission",tr:"/pəˈmɪʃn/",ru:"разрешение",kz:"рұқсат",ex:"Marshall couldn't test his idea on patients without permission."},
    {en:"sample",tr:"/ˈsɑːmpl/",ru:"образец",kz:"үлгі",ex:"A colleague took a sample from his stomach."},
    {en:"cure",tr:"/kjʊə/",ru:"вылечить",kz:"емдеп жазу",ex:"Marshall then cured himself with antibiotics."}
  ],
  text:[
    "In 1984, a young Australian doctor named Barry Marshall stood in his laboratory with a glass of cloudy brown liquid. It contained billions of bacteria which he had grown from the stomach of a sick patient. He knew what most doctors would say: the stomach is full of acid, and nothing can live there. He also knew that they were wrong. He drank the glass.",
    "For more than a hundred years, medicine had believed that stomach ulcers — painful wounds inside the stomach — were caused by stress, spicy food and too much acid. Patients were told to relax, drink milk and take medicine to reduce the acid. When that failed, surgeons removed part of the stomach.",
    "In 1979 a pathologist in Perth, Robin Warren, noticed something strange under his microscope: small, curved bacteria in tissue from the stomachs of patients with ulcers. Marshall, who was then a junior doctor, joined him. Together they found the bacteria in almost every patient with an ulcer, and in 1982 they managed to grow them in the laboratory — by accident, when a dish was forgotten over a long holiday weekend.",
    "But nobody believed them. Their papers were rejected, and at conferences other scientists laughed. Marshall couldn't test his idea on patients without permission, and he couldn't make animals ill. So he chose the only person who could give permission immediately: himself. Five days after he drank the bacteria, he woke up feeling sick. A colleague took a sample from his stomach, and there they were — the bacteria, and the beginning of an ulcer. Marshall then cured himself with antibiotics.",
    "It still took years, but the medical world slowly changed its mind. Today ulcers are treated with a two-week course of antibiotics instead of surgery. In 2005 Marshall and Warren received the Nobel Prize in Medicine. The bacterium, Helicobacter pylori, lives in the stomachs of about half of the people on Earth. Most of them will never know it is there — thanks to a doctor who was brave enough, or crazy enough, to drink it."
  ],
  exercises:[
    {type:"before",instruction:INS.before,items:[
      {q:"Why did a doctor drink a glass of bacteria in 1984?",o:["to prove that bacteria cause stomach ulcers","because he was very thirsty","to test a new energy drink"],a:0,
       e:{en:"Nobody believed his idea, so he tested it on himself.",ru:"Никто не верил его идее, поэтому он проверил её на себе.",kz:"Оның идеясына ешкім сенбеді, сондықтан ол оны өзінде сынады."}}
    ]},
    {type:"tfng",instruction:INS.tfng,items:[

      {s:"Robin Warren was a surgeon.",a:"F",e:{en:"“…a pathologist in Perth, Robin Warren…”",ru:"«…a pathologist…» — патолог.",kz:"«…a pathologist…» — патолог."}},
      {s:"Warren and Marshall grew the bacteria on purpose over five days.",a:"F",e:{en:"“…by accident, when a dish was forgotten over a long holiday weekend.”",ru:"«…by accident…» — случайно.",kz:"«…by accident…» — кездейсоқ."}},
      {s:"Marshall's wife was worried about the experiment.",a:"NG",e:{en:"The text does not mention his wife.",ru:"О его жене в тексте не сказано.",kz:"Мәтінде оның әйелі туралы айтылмаған."}},
      {s:"Marshall felt sick five days after drinking the bacteria.",a:"T",e:{en:"“Five days after he drank the bacteria, he woke up feeling sick.”",ru:"«Five days after…»",kz:"«Five days after…»"}},
      {s:"Marshall and Warren received the Nobel Prize in 2005.",a:"T",e:{en:"“In 2005 Marshall and Warren received the Nobel Prize in Medicine.”",ru:"«In 2005…»",kz:"«In 2005…»"}},
      {s:"Helicobacter pylori was first found in Kazakhstan.",a:"NG",e:{en:"The text says nothing about Kazakhstan.",ru:"О Казахстане в тексте ничего нет.",kz:"Мәтінде Қазақстан туралы ештеңе жоқ."}}
    ]},
    {type:"vocab",instruction:INS.vocab,items:[
      {q:"An “ulcer” is…",o:["a kind of bacteria","a medicine","a painful wound inside the body"],a:2,e:{en:"“…stomach ulcers — painful wounds inside the stomach…”",ru:"Ulcer — язва.",kz:"Ulcer — ойық жара."}},
      {q:"“reject” means…",o:["publish","say no to something","read carefully"],a:1,e:{en:"Their papers were rejected = journals said no.",ru:"Reject — отвергать.",kz:"Reject — қабылдамау."}},
      {q:"“permission” is…",o:["an official yes","a prize","a test"],a:0,e:{en:"He needed permission to test his idea on patients.",ru:"Permission — разрешение.",kz:"Permission — рұқсат."}},
      {q:"A “sample” is…",o:["a doctor","a small amount of something for testing","a glass"],a:1,e:{en:"A colleague took a sample from his stomach.",ru:"Sample — образец.",kz:"Sample — үлгі."}},
      {q:"“cure” means…",o:["make ill","study","make someone healthy again"],a:2,e:{en:"He cured himself with antibiotics.",ru:"Cure — вылечить.",kz:"Cure — емдеп жазу."}}
    ]},

{ id:"b1-adv-balkhash", level:"B1", genre:"adventure", title:"The Ice That Moved", cover:{emoji:"🧊"},
  task:{en:"Read and find out: what did the pilot see first from the air?",ru:"Прочитайте и узнайте: что пилот увидел с воздуха первым делом?",kz:"Оқып, біліңіз: ұшқыш аспаннан ең алдымен нені көрді?"},
  words:[

    {en:"drill",tr:"/drɪl/",ru:"сверлить",kz:"бұрғылау",ex:"He drilled a hole, dropped his line and poured tea from a thermos."},
    {en:"crack",tr:"/kræk/",ru:"треск; трещина",kz:"сытыр; жарық",ex:"The first sign was a sound — a long, deep crack."},
    {en:"shore",tr:"/ʃɔː/",ru:"берег",kz:"жаға",ex:"Behind him, about a kilometre away, was the shore."},
    {en:"edge",tr:"/edʒ/",ru:"край",kz:"шеті",ex:"He moved to the thickest part of the ice, away from the edge."},
    {en:"floe",tr:"/fləʊ/",ru:"льдина",kz:"мұз кесегі",ex:"By then, the ice floe was three kilometres from the shore."},
    {en:"forecast",tr:"/ˈfɔːkɑːst/",ru:"прогноз",kz:"болжам",ex:"He checks the wind forecast before he leaves the house."},
    {en:"rescue",tr:"/ˈreskjuː/",ru:"спасение, спасательный",kz:"құтқару",ex:"The rescue service had given out the life jackets for free."}
  ],
  text:[
    "The ice on Lake Balkhash was thirty centimetres thick, which was more than enough to hold a man, a sledge and a box of fishing equipment. Yerlan had fished here every winter for twenty years. That morning in late February, the sky was clear and there was no wind. He drilled a hole, dropped his line and poured tea from a thermos. Behind him, about a kilometre away, was the shore. He didn't look at it again for two hours.",
    "The first sign was a sound — a long, deep crack. Yerlan stood up. The ice under his feet was still solid, but when he looked towards the shore, he saw a dark line of open water. It was ten metres wide and growing. The wind had come from the south, and it was pushing the ice field, with Yerlan on it, out into the lake.",
    "He didn't run. Running on ice near open water is the fastest way to fall in. Instead, he called the emergency number. Then he did what fishermen on Balkhash are taught to do: he moved to the thickest part of the ice, away from the edge, put his sledge on its side to block the wind, and sat down on his box. He was wearing a life jacket, which the rescue service had given out for free the year before.",
    "It took the helicopter two hours to find him. By then, the ice floe was three kilometres from the shore, and there were fourteen other fishermen on it. Nobody had fallen in. The pilot later said that the orange jackets were the first thing he saw from the air. “Without them,” he said, “you are grey dots on grey ice.”",
    "Yerlan still fishes on Balkhash. But now he looks at the shore every ten minutes, he checks the wind forecast before he leaves the house, and he never laughs at the orange jacket. “The lake doesn't care how many years you've fished on it,” he says. “It only cares if you're paying attention.”"
  ],

/* ───────── 11 · MYSTERY ───────── */
{ id:"b1-mys-cooper", level:"B1", genre:"mystery", title:"The Man Who Jumped Into the Night", cover:{emoji:"🪂"},
  task:{en:"Read and find out: what did a boy find by the river in 1980?",ru:"Прочитайте и узнайте: что мальчик нашёл у реки в 1980 году?",kz:"Оқып, біліңіз: 1980 жылы бала өзен жағасынан не тапты?"},
  words:[
    {en:"flight attendant",tr:"/ˈflaɪt əˌtendənt/",ru:"бортпроводник",kz:"бортсерік",ex:"After take-off he handed a note to a flight attendant."},
    {en:"politely",tr:"/pəˈlaɪtli/",ru:"вежливо",kz:"сыпайы түрде",ex:"“Miss,” he said politely, “you'd better look at that.”"},
    {en:"demand",tr:"/dɪˈmɑːnd/",ru:"требование",kz:"талап",ex:"His demands were simple: 200,000 dollars and four parachutes."},
    {en:"parachute",tr:"/ˈpærəʃuːt/",ru:"парашют",kz:"парашют",ex:"They found nothing: no body, no parachute, no money."},
    {en:"crew",tr:"/kruː/",ru:"экипаж",kz:"экипаж",ex:"Cooper let the passengers go and kept only the crew."},
    {en:"rear",tr:"/rɪə/",ru:"задний",kz:"артқы",ex:"Cooper lowered the rear stairs of the Boeing 727 and jumped."},
    {en:"suspect",tr:"/ˈsʌspekt/",ru:"подозреваемый",kz:"күдікті",ex:"The FBI investigated more than a thousand suspects."},
    {en:"unsolved",tr:"/ˌʌnˈsɒlvd/",ru:"нераскрытый",kz:"шешілмеген",ex:"It is the only unsolved hijacking in American history."}
  ],
  text:[
    "On the afternoon of 24 November 1971, a quiet man in a dark suit bought a ticket in Portland, Oregon, for a thirty-minute flight to Seattle. He gave his name as Dan Cooper. He sat at the back of the plane, ordered a drink, and after take-off handed a note to a flight attendant. She put it in her pocket without reading it, thinking it was a phone number. “Miss,” he said politely, “you'd better look at that. I have a bomb.”",
    "He opened his briefcase and showed her wires and red cylinders. His demands were simple: 200,000 dollars in cash, four parachutes, and a fuel truck waiting in Seattle. The airline agreed. When the plane landed, Cooper let the thirty-six passengers go and kept only the crew. Then, with the money and the parachutes on board, he told the pilots to fly slowly and low towards Mexico.",
    "Somewhere over the dark forests of Washington State, in freezing rain and wind, Cooper lowered the rear stairs of the Boeing 727 and jumped. Nobody saw him go. When the plane landed in Reno, the back of the aircraft was empty. The FBI searched the forests for weeks with soldiers, helicopters and dogs. They found nothing: no body, no parachute, no money.",
    "Nine years later, in 1980, an eight-year-old boy was digging in the sand on the bank of the Columbia River when he found three packets of rotting twenty-dollar bills — 5,800 dollars. The serial numbers matched Cooper's money. But how did it get there? Did Cooper drop it? Was it washed down the river from the place where he died? Nobody could say.",
    "The FBI investigated more than a thousand suspects over forty-five years, and in 2016 it closed the case. It is the only unsolved hijacking in American history. Some believe Cooper died that night in the forest; others believe he lived quietly for decades under a new name. The flight attendant who read the note never forgot him. “He was polite,” she said. “That's what I remember most.”"
  ],

    {type:"before",instruction:INS.before,items:[

       e:{en:"The FBI closed the case in 2016 without an answer.",ru:"ФБР закрыло дело в 2016 году без ответа.",kz:"ФБР істі 2016 жылы жауапсыз жапты."}}
    ]},

      {s:"The flight attendant read the note immediately.",a:false,e:{en:"“She put it in her pocket without reading it…”",ru:"«…without reading it…»",kz:"«…without reading it…»"}},
      {s:"Cooper asked for four parachutes.",a:true,e:{en:"“…200,000 dollars in cash, four parachutes…”",ru:"«…four parachutes…»",kz:"«…four parachutes…»"}},
      {s:"He let the passengers go in Seattle.",a:true,e:{en:"“When the plane landed, Cooper let the thirty-six passengers go…”",ru:"«…let the thirty-six passengers go…»",kz:"«…let the thirty-six passengers go…»"}},
      {s:"The FBI found his parachute in the forest.",a:false,e:{en:"“They found nothing: no body, no parachute, no money.”",ru:"«They found nothing…»",kz:"«They found nothing…»"}},
      {s:"A boy found some of the money in 1980.",a:true,e:{en:"“…an eight-year-old boy… found three packets of rotting twenty-dollar bills…”",ru:"«…an eight-year-old boy… found…»",kz:"«…an eight-year-old boy… found…»"}}

/* ───────── 12 · HISTORY ───────── */
{ id:"b1-his-semey", level:"B1", genre:"history", title:"The Silence at Semey", cover:{emoji:"☢️"},
  task:{en:"Read and find out: what did a poet do instead of reading his poems?",ru:"Прочитайте и узнайте: что сделал поэт вместо чтения стихов?",kz:"Оқып, біліңіз: ақын өлең оқудың орнына не істеді?"},
  words:[
    {en:"explosion",tr:"/ɪkˈspləʊʒn/",ru:"взрыв",kz:"жарылыс",ex:"Between 1949 and 1989, 456 nuclear explosions took place there."},
    {en:"radiation",tr:"/ˌreɪdiˈeɪʃn/",ru:"радиация",kz:"радиация",ex:"Radiation fell on the grass, the rivers and the milk."},
    {en:"leak",tr:"/liːk/",ru:"утечка; протекать",kz:"ағып кету, шығу",ex:"Two recent tests had leaked radioactive gas."},
    {en:"signature",tr:"/ˈsɪɡnətʃə/",ru:"подпись",kz:"қолтаңба",ex:"Within a year the movement had a million signatures."},
    {en:"collapse",tr:"/kəˈlæps/",ru:"рухнуть, распасться",kz:"ыдырау, құлау",ex:"When the Soviet Union collapsed a few months later…"},
    {en:"weapon",tr:"/ˈwepən/",ru:"оружие",kz:"қару",ex:"By 1995 the last weapon had left the country."},
    {en:"century",tr:"/ˈsentʃəri/",ru:"век, столетие",kz:"ғасыр",ex:"Some areas will stay dangerous for centuries."},
    {en:"monument",tr:"/ˈmɒnjumənt/",ru:"памятник",kz:"ескерткіш",ex:"Go to the monument called “Stronger than Death”."}
  ],
  text:[
    "On the morning of 29 August 1949, the sky over the steppe of eastern Kazakhstan turned white. A few seconds later the ground shook, and a cloud rose ten kilometres into the air. The Soviet Union had tested its first atomic bomb. The place was called the Semipalatinsk Polygon — an area of eighteen thousand square kilometres — and for the next forty years it was one of the most secret places on Earth.",
    "Between 1949 and 1989, 456 nuclear explosions took place there: 116 in the air and 340 under the ground. The nearest villages were not moved. Children were told that the flashes were “exercises”. Radiation fell on the grass, the rivers and the milk. In the following decades, doctors in the region reported unusually high numbers of cancers and of children born with health problems. Nobody was allowed to talk about the cause.",
    "The silence was broken in February 1989 by a poet. Olzhas Suleimenov was supposed to read his poems on television. Instead, he spoke about two recent underground tests which had leaked radioactive gas, and he invited people to a meeting the next day. Five thousand came. Within a week the movement had a name — Nevada-Semipalatinsk, after the American test site — and within a year it had a million signatures. In October 1989 the last bomb exploded at the Polygon. On 29 August 1991, exactly forty-two years after the first test, Kazakhstan closed the site for ever.",
    "When the Soviet Union collapsed a few months later, Kazakhstan found itself with the fourth-largest nuclear arsenal in the world — more than a thousand warheads. It gave them all up. By 1995 the last weapon had left the country.",
    "Today the Polygon is quiet. Scientists study the land, and parts of it are used again for farming, although some areas will stay dangerous for centuries. In 2009 the United Nations made 29 August the International Day against Nuclear Tests. If you visit Semey, go to the museum and to the monument called “Stronger than Death”. The silence there means something different now."
  ],

      {s:"All the nearby villages were moved before the tests.",a:"F",e:{en:"“The nearest villages were not moved.”",ru:"«The nearest villages were not moved.»",kz:"«The nearest villages were not moved.»"}},
      {s:"Olzhas Suleimenov was a scientist.",a:"F",e:{en:"“The silence was broken in February 1989 by a poet.”",ru:"«…by a poet.» — поэт.",kz:"«…by a poet.» — ақын."}},
      {s:"Suleimenov was born in Semey.",a:"NG",e:{en:"The text does not say where he was born.",ru:"В тексте не сказано, где он родился.",kz:"Мәтінде оның қайда туғаны айтылмаған."}},

      {l:"leak",r:{en:"escape through a hole or crack",ru:"утечка; протекать",kz:"ағып кету"}},{l:"signature",r:{en:"your name written by you",ru:"подпись",kz:"қолтаңба"}},

{ id:"b1-tec-bulb", level:"B1", genre:"technology", title:"The Light Bulb That Never Went Out", cover:{emoji:"💡"},
  task:{en:"Read and find out: what did the Phoebus cartel agree in 1925?",ru:"Прочитайте и узнайте: о чём договорился картель «Фебус» в 1925 году?",kz:"Оқып, біліңіз: «Фебус» картелі 1925 жылы не туралы келісті?"},
  words:[
    {en:"bulb",tr:"/bʌlb/",ru:"лампочка",kz:"шам (лампа)",ex:"There is a small light bulb hanging from the ceiling."},
    {en:"ceiling",tr:"/ˈsiːlɪŋ/",ru:"потолок",kz:"төбе",ex:"There is a small light bulb hanging from the ceiling."},
    {en:"filament",tr:"/ˈfɪləmənt/",ru:"нить накала",kz:"қыздыру жібі",ex:"Its filament — the thin wire inside that glows — is made of carbon."},
    {en:"glow",tr:"/ɡləʊ/",ru:"светиться",kz:"жарқырау",ex:"…the thin wire inside that glows…"},
    {en:"power supply",tr:"/ˈpaʊə səˌplaɪ/",ru:"электропитание",kz:"қуат көзі",ex:"…for a few hours in 2013 when the power supply failed."},
    {en:"cartel",tr:"/kɑːˈtel/",ru:"картель",kz:"картель",ex:"They formed a group called the Phoebus cartel."},
    {en:"fine",tr:"/faɪn/",ru:"штраф",kz:"айыппұл",ex:"Companies whose bulbs lasted too long had to pay a fine."},
    {en:"reminder",tr:"/rɪˈmaɪndə/",ru:"напоминание",kz:"еске салу",ex:"But it remains a reminder."}
  ],
  text:[
    "In a fire station in Livermore, California, there is a small light bulb hanging from the ceiling. It is not bright — about as bright as a night light — and it is protected by a wire cage. Yet this bulb has its own webcam, its own birthday parties and a place in the Guinness Book of Records. It has been burning since 1901.",
    "The bulb was made in the 1890s by the Shelby Electric Company in Ohio. Its filament — the thin wire inside that glows — is made of carbon, not the tungsten that later became standard. In 1901 a local businessman gave it to the fire department, and it was switched on. Since then it has been switched off only a few times: for a week in 1937 during building work, for twenty-two minutes in 1976 when the fire station moved to a new building, and for a few hours in 2013 when the power supply failed.",
    "Nobody is completely sure why it has lasted so long. The carbon filament is thick, the bulb is never turned on and off (which is when most bulbs break), and it runs at a very low power. But the question hides a bigger one: if a bulb from 1901 can last 120 years, why did the bulbs in our homes for most of the twentieth century last only about a thousand hours?",
    "The answer was discovered in the 1980s in old company documents. In 1925, the biggest light bulb makers in the world — including Osram, Philips and General Electric — formed a group called the Phoebus cartel. They agreed that no bulb should last longer than 1,000 hours. Companies whose bulbs lasted too long had to pay a fine. Historians call it the first example of “planned obsolescence” — products designed to break.",
    "Today LED bulbs can last for decades. But the Livermore bulb remains a reminder. Every year in June, the firefighters hold a small party for it. In 2015, for its 114th birthday, a jazz band played. The bulb, as usual, said nothing and kept shining."
  ],

       e:{en:"In 1925 the biggest bulb makers agreed that no bulb should last longer than 1,000 hours.",ru:"В 1925 году крупнейшие производители договорились, что лампы не должны служить дольше 1 000 часов.",kz:"1925 жылы ірі өндірушілер шамдар 1 000 сағаттан артық жанбауы керек деп келісті."}}
    ]},

    ]},

      {q:"A “fine” in this text is…",o:["good weather","a thin wire","money you pay as a punishment"],a:2,e:{en:"Companies had to pay a fine if their bulbs lasted too long.",ru:"Fine здесь — штраф.",kz:"Fine мұнда — айыппұл."}},

      {q:"A “cartel” is…",o:["a museum","a fire station","a group of companies that agree on prices or rules"],a:2,e:{en:"Osram, Philips and General Electric formed a cartel.",ru:"Cartel — картель.",kz:"Cartel — картель."}},
      {q:"“planned obsolescence” means…",o:["products that last for ever","products designed to break","products made by hand"],a:1,e:{en:"“…‘planned obsolescence’ — products designed to break.”",ru:"Запланированное устаревание — товары, созданные, чтобы ломаться.",kz:"Жоспарлы ескіру — сынуға арналған тауарлар."}}

    {type:"gap",instruction:INS.gap,explanation:EXPL.gap,
     text:"The bulb hangs from the {ceiling} of a fire station. It has been burning since {1901}. Its {filament} is made of carbon. It was switched off for twenty-two {minutes} in 1976. In 1925 the biggest bulb makers formed a {cartel}. No bulb was allowed to last longer than 1,000 {hours}. Every June the firefighters hold a small {party}.",

    {type:"reflection",instruction:INS.reflection,q:"Do you think companies today still make products that break on purpose? Give an example. Write 3–4 sentences.",
     keys:[["phone","battery","clothes","car","washing","printer","laptop","product","products","shoes"],["break","breaks","broke","last","old","replace","new","repair"],["think","because","example"]],min:2,

/* ───────── 14 · NATURE ───────── */
{ id:"b1-nat-nutcracker", level:"B1", genre:"nature", title:"A Bird With a Better Memory Than You", cover:{emoji:"🌲"},
  task:{en:"Read and find out: how does the nutcracker find its seeds under the snow?",ru:"Прочитайте и узнайте: как кедровка находит свои семена под снегом?",kz:"Оқып, біліңіз: құс қар астындағы тұқымдарын қалай табады?"},
  words:[
    {en:"memory",tr:"/ˈmeməri/",ru:"память",kz:"жад, ес",ex:"The forest depends on this memory too."},
    {en:"depend",tr:"/dɪˈpend/",ru:"зависеть",kz:"тәуелді болу",ex:"Imagine that your life depended on it."},
    {en:"pouch",tr:"/paʊtʃ/",ru:"мешочек (под языком)",kz:"қалта (тіл астындағы)",ex:"Using a special pouch under its tongue, the bird carries up to 150 seeds."},
    {en:"bury",tr:"/ˈberi/",ru:"закапывать",kz:"көму",ex:"In one season a single bird buries between 30,000 and 100,000 seeds."},
    {en:"at random",tr:"/æt ˈrændəm/",ru:"наугад",kz:"кездейсоқ",ex:"They don't search at random."},
    {en:"landmark",tr:"/ˈlændmɑːk/",ru:"ориентир",kz:"бағдар",ex:"The birds seem to use landmarks — rocks, trees, the shape of a slope."},
    {en:"slope",tr:"/sləʊp/",ru:"склон",kz:"беткей",ex:"…the shape of a slope…"},
    {en:"cone",tr:"/kəʊn/",ru:"шишка",kz:"бүр",ex:"…because its cones don't open on their own."}
  ],
  text:[
    "Where did you leave your keys this morning? Now imagine you had to remember not one place, but ten thousand — and that your life depended on it. That is the daily reality of a grey-and-black bird that lives in the mountains of western North America: Clark's nutcracker.",
    "Every autumn, the nutcracker collects pine seeds. It doesn't eat them; it hides them. Using a special pouch under its tongue, which can hold up to 150 seeds at once, the bird flies to a hillside, digs a small hole, drops in three or four seeds, covers them, and flies back for more. In one season a single bird buries between 30,000 and 100,000 seeds in thousands of different places, sometimes twenty kilometres apart.",
    "Then winter comes. The hillsides disappear under a metre of snow, and for the next nine months the nutcracker survives on what it hid. Scientists who have watched the birds carefully found that they don't search at random. A nutcracker flies to a spot, digs, and finds seeds — again and again, with almost no mistakes, even in deep snow, even in spring when the landscape looks completely different. In laboratory tests, the birds remembered the location of hidden food for at least nine months. Humans in the same tests did far worse.",
    "How do they do it? The birds seem to use landmarks — rocks, trees, the shape of a slope — and to measure distances and angles between them, like a natural GPS. The part of the brain responsible for memory, the hippocampus, is much larger in nutcrackers than in birds which don't hide food.",
    "The forest depends on this memory too. The seeds that a nutcracker forgets — a few thousand every year — grow into new pine trees. The whitebark pine, which grows high in the mountains, has almost no other way to spread its seeds, because its cones don't open on their own. So every time you see one of these trees, you are looking at a bird's forgotten lunch."
  ],
  exercises:[
    {type:"mc",instruction:INS.mc,items:[
      {q:"What does the nutcracker do with pine seeds in autumn?",o:["It eats them all immediately.","It hides them in thousands of places.","It gives them to its babies."],a:1,e:{en:"“It doesn't eat them; it hides them.”",ru:"«It doesn't eat them; it hides them.»",kz:"«It doesn't eat them; it hides them.»"}},
      {q:"Where does the bird carry the seeds?",o:["in its feet","in its feathers","in a pouch under its tongue"],a:2,e:{en:"“Using a special pouch under its tongue…”",ru:"«…a special pouch under its tongue…»",kz:"«…a special pouch under its tongue…»"}},
      {q:"How long can the birds remember a hiding place in tests?",o:["nine days","nine weeks","at least nine months"],a:2,e:{en:"“…remembered the location of hidden food for at least nine months.”",ru:"«…for at least nine months.»",kz:"«…for at least nine months.»"}},
      {q:"What do the birds use to find their seeds?",o:["their sense of smell","landmarks and distances","other birds"],a:1,e:{en:"“The birds seem to use landmarks… and to measure distances and angles…”",ru:"«…use landmarks… and… measure distances…»",kz:"«…use landmarks… and… measure distances…»"}},

{ id:"b1-peo-weather", level:"B1", genre:"people", title:"Forty Years of Weather", cover:{emoji:"📓"},
  task:{en:"Read and find out: what do Serik's notebooks show that satellites can't?",ru:"Прочитайте и узнайте: что показывают тетради Серика, чего не видят спутники?",kz:"Оқып, біліңіз: Серіктің дәптерлері спутниктер көре алмайтын нені көрсетеді?"},
  words:[
    {en:"exercise book",tr:"/ˈeksəsaɪz bʊk/",ru:"тетрадь",kz:"дәптер",ex:"Serik opens a school exercise book and writes one line."},
    {en:"swallow",tr:"/ˈswɒləʊ/",ru:"ласточка",kz:"қарлығаш",ex:"…anything unusual: the first swallow, the first ice on the stream."},
    {en:"pasture",tr:"/ˈpɑːstʃə/",ru:"пастбище",kz:"жайылым",ex:"When would the grass be good on the high pastures?"},
    {en:"flock",tr:"/flɒk/",ru:"отара, стадо овец",kz:"отар",ex:"When was it safe to move the flock across the river?"},
    {en:"researcher",tr:"/rɪˈsɜːtʃə/",ru:"исследователь",kz:"зерттеуші",ex:"A young researcher from Almaty came to Kokterek."},
    {en:"record",tr:"/ˈrekɔːd/",ru:"запись, данные",kz:"жазба, дерек",ex:"She needed old weather records."},
    {en:"observation",tr:"/ˌɒbzəˈveɪʃn/",ru:"наблюдение",kz:"бақылау",ex:"Forty years of daily observations from one place, with no gaps."},
    {en:"condition",tr:"/kənˈdɪʃn/",ru:"условие",kz:"шарт",ex:"He has agreed, on one condition."}
  ],
  text:[
    "Every morning at six, before he lets the sheep out, Serik Abenov opens a school exercise book and writes one line. Temperature, wind, clouds, and anything unusual: the first swallow, the first ice on the stream, a wolf near the village. He has done this since 1985. There are now forty-one exercise books on the shelf in his kitchen in the village of Kokterek, in the south of Kazakhstan, and they contain more than fourteen thousand mornings.",
    "Serik never planned to become a scientist. He started the notebooks because his grandfather told him to. “A shepherd who doesn't watch the sky loses his sheep,” the old man said. So Serik watched, and wrote, and after a few years he noticed that the notebooks answered questions. When would the grass be good on the high pastures? When was it safe to move the flock across the river? The books knew, because they remembered.",
    "Two years ago, a young researcher from Almaty came to Kokterek to study how the climate of the region is changing. She needed old weather records, but the nearest official weather station is ninety kilometres away, and it only started recording in 2003. A neighbour said: “Go and ask Serik.” She spent a week at his kitchen table with a laptop, typing. “I couldn't believe it,” she said later. “Forty years of daily observations from one place, with no gaps. Institutes would pay a lot of money for that.”",
    "The notebooks showed things that satellites can't. Spring now comes eleven days earlier than in the 1980s. The stream freezes three weeks later. The swallows arrive early, but sometimes the cold returns and kills them. Serik's records are now part of a national climate study, and his name appears in a scientific paper — although, he says, he has never read it.",
    "He still writes every morning. His granddaughter has offered to put the notebooks on a computer, and he has agreed, on one condition: the paper books stay in the kitchen. “A computer can break,” he says. “A notebook only gets old. Like me.”"
  ],

    ]},

      {s:"Serik writes in his notebooks in the evening.",a:false,e:{en:"“Every morning at six… Serik Abenov opens a school exercise book…”",ru:"«Every morning at six…»",kz:"«Every morning at six…»"}},
      {s:"He started the notebooks in 1985.",a:true,e:{en:"“He has done this since 1985.”",ru:"«…since 1985.»",kz:"«…since 1985.»"}},

{ id:"b1-cul-hay", level:"B1", genre:"culture", title:"The Town of Books", cover:{emoji:"📚"},
  task:{en:"Read and find out: what did Richard Booth do on 1 April 1977?",ru:"Прочитайте и узнайте: что Ричард Бут сделал 1 апреля 1977 года?",kz:"Оқып, біліңіз: Ричард Бут 1977 жылғы 1 сәуірде не істеді?"},
  words:[

    {en:"ruined",tr:"/ˈruːɪnd/",ru:"разрушенный",kz:"қираған",ex:"It has one main street, a ruined castle and a river."},
    {en:"honesty",tr:"/ˈɒnəsti/",ru:"честность",kz:"адалдық",ex:"You pay by putting coins into an honesty box."},
    {en:"second-hand",tr:"/ˌsekənd ˈhænd/",ru:"подержанный, букинистический",kz:"қолданылған, ескі",ex:"He wanted to open a second-hand bookshop."},
    {en:"bookseller",tr:"/ˈbʊkselə/",ru:"книготорговец",kz:"кітап сатушы",ex:"Other booksellers moved to Hay to be near him."},
    {en:"independent",tr:"/ˌɪndɪˈpendənt/",ru:"независимый",kz:"тәуелсіз",ex:"He announced that Hay was now an independent kingdom."},
    {en:"title",tr:"/ˈtaɪtl/",ru:"титул",kz:"атақ",ex:"He sold passports, titles and “Hay dollars”."},
    {en:"former",tr:"/ˈfɔːmə/",ru:"бывший",kz:"бұрынғы",ex:"A former American president called it “the Woodstock of the mind”."}
  ],
  text:[
    "Hay-on-Wye is a small town on the border between England and Wales. About fifteen hundred people live there. It has one main street, a ruined castle, a river with good fishing — and around twenty bookshops. Books are sold in an old cinema, an old fire station, and even outside, on shelves against the castle wall, where you pay by putting coins into an honesty box.",
    "It began with one man and a bad idea. In 1961, Richard Booth, a young man who had just finished university, came home to Hay and bought the old fire station. He wanted to open a second-hand bookshop. Friends told him that nobody in a small farming town would buy old books. He ignored them. He travelled to America, where public libraries were closing, and bought their books by the ton. Soon other booksellers moved to Hay to be near him.",
    "Booth understood something that tourist offices didn't: a town needs a story. On 1 April 1977, he announced that Hay was now an independent kingdom, and that he was its king. He gave his horse a government job. He sold passports, titles and “Hay dollars” printed on rice paper. Newspapers around the world reported the joke, and the visitors kept coming. “Nobody had ever heard of us,” Booth said. “After that, everybody had.”",
    "In 1988 the town started a literature festival. It grew from a few readings in a pub into an event that lasts ten days and brings famous writers, scientists and politicians to a field of white tents. A former American president once called it “the Woodstock of the mind”. Today more than forty “book towns” around the world, from Norway to Malaysia, have copied the Hay model.",
    "Richard Booth died in 2019, at eighty. His kingdom has no army and no borders, but it has survived him. If you visit, buy a book from the honesty shelves by the castle. Leave a coin. And then find a quiet corner by the river, because in Hay, that is what everybody is doing."
  ],

/* ───────── 1 · SCIENCE ───────── */
{ id:"b2-sci-placebo", level:"B2", genre:"science", title:"The Pill That Works Even When You Know It's Fake", cover:{emoji:"💊"},
  task:{en:"Read and find out: what happened when patients were told the pills contained nothing?",ru:"Прочитайте и узнайте: что произошло, когда пациентам сказали, что в таблетках ничего нет?",kz:"Оқып, біліңіз: науқастарға таблеткалардың ішінде ештеңе жоқ деп айтқанда не болды?"},
  words:[
    {en:"placebo",tr:"/pləˈsiːbəʊ/",ru:"плацебо",kz:"плацебо",ex:"A placebo is a treatment that contains no active medicine."},
    {en:"deceive",tr:"/dɪˈsiːv/",ru:"обманывать",kz:"алдау",ex:"For decades doctors believed a placebo only worked if it deceived the patient."},
    {en:"trial",tr:"/ˈtraɪəl/",ru:"клиническое испытание",kz:"клиникалық сынақ",ex:"In 2010 a team at Harvard ran a small trial."},
    {en:"symptom",tr:"/ˈsɪmptəm/",ru:"симптом",kz:"симптом, белгі",ex:"Their symptoms improved almost twice as much."},
    {en:"ritual",tr:"/ˈrɪtʃuəl/",ru:"ритуал",kz:"рәсім, дәстүр",ex:"The ritual of taking a pill seems to matter."},
    {en:"expectation",tr:"/ˌekspekˈteɪʃn/",ru:"ожидание",kz:"күту, үміт",ex:"Expectation changes the chemistry of the brain."},
    {en:"conditioning",tr:"/kənˈdɪʃənɪŋ/",ru:"условный рефлекс, обусловливание",kz:"шартты рефлекс",ex:"The second explanation is conditioning."},
    {en:"ethical",tr:"/ˈeθɪkl/",ru:"этичный",kz:"этикалық",ex:"Is it ethical to prescribe a pill that contains nothing?"}
  ],
  text:[
    "Imagine that your doctor hands you a bottle of pills and says: “These contain no medicine at all. They are made of sugar. Take two a day.” Would you expect them to help? Most people would not. Yet a growing number of studies suggest that they might — and that discovery is forcing scientists to rethink what medicine actually is.",
    "A placebo is a treatment that contains no active ingredient. For more than a century, placebos have been used in clinical trials as a comparison: half of the patients receive the real drug, the other half receive an identical-looking sugar pill, and nobody knows which is which. The strange part has always been that the sugar pill often works. Pain decreases, sleep improves, and even some physical symptoms get better. Doctors assumed that this only happened because the patients had been deceived. If they knew the truth, the effect would surely disappear.",
    "In 2010 a team at Harvard Medical School, led by Ted Kaptchuk, decided to test that assumption. They recruited eighty people with irritable bowel syndrome, a painful condition of the stomach and intestines. Half were given no treatment. The other half received a bottle clearly labelled “placebo pills”, and the researchers explained, honestly and in detail, that the pills contained nothing. Three weeks later, the placebo group reported almost twice as much improvement as the group that had received nothing. Since then, similar results have been found for chronic back pain, tiredness in cancer patients and migraine.",
    "How can a pill that you know is fake still work? Researchers have two main explanations. The first is expectation. When you take a pill, your brain expects relief, and that expectation releases real chemicals — endorphins and dopamine among them — which reduce pain and improve mood. The second is conditioning. If you have taken medicine hundreds of times in your life and felt better afterwards, your body has learned the pattern: pill, then relief. The ritual itself — the bottle, the label, the glass of water, the doctor's attention — has become a signal that healing is on the way.",
    "The findings raise difficult questions. Is it ethical to prescribe a pill that contains nothing, even if the patient agrees? Should health systems pay for it? And what does it say about ordinary medicine, if part of its power comes from the white coat rather than the chemistry? Kaptchuk himself is careful. Placebos, he points out, cannot shrink a tumour or cure an infection. What they can do is change how the brain processes pain, tiredness and discomfort — and for millions of people with chronic conditions, that would be a significant help.",
    "Perhaps the most surprising conclusion is the simplest. The way a doctor speaks to you, the time they spend, the confidence with which they hand you the bottle: none of this appears on the label, but all of it seems to be part of the medicine."
  ],

{ id:"b2-adv-cave", level:"B2", genre:"adventure", title:"Five Hundred Days Underground", cover:{emoji:"🕯️"},
  task:{en:"Read and find out: how did Beatriz lose track of time?",ru:"Прочитайте и узнайте: как Беатрис потеряла счёт времени?",kz:"Оқып, біліңіз: Беатрис уақыт есебін қалай жоғалтты?"},
  words:[
    {en:"isolation",tr:"/ˌaɪsəˈleɪʃn/",ru:"изоляция","kz":"оқшаулану",ex:"The experiment studied the effects of isolation on the human mind."},
    {en:"perception",tr:"/pəˈsepʃn/",ru:"восприятие",kz:"қабылдау",ex:"Scientists wanted to know how her perception of time would change."},
    {en:"sensor",tr:"/ˈsensə/",ru:"датчик",kz:"датчик",ex:"Sensors recorded her sleep, her temperature and her movements."},
    {en:"supplies",tr:"/səˈplaɪz/",ru:"запасы, припасы",kz:"қор, азық-түлік",ex:"A team left supplies at a fixed point in the cave."},
    {en:"lose track of",tr:"/luːz ˈtræk əv/",ru:"потерять счёт (времени)",kz:"есебін жоғалту",ex:"After about two months she lost track of the days completely."},
    {en:"hallucination",tr:"/həˌluːsɪˈneɪʃn/",ru:"галлюцинация",kz:"галлюцинация",ex:"She experienced no hallucinations, but she did have vivid dreams."},
    {en:"routine",tr:"/ruːˈtiːn/",ru:"распорядок, рутина",kz:"күнделікті тәртіп",ex:"She built a strict routine around eating, exercising and drawing."},
    {en:"overwhelming",tr:"/ˌəʊvəˈwelmɪŋ/",ru:"ошеломляющий, непреодолимый",kz:"қатты әсер ететін",ex:"The noise of the outside world was overwhelming."}
  ],
  text:[
    "On 20 November 2021, a Spanish mountaineer named Beatriz Flamini walked into a cave seventy metres below the ground near Granada, in southern Spain. She was forty-eight years old. She had a tent, a small camera, two GoPro devices, books, wool for knitting and a great deal of food. What she did not have was a watch, a phone or any way of knowing what day it was. She would not come out again for 500 days.",
    "The project had been designed with two universities and a team of psychologists, and its aim was scientific: to study the effects of extreme isolation on the human mind and body. Sensors recorded Flamini's sleep, her temperature and her movements. A support team left supplies at a fixed point in the cave but never spoke to her or showed themselves, and she communicated with them only through written notes when something was urgent. One rule was absolute: nobody would tell her the date, and she would not ask.",
    "For the first few weeks she counted the days carefully. Then something strange happened. Around day sixty-five, she stopped counting — not because she decided to, but because she simply could not keep the numbers in order. Without sunlight, the body's internal clock drifts. Her “days” stretched and shrank. She would sleep, wake, eat, knit, and then discover from her notebook that what had felt like one afternoon had actually been three days. By the end, she believed she had been underground for about 160 or 170 days. The real figure was 508.",
    "How does a person survive that? Flamini's answer was routine. She built a strict structure around eating, exercising, drawing and knitting — she produced two woollen hats and a number of paintings. She read sixty books. She never let herself think about the outside world, she said later, because thinking about it would have made the cave unbearable. On the difficult days she reminded herself that she had chosen this. Interestingly, she reported no hallucinations, although her dreams became unusually vivid and she began to hear flies that were not there.",
    "On 14 April 2023, the support team went down to get her. Their first message was an apology: they were sorry to interrupt. Flamini's first words, when she finally saw daylight, were a question — had it really been 500 days? — and then a request. Would somebody please tell her whether there had been any bad news in the world? There had, she was told, been rather a lot. She listened, and then asked for a shower.",
    "The data from the cave is still being studied. Psychologists are interested in how her sense of time collapsed, and doctors in how her body coped without sunlight. Flamini herself says that the hardest part was not the darkness or the loneliness, but the return. The light, the noise and the endless talking of the outside world were overwhelming. “I didn't want to come out,” she admitted. “I wasn't finished with my book.”"
  ],

      {q:"What was the purpose of the project?",o:["to break a sports record","to study the effects of isolation on the mind and body","to test new camping equipment"],a:1,e:{en:"“…its aim was scientific: to study the effects of extreme isolation on the human mind and body.”",ru:"«…to study the effects of extreme isolation…»",kz:"«…to study the effects of extreme isolation…»"}},
