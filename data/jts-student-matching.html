<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Кабинет студента JTS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell как на платформе — левое меню + рабочая область; сверху переключатель ролей прототипа */
:root{
  --brand:#9047FF; --brand-2:#7D33F0; --brand-soft:#F1E9FF; --brand-softer:#F7F4FE;
  --bg:#F7F6FB; --surface:#FFFFFF; --fg:#171326; --fg-2:#656172; --fg-3:#8B8A97;
  --line:#E9E6F2; --ok:#22A55B; --ok-soft:#E6F6EC; --warn:#B7791F; --warn-soft:#FDF3E1;
  --bad:#D6408B; --bad-soft:#FCE8F2; --gold:#E8A020; --shadow:0 1px 2px rgba(23,19,38,.06),0 8px 24px rgba(23,19,38,.06);
  --font:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#A26BFF; --brand-2:#B88CFF; --brand-soft:#2A2140; --brand-softer:#1E1930;
  --bg:#110E1B; --surface:#1A1626; --fg:#F1EFF7; --fg-2:#B3B0C0; --fg-3:#8B8899;
  --line:#2E2940; --ok:#3CC57A; --ok-soft:#163223; --warn:#E5A84A; --warn-soft:#33270F;
  --bad:#F06BAA; --bad-soft:#3A1729; --gold:#F0B440; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#A26BFF; --brand-2:#B88CFF; --brand-soft:#2A2140; --brand-softer:#1E1930;
  --bg:#110E1B; --surface:#1A1626; --fg:#F1EFF7; --fg-2:#B3B0C0; --fg-3:#8B8899;
  --line:#2E2940; --ok:#3CC57A; --ok-soft:#163223; --warn:#E5A84A; --warn-soft:#33270F;
  --bad:#F06BAA; --bad-soft:#3A1729; --gold:#F0B440; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--fg-2)} .small{font-size:12.5px} .tiny{font-size:11.5px;color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}

/* верхняя полоса прототипа */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--fg);color:var(--surface);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--fg)}
.proto b{font-weight:800;letter-spacing:.02em}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:inherit;padding:6px 14px;border-radius:999px;font-weight:600;opacity:.75}
.roles button[aria-pressed="true"]{background:var(--brand);opacity:1;color:#fff}
.scen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;opacity:.9}
.scen select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:3px 6px;color:inherit}
.scen select option{color:#171326}
.scen label{display:flex;gap:6px;align-items:center}

/* оболочка приложения */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 52px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;color:var(--brand);font-size:17px;padding:4px 10px 12px}
.me{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px;margin-bottom:10px}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--brand);flex:none}
.ava.lg{width:72px;height:72px;font-size:24px}
.nav{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:14px;color:var(--brand);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav.admin{color:var(--fg-2)}
.nav:hover{background:var(--brand-softer)}
.nav[aria-current="page"]{background:var(--brand);color:#fff}
.nav .new{font-size:10px;background:var(--gold);color:#171326;border-radius:6px;padding:1px 6px;font-weight:800}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.bell .badge{position:absolute;top:-6px;right:-8px}
.bellpop{position:absolute;right:0;top:48px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:30;padding:8px;text-align:left}
.bellpop .n{padding:10px;border-radius:10px;display:flex;gap:10px}
.bellpop .n.unread{background:var(--brand-softer)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;background:var(--brand);color:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ok{background:var(--ok)} .btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gray{background:var(--bg);color:var(--fg-2)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.banner{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.brand{background:var(--brand-soft);color:var(--brand)} .banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner p{color:var(--fg)}

/* мой учитель */
.hero{background:linear-gradient(135deg,var(--brand-soft),var(--brand-softer));border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;color:var(--fg-2)}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:800}
.step.on{color:var(--brand)} .step.on i{background:var(--brand);color:#fff;border-color:var(--brand)}
.step.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--brand);border-radius:6px}

/* формат */
.opt{border:2px solid var(--line);border-radius:18px;padding:18px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-softer)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-weight:800}

/* сетка времени */
.tz{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.slots{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
.slots th{font-size:12px;color:var(--fg-2);font-weight:700;padding:6px}
.slots td{padding:0}
.slot{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--fg-2)}
.slot.l1{background:var(--brand-softer);color:var(--brand)}
.slot.l2{background:var(--brand-soft);color:var(--brand)}
.slot.zero{background:var(--bg);color:var(--fg-3);cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.slot.busy{background:var(--fg);color:var(--surface);cursor:not-allowed;font-size:11px}
.slot.free{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}

/* учителя */
.layout3{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.filters{position:sticky;top:70px}
.filters h3{margin-bottom:8px}
.fgroup{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
.tcard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.prio{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center}
.match{font-weight:800;color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--bg);color:var(--fg-2);font-weight:600}
.tag.hit{background:var(--ok-soft);color:var(--ok)}
.sticky-bar{position:sticky;bottom:12px;background:var(--fg);color:var(--surface);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow)}

/* модалки */
.overlay{position:fixed;inset:0;background:rgba(17,14,27,.55);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:24px;max-width:560px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{max-width:980px;padding:0;background:transparent}
.x{border:0;background:var(--bg);border-radius:10px;width:34px;height:34px;flex:none}
.reason{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.reason input{margin-top:4px}
textarea,input[type=text],input[type=date],select.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
textarea{resize:vertical;min-height:80px}
.counter{font-size:11.5px;color:var(--fg-3);text-align:right}
.counter.lim{color:var(--bad)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:12px 18px;border-radius:14px;z-index:80;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* резюме */
.resume{background:var(--surface);border-radius:24px;overflow:hidden;border:1px solid var(--line);display:grid;grid-template-columns:300px minmax(0,1fr)}
.r-left{background:linear-gradient(180deg,#9047FF,#6B2FD0);color:#fff;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.r-left h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin:0 0 8px}
.r-left .tag{background:rgba(255,255,255,.16);color:#fff}
.r-photo{width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:44px;font-weight:800;border:4px solid rgba(255,255,255,.35)}
.r-right{padding:28px 30px;display:flex;flex-direction:column;gap:22px}
.r-right h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin:0 0 10px}
.tl{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--brand-soft);padding-left:16px}
.tl .it{position:relative}
.tl .it::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.lvl{display:flex;gap:4px;flex-wrap:wrap}
.lvl span{padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--bg);color:var(--fg-3)}
.lvl span.on{background:var(--brand);color:#fff}
.r-left .lvl span{background:rgba(255,255,255,.12);color:rgba(255,255,255,.6)} .r-left .lvl span.on{background:#fff;color:#6B2FD0}
.quote{background:var(--brand-softer);border-radius:14px;padding:14px 16px;font-style:italic}

/* редактор профиля */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>.hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.req{color:var(--bad);font-weight:800}
.check{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.check .s{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.check .s.y{background:var(--ok);color:#fff} .check .s.n{background:var(--bad-soft);color:var(--bad)}
.fmt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px}
.fmt.on{border-color:var(--brand);background:var(--brand-softer)}

/* заявки */
.req-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
.timer{font-weight:800;color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--fg-2);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
table.list{width:100%;border-collapse:collapse}
.list th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.list td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.feed .it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed .it:last-child{border-bottom:0}

/* онбординг */
.onb{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.onb-steps{display:flex;gap:6px}
.onb-steps span{flex:1;height:6px;border-radius:6px;background:var(--line)}
.onb-steps span.on{background:var(--brand)}
.onb-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.why div{background:var(--brand-softer);border-radius:16px;padding:14px}
/* интересы по категориям */
details.cat{border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--surface)}
details.cat summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::after{content:"+";color:var(--brand);font-weight:800}
details.cat[open] summary::after{content:"–"}
details.cat .chips{padding-bottom:12px}
.selrow{display:flex;flex-wrap:wrap;gap:6px}
.selrow button{border:0;background:var(--brand);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.cathd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:800;margin-top:6px}
/* фото и файлы */
.photo-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.ph{width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--brand-soft);display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--brand);flex:none}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.fixed{background:#F1E9FF;box-shadow:0 0 0 4px var(--ok-soft)}
.ph.fixed img{filter:brightness(1.08) contrast(1.06) saturate(1.05);transform:scale(1.15)}
.crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}
.score{font-size:28px;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.gal .img{aspect-ratio:4/3;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:13px;text-align:center;padding:8px;max-width:100%}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal figcaption{font-size:12px;padding:6px 8px;color:var(--fg-2)}
.gal .add{border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;aspect-ratio:4/3;color:var(--brand);font-weight:700;font-size:13px;background:transparent}
.rowf{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:8px;align-items:center}
.rowl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.verified{color:var(--ok);font-weight:800;font-size:12px}
@media (max-width:600px){.rowf{grid-template-columns:1fr 1fr}.why{grid-template-columns:1fr}.photo-box{grid-template-columns:1fr}.crit{grid-template-columns:1fr}}
/* профиль (в стиле страницы профиля студента: обложка, аватар по центру, плитки) */
.pf{max-width:880px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.pf-head{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.cover{height:150px;position:relative;background:
  radial-gradient(circle at 15% 30%,rgba(255,255,255,.35) 0 38px,transparent 39px),
  radial-gradient(circle at 82% 70%,rgba(255,255,255,.22) 0 64px,transparent 65px),
  radial-gradient(circle at 60% 10%,rgba(232,160,32,.55) 0 18px,transparent 19px),
  linear-gradient(120deg,#9047FF,#C69BFF 55%,#7D33F0)}

  }

    n.push({u:0,t:'Напоминание: проверьте свои окошки',d:'Последнее обновление 32 дня назад.'});
    return n;
  }
  if(S.role==='manager') return [
    {u:1,t:'Аружан Т. просит подобрать учителя',d:'Время и интересы указаны. Срок: 24 рабочих часа.'},

  return [];
}

function matched(){
  return eligible().filter(t=>daysOf(fitSlots(t))>=S.freq)
   .filter(t=>S.filt.age==='all'||t.ageG===S.filt.age)
   .filter(t=>S.filt.spec==='all'||t.spec.includes(S.filt.spec))
   .filter(t=>t.years>=S.filt.exp)
   .map(t=>{const hits=t.hob.filter(h=>S.filt.hob.includes(h)).length, fit=fitSlots(t); const score=Math.min(98,58+hits*12+Math.min(8,fit.length*2)+(t.since>=2026?6:0)); return {...t,hits,score,fit}})
   .sort((a,b)=>b.score-a.score);
}

function checklist(){return REQ.map(([k,l])=>`<div class="check"><span class="s ${reqOk(k)?'y':'n'}">${reqOk(k)?'✓':'!'}</span>${l}</div>`).join('')}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-go]'); if(!b) return;
  const d=b.dataset;
  if(d.role){ S.role=d.role; document.querySelectorAll('.roles button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.role===S.role)); S.bellOpen=false; render(); if(S.role==='teacher'&&!S.t.profileShown&&pct()<100){S.t.profileShown=true;profileModal()} return; }
  if(d.go){ go(d.go); return; }
  if(b.id==='bell'){ S.bellOpen=!S.bellOpen; render(); return; }
  if(d.fmt){ S.fmt=d.fmt; render(); return; }
  if(d.freq){ S.freq=+d.freq; render(); return; }
  if(d.slot){ const i=S.picked.indexOf(d.slot); if(i>=0) S.picked.splice(i,1); else S.picked.push(d.slot); render(); return; }
  if(d.cslot){ const i=S.proposed.indexOf(d.cslot); if(i>=0) S.proposed.splice(i,1); else if(S.proposed.length<S.freq) S.proposed.push(d.cslot); else toast('Сначала уберите один слот'); render(); return; }
  if(d.mdur){ S.dur=+d.mdur; render(); return; }
  if(d.mfreq){ S.freq=+d.mfreq; render(); return; }
  if(d.mpick){ const t=matched().find(x=>x.id==d.mpick); if(!S.picked.length) S.picked=['0-19','2-19','4-18','1-18']; S.assigned=TEACHERS.find(x=>x.id==d.mpick); S.proposed=propose(fitSlots(S.assigned),S.freq); S.stuState='confirm'; S.confirmBy='mgr'; render(); toast(d.how==='assign'?'Назначено. Учитель получил уведомление, студент подтверждает расписание':'Заявка отправлена учителю. После принятия студент подтвердит расписание'); return; }
  if(d.hob){ const i=S.filt.hob.indexOf(d.hob); if(i>=0) S.filt.hob.splice(i,1); else if(S.filt.hob.length<STU_HOB_MAX) S.filt.hob.push(d.hob); else {toast('Можно выбрать до 5 интересов');return} const dc=b.closest('details'); if(dc) S.openCat=+dc.dataset.cat; render(); return; }
  if(d.pick){ if(S.choices.length<3) S.choices.push(+d.pick); render(); if(d.reopen) openResume(d.reopen); return; }
  if(d.unpick){ S.choices=S.choices.filter(x=>x!==+d.unpick); render(); if(d.reopen) openResume(d.reopen); return; }
  if(d.pftab){ S.pfTab=d.pftab; openResume(d.id,d.pftab); return; }
  if(d.av){ if(S.t.avail[d.av]) delete S.t.avail[d.av]; else S.t.avail[d.av]=1; render(); return; }
  if(d.dellang!==undefined){ S.t.profile.langs.splice(+d.dellang,1); render(); return; }
  if(d.ttab){ S.t.tab=d.ttab; render(); return; }
  if(d.tfmt!==undefined) return;
  if(d.tspec){ const a=S.t.profile.spec,i=a.indexOf(d.tspec); i>=0?a.splice(i,1):a.push(d.tspec); render(); return; }
  if(d.tage){ const a=S.t.profile.ages,i=a.indexOf(d.tage); i>=0?a.splice(i,1):a.push(d.tage); render(); return; }
  if(d.thob){ const a=S.t.profile.hob,i=a.indexOf(d.thob); if(i>=0)a.splice(i,1); else if(a.length<10)a.push(d.thob); else toast('Максимум 10 интересов'); render(); return; }
  if(d.acc){ const r=S.t.reqs.find(x=>x.id==d.acc); r.status='acc'; render(); toast(r.prio===1?'Студент закреплён за вами. Первый урок появится в расписании':'Принято. Если студента возьмёт учитель с более высоким приоритетом, мы сообщим'); return; }
  if(d.dec){ const id=d.dec; modal(`<h2>Почему отклоняете?</h2><p class="small muted">Студент не увидит причину. Она нужна менеджеру для статистики.</p>
     ${['Нет времени / изменилось расписание','Не мой уровень или направление','Набрал(а) максимум учеников','Другое'].map((r,i)=>`<label class="reason"><input type="radio" name="dr" ${i===0?'checked':''}><span>${r}</span></label>`).join('')}
     <div class="banner brand"><p class="small">Если причина «нет времени», предложим обновить окошки, чтобы такие заявки больше не приходили.</p></div>
     <div class="row" style="justify-content:flex-end"><button class="btn line" data-act="close">Отмена</button><button class="btn bad" data-decok="${id}">Отклонить</button></div>`); return; }
  if(d.decok){ S.t.reqs.find(x=>x.id==d.decok).status='dec'; closeModal(); render(); toast('Заявка отклонена. Студенту предложим других учителей'); return; }
  if(d.mok){ S.m.changes.find(c=>c.id==d.mok).status='ok'; render(); toast('Одобрено. Студент получил уведомление и выбирает нового учителя'); return; }
  if(d.mno){ S.m.changes.find(c=>c.id==d.mno).status='no'; render(); toast('Отклонено. Студенту отправлен комментарий'); return; }
  if(d.vc){ S.vacChoice=d.vc; closeModal(); render(); toast(d.vc==='temp'?'Временный учитель закреплён на 02.11–15.11':'Пауза оформлена, срок абонемента продлён'); return; }
  if(d.fm){ S.fmt=d.fm; closeModal(); render(); toast('Формат изменён. Учитель получил уведомление'); return; }
  switch(d.act){
    case 'start': S.fromOnb=S.screen.student==='onboard'; startWizard(); break;
    case 'back': { const sc=S.screen.student; go(sc==='teachers'?'time':sc==='time'&&needFormatStep()?'format':S.fromOnb?'onboard':'myteacher'); break; }
    case 'later': S.fromOnb=false; go('home'); toast('Напомним в колокольчике. Выбрать учителя можно в разделе «Мой учитель»'); break;
    case 'onb': Object.assign(S,{stuState:'none',fmt:null,picked:[],choices:[],reqStatus:{},assigned:null,vacChoice:null}); S.role='student'; S.screen.student='onboard'; render(); break;
    case 'toTime': go('time'); break;
    case 'toTeachers': go('teachers'); break;
    case 'send': S.stuState='pending'; S.reqStatus={}; go('myteacher'); toast('Заявки отправлены. Ответ в течение 12 часов'); break;
    case 'simAccept': { const first=S.choices.find(id=>S.reqStatus[id]!=='dec'); S.reqStatus[first]='acc'; S.assigned=TEACHERS.find(t=>t.id===first); S.proposed=propose(fitSlots(S.assigned),S.freq); S.stuState='confirm'; S.confirmBy='teacher'; if(!S.fmt)S.fmt='platform'; render();
      modal(`<span class="pill ok" style="align-self:flex-start">Учитель принял заявку</span><h2>${esc(S.assigned.name)} предлагает расписание</h2><p>${S.proposed.map(slotLbl).join(' · ')} · по ${S.dur} мин</p>
       <p class="small muted">Подтвердите его, и уроки появятся в «Расписании». Остальным учителям мы сообщим, что вы выбрали другого.</p><div class="row"><button class="btn" data-act="confirmSched">Подтвердить</button><button class="btn line" data-act="closeEdit">Выбрать другое время</button></div>`); break; }
    case 'simMgr': { if(!S.picked.length) S.picked=['0-19','2-19','4-18','1-18']; S.assigned=TEACHERS[1]; S.proposed=propose(fitSlots(S.assigned),S.freq); if(S.proposed.length<S.freq) S.proposed=propose(Object.keys(S.assigned.avail),S.freq); S.stuState='confirm'; S.confirmBy='mgr'; if(!S.fmt)S.fmt='platform'; render(); toast('Менеджер подобрал учителя. Подтвердите расписание'); break; }
    case 'confirmSched': S.stuState='assigned'; S.editSlots=false; closeModal(); go('myteacher'); toast('Расписание подтверждено. Уроки появились в «Расписании»'); break;
    case 'closeEdit': closeModal(); S.editSlots=true; go('myteacher'); break;
    case 'editSlots': S.editSlots=true; render(); break;
    case 'cancelEdit': S.editSlots=false; S.proposed=propose(fitSlots(S.assigned),S.freq); render(); break;
    case 'sendNewTime': S.editSlots=false; render(); toast('Отправлено учителю. Он согласует новое время в течение 12 часов'); break;
    case 'mgrPick': modal(`<h2>Пусть менеджер подберёт учителя</h2><p class="small muted">Менеджер Динара подберёт учителя под ваше время и интересы, обычно в течение рабочего дня. Потом вам останется подтвердить расписание.</p>
      <div class="stack" style="gap:6px"><span class="small"><b>Удобное время</b></span><div class="tags">${S.picked.length?S.picked.map(k=>`<span class="tag">${slotLbl(k)}</span>`).join(''):'<span class="small muted">Не отмечено. Менеджер уточнит при звонке, или отметьте время на шаге «Время».</span>'}</div>
      <span class="small"><b>Интересы</b></span><div class="tags">${S.filt.hob.map(h=>`<span class="tag">${h}</span>`).join('')||'—'}</div></div>
      <label class="small" for="wish"><b>Пожелания к учителю</b></label><textarea id="wish" maxlength="500" placeholder="Например: хочу учителя-мужчину, который готовит к собеседованиям в IT"></textarea>
      <div class="row" style="justify-content:flex-end"><button class="btn line" data-act="close">Отмена</button><button class="btn" data-act="mgrSend">Отправить менеджеру</button></div>`); break;
    case 'mgrSend': S.mgrWish=($('#wish')||{}).value||''; S.stuState='mgr'; closeModal(); go('myteacher'); toast('Заявка у менеджера. Ответ до завтра, 18:00'); break;
    case 'demo': S.demoOpen=!S.demoOpen; scen(); break;
    case 'confirmTariff': S.tConfirmed=true; render(); toast('Тариф подтверждён. Студент получил уведомление и может выбрать учителя'); break;
    case 'simDecline': { const id=S.choices.find(x=>!S.reqStatus[x]); if(id){S.reqStatus[id]='dec'; toast('Учитель №'+(S.choices.indexOf(id)+1)+' отклонил. Ждём остальных');} if(S.choices.every(x=>S.reqStatus[x]==='dec')){toast('Все отклонили. Показываем новых учителей, менеджер подключён');} render(); break; }
    case 'resume': openResume(d.id); break;
    case 'close': closeModal(); break;
    case 'vac': modal(`<h2>Учитель в отпуске 02.11–15.11</h2><p class="muted">На эти даты приходится 4 урока. Как продолжим?</p>
      <button class="opt" data-vc="pause"><h3>⏸ Пауза</h3><p class="small muted">Уроки переносятся, срок абонемента продлевается на 14 дней.</p></button>
      <button class="opt" data-vc="temp"><h3>👩‍🏫 Временный учитель</h3><p class="small muted">Свободна в ваше время: <b>Сара Нурланова</b> (общие интересы: Путешествия). Ещё 2 варианта на выбор. Она видит ваш прогресс и заметки учителя. С 16.11 вы автоматически вернётесь к своему учителю.</p></button>
      <p class="tiny">Если не выберете до 31.10, ваш менеджер свяжется с вами.</p>`); break;
    case 'chgFmt': modal(`<h2>Сменить формат обучения</h2>${Object.entries(FORMATS).map(([k,f])=>{const can=S.assigned.fmt.includes(k);return `<button class="opt" data-fm="${k}" aria-pressed="${S.fmt===k}"><h3>${f.t}</h3><p class="small ${can?'muted':''}" style="${can?'':'color:var(--warn)'}">${can?'Ваш учитель работает в этом формате, смена сразу':'Ваш учитель не работает в этом формате, понадобится смена учителя'}</p></button>`}).join('')}<button class="btn line" data-act="close">Отмена</button>`); break;
    case 'chgTeacher': modal(`<h2>Почему хотите сменить учителя?</h2><p class="small muted">Запрос рассмотрят координатор и ваш менеджер. После одобрения вы выберете нового учителя по расписанию и интересам.</p>
      ${['Не подходит расписание','Не подходит стиль преподавания','Хочу другой формат обучения','Нет прогресса','Не сложился контакт','Жалоба на учителя (опоздания, качество и т.д.)'].map((r,i)=>`<label class="reason"><input type="radio" name="cr" ${i===0?'checked':''}><span>${r}</span></label>`).join('')}
      <textarea placeholder="Расскажите подробнее (необязательно)" aria-label="Комментарий"></textarea>
      <p class="tiny">Учитель не видит ваше имя в жалобе. До решения занятия идут по расписанию.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn line" data-act="close">Отмена</button><button class="btn" data-act="chgSent">Отправить запрос</button></div>`); break;
    case 'chgSent': closeModal(); toast('Запрос отправлен. Ответ в течение 1 рабочего дня'); break;
    case 'reset': Object.assign(S,{stuState:'none',fmt:null,picked:[],choices:[],reqStatus:{},assigned:null,vacChoice:null}); S.screen.student='home'; render(); break;
    case 'showPopup': S.role='teacher'; render(); profileModal(); break;
    case 'goProfile': closeModal(); go('profileEdit'); break;
    case 'saveProfile': toast(pct()<100?'Сохранено. Осталось заполнить: '+REQ.filter(([k])=>!reqOk(k)).map(x=>x[1].split(' (')[0]).join(', '):'Сохранено. Вы участвуете в подборе'); break;
    case 'previewMe': { const save=S.filt.hob; S.filt.hob=['Аниме','Путешествия'];
      modal(`<div class="row between"><span class="pill">Так вас видит студент (пример: студент с интересами «Аниме», «Путешествия»)</span><button class="x" data-act="close" aria-label="Закрыть">✕</button></div>${teacherProfileHTML({...myTeacherObj(),score:86},'student').replace(/<div class="cta-bar">[\s\S]*$/,'</div>')}`,'full'); S.filt.hob=save; break; }
    case 'noop': toast('В прототипе не реализовано'); break;
    case 'photoCrit': modal(`<div class="row between"><h2>Требования к фото</h2><button class="x" data-act="close" aria-label="Закрыть">✕</button></div><p class="muted small">Фото — первое, что видит студент. ИИ проверяет его по этим пунктам.</p>${critList(null)}<div class="banner brand"><p class="small">Если не хватает только фона, кадра или света, ИИ предложит исправленную версию. Лицо и внешность не меняются.</p></div><button class="btn" data-act="close">Понятно</button>`); break;
    case 'photoDemo': S.t.profile.photoState='checking'; render(); setTimeout(()=>{S.t.profile.photoState='needs_fix'; render(); photoResultModal();},1200); break;
    case 'photoFix': S.t.profile.photoState='approved'; S.t.profile.fixed=true; closeModal(); render(); toast('Фото одобрено и добавлено в резюме'); break;
    case 'addLang': S.t.profile.langs.push(['','B2']); render(); break;
    case 'addEdu': S.t.profile.edu.push({d:'',u:'',y:''}); render(); break;
    case 'addCert': S.t.profile.certs.push({t:'IELTS',s:'',file:null,st:'none'}); render(); break;
    case 'addHob': { const v=$('#customHob').value.trim(); if(v&&!S.t.profile.hob.includes(v)&&S.t.profile.hob.length<10){S.t.profile.hob.push(v); render();} break; }
    case 'saveAvail': toast('Окошки сохранены. Студенты видят обновлённое время'); break;
    case 'exc': toast('Выбор даты, когда вы не работаете. Студенты не увидят это время'); break;
    case 'sendVac': toast('Отправлено координатору'); break;
  }
});
function readImg(file,cb){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }
document.addEventListener('toggle',e=>{ const t=e.target; if(t.matches&&t.matches('details.cat')&&t.open) S.openCat=+t.dataset.cat; },true);
document.addEventListener('change',e=>{
  const t=e.target;
  if((t.id==='photoUp'||t.id==='photoUp2')&&t.files[0]){ readImg(t.files[0],url=>{ const p=S.t.profile; p.photoUrl=url; p.fixed=false; p.photoState='checking'; closeModal(); render(); setTimeout(()=>{p.photoState='needs_fix'; render(); photoResultModal();},1400); }); return; }
  if(t.id==='resUp'){ [...t.files].slice(0,8-S.t.profile.resPh.length).forEach(f=>readImg(f,url=>{S.t.profile.resPh.push({c:'',url}); render();})); return; }
  if(t.id==='consent'){ S.t.profile.consent=t.checked; return; }
  if(t.dataset.cfile!==undefined&&t.files[0]){ const c=S.t.profile.certs[+t.dataset.cfile]; c.file=t.files[0].name; c.st='pending'; render(); toast('Файл отправлен координатору на проверку'); setTimeout(()=>{c.st='verified'; render(); toast('Сертификат проверен: студенты видят «'+c.t+' · '+(c.s||'—')+' ✔»');},2500); return; }
  if(t.dataset.ctype!==undefined){ S.t.profile.certs[+t.dataset.ctype].t=t.value; render(); return; }
  if(t.dataset.lvl!==undefined){ S.t.profile.langs[+t.dataset.lvl][1]=t.value; return; }
  if(t.id==='sTariff'){S.tariff=t.value; Object.assign(S,{stuState:'none',fmt:null,picked:[],choices:[]}); S.screen.student='onboard'; render();}
  if(t.id==='sGarant'){S.garant=t.checked; Object.assign(S,{stuState:'none',fmt:null,picked:[],choices:[]}); S.screen.student='onboard'; render();}
  if(t.id==='sTz'){S.tzMode=t.value; render();}
  if(t.id==='sDur'){S.dur=+t.value; S.picked=[]; render();}
  if(t.id==='sTc'){S.tConfirmed=t.checked; render();}
  if(t.id==='mDir'){S.tariff=t.value; render();}
  if(t.id==='mGar'){S.garant=t.value==='1'; render();}
  if(t.id==='sVac'){S.vacation=t.checked; S.vacChoice=null; if(t.checked&&S.stuState!=='assigned'){S.stuState='assigned';S.assigned=TEACHERS[0];S.fmt=S.fmt||'platform';if(!S.picked.length)S.picked=['0-19','2-19'];} render();}
  if(t.id==='fage'){S.filt.age=t.value; render();}
  if(t.id==='fspec'){S.filt.spec=t.value; render();}
  if(t.id==='fexp'){S.filt.exp=+t.value; render();}
  if(t.dataset.tfmt){const a=S.t.profile.fmt,k=t.dataset.tfmt,i=a.indexOf(k); i>=0?a.splice(i,1):a.push(k); render();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.rescap!==undefined){ S.t.profile.resPh[+t.dataset.rescap].c=t.value; return; }
  if(t.dataset.cscore!==undefined){ S.t.profile.certs[+t.dataset.cscore].s=t.value; return; }
  if(t.dataset.lang!==undefined){ S.t.profile.langs[+t.dataset.lang][0]=t.value; return; }
  if(!t.dataset.cnt) return;
  if(t.id==='about') S.t.profile.about=t.value;
  if(t.id==='exp1') S.t.profile.exp=t.value;
  const c=$('#c-'+t.id); const m=t.maxLength; c.textContent=t.value.length+' / '+m+(t.id==='about'?' · минимум 200':''); c.classList.toggle('lim',t.value.length>=m);
});
document.addEventListener('focusout',e=>{ if(e.target.id==='about'||e.target.id==='exp1') side(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeModal(); if(S.bellOpen){S.bellOpen=false;render();}} });
render();
</script>

</body></html>
