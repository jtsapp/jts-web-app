:root{
  /* ---- brand palette (Visual Guideline 2.1) ---- */
  --black:#000000; --violet:#874BF8; --cyan:#0AAFFF; --green:#00D441; --orange:#FF631E; --gold:#FFAD00;
  --violet-ink:#6633D6; --cyan-ink:#0470A6; --green-ink:#068A36; --orange-ink:#C64010; --gold-ink:#8A6100;
  --red:#E23D3D; --red-ink:#BE2020; --red-soft:#FFECEC;
  --ink:#000000; --ink-2:#4E4B4B; --ink-3:#898787; --ink-4:#B4B2BC;
  --hair:#E7E4F0; --hair-2:#CFCBDD;
  --paper:#FFFFFF; --page:#F1EFF7;
  --v-soft:#F2ECFF; --v-soft-2:#E5DAFF; --c-soft:#E8F5FE; --g-soft:#E1FAEA; --o-soft:#FFEEE7; --gold-soft:#FFF5DE;

  /* ---- radii: bubbles carry a tail corner, cards do not ---- */
  --r-xs:10px; --r-s:14px; --r-m:20px; --r-l:26px;
  --bub-you:20px 20px 6px 20px;      /* learner speaks */
  --bub-them:20px 20px 20px 6px;     /* someone else speaks */

  --sh-1:0 1px 2px rgba(16,10,40,.05);
  --sh-2:0 2px 4px rgba(16,10,40,.05),0 12px 28px rgba(16,10,40,.08);
  --sh-lift:0 10px 24px rgba(135,75,248,.20);

  --font:'PT Root UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;

  /* ---- type scale (one scale, used strictly) ---- */
  --t-display:33px; --t-title:22px; --t-lead:19px; --t-task:18px;
  --t-body:16.5px; --t-small:14px; --t-label:12px; --t-micro:11.5px;

  --bar-h:56px; --act-h:76px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--page);color:var(--ink);
  font-size:var(--t-body);line-height:1.45;font-weight:400;
  padding-bottom:calc(var(--act-h) + env(safe-area-inset-bottom) + 12px);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:left}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em;margin:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ============================================================
   BRAND MARKS
   The "o" of "to" is the brand symbol — a speech bubble.
   Any element that carries language the learner produces gets
   a bubble tail. Material the learner receives never does.
   ============================================================ */
.logo{font-weight:700;font-size:17px;letter-spacing:-.035em;line-height:1;white-space:nowrap;color:var(--ink)}
.logo i{font-style:normal;color:var(--violet)}
.tail{position:relative}
.tail::after{
  content:'';position:absolute;left:22px;bottom:-11px;width:26px;height:14px;background:inherit;
  border-radius:0 0 14px 0;clip-path:polygon(0 0,100% 0,0 100%);
}

/* ============================================================
   TOP BAR
   ============================================================ */
.bar{
  position:sticky;top:0;z-index:30;height:var(--bar-h);
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--hair);
}
.bar .wrap{display:flex;align-items:center;gap:10px;height:var(--bar-h)}
.bar .spacer{flex:1}
.chip-miss{
  display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;
  background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink);
  border-radius:999px;padding:5px 11px;white-space:nowrap;min-height:30px;
}
.chip-miss:hover{border-color:var(--violet)}
.langs{display:flex;gap:2px;background:var(--page);border:1px solid var(--hair);border-radius:999px;padding:3px}
.langs button{font-size:var(--t-micro);font-weight:700;padding:6px 9px;border-radius:999px;color:var(--ink-3);min-height:30px;text-align:center}
.langs button.on{background:var(--ink);color:#fff}

/* ============================================================
   HOME
   ============================================================ */
.hero{
  background:var(--violet);color:#fff;border-radius:var(--r-l);padding:26px 22px 24px;
  margin:18px 0 14px;position:relative;
}
.hero::before{content:'';position:absolute;right:-50px;top:-64px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .eyebrow{font-size:var(--t-micro);font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.78;position:relative}
.hero h1{font-size:var(--t-display);line-height:1.04;margin:8px 0 8px;position:relative}
.hero p{margin:0;font-size:var(--t-small);opacity:.88;max-width:40ch;position:relative}

.unit{margin-bottom:22px}
.unit-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;width:100%;padding:2px 0}
.unit-no{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--v-soft);color:var(--violet-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;
}
.unit-no::after{content:'';position:absolute;left:5px;bottom:-2px;width:10px;height:8px;background:var(--v-soft);border-radius:0 0 5px 0;clip-path:polygon(0 0,100% 0,0 100%)}
.unit-head .t{flex:1;min-width:0}
.unit-head .k{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.unit-head h2{font-size:17px;margin-top:1px;line-height:1.2}
.unit-head .caret{color:var(--ink-3);font-size:16px;transition:transform .18s}
.unit.open .unit-head .caret{transform:rotate(90deg)}

.rows{display:flex;flex-direction:column;gap:6px}
.lrow{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--hair);
  border-radius:var(--r-s);padding:11px 13px;box-shadow:var(--sh-1);width:100%;
  transition:border-color .14s,transform .14s;
}
.lrow:hover{border-color:var(--violet);transform:translateX(2px)}
.lrow .dial{
  width:30px;height:30px;flex:none;border-radius:50%;
  background:conic-gradient(var(--green) var(--p),var(--hair) 0);
  display:flex;align-items:center;justify-content:center;
}
.lrow .dial i{
  width:22px;height:22px;background:var(--paper);border-radius:50%;font-style:normal;font-size:var(--t-micro);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green-ink);
}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.lrow .t span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}
.lrow .go{color:var(--ink-4);font-size:15px}
.lrow.done{border-color:#BFEFD2;background:#FBFFFC}
.lrow.chal{background:var(--ink);border-color:var(--ink)}
.lrow.chal .t b{color:#fff}.lrow.chal .t span{color:var(--gold)}
.lrow.chal .dial i{background:var(--ink)}

/* ============================================================
   ACTIVITY SCREEN — rail is the map, no separate map screen
   ============================================================ */
.rail{padding:14px 0 4px}
.seg{display:flex;gap:3px;margin-bottom:9px}
.seg i{flex:1;height:4px;border-radius:999px;background:var(--hair);transition:background .3s}
.seg i.on{background:var(--green)}
.seg i.cur{background:var(--violet)}
.railmeta{display:flex;align-items:center;gap:10px;width:100%}
.railmeta .back{
  width:36px;height:36px;flex:none;border-radius:11px;background:var(--paper);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh-1);
}
.railmeta .back:hover{border-color:var(--violet)}
.railmeta .t{flex:1;min-width:0;text-align:left}
.railmeta .t b{display:block;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railmeta .t span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}
.railmeta .open{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--paper);
  border-radius:999px;padding:7px 12px;font-size:var(--t-label);font-weight:700;color:var(--ink-2);
  min-height:36px;box-shadow:var(--sh-1);white-space:nowrap;
}
.railmeta .open:hover{border-color:var(--violet);color:var(--violet-ink)}

/* instruction strip — deliberately quiet, the task is the loud layer */
.brief{display:flex;align-items:flex-start;gap:10px;margin:14px 0 10px;padding:0 2px}
.brief .tag{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--violet-ink);background:var(--v-soft);border-radius:999px;
  padding:5px 11px;flex:none;white-space:nowrap;
}
.brief .tag.s-in{color:var(--cyan-ink);background:var(--c-soft)}
.brief .tag.s-out{color:var(--orange-ink);background:var(--o-soft)}
.brief .tag.s-rec{color:var(--green-ink);background:var(--g-soft)}
.brief .tx{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.35;color:var(--ink-2);padding-top:3px}
.brief .tx em{display:block;font-style:normal;font-size:13px;color:var(--ink-3);margin-top:3px}

.card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-l);padding:18px 16px;box-shadow:var(--sh-2)}

/* ---- items ---- */
.items{display:flex;flex-direction:column}
.item{padding:16px 0;border-top:1px solid var(--hair)}
.item:first-child{border-top:0;padding-top:2px}
.item.solved{opacity:.62}
.item.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* a wrong move should be felt wherever it happens, not only inside .item */
.shake{animation:shake .32s}
.qline{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:var(--t-task);line-height:1.55;font-weight:500}
.qn{
  font-style:normal;font-weight:700;font-size:var(--t-micro);color:var(--ink-3);background:var(--page);
  border-radius:7px;padding:3px 7px;flex:none;align-self:flex-start;margin-top:4px;min-width:24px;text-align:center;
}
.pic{font-size:20px}
.ph{color:var(--ink-3);font-weight:400}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opt{
  border:1.5px solid var(--hair-2);background:var(--paper);border-radius:var(--bub-you);padding:10px 16px;
  font-size:var(--t-body);font-weight:500;min-height:46px;transition:border-color .12s,background .12s,color .12s;
}
.opt:hover{border-color:var(--violet);background:var(--v-soft)}
.opt.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.opt.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink);text-decoration:line-through}
.opt.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;font-weight:700}
.opt[disabled]{cursor:default}

/* the blank IS a bubble — "your answer is speech" */
.blank{
  display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:42px;
  border:0;border-bottom:2.5px solid var(--violet);background:var(--v-soft);
  border-radius:var(--bub-you);padding:5px 14px;font-weight:700;color:var(--violet-ink);
  font-size:var(--t-body);transition:background .14s,color .14s,border-color .14s;
}
.blank:empty::before{content:'\00a0\00a0\00a0';}
.blank:hover{background:var(--v-soft-2)}
.blank.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.blank.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.blank.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}
.blank.lock{pointer-events:none}

.bank{
  display:flex;flex-wrap:wrap;gap:8px;background:var(--v-soft);border:1px solid var(--v-soft-2);
  border-radius:var(--r-m);padding:12px;margin-bottom:16px;
}
.bank .hint{width:100%;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-ink);opacity:.72;margin-bottom:2px}
.tok{
  border:1.5px solid var(--v-soft-2);background:var(--paper);border-radius:var(--r-xs);padding:9px 14px;
  font-weight:500;font-size:var(--t-body);min-height:42px;transition:.12s;
}
.tok:hover{border-color:var(--violet)}
.tok.act{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700;box-shadow:var(--sh-lift)}
/* a spent word is greyed and struck through — never invisible, so the
   learner can always see which word went where */
.tok.used{opacity:.55;background:var(--page);color:var(--ink-2);border-style:dashed;text-decoration:line-through;pointer-events:none}
.tok.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.tok.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tok.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}

/* ---- drag and drop ------------------------------------------------------
   the word you pick up stays where it was and a copy travels with the
   pointer, so nothing ever disappears mid-move                            */
.tok,.fixw,.opt,.mcard,.seqrow{-webkit-user-select:none;user-select:none}
.grab{touch-action:none;cursor:grab}
.grab:active{cursor:grabbing}
.tok.lift{opacity:.45;border-style:dashed;box-shadow:none}
.dragghost{
  position:fixed;z-index:140;margin:0;pointer-events:none;box-sizing:border-box;
  box-shadow:var(--sh-lift);opacity:.97;
  background:var(--violet);border:1.5px solid var(--violet);color:#fff;font-weight:700;
  border-radius:var(--r-xs);padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;
}
body.dragging{cursor:grabbing}
.dz-open{outline:2px dashed var(--v-soft-2);outline-offset:3px}
.dz-hot{outline:2.5px solid var(--violet);outline-offset:3px;background:var(--v-soft)}
.blank.dz-hot{border-bottom-color:var(--violet)}
.tok.bounce{animation:tokbounce .32s ease}
@keyframes tokbounce{0%{transform:scale(1.14)}60%{transform:scale(.97)}100%{transform:scale(1)}}

.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair)}
.mrow:first-of-type{border-top:0}
.mrow .side{flex:1;display:flex;gap:8px;align-items:center;font-size:var(--t-body);font-weight:500;min-width:0}
.mrow .blank{flex:none;width:47%}

.built{
  min-height:52px;border:2px dashed var(--hair-2);border-radius:var(--bub-you);padding:8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:11px 0 9px;background:var(--page);
}
.built.ok{border-style:solid;border-color:var(--green);background:var(--g-soft)}
.built.no{border-style:solid;border-color:var(--red);background:var(--red-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:7px}

.fixw{
  border:1.5px solid transparent;background:var(--page);border-radius:9px;padding:6px 11px;
  font-size:var(--t-body);font-weight:500;margin:0 3px 5px 0;min-height:38px;
}
.fixw:hover{border-color:var(--violet)}
/* the task is "tap the wrong word": spotting it is a CORRECT answer, so it
   turns green (and is struck through, because it is the word being replaced);
   tapping a word that is fine is the mistake, so that turns red */
.fixw.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);text-decoration:line-through;font-weight:700}
.fixw.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.fixw.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;text-decoration:line-through}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.col{border:1.5px dashed var(--hair-2);border-radius:var(--r-m);padding:11px;min-height:104px;background:var(--page)}
.col h4{margin:0 0 9px;font-size:var(--t-label);font-weight:700;color:var(--ink-2);text-align:center}
.col.armed{border-color:var(--violet);background:var(--v-soft)}
.drop{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

.gtable{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:16px;font-size:15px}
.gtable th{background:var(--ink);color:#fff;font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;padding:10px;text-align:left;font-weight:700}
.gtable th:first-child{border-radius:11px 0 0 0}.gtable th:last-child{border-radius:0 11px 0 0}
.gtable td{border-bottom:1px solid var(--hair);padding:9px 10px;vertical-align:middle}

/* ---- source material: flat card + cyan rule, never a bubble ---- */
.src{
  background:var(--c-soft);border:1px solid #CFEAFB;border-left:4px solid var(--cyan);
  border-radius:6px var(--r-m) var(--r-m) 6px;padding:15px 16px;margin-bottom:14px;
}
.src .k{font-weight:700;font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan-ink);margin-bottom:7px}
.src .body{font-size:17px;line-height:1.7}
.player{display:flex;align-items:center;gap:12px}
.play{
  width:46px;height:46px;flex:none;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.play:hover{transform:scale(1.04)}
.play.on{background:var(--violet)}
.pl{flex:1;min-width:0}
.pl b{display:block;font-size:14.5px;color:var(--cyan-ink)}
.pl span{font-size:var(--t-label);color:var(--ink-3)}
.slow{
  border:1.5px solid #CFEAFB;background:var(--paper);border-radius:999px;padding:7px 12px;
  font-size:var(--t-label);font-weight:700;color:var(--cyan-ink);min-height:36px;white-space:nowrap;
}
.slow.on{background:var(--cyan);border-color:var(--cyan);color:#fff}

.ghost{
  border:1.5px solid var(--hair-2);border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px;
  color:var(--ink-2);background:var(--paper);min-height:40px;display:inline-flex;align-items:center;gap:7px;
}
.ghost:hover{border-color:var(--violet);color:var(--violet-ink)}

/* ---- situation card (respond) ---- */
.sit{border:1.5px solid var(--o-soft);background:#FFFBF9;border-radius:var(--r-m);padding:14px 15px}
.sit .em{font-size:26px;line-height:1}
.sit .s{font-weight:700;font-size:var(--t-body);margin-top:6px;line-height:1.35}
.sit .ask{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-ink);margin-top:9px}

/* ---- chat: mirrors the brand's AI-tutor bubbles ---- */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.bub{max-width:88%;padding:11px 15px;font-size:var(--t-body);line-height:1.5;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bub.a{align-self:flex-start;background:var(--page);border:1px solid var(--hair);border-radius:var(--bub-them)}
.bub.b{align-self:flex-end;background:var(--violet);color:#fff;border-radius:var(--bub-you)}
.bub.b .blank{background:rgba(255,255,255,.22);border-color:#fff;color:#fff}
.bub.b .blank.ok{background:var(--green);border-color:#fff;color:#fff}
.bub.b .blank.no{background:var(--red);border-color:#fff;color:#fff}
.bub.b .blank.rev{background:var(--green);border-color:#fff;color:#fff}

/* ---- word pairs ---- */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{
  min-height:82px;border-radius:var(--r-s);border:1.5px solid var(--hair-2);background:var(--paper);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:7px 5px;font-weight:500;
  font-size:13px;line-height:1.22;overflow:hidden;word-break:break-word;transition:.16s;
}
.mcard .face{display:none}
.mcard.up{background:var(--v-soft);border-color:var(--violet)}
.mcard.up .face{display:block}.mcard.up .back{display:none}
.mcard .back{font-size:19px;opacity:.35}
.mcard.got{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);pointer-events:none}
.mcard.rev{background:var(--gold-soft);border-color:var(--gold);pointer-events:none}
.memo-st{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:12px}

/* ---- write & speak ---- */
/* --- typed retrieval --- */
.trow{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.tin{
  flex:1;min-width:150px;font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);
  background:var(--page);border:1.5px solid var(--hair-2);border-radius:var(--r-m);padding:12px 14px;min-height:48px}
.tin:focus{outline:0;border-color:var(--violet);background:#fff}
.tin.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.tin.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tin.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;font-weight:700}
.tin[disabled]{opacity:1}
.tgo{
  flex:none;width:48px;height:48px;border-radius:var(--r-m);background:var(--violet);color:#fff;
  font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--violet-ink)}
.tgo:active{transform:translateY(2px);box-shadow:none}
.tgo[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
/* --- put in order (numbered rows) --- */
.seqbox{display:flex;flex-direction:column;gap:8px}
.seqrow{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--page);border:1.5px solid var(--hair-2);border-radius:var(--r-m);padding:12px 14px;min-height:52px;transition:.14s}
.seqrow:hover{border-color:var(--violet)}
.seqrow .sn{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--hair);color:var(--ink-3);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seqrow .sx{flex:1;min-width:0;font-size:var(--t-body);font-weight:500}
.seqrow.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.seqrow.ok .sn{background:var(--green);color:#fff}
.seqrow.no{background:var(--red-soft);border-color:var(--red)}
.seqrow.rev{background:var(--g-soft);border-color:var(--green);border-style:dashed;color:var(--green-ink)}
.seqrow.rev .sn{background:var(--green);color:#fff}
.seqrow[disabled]{cursor:default}
/* --- choose inside a text --- */
.dropbox{background:var(--page);border:1px solid var(--hair);border-radius:var(--r-m);padding:15px 16px}
.dl{margin:0 0 11px;font-size:17px;line-height:2.15}
.dl:last-child{margin-bottom:0}
.dsel{
  font-family:inherit;font-size:16px;font-weight:700;color:var(--violet-ink);
  background:var(--v-soft);border:1.5px solid var(--v-soft-2);border-radius:9px;padding:5px 6px;margin:0 2px}
.dsel:focus{outline:0;border-color:var(--violet)}
.dsel.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.dsel.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.dsel.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}
.dsel[disabled]{opacity:1}
.ta{
  width:100%;min-height:112px;border:1.5px solid var(--hair-2);border-radius:var(--bub-you);padding:13px 15px;
  resize:vertical;line-height:1.55;background:var(--page);font-weight:400;font-size:var(--t-body);
}
.ta:focus{outline:0;border-color:var(--violet);background:#fff}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.recbtn{
  background:var(--orange);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;min-height:46px;
  box-shadow:0 3px 0 var(--orange-ink);display:inline-flex;align-items:center;gap:7px;
}
.recbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-ink)}
.recbtn.on{background:var(--red-ink);box-shadow:0 3px 0 #8E1515}
.model{display:none;margin-top:11px;background:var(--gold-soft);border:1px solid #F0DCA9;border-radius:var(--bub-them);padding:12px 14px;font-size:15px}
.model.on{display:block}
.model b{display:block;font-size:var(--t-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px}

/* ---- inline note: replaces the floating toast ---- */
.note{
  margin-top:11px;border-radius:var(--bub-them);padding:11px 14px;font-size:14px;font-weight:500;line-height:1.45;
  display:flex;gap:9px;align-items:flex-start;
}
.note .ic{font-size:16px;line-height:1.2;flex:none}
.note.good{background:var(--g-soft);border:1px solid #BFEFD2;color:var(--green-ink)}
.note.warn{background:var(--gold-soft);border:1px solid #F0DCA9;color:var(--gold-ink)}
.note.tell{background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink)}
.corr{display:inline-block;margin-left:7px;font-weight:700;color:var(--green-ink);background:var(--g-soft);border-radius:8px;padding:2px 9px;font-size:15px}

/* ============================================================
   ACTION BAR — one fixed layer, nothing else floats
   ============================================================ */
.act{
  position:fixed;left:0;right:0;bottom:0;z-index:28;background:rgba(255,255,255,.96);
  backdrop-filter:blur(16px);border-top:1px solid var(--hair);
  padding:11px 0 calc(11px + env(safe-area-inset-bottom));
}
.act .wrap{display:flex;gap:9px;align-items:center}
.btn{border-radius:999px;padding:14px 22px;font-weight:700;font-size:15.5px;min-height:50px;transition:.12s;text-align:center;white-space:nowrap}
.btn-go{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-ink)}
.btn-next{background:var(--ink);color:#fff;box-shadow:0 3px 0 #3A3A3A}
.btn-go:active,.btn-next:active{transform:translateY(2px);box-shadow:none}
.btn-ghost{background:var(--paper);border:1.5px solid var(--hair-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--violet);color:var(--violet-ink)}
.btn[disabled]{opacity:.42;pointer-events:none}
.tally{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);
  padding-left:4px;
}
.tally .dot{width:9px;height:9px;border-radius:50%;background:var(--hair-2);flex:none}
.tally .dot.on{background:var(--green)}
.tally .dot.bad{background:var(--red)}

/* ============================================================
   WRAP-UP
   ============================================================ */
.done-hero{text-align:center;padding:6px 0 2px}
.done-hero .big{font-size:52px;line-height:1}
.done-hero h2{margin:9px 0 3px;font-size:24px}
.done-hero p{margin:0;color:var(--ink-3);font-weight:500;font-size:14.5px}
.sect{margin-top:22px}
.sect h3{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.scrow{
  display:flex;align-items:center;gap:11px;border:1.5px solid var(--hair);border-radius:var(--r-s);
  padding:12px 13px;margin-bottom:8px;width:100%;background:var(--paper);
}
.scrow .box{width:26px;height:26px;flex:none;border:2px solid var(--hair-2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;font-weight:700}
.scrow.on{border-color:var(--green);background:var(--g-soft)}
.scrow.on .box{background:var(--green);border-color:var(--green);color:#fff}
.scrow span{flex:1;font-size:15px;font-weight:500;line-height:1.35}
.recap .r{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14.5px;width:100%;background:none}
.recap .r span{flex:1;color:var(--ink-2);font-weight:500}
.recap .r b{font-weight:700;white-space:nowrap}
.recap .r b.miss{color:var(--red-ink)}

/* ============================================================

   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(10,6,26,.5);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:26px 26px 0 0;
  padding:8px 0 calc(18px + env(safe-area-inset-bottom));max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;
}
.sheet.on{transform:none}
.grip{width:38px;height:4px;border-radius:99px;background:var(--hair-2);margin:6px auto 12px;flex:none}
.sheet .hd{padding:0 18px 12px;flex:none}
.sheet .hd h3{font-size:var(--t-lead);margin-bottom:2px}
.sheet .hd .sub{color:var(--ink-3);font-size:13px;font-weight:500}
.tabs{display:flex;gap:4px;background:var(--page);border-radius:999px;padding:4px;margin:10px 18px 0;flex:none}
.tabs button{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 6px;border-radius:999px;color:var(--ink-3);min-height:38px}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:var(--sh-1)}
.sheet .pane{overflow:auto;padding:14px 18px 4px;flex:1;-webkit-overflow-scrolling:touch}

.stage h4{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px;margin:16px 0 8px}
.stage:first-child h4{margin-top:0}
.step{
  width:100%;display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--hair);
  border-radius:var(--r-s);padding:11px 13px;margin-bottom:6px;transition:border-color .14s;
}
.step:hover{border-color:var(--violet)}
.step .dot{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--hair-2);display:flex;align-items:center;justify-content:center;font-size:var(--t-label);font-weight:700;color:var(--ink-3)}
.step.ok .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.cur{border-color:var(--violet);box-shadow:0 0 0 3px var(--v-soft)}
.step.cur .dot{border-color:var(--violet);color:var(--violet-ink)}
.step .lbl{flex:1;min-width:0}
.step .lbl b{display:block;font-size:14.5px;font-weight:500;line-height:1.3}
.step .lbl span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}

.vrow{display:flex;align-items:center;gap:11px;border:1px solid var(--hair);border-radius:var(--r-s);padding:10px 12px;margin-bottom:7px}
.vp{font-size:20px;flex:none}
.vw{flex:1;min-width:0}
.vw b{display:block;font-size:15.5px}
.vw span{font-size:13px;color:var(--ink-3);font-weight:500}
.spk{width:38px;height:38px;flex:none;border-radius:11px;background:var(--v-soft);color:var(--violet-ink);font-size:14px;display:flex;align-items:center;justify-content:center}
.spk:hover{background:var(--v-soft-2)}

.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty .big{font-size:38px;line-height:1;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:var(--t-lead);margin-bottom:6px}
.empty p{margin:0 auto;max-width:34ch;font-size:14.5px;font-weight:500;line-height:1.45}

  .bub{max-width:94%}
}

}

/* ---------- merge: word-pairs game + extra activities + tips ---------- */
(function(){
  function mix(a,seed){var r=seed||7,x=a.slice();for(var i=x.length-1;i>0;i--){r=(r*9301+49297)%233280;
    var j=Math.floor(r/233280*(i+1));var tmp=x[i];x[i]=x[j];x[j]=tmp}return x}
  function memoAct(voc,seed){
    var pick=voc.filter(function(v){return v[0].split(' ').length<3}).slice(0,6);
    return {t:'memo',ins:'memo',seed:seed,pairs:pick.map(function(v){return [v[0],v[1],v[2],v[3]||'🔤']})};
  }
  UNITS.forEach(function(u){
    if(!u.rev||!WB[u.rev])return;
    var pool=[];
    var seenW={};
    u.ls.forEach(function(n){
      if(!WB[n])return;
      WB[n].voc.forEach(function(v){if(!seenW[v[0]]){seenW[v[0]]=1;pool.push(v)}});
    });
    WB[u.rev].voc=pool;
    /* v4 reviews declare their own screens; only legacy ones get the word-pairs game */
    if(!WB[u.rev].v4)WB[u.rev].acts.push(memoAct(mix(pool,u.n*13+5),u.n*7+3));
  });
  for(var n in WB){
    var W=WB[n];
    W.tip=TIP[n]||null;
    W.gr=GR[n]||null;
    W.can=CAN[n]||null;
    /* v4: a rebuilt lesson declares its own arc — nothing is injected into it.
       Legacy lessons keep the v3 behaviour until they are rebuilt in turn. */
    if(W.v4)continue;
    var add=ADD[n];
    if(!add)continue;
    var base=W.acts.slice(0,W.acts.length-1),last=W.acts[W.acts.length-1];
    var out=[base[0],memoAct(W.voc,(+n)*11+7)].concat(base.slice(1));
    add.forEach(function(a){out.push(a)});
    out.push(last);
    W.acts=out;
  }
  /* One step per screen. Runs last, so the split survives every other pass:
     a combined write+speak task becomes two screens. */
  for(var m in WB){
    var split=[];
    WB[m].acts.forEach(function(a){
      if(a.t==='turn'){
        split.push({t:'write',ins:'write',sub:a.sub,write:a.write});
        split.push({t:'speak',ins:'speak',speak:a.speak});
      }else split.push(a);
    });
    WB[m].acts=split;
  }
})();

    {re:/Google US English/i,       s:112,g:'f'},

function stopAudio(){
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  VE.stop();
}
function speak(lines,cb){
  try{VE.play(lines,cb)}catch(e){if(cb)cb()}
}
function playTrack(track,lines,btn){
  stopAudio();
  if(btn){btn.innerHTML='⏸';btn.classList.add('on')}
  var done=function(){if(btn){btn.innerHTML='▶';btn.classList.remove('on')}};
  if(!track){speak(lines,done);return}
  var base=(typeof window!=='undefined'&&window.JTS_AUDIO_BASE)?window.JTS_AUDIO_BASE:'';
  var paths=[];
  if(base)paths.push(base+'Track_'+track+'.mp3');
  paths.push('audio/Track_'+track+'.mp3','Coursebook Audio/Track_'+track+'.mp3');
  var k=0;
  (function tryNext(){
    if(k>=paths.length){curAudio=null;speak(lines,done);return}
    var a=new Audio(paths[k++]);
    a.playbackRate=slowOn?0.75:1;a.onended=done;
    a.onerror=function(){curAudio=null;tryNext()};
    curAudio=a;
    var p=a.play();
    if(p&&p['catch'])p['catch'](function(){curAudio=null;tryNext()});
  })();

/* ============================================================
   LEDGER — the engine's model of one screen
   Renderers declare their items and report each resolution.
   ============================================================ */
var L=null;
function newLedger(){
  return {
    total:0, first:0, resolved:0, wrong:0, missed:[], free:false,
    add:function(){this.total++;return this.total-1},
    /* a wrong attempt — used to reveal the escape hatch only when someone is stuck */
    slip:function(){this.wrong++;if(typeof this.onchange==='function')this.onchange()},
    /* ok = right on the very first attempt */
    hit:function(idx,ok){
      if(ok)this.first++; else if(this.missed.indexOf(idx)<0)this.missed.push(idx);
      this.resolved++;
      if(typeof this.onchange==='function')this.onchange();
    },
    done:function(){return this.free||this.resolved>=this.total},
    score:function(){return this.total?Math.round(this.first/this.total*100):100}
  };
}

var R={};

function numericLadder(o){
  var v=o.map(function(x){return parseFloat(String(x).replace(/[^0-9.]/g,''))});
  if(v.some(isNaN))return false;
  for(var i=1;i<v.length;i++)if(v[i]<=v[i-1])return false;
  return true;
}

  if(a.nosh||numericLadder(it.o))return it.o.map(function(_,k){return k});
  return shuffle(it.o.map(function(_,k){return k}),(a.seed||5)*31+i*17+it.o.length*7+String(it.q||it.s||'').length);

/* ---- pick one option (choose / tf / odd / label / respond) ---- */
function pickRender(a,root,head){
  a.items.forEach(function(it,i){
    var ord=optOrder(a,it,i);
    var right=ord.indexOf(it.a);
    var idx=L.add(), clean=true, live=true;
    var q=el('div','item');
    q.appendChild(head(it,i));
    var opts=el('div','opts');
    ord.forEach(function(oi,k){
      var b=el('button','opt',esc(it.o[oi]));
      b.setAttribute('aria-label',String(it.o[oi]));
      b.onclick=function(){
        if(!live)return;
        if(k===right){
          live=false;b.classList.add('ok');
          Array.prototype.forEach.call(opts.children,function(c){c.disabled=true});
          q.classList.add('solved');
          if(it.why)q.appendChild(noteEl(clean?'good':'tell','💡',esc(it.why)));
          else if(!clean)q.appendChild(noteEl('good','✓',esc(t('gotit'))));
          L.hit(idx,clean);
        }else{
          clean=false;b.classList.add('no');b.disabled=true;flash(q);L.slip();
        }
      };
      opts.appendChild(b);
    });
    q.appendChild(opts);
    q._reveal=function(){
      if(!live)return;live=false;
      Array.prototype.forEach.call(opts.children,function(c,k){
        c.disabled=true;if(k===right)c.classList.add('rev');
      });
      q.classList.add('solved');
      q.appendChild(noteEl('tell','📘',esc(t('answer_is'))+' <b>'+esc(it.o[it.a])+'</b>'+(it.why?' — '+esc(it.why):'')));
      L.hit(idx,false);
    };
    root.appendChild(q);
  });
  root._items=Array.prototype.slice.call(root.querySelectorAll('.item'));
}
function pickShowAll(a,root){
  (root._items||[]).forEach(function(q){if(q._reveal)q._reveal()});

/* ============================================================
   DRAG AND DROP — one shared layer behind every tile task
   · the word never disappears: the original stays in place and a
     visible copy travels with the finger or the mouse
   · every possible target is outlined while a word is in the air,

    if(z)z.classList.add('dz-hot');
  }
  function zoneAt(x,y){
    var n=null;
    try{n=document.elementFromPoint?document.elementFromPoint(x,y):null}catch(e){n=null}
    while(n&&n.classList){
      if(n.classList.contains('dz')&&n._dzkind===cur.kind&&!n.classList.contains('lock'))return n;
      n=n.parentNode;
    }
    return null;
  }
  function follow(x,y){
    if(cur.ghost)cur.ghost.style.transform='translate('+px(x-cur.x0)+','+px(y-cur.y0)+') scale(1.05)';
    hot(zoneAt(x,y));
  }
  function lift(x,y){
    cur.live=true;
    cur.ghost=makeGhost(cur.src);
    cur.src.classList.add('lift');
    document.body.classList.add('dragging');
    openZones(true);
    follow(x,y);
  }
  function finish(useDrop,x,y){
    if(!cur)return;
    var c=cur;cur=null;
    document.removeEventListener('pointermove',onMove,true);
    document.removeEventListener('pointerup',onUp,true);
    document.removeEventListener('pointercancel',onCancel,true);
    if(!c.live)return;
    ended=Date.now();
    if(c.ghost&&c.ghost.parentNode)c.ghost.parentNode.removeChild(c.ghost);
    c.src.classList.remove('lift');
    document.body.classList.remove('dragging');
    Array.prototype.forEach.call(document.querySelectorAll('.dz'),function(z){z.classList.remove('dz-open','dz-hot')});
    if(useDrop&&c.zone&&typeof c.zone._dzdrop==='function')c.zone._dzdrop(c.src,x,y);
    else bounce(c.src);
  }
  function onMove(e){
    if(!cur)return;
    if(!cur.live){
      if(Math.abs(e.clientX-cur.x0)+Math.abs(e.clientY-cur.y0)<7)return;
      lift(e.clientX,e.clientY);
    }
    if(e.cancelable)e.preventDefault();
    follow(e.clientX,e.clientY);
  }
  function onUp(e){finish(true,e.clientX,e.clientY)}
  function onCancel(){finish(false)}
  return {
    /* make a node draggable — kind must match the kind of its targets */
    grab:function(node,kind){
      node.classList.add('grab');
      node.addEventListener('pointerdown',function(e){
        if(e.button&&e.button!==0)return;
        if(node.disabled||node.classList.contains('used'))return;
        finish(false);
        cur={src:node,kind:kind,x0:e.clientX,y0:e.clientY,zone:null,live:false,ghost:null};
        document.addEventListener('pointermove',onMove,true);
        document.addEventListener('pointerup',onUp,true);
        document.addEventListener('pointercancel',onCancel,true);
      });
      return node;
    },
    /* register a target — onDrop(sourceNode, x, y) does the judging */
    zone:function(node,kind,onDrop){
      node.classList.add('dz');
      node._dzkind=kind;node._dzdrop=onDrop;
      return node;
    },
    /* a finished drag is followed by a click, which handlers ignore */
    justDragged:function(){return Date.now()-ended<350},
    bounce:bounce,
    /* which tile the pointer is in front of, so a word lands where it is dropped */
    slot:function(host,x,y){
      if(x==null||y==null)return null;
      var kids=Array.prototype.slice.call(host.children),i,r;
      for(i=0;i<kids.length;i++){
        r=kids[i].getBoundingClientRect();
        if(!r.width&&!r.height)continue;
        if(y<r.bottom&&x<r.left+r.width/2)return kids[i];
      }
      return null;
    }
  };
})();

/* ---- word box + bubble blanks (bank / match / table / chat) ---- */
function makeBank(root,words,seed,label){
  var bank=el('div','bank'),active=null;
  bank.appendChild(el('div','hint',esc(label||t('wordbank'))));
  shuffle(words,seed||3).forEach(function(w){
    var c=el('button','tok',esc(w));c.dataset.w=w;
    DND.grab(c,'word');
    c.onclick=function(){
      if(DND.justDragged())return;
      if(c.classList.contains('used'))return;
      if(active===c){c.classList.remove('act');active=null;return}
      if(active)active.classList.remove('act');
      active=c;c.classList.add('act');
    };
    bank.appendChild(c);
  });
  bank.use=function(c){if(!c)return;c.classList.add('used');c.classList.remove('act');if(active===c)active=null};
  bank.take=function(){var a=active;bank.use(a);return a};
  bank.peek=function(){return active};
  bank.drop=function(){if(active){active.classList.remove('act');active=null}};
  /* a word that did not fit comes back to the box, visibly */
  bank.free=function(c){if(!c)return;c.classList.remove('used');if(active===c){c.classList.remove('act');active=null}DND.bounce(c)};
  bank.give=function(w){bank.free(bank.findTok(w))};
  bank.findTok=function(word){
    var out=null;
    Array.prototype.forEach.call(bank.querySelectorAll('.tok'),function(c){if(!out&&c.dataset.w===word&&c.classList.contains('used'))out=c});
    return out;
  };
  bank.burn=function(){Array.prototype.forEach.call(bank.querySelectorAll('.tok'),function(c){c.classList.add('used')})};
  return bank;
}
/* a blank that judges itself the moment it is filled — by tap or by drop */
function liveBlank(ans,bank,host){
  var s=el('button','blank','');s.dataset.a=ans;
  /* an empty gap has no text, so it needs an accessible name of its own */
  s.setAttribute('aria-label',t('gap'));
  var idx=L.add(),clean=true,live=true,undo=null;
  /* ONE validator, two ways in: tap-then-tap and drag-and-drop */
  function put(c){
    if(!live||!c)return false;
    var w=c.dataset.w;
    if(w===ans){
      bank.use(c);live=false;
      if(undo){clearTimeout(undo);undo=null}
      s.textContent=w;s.setAttribute('aria-label',w);
      s.classList.remove('no');s.classList.add('ok','lock');
      L.hit(idx,clean);
      return true;
    }
    /* wrong word: it stays in the gap long enough to be read, in red, and the
       tile returns to the box — the word is never simply swallowed */
    clean=false;
    s.textContent=w;s.classList.add('no');
    bank.free(c);bank.drop();
    flash(host||s);L.slip();
    if(undo)clearTimeout(undo);
    undo=setTimeout(function(){undo=null;if(live){s.textContent='';s.classList.remove('no')}},1100);
    return false;
  }
  s.onclick=function(){if(DND.justDragged())return;put(bank.peek())};
  DND.zone(s,'word',function(c){put(c)});
  s._reveal=function(){
    if(!live)return;live=false;
    if(undo){clearTimeout(undo);undo=null}
    s.textContent=ans;s.setAttribute('aria-label',ans);
    s.classList.remove('no');s.classList.add('rev','lock');
    L.hit(idx,false);
  };
  return s;
}
function blanksShowAll(root){
  Array.prototype.forEach.call(root.querySelectorAll('.blank'),function(s){if(s._reveal)s._reveal()});
  if(root._bank)root._bank.burn();
}

/* ---- build a sentence ---- */
R.order={
  render:function(a,root){
    root.appendChild(noteEl('tell','\uD83D\uDC46',esc(t('drag_order'))));
    a.items.forEach(function(it,i){
      var idx=L.add(),clean=true,live=true;
      var q=el('div','item');
      q.appendChild(el('div','qline',qnum(i)+picOf(it.pic)+'<span class="ph">'+esc(it.hint||'')+'</span>'));
      var built=el('div','built'),tiles=el('div','tiles');
      /* each sentence owns its own kind of tile, so a word can never be
         dropped into a different sentence on the same screen */
      var KT='tile'+i,KB='built'+i;
      function judge(){
        var got=[];
        Array.prototype.forEach.call(built.querySelectorAll('.tok'),function(c){got.push(c.dataset.w)});
        if(got.length<it.w.length)return;
        if(got.join(' ')===it.a){
          live=false;built.classList.remove('no');built.classList.add('ok');q.classList.add('solved');
          Array.prototype.forEach.call(q.querySelectorAll('.tok'),function(c){c.disabled=true});
          L.hit(idx,clean);
        }else{
          clean=false;built.classList.add('no');flash(built);L.slip();
          /* the words are not thrown away — they walk back to the tray */
          setTimeout(function(){
            if(!live)return;
            built.classList.remove('no');
            Array.prototype.slice.call(built.querySelectorAll('.tok')).forEach(pull);
          },820);
        }
      }
      /* put a word into the line — before another word when it is dropped there */
      function push(c,before){
        if(!live||!c||c.classList.contains('used'))return;
        c.classList.add('used');
        var b=el('button','tok',esc(c.dataset.w));b.dataset.w=c.dataset.w;b._src=c;
        DND.grab(b,KB);
        b.onclick=function(){if(DND.justDragged())return;pull(b)};
        if(before&&before.parentNode===built)built.insertBefore(b,before);
        else built.appendChild(b);
        judge();
      }
      /* take a word back out — it returns to the tray, never vanishes */
      function pull(b){
        if(!live||!b||b.parentNode!==built)return;
        built.removeChild(b);
        built.classList.remove('no');
        if(b._src){b._src.classList.remove('used');DND.bounce(b._src)}
      }
      shuffle(it.w,(i+1)*13+(a.seed||5)).forEach(function(w){
        var c=el('button','tok',esc(w));c.dataset.w=w;
        DND.grab(c,KT);
        c.onclick=function(){if(DND.justDragged())return;push(c)};
        tiles.appendChild(c);
      });
      DND.zone(built,KT,function(c,x,y){push(c,DND.slot(built,x,y))});
      DND.zone(tiles,KB,function(b){pull(b)});
      q.appendChild(built);q.appendChild(tiles);
      q._reveal=function(){
        if(!live)return;live=false;
        built.innerHTML='<span class="corr">'+esc(it.a)+'</span>';
        built.classList.remove('no');built.classList.add('ok');
        tiles.style.display='none';q.classList.add('solved');
        L.hit(idx,false);
      };
      root.appendChild(q);
    });
    root._items=Array.prototype.slice.call(root.querySelectorAll('.item'));
  },
  showAll:pickShowAll
};

            live=false;b.classList.remove('no');b.classList.add('ok');
            line.appendChild(el('span','corr','→ '+esc(it.fix)));

R.sort={
  render:function(a,root){
    var cols=el('div','cols'+(a.cols.length>2?' c3':'')),active=null,boxes=[],drops=[];
    function arm(on){boxes.forEach(function(b){b.classList.toggle('armed',!!on)})}
    /* ONE validator, two ways in: tap-then-tap and drag-and-drop */
    function place(chip,k,box){
      if(!chip||chip.disabled)return;
      if(active===chip){active=null;arm(false)}
      chip.classList.remove('act');
      if(+chip.dataset.a===k){
        chip.classList.remove('no');chip.classList.add('ok');chip.disabled=true;
        drops[k].appendChild(chip);
        L.hit(+chip.dataset.idx,chip.dataset.clean!=='0');
      }else{
        /* wrong group: the word stays in the tray, in red, ready for another try */
        chip.dataset.clean='0';chip.classList.add('no');flash(box);L.slip();
        setTimeout(function(){chip.classList.remove('no')},900);
      }

    a.cols.forEach(function(c,k){
      var box=el('div','col');box.dataset.c=k;
      box.appendChild(el('h4',null,esc(loc(c))));
      var d=el('div','drop');box.appendChild(d);drops.push(d);
      box.onclick=function(){
        if(DND.justDragged())return;
        if(active)place(active,k,box);
      };
      DND.zone(box,'chip',function(chip){place(chip,k,box)});
      cols.appendChild(box);boxes.push(box);
    });
    root.appendChild(cols);
    root.appendChild(noteEl('tell','\uD83D\uDC46',esc(t('tap_word_c'))));
    var tiles=el('div','tiles');
    shuffle(a.items,(a.seed||17)).forEach(function(it){
      var c=el('button','tok',picOf(it.pic)+' '+esc(it.x));
      c.dataset.a=it.c;c.dataset.w=it.x;c.dataset.idx=L.add();c.dataset.clean='1';
      DND.grab(c,'chip');

        if(DND.justDragged())return;
        if(c.disabled)return;
        if(active===c){c.classList.remove('act');active=null;arm(false);return}

    });
  }
};

/* ---- typed retrieval: the learner produces the word, no bank ---- */
/* forgiving about typing, strict about the word: case, spacing, curly quotes,
   sentence punctuation and hyphen-or-space normalise away — nothing else does,
   so a genuinely wrong word is still wrong */
function nrm(s){return String(s).toLowerCase()
  .replace(/[‘’ʼ´`]/g,"'")
  .replace(/[“”«»"]/g,'')
  .replace(/[.,!?;:…£€₸$]/g,'')
  .replace(/[‐-―_-]+/g,' ')
  .replace(/\s+/g,' ').trim()}
R.type={
  render:function(a,root){

      var row=el('div','trow');

      inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
      inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');
      inp.setAttribute('aria-label',loc(it.q));
      if(it.ph)inp.placeholder=it.ph;
      var go=el('button','tgo','&rarr;');
      go.setAttribute('aria-label',t('check'));
      function judge(){
        if(!live)return;
        var v=nrm(inp.value);
        if(!v)return;

        var ok=false,k;

        if(ok){
          live=false;inp.value=it.a;inp.disabled=true;go.disabled=true;
          inp.classList.remove('no');inp.classList.add('ok');q.classList.add('solved');
          if(it.why)q.appendChild(noteEl(clean?'good':'tell','\uD83D\uDCA1',esc(it.why)));
          else if(!clean)q.appendChild(noteEl('good','✓',esc(t('gotit'))));
          L.hit(idx,clean);
        }else{
          clean=false;inp.classList.add('no');flash(q);L.slip();
          setTimeout(function(){inp.classList.remove('no')},560);
          try{inp.select()}catch(e){}
        }
      }
      go.onclick=judge;
      inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();judge()}};
      /* nothing is judged just because the learner clicked away: a half-typed
         word used to be marked wrong before it was finished */
      row.appendChild(inp);row.appendChild(go);q.appendChild(row);
      q._reveal=function(){

        q.appendChild(noteEl('tell','\uD83D\uDCD8',esc(t('answer_is'))+' <b>'+esc(it.a)+'</b>'));

/* ---- put the items in the order you hear / read them ---- */
R.seq={
  render:function(a,root){
    var ids=a.items.map(function(){return L.add()});
    var pos=0,clean=true,live=true,nodes=[];
    var host=el('div','seqbox');
    shuffle(a.items.map(function(_,k){return k}),a.seed||13).forEach(function(oi){
      var it=a.items[oi];
      var b=el('button','seqrow','<span class="sn" aria-hidden="true">&middot;</span>'+
        picOf(it.pic)+'<span class="sx">'+esc(it.s)+'</span>');
      b.onclick=function(){
        if(!live||b.disabled)return;
        if(oi===pos){
          b.classList.add('ok');b.disabled=true;
          b.querySelector('.sn').textContent=String(pos+1);
          L.hit(ids[pos],clean);
          pos++;clean=true;
          if(pos>=a.items.length)live=false;
        }else{
          clean=false;b.classList.add('no');flash(host);L.slip();
          setTimeout(function(){b.classList.remove('no')},460);
        }
      };
      nodes.push({b:b,i:oi});host.appendChild(b);
    });
    root.appendChild(host);
    root._reveal=function(){
      if(!live)return;live=false;
      nodes.forEach(function(o){
        o.b.disabled=true;
        if(!o.b.classList.contains('ok')){
          o.b.classList.remove('no');o.b.classList.add('rev');
          o.b.querySelector('.sn').textContent=String(o.i+1);
        }
      });
      for(var k=pos;k<ids.length;k++)L.hit(ids[k],false);
      pos=ids.length;
    };
  },
  showAll:function(a,root){if(root._reveal)root._reveal()}
};

/* ---- choose the right word inside a running text ---- */
R.drop={
  render:function(a,root){
    var box=el('div','dropbox'),sels=[];
    a.lines.forEach(function(ln,li){
      var p=el('p','dl');
      String(ln).split(/(\[[^\]]*\])/).forEach(function(part,pi){
        if(part.charAt(0)==='['){
          var opts=part.slice(1,-1).split('|');
          var idx=L.add(),clean=true,live=true;
          var sel=el('select','dsel');
          sel.setAttribute('aria-label',t('choose_l'));
          var o0=document.createElement('option');o0.value='';o0.textContent='\u2014';
          sel.appendChild(o0);
          shuffle(opts.map(function(_,k){return k}),(a.seed||9)+li*13+pi*7+part.length).forEach(function(oi){
            var op=document.createElement('option');op.value=String(oi);op.textContent=opts[oi];
            sel.appendChild(op);
          });
          sel.onchange=function(){
            if(!live||sel.value==='')return;
            if(+sel.value===0){
              live=false;sel.classList.add('ok');sel.disabled=true;L.hit(idx,clean);
            }else{
              clean=false;sel.classList.add('no');L.slip();flash(p);
              setTimeout(function(){sel.classList.remove('no');sel.value=''},460);
            }
          };
          sel._reveal=function(){
            if(!live)return;live=false;
            sel.value='0';sel.classList.remove('no');sel.classList.add('rev');sel.disabled=true;
            L.hit(idx,false);
          };
          sels.push(sel);p.appendChild(sel);
        }else if(part){p.appendChild(document.createTextNode(part))}
      });
      box.appendChild(p);
    });
    root.appendChild(box);root._sels=sels;
  },
  showAll:function(a,root){(root._sels||[]).forEach(function(s){if(s._reveal)s._reveal()})}
};

      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){

        mr.onstop=function(){
          au.src=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'}));au.style.display='block';
          rb.classList.remove('on');rb.innerHTML='\u23FA '+esc(t('again'));
          st.getTracks().forEach(function(x){x.stop()});
        };
        mr.start();rb.classList.add('on');rb.innerHTML='\u23F9 '+esc(t('stop'));
      })['catch'](function(){rb.textContent=t('no_mic')});
    };
    rec.appendChild(rb);rec.appendChild(au);root.appendChild(rec);

    again.classList.toggle('hide',L.free||(L.resolved===0&&L.wrong===0));

  function build(){
    stopAudio();

    L=newLedger();L.onchange=refresh;
    R[a.t].render(a,body);

  }
  build();
  actionBar(L.free?[go]:[tally,help,again,go]);

  setBar();window.scrollTo(0,0);
}

/* item-list tasks can be narrowed down to the missed items only */
var SUBSETTABLE={type:1,choose:1,tf:1,odd:1,label:1,respond:1,bank:1,match:1,order:1,fix:1};
function subsetAct(a,idxs){
  if(!SUBSETTABLE[a.t]||!a.items)return a;
  var out={},k;
  for(k in a)out[k]=a[k];
  out.items=idxs.filter(function(i){return a.items[i]}).map(function(i){return a.items[i]});
  if(out.bank)out.bank=out.items.map(function(x){return x.a});
  return out.items.length?out:a;
}
function renderReview(){
  stopAudio();S.view='review';closeSheet();
  var keys=missKeys();
  var app=$('app');app.innerHTML='';
  if(!keys.length){
    app.appendChild(el('div','rail','<div class="railmeta"><button class="back" id="rvback" aria-label="'+esc(t('back'))+'">←</button>'+

    app.appendChild(card);
    actionBar([btn('btn-next',t('home')+' →',renderHome,true)]);
    setBar();window.scrollTo(0,0);return;
  }
  var key=keys[0],parts=key.split('.'),n=+parts[0],i=+parts[1];
  var base=acts(n)[i],a=subsetAct(base,S.miss[key]);

  var head=el('div','rail');
  var seg=el('div','seg');
  var totalKeys=keys.length;
  for(var k=0;k<Math.min(totalKeys,14);k++)seg.appendChild(el('i',k===0?'cur':''));
  head.appendChild(seg);
  var meta=el('div','railmeta');
  var bb=el('button','back','←');bb.setAttribute('aria-label',t('back'));bb.onclick=renderHome;
  meta.appendChild(bb);
  meta.appendChild(el('div','t','<b>'+esc(t('reviewt'))+'</b><span>'+esc(WB[n].title)+' · '+esc(t('mistakes_n').replace('{n}',missCount()))+'</span>'));
  head.appendChild(meta);
  app.appendChild(head);

  var brief=el('div','brief');
  brief.innerHTML='<span class="tag s-rec"><span aria-hidden="true">⌾</span> '+esc(t('m_review'))+'</span>'+
    '<span class="tx">'+esc(ins(base))+'<em>'+esc(t('review_ins'))+'</em></span>';
  app.appendChild(brief);

  var card=el('div','card'),body=el('div','items');card.appendChild(body);app.appendChild(card);

  var tally=tallyEl();
  var help=btn('btn-ghost',t('showone'),function(){R[a.t].showAll(a,body);refresh()});
  var again=btn('btn-ghost','↺',function(){build()});
  again.setAttribute('aria-label',t('again_t'));again.title=t('again_t');
  var go=btn('btn-next',t('nx_screen')+' →',function(){
    if(L.missed.length===0)delete S.miss[key];
    else{
      /* keep only what is still wrong, mapped back to the original indices */
      var orig=S.miss[key],keep=[];
      L.missed.forEach(function(m){if(orig[m]!==undefined)keep.push(orig[m])});
      if(keep.length)S.miss[key]=keep;else delete S.miss[key];
    }
    save();renderReview();
  });
  go.style.flex='1';
  function refresh(){
    paintTally(tally,L);
    var ready=L.done();
    go.disabled=!ready;
    help.classList.toggle('hide',ready||L.free||L.wrong===0);
    again.classList.toggle('hide',L.free||(L.resolved===0&&L.wrong===0));
  }
  function build(){
    stopAudio();
    body.innerHTML='';
    L=newLedger();L.onchange=refresh;
    R[a.t].render(a,body);
    refresh();
  }
  build();
  actionBar(L.free?[go]:[tally,help,again,go]);
  refresh();
  setBar();window.scrollTo(0,0);
}

/* ============================================================
   BOOT
   ============================================================ */
function rerender(){
  if(S.view==='home')renderHome();
  else if(S.view==='act')renderAct();
  else if(S.view==='wrap')renderWrap();
  else if(S.view==='review')renderReview();
  else renderHome();
}
function setLang(l){
  S.lang=l;save();
  Array.prototype.forEach.call(document.querySelectorAll('#langs button'),function(b){b.classList.toggle('on',b.dataset.l===l)});
  closeSheet();rerender();
}
$('langs').onclick=function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(b&&b.dataset.l)setLang(b.dataset.l);
};
$('scrim').onclick=closeSheet;
$('barmiss').onclick=function(){if(missCount())renderReview()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

load();
Array.prototype.forEach.call(document.querySelectorAll('#langs button'),function(b){b.classList.toggle('on',b.dataset.l===S.lang)});
renderHome();

</script>
</body>
</html>
