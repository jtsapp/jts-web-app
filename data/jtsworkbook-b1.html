:root{
  /* ---- brand palette (Visual Guideline 2.1) ---- */
  --black:#000000; --violet:#874BF8; --cyan:#0AAFFF; --green:#00D441; --orange:#FF631E; --gold:#FFAD00;
  --violet-ink:#6633D6; --cyan-ink:#0470A6; --green-ink:#068A36; --orange-ink:#C64010; --gold-ink:#8A6100;
  --red:#E23D3D; --red-ink:#BE2020; --red-soft:#FFECEC;
  --ink:#000000; --ink-2:#4E4B4B; --ink-3:#898787; --ink-4:#B4B2BC;
  --hair:#E7E4F0; --hair-2:#CFCBDD;
  --paper:#FFFFFF; --page:#F1EFF7;
  --v-soft:#F2ECFF; --v-soft-2:#E5DAFF; --c-soft:#E8F5FE; --g-soft:#E1FAEA; --o-soft:#FFEEE7; --gold-soft:#FFF5DE;

  /* ---- radii: bubbles carry a tail corner, cards do not ---- */
  --r-xs:10px; --r-s:14px; --r-m:20px; --r-l:26px;
  --bub-you:20px 20px 6px 20px;      /* learner speaks */
  --bub-them:20px 20px 20px 6px;     /* someone else speaks */

  --sh-1:0 1px 2px rgba(16,10,40,.05);
  --sh-2:0 2px 4px rgba(16,10,40,.05),0 12px 28px rgba(16,10,40,.08);
  --sh-lift:0 10px 24px rgba(135,75,248,.20);

  --font:'PT Root UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;

  /* ---- type scale (one scale, used strictly) ---- */
  --t-display:33px; --t-title:22px; --t-lead:19px; --t-task:18px;
  --t-body:16.5px; --t-small:14px; --t-label:12px; --t-micro:11.5px;

  --bar-h:56px; --act-h:76px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--page);color:var(--ink);
  font-size:var(--t-body);line-height:1.45;font-weight:400;
  padding-bottom:calc(var(--act-h) + env(safe-area-inset-bottom) + 12px);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:left}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em;margin:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ============================================================
   BRAND MARKS
   The "o" of "to" is the brand symbol — a speech bubble.
   Any element that carries language the learner produces gets
   a bubble tail. Material the learner receives never does.
   ============================================================ */
.logo{font-weight:700;font-size:17px;letter-spacing:-.035em;line-height:1;white-space:nowrap;color:var(--ink)}
.logo i{font-style:normal;color:var(--violet)}
.tail{position:relative}
.tail::after{
  content:'';position:absolute;left:22px;bottom:-11px;width:26px;height:14px;background:inherit;
  border-radius:0 0 14px 0;clip-path:polygon(0 0,100% 0,0 100%);
}

/* ============================================================
   TOP BAR
   ============================================================ */
.bar{
  position:sticky;top:0;z-index:30;height:var(--bar-h);
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--hair);
}
.bar .wrap{display:flex;align-items:center;gap:10px;height:var(--bar-h)}
.bar .spacer{flex:1}
.chip-miss{
  display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;
  background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink);
  border-radius:999px;padding:5px 11px;white-space:nowrap;min-height:30px;
}
.chip-miss:hover{border-color:var(--violet)}

/* ============================================================
   HOME
   ============================================================ */
.hero{
  background:var(--violet);color:#fff;border-radius:var(--r-l);padding:26px 22px 24px;
  margin:18px 0 14px;position:relative;
}
.hero::before{content:'';position:absolute;right:-50px;top:-64px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .eyebrow{font-size:var(--t-micro);font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.78;position:relative}
.hero h1{font-size:var(--t-display);line-height:1.04;margin:8px 0 8px;position:relative}
.hero p{margin:0;font-size:var(--t-small);opacity:.88;max-width:40ch;position:relative}

.unit{margin-bottom:22px}
.unit-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;width:100%;padding:2px 0}
.unit-no{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--v-soft);color:var(--violet-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;
}
.unit-no::after{content:'';position:absolute;left:5px;bottom:-2px;width:10px;height:8px;background:var(--v-soft);border-radius:0 0 5px 0;clip-path:polygon(0 0,100% 0,0 100%)}
.unit-head .t{flex:1;min-width:0}
.unit-head .k{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.unit-head h2{font-size:17px;margin-top:1px;line-height:1.2}
.unit-head .caret{color:var(--ink-3);font-size:16px;transition:transform .18s}
.unit.open .unit-head .caret{transform:rotate(90deg)}

.rows{display:flex;flex-direction:column;gap:6px}
.lrow{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--hair);
  border-radius:var(--r-s);padding:11px 13px;box-shadow:var(--sh-1);width:100%;
  transition:border-color .14s,transform .14s;
}
.lrow:hover{border-color:var(--violet);transform:translateX(2px)}
.lrow .dial{
  width:30px;height:30px;flex:none;border-radius:50%;
  background:conic-gradient(var(--green) var(--p),var(--hair) 0);
  display:flex;align-items:center;justify-content:center;
}
.lrow .dial i{
  width:22px;height:22px;background:var(--paper);border-radius:50%;font-style:normal;font-size:var(--t-micro);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green-ink);
}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.lrow .t span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}
.lrow .go{color:var(--ink-4);font-size:15px}
.lrow.done{border-color:#BFEFD2;background:#FBFFFC}
.lrow.chal{background:var(--ink);border-color:var(--ink)}
.lrow.chal .t b{color:#fff}.lrow.chal .t span{color:var(--gold)}
.lrow.chal .dial i{background:var(--ink)}

/* ============================================================
   ACTIVITY SCREEN — rail is the map, no separate map screen
   ============================================================ */
.rail{padding:14px 0 4px}
.seg{display:flex;gap:3px;margin-bottom:9px}
.seg i{flex:1;height:4px;border-radius:999px;background:var(--hair);transition:background .3s}
.seg i.on{background:var(--green)}
.seg i.cur{background:var(--violet)}
.railmeta{display:flex;align-items:center;gap:10px;width:100%}
.railmeta .back{
  width:36px;height:36px;flex:none;border-radius:11px;background:var(--paper);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh-1);
}
.railmeta .back:hover{border-color:var(--violet)}
.railmeta .t{flex:1;min-width:0;text-align:left}
.railmeta .t b{display:block;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railmeta .t span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}
.railmeta .open{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--paper);
  border-radius:999px;padding:7px 12px;font-size:var(--t-label);font-weight:700;color:var(--ink-2);
  min-height:36px;box-shadow:var(--sh-1);white-space:nowrap;
}
.railmeta .open:hover{border-color:var(--violet);color:var(--violet-ink)}

/* instruction strip — deliberately quiet, the task is the loud layer */
.brief{display:flex;align-items:flex-start;gap:10px;margin:14px 0 10px;padding:0 2px}
.brief .tag{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--violet-ink);background:var(--v-soft);border-radius:999px;
  padding:5px 11px;flex:none;white-space:nowrap;
}
.brief .tag.s-in{color:var(--cyan-ink);background:var(--c-soft)}
.brief .tag.s-out{color:var(--orange-ink);background:var(--o-soft)}
.brief .tag.s-rec{color:var(--green-ink);background:var(--g-soft)}
.brief .tx{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.35;color:var(--ink-2);padding-top:3px}
.brief .tx em{display:block;font-style:normal;font-size:13px;color:var(--ink-3);margin-top:3px}

.card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-l);padding:18px 16px;box-shadow:var(--sh-2)}

/* ---- items ---- */
.items{display:flex;flex-direction:column}
.item{padding:16px 0;border-top:1px solid var(--hair)}
.item:first-child{border-top:0;padding-top:2px}
.item.solved{opacity:.62}
.item.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qline{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:var(--t-task);line-height:1.55;font-weight:500}
.qn{
  font-style:normal;font-weight:700;font-size:var(--t-micro);color:var(--ink-3);background:var(--page);
  border-radius:7px;padding:3px 7px;flex:none;align-self:flex-start;margin-top:4px;min-width:24px;text-align:center;
}
.pic{font-size:20px}
.ph{color:var(--ink-3);font-weight:400}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opt{
  border:1.5px solid var(--hair-2);background:var(--paper);border-radius:var(--bub-you);padding:10px 16px;
  font-size:var(--t-body);font-weight:500;min-height:46px;transition:border-color .12s,background .12s,color .12s;
}
.opt:hover{border-color:var(--violet);background:var(--v-soft)}
.opt.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.opt.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink);text-decoration:line-through}
.opt.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;font-weight:700}
.opt[disabled]{cursor:default}

/* the blank IS a bubble — "your answer is speech" */
.blank{
  display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:42px;
  border:0;border-bottom:2.5px solid var(--violet);background:var(--v-soft);
  border-radius:var(--bub-you);padding:5px 14px;font-weight:700;color:var(--violet-ink);
  font-size:var(--t-body);transition:background .14s,color .14s,border-color .14s;
}
.blank:empty::before{content:'\00a0\00a0\00a0';}
.blank:hover{background:var(--v-soft-2)}
.blank.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.blank.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.blank.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}
.blank.lock{pointer-events:none}

.bank{
  display:flex;flex-wrap:wrap;gap:8px;background:var(--v-soft);border:1px solid var(--v-soft-2);
  border-radius:var(--r-m);padding:12px;margin-bottom:16px;
}
.bank .hint{width:100%;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-ink);opacity:.72;margin-bottom:2px}
.tok{
  border:1.5px solid var(--v-soft-2);background:var(--paper);border-radius:var(--r-xs);padding:9px 14px;
  font-weight:500;font-size:var(--t-body);min-height:42px;transition:.12s;
}
.tok:hover{border-color:var(--violet)}
.tok.act{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700;box-shadow:var(--sh-lift)}
.tok.used{opacity:.22;pointer-events:none}
.tok.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.tok.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tok.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}

.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair)}
.mrow:first-of-type{border-top:0}
.mrow .side{flex:1;display:flex;gap:8px;align-items:center;font-size:var(--t-body);font-weight:500;min-width:0}
.mrow .blank{flex:none;width:47%}

.built{
  min-height:52px;border:2px dashed var(--hair-2);border-radius:var(--bub-you);padding:8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:11px 0 9px;background:var(--page);
}
.built.ok{border-style:solid;border-color:var(--green);background:var(--g-soft)}
.built.no{border-style:solid;border-color:var(--red);background:var(--red-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:7px}

.fixw{
  border:1.5px solid transparent;background:var(--page);border-radius:9px;padding:6px 11px;
  font-size:var(--t-body);font-weight:500;margin:0 3px 5px 0;min-height:38px;
}
.fixw:hover{border-color:var(--violet)}
/* Green = the learner responded correctly. The strike-through, not the colour,
   marks the word itself as the faulty one. */
.fixw.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);
  font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.fixw.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.fixw.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);
  border-style:dashed;text-decoration:line-through;text-decoration-thickness:2px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.col{border:1.5px dashed var(--hair-2);border-radius:var(--r-m);padding:11px;min-height:104px;background:var(--page)}
.col h4{margin:0 0 9px;font-size:var(--t-label);font-weight:700;color:var(--ink-2);text-align:center}
.col.armed{border-color:var(--violet);background:var(--v-soft)}
.drop{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

.gtable{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:16px;font-size:15px}
.gtable th{background:var(--ink);color:#fff;font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;padding:10px;text-align:left;font-weight:700}
.gtable th:first-child{border-radius:11px 0 0 0}.gtable th:last-child{border-radius:0 11px 0 0}
.gtable td{border-bottom:1px solid var(--hair);padding:9px 10px;vertical-align:middle}

/* ---- source material: flat card + cyan rule, never a bubble ---- */
.src{
  background:var(--c-soft);border:1px solid #CFEAFB;border-left:4px solid var(--cyan);
  border-radius:6px var(--r-m) var(--r-m) 6px;padding:15px 16px;margin-bottom:14px;
}
.src .k{font-weight:700;font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan-ink);margin-bottom:7px}
.src .body{font-size:17px;line-height:1.7}
.player{display:flex;align-items:center;gap:12px}
.play{
  width:46px;height:46px;flex:none;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.play:hover{transform:scale(1.04)}
.play.on{background:var(--violet)}
.pl{flex:1;min-width:0}
.pl b{display:block;font-size:14.5px;color:var(--cyan-ink)}
.pl span{font-size:var(--t-label);color:var(--ink-3)}
.slow{
  border:1.5px solid #CFEAFB;background:var(--paper);border-radius:999px;padding:7px 12px;
  font-size:var(--t-label);font-weight:700;color:var(--cyan-ink);min-height:36px;white-space:nowrap;
}
.slow.on{background:var(--cyan);border-color:var(--cyan);color:#fff}

.ghost{
  border:1.5px solid var(--hair-2);border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px;
  color:var(--ink-2);background:var(--paper);min-height:40px;display:inline-flex;align-items:center;gap:7px;
}
.ghost:hover{border-color:var(--violet);color:var(--violet-ink)}

/* ---- situation card (respond) ---- */
.sit{border:1.5px solid var(--o-soft);background:#FFFBF9;border-radius:var(--r-m);padding:14px 15px}
.sit .em{font-size:26px;line-height:1}
.sit .s{font-weight:700;font-size:var(--t-body);margin-top:6px;line-height:1.35}
.sit .ask{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-ink);margin-top:9px}

/* ---- chat: mirrors the brand's AI-tutor bubbles ---- */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.bub{max-width:88%;padding:11px 15px;font-size:var(--t-body);line-height:1.5;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bub.a{align-self:flex-start;background:var(--page);border:1px solid var(--hair);border-radius:var(--bub-them)}
.bub.b{align-self:flex-end;background:var(--violet);color:#fff;border-radius:var(--bub-you)}
.bub.b .blank{background:rgba(255,255,255,.22);border-color:#fff;color:#fff}
.bub.b .blank.ok{background:var(--green);border-color:#fff;color:#fff}
.bub.b .blank.no{background:var(--red);border-color:#fff;color:#fff}
.bub.b .blank.rev{background:var(--green);border-color:#fff;color:#fff}

/* ---- word pairs ---- */

/* ---- write & speak ---- */
/* --- typed retrieval --- */
.trow{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.tin{
  flex:1;min-width:150px;font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);
  background:var(--page);border:1.5px solid var(--hair-2);border-radius:var(--r-m);padding:12px 14px;min-height:48px}
.tin:focus{outline:0;border-color:var(--violet);background:#fff}
.tin.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.tin.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tin.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;font-weight:700}
.tin[disabled]{opacity:1}
.tgo{
  flex:none;width:48px;height:48px;border-radius:var(--r-m);background:var(--violet);color:#fff;
  font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--violet-ink)}
.tgo:active{transform:translateY(2px);box-shadow:none}
.tgo[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
/* --- put in order (numbered rows) --- */
.seqbox{display:flex;flex-direction:column;gap:8px}
.seqrow{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--page);border:1.5px solid var(--hair-2);border-radius:var(--r-m);padding:12px 14px;min-height:52px;transition:.14s}
.seqrow:hover{border-color:var(--violet)}
.seqrow .sn{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--hair);color:var(--ink-3);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seqrow .sx{flex:1;min-width:0;font-size:var(--t-body);font-weight:500}
.seqrow.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.seqrow.ok .sn{background:var(--green);color:#fff}
.seqrow.no{background:var(--red-soft);border-color:var(--red)}
.seqrow.rev{background:var(--g-soft);border-color:var(--green);border-style:dashed;color:var(--green-ink)}
.seqrow.rev .sn{background:var(--green);color:#fff}
.seqrow[disabled]{cursor:default}
/* --- choose inside a text --- */
.dropbox{background:var(--page);border:1px solid var(--hair);border-radius:var(--r-m);padding:15px 16px}
.dl{margin:0 0 11px;font-size:17px;line-height:2.15}
.dl:last-child{margin-bottom:0}
.dsel{
  font-family:inherit;font-size:16px;font-weight:700;color:var(--violet-ink);
  background:var(--v-soft);border:1.5px solid var(--v-soft-2);border-radius:9px;padding:5px 6px;margin:0 2px}
.dsel:focus{outline:0;border-color:var(--violet)}
.dsel.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.dsel.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.dsel.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}
.dsel[disabled]{opacity:1}
.src-s{font-weight:500;color:var(--ink-2)}
.cue{
  display:inline-flex;align-items:center;gap:7px;margin:9px 0 4px;padding:5px 12px;border-radius:999px;
  background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink);
  font-size:var(--t-label);font-weight:700}
.cue .ar{font-size:15px;line-height:1}
.testscore{
  background:var(--paper);border:1.5px solid var(--hair-2);border-radius:var(--r-l);
  padding:22px 20px;margin:18px 0;text-align:center}
.testscore.pass{background:var(--g-soft);border-color:var(--green)}
.testscore .k{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:6px}
.testscore .n{font-size:40px;font-weight:800;line-height:1.1;color:var(--ink)}
.testscore.pass .n{color:var(--green-ink)}
.testscore .v{margin-top:6px;font-size:var(--t-body);font-weight:600;color:var(--ink-2)}
.testscore.pass .v{color:var(--green-ink)}
.genre{
  display:inline-block;margin-bottom:10px;padding:4px 12px;border-radius:999px;
  background:var(--c-soft);border:1px solid var(--c-soft-2);color:var(--cyan-ink);
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.trtoggle{
  display:block;width:100%;margin-bottom:12px;padding:10px 14px;border-radius:999px;
  border:1.5px solid var(--hair-2);background:var(--paper);color:var(--ink-2);font-weight:700;font-size:14px}
.trtoggle.on{background:var(--v-soft);border-color:var(--violet);color:var(--violet-ink)}
.uselang{
  background:var(--o-soft);border:1px solid #F6D9C9;border-radius:var(--r-m);padding:13px 15px;margin-bottom:16px}
.uselang .k{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--orange-ink);margin-bottom:8px}
.uselang ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.uselang li{font-size:var(--t-body);font-weight:500;line-height:1.4}
.ta{
  width:100%;min-height:112px;border:1.5px solid var(--hair-2);border-radius:var(--bub-you);padding:13px 15px;
  resize:vertical;line-height:1.55;background:var(--page);font-weight:400;font-size:var(--t-body);
}
.ta:focus{outline:0;border-color:var(--violet);background:#fff}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.recbtn{
  background:var(--orange);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;min-height:46px;
  box-shadow:0 3px 0 var(--orange-ink);display:inline-flex;align-items:center;gap:7px;
}
.recbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-ink)}
.recbtn.on{background:var(--red-ink);box-shadow:0 3px 0 #8E1515}
.model{display:none;margin-top:11px;background:var(--gold-soft);border:1px solid #F0DCA9;border-radius:var(--bub-them);padding:12px 14px;font-size:15px}
.model.on{display:block}
.model b{display:block;font-size:var(--t-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px}

/* ---- inline note: replaces the floating toast ---- */
.note{
  margin-top:11px;border-radius:var(--bub-them);padding:11px 14px;font-size:14px;font-weight:500;line-height:1.45;
  display:flex;gap:9px;align-items:flex-start;
}
.note .ic{font-size:16px;line-height:1.2;flex:none}
.note.good{background:var(--g-soft);border:1px solid #BFEFD2;color:var(--green-ink)}
.note.warn{background:var(--gold-soft);border:1px solid #F0DCA9;color:var(--gold-ink)}
.note.tell{background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink)}
.corr{display:inline-block;margin-left:7px;font-weight:700;color:var(--green-ink);background:var(--g-soft);border-radius:8px;padding:2px 9px;font-size:15px}

/* ============================================================
   ACTION BAR — one fixed layer, nothing else floats
   ============================================================ */
.act{
  position:fixed;left:0;right:0;bottom:0;z-index:28;background:rgba(255,255,255,.96);
  backdrop-filter:blur(16px);border-top:1px solid var(--hair);
  padding:11px 0 calc(11px + env(safe-area-inset-bottom));
}
.act .wrap{display:flex;gap:9px;align-items:center}
.btn{border-radius:999px;padding:14px 22px;font-weight:700;font-size:15.5px;min-height:50px;transition:.12s;text-align:center;white-space:nowrap}
.btn-go{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-ink)}
.btn-next{background:var(--ink);color:#fff;box-shadow:0 3px 0 #3A3A3A}
.btn-go:active,.btn-next:active{transform:translateY(2px);box-shadow:none}
.btn-ghost{background:var(--paper);border:1.5px solid var(--hair-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--violet);color:var(--violet-ink)}

{t:'read',ins:'r_tf',title:'Why we spend',
 text:['Every November, in the run-up to the winter holidays, the shops fill with special offers. Items that were full price in October are suddenly half-price, and a queue forms outside the door before it opens. Most consumers believe that they are making a sensible purchase. They are not always right.',
       'Psychologists who study spending say that a bargain does something strange to us. When we see a deal, we stop asking whether we want the item and start asking how much we are saving. We prefer the feeling of winning to the object itself. That is why so many people admit, a week later, that they do not really understand why they bought it.',
       'There is also the question of what a low price hides. Cheap goods have to be transported a long way, which is harmful to the environment, and the workers who make them rarely have secure jobs. In some countries the sales themselves have become dangerous: shops have reported injuries in the crowd, and security staff now control the doors.',
       'This is where Buy Nothing Day comes in. The idea belongs to a Canadian movement that began more than twenty years ago and now exists in over sixty countries. It asks one simple thing: for twenty-four hours, buy nothing at all. Supporters do not think that a single day changes the world. They mean something smaller and more useful — that most of us have never tried to go a whole day without spending, and that trying it teaches us something about ourselves.',
       'Not everyone is convinced. Critics argue that guilt-free brands and money given to charity do more good than a day of doing nothing. But nobody who has actually tried it says that it proves nothing.'],

{t:'read',ins:'r_tf',title:'Faking it',

       'Ed was one of them. Before the programme he worked in a burger van. He had to be reliable and he had to turn up on time, and he had to be polite to customers, but he didn’t have to take much responsibility, because his boss dealt with the money. He didn’t need to get up early — the van opened at eleven — and he could take a day off more or less whenever he wanted to.',
       'Four weeks later he was working as a chef. Now he has to manage a team, which he finds difficult, and he must work to very tight deadlines. He isn’t allowed to leave until the last order is finished. On the other hand, he doesn’t have to stand outside in February, and he can take home food that would otherwise be thrown away.',
       'What the programme really measures is not skill. Four weeks is not long enough to learn a trade. It measures whether somebody can behave like a professional: whether they can set goals, think ahead, work under pressure and stay pleasant when a service goes wrong. The judges are not fooled by technique. They are fooled by confidence.',

 title:'Should schools teach cooking?',
 parts:['1 · the opinion','2 · first reason','3 · example','4 · second reason','5 · the other side, answered','6 · conclusion'],
 text:['I believe that every school should teach basic cooking.',
       'One reason is cost: a student who can cook three cheap meals will save money for the rest of their life, and will eat better while doing it.',
       'For example, my brother left home at eighteen without knowing how to boil an egg, and he spent most of his first year on overpriced food that made him feel terrible.',

{t:'read',ins:'r_tf',title:'A film that travels',
 text:['Every year a few films cross borders that nobody expected them to cross. A Brazilian animated film, released with almost no publicity, wins a prize in France. A Nigerian comedy showcases a city most of its audience will never visit, and then appears on screens in Manchester. Meanwhile some enormous productions, made to appeal to everybody, fail to travel at all.',
       'Distributors used to believe that plot was the thing that travelled, whatever the genre. If a story was simple enough, they argued, audiences anywhere would enjoy following it. That turned out to be only half true. Audiences do tend to prefer a clear plot, but plenty of complicated films have done extremely well abroad, and plenty of simple ones have failed.',
       'What seems to matter more is whether the film lets you recognize something. Stepping on the Flying Grass, set in a village school in Indonesia and based on an original script rather than a novel, is visually stunning and genuinely moving. It is about children who are asked to write about their dreams. One of them wants to help people. One fantasizes about becoming an actress and spends hours practising in front of the mirror. One hopes to eat, just once, in a proper restaurant in the city. You do not need to know anything about Indonesia to know those three children.',
       'The films that fail tend to be the ones that avoid saying anything specific, in case it does not translate. They end up with no particular character, no particular place, and nothing for the audience to hold on to.',
       'Directors who work internationally usually say the same thing: stop trying to be universal. Make something so exact that a stranger can see it.'],

{t:'read',ins:'r_tf',title:'The way we used to work',
 text:['My grandfather worked for the same railway for forty-one years. He started at sixteen, in a job his own father had found for him, and he retired from the office two floors above the one where he began. That was not unusual. In those days a working lifetime and an employer were more or less the same thing.',

 text:['Hello, everyone. My name is Stuart French, and I’m here to talk to you about something we all do about seventy times a day — make a decision.',
       'Obviously some are more straightforward than others. Most people don’t have much trouble deciding what to have for breakfast. Some decisions are trickier.',
       'So, in today’s talk I’m going to look at how understanding the decision-making process can help us decide better. First, I want to tell you about some factors that affect our decision-making. Then I’ll talk about the methods people use. And finally, I’ll give you some tips.',
       'The first thing I’d like to mention is the sheer number of decisions we make. Research suggests that making conscious decisions makes the brain tired. So if you have an important decision to make, it’s best to make it early in the day.',
       'Another major factor is how much information we have. Some information is obviously useful. However, if we have too much of it, we are more likely to choose wrongly.',
       'The third and last factor I want to mention is stress. People deciding under stress think more about the possible positive results and less about the negative ones.',
       'To sum up: fewer decisions, less information than you think you need, and not while you are under pressure. Don’t expect everybody to agree with your decisions. Thank you for listening. Are there any questions?'],

       'Psychologists who study the subject describe the same pattern. In one study, participants were asked how well they could explain a policy they supported. Most said very well. They were then asked to explain it in detail, step by step. Afterwards they were asked the same question again, and their confidence had dropped sharply. Nobody had argued with them. They had simply discovered how little they knew.',

 parts:['1 · the question, and what the essay will do','2 · the advantages','3 · the disadvantages','4 · the balance','5 · the conclusion'],
 text:['Several countries have now moved the start of the school day from eight to ten o’clock. This essay considers the main advantages and disadvantages of the change.',
       'On the one hand, there are two significant benefits. One major advantage is biological: teenagers genuinely fall asleep later than adults, and the research on this is not seriously disputed. Schools that have made the change report better attendance and fewer late arrivals. A second advantage is that the roads are quieter at ten, which makes the journey both faster and safer.',
       'On the other hand, the drawbacks are practical rather than scientific, which does not make them small. A significant drawback is childcare: most parents start work at eight or nine, so a later start leaves two hours in which younger children in the same family have nowhere to be. There is also the end of the day. If school finishes at five, evening sport, music lessons and part-time jobs all move into the dark, and in a northern winter that is not a minor detail.',
       'It is worth noting that the two sides are not equally easy to fix. The biological argument cannot be changed, whereas the childcare problem can be solved with a supervised room and a small budget.',
       'All things considered, the advantages outweigh the disadvantages, provided that the school is prepared to open its building at eight for the families who need it. Without that, the change simply moves a problem from the students to their parents.'],

/* ---------- build pass ----------
   Nothing is injected into a lesson: every lesson declares its own arc.
   The only pass is the one-step-per-screen split, which turns a combined
   write+speak task into two screens (workbook rule: one action per screen). */

    var W=WB[n];
    W.gr=GR[n]||null; W.rc=RC[n]||null; W.can=CAN[n]||null;
  }
  for(var m in WB){
    var split=[];
    WB[m].acts.forEach(function(a){
      if(a.t==='turn'){
        split.push({t:'write',ins:'write',sub:a.sub,use:a.use,write:a.write});

    WB[m].acts=split;
  }
})();

  function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%100003}return h}
  function jit(s,spread){return ((hash(s)%1000)/1000-0.5)*2*spread}

  /* ---- one line → turns (a dash in the script means the other speaker) ---- */
  function turns(text,who){
    var t=norm(text);
    var parts=t.replace(/([.!?])\s+[\u2014\u2013]\s+/g,'$1\u0001').split('\u0001');
    if(parts.length<2)return [{t:t,v:who||'A'}];
    var out=[],start=(who==='B')?1:0;
    for(var i=0;i<parts.length;i++){
      if(!parts[i])continue;
      out.push({t:parts[i].trim(),v:((i+start)%2)?'B':'A'});
    }
    return out.length?out:[{t:t,v:who||'A'}];
  }
  /* ---- sentence → thought groups, so the rhythm is not word-by-word ---- */
  function groups(sent){
    var s=sent.trim();
    if(s.split(' ').length<=8)return [s];
    var raw=s.replace(/([,;:])\s+/g,'$1\u0001').replace(/\s+[\u2014\u2013]\s+/g,' \u2014\u0001')
             .replace(/\s+(and|but|because|so|then|or|which|when|while)\s+/gi,'\u0001 $1 ')
             .split('\u0001'),out=[],buf='';
    if(raw.length<2)return [s];
    for(var i=0;i<raw.length;i++){
      var pc=raw[i].trim();if(!pc)continue;
      buf=buf?buf+' '+pc:pc;
      if(buf.split(' ').length>=3){out.push(buf.trim());buf=''}
    }
    if(buf)out.length?out[out.length-1]+=' '+buf.trim():out.push(buf.trim());
    for(var z=0;z<out.length;z++)out[z]=out[z].replace(/\s*[\u2014\u2013]\s*$/,'');
    return out.length?out:[s];
  }
  function sentences(t){
    var m=t.match(/[^.!?]+[.!?]*/g);
    return m?m.map(function(x){return x.trim()}).filter(Boolean):[t];
  }

  /* ---- is this multi-line script a two-person conversation? ---- */
  var OPEN=/^(yes|no|well|oh|ok|okay|but|actually|sure|right|exactly|really|hi|hello|thanks|sorry|maybe|of course|i know|absolutely|that'?s|what,)\b/i;
  function isTalk(lines){
    if(!lines||lines.length<4)return false;
    var q=[],op=0,i,s;
    for(i=0;i<lines.length;i++){
      if(typeof lines[i]!=='string')return false;     /* chat already carries its roles */
      s=norm(lines[i]);
      q.push(/\?["')]?$/.test(s));
      if(OPEN.test(s))op++;
    }
    var pairs=0;
    for(i=0;i<q.length-1;i++)if(q[i]&&!q[i+1])pairs++;
    return pairs>=2||(pairs>=1&&op/lines.length>=0.35);
  }

  /* ---- build the utterance plan for a whole activity ---- */
  function plan(lines){
    var q=[],prev=null,talk=isTalk(lines);
    for(var i=0;i<lines.length;i++){
      var raw=lines[i],who=talk?((i%2)?'B':'A'):'A',txt=raw;
      if(raw&&typeof raw==='object'){txt=raw.t!=null?raw.t:raw.s;who=raw.v||(raw.w?'B':'A')}
      var tn=turns(txt,who);
      for(var j=0;j<tn.length;j++){
        var ss=sentences(tn[j].t);
        for(var k=0;k<ss.length;k++){
          var single=(ss[k].split(' ').length<=2&&!/[.!?]$/.test(ss[k]));
          var gs=single?[ss[k]]:groups(ss[k]);
          for(var g=0;g<gs.length;g++){
            var last=(g===gs.length-1);
            q.push({t:gs[g],v:tn[j].v,end:last,q:/\?$/.test(ss[k]),ex:/!$/.test(ss[k]),
                    one:single,turn:(prev!==null&&prev!==tn[j].v)});
            prev=tn[j].v;
          }
        }
        /* pause length is decided when the chunk is spoken, below */
      }
      if(q.length)q[q.length-1].line=true;
    }
    return q;
  }
  function gap(c,next){
    var base;
    if(!c.end)base=110;                       /* inside a sentence: short breath */
    else if(next&&next.turn)base=430;         /* the other person answers */
    else if(c.line)base=520;                  /* next item / next line of the script */
    else base=280;                            /* next sentence, same speaker */
    base+=Math.abs(jit(c.t,55));
    return Math.round(slowOn?base*1.7:base);
  }

  function clearKeep(){if(keep){clearInterval(keep);keep=null}}
  function stop(){
    token++;clearKeep();
    try{var sy=SY();if(sy)sy.cancel()}catch(e){}
  }
  function play(lines,cb){
    var sy=SY();
    if(!sy||!lines||!lines.length){if(cb)cb();return}
    stop();
    var my=++token,q=plan(lines),i=0;
    voices(function(){
      if(my!==token)return;
      clearKeep();
      keep=setInterval(function(){try{if(sy.speaking&&!sy.paused)sy.resume()}catch(e){}},6000);
      var step=function(){
        if(my!==token)return;
        if(i>=q.length){clearKeep();if(cb)cb();return}
        var c=q[i++],guard=false;
        var u=new SpeechSynthesisUtterance(c.t);
        var vc=(c.v==='B'&&VB)?VB:VA;
        if(vc){u.voice=vc;u.lang=vc.lang||'en-GB'}else{u.lang='en-GB'}
        var rate=slowOn?0.78:0.99, pitch=1;
        if(c.one)rate=slowOn?0.72:0.92;                         /* single words: clear */
        if(c.v==='B'&&!VB){pitch-=0.20;rate-=0.02}              /* fake a second speaker */
        if(!c.end){pitch+=0.035}                                /* mid-sentence: keep it up */
        else if(c.q){pitch+=/^(are|is|am|do|does|did|can|have|has|will|would|could|shall|may)\b/i.test(c.t)?0.09:0.01;rate+=0.01}
        else if(c.ex){pitch+=0.07;rate+=0.03}
        rate+=jit(c.t,0.035);pitch+=jit(c.t+'p',0.04);          /* no two lines identical */
        u.rate=Math.max(0.5,Math.min(1.35,rate));
        u.pitch=Math.max(0.5,Math.min(1.6,pitch));
        u.volume=1;
        var go=function(){
          if(guard||my!==token)return;guard=true;
          setTimeout(step,gap(c,q[i]));
        };
        u.onend=go;u.onerror=go;
        var wd=Math.round(c.t.length*95/u.rate)+2600;           /* watchdog: never hang */
        setTimeout(function(){if(!guard&&my===token)go()},wd);
        try{sy.speak(u)}catch(e){go()}
      };
      setTimeout(step,90);            /* Chrome drops audio spoken straight after cancel */
    });
  }
  return {play:play,stop:stop};
})();

function stopAudio(){
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  VE.stop();
}
function speak(lines,cb){
  try{VE.play(lines,cb)}catch(e){if(cb)cb()}
}
function playTrack(track,lines,btn){
  stopAudio();
  if(btn){btn.innerHTML='⏸';btn.classList.add('on')}
  var done=function(){if(btn){btn.innerHTML='▶';btn.classList.remove('on')}};
  if(!track){speak(lines,done);return}
  var base=(typeof window!=='undefined'&&window.JTS_AUDIO_BASE)?window.JTS_AUDIO_BASE:'';
  var paths=[];
  if(base)paths.push(base+'Track_'+track+'.mp3');
  paths.push('audio/Track_'+track+'.mp3','Coursebook Audio/Track_'+track+'.mp3');
  var k=0;
  (function tryNext(){
    if(k>=paths.length){curAudio=null;speak(lines,done);return}
    var a=new Audio(paths[k++]);
    a.playbackRate=slowOn?0.75:1;a.onended=done;
    a.onerror=function(){curAudio=null;tryNext()};
    curAudio=a;
    var p=a.play();
    if(p&&p['catch'])p['catch'](function(){curAudio=null;tryNext()});
  })();
}

/* ============================================================
   LEDGER — the engine's model of one screen
   ============================================================ */
var L=null;
function newLedger(){
  return {
    total:0, first:0, resolved:0, wrong:0, missed:[], free:false,
    add:function(){this.total++;return this.total-1},
    slip:function(){this.wrong++;if(typeof this.onchange==='function')this.onchange()},
    hit:function(idx,ok){
      if(ok)this.first++; else if(this.missed.indexOf(idx)<0)this.missed.push(idx);
      this.resolved++;
      if(typeof this.onchange==='function')this.onchange();
    },
    done:function(){return this.free||this.resolved>=this.total},
    score:function(){return this.total?Math.round(this.first/this.total*100):100}
  };
}

function numericLadder(o){
  var v=o.map(function(x){return parseFloat(String(x).replace(/[^0-9.]/g,''))});
  if(v.some(isNaN))return false;
  for(var i=1;i<v.length;i++)if(v[i]<=v[i-1])return false;
  return true;
}
function optOrder(a,it,i){
  if(a.nosh||numericLadder(it.o))return it.o.map(function(_,k){return k});
  return shuffle(it.o.map(function(_,k){return k}),(a.seed||5)*31+i*17+it.o.length*7+String(it.q||it.s||'').length);
}

/* ---- word box + bubble blanks (bank / match / table / chat) ---- */
function makeBank(root,words,seed,label){
  var bank=el('div','bank'),active=null;
  bank.appendChild(el('div','hint',esc(label||t('wordbank'))));
  shuffle(words,seed||3).forEach(function(w){
    var c=el('button','tok',esc(w));c.dataset.w=w;
    c.onclick=function(){
      if(c.classList.contains('used'))return;
      if(active===c){c.classList.remove('act');active=null;return}
      if(active)active.classList.remove('act');
      active=c;c.classList.add('act');
    };
    bank.appendChild(c);
  });
  bank.take=function(c){var a=c||active;if(a){a.classList.add('used');a.classList.remove('act')}
    if(active===a)active=null;return a};
  bank.peek=function(){return active};
  /* release the selection outright — a word must never stay armed after its
     highlight has been removed, or the next gap silently receives it */
  bank.clear=function(){if(active)active.classList.remove('act');active=null};
  bank.burn=function(){Array.prototype.forEach.call(bank.querySelectorAll('.tok'),function(c){c.classList.add('used')})};
  return bank;
}
function liveBlank(ans,bank,host){
  var s=el('button','blank','');s.dataset.a=ans;
  s.setAttribute('aria-label',t('gap'));
  var idx=L.add(),clean=true,live=true;
  s.onclick=function(){
    if(!live)return;
    var c=bank.peek();if(!c)return;
    var w=c.dataset.w;
    if(w===ans){
      bank.take(c);live=false;
      s.textContent=w;s.setAttribute('aria-label',w);s.classList.add('ok','lock');
      L.hit(idx,clean);
    }else{
      clean=false;
      s.textContent=w;s.classList.add('no');
      bank.clear();
      flash(host||s);L.slip();
      setTimeout(function(){if(live){s.textContent='';s.classList.remove('no')}},620);
    }
  };
  s._reveal=function(){
    if(!live)return;live=false;
    s.textContent=ans;s.setAttribute('aria-label',ans);
    s.classList.remove('no');s.classList.add('rev','lock');
    L.hit(idx,false);
  };
  return s;
}
function blanksShowAll(root){
  Array.prototype.forEach.call(root.querySelectorAll('.blank'),function(s){if(s._reveal)s._reveal()});
  if(root._bank)root._bank.burn();
}

/* ---- typed retrieval: the learner produces the word, no bank ---- */
function nrm(s){return String(s).toLowerCase()
  .replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
  .replace(/[.,!?;:\u2026\u00a3\u20ac\u20b8$]/g,'').replace(/\s+/g,' ').trim()}
/* ---- marking a typed answer ----------------------------------------------
   A learner who writes "I have not seen him" has produced exactly the English
   the key stores as "I haven't seen him", and a learner taught British
   spelling writes "realise". The key holds one form; the marker accepts every
   form that is the same answer. Both the key and the input are expanded into
   the full set of their contracted / uncontracted and -ise / -ize spellings,
   and the two sets are compared. Nothing here turns a wrong answer into a
   right one — it only stops a right answer being marked wrong.
   -------------------------------------------------------------------------- */
/* Unambiguous contractions: one contracted form, one expansion. */
var CONTRACTIONS=[
  ["won't",["will not"]], ["shan't",["shall not"]], ["can't",["cannot","can not"]],
  ["cannot",["can't","can not"]], ["let's",["let us"]],
  ["'ve",[" have"]], ["'ll",[" will"]], ["'re",[" are"]], ["'m",[" am"]]
];
/* Ambiguous ones. "he's" is "he is" OR "he has" and "I'd" is "I would" OR
   "I had", and only the next word tells them apart. Expanding both readings
   blindly means "he is got a car" matches the key "he's got a car" — a real
   grammar error marked correct. So the reading is chosen from what follows:
   a past participle takes has/had, anything else takes is/would. */
var PARTICIPLE=/^(been|got|gotten|gone|done|had|seen|made|taken|come|become|written|spoken|given|known|found|left|put|read|said|told|thought|brought|bought|caught|taught|felt|kept|met|paid|sent|built|heard|held|lost|meant|run|sat|slept|spent|stood|understood|won|worn|broken|chosen|driven|eaten|fallen|forgotten|risen|shown|stolen|begun|drunk|sung|swum|flown|grown|thrown|blown|hidden|ridden|beaten|bitten|frozen|lain|laid|led|sold|shut|set|cost|cut|hit|let|quit|spread|\w+ed)$/;
function expandAmbiguous(cur){
  var out=[];
  [["'s"," has"," is"],["'d"," had"," would"]].forEach(function(r){
    var mark=r[0],withPart=r[1],otherwise=r[2];
    if(cur.indexOf(mark)<0)return;
    /* n't is handled separately; don't touch "doesn't" via "'s" */
    var re=new RegExp("(\\w)"+mark+"(\\s+)(\\S+)","g");
    var hit=false;
    var v=cur.replace(re,function(m,pre,sp,next){
      hit=true;
      return pre+(PARTICIPLE.test(next)?withPart:otherwise)+sp+next;
    });
    if(hit)out.push(v);
    /* a trailing contraction with nothing after it stays as it is */
  });
  return out;
}
/* n't, but without manufacturing "ca not" / "wo not" */
function expandNt(cur){
  if(cur.indexOf("n't")<0)return [];
  var v=cur.replace(/(\w+)n't\b/g,function(m,stem){
    if(stem==='ca')return 'cannot';
    if(stem==='wo')return 'will not';
    if(stem==='sha')return 'shall not';
    return stem+' not';
  });
  return v===cur?[]:[v];
}
function expandForms(s){
  var seen={}, queue=[s], out=[], guard=0;
  while(queue.length && guard++<160){
    var cur=queue.shift();
    if(seen['#'+cur])continue;
    seen['#'+cur]=1; out.push(cur);
    for(var i=0;i<CONTRACTIONS.length;i++){
      var from=CONTRACTIONS[i][0], reps=CONTRACTIONS[i][1];
      if(cur.indexOf(from)<0)continue;
      for(var j=0;j<reps.length;j++)queue.push(cur.split(from).join(reps[j]));
    }
    expandNt(cur).forEach(function(v){queue.push(v)});
    expandAmbiguous(cur).forEach(function(v){queue.push(v)});
  }
  return out;
}
function ansKeys(s){
  var set={};
  expandForms(nrm(s)).forEach(function(v){
    var k=v.replace(/\s+/g,' ').trim()
           /* -ise and -ize are the same word in both Cambridge and Oxford */
           .replace(/is(e|es|ed|ing|ation|ations)\b/g,'iz$1')
           .replace(/\bpractic(e|es|ed|ing)\b/g,'practis$1')
           .replace(/\bbehaviour\b/g,'behavior')
           .replace(/\bneighbour/g,'neighbor')
           .replace(/\bfavour/g,'favor')
           .replace(/\bcolour/g,'color');
    set['#'+k]=1;
  });
  return set;
}
function answerMatches(input,keys){
  var got=ansKeys(input);
  for(var i=0;i<keys.length;i++){
    var want=ansKeys(keys[i]);
    for(var g in got)if(want[g])return true;
  }

}

    app.appendChild(box);
  });

  actionBar([btn('btn-go',(started?t('m_continue'):t('m_start'))+' →',function(){openAct(nx,firstOpen(nx))},true)]);
  setBar();window.scrollTo(0,0);
}

/* ---------- ACTIVITY SCREEN ---------- */
function openAct(n,i){S.n=n;S.i=i||0;renderAct()}

function railFor(n,i,total,onBack){
  var wrapEl=el('div','rail');
  var seg=el('div','seg');
  for(var k=0;k<total;k++){
    seg.appendChild(el('i',(S.prog[pkey(n,k)]?'on':'')+(k===i?' cur':'')));
  }
  wrapEl.appendChild(seg);
  var meta=el('div','railmeta');
  var b=el('button','back','←');b.setAttribute('aria-label',t('back'));b.onclick=onBack;
  meta.appendChild(b);
  var W=WB[n];
  meta.appendChild(el('div','t','<b>'+esc(W.title)+'</b><span>'+esc(t('step'))+' '+(i+1)+' '+esc(t('of'))+' '+total+'</span>'));
  var o=el('button','open','☰ <span>'+esc(t('lesson_menu'))+'</span>');
  o.onclick=function(){openLessonSheet(n)};
  meta.appendChild(o);
  wrapEl.appendChild(meta);
  return wrapEl;
}

function briefFor(a){
  var fam=FAM[a.t]||'';
  var b=el('div','brief');
  b.innerHTML='<span class="tag '+fam+'"><span aria-hidden="true">'+(ICON[a.t]||'✳️')+'</span> '+esc(t('k_'+a.t)||'')+'</span>'+
    '<span class="tx">'+esc(ins(a))+(sub(a)?'<em>'+esc(sub(a))+'</em>':'')+'</span>';
  return b;
}

function tallyEl(){
  var e=el('div','tally');
  e.setAttribute('aria-live','polite');
  return e;
}
function paintTally(node,lg){
  if(lg.free){node.innerHTML='<span>'+esc(loc(INS.nocheck))+'</span>';return}
  var h='';
  var show=Math.min(lg.total,12);
  for(var k=0;k<show;k++){
    var cls='dot';
    if(k<lg.resolved)cls+=lg.missed.indexOf(k)>-1?' bad':' on';
    h+='<span class="'+cls+'"></span>';
  }
  h+='<span>'+lg.resolved+' / '+lg.total+'</span>';
  node.innerHTML=h;
}

function renderAct(){
  stopAudio();S.view='act';closeSheet();
  var n=S.n,A=acts(n),a=A[S.i];
  var app=$('app');app.innerHTML='';
  app.appendChild(railFor(n,S.i,A.length,renderHome));
  app.appendChild(briefFor(a));
  /* guide B3: the functional phrases for this stage, visible while it is done */
  if(a.use&&a.use.length){
    var ul=el('div','uselang');
    ul.innerHTML='<div class="k">'+esc(t('uselang'))+'</div><ul>'+
      a.use.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>';
    app.appendChild(ul);
  }

  var card=el('div','card');
  var body=el('div','items');card.appendChild(body);
  app.appendChild(card);

  L=newLedger();
  R[a.t].render(a,body);

  /* guide B1: speaking-first — every stage carries a spoken beat */
  if(a.say){
    var sb=noteEl('warn','🗣️',esc(a.say===true?t('sayit'):a.say));
    sb.style.marginTop='14px';
    card.appendChild(sb);
  }

  var tally=tallyEl();
  var help=btn('btn-ghost',t('showone'),function(){R[a.t].showAll(a,body);refresh()});
  var go=btn('btn-next',(S.i<A.length-1?t('nx_screen'):t('nx_finish'))+' →',function(){
    award(n,S.i,L.missed,L.total);
    if(S.i<A.length-1){S.i++;renderAct()}else renderWrap();
  },false);
  go.style.flex='1';

  function refresh(){
    paintTally(tally,L);
    var ready=L.done();
    go.disabled=!ready;
    help.classList.toggle('hide',ready||L.free||L.wrong===0);
    if(ready&&!L.free){
      tally.innerHTML='<b style="color:var(--green-ink)">'+L.first+' / '+L.total+' '+esc(t('right_first'))+'</b>';
    }
  }
  L.onchange=refresh;
  actionBar(L.free?[go]:[tally,help,go]);
  refresh();
  setBar();window.scrollTo(0,0);
}

/* A lesson screen is either done or not: no score, no points. A review-test
   screen also records how many items were right, because the test needs a
   mark out of 30 (guide B13). */
function award(n,i,missed,total){
  var k=pkey(n,i);
  S.prog[k]=(WB[n]&&WB[n].test)?{d:1,c:Math.max(0,(total||0)-((missed||[]).length))}:1;
  if(missed&&missed.length)S.miss[k]=missed.slice();
  else delete S.miss[k];
  save();setBar();
}

/* ---------- LESSON SHEET (steps · words · help) ---------- */
function openLessonSheet(n){
  var W=WB[n],A=acts(n),u=unitOf(n);
  var sh=$('sheet');sh.innerHTML='';
  sh.appendChild(el('div','grip'));
  sh.appendChild(el('div','hd','<h3>'+esc(W.title)+'</h3><div class="sub">'+esc(t('unit'))+' '+u.n+' · '+esc(loc(W.fn))+'</div>'));
  var tabs=el('div','tabs');
  var pane=el('div','pane');
  var names=[['steps',t('steps_t')],['words',t('words_t')],['help',t('help_t')]];
  function paint(which){
    Array.prototype.forEach.call(tabs.children,function(b){b.classList.toggle('on',b.dataset.k===which)});
    pane.innerHTML='';
    if(which==='steps'){
      var last=null,box=null;
      A.forEach(function(a,i){
        var st=stageOf(a);
        if(st!==last){
          last=st;box=el('div','stage');
          box.appendChild(el('h4',null,'<span aria-hidden="true">'+STAGE_ICON[st]+'</span>'+esc(t('st_'+st))));
          pane.appendChild(box);
        }
        var p=S.prog[pkey(n,i)];
        var b=el('button','step'+(p?' ok':'')+(i===S.i?' cur':''));
        b.innerHTML='<span class="dot">'+(p?'✓':(i+1))+'</span>'+
          '<span class="lbl"><b>'+esc(ins(a))+'</b><span>'+esc(t('k_'+a.t))+'</span></span>';
        b.onclick=function(){closeSheet();openAct(n,i)};
        box.appendChild(b);
      });
    }else if(which==='words'){
      /* guide B2: the English word first; the translation is opt-in */
      var tg=el('button','trtoggle'+(S.tr?' on':''),esc(t('showtr')));
      tg.setAttribute('aria-pressed',String(S.tr));
      tg.onclick=function(){S.tr=!S.tr;save();paint('words')};
      pane.appendChild(tg);
      W.voc.forEach(function(v){
        var r=el('div','vrow');
        r.innerHTML='<div class="vp" aria-hidden="true">'+(v[3]||'🔤')+'</div><div class="vw"><b>'+esc(v[0])+'</b>'+
          (S.tr?'<span>'+esc(v[1]+' · '+v[2])+'</span>':'')+'</div>';
        var sp=el('button','spk','🔊');sp.setAttribute('aria-label','Play '+v[0]);
        sp.onclick=function(){stopAudio();speak([v[0]])};
        r.appendChild(sp);pane.appendChild(r);
      });
    }else{
      pane.appendChild(el('div','note tell','<span class="ic" aria-hidden="true">💬</span><span>'+esc(t('uselang_s'))+'</span>'));
      (W.useful||[]).forEach(function(p){
        var r=el('div','vrow');
        r.innerHTML='<div class="vp" aria-hidden="true">💬</div><div class="vw"><b>'+esc(p)+'</b></div>';
        var sp=el('button','spk','🔊');sp.setAttribute('aria-label','Play');
        sp.onclick=function(){stopAudio();speak([p])};
        r.appendChild(sp);pane.appendChild(r);
      });
      if(W.tip)pane.appendChild(el('div','note warn','<span class="ic" aria-hidden="true">📘</span><span>'+esc(loc(W.tip))+'</span>'));
    }
  }
  names.forEach(function(x){
    var b=el('button',null,esc(x[1]));b.dataset.k=x[0];
    b.onclick=function(){paint(x[0])};
    tabs.appendChild(b);
  });
  sh.appendChild(tabs);sh.appendChild(pane);
  paint('steps');
  sh.classList.add('on');$('scrim').classList.add('on');
}
function closeSheet(){
  var sh=$('sheet');if(sh)sh.classList.remove('on');
  var sc=$('scrim');if(sc)sc.classList.remove('on');
}

/* ---------- WRAP ---------- */
function selfCheckItems(n){
  var W=WB[n];
  var out=[loc(W.can)||loc(W.fn)];
  if(W.gr)out.push(t('sc_use')+' '+W.gr+'.');
  if(W.rc)out.push(t('sc_rec')+' '+W.rc+'.');
  out.push(t('sc_words').replace('{n}',W.voc.length));
  return out;
}
/* guide B13: a review test ends on a results screen with a score, the 21/30
   pass mark, and a Try again that resets it. */
function renderTestResult(){
  stopAudio();S.view='wrap';closeSheet();
  var n=S.n,A=acts(n),W=WB[n],app=$('app'),got=0;
  A.forEach(function(a,k){var p=S.prog[pkey(n,k)];if(p&&p.c)got+=p.c});
  var pass=got>=21;
  app.innerHTML='';
  app.appendChild(el('div','kick',esc(t('test_kick'))));
  app.appendChild(el('h2','wrapt',esc(W.title)));
  var sc=el('div','testscore'+(pass?' pass':''));
  sc.innerHTML='<div class="k">'+esc(t('test_score'))+'</div><div class="n">'+got+' / 30</div>'+
    '<div class="v">'+esc(pass?t('test_pass'):t('test_fail'))+'</div>';
  app.appendChild(sc);
  if(W.can)app.appendChild(el('div','note tell','<span class="ic" aria-hidden="true">\u2705</span><span>'+esc(loc(W.can))+'</span>'));
  var again=el('button','btn primary',esc(t('test_again')));
  again.onclick=function(){
    A.forEach(function(a,k){delete S.prog[pkey(n,k)];delete S.miss[pkey(n,k)]});
    save();openAct(n,0);
  };
  app.appendChild(again);
  var home=el('button','btn ghost',esc(t('back')));
  home.onclick=function(){S.view='home';save();renderHome()};
  app.appendChild(home);
  actionBar([btn('btn-next',t('home')+' →',renderHome,true)]);
  setBar();window.scrollTo(0,0);
}
function renderWrap(){
  if(S.n>100)return renderTestResult();
  stopAudio();S.view='wrap';closeSheet();
  var n=S.n,A=acts(n),W=WB[n],app=$('app');app.innerHTML='';
  app.appendChild(railFor(n,A.length-1,A.length,renderHome));
  var card=el('div','card');
  card.appendChild(el('div','done-hero',
    '<div class="big" aria-hidden="true">✓</div><h2>'+esc(t('wrapt'))+'</h2>'+
    '<p>'+esc(W.title)+'</p>'));

  var lessonMiss=0;
  A.forEach(function(a,k){var m=S.miss[pkey(n,k)];if(m)lessonMiss+=m.length});
  if(lessonMiss){
    var nb=noteEl('warn','⌾',esc(t('mistakes_n').replace('{n}',lessonMiss))+' — '+esc(t('m_review_s')));
    nb.style.marginTop='16px';
    card.appendChild(nb);
  }

  var sc=el('div','sect');
  sc.appendChild(el('h3',null,esc(t('sc_title'))));
  selfCheckItems(n).forEach(function(txt,k){
    var key=n+'.sc'+k;
    var row=el('button','scrow'+(S.sc[key]?' on':''));
    row.innerHTML='<span class="box" aria-hidden="true">✓</span><span>'+esc(txt)+'</span>';
    row.setAttribute('aria-pressed',String(!!S.sc[key]));
    row.onclick=function(){S.sc[key]=!S.sc[key];row.classList.toggle('on',!!S.sc[key]);row.setAttribute('aria-pressed',String(!!S.sc[key]));save()};
    sc.appendChild(row);
  });
  card.appendChild(sc);

  var rec=el('div','sect recap');
  rec.appendChild(el('h3',null,esc(t('steps_t'))));
  A.forEach(function(a,k){
    var p=S.prog[pkey(n,k)],m=S.miss[pkey(n,k)];
    var row=el('button','r');
    row.innerHTML='<span>'+(k+1)+'. '+esc(ins(a))+'</span><b'+(m&&m.length?' class="miss"':'')+'>'+
      (p?'✓':'—')+'</b>';
    row.onclick=function(){openAct(n,k)};
    rec.appendChild(row);
  });
  card.appendChild(rec);app.appendChild(card);

  var Ls=lessonList(),idx=Ls.indexOf(n);
  var b1=btn('btn-ghost','☰',renderHome);
  b1.setAttribute('aria-label',t('home'));
  var b2=btn('btn-next',(idx<Ls.length-1?t('nextlesson'):t('home'))+' →',function(){
    if(idx<Ls.length-1){var m=Ls[idx+1];openAct(m,firstOpen(m))}else renderHome();
  },true);
  actionBar([b1,b2]);
  setBar();window.scrollTo(0,0);
}

/* ============================================================
   FIX YOUR MISTAKES — the items you got wrong come back
   ============================================================ */
var SUBSETTABLE={type:1,wform:1,choose:1,tf:1,odd:1,respond:1,bank:1,match:1,fix:1,trans:1,ttrans:1};
function subsetAct(a,idxs){
  if(!SUBSETTABLE[a.t]||!a.items)return a;
  var out={},k;
  for(k in a)out[k]=a[k];
  var keep=idxs.filter(function(i){return a.items[i]});
  out.items=keep.map(function(i){return a.items[i]});
  if(out.bank)out.bank=out.items.map(function(x){return x.a});
  if(!out.items.length)return a;
  /* ledger position -> position in the original activity */
  out._map=keep;
  return out;
}
function renderReview(){
  stopAudio();S.view='review';closeSheet();
  var keys=missKeys();
  var app=$('app');app.innerHTML='';
  if(!keys.length){
    app.appendChild(el('div','rail','<div class="railmeta"><button class="back" id="rvback" aria-label="'+esc(t('back'))+'">←</button>'+
      '<div class="t"><b>'+esc(t('reviewt'))+'</b><span>'+esc(t('review_done'))+'</span></div></div>'));
    $('rvback').onclick=renderHome;
    var card0=el('div','card');
    card0.appendChild(el('div','empty','<div class="big" aria-hidden="true">✓</div><b>'+esc(t('review_done'))+'</b><p>'+esc(t('review_done_s'))+'</p>'));
    app.appendChild(card0);
    actionBar([btn('btn-next',t('home')+' →',renderHome,true)]);
    setBar();window.scrollTo(0,0);return;
  }
  var key=keys[0],parts=key.split('.'),n=+parts[0],i=+parts[1];
  var base=acts(n)[i],a=subsetAct(base,S.miss[key]);

  var head=el('div','rail');
  var seg=el('div','seg');
  for(var k=0;k<Math.min(keys.length,14);k++)seg.appendChild(el('i',k===0?'cur':''));
  head.appendChild(seg);
  var meta=el('div','railmeta');
  var bb=el('button','back','←');bb.setAttribute('aria-label',t('back'));bb.onclick=renderHome;
  meta.appendChild(bb);
  meta.appendChild(el('div','t','<b>'+esc(t('reviewt'))+'</b><span>'+esc(WB[n].title)+' · '+esc(t('mistakes_n').replace('{n}',missCount()))+'</span>'));
  head.appendChild(meta);
  app.appendChild(head);

  var brief=el('div','brief');
  brief.innerHTML='<span class="tag s-rec"><span aria-hidden="true">⌾</span> '+esc(t('m_review'))+'</span>'+
    '<span class="tx">'+esc(ins(base))+'<em>'+esc(t('review_ins'))+'</em></span>';
  app.appendChild(brief);

  var card=el('div','card'),body=el('div','items');card.appendChild(body);app.appendChild(card);
  L=newLedger();
  R[a.t].render(a,body);

  var tally=tallyEl();
  var help=btn('btn-ghost',t('showone'),function(){R[a.t].showAll(a,body);refresh()});
  var go=btn('btn-next',t('nx_screen')+' →',function(){
    if(L.missed.length===0)delete S.miss[key];
    else{
      /* Keep only what is still wrong, mapped back to the original indices.
         When the task was replayed whole rather than trimmed to the missed
         items, the ledger index already IS the original index. */
      var map=a._map,keep=[];
      L.missed.forEach(function(m){
        var o=map?map[m]:m;
        if(o!==undefined&&keep.indexOf(o)<0)keep.push(o);
      });
      if(keep.length)S.miss[key]=keep;else delete S.miss[key];
    }
    save();renderReview();
  });
  go.style.flex='1';
  function refresh(){
    paintTally(tally,L);
    var ready=L.done();
    go.disabled=!ready;
    help.classList.toggle('hide',ready||L.free||L.wrong===0);
  }
  L.onchange=refresh;
  actionBar(L.free?[go]:[tally,help,go]);
  refresh();
  setBar();window.scrollTo(0,0);
}

/* ============================================================
   BOOT
   ============================================================ */
$('scrim').onclick=closeSheet;
$('barmiss').onclick=function(){if(missCount())renderReview()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

load();
renderHome();

</script>
