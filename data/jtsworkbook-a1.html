:root{
  /* ---- brand palette (Visual Guideline 2.1) ---- */
  --black:#000000; --violet:#874BF8; --cyan:#0AAFFF; --green:#00D441; --orange:#FF631E; --gold:#FFAD00;
  --violet-ink:#6633D6; --cyan-ink:#0470A6; --green-ink:#068A36; --orange-ink:#C64010; --gold-ink:#8A6100;
  --red:#E23D3D; --red-ink:#BE2020; --red-soft:#FFECEC;
  --ink:#000000; --ink-2:#4E4B4B; --ink-3:#898787; --ink-4:#B4B2BC;
  --hair:#E7E4F0; --hair-2:#CFCBDD;
  --paper:#FFFFFF; --page:#F1EFF7;
  --v-soft:#F2ECFF; --v-soft-2:#E5DAFF; --c-soft:#E8F5FE; --g-soft:#E1FAEA; --o-soft:#FFEEE7; --gold-soft:#FFF5DE;

  /* ---- radii: bubbles carry a tail corner, cards do not ---- */
  --r-xs:10px; --r-s:14px; --r-m:20px; --r-l:26px;
  --bub-you:20px 20px 6px 20px;      /* learner speaks */
  --bub-them:20px 20px 20px 6px;     /* someone else speaks */

  --sh-1:0 1px 2px rgba(16,10,40,.05);
  --sh-2:0 2px 4px rgba(16,10,40,.05),0 12px 28px rgba(16,10,40,.08);
  --sh-lift:0 10px 24px rgba(135,75,248,.20);

  --font:'PT Root UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;

  /* ---- type scale (one scale, used strictly) ---- */
  --t-display:33px; --t-title:22px; --t-lead:19px; --t-task:18px;
  --t-body:16.5px; --t-small:14px; --t-label:12px; --t-micro:11.5px;

  --bar-h:56px; --act-h:76px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--page);color:var(--ink);
  font-size:var(--t-body);line-height:1.45;font-weight:400;
  padding-bottom:calc(var(--act-h) + env(safe-area-inset-bottom) + 12px);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:left}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em;margin:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ============================================================
   BRAND MARKS
   The "o" of "to" is the brand symbol — a speech bubble.
   Any element that carries language the learner produces gets
   a bubble tail. Material the learner receives never does.
   ============================================================ */
.logo{font-weight:700;font-size:17px;letter-spacing:-.035em;line-height:1;white-space:nowrap;color:var(--ink)}
.logo i{font-style:normal;color:var(--violet)}
.tail{position:relative}
.tail::after{
  content:'';position:absolute;left:22px;bottom:-11px;width:26px;height:14px;background:inherit;
  border-radius:0 0 14px 0;clip-path:polygon(0 0,100% 0,0 100%);
}

/* ============================================================
   TOP BAR
   ============================================================ */
.bar{
  position:sticky;top:0;z-index:30;height:var(--bar-h);
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--hair);
}
.bar .wrap{display:flex;align-items:center;gap:10px;height:var(--bar-h)}
.bar .spacer{flex:1}
.chip-miss{
  display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;
  background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink);
  border-radius:999px;padding:5px 11px;white-space:nowrap;min-height:30px;
}
.chip-miss:hover{border-color:var(--violet)}

/* ============================================================
   HOME
   ============================================================ */
.hero{
  background:var(--violet);color:#fff;border-radius:var(--r-l);padding:26px 22px 24px;
  margin:18px 0 14px;position:relative;
}
.hero::before{content:'';position:absolute;right:-50px;top:-64px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .eyebrow{font-size:var(--t-micro);font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.78;position:relative}
.hero h1{font-size:var(--t-display);line-height:1.04;margin:8px 0 8px;position:relative}
.hero p{margin:0;font-size:var(--t-small);opacity:.88;max-width:40ch;position:relative}

.unit{margin-bottom:22px}
.unit-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;width:100%;padding:2px 0}
.unit-no{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--v-soft);color:var(--violet-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;
}
.unit-no::after{content:'';position:absolute;left:5px;bottom:-2px;width:10px;height:8px;background:var(--v-soft);border-radius:0 0 5px 0;clip-path:polygon(0 0,100% 0,0 100%)}
.unit-head .t{flex:1;min-width:0}
.unit-head .k{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.unit-head h2{font-size:17px;margin-top:1px;line-height:1.2}
.unit-head .caret{color:var(--ink-3);font-size:16px;transition:transform .18s}
.unit.open .unit-head .caret{transform:rotate(90deg)}

.rows{display:flex;flex-direction:column;gap:6px}
.lrow{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--hair);
  border-radius:var(--r-s);padding:11px 13px;box-shadow:var(--sh-1);width:100%;
  transition:border-color .14s,transform .14s;
}
.lrow:hover{border-color:var(--violet);transform:translateX(2px)}
.lrow .dial{
  width:30px;height:30px;flex:none;border-radius:50%;
  background:conic-gradient(var(--green) var(--p),var(--hair) 0);
  display:flex;align-items:center;justify-content:center;
}
.lrow .dial i{
  width:22px;height:22px;background:var(--paper);border-radius:50%;font-style:normal;font-size:var(--t-micro);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green-ink);
}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.lrow .t span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}
.lrow .go{color:var(--ink-4);font-size:15px}
.lrow.done{border-color:#BFEFD2;background:#FBFFFC}
.lrow.chal{background:var(--ink);border-color:var(--ink)}
.lrow.chal .t b{color:#fff}.lrow.chal .t span{color:var(--gold)}
.lrow.chal .dial i{background:var(--ink)}

/* ============================================================
   ACTIVITY SCREEN — rail is the map, no separate map screen
   ============================================================ */
.rail{padding:14px 0 4px}
.seg{display:flex;gap:3px;margin-bottom:9px}
.seg i{flex:1;height:4px;border-radius:999px;background:var(--hair);transition:background .3s}
.seg i.on{background:var(--green)}
.seg i.cur{background:var(--violet)}
.railmeta{display:flex;align-items:center;gap:10px;width:100%}
.railmeta .back{
  width:36px;height:36px;flex:none;border-radius:11px;background:var(--paper);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh-1);
}
.railmeta .back:hover{border-color:var(--violet)}
.railmeta .t{flex:1;min-width:0;text-align:left}
.railmeta .t b{display:block;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railmeta .t span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}
.railmeta .open{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--paper);
  border-radius:999px;padding:7px 12px;font-size:var(--t-label);font-weight:700;color:var(--ink-2);
  min-height:36px;box-shadow:var(--sh-1);white-space:nowrap;
}
.railmeta .open:hover{border-color:var(--violet);color:var(--violet-ink)}

/* instruction strip — deliberately quiet, the task is the loud layer */
.brief{display:flex;align-items:flex-start;gap:10px;margin:14px 0 10px;padding:0 2px}
.brief .tag{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--violet-ink);background:var(--v-soft);border-radius:999px;
  padding:5px 11px;flex:none;white-space:nowrap;
}
.brief .tag.s-in{color:var(--cyan-ink);background:var(--c-soft)}
.brief .tag.s-out{color:var(--orange-ink);background:var(--o-soft)}
.brief .tag.s-rec{color:var(--green-ink);background:var(--g-soft)}
.brief .tx{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.35;color:var(--ink-2);padding-top:3px}
.brief .tx em{display:block;font-style:normal;font-size:13px;color:var(--ink-3);margin-top:3px}

.card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-l);padding:18px 16px;box-shadow:var(--sh-2)}

/* ---- items ---- */
.items{display:flex;flex-direction:column}
.item{padding:16px 0;border-top:1px solid var(--hair)}
.item:first-child{border-top:0;padding-top:2px}
.item.solved{opacity:.62}
.item.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qline{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:var(--t-task);line-height:1.55;font-weight:500}
.qn{
  font-style:normal;font-weight:700;font-size:var(--t-micro);color:var(--ink-3);background:var(--page);
  border-radius:7px;padding:3px 7px;flex:none;align-self:flex-start;margin-top:4px;min-width:24px;text-align:center;
}
.pic{font-size:20px}
.ph{color:var(--ink-3);font-weight:400}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opt{
  border:1.5px solid var(--hair-2);background:var(--paper);border-radius:var(--bub-you);padding:10px 16px;
  font-size:var(--t-body);font-weight:500;min-height:46px;transition:border-color .12s,background .12s,color .12s;
}
.opt:hover{border-color:var(--violet);background:var(--v-soft)}
.opt.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.opt.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink);text-decoration:line-through}
.opt.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;font-weight:700}
.opt[disabled]{cursor:default}

/* the blank IS a bubble — "your answer is speech" */
.blank{
  display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:42px;
  border:0;border-bottom:2.5px solid var(--violet);background:var(--v-soft);
  border-radius:var(--bub-you);padding:5px 14px;font-weight:700;color:var(--violet-ink);
  font-size:var(--t-body);transition:background .14s,color .14s,border-color .14s;
}
.blank:empty::before{content:'\00a0\00a0\00a0';}
.blank:hover{background:var(--v-soft-2)}
.blank.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.blank.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.blank.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}
.blank.lock{pointer-events:none}

.bank{
  display:flex;flex-wrap:wrap;gap:8px;background:var(--v-soft);border:1px solid var(--v-soft-2);
  border-radius:var(--r-m);padding:12px;margin-bottom:16px;
}
.bank .hint{width:100%;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-ink);opacity:.72;margin-bottom:2px}
.tok{
  border:1.5px solid var(--v-soft-2);background:var(--paper);border-radius:var(--r-xs);padding:9px 14px;
  font-weight:500;font-size:var(--t-body);min-height:42px;transition:.12s;
}
.tok:hover{border-color:var(--violet)}
.tok.act{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700;box-shadow:var(--sh-lift)}
/* a word that has been placed stays legible — it has moved, it has not vanished */
.tok.used{opacity:.5;pointer-events:none;background:var(--page);color:var(--ink-3);
  border-style:dashed;border-color:var(--hair-2);text-decoration:line-through}
.tok.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.tok.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tok.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}

/* ---- drag and drop: the word you lift stays where you can see it ---- */
.drg{touch-action:none;cursor:grab}
.drg:active{cursor:grabbing}
/* the original keeps its place and stays readable while its copy travels */
.drg.lifted{opacity:.42;border-style:dashed;box-shadow:none}
.dnd-ghost{
  position:fixed;z-index:9000;pointer-events:none;margin:0;
  background:var(--violet);border:1.5px solid var(--violet);color:#fff;font-weight:700;
  border-radius:var(--r-xs);padding:9px 14px;font-size:var(--t-body);min-height:42px;
  display:inline-flex;align-items:center;box-shadow:var(--sh-lift);
  transform:translate(-50%,-50%) scale(1.05);white-space:nowrap;
}
.dnd-ghost.back{transition:left .18s ease,top .18s ease,opacity .18s ease;opacity:.35}
/* every place the word may legally land is outlined the moment a drag begins */
.dnd-open{outline:2px dashed var(--violet);outline-offset:2px}
.dnd-over{outline:2px solid var(--violet);outline-offset:2px;background:var(--v-soft-2)!important}
.col.dnd-over{border-color:var(--violet);background:var(--v-soft)!important}
body.dnd-on{user-select:none;-webkit-user-select:none}

.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair)}
.mrow:first-of-type{border-top:0}
.mrow .side{flex:1;display:flex;gap:8px;align-items:center;font-size:var(--t-body);font-weight:500;min-width:0}
.mrow .blank{flex:none;width:47%}

.built{
  min-height:52px;border:2px dashed var(--hair-2);border-radius:var(--bub-you);padding:8px;
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:11px 0 9px;background:var(--page);
}
.built.ok{border-style:solid;border-color:var(--green);background:var(--g-soft)}
.built.no{border-style:solid;border-color:var(--red);background:var(--red-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:7px;min-height:46px;align-content:flex-start}

.fixw{
  border:1.5px solid transparent;background:var(--page);border-radius:9px;padding:6px 11px;
  font-size:var(--t-body);font-weight:500;margin:0 3px 5px 0;min-height:38px;
}
.fixw:hover{border-color:var(--violet)}
/* green = the learner responded correctly. The strike-through, not the colour,
   marks the word itself as the faulty one. */
.fixw.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);
  font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.fixw.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.fixw.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);
  border-style:dashed;text-decoration:line-through;text-decoration-thickness:2px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.col{border:1.5px dashed var(--hair-2);border-radius:var(--r-m);padding:11px;min-height:104px;background:var(--page)}
.col h4{margin:0 0 9px;font-size:var(--t-label);font-weight:700;color:var(--ink-2);text-align:center}
.col.armed{border-color:var(--violet);background:var(--v-soft)}
.drop{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

.gtable{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:16px;font-size:15px}
.gtable th{background:var(--ink);color:#fff;font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;padding:10px;text-align:left;font-weight:700}
.gtable th:first-child{border-radius:11px 0 0 0}.gtable th:last-child{border-radius:0 11px 0 0}
.gtable td{border-bottom:1px solid var(--hair);padding:9px 10px;vertical-align:middle}

/* ---- source material: flat card + cyan rule, never a bubble ---- */
.src{
  background:var(--c-soft);border:1px solid #CFEAFB;border-left:4px solid var(--cyan);
  border-radius:6px var(--r-m) var(--r-m) 6px;padding:15px 16px;margin-bottom:14px;
}
.src .k{font-weight:700;font-size:var(--t-micro);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan-ink);margin-bottom:7px}
.src .body{font-size:17px;line-height:1.7}
.player{display:flex;align-items:center;gap:12px}
.play{
  width:46px;height:46px;flex:none;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.play:hover{transform:scale(1.04)}
.play.on{background:var(--violet)}
.pl{flex:1;min-width:0}
.pl b{display:block;font-size:14.5px;color:var(--cyan-ink)}
.pl span{font-size:var(--t-label);color:var(--ink-3)}
.slow{
  border:1.5px solid #CFEAFB;background:var(--paper);border-radius:999px;padding:7px 12px;
  font-size:var(--t-label);font-weight:700;color:var(--cyan-ink);min-height:36px;white-space:nowrap;
}
.slow.on{background:var(--cyan);border-color:var(--cyan);color:#fff}

.ghost{
  border:1.5px solid var(--hair-2);border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px;
  color:var(--ink-2);background:var(--paper);min-height:40px;display:inline-flex;align-items:center;gap:7px;
}
.ghost:hover{border-color:var(--violet);color:var(--violet-ink)}

/* ---- situation card (respond) ---- */
.sit{border:1.5px solid var(--o-soft);background:#FFFBF9;border-radius:var(--r-m);padding:14px 15px}
.sit .em{font-size:26px;line-height:1}
.sit .s{font-weight:700;font-size:var(--t-body);margin-top:6px;line-height:1.35}
.sit .ask{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-ink);margin-top:9px}

/* ---- chat: mirrors the brand's AI-tutor bubbles ---- */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.bub{max-width:88%;padding:11px 15px;font-size:var(--t-body);line-height:1.5;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bub.a{align-self:flex-start;background:var(--page);border:1px solid var(--hair);border-radius:var(--bub-them)}
.bub.b{align-self:flex-end;background:var(--violet);color:#fff;border-radius:var(--bub-you)}
.bub.b .blank{background:rgba(255,255,255,.22);border-color:#fff;color:#fff}
.bub.b .blank.ok{background:var(--green);border-color:#fff;color:#fff}
.bub.b .blank.no{background:var(--red);border-color:#fff;color:#fff}
.bub.b .blank.rev{background:var(--green);border-color:#fff;color:#fff}

/* ---- word pairs ---- */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{
  min-height:82px;border-radius:var(--r-s);border:1.5px solid var(--hair-2);background:var(--paper);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:7px 5px;font-weight:500;
  font-size:13px;line-height:1.22;overflow:hidden;word-break:break-word;transition:.16s;
}
.mcard .face{display:none}
.mcard.up{background:var(--v-soft);border-color:var(--violet)}
.mcard.up .face{display:block}.mcard.up .back{display:none}
.mcard .back{font-size:19px;opacity:.35}
.mcard.got{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);pointer-events:none}
.mcard.rev{background:var(--gold-soft);border-color:var(--gold);pointer-events:none}
.memo-st{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:12px}

/* ---- write & speak ---- */
/* --- typed retrieval --- */
.trow{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.tin{
  flex:1;min-width:150px;font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);
  background:var(--page);border:1.5px solid var(--hair-2);border-radius:var(--r-m);padding:12px 14px;min-height:48px}
.tin:focus{outline:0;border-color:var(--violet);background:#fff}
.tin.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.tin.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.tin.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed;font-weight:700}
.tin[disabled]{opacity:1}
.tgo{
  flex:none;width:48px;height:48px;border-radius:var(--r-m);background:var(--violet);color:#fff;
  font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--violet-ink)}
.tgo:active{transform:translateY(2px);box-shadow:none}
.tgo[disabled]{opacity:.35;pointer-events:none;box-shadow:none}
/* --- put in order (numbered rows) --- */
.seqbox{display:flex;flex-direction:column;gap:8px}
.seqrow{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--page);border:1.5px solid var(--hair-2);border-radius:var(--r-m);padding:12px 14px;min-height:52px;transition:.14s}
.seqrow:hover{border-color:var(--violet)}
.seqrow .sn{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--hair);color:var(--ink-3);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seqrow .sx{flex:1;min-width:0;font-size:var(--t-body);font-weight:500}
.seqrow.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.seqrow.ok .sn{background:var(--green);color:#fff}
.seqrow.no{background:var(--red-soft);border-color:var(--red)}
.seqrow.rev{background:var(--g-soft);border-color:var(--green);border-style:dashed;color:var(--green-ink)}
.seqrow.rev .sn{background:var(--green);color:#fff}
.seqrow[disabled]{cursor:default}
/* --- choose inside a text --- */
.dropbox{background:var(--page);border:1px solid var(--hair);border-radius:var(--r-m);padding:15px 16px}
.dl{margin:0 0 11px;font-size:17px;line-height:2.15}
.dl:last-child{margin-bottom:0}
.dsel{
  font-family:inherit;font-size:16px;font-weight:700;color:var(--violet-ink);
  background:var(--v-soft);border:1.5px solid var(--v-soft-2);border-radius:9px;padding:5px 6px;margin:0 2px}
.dsel:focus{outline:0;border-color:var(--violet)}
.dsel.ok{background:var(--g-soft);border-color:var(--green);color:var(--green-ink)}
.dsel.no{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.dsel.rev{background:var(--g-soft);border-color:var(--green);color:var(--green-ink);border-style:dashed}
.dsel[disabled]{opacity:1}
.src-s{font-weight:500;color:var(--ink-2)}
.cue{
  display:inline-flex;align-items:center;gap:7px;margin:9px 0 4px;padding:5px 12px;border-radius:999px;
  background:var(--v-soft);border:1px solid var(--v-soft-2);color:var(--violet-ink);
  font-size:var(--t-label);font-weight:700}
.cue .ar{font-size:15px;line-height:1}
.trtoggle{
  display:block;width:100%;margin-bottom:12px;padding:10px 14px;border-radius:999px;
  border:1.5px solid var(--hair-2);background:var(--paper);color:var(--ink-2);font-weight:700;font-size:14px}
.trtoggle.on{background:var(--v-soft);border-color:var(--violet);color:var(--violet-ink)}
.uselang{
  background:var(--o-soft);border:1px solid #F6D9C9;border-radius:var(--r-m);padding:13px 15px;margin-bottom:16px}
.uselang .k{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--orange-ink);margin-bottom:8px}
.uselang ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.uselang li{font-size:var(--t-body);font-weight:500;line-height:1.4}
.ta{
  width:100%;min-height:112px;border:1.5px solid var(--hair-2);border-radius:var(--bub-you);padding:13px 15px;
  resize:vertical;line-height:1.55;background:var(--page);font-weight:400;font-size:var(--t-body);
}
.ta:focus{outline:0;border-color:var(--violet);background:#fff}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.recbtn{
  background:var(--orange);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;min-height:46px;
  box-shadow:0 3px 0 var(--orange-ink);display:inline-flex;align-items:center;gap:7px;
}
.recbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-ink)}
.recbtn.on{background:var(--red-ink);box-shadow:0 3px 0 #8E1515}
.model{display:none;margin-top:11px;background:var(--gold-soft);border:1px solid #F0DCA9;border-radius:var(--bub-them);padding:12px 14px;font-size:15px}
.model.on{display:block}
.model b{display:block;font-size:var(--t-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px}

/* ---- inline note: replaces the floating toast ---- */
.note{
  margin-top:11px;border-radius:var(--bub-them);padding:11px 14px;font-size:14px;font-weight:500;line-height:1.45;
  display:flex;gap:9px;align-items:flex-start;
}
.note .ic{font-size:16px;line-height:1.2;flex:none}
.note.good{background:var(--g-soft);border:1px solid #BFEFD2;color:var(--green-ink)}
.note.warn{background:var(--gold-soft);border:1px solid #F0DCA9;color:var(--gold-ink)}

   ============================================================ */
.act{

  backdrop-filter:blur(16px);border-top:1px solid var(--hair);
  padding:11px 0 calc(11px + env(safe-area-inset-bottom));
}
.act .wrap{display:flex;gap:9px;align-items:center}
.btn{border-radius:999px;padding:14px 22px;font-weight:700;font-size:15.5px;min-height:50px;transition:.12s;text-align:center;white-space:nowrap}
.btn-go{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-ink)}
.btn-next{background:var(--ink);color:#fff;box-shadow:0 3px 0 #3A3A3A}
.btn-go:active,.btn-next:active{transform:translateY(2px);box-shadow:none}
.btn-ghost{background:var(--paper);border:1.5px solid var(--hair-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--violet);color:var(--violet-ink)}
.btn[disabled]{opacity:.42;pointer-events:none}
.tally{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);
  padding-left:4px;
}
.tally .dot{width:9px;height:9px;border-radius:50%;background:var(--hair-2);flex:none}
.tally .dot.on{background:var(--green)}
.tally .dot.bad{background:var(--red)}

   ============================================================ */

.sect{margin-top:22px}
.sect h3{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.scrow{

  padding:12px 13px;margin-bottom:8px;width:100%;background:var(--paper);

/* ============================================================

   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(10,6,26,.5);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:26px 26px 0 0;
  padding:8px 0 calc(18px + env(safe-area-inset-bottom));max-height:86vh;display:flex;flex-direction:column;

}
.sheet.on{transform:none}
.grip{width:38px;height:4px;border-radius:99px;background:var(--hair-2);margin:6px auto 12px;flex:none}
.sheet .hd{padding:0 18px 12px;flex:none}

.sheet .hd .sub{color:var(--ink-3);font-size:13px;font-weight:500}

.tabs button{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 6px;border-radius:999px;color:var(--ink-3);min-height:38px}

.stage h4{font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px;margin:16px 0 8px}
.stage:first-child h4{margin-top:0}
.step{

}
.step:hover{border-color:var(--violet)}
.step .dot{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--hair-2);display:flex;align-items:center;justify-content:center;font-size:var(--t-label);font-weight:700;color:var(--ink-3)}
.step.ok .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.cur{border-color:var(--violet);box-shadow:0 0 0 3px var(--v-soft)}
.step.cur .dot{border-color:var(--violet);color:var(--violet-ink)}
.step .lbl{flex:1;min-width:0}
.step .lbl b{display:block;font-size:14.5px;font-weight:500;line-height:1.3}
.step .lbl span{font-size:var(--t-label);color:var(--ink-3);font-weight:500}

.vrow{display:flex;align-items:center;gap:11px;border:1px solid var(--hair);border-radius:var(--r-s);padding:10px 12px;margin-bottom:7px}
.vp{font-size:20px;flex:none}

.vw span{font-size:13px;color:var(--ink-3);font-weight:500}
.spk{width:38px;height:38px;flex:none;border-radius:11px;background:var(--v-soft);color:var(--violet-ink);font-size:14px;display:flex;align-items:center;justify-content:center}
.spk:hover{background:var(--v-soft-2)}

.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}

.empty p{margin:0 auto;max-width:34ch;font-size:14.5px;font-weight:500;line-height:1.45}

/* ---------- build pass ----------
   At Elementary nothing is injected into a lesson: every lesson declares its own
   arc. The only pass that still runs is the one-step-per-screen split, which turns
   a combined write+speak task into two screens. ---------- */
(function(){
  for(var n in WB){
    var W=WB[n];
    W.gr=GR[n]||null;
    W.can=CAN[n]||null;
    W.tip=TIP[n]||null;

    var split=[];
    WB[m].acts.forEach(function(a){
      if(a.t==='turn'){
        split.push({t:'write',ins:'write',sub:a.sub,write:a.write});
        split.push({t:'speak',ins:'speak',speak:a.speak});
      }else split.push(a);
    });
    WB[m].acts=split;
  }
})();

/* ------------------------------------------------------------------
   VOICE POOL
   The old engine called getVoices() synchronously and took the first
   en-GB hit. On Chrome/Edge that list is empty on first paint, so the
   OS fallback (eSpeak / "compact") spoke every line — the robot.
   We now wait for the list, score it, and keep two distinct speakers.
------------------------------------------------------------------- */
var VX={ready:false,list:[],A:null,B:null,solo:false,waiting:[]};

var VX_BAD=/espeak|e-speak|pico|compact|eloquence|novelty|android tts|zarvox|trinoids|bahh|bells|boing|bubbles|cellos|deranged|hysterical|jester|organ|superstar|whisper|wobble|albert|fred|junior|ralph|kathy|princess|bad news|good news|grandma|grandpa|rocko|shelley|sandy|flo|eddy|reed|bruce|agnes|vicki|victoria/i;
var VX_GOOD=/natural|neural|premium|enhanced|online|siri|wavenet|studio|multilingual|journey|polyglot/i;
var VX_F=/sonia|libby|aria|jenny|hazel|susan|kate|serena|samantha|fiona|karen|moira|tessa|ava|allison|joanna|emma|zira|clara|natasha|maisie|olivia|nova|amelia|abbi|bella|luna|female|\bwoman\b|\bf\b/i;
var VX_M=/ryan|thomas|daniel|george|\bguy\b|oliver|william|james|arthur|alex|\btom\b|david|mark|brandon|liam|christopher|eric|roger|steffan|noah|ethan|male|\bman\b|\bm\b/i;

function vxScore(v){
  var n=(v.name||'')+' '+(v.voiceURI||''),l=(v.lang||'').replace('_','-'),s=0;
  if(VX_BAD.test(n))return -1000;
  if(!/^en/i.test(l))return -1000;
  if(/^en-GB/i.test(l))s+=45; else if(/^en-(IE|AU|NZ)/i.test(l))s+=26; else s+=16;
  if(VX_GOOD.test(n))s+=34;
  if(v.localService===false)s+=20;
  if(/google/i.test(n))s+=14;
  if(/microsoft/i.test(n)&&/natural|online/i.test(n))s+=10;
  if(v['default'])s+=2;
  return s;
}
function vxPick(){
  var sy=window.speechSynthesis,raw=[];
  try{raw=sy.getVoices()||[]}catch(e){raw=[]}
  if(!raw.length)return false;
  var pool=[];
  for(var i=0;i<raw.length;i++){var sc=vxScore(raw[i]);if(sc>-500)pool.push({v:raw[i],s:sc})}
  if(!pool.length){ /* nothing English and usable — keep engine default */
    VX.list=raw;VX.A=null;VX.B=null;VX.solo=true;VX.ready=true;return true}
  pool.sort(function(a,b){return b.s-a.s});
  var fem=null,mal=null,k;
  for(k=0;k<pool.length;k++){if(!fem&&VX_F.test(pool[k].v.name))fem=pool[k].v}
  for(k=0;k<pool.length;k++){if(!mal&&VX_M.test(pool[k].v.name)&&pool[k].v!==fem)mal=pool[k].v}
  VX.A=fem||pool[0].v;
  VX.B=mal||null;
  if(!VX.B){for(k=0;k<pool.length;k++){if(pool[k].v!==VX.A){VX.B=pool[k].v;break}}}
  /* one usable voice only: keep two speakers apart by pitch instead */
  VX.solo=!VX.B||VX.B===VX.A;
  if(VX.solo)VX.B=VX.A;
  VX.list=pool;VX.ready=true;
  return true;
}
function vxReady(cb){
  if(VX.ready){cb();return}
  if(vxPick()){cb();return}
  VX.waiting.push(cb);
  if(VX.waiting.length>1)return;
  var sy=window.speechSynthesis,tries=0;
  var flush=function(){
    var w=VX.waiting;VX.waiting=[];
    for(var i=0;i<w.length;i++){try{w[i]()}catch(e){}}
  };
  try{sy.addEventListener('voiceschanged',function h(){
    sy.removeEventListener('voiceschanged',h);if(vxPick())flush()
  })}catch(e){}
  (function poll(){
    if(VX.ready)return;
    if(vxPick()){flush();return}
    if(++tries>24){VX.ready=true;VX.solo=true;flush();return} /* ~2.4s, then let the engine default speak */
    setTimeout(poll,100);
  })();
}

/* ------------------------------------------------------------------
   SCRIPT → SPEAKABLE
   The written script never changes. These are pronunciation fixes only:
   curly apostrophes broke contractions on several engines, and years
   were read as "one thousand nine hundred eighty-eight".
------------------------------------------------------------------- */
var TEEN=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n99(n){
  if(n<20)return TEEN[n];
  var t=TENS[Math.floor(n/10)],o=n%10;
  return o?t+'-'+TEEN[o]:t;
}
function sayYear(y){
  var n=parseInt(y,10);
  if(n<1000||n>2099)return y;
  var hi=Math.floor(n/100),lo=n%100;
  if(n>=2000&&n<2010)return lo?'two thousand and '+n99(lo):'two thousand';
  if(lo===0)return n99(hi)+' hundred';
  if(lo<10)return n99(hi)+' oh '+n99(lo);
  return n99(hi)+' '+n99(lo);
}
function sayDecade(y){
  var n=parseInt(y,10);
  if(n<1000||n>2099)return y+'s';
  if(n>=2000)return n%100===0?'two thousands':sayYear(y)+'s';
  var hi=Math.floor(n/100),lo=n%100;
  if(lo===0)return n99(hi)+' hundreds';
  var t=n99(lo);
  return n99(hi)+' '+(/y$/.test(t)?t.replace(/y$/,'ies'):t+'s');
}
function sayable(s){
  s=String(s==null?'':s);
  s=s.replace(/[\u2018\u2019\u201B]/g,"'").replace(/[\u201C\u201D]/g,'');
  s=s.replace(/\[([^\]|]+)(\|[^\]]*)?\]/g,'$1');      /* [was|were|am] → was */
  s=s.replace(/_{2,}/g,' , ');                         /* unfilled gaps → a beat, not "underscore" */
  s=s.replace(/[\u2026]/g,' , ');
  s=s.replace(/\s*[\u2014\u2013]\s*/g,'\u0001');       /* turn break, not a comma */
  s=s.replace(/\s*\/\s*/g,'\u0002');                 /* "great / terrible" — a beat, never a spoken slash */
  s=s.replace(/\b(1[0-9]\d{2}|20\d{2})s\b/g,function(m,y){return sayDecade(y)});
  s=s.replace(/\b(1[0-9]\d{2}|20\d{2})\b/g,function(m){return sayYear(m)});
  s=s.replace(/([A-Za-z])_([A-Za-z])/g,'$1 $2');       /* @dana_official, not "dana underscore official" */
  s=s.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2190-\u2BFF\uFE0F]/g,' ');
  s=s.replace(/\s{2,}/g,' ').replace(/\s+([,.!?;:])/g,'$1');
  s=s.replace(/,\s*([.!?;:])/g,'$1');                  /* "a kilo of…?" must not become "of,?" */
  s=s.replace(/[ ,]+$/,'').replace(/\u0001[ ,]*$/,'');
  return s.trim();
}

/* ------------------------------------------------------------------
   THOUGHT GROUPS
   One utterance per sentence was what made everything choppy and made
   Chrome cut the long narrations. We chunk at real phrase boundaries
   and give each boundary its own pause length.
------------------------------------------------------------------- */
var MARKER=/^(but|so|and then|then|because|actually|well|of course|first|next|after that|in the end|finally|however|anyway|yes|no|sorry|excuse me)\b/i;
var AUX=/^(do|does|did|is|are|am|was|were|can|could|have|has|had|will|would|shall|should|may|might)\b/i;
var WH=/^(what|where|when|why|who|whose|which|how)\b/i;

function jit(n,p){return Math.round(n*(1+(Math.random()*2-1)*(p||0.12)))}

function chunk(line){
  var txt=sayable(line);
  if(!txt)return [];
  var segs=txt.split('\u0001'),out=[];
  for(var g=0;g<segs.length;g++){
    var seg=segs[g].trim();if(!seg)continue;
    var got=chunkSeg(seg);
    for(var z=0;z<got.length;z++)got[z].seg=g;
    if(g<segs.length-1&&got.length)got[got.length-1].p=jit(620);  /* a real turn takes a breath */
    out=out.concat(got);
  }
  if(out.length)out[out.length-1].p=0;                            /* caller owns the line gap */
  for(var m=1;m<out.length;m++){if(MARKER.test(out[m].t))out[m-1].p=jit(out[m-1].p+95)}
  return out;
}

function chunkSeg(txt){
  var sent=txt.match(/[^.!?]+[.!?]*/g)||[txt],out=[];
  for(var i=0;i<sent.length;i++){
    var S=sent[i].replace(/^[\s\u0002]+/,'').trim();if(!S)continue;
    var end=/[?]\s*$/.test(S)?'q':(/[!]\s*$/.test(S)?'x':'d');
    /* split after , ; : and at " / " — written out because lookbehind
       throws a parse error on older Safari and would kill the whole file */
    var parts=[],buf='',ch;
    for(var q=0;q<S.length;q++){
      ch=S.charAt(q);
      if(ch==='\u0002'){parts.push({x:buf,hard:true});buf='';continue}
      buf+=ch;
      if((ch===','||ch===';'||ch===':')&&/\s/.test(S.charAt(q+1)||' ')){parts.push({x:buf,hard:false});buf=''}
    }
    if(buf)parts.push({x:buf,hard:false});
    if(!parts.length)parts=[{x:S,hard:false}];
    var hardNext=false;
    for(var h=0;h<parts.length;h++){var cur=parts[h].hard;parts[h].hard=hardNext;hardNext=cur}
    /* never leave a 1–2 word sliver on its own — that is what sounds clipped */
    var merged=[];
    for(var j=0;j<parts.length;j++){
      var p=(parts[j].x||'').trim();if(!p)continue;
      /* short slivers get folded in — except a deliberate alternative ("go / went") */
      if(merged.length&&!parts[j].hard&&p.split(/\s+/).length<3&&!MARKER.test(p))merged[merged.length-1]+=' '+p;
      else merged.push(p);
    }
    for(var k=0;k<merged.length;k++){
      var c=merged[k],last=k===merged.length-1,pause;
      if(last)pause=end==='q'?460:(end==='x'?390:410);
      else if(/\u0002/.test(S.charAt(0)))pause=260;
      else if(/[;:]$/.test(c))pause=225;
      else if(/,$/.test(c))pause=155;
      else pause=195;
      if(i===sent.length-1&&last)pause=0;             /* line-level pause is added by the caller */
      out.push({t:c,p:jit(pause),end:last?end:'',first:(i===0&&k===0),last:last,seg:0});
    }
  }
  return out;
}

/* ------------------------------------------------------------------
   DELIVERY PROFILES
------------------------------------------------------------------- */
var PROF={
  narration:{rate:0.96,pitch:1.00,gap:520},
  dialogue :{rate:1.00,pitch:1.02,gap:560},
  phrase   :{rate:0.95,pitch:1.01,gap:480},
  model    :{rate:0.95,pitch:1.00,gap:480},
  word     :{rate:0.88,pitch:1.00,gap:380}
};

function shape(c,pf,idx){
  var r=pf.rate,p=pf.pitch;
  if(c.end==='q'){
    if(AUX.test(c.t)){p+=0.14;r+=0.02}                 /* yes/no question really rises */
    else if(WH.test(c.t)){p+=0.04}
  }else if(c.end==='x'){p+=0.10;r+=0.04}
  else if(c.end==='d'){p-=0.04;r*=0.97}                /* terminal fall */
  if(c.first)p+=0.02;
  if(/\d/.test(c.t))p+=0.03;                           /* numbers carry the information */
  r+=(Math.random()*2-1)*0.022;                        /* kills the metronome */
  p+=(Math.random()*2-1)*0.020;
  if(slowOn){r*=0.74}
  return {rate:Math.max(0.5,Math.min(1.35,r)),pitch:Math.max(0.6,Math.min(1.6,p))};
}

/* ------------------------------------------------------------------
   QUEUE RUNNER
   Real pauses between utterances instead of dumping the whole lesson
   into the engine queue at once (which produced identical machine gaps).
------------------------------------------------------------------- */
var Qi=[],Qn=0,Qcb=null,Qtimer=null,Qwatch=null,Qkeep=null,Qtoken=0;

function qClear(){
  Qi=[];Qn=0;Qcb=null;
  if(Qtimer){clearTimeout(Qtimer);Qtimer=null}
  if(Qwatch){clearTimeout(Qwatch);Qwatch=null}
  if(Qkeep){clearInterval(Qkeep);Qkeep=null}
}
function qStep(tok){
  if(tok!==Qtoken)return;
  if(Qn>=Qi.length){var f=Qcb;qClear();if(f)try{f()}catch(e){}return}
  var it=Qi[Qn++],sy=window.speechSynthesis;
  var u=new SpeechSynthesisUtterance(it.t);
  u.lang=(it.voice&&it.voice.lang)||'en-GB';
  if(it.voice)u.voice=it.voice;
  u.rate=it.rate;u.pitch=it.pitch;u.volume=1;
  var moved=false,go=function(){
    if(moved||tok!==Qtoken)return;moved=true;
    if(Qwatch){clearTimeout(Qwatch);Qwatch=null}
    Qtimer=setTimeout(function(){qStep(tok)},it.p);
  };
  u.onend=go;u.onerror=go;
  /* some engines never fire onend — never leave the learner on a dead player */
  var est=1400+it.t.length*(70/Math.max(0.5,it.rate));
  Qwatch=setTimeout(go,est);
  try{sy.speak(u)}catch(e){go()}
}
function qRun(){
  var sy=window.speechSynthesis;
  Qtoken++;var tok=Qtoken;
  /* Chrome stalls synthesis after ~14s unless nudged */
  Qkeep=setInterval(function(){
    try{if(sy.speaking&&!sy.paused){sy.resume()}}catch(e){}
  },5000);
  qStep(tok);
}

/* ------------------------------------------------------------------
   speak(lines, cb, opt)
   opt.profile : narration | dialogue | phrase | model | word
   opt.roles   : per-line speaker index (chat passes its own bubbles)
------------------------------------------------------------------- */
function speak(lines,cb,opt){
  try{
    var sy=window.speechSynthesis;if(!sy){if(cb)cb();return}
    if(typeof lines==='string')lines=[lines];
    lines=(lines||[]).filter(function(x){return x!=null&&String(x).trim()!==''});
    if(!lines.length){if(cb)cb();return}
    opt=opt||{};
    var pf=PROF[opt.profile]||PROF.narration;
    var roles=opt.roles||null;
    /* several turns and no explicit roles: alternate speakers */
    var duo=opt.profile==='dialogue'||(!!roles)||(lines.length>1&&opt.profile!=='narration'&&opt.profile!=='word');
    stopAudio();
    vxReady(function(){
      var items=[],prev=-1;
      for(var i=0;i<lines.length;i++){
        var who=roles?(roles[i]?1:0):(duo?i%2:0);
        /* vocabulary pairs ("go / went", "come — came") need the same chunker,
           otherwise the break marker reaches the engine as a raw character */
        var cs=chunk(lines[i]);
        for(var j=0;j<cs.length;j++){
          var sh=shape(cs[j],pf,j);
          var w2=duo?(who+(cs[j].seg||0))%2:who;      /* "Were you? — No, I wasn't." changes speaker */
          var voice=w2?VX.B:VX.A;
          /* only one usable voice on this device: separate the speakers by pitch */
          if(VX.solo&&w2){sh.pitch=Math.max(0.6,sh.pitch-0.20);sh.rate=sh.rate-0.02}
          var pause=cs[j].p;
          if(j===cs.length-1&&i<lines.length-1)pause=jit(who!==prev&&duo?pf.gap+140:pf.gap);
          if(slowOn)pause=Math.round(pause*1.45);
          items.push({t:cs[j].t,voice:voice,rate:sh.rate,pitch:sh.pitch,p:pause});
        }
        prev=who;
      }
      if(!items.length){if(cb)cb();return}
      qClear();Qi=items;Qn=0;Qcb=cb||null;qRun();
    });
  }catch(e){if(cb)cb()}
}

function stopAudio(){
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  Qtoken++;qClear();
  try{window.speechSynthesis.cancel()}catch(e){}
}

function playTrack(track,lines,btn){
  stopAudio();
  if(btn){btn.innerHTML='⏸';btn.classList.add('on')}
  var done=function(){if(btn){btn.innerHTML='▶';btn.classList.remove('on')}};
  var say=function(){
    speak(lines,done,{profile:(lines&&lines.length>1)?'dialogue':'narration'});
  };
  if(!track){say();return}
  var paths=['audio/Track_'+track+'.mp3','Coursebook Audio/Track_'+track+'.mp3'],k=0;
  (function tryNext(){
    if(k>=paths.length){curAudio=null;say();return}
    var a=new Audio(paths[k++]);
    a.playbackRate=slowOn?0.75:1;a.onended=done;
    a.onerror=function(){curAudio=null;tryNext()};
    curAudio=a;
    var p=a.play();
    if(p&&p['catch'])p['catch'](function(){curAudio=null;tryNext()});
  })();
}

/* ============================================================
   LEDGER — the engine's model of one screen
   Renderers declare their items and report each resolution.
   ============================================================ */
var L=null;
function newLedger(){
  return {
    total:0, first:0, resolved:0, wrong:0, missed:[], free:false,
    add:function(){this.total++;return this.total-1},
    /* a wrong attempt — used to reveal the escape hatch only when someone is stuck */
    slip:function(){this.wrong++;if(typeof this.onchange==='function')this.onchange()},
    /* ok = right on the very first attempt */
    hit:function(idx,ok){
      if(ok)this.first++; else if(this.missed.indexOf(idx)<0)this.missed.push(idx);
      this.resolved++;
      if(typeof this.onchange==='function')this.onchange();
    },
    done:function(){return this.free||this.resolved>=this.total},
    score:function(){return this.total?Math.round(this.first/this.total*100):100}
  };
}

/* ============================================================
   DRAG AND DROP
   One shared module for every task that moves a word.

   Contract: tapping still works exactly as before. A drag only
   starts once the pointer has travelled past a threshold, so a
   tap is never swallowed. While dragging, the original word
   stays in place and stays readable; a copy of it follows the
   finger, and every legal destination is outlined.
   ============================================================ */
var DND=(function(){
  var LIFT=7;                 /* px of travel before a tap becomes a drag */
  var drag=null;              /* the drag in flight, if any */
  var has=(typeof window!=='undefined'&&'PointerEvent' in window);

  function targetsFor(group){
    var out=[];
    Array.prototype.forEach.call(document.querySelectorAll('[data-dnd-t="'+group+'"]'),function(el){
      if(!el._dnd)return;
      if(el._dnd.accept&&!el._dnd.accept(drag.src))return;
      out.push(el);
    });
    return out;
  }
  function under(x,y){
    if(!drag)return null;
    var stack=document.elementsFromPoint?document.elementsFromPoint(x,y):[document.elementFromPoint(x,y)];
    for(var i=0;i<stack.length;i++){
      var el=stack[i];
      while(el&&el!==document.body){
        if(drag.open.indexOf(el)>-1)return el;
        el=el.parentNode;
      }
    }
    return null;
  }
  function paint(el){
    if(drag.over===el)return;
    if(drag.over)drag.over.classList.remove('dnd-over');
    drag.over=el;
    if(el)el.classList.add('dnd-over');
  }
  function begin(){
    drag.live=true;
    document.body.classList.add('dnd-on');
    drag.src.classList.add('lifted');
    var g=el('div','dnd-ghost');
    g.textContent=(drag.src.dataset.w!=null?drag.src.dataset.w:drag.src.textContent).trim();
    document.body.appendChild(g);drag.ghost=g;
    drag.open=targetsFor(drag.group);
    drag.open.forEach(function(t){t.classList.add('dnd-open')});
  }
  function move(x,y){
    drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px';
    paint(under(x,y));
  }
  function finish(ok){
    var d=drag;drag=null;
    document.body.classList.remove('dnd-on');
    d.open.forEach(function(t){t.classList.remove('dnd-open','dnd-over')});
    d.src.classList.remove('lifted');
    var landed=ok&&d.over;
    if(landed){
      if(d.ghost&&d.ghost.parentNode)d.ghost.parentNode.removeChild(d.ghost);
      d.over._dnd.drop(d.src);
    }else if(d.ghost){
      /* nothing is lost: the copy travels home so the learner sees where it went */
      var r=d.src.getBoundingClientRect(),g=d.ghost;
      g.classList.add('back');
      g.style.left=(r.left+r.width/2)+'px';g.style.top=(r.top+r.height/2)+'px';
      setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g)},200);
    }
    /* a completed drag must not also fire the tap handler underneath it */
    d.src._dndJust=true;
    eatNextClick(function(){d.src._dndJust=false});
  }
  function eatNextClick(after){
    var off=function(){document.removeEventListener('click',eat,true);if(after)after()};
    var eat=function(ev){ev.stopPropagation();ev.preventDefault();off()};
    document.addEventListener('click',eat,true);
    setTimeout(off,350);
  }
  function cancel(){ if(drag)finish(false); }

  function onDown(ev){
    if(drag)return;
    if(ev.button!=null&&ev.button!==0)return;
    var src=ev.currentTarget;
    if(src.disabled||src._dndLocked&&src._dndLocked())return;
    drag={src:src,group:src.dataset.dndS,x0:ev.clientX,y0:ev.clientY,live:false,over:null,ghost:null,open:[]};
    if(has&&src.setPointerCapture&&ev.pointerId!=null){
      try{src.setPointerCapture(ev.pointerId)}catch(e){}
    }
  }
  function onMove(ev){
    if(!drag)return;
    if(!drag.live){
      if(Math.abs(ev.clientX-drag.x0)+Math.abs(ev.clientY-drag.y0)<LIFT)return;
      begin();
    }
    if(ev.cancelable)ev.preventDefault();
    move(ev.clientX,ev.clientY);
  }
  function onUp(ev){
    if(!drag)return;
    if(!drag.live){drag=null;return}   /* never moved — let the click through */
    if(ev.cancelable)ev.preventDefault();
    finish(true);
  }
  /* move and release are watched on the document, so the drag survives the
     pointer leaving the word it started on */
  if(has){
    document.addEventListener('pointermove',onMove,{passive:false});
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',cancel);
  }else{
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',function(ev){
      if(!drag)return;var t=ev.touches[0];if(!t)return;
      onMove({clientX:t.clientX,clientY:t.clientY,cancelable:ev.cancelable,preventDefault:function(){ev.preventDefault()}});
    },{passive:false});
    document.addEventListener('touchend',function(ev){
      onUp({cancelable:false,preventDefault:function(){}});
    });
  }

  return {
    /* make an element draggable within a named group */
    source:function(node,group,locked){
      node.dataset.dndS=group;node.classList.add('drg');
      if(locked)node._dndLocked=locked;
      if(has){
        node.addEventListener('pointerdown',onDown);
      }else{
        node.addEventListener('mousedown',onDown);
        node.addEventListener('touchstart',function(ev){
          var t=ev.touches[0];if(!t)return;
          onDown({currentTarget:node,button:0,clientX:t.clientX,clientY:t.clientY});
        },{passive:true});
      }
      return node;
    },
    /* declare a legal destination. drop(srcEl) performs the placement,
       reusing exactly the same code path as a tap. */
    target:function(node,group,drop,accept){
      node.dataset.dndT=group;node._dnd={drop:drop,accept:accept};
      return node;
    },
    /* true when the click now firing is the tail of a drag we already handled */
    swallowed:function(node){return !!node._dndJust}
  };
})();

/* ============================================================
   TASK RENDERERS
   render(a, root) — draws the task and wires instant marking
   showAll(a, root) — reveals every unresolved answer
   ============================================================ */
var R={};
function qnum(i){return '<i class="qn">'+(i+1)+'</i>'}
function picOf(p){return p?'<span class="pic" aria-hidden="true">'+p+'</span>':''}
function numericLadder(o){
  var v=o.map(function(x){return parseFloat(String(x).replace(/[^0-9.]/g,''))});
  if(v.some(isNaN))return false;
  for(var i=1;i<v.length;i++)if(v[i]<=v[i-1])return false;
  return true;
}
function optOrder(a,it,i){
  if(a.nosh||numericLadder(it.o))return it.o.map(function(_,k){return k});
  return shuffle(it.o.map(function(_,k){return k}),(a.seed||5)*31+i*17+it.o.length*7+String(it.q||it.s||'').length);
}
function noteEl(kind,icon,html){
  return el('div','note '+kind,'<span class="ic" aria-hidden="true">'+icon+'</span><span>'+html+'</span>');
}
function flash(node){
  node.classList.add('shake');
  setTimeout(function(){node.classList.remove('shake')},340);
}

/* ---- pick one option (choose / tf / odd / label / respond) ---- */
function pickRender(a,root,head){
  a.items.forEach(function(it,i){
    var ord=optOrder(a,it,i);
    var right=ord.indexOf(it.a);
    var idx=L.add(), clean=true, live=true;
    var q=el('div','item');
    q.appendChild(head(it,i));
    var opts=el('div','opts');
    ord.forEach(function(oi,k){
      var b=el('button','opt',esc(it.o[oi]));
      b.setAttribute('aria-label',String(it.o[oi]));
      b.onclick=function(){
        if(!live)return;
        if(k===right){
          live=false;b.classList.add('ok');
          Array.prototype.forEach.call(opts.children,function(c){c.disabled=true});
          q.classList.add('solved');
          if(it.why)q.appendChild(noteEl(clean?'good':'tell','💡',esc(it.why)));
          else if(!clean)q.appendChild(noteEl('good','✓',esc(t('gotit'))));
          L.hit(idx,clean);
        }else{
          clean=false;b.classList.add('no');b.disabled=true;flash(q);L.slip();
        }
      };
      opts.appendChild(b);
    });
    q.appendChild(opts);
    q._reveal=function(){
      if(!live)return;live=false;
      Array.prototype.forEach.call(opts.children,function(c,k){
        c.disabled=true;if(k===right)c.classList.add('rev');
      });
      q.classList.add('solved');
      q.appendChild(noteEl('tell','📘',esc(t('answer_is'))+' <b>'+esc(it.o[it.a])+'</b>'+(it.why?' — '+esc(it.why):'')));
      L.hit(idx,false);
    };
    root.appendChild(q);
  });
  root._items=Array.prototype.slice.call(root.querySelectorAll('.item'));
}
function pickShowAll(a,root){
  (root._items||[]).forEach(function(q){if(q._reveal)q._reveal()});
}
R.choose={render:function(a,root){

/* ---- word box + bubble blanks (bank / match / table / chat) ---- */
var DNDG=0;
function makeBank(root,words,seed,label){
  var bank=el('div','bank'),active=null;
  bank.group='bank'+(++DNDG);
  bank.appendChild(el('div','hint',esc(label||t('wordbank'))));
  shuffle(words,seed||3).forEach(function(w){
    var c=el('button','tok',esc(w));c.dataset.w=w;
    c.onclick=function(){
      /* a drag that has just landed must not also toggle the selection */
      if(DND.swallowed(c))return;
      if(c.classList.contains('used'))return;
      if(active===c){c.classList.remove('act');active=null;return}
      if(active)active.classList.remove('act');
      active=c;c.classList.add('act');
    };
    DND.source(c,bank.group,function(){return c.classList.contains('used')});
    bank.appendChild(c);
  });
  bank.take=function(c){var a=c||active;if(a){a.classList.add('used');a.classList.remove('act')}
    if(active===a)active=null;return a};
  bank.peek=function(){return active};
  /* release the selection outright — never leave a word armed but unhighlighted */
  bank.clear=function(){if(active)active.classList.remove('act');active=null};
  bank.give=function(w){var c=bank.querySelector('.tok.used[data-w="'+String(w).replace(/"/g,'\\"')+'"]');if(c)c.classList.remove('used')};
  bank.burn=function(){Array.prototype.forEach.call(bank.querySelectorAll('.tok'),function(c){c.classList.add('used')})};
  return bank;
}
/* a blank that judges itself the moment it is filled */
function liveBlank(ans,bank,host){
  var s=el('button','blank','');s.dataset.a=ans;
  /* an empty gap has no text, so it needs an accessible name of its own */
  s.setAttribute('aria-label',t('gap'));
  var idx=L.add(),clean=true,live=true;
  /* one placement path, shared by tapping and by dropping */
  function place(c){
    if(!live||!c)return;
    var w=c.dataset.w;
    if(w===ans){
      bank.take(c);live=false;
      s.textContent=w;s.setAttribute('aria-label',w);s.classList.add('ok','lock');
      L.hit(idx,clean);
    }else{
      clean=false;
      s.textContent=w;s.classList.add('no');
      bank.clear();
      flash(host||s);L.slip();
      setTimeout(function(){if(live){s.textContent='';s.classList.remove('no')}},620);
    }
  }
  s.onclick=function(){
    if(DND.swallowed(s))return;
    if(!live)return;
    place(bank.peek());
  };
  DND.target(s,bank.group,place,function(){return live});
  s._reveal=function(){
    if(!live)return;live=false;
    s.textContent=ans;s.setAttribute('aria-label',ans);
    s.classList.remove('no');s.classList.add('rev','lock');
    L.hit(idx,false);
  };
  return s;
}
function blanksShowAll(root){
  Array.prototype.forEach.call(root.querySelectorAll('.blank'),function(s){if(s._reveal)s._reveal()});
  if(root._bank)root._bank.burn();
}

R.order={

        tiles.appendChild(c);

      q.appendChild(built);q.appendChild(tiles);
      q._reveal=function(){

/* ---- typed retrieval: the learner produces the word, no bank ---- */
function nrm(s){return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[.,!?;:\u2026\u00a3\u20ac\u20b8$]/g,'').replace(/\s+/g,' ').trim()}
/* A second, forgiving pass. It only ever equates two spellings of the SAME
   word — a missing apostrophe on a phone keyboard, a hyphen typed as a space,
   a British form where the key is American or the other way round. It can
   never turn a genuinely wrong answer into a right one. */
function loose(s){
  return nrm(s)
    .replace(/'/g,'')                    /* dont = don't, couldnt = couldn't */
    .replace(/[-\u2013\u2014]/g,' ')     /* twenty-five = twenty five */
    .replace(/\b(cent|met|lit|theat|fib)re(s?)\b/g,'$1er$2')
    .replace(/\bcolour/g,'color').replace(/\bfavourite/g,'favorite')
    .replace(/\bneighbour/g,'neighbor').replace(/\bgrey\b/g,'gray')
    .replace(/\bpractise\b/g,'practice')
    .replace(/ll(ing|ed|er)\b/g,'l$1')   /* travelling = traveling */
    .replace(/ise\b/g,'ize').replace(/isation\b/g,'ization')
    .replace(/\s+/g,' ').trim();
}
R.type={
  render:function(a,root){
    a.items.forEach(function(it,i){
      var idx=L.add(),clean=true,live=true;
      var q=el('div','item');
      q.appendChild(el('div','qline',qnum(i)+picOf(it.pic)+'<span>'+esc(loc(it.q))+'</span>'));
      var row=el('div','trow');
      var inp=el('input','tin');
      inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
      inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');
      inp.setAttribute('aria-label',loc(it.q));
      if(it.ph)inp.placeholder=it.ph;
      var go=el('button','tgo','&rarr;');
      go.setAttribute('aria-label',t('check'));
      function judge(){
        if(!live)return;
        var v=nrm(inp.value);
        if(!v)return;
        var vl=loose(inp.value);
        var keys=[it.a].concat(it.alt||[]);
        var ok=false,k;
        for(k=0;k<keys.length;k++)if(nrm(keys[k])===v||loose(keys[k])===vl)ok=true;
        if(ok){
          live=false;inp.value=it.a;inp.disabled=true;go.disabled=true;
          inp.classList.add('ok');q.classList.add('solved');
          if(it.why)q.appendChild(noteEl(clean?'good':'tell','\uD83D\uDCA1',esc(it.why)));
          else if(!clean)q.appendChild(noteEl('good','\u2713',esc(t('gotit'))));
          L.hit(idx,clean);
        }else{
          clean=false;inp.classList.add('no');flash(q);L.slip();
          setTimeout(function(){inp.classList.remove('no')},460);
          try{inp.select()}catch(e){}
        }
      }
      go.onclick=judge;
      inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();judge()}};
      inp.onblur=function(){if(live&&nrm(inp.value))judge()};
      row.appendChild(inp);row.appendChild(go);q.appendChild(row);
      q._reveal=function(){
        if(!live)return;live=false;
        inp.value=it.a;inp.disabled=true;go.disabled=true;
        inp.classList.add('rev');q.classList.add('solved');
        q.appendChild(noteEl('tell','\uD83D\uDCD8',esc(t('answer_is'))+' <b>'+esc(it.a)+'</b>'));
        L.hit(idx,false);
      };
      root.appendChild(q);
    });
    root._items=Array.prototype.slice.call(root.querySelectorAll('.item'));
  },
  showAll:pickShowAll
};

     header chip, which appears only when there are mistakes — so there is no empty state. */

      '<div class="caret" aria-hidden="true">›</div>';
    head.onclick=function(){S.open[u.n]=!isOpen;renderHome()};
    box.appendChild(head);

    if(isOpen){
      var rows=el('div','rows');
      all.forEach(function(n){
        var W=WB[n],d=lessonDone(n),tot=acts(n).length,pp=Math.round(d/tot*100);
        var isRev=[12,24,32].indexOf(n)>-1;
        var r=el('button','lrow'+(d===tot?' done':'')+(isRev?' chal':''));
        r.innerHTML='<span class="dial" style="--p:'+pp+'%" aria-hidden="true"><i>'+(d===tot?'✓':'')+'</i></span>'+
          '<span class="t"><b>'+esc(W.title)+'</b><span>'+
          (isRev?'★ '+esc(t('challenge')):esc(t('lesson'))+' '+n)+' · '+d+' / '+tot+'</span></span>'+
          '<span class="go" aria-hidden="true">›</span>';

    app.appendChild(box);
  });

  actionBar([btn('btn-go',(started?t('m_continue'):t('m_start'))+' →',function(){openAct(nx,firstOpen(nx))},true)]);
  setBar();window.scrollTo(0,0);
}

/* ---------- ACTIVITY SCREEN ---------- */
function openAct(n,i){S.n=n;S.i=i||0;renderAct()}

function railFor(n,i,total,onBack){
  var wrapEl=el('div','rail');
  var seg=el('div','seg');
  for(var k=0;k<total;k++){
    seg.appendChild(el('i',(S.prog[pkey(n,k)]?'on':'')+(k===i?' cur':'')));
  }
  wrapEl.appendChild(seg);
  var meta=el('div','railmeta');
  var b=el('button','back','←');b.setAttribute('aria-label',t('back'));b.onclick=onBack;
  meta.appendChild(b);
  var W=WB[n];
  meta.appendChild(el('div','t','<b>'+esc(W.title)+'</b><span>'+esc(t('step'))+' '+(i+1)+' '+esc(t('of'))+' '+total+'</span>'));
  var o=el('button','open','☰ <span>'+esc(t('lesson_menu'))+'</span>');
  o.onclick=function(){openLessonSheet(n)};
  meta.appendChild(o);
  wrapEl.appendChild(meta);
  return wrapEl;
}

function briefFor(a){
  var fam=FAM[a.t]||'';
  var b=el('div','brief');
  b.innerHTML='<span class="tag '+fam+'"><span aria-hidden="true">'+(ICON[a.t]||'✳️')+'</span> '+esc(t('k_'+a.t)||'')+'</span>'+
    '<span class="tx">'+esc(ins(a))+(sub(a)?'<em>'+esc(sub(a))+'</em>':'')+'</span>';
  return b;
}

function tallyEl(){
  var el2=el('div','tally');
  el2.setAttribute('aria-live','polite');
  return el2;
}
function paintTally(node,lg){
  if(lg.free){node.innerHTML='<span>'+esc(loc(INS.nocheck))+'</span>';return}
  var h='';
  var show=Math.min(lg.total,12);
  for(var k=0;k<show;k++){
    var cls='dot';
    if(k<lg.resolved)cls+=lg.missed.indexOf(k)>-1?' bad':' on';
    h+='<span class="'+cls+'"></span>';
  }
  h+='<span>'+lg.resolved+' / '+lg.total+'</span>';
  node.innerHTML=h;
}

function renderAct(){
  stopAudio();S.view='act';closeSheet();
  var n=S.n,A=acts(n),a=A[S.i];
  var app=$('app');app.innerHTML='';
  app.appendChild(railFor(n,S.i,A.length,renderHome));
  app.appendChild(briefFor(a));
  /* B2: the functional phrases for this stage, visible while the task is done */
  if(a.use&&a.use.length){
    var ul=el('div','uselang');
    ul.innerHTML='<div class="k">'+esc(t('uselang'))+'</div><ul>'+
      a.use.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>';
    app.appendChild(ul);
  }

  var card=el('div','card');
  var body=el('div','items');card.appendChild(body);
  app.appendChild(card);

  L=newLedger();
  R[a.t].render(a,body);

  var tally=tallyEl();
  var help=btn('btn-ghost',t('showone'),function(){R[a.t].showAll(a,body);refresh()});
  var go=btn('btn-next',(S.i<A.length-1?t('nx_screen'):t('nx_finish'))+' →',function(){
    award(n,S.i,L.missed);
    if(S.i<A.length-1){S.i++;renderAct()}else renderWrap();
  },false);
  go.style.flex='1';

  function refresh(){
    paintTally(tally,L);
    var ready=L.done();
    go.disabled=!ready;
    help.classList.toggle('hide',ready||L.free||L.wrong===0);
    if(ready&&!L.free){
      tally.innerHTML='<b style="color:var(--green-ink)">'+L.first+' / '+L.total+' '+esc(t('right_first'))+'</b>';
    }
  }
  L.onchange=refresh;
  actionBar(L.free?[go]:[tally,help,go]);
  refresh();
  setBar();window.scrollTo(0,0);
}

/* A screen is either done or not. No score is stored, no points are awarded. */
function award(n,i,missed){
  var k=pkey(n,i);
  S.prog[k]=1;
  if(missed&&missed.length)S.miss[k]=missed.slice();
  else delete S.miss[k];
  save();setBar();
}

/* ---------- LESSON SHEET (steps · words · help) ---------- */
function openLessonSheet(n){
  var W=WB[n],A=acts(n),u=unitOf(n);
  var sh=$('sheet');sh.innerHTML='';
  sh.appendChild(el('div','grip'));
  sh.appendChild(el('div','hd','<h3>'+esc(W.title)+'</h3><div class="sub">'+esc(t('unit'))+' '+u.n+' · '+esc(loc(W.fn))+'</div>'));
  var tabs=el('div','tabs');
  var pane=el('div','pane');
  var names=[['steps',t('steps_t')],['words',t('words_t')],['help',t('help_t')]];
  function paint(which){
    Array.prototype.forEach.call(tabs.children,function(b){b.classList.toggle('on',b.dataset.k===which)});
    pane.innerHTML='';
    if(which==='steps'){
      var last=null,box=null;
      A.forEach(function(a,i){
        var st=stageOf(a);
        if(st!==last){
          last=st;box=el('div','stage');
          box.appendChild(el('h4',null,'<span aria-hidden="true">'+STAGE_ICON[st]+'</span>'+esc(t('st_'+st))));
          pane.appendChild(box);
        }
        var p=S.prog[pkey(n,i)];
        var b=el('button','step'+(p?' ok':'')+(i===S.i?' cur':''));
        b.innerHTML='<span class="dot">'+(p?'✓':(i+1))+'</span>'+
          '<span class="lbl"><b>'+esc(ins(a))+'</b><span>'+esc(t('k_'+a.t))+'</span></span>';
        b.onclick=function(){closeSheet();openAct(n,i)};
        box.appendChild(b);
      });
    }else if(which==='words'){
      /* B1: the student meets the English word first; the translation is opt-in */
      var tg=el('button','trtoggle'+(S.tr?' on':''),esc(t('showtr')));
      tg.setAttribute('aria-pressed',String(S.tr));
      tg.onclick=function(){S.tr=!S.tr;save();paint('words')};
      pane.appendChild(tg);
      W.voc.forEach(function(v){
        var r=el('div','vrow');
        r.innerHTML='<div class="vp" aria-hidden="true">'+(v[3]||'🔤')+'</div><div class="vw"><b>'+esc(v[0])+'</b>'+
          (S.tr?'<span>'+esc(v[1]+' · '+v[2])+'</span>':'')+'</div>';
        var sp=el('button','spk','🔊');sp.setAttribute('aria-label','Play '+v[0]);
        sp.onclick=function(){stopAudio();speak([v[0]],null,{profile:'word'})};
        r.appendChild(sp);pane.appendChild(r);
      });
    }else{
      /* B2: the phrases this lesson actually needs, not a fixed classroom helper */
      pane.appendChild(el('div','note tell','<span class="ic" aria-hidden="true">💬</span><span>'+esc(t('uselang_s'))+'</span>'));
      (W.useful||[]).forEach(function(p){
        var r=el('div','vrow');
        r.innerHTML='<div class="vp" aria-hidden="true">'+(p[1]||'💬')+'</div><div class="vw"><b>'+esc(p[0])+'</b></div>';
        var sp=el('button','spk','🔊');sp.setAttribute('aria-label','Play');
        sp.onclick=function(){stopAudio();speak([p],null,{profile:'phrase'})};
        r.appendChild(sp);pane.appendChild(r);
      });
      if(W.tip)pane.appendChild(el('div','note warn','<span class="ic" aria-hidden="true">📘</span><span>'+esc(loc(W.tip))+'</span>'));
    }
  }
  names.forEach(function(x){
    var b=el('button',null,esc(x[1]));b.dataset.k=x[0];
    b.onclick=function(){paint(x[0])};
    tabs.appendChild(b);
  });
  sh.appendChild(tabs);sh.appendChild(pane);
  paint('steps');
  sh.classList.add('on');$('scrim').classList.add('on');
}
function closeSheet(){
  var sh=$('sheet');if(sh)sh.classList.remove('on');
  var sc=$('scrim');if(sc)sc.classList.remove('on');
}

/* ---------- WRAP ---------- */
function selfCheckItems(n){
  var W=WB[n];
  var out=[loc(W.can)||loc(W.fn)];
  if(W.gr)out.push(t('sc_use')+' '+W.gr+'.');
  out.push(t('sc_words').replace('{n}',W.voc.length));
  return out;
}
function renderWrap(){
  stopAudio();S.view='wrap';closeSheet();
  var n=S.n,A=acts(n),W=WB[n],app=$('app');app.innerHTML='';
  app.appendChild(railFor(n,A.length-1,A.length,renderHome));
  var card=el('div','card');
  card.appendChild(el('div','done-hero',
    '<div class="big" aria-hidden="true">✓</div><h2>'+esc(t('wrapt'))+'</h2>'+
    '<p>'+esc(W.title)+'</p>'));

  var lessonMiss=0;
  A.forEach(function(a,k){var m=S.miss[pkey(n,k)];if(m)lessonMiss+=m.length});
  if(lessonMiss){
    var nb=noteEl('warn','⌾',esc(t('mistakes_n').replace('{n}',lessonMiss))+' — '+esc(t('m_review_s')));
    nb.style.marginTop='16px';
    card.appendChild(nb);
  }

  var sc=el('div','sect');
  sc.appendChild(el('h3',null,esc(t('sc_title'))));
  selfCheckItems(n).forEach(function(txt,k){
    var key=n+'.sc'+k;
    var row=el('button','scrow'+(S.sc[key]?' on':''));
    row.innerHTML='<span class="box" aria-hidden="true">✓</span><span>'+esc(txt)+'</span>';
    row.setAttribute('aria-pressed',String(!!S.sc[key]));
    row.onclick=function(){S.sc[key]=!S.sc[key];row.classList.toggle('on',!!S.sc[key]);row.setAttribute('aria-pressed',String(!!S.sc[key]));save()};
    sc.appendChild(row);
  });
  card.appendChild(sc);

  var rec=el('div','sect recap');
  rec.appendChild(el('h3',null,esc(t('steps_t'))));
  A.forEach(function(a,k){
    var p=S.prog[pkey(n,k)],m=S.miss[pkey(n,k)];
    var row=el('button','r');
    row.innerHTML='<span>'+(k+1)+'. '+esc(ins(a))+'</span><b'+(m&&m.length?' class="miss"':'')+'>'+
      (p?'✓':'—')+'</b>';
    row.onclick=function(){openAct(n,k)};
    rec.appendChild(row);
  });
  card.appendChild(rec);app.appendChild(card);

  var Ls=lessonList(),idx=Ls.indexOf(n);
  var b1=btn('btn-ghost','☰',renderHome);
  b1.setAttribute('aria-label',t('home'));
  var b2=btn('btn-next',(idx<Ls.length-1?t('nextlesson'):t('home'))+' →',function(){
    if(idx<Ls.length-1){var m=Ls[idx+1];openAct(m,firstOpen(m))}else renderHome();
  },true);
  actionBar([b1,b2]);
  setBar();window.scrollTo(0,0);
}

/* ============================================================
   REVIEW — the items you got wrong come back
   ============================================================ */
/* item-list tasks can be narrowed down to the missed items only */
var SUBSETTABLE={type:1,choose:1,tf:1,odd:1,label:1,respond:1,bank:1,match:1,order:1,fix:1};
function subsetAct(a,idxs){
  if(!SUBSETTABLE[a.t]||!a.items)return a;
  var out={},k;
  for(k in a)out[k]=a[k];
  var keep=idxs.filter(function(i){return a.items[i]});
  out.items=keep.map(function(i){return a.items[i]});
  if(out.bank)out.bank=out.items.map(function(x){return x.a});
  if(!out.items.length)return a;
  /* ledger position -> position in the original activity */
  out._map=keep;
  return out;
}
function renderReview(){
  stopAudio();S.view='review';closeSheet();
  var keys=missKeys();
  var app=$('app');app.innerHTML='';
  if(!keys.length){
    app.appendChild(el('div','rail','<div class="railmeta"><button class="back" id="rvback" aria-label="'+esc(t('back'))+'">←</button>'+
      '<div class="t"><b>'+esc(t('reviewt'))+'</b><span>'+esc(t('review_done'))+'</span></div></div>'));
    $('rvback').onclick=renderHome;
    var card=el('div','card');
    card.appendChild(el('div','empty','<div class="big" aria-hidden="true">✓</div><b>'+esc(t('review_done'))+'</b><p>'+esc(t('review_done_s'))+'</p>'));
    app.appendChild(card);
    actionBar([btn('btn-next',t('home')+' →',renderHome,true)]);
    setBar();window.scrollTo(0,0);return;
  }
  var key=keys[0],parts=key.split('.'),n=+parts[0],i=+parts[1];
  var base=acts(n)[i],a=subsetAct(base,S.miss[key]);

  var head=el('div','rail');
  var seg=el('div','seg');
  var totalKeys=keys.length;
  for(var k=0;k<Math.min(totalKeys,14);k++)seg.appendChild(el('i',k===0?'cur':''));
  head.appendChild(seg);
  var meta=el('div','railmeta');
  var bb=el('button','back','←');bb.setAttribute('aria-label',t('back'));bb.onclick=renderHome;
  meta.appendChild(bb);
  meta.appendChild(el('div','t','<b>'+esc(t('reviewt'))+'</b><span>'+esc(WB[n].title)+' · '+esc(t('mistakes_n').replace('{n}',missCount()))+'</span>'));
  head.appendChild(meta);
  app.appendChild(head);

  var brief=el('div','brief');
  brief.innerHTML='<span class="tag s-rec"><span aria-hidden="true">⌾</span> '+esc(t('m_review'))+'</span>'+
    '<span class="tx">'+esc(ins(base))+'<em>'+esc(t('review_ins'))+'</em></span>';
  app.appendChild(brief);

  var card=el('div','card'),body=el('div','items');card.appendChild(body);app.appendChild(card);
  L=newLedger();
  R[a.t].render(a,body);

  var tally=tallyEl();
  var help=btn('btn-ghost',t('showone'),function(){R[a.t].showAll(a,body);refresh()});
  var go=btn('btn-next',t('nx_screen')+' →',function(){
    if(L.missed.length===0)delete S.miss[key];
    else{
      /* Keep only what is still wrong, mapped back to the original indices.
         When the task was replayed whole rather than trimmed to the missed
         items, the ledger index already IS the original index. */
      var map=a._map,keep=[];
      L.missed.forEach(function(m){
        var o=map?map[m]:m;
        if(o!==undefined&&keep.indexOf(o)<0)keep.push(o);
      });
      if(keep.length)S.miss[key]=keep;else delete S.miss[key];
    }
    save();renderReview();
  });
  go.style.flex='1';
  function refresh(){
    paintTally(tally,L);
    var ready=L.done();
    go.disabled=!ready;
    help.classList.toggle('hide',ready||L.free||L.wrong===0);
  }
  L.onchange=refresh;
  actionBar(L.free?[go]:[tally,help,go]);
  refresh();
  setBar();window.scrollTo(0,0);
}

/* ============================================================
   BOOT
   ============================================================ */
function rerender(){
  if(S.view==='home')renderHome();
  else if(S.view==='act')renderAct();
  else if(S.view==='wrap')renderWrap();
  else if(S.view==='review')renderReview();
  else renderHome();
}
$('scrim').onclick=closeSheet;
$('barmiss').onclick=function(){if(missCount())renderReview()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

load();
renderHome();

</script>
