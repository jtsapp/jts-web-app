<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just To Study · Vocabulary · Animals</title>
<style>
:root{
  --violet:#874BF8; --cyan:#0AAFFF; --green:#00D441; --orange:#FF631E; --gold:#FFAD00;
  --ink:#000; --ink2:#4E4B4B; --muted:#898787; --line:#E6E3EE; --lav:#F4F1FD; --lav2:#EAE4FB;
  --r:28px;
  --font-head:'PT Root UI','SF Pro Display',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'SF Pro Display','PT Root UI',-apple-system,'Segoe UI',Roboto,sans-serif;
  --tint:#874BF8; --tint2:#0AAFFF;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-body);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:14px}
h1,h2,h3{font-family:var(--font-head);margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{min-height:100vh;position:relative;isolation:isolate}
#app::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(70vw 60vh at 15% 0%,color-mix(in srgb,var(--tint) 16%,#fff),transparent 70%),radial-gradient(60vw 50vh at 100% 100%,color-mix(in srgb,var(--tint2) 14%,#fff),transparent 70%)}
#app.in-world::before{opacity:1}
.wrap{max-width:1240px;margin:0 auto;padding:18px 24px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.logo{height:32px;display:block}
.crumb{display:inline-flex;align-items:center;gap:10px;color:var(--ink2);font-weight:600;font-size:15px}
.crumb b{color:var(--ink);font-family:var(--font-head)}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:10px 16px 10px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--ink);transition:background .15s,transform .15s}
.back:hover{background:var(--lav);transform:translateX(-2px)}

/* ---------- home ---------- */
.intro{margin:34px 0 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.intro h1{font-size:clamp(40px,6vw,66px);letter-spacing:-1.6px;line-height:1}
.intro p{margin:10px 0 0;font-size:18px;color:var(--ink2);line-height:1.4;max-width:48ch}
.say{display:inline-flex;align-items:center;gap:10px;background:var(--violet);color:#fff;font-family:var(--font-head);font-weight:700;padding:12px 18px;border-radius:22px 22px 22px 6px;box-shadow:0 12px 30px rgba(135,75,248,.28)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.world{position:relative;text-align:left;border-radius:var(--r) var(--r) var(--r) 8px;overflow:hidden;background:var(--lav);aspect-ratio:16/11;
  box-shadow:0 10px 30px rgba(20,10,50,.10);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.world:hover{transform:translateY(-6px);box-shadow:0 26px 54px rgba(135,75,248,.24)}
.world img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.world:hover img{transform:scale(1.05)}
.world .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--violet);font-weight:700;font-size:14px;text-align:center;padding:16px;background:linear-gradient(160deg,var(--lav),var(--lav2))}
.world .ph small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
.world .shade{position:absolute;inset:auto 0 0;height:62%;background:linear-gradient(transparent,rgba(12,6,30,.72))}
.world .body{position:absolute;inset:auto 0 0;padding:18px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;color:#fff}
.world h3{font-size:24px;letter-spacing:-.4px}
.world .n{opacity:.85;font-size:14px;margin-top:3px;font-weight:600}
.world .tag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.9);color:var(--ink);font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px}
.world.soon{pointer-events:none} .world.soon .body{color:var(--ink)} .world.soon .shade{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;background:var(--violet);color:#fff;transition:transform .15s,background .15s;white-space:nowrap;box-shadow:0 8px 20px rgba(135,75,248,.3)}
.pill:hover{background:#7A3DF0;transform:translateY(-1px)} .pill:active{transform:scale(.97)}
.pill.ghost{background:#fff;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)} .pill.ghost:hover{background:var(--lav)}
.pill.light{background:#fff;color:var(--violet);box-shadow:0 6px 16px rgba(0,0,0,.18)}

/* ---------- world (game) ---------- */
.gtop{display:flex;align-items:center;justify-content:space-between;gap:16px}
.gtop h2{font-size:18px;color:var(--ink2);font-weight:600} .gtop h2 b{color:var(--ink);font-weight:700}
.stagewrap{margin:12px auto 0;width:min(100%,calc((100vh - 230px) * 16 / 9));}
.portrait .stagewrap{width:100%}
.portrait .stage{aspect-ratio:4/3}
.stage{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#DCE9F7;box-shadow:0 30px 70px rgba(20,10,50,.22),0 0 0 1px rgba(255,255,255,.6) inset;user-select:none;-webkit-user-select:none;animation:stagein .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes stagein{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:bgin 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes bgin{from{transform:scale(1.06)}to{transform:scale(1)}}
.stage .bgph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--violet);font-weight:700;padding:20px;background:linear-gradient(180deg,#DDEBFF 0,#E9F3FF 45%,#D5F4DE 45%,#B9EBC7 100%)}
.stage .bgph small{display:block;color:var(--ink2);font-weight:600;margin-top:6px}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(20,10,50,.18));z-index:3}
.light{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(115deg,rgba(255,240,200,.18),transparent 45%);mix-blend-mode:screen}

/* floating task bubble */
.task{position:relative;margin:12px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;background:#fff;border:1.5px solid var(--line);
  border-radius:999px;box-shadow:0 10px 26px rgba(20,10,50,.10);animation:taskin .5s .1s cubic-bezier(.2,1.2,.3,1) both}
@keyframes taskin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.task .txt{font-family:var(--font-head);font-weight:700;font-size:17px;white-space:nowrap}
.task .dots{display:flex;gap:5px;margin-left:4px}
.task .dots i{width:8px;height:8px;border-radius:50%;background:var(--lav2);transition:background .3s,transform .3s}
.task .dots i.on{background:var(--green);transform:scale(1.2)}
.speak{width:52px;height:52px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;position:relative;flex:none;box-shadow:0 8px 20px rgba(135,75,248,.4);transition:transform .15s,background .15s}
.speak:hover{transform:scale(1.06);background:#7A3DF0} .speak:active{transform:scale(.94)}
.speak svg.i{width:24px;height:24px}
.speak::before,.speak::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--violet);opacity:0}
.speak.on::before{animation:ripple 1s ease-out infinite} .speak.on::after{animation:ripple 1s .35s ease-out infinite}
.speak.nudge{animation:nudge .6s cubic-bezier(.2,1.4,.3,1)}
@keyframes nudge{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
@keyframes ripple{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.hint{position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-6px);background:var(--orange);color:#fff;font-weight:700;font-size:14px;padding:9px 14px;border-radius:16px 16px 16px 4px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;white-space:nowrap;box-shadow:0 10px 24px rgba(255,99,30,.35)}
.hint.show{opacity:1;transform:translate(-50%,0)}

/* animals */
.animal{position:absolute;transform:translate(-50%,-100%);min-width:44px;z-index:4;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .2s;opacity:0;pointer-events:none}
.animal.in{opacity:1;pointer-events:auto;animation:spritein .55s cubic-bezier(.2,1.3,.3,1) both;animation-delay:var(--in,0s)}
.animal.ph{opacity:1;pointer-events:auto}
@keyframes spritein{from{opacity:0;transform:translate(-50%,-100%) scale(.6)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.animal::before{content:"";position:absolute;left:50%;bottom:-2%;width:86%;height:14%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(20,10,30,.35),rgba(20,10,30,0));pointer-events:none;z-index:-1}
.animal{padding:10px 10px 4px;margin:-10px -10px -4px;box-sizing:content-box}
.animal img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(20,10,30,.18)) drop-shadow(0 0 1.5px rgba(255,255,255,.55))}
.water .animal::before{display:none} .water .animal img{filter:drop-shadow(0 10px 14px rgba(0,40,90,.35))}
.animal .idle{display:block;transform-origin:50% 100%;animation:var(--anim,bob) var(--d,4s) ease-in-out var(--delay,0s) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
@keyframes head{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}70%{transform:rotate(1.2deg)}}
@keyframes peck{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(3deg) translateY(2%)}40%{transform:rotate(0)}60%{transform:rotate(2deg) translateY(2%)}80%{transform:rotate(0)}}
@keyframes swim{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-4%) translateY(-3%) rotate(-2deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6%) rotate(1.5deg)}}
@keyframes waddle{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(3%) rotate(2deg)}75%{transform:translateX(-3%) rotate(-2deg)}}
.animal:hover{transform:translate(-50%,-100%) scale(1.07);filter:brightness(1.05) drop-shadow(0 0 14px rgba(255,255,255,.55));z-index:5}
.animal:hover .idle{animation-play-state:paused}
.animal.ph{width:auto !important}
.animal.ph .mark{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.8);border:2px dashed var(--violet);font-size:10px;font-weight:700;color:var(--violet);text-align:center;line-height:1.1;padding:6px}
.animal .badge{position:absolute;right:-4px;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s cubic-bezier(.2,1.4,.3,1);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.animal .badge svg.i{width:15px;height:15px;stroke-width:3}
.animal.below .word{bottom:auto;top:calc(100% + 6px);border-radius:16px 16px 16px 4px}
.animal.below .word{transform:translate(-50%,-10px) scale(.9)} .animal.below.found .word{transform:translate(-50%,0) scale(1)}
.animal .word{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,10px) scale(.9);background:var(--green);color:#fff;font-family:var(--font-head);font-weight:700;font-size:17px;padding:7px 14px;border-radius:16px 16px 16px 4px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s cubic-bezier(.2,1.3,.3,1);box-shadow:0 10px 22px rgba(0,212,65,.4)}
.animal.found{pointer-events:none;filter:none;z-index:5}
.animal.found .idle{animation:none}
.animal.found .badge{opacity:1;transform:none}
.animal.found .word{opacity:1;transform:translate(-50%,0) scale(1)}
.animal.found::before{background:radial-gradient(closest-side,rgba(0,212,65,.55),rgba(0,212,65,0))}
.animal.pop{animation:pop .6s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(1)}40%{transform:translate(-50%,-100%) scale(1.16)}100%{transform:translate(-50%,-100%) scale(1)}}
.animal.no{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(-50%,-100%)}25%{transform:translate(calc(-50% - 6px),-100%) rotate(-2deg)}75%{transform:translate(calc(-50% + 6px),-100%) rotate(2deg)}}
.animal .lbl{display:none} .dev .animal .lbl{display:block;position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:8px;white-space:nowrap}
.glow{position:absolute;left:50%;top:60%;width:60%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(0,212,65,.45) 40%,transparent 70%);animation:glow .9s ease-out forwards;z-index:-1}
@keyframes glow{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:spark .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}

/* completion */
.done{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(20,10,50,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .35s;padding:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:#fff;border-radius:var(--r) var(--r) var(--r) 8px;padding:28px 30px;width:min(560px,100%);box-shadow:0 34px 80px rgba(0,0,0,.35);text-align:center;animation:cardin .5s .1s cubic-bezier(.2,1.2,.3,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.card h2{font-size:clamp(26px,4vw,36px);letter-spacing:-.6px}
.card p{margin:8px 0 18px;color:var(--ink2);font-size:16px}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.wchip{display:inline-flex;align-items:center;gap:8px;background:var(--lav);padding:8px 8px 8px 14px;border-radius:999px;font-weight:700;font-size:15px;transition:background .15s}
.wchip:hover{background:var(--lav2)}
.wchip .sp{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center} .wchip .sp svg.i{width:16px;height:16px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.foot{margin-top:14px;color:var(--muted);font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:720px){
  .wrap{padding:12px 12px 32px}
  .intro{margin:20px 0 16px}
  .stage{border-radius:18px}
  .task{padding:6px 6px 6px 14px;gap:8px} .task .txt{font-size:14px} .speak{width:44px;height:44px} .speak svg.i{width:20px;height:20px}
  .task .dots{display:none}
  .animal .word{font-size:14px;padding:6px 11px}
  .card{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.animal.out{animation:spriteout .4s ease-in both;pointer-events:none}
@keyframes spriteout{to{opacity:0;transform:translate(-50%,-100%) scale(.6)}}
.task .rnd{color:var(--muted);font-weight:700;font-size:13px;margin-left:6px;white-space:nowrap}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;background:#fff;color:var(--ink);font-family:var(--font-head);font-weight:700;font-size:22px;padding:16px 26px;border-radius:24px 24px 24px 6px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:toast 1.6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.9)}15%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.card .n{display:inline-block;background:var(--lav);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;margin-bottom:10px}

.speak.missing{animation:blink .3s 3}
@keyframes blink{50%{opacity:.35}}
/* ---------- floor contact shadow for furniture ---------- */
.animal.floor::before{content:'';position:absolute;left:8%;right:8%;bottom:-1.5%;height:9%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,10,30,.28),rgba(20,10,30,0) 70%);z-index:-1;pointer-events:none}
/* ---------- section chooser ---------- */
.sections{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.sec{text-align:left;display:grid;gap:2px;padding:14px 18px;min-width:220px;border-radius:20px 20px 20px 6px;background:var(--lav);border:1.5px solid transparent;transition:background .15s,border-color .15s,transform .15s}
.sec b{font-family:var(--font-head);font-size:18px} .sec small{color:var(--ink2);font-size:13px}
.sec.on{background:#fff;border-color:var(--violet);box-shadow:0 10px 26px rgba(135,75,248,.14)}
.sec:hover{transform:translateY(-2px)}
/* ---------- language switch ---------- */
.topr{display:flex;align-items:center;gap:14px}
.lang{display:inline-flex;background:var(--lav);border-radius:999px;padding:3px;gap:2px}
.lang button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink2);letter-spacing:.3px;transition:background .15s,color .15s}
.lang button.on{background:var(--violet);color:#fff}
/* ---------- vocabulary preview ---------- */
.pv-text h1 .room-tr{font-weight:500;color:var(--violet);font-size:.55em;letter-spacing:0;white-space:nowrap}
@media (max-width:720px){.pv-text h1 .room-tr{display:block;white-space:normal;font-size:.5em;margin-top:.15em}}
.pv{margin-top:18px}
.pv-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;align-items:center;margin-bottom:26px}
.pv-cover{aspect-ratio:16/10;border-radius:var(--r) var(--r) var(--r) 8px;overflow:hidden;background:var(--lav);box-shadow:0 20px 44px rgba(20,10,50,.14)}
.pv-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pv-kicker{display:inline-block;color:var(--violet);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.pv-text h1{font-size:clamp(34px,4.6vw,52px);letter-spacing:-1.2px;line-height:1}
.pv-text p{margin:12px 0 20px;color:var(--ink2);font-size:16px;line-height:1.45;max-width:40ch}
.pill.big{padding:14px 24px;font-size:17px}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vw{display:grid;grid-template-columns:1fr auto;grid-template-areas:"en sp" "tr sp";align-items:center;column-gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 12px 12px 16px;transition:border-color .15s,transform .15s,box-shadow .15s}
.vw:hover{border-color:#D9CCFB;transform:translateY(-2px);box-shadow:0 10px 24px rgba(135,75,248,.12)}
.vw .en{grid-area:en;font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:-.2px}
.vw .trn{grid-area:tr;color:var(--violet);font-size:14px;font-weight:500;margin-top:1px}
.vw .sp{grid-area:sp;width:34px;height:34px;border-radius:50%;background:var(--lav);color:var(--violet);display:grid;place-items:center} .vw .sp svg.i{width:17px;height:17px}
.vw:hover .sp{background:var(--violet);color:#fff}
/* ---------- feedback zone inside the task bar ---------- */
.task .tz{position:relative;display:grid;align-items:center;min-width:220px;min-height:26px}
.task .tz>*{grid-area:1/1;transition:opacity .22s,transform .25s}
.task .txt{font-size:17px}
.task .ld{color:var(--muted);font-weight:600;font-size:15px;opacity:0;transform:translateY(6px)}
.task.loading .txt{opacity:0;transform:translateY(-6px)} .task.loading .ld{opacity:1;transform:none}
.task.loading .speak{opacity:.45;pointer-events:none}
.task .fb{display:inline-flex;align-items:center;gap:8px;opacity:0;transform:translateY(6px);white-space:nowrap}
.task .fb .ok{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:inline-grid;place-items:center} .task .fb .ok svg.i{width:13px;height:13px;stroke-width:3}
.task .fb .en{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:-.2px;text-transform:capitalize}
.task .fb .sep{color:var(--muted)} .task .fb .trn{color:var(--violet);font-weight:500;font-size:15px}

/* image loader: local file → hosted render, each source retried twice (transient network errors), then a placeholder.
   onload(img) fires when the picture is actually decoded, so a round can wait for its targets. */
function pic(srcs,cls,onmiss,onload){
  const i=new Image(); i.alt=''; i.draggable=false; i.decoding='async'; if(cls) i.className=cls; let k=0, tries=0;
  i.onload=()=>{ i.classList.add('ready'); onload&&onload(i); };
  i.onerror=()=>{ tries++; if(tries<3){ setTimeout(()=>{ i.src=srcs[k]+(srcs[k].includes('?')?'&':'?')+'r='+tries; },600*tries); return; }
    tries=0; k++; if(k<srcs.length){ i.src=srcs[k]; } else { i.remove(); onmiss&&onmiss(); } };
  i.src=srcs[0]; return i;
}

/* ================= VOICE — single source of truth for vocabulary audio =================

   result that belongs to an older play() is ignored. A play() interrupted by a newer play() rejects with

const Voice=(()=>{

    b.style.left=p.x+'%'; b.style.top=p.y+'%'; b.style.width=p.w+'%';
    b.style.setProperty('--anim',a.anim||'bob'); b.style.setProperty('--d',(3.6+Math.random()*2.2).toFixed(2)+'s'); b.style.setProperty('--delay',(-Math.random()*5).toFixed(2)+'s'); b.style.setProperty('--in',(.05+i*.06).toFixed(2)+'s');
    const wrap=document.createElement('span'); wrap.className='idle'; pending++;
    const done=()=>{ pending--; if(pending===0) ready(); };
    wrap.appendChild(pic(animalSrcs(a),null,()=>{ b.classList.add('ph'); wrap.innerHTML=`<span class="mark">${esc(a.id)}.png</span>`; done(); },()=>{ b.classList.add('in'); done(); }));
    b.appendChild(wrap);
    b.insertAdjacentHTML('beforeend',`<span class="badge">${ICON.check}</span><span class="lbl">${esc(a.word)}</span>`);
    stage.appendChild(b);
  });
  if(!pending) ready();
  setTimeout(()=>{ if(!announced && G && G.tok===tok){ $$('.animal:not(.out)').forEach(b=>b.classList.add('in')); ready(); } },8000); // never wait forever
}
const current=()=>G.order[G.idx];
/* the ONLY two ways a vocabulary word is spoken: announce() when a target becomes current (delayed so the
   scene can settle), and replay() when the learner asks for it. Both go through Voice, so nothing overlaps. */
function announce(delay){ if(!G||G.idx>=G.order.length) return; const tok=G.tok,idx=G.idx,r=G.r,a=current();
  Voice.schedule(a,delay||0,()=>G&&G.tok===tok&&G.idx===idx&&G.r===r); }
function replay(){ if(!G||G.lock||G.idx>=G.order.length||$('.done')) return; Voice.play(current()); }
function sparkle(el){
  const cols=['#874BF8','#0AAFFF','#00D441','#FFAD00','#FF631E','#fff'];
  for(let i=0;i<8;i++){ const s=document.createElement('i'); s.className='spark'; const ang=Math.PI*2*i/8+Math.random()*.6, r=60+Math.random()*50;
    s.style.background=cols[i%cols.length]; s.style.setProperty('--dx',Math.cos(ang)*r+'px'); s.style.setProperty('--dy',Math.sin(ang)*r-20+'px'); el.appendChild(s); setTimeout(()=>s.remove(),900); }
  const g=document.createElement('span'); g.className='glow'; el.appendChild(g); setTimeout(()=>g.remove(),1000);
}
function pick(id,el){
  if(!G||G.lock||G.found.has(id)) return;
  const target=current();
  if(id===target.id){
    G.lock=true; G.found.add(id); G.foundAll.push(target); Voice.stop(); tick();
    el.classList.add('found','pop'); sparkle(el);
    $$('.task .dots i')[G.found.size-1].classList.add('on');
    showFeedback(target);
    const tok=G.tok; setTimeout(()=>{ if(!G||G.tok!==tok) return; G.idx++; G.lock=false; if(G.idx<G.order.length) announce(150); else nextRound(); },1500);
  } else {
    // wrong animal: visual feedback only — the current target stays, no automatic re-announcement
    el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
    const h=$('.hint'); h.textContent='Not this one — tap \uD83D\uDD0A to hear the word again'; h.classList.add('show'); clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove('show'),1600);
    const sp=$('.task .speak'); if(sp){ sp.classList.remove('nudge'); void sp.offsetWidth; sp.classList.add('nudge'); }
  }
}
/* feedback lives in the task bar: "✓ horse · лошадь" for 1.4 s, then the instruction returns */
function showFeedback(a){ const t=$('.task'); if(!t) return; $('.fb .en',t).textContent=a.word; $('.fb .trn',t).textContent=tr(a); t.classList.add('show-fb');
  clearTimeout(t._fb); t._fb=setTimeout(()=>t.classList.remove('show-fb'),1400); }
function nextRound(){
  G.r++;
  if(G.r>=G.rounds.length){ finish(); return; }
  const t=document.createElement('div'); t.className='toast'; t.textContent=`Great! Round ${G.r+1} of ${G.rounds.length}`; $('#stage').appendChild(t);
  Voice.stop(); const tok=G.tok; setTimeout(()=>{ t.remove(); if(G&&G.tok===tok) loadRound(); },1500);
}
function finish(){
  Voice.stop(); const {env}=G;
  const d=document.createElement('div'); d.className='done';
  d.innerHTML=`<div class="card"><span class="n">${esc(env.name)}</span><h2>You found all ${G.pool.length} ${env.section==='food'?'foods':(env.section==='clothes'||env.section==='house'||env.section==='body')?'words':'animals'}!</h2><p>Tap a word to hear it again.</p>
    <div class="words">${G.pool.map(a=>`<button class="wchip" data-say="${a.id}"><span>${esc(a.word)}<em data-tr="${a.id}">${esc(tr(a))}</em></span><span class="sp">${ICON.sound}</span></button>`).join('')}</div>
    <div class="btns"><button class="pill" data-again>Play again ${ICON.play}</button><button class="pill ghost" data-home>${env.section==='animals'?'Other animals':'Other places'}</button></div></div>`;
  $('#stage').appendChild(d);
}
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.hasAttribute('data-home')){ Voice.stop(); G=null; renderHome(); window.scrollTo(0,0); return; }
  if(t.dataset.env){ renderPreview(t.dataset.env); window.scrollTo(0,0); return; }
  if(t.dataset.start){ start(t.dataset.start); window.scrollTo(0,0); return; }
  if(t.dataset.lang){ setLang(t.dataset.lang); return; }
  if(t.dataset.section){ setSection(t.dataset.section); renderHome(); return; }
  if(t.hasAttribute('data-replay')){ replay(); t.blur(); return; }
  if(t.hasAttribute('data-again')){ start(G.env.id); return; }
  if(t.dataset.say){ Voice.play(byId[t.dataset.say]); return; }
  if(t.classList.contains('animal')){ pick(t.dataset.id,t); return; }
});
document.addEventListener('keydown',e=>{ if(e.key===' '&&G&&!$('.done')&&!e.repeat){ e.preventDefault(); if(document.activeElement&&document.activeElement.tagName==='BUTTON') document.activeElement.blur(); replay(); } });
/* #audio — audit page: every word with its own play button (recording → id → word), for listening checks */
function renderAudioAudit(){ setTint(null);
  app.innerHTML=`<div class="wrap">${header(false)}<div class="intro"><div><h1>Audio audit</h1><p>${ANIMALS.filter(a=>HOSTED.audio[a.id]).length} recordings · tap to play. Each word has exactly one file, keyed by the animal id.</p></div></div>
  <div class="words" style="justify-content:flex-start">${ANIMALS.filter(a=>HOSTED.audio[a.id]).map(a=>`<button class="wchip" data-say="${a.id}" title="${HOSTED.audio[a.id]}"><span>${esc(a.word)}<em data-tr="${a.id}">${esc(tr(a))}</em></span><span class="sp">${ICON.sound}</span></button>`).join('')}</div></div>`; }
if(location.hash==='#audio') renderAudioAudit(); else renderHome();
</script>
</body>
