<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JTS Placement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Токены приведены к палитре приложения (src/styles.css): тест открывается
   внутри него, и прежний экран уровня выглядел именно так — фиолетовый
   #9047ff, ink #171326, светлая подложка карточки. Акцентные cyan/green/
   orange/gold оставлены как есть: раннер метит ими блоки и статусы, в
   приложении прямых аналогов у них нет. */
:root {
  --violet: #9047ff; --cyan: #0AAFFF; --green: #00D441; --orange: #FF631E; --gold: #FFAD00;
  --ink: #171326; --muted: #8b8a97; --bg: #f4f5f7; --card: #ffffff; --line: #e6e8ef;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.45;
}
#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 14px 14px; }

.hdr { display: flex; align-items: center; gap: 10px; padding: 12px 2px 8px; flex-wrap: wrap; }
/* Логотип приложения (src/components/Logo.jsx): та же начертание и цвет.
   Элемент остаётся кликабельным — по нему открывается режим преподавателя. */
.brand { font-weight: 800; font-size: 18px; color: var(--violet); letter-spacing: -.2px; }
.timers { margin-left: auto; display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.timers b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
#t-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width .2s linear; }
.bname { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--cyan); margin: 2px 2px 8px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 10px rgba(135, 75, 248, .06); }
.ftr { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; font-size: 13px; color: var(--muted); }
.tmode input { accent-color: var(--violet); }
.lang-mini { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font: inherit; font-size: 12px; color: var(--muted); }

h1 { font-size: 26px; margin-bottom: 8px; }
h2 { font-size: 21px; margin-bottom: 6px; }
h3 { font-size: 15px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.hint { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.stem { font-size: 19px; margin: 6px 0 14px; }
.stem-src { color: var(--muted); font-size: 16px; }
.stem-spk { font-style: italic; }
.kw { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.kw b { color: var(--orange); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.btn {
  display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
  border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 12px; padding: 12px 14px; transition: border-color .15s, background .15s;
}
.btn:active { background: #f1ecfd; }
.btn:disabled { opacity: .45; cursor: default; }
.opt:hover { border-color: var(--violet); }
.btn-primary { background: var(--violet); border-color: var(--violet); color: #fff; text-align: center; font-weight: 700; margin-top: 12px; }
.btn-ghost { text-align: center; margin-top: 8px; }
.btn-audio { display: inline-block; width: auto; background: var(--cyan); border-color: var(--cyan); color: #fff; font-weight: 700; }
.row2 { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }

.aud { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.plays { font-size: 13px; color: var(--muted); }
.plays b { color: var(--orange); }

.inp { width: 100%; font: inherit; font-size: 18px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 4px; }
.inp:focus { outline: none; border-color: var(--violet); }
.inp-ta { resize: vertical; min-height: 90px; }

.lexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 8px 0 4px; }
.lexw { display: block; }
.lexw input { position: absolute; opacity: 0; }
.lexw span { display: block; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 8px; font-size: 15px; text-align: center; cursor: pointer; transition: all .15s; }
.lexw input:checked + span { background: var(--violet); border-color: var(--violet); color: #fff; }

.rtext { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: 15px; }
.rtext summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.rbody { margin-top: 8px; white-space: normal; }

.tpanel { border: 1.5px dashed var(--gold); border-radius: 12px; background: #fffaf0; font-size: 13px; padding: 10px 12px; margin-top: 12px; }
.tpanel ul { margin: 6px 0 6px 18px; }
.fb { font-weight: 700; margin-top: 12px; }
.fb-ok { color: var(--green); }
.fb-no { color: var(--orange); }

.pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 10px; letter-spacing: .5px; }
.pill-pilot { background: var(--gold); color: #4d3800; }
.pill-warn { background: #fff3d6; color: #7a5b00; margin-bottom: 10px; }
.callout { border-left: 4px solid var(--orange); background: #fff4ee; padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 15px; margin: 10px 0; }

.recrow { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
.reclight { color: var(--orange); font-weight: 700; animation: blink 1.2s step-end infinite; }
@keyframes blink { 50% { opacity: .3; } }

.reslvl { font-size: 56px; color: var(--violet); }
.reslvl-A0, .reslvl-A1 { color: var(--cyan); }
.reslvl-C1, .reslvl-C2 { color: var(--green); }
.band { position: relative; height: 34px; background: var(--line); border-radius: 8px; margin: 14px 0 4px; }
.band-fill { position: absolute; top: 0; height: 18px; background: linear-gradient(90deg, var(--violet), var(--cyan)); border-radius: 8px; }
.band-ticks { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); padding: 0 3px; }
.skrow { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 7px 2px; font-size: 15px; }
.flags { margin: 4px 0 0 18px; font-size: 14px; }
.flags li { margin-bottom: 4px; }

@media (min-width: 480px) { .row2 { flex-direction: row; } .row2 .btn { flex: 1; } }

/* --- навигация и новые элементы --- */
.qcount { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.navrow { display: flex; gap: 8px; margin-top: 14px; }
.btn-nav { flex: 1; text-align: center; }
.btn-nav-next { border-color: var(--violet); color: var(--violet); font-weight: 700; }
.btn-fin { flex: 1; }
.opt.sel { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn-idk { color: var(--muted); border-style: dashed; }
.btn-idk.sel { background: var(--orange); border-color: var(--orange); color: #fff; }
.stem-word { font-size: 30px; font-weight: 700; color: var(--violet); margin: 2px 0 14px; }
.audmsg { font-size: 13px; color: var(--orange); margin-top: 6px; }
.recok { color: var(--green); font-weight: 700; font-size: 20px; margin: 14px 0; }
.congrats { color: var(--violet); }

/* --- плеер аудирования --- */
.player { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
.player-row { display: flex; align-items: center; gap: 10px; }
.pl-btn { flex: 0 0 auto; }
.pl-seek { flex: 1; accent-color: var(--cyan); min-width: 60px; }
.pl-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.player-sub { margin-top: 6px; }
.lq { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.stem-lq { font-size: 17px; }

/* --- финал --- */
.fbtext { font-size: 16px; margin-bottom: 4px; }
.welcome {
  background: linear-gradient(120deg, var(--violet), var(--cyan));
  color: #fff; border-radius: 16px; padding: 18px 16px; margin: 16px 0;
  box-shadow: 0 6px 18px rgba(135, 75, 248, .25);
}
.welcome-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.welcome-body { font-size: 15px; line-height: 1.5; opacity: .96; }

.btn-letsgo {
  background: linear-gradient(120deg, var(--violet), var(--cyan));
  border: none; color: #fff; text-align: center; font-weight: 700; font-size: 18px;
  padding: 15px; border-radius: 14px; margin-top: 8px;
  box-shadow: 0 6px 18px rgba(10, 175, 255, .3);
}
.btn-letsgo:active { transform: scale(.98); }
.tpanel .btn { margin-top: 8px; }

.advice { margin: 4px 0 4px 18px; font-size: 15px; }
.advice li { margin-bottom: 8px; }
.ftr-note { font-size: 12px; color: var(--gold); font-weight: 700; }

/* --- v2: выбор варианта --- */
.vcard { display: block; }
.vtitle { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 17px; }
.vtime { color: var(--cyan); font-size: 14px; white-space: nowrap; margin-left: 10px; }
.vdesc { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }

/* --- v2: плашки (порядок слов, банк слов) --- */
.tilebank, .tileout { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.tileout { min-height: 46px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 6px; align-items: center; }
.tile { display: inline-block; width: auto; padding: 8px 12px; font-size: 15px; border-radius: 10px; }
.tile-sel { background: var(--violet); border-color: var(--violet); color: #fff; }
.tile-empty { color: var(--muted); padding: 4px 8px; }
.seq-your { margin-bottom: 2px; }

/* --- v2: T / F / Not stated --- */
.tfrow { border-top: 1px solid var(--line); padding: 10px 0; }
.tfstem { font-size: 16px; margin-bottom: 8px; }
.tfbtns { display: flex; gap: 6px; }
.tfb { flex: 1; width: auto; text-align: center; padding: 8px 6px; font-size: 14px; }
.tfb.sel { background: var(--violet); border-color: var(--violet); color: #fff; }

/* --- v2: пропуски с банком слов --- */
.bftext { line-height: 2.1; }
.gap { display: inline-block; width: auto; padding: 4px 10px; margin: 0 2px; font-size: 15px;
  border-style: dashed; color: var(--muted); border-radius: 8px; }
.gap-filled { border-style: solid; border-color: var(--violet); color: var(--violet); font-weight: 700; }

/* --- v2: пары --- */
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.mcol { display: flex; flex-direction: column; gap: 6px; }
.mitem { font-size: 14px; padding: 10px 10px; }
.mitem.sel { border-color: var(--orange); background: #fff4ee; }
.mitem.mlinked { border-color: var(--green); background: #f0fff4; }

/* --- v2: видеоклипы --- */
.vclip { width: 100%; border-radius: 12px; background: #000; margin-bottom: 10px; }
.proflvl { color: var(--violet); }

</style>
</head>

// ============================================================
// JTS_BRIDGE — мост наружу. Единственная добавка к раннеру: сам тест,
// его банк и подсчёт уровня остались как есть. Отправляем только результат
// S.result() и только родителю, который нас встроил; при открытии файла
// напрямую (без iframe) не делаем ничего.
// ============================================================
window.JTS_BRIDGE = (function () {
  var embedded = window.parent && window.parent !== window;
  return {
    send: function (type, result) {
      if (!embedded) return;
      try {
        window.parent.postMessage({ source: 'jts-placement', type: type, result: result }, '*');
      } catch (e) {
        /* родитель из другого origin и не слушает — тест продолжает работать */
      }
    },
  };
})();
</script>

// ============================================================
// BANK_PATCHES — результат ручного аудита дистракторов (см. PLACEMENT_SPEC.md,
// раздел «Аудит дистракторов»). Банк items.json вшит без изменений; патчи
// применяются при загрузке функцией applyBankPatches() и перечислены в экспорте
// сессии. Ничего не переписано молча.
// ============================================================
const BANK_PATCHES = [
  // --- A. Семантические кластеры (два дистрактора снимаются разом) ---
  {
    id: 'r-a2-01a', kind: 'option', optIndex: null, // индекс ищется по тексту
    findText: 'The canteen will be open longer in the evening.',
    replace: { t: 'The kitchen will take orders later.', m: 'Взял деталь последнего абзаца и перевернул её' },
    reason: 'Кластер с «The canteen will close later» — оба означают «дольше/позже», снимаются одним решением'
  },
  {
    id: 'l-c1-03a', kind: 'option', optIndex: null,
    findText: 'Employment data rule a recession out.',
    replace: { t: 'Consumer spending will decide whether there is a recession.', m: 'Возвёл пример индикатора в критерий ответа' },
    reason: 'Кластер с «A recession is unlikely» — оба читаются как «нет», снимаются разом'
  },
  // --- C. Грамматически неправдоподобный дистрактор ---
  {
    id: 'rt-b2-01', kind: 'option', optIndex: null,
    findText: 'have known',
    replace: { t: 'to have known', m: 'Перфектный инфинитив после глагола, требующего герундий' },
    reason: '«She denied have known» не производится студентами — балласт; «to have known» — реальная ошибка'
  },
  // --- D. Пропущенные допустимые ответы (верный ответ не должен считаться ошибкой) ---
  { id: 'u-a2-01', kind: 'answer', add: ['less'], reason: '«less expensive than» полностью корректно' },
  { id: 'u-a2-05', kind: 'answer', add: ['may', 'can'], reason: '«You may not smoke» / «You can not smoke» корректны' },
  { id: 'u-b1-05', kind: 'answer', add: ['calling', 'booking', 'ordering', 'hiring', 'sharing', 'catching'], reason: 'suggest + любой уместный герундий' },
  { id: 'u-b1-06', kind: 'answer', add: ['little'], reason: '«There is little point» корректно' },
  { id: 'u-b1-12', kind: 'answer', add: ['upon'], reason: 'depend upon' },
  { id: 'u-b2-03', kind: 'answer', add: ['Nonetheless', 'Yet'], reason: 'уступительные коннекторы того же слота' },
  { id: 'u-c1-02', kind: 'answer', add: ['however', 'nevertheless', 'nonetheless', 'still'], reason: 'слот после «;» принимает и обычные уступительные — отклонять верное нельзя; сужение конструкта решается на пилоте' },
  { id: 'u-c1-04', kind: 'answer', add: ['despite', 'notwithstanding'], reason: '«taken despite the objections» корректно' },
  { id: 'u-c1-08', kind: 'answer', add: ['is little likelihood that', 'is little likelihood'], reason: 'эквивалентная реализация с LITTLE' },
  // --- D*. Стем без сигнала отрицания ---
  {
    id: 'u-a1-04', kind: 'stem',
    findText: 'He ___ like coffee.',
    replace: 'He ___ like coffee. He never drinks it.',
    reason: 'Без контекста «does/would/might» тоже грамматичны; вторая фраза мотивирует отрицание, конструкт сохранён'
  }
];

function applyBankPatches(bank) {
  const applied = [];
  const byId = {};
  bank.items.forEach(it => { byId[it.id] = it; });
  BANK_PATCHES.forEach(p => {
    const it = byId[p.id];
    if (!it) return;
    if (p.kind === 'option' && it.options) {
      const i = it.options.findIndex(o => o.t === p.findText);
      if (i >= 0 && i !== it.key) { it.options[i] = { t: p.replace.t, m: p.replace.m }; applied.push(p.id); }
    } else if (p.kind === 'answer' && Array.isArray(it.answer)) {
      p.add.forEach(a => { if (!it.answer.includes(a)) it.answer.push(a); });
      applied.push(p.id);
    } else if (p.kind === 'stem' && it.stem === p.findText) {
      it.stem = p.replace; applied.push(p.id);
    }
  });
  return applied;

ou.\n\nAigerim","wordCount":86,"avgSentenceLen":9.6,"offList2k":null},{"id":"r-b1-01","level":"B1","topic":"заметка о работе курьером","text":"When Timur started delivering food by bicycle, he assumed the hardest part would be the weather. In fact, he says, the weather was the easiest thing to plan for: you buy the right jacket and the problem is solved.\n\nWhat he had not expected was how much of the job is waiting. Restaurants run late, customers do not answer their phones, and the app keeps counting the minutes as if the courier were responsible for all of it.\n\nHe still recommends the work to students, but with one condition. \"Treat it as a job with bad hours, not as free time that happens to pay,\" he says. \"People who think of it as flexible are the ones who end up working every evening.\"","wordCount":123,"avgSentenceLen":15.4,"offList2k":null},{"id":"r-b1-02","level":"B1","topic":"изменение правил в библиотеке","text":"From September, the city library will no longer charge fines for late returns. Instead, borrowers who keep a book for more than three weeks past the due date will simply be unable to borrow anything else until they bring it back.\n\nThe library says the change is not about being generous. Research from other cities suggests that fines mostly affect readers who were already struggling to visit regularly, while readers who could easily pay were never much deterred by them.\n\nThere is one exception. Items from the reference collection, which cannot normally leave the building, will keep their existing penalty, because a single missing volume can make a whole set useless.","wordCount":111,"avgSentenceLen":18.5,"offList2k":null},{"id":"r-b2-01","level":"B2","topic":"колонка о городском транспорте","text":"Every few years a city announces that it has solved congestion, and every few years the solution turns out to have been a redistribution. Build a wider road and the traffic that was previously deterred by the journey time reappears to fill it; this is well documented enough to have its own name, and yet it continues to surprise the people who commission the roads.\n\nWhat is less often said is that the same logic applies in the other direction. Remove a lane and some of the traffic does not divert — it evaporates. Trips that were marginal simply stop being made, or get made differently.\n\nNone of this makes lane removal automatically correct. It does mean that projections which assume a fixed quantity of traffic, to be pushed from one street to another, are describing a city that does not exist.","wordCount":141,"avgSentenceLen":20.1,"offList2k":null},{"id":"r-b2-02","level":"B2","topic":"рецензия на нон-фикшн","text":"The premise of this book is that most organisational failure is not caused by bad decisions but by decisions nobody remembers making. It is a good premise, and the first hundred pages deliver on it with unusual precision: the case studies are specific, the interviews are recent, and the author resists the temptation to arrive at a single villain.\n\nThe second half is harder to defend. Having established that responsibility is usually diffuse, the author spends four chapters recommending interventions that assume a single person with the authority to implement them. The tension is never acknowledged, let alone resolved.\n\nReaders looking for a diagnosis will find one of the best available. Readers looking for a cure should be warned that the prescription belongs to a different book.","wordCount":127,"avgSentenceLen":18.1,"offList2k":null},{"id":"r-c1-01","level":"C1","topic":"методологическая заметка","text":"A recurring difficulty in the literature is that the construct being measured shifts quietly between studies while the label stays the same. Two papers report on \"engagement\"; one operationalises it as time on task, the other as self-reported interest. Both are defensible choices. The problem arises only when a meta-analysis pools them, at which point the aggregate is a number about nothing in particular.\n\nThe conventional response is to demand tighter definitions in advance. That is reasonable, but it underestimates how much of the drift is invisible even to the researchers involved: a definition written in 2015 is read in 2024 through a decade of intervening usage.\n\nA more tractable remedy is procedural rather than conceptual. If the instrument is reported in full, later readers can reconstruct what was actually measured, whatever the paper chose to call it.","wordCount":136,"avgSentenceLen":17.0,"offList2k":null},{"id":"r-c1-02","level":"C1","topic":"эссе о профессиональной репутации","text":"There is a species of professional advice that survives not because it works but because failure is unattributable. Tell a hundred people to network relentlessly; the twenty who succeed will credit the advice, and the eighty who do not will conclude, with some encouragement from the literature, that they networked insufficiently. The counsel is thereby insulated from evidence in both directions.\n\nWhat distinguishes genuinely useful guidance is not that it always works — nothing does — but that it specifies the conditions under which it should be abandoned. A recommendation with no failure mode attached is not a recommendation; it is a slogan with a bibliography.\n\nThis is worth saying because the slogans are not harmless. They occupy the attention that might otherwise be spent on advice narrow enough to be wrong.","wordCount":130,"avgSentenceLen":18.6,"offList2k":null}],"writingRubric":{"criteria":[{"id":"task","name":"Выполнение задачи","scale":{"0":"не отвечает на задание или пусто","1":"отвечает частично, опоры не использованы","2":"отвечает, использована минимум одна опора","3":"отвечает полностью, использованы все опоры"}},{"id":"form","name":"Грамматическая форма целевой конструкции","scale":{"0":"конструкция отсутствует","1":"попытка, форма неверна","2":"форма верна с одной ошибкой","3":"форма верна"}},{"id":"range","name":"Лексический const MANIFEST = {"note":"B2–C2 — из manifest_b2c2_patch.json; A1–B1 — пути по конвенции + транскрипты из jts-bank/_pipeline/scripts.json, playsAllowed=2.","audioBase":"jts-bank/","sources":[{"id":"src-l-a1-01","level":"A1","file":"a1/src-l-a1-01.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"M_GB","text":"Hi, I'm Marco. I work in a small hotel near the station."},{"i":1,"speaker":"M_GB","text":"I start at seven in the morning and I finish at three."},{"i":2,"speaker":"M_GB","text":"I don't work on Sundays. On Sunday I usually visit my grandmother."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a1-02","level":"A1","file":"a1/src-l-a1-02.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"My flat is very small."},{"i":1,"speaker":"F_GB","text":"There is one bedroom, a kitchen and a bathroom."},{"i":2,"speaker":"F_GB","text":"There isn't a garden, but there is a big window in the living room."},{"i":3,"speaker":"F_GB","text":"I like it because it's near the park."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a1-03","level":"A1","file":"a1/src-l-a1-03.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"Excuse me, how much is this blue jacket?"},{"i":1,"speaker":"M_GB","text":"It's twenty-five pounds."},{"i":2,"speaker":"F_GB","text":"And the black one?"},{"i":3,"speaker":"M_GB","text":"That one is cheaper. Nineteen pounds."},{"i":4,"speaker":"F_GB","text":"OK. I'll take the black one, please."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a1-04","level":"A1","file":"a1/src-l-a1-04.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_US","text":"It's very cold today and it's raining."},{"i":1,"speaker":"F_US","text":"I can't go to the park with the children."},{"i":2,"speaker":"F_US","text":"So we are staying at home."},{"i":3,"speaker":"F_US","text":"We're watching a film and making pizza."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a1-05","level":"A1","file":"a1/src-l-a1-05.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"M_US","text":"Excuse me, is there a bank near here?"},{"i":1,"speaker":"F_GB","text":"Yes. Go straight and then turn right at the hospital."},{"i":2,"speaker":"F_GB","text":"The bank is next to a small coffee shop."},{"i":3,"speaker":"M_US","text":"Thank you very much."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a1-06","level":"A1","file":"a1/src-l-a1-06.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"This is a photo of my family."},{"i":1,"speaker":"F_GB","text":"My mother is a teacher and my father works in a shop."},{"i":2,"speaker":"F_GB","text":"I have got one sister. She is eleven."},{"i":3,"speaker":"F_GB","text":"We have got a big dog. His name is Rocky."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a2-01","level":"A2","file":"a2/src-l-a2-01.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"Attention passengers. The four fifteen service to Leeds will now leave from platform six, not platform two."},{"i":1,"speaker":"F_GB","text":"The train is running about ten minutes late because of engineering work."},{"i":2,"speaker":"F_GB","text":"Passengers travelling to Manchester should change at Leeds."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a2-02","level":"A2","file":"a2/src-l-a2-02.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"M_GB","text":"Last summer we went camping in the mountains."},{"i":1,"speaker":"M_GB","text":"The first two days were terrible. It rained all the time and we couldn't cook outside."},{"i":2,"speaker":"M_GB","text":"But then the weather changed and the last three days were really beautiful."},{"i":3,"speaker":"M_GB","text":"I definitely want to go back next year."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a2-03","level":"A2","file":"a2/src-l-a2-03.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_US","text":"Hi Daniel, it's Karen from the office."},{"i":1,"speaker":"F_US","text":"The meeting on Wednesday has moved to Thursday, same time, same room."},{"i":2,"speaker":"F_US","text":"Could you bring the printed reports? Sam won't be there, so we'll need your numbers."},{"i":3,"speaker":"F_US","text":"Call me back if that's a problem."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a2-04","level":"A2","file":"a2/src-l-a2-04.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"Are you free on Saturday afternoon?"},{"i":1,"speaker":"M_US","text":"Saturday's difficult. I'm helping my brother move house."},{"i":2,"speaker":"F_GB","text":"Sunday then? There's a new exhibition at the gallery."},{"i":3,"speaker":"M_US","text":"Sunday works. What time does it open?"},{"i":4,"speaker":"F_GB","text":"Ten, but let's meet at eleven. It's quieter later."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a2-05","level":"A2","file":"a2/src-l-a2-05.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"M_GB","text":"My sister is a photographer, but she doesn't work in a studio."},{"i":1,"speaker":"M_GB","text":"She travels to different cities and takes pictures of buildings."},{"i":2,"speaker":"M_GB","text":"It's hard work because she's away from home a lot."},{"i":3,"speaker":"M_GB","text":"But she says she wouldn't change it."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-a2-06","level":"A2","file":"a2/src-l-a2-06.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_US","text":"Should we take the bus or the train to the airport?"},{"i":1,"speaker":"M_GB","text":"The bus is cheaper, about half the price."},{"i":2,"speaker":"F_US","text":"But how long does it take?"},{"i":3,"speaker":"M_GB","text":"Nearly two hours. The train's only forty minutes."},{"i":4,"speaker":"F_US","text":"Let's pay more. I don't want to miss the flight."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b1-01","level":"B1","file":"b1/src-l-b1-01.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"So how's the new job going?"},{"i":1,"speaker":"M_GB","text":"Yeah, good. Better than I expected, actually. The work itself is fine."},{"i":2,"speaker":"F_GB","text":"But?"},{"i":3,"speaker":"M_GB","text":"Well, the commute. It's an hour and a half each way."},{"i":4,"speaker":"F_GB","text":"Could you move closer?"},{"i":5,"speaker":"M_GB","text":"I did look into it, but the rents round there are ridiculous. So I asked about working from home two days a week."},{"i":6,"speaker":"F_GB","text":"And they agreed?"},{"i":7,"speaker":"M_GB","text":"Starting next month, yeah."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b1-02","level":"B1","file":"b1/src-l-b1-02.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"M_US","text":"I'm thinking of joining the gym on Mill Street."},{"i":1,"speaker":"F_US","text":"The one with the pool? I went there for about six months."},{"i":2,"speaker":"M_US","text":"Was it any good?"},{"i":3,"speaker":"F_US","text":"The equipment's excellent. But it gets really crowded after five, and that's the only time I could go."},{"i":4,"speaker":"M_US","text":"I'd be going in the mornings, though."},{"i":5,"speaker":"F_US","text":"Then honestly, you'd probably love it."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b1-03","level":"B1","file":"b1/src-l-b1-03.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"Hi, I'd like to book the photography course starting in March."},{"i":1,"speaker":"M_US","text":"Certainly. The full course is two hundred and forty pounds."},{"i":2,"speaker":"F_GB","text":"Is there a student discount?"},{"i":3,"speaker":"M_US","text":"There is, but it's already closed for March. It'll be available again for the April course."},{"i":4,"speaker":"F_GB","text":"Then I'll wait for April. Can you hold a place?"},{"i":5,"speaker":"M_US","text":"I can, for a week."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b1-04","level":"B1","file":"b1/src-l-b1-04.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"M_GB","text":"Excuse me, my suitcase didn't come through with the others."},{"i":1,"speaker":"F_US","text":"I'm sorry about that. Could you describe it?"},{"i":2,"speaker":"M_GB","text":"Medium size, dark green, with a red label on the handle."},{"i":3,"speaker":"F_US","text":"Right. We had a bag arrive on the wrong flight this morning. Was yours coming from Dublin?"},{"i":4,"speaker":"M_GB","text":"No, Edinburgh."},{"i":5,"speaker":"F_US","text":"Then that's not it, I'm afraid. Let me take your details and we'll deliver it as soon as it turns up."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b1-05","level":"B1","file":"b1/src-l-b1-05.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_US","text":"Have you seen that documentary everyone's talking about?"},{"i":1,"speaker":"M_GB","text":"I watched it last weekend. It's beautifully filmed, I'll give it that."},{"i":2,"speaker":"F_US","text":"You don't sound convinced."},{"i":3,"speaker":"M_GB","text":"It's just very long. Two and a half hours, and the middle section drags badly."},{"i":4,"speaker":"F_US","text":"So would you recommend it?"},{"i":5,"speaker":"M_GB","text":"If you're interested in the subject, definitely. If not, probably not."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b1-06","level":"B1","file":"b1/src-l-b1-06.mp3","playsAllowed":2,"durationSec":null,"wpm":null,"lines":[{"i":0,"speaker":"F_GB","text":"I booked a room with a balcony, but the one I've been given doesn't have one."},{"i":1,"speaker":"M_US","text":"Let me check. Ah, I see. The balcony rooms are all occupied tonight."},{"i":2,"speaker":"F_GB","text":"That's not really my problem, is it?"},{"i":3,"speaker":"M_US","text":"No, you're right. I can move you tomorrow morning, or refund the difference now."},{"i":4,"speaker":"F_GB","text":"I'd rather not pack everything again. Let's do the refund."}],"lineTimecodes":null,"reconstructed":true},{"id":"src-l-b2-01","level":"B2","file":"b2/src-l-b2-01.mp3","playsAllowed":1,"durationSec":32.1,"wpm":166,"lines":[{"i":0,"speaker":"F_GB","text":"Right, so we've had the survey results back on the hybrid policy."},{"i":1,"speaker":"M_US","text":"Let me guess. Everyone wants to stay at home."},{"i":2,"speaker":"F_GB","text":"Actually, no. Sixty per cent said they'd come in more often if the office were less noisy."},{"i":3,"speaker":"M_US","text":"Huh. That's not what I expected at all."},{"i":4,"speaker":"F_GB","text":"Which suggests the problem was never really the commute."},{"i":5,"speaker":"M_US","text":"I'd still be careful reading too much into it. Sixty per cent said that, but only a third actually filled the survey in."},{"i":6,"speaker":"F_GB","text":"Fair point. Though it's the closest thing to evidence we've got."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-b2-02","level":"B2","file":"b2/src-l-b2-02.mp3","playsAllowed":1,"durationSec":32.44,"wpm":157,"lines":[{"i":0,"speaker":"M_GB","text":"You spent twelve years in corporate law before switching to teaching. What prompted that?"},{"i":1,"speaker":"F_US","text":"People always assume there was some dramatic moment. There wasn't."},{"i":2,"speaker":"F_US","text":"It was more that I kept noticing which parts of the week I looked forward to, and none of them involved the actual law."},{"i":3,"speaker":"M_GB","text":"Was money not a concern?"},{"i":4,"speaker":"F_US","text":"Of course it was. I'd be lying if I said otherwise. But I'd also saved for six years knowing something would change eventually."},{"i":5,"speaker":"M_GB","text":"So it was planned."},{"i":6,"speaker":"F_US","text":"Planned is generous. Anticipated, maybe."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-b2-03","level":"B2","file":"b2/src-l-b2-03.mp3","playsAllowed":1,"durationSec":30.88,"wpm":161,"lines":[{"i":0,"speaker":"F_GB","text":"We're three weeks behind on the launch and I need to know why."},{"i":1,"speaker":"M_GB","text":"The short answer is the payments integration."},{"i":2,"speaker":"F_GB","text":"And the long answer?"},{"i":3,"speaker":"M_GB","text":"The long answer is that we knew in January it would be tight, and we scoped it as if it wouldn't be."},{"i":4,"speaker":"F_GB","text":"So it's a planning problem, not an engineering one."},{"i":5,"speaker":"M_GB","text":"I'd say both. But if you're asking which one we can fix before the next launch, then yes, planning."},{"i":6,"speaker":"F_GB","text":"All right. That's more useful than I was expecting."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-b2-04","level":"B2","file":"b2/src-l-b2-04.mp3","playsAllowed":1,"durationSec":23.82,"wpm":151,"lines":[{"i":0,"speaker":"M_US","text":"What did you think of the second candidate?"},{"i":1,"speaker":"F_GB","text":"Technically strong. Probably the strongest we've seen."},{"i":2,"speaker":"M_US","text":"I sense a \"but\"."},{"i":3,"speaker":"F_GB","text":"She talked about her last team for twenty minutes and used \"I\" every single time."},{"i":4,"speaker":"M_US","text":"That might just be interview nerves. People oversell themselves under pressure."},{"i":5,"speaker":"F_GB","text":"It might. I'd want a second conversation before I decided either way."},{"i":6,"speaker":"M_US","text":"That seems reasonable."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-b2-05","level":"B2","file":"b2/src-l-b2-05.mp3","playsAllowed":1,"durationSec":33.04,"wpm":158,"lines":[{"i":0,"speaker":"F_US","text":"Your book argues that screen time is basically a meaningless measure. That's quite a claim."},{"i":1,"speaker":"M_GB","text":"It's a deliberately provocative way of putting it, but yes."},{"i":2,"speaker":"M_GB","text":"Two hours spent video-calling your grandmother and two hours scrolling in bed at midnight are not the same thing, and yet we count them identically."},{"i":3,"speaker":"F_US","text":"Critics would say you're downplaying a genuine problem."},{"i":4,"speaker":"M_GB","text":"Some do, and I understand why. My point isn't that nothing is wrong. It's that we're measuring the wrong variable and then acting surprised when the interventions don't work."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c1-01","level":"C1","file":"c1/src-l-c1-01.mp3","playsAllowed":1,"durationSec":36.36,"wpm":172,"lines":[{"i":0,"speaker":"M_GB","text":"Before we move on, I wanted to raise something about the sampling."},{"i":1,"speaker":"F_US","text":"Go ahead."},{"i":2,"speaker":"M_GB","text":"You've recruited entirely through the university's own mailing list, which is efficient, obviously. But it does mean your sample is drawn from people who already engage with institutional communication."},{"i":3,"speaker":"F_US","text":"That's a fair observation. Though I'd note the effect sizes are large enough that a modest selection bias wouldn't overturn the direction of the finding."},{"i":4,"speaker":"M_GB","text":"I'm not suggesting it would. I'm suggesting the magnitude is probably inflated, and the paper currently reads as though it isn't."},{"i":5,"speaker":"F_US","text":"That's a reasonable distinction. I'd be happy to soften the framing in the discussion section."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c1-02","level":"C1","file":"c1/src-l-c1-02.mp3","playsAllowed":1,"durationSec":30.96,"wpm":169,"lines":[{"i":0,"speaker":"F_GB","text":"The council's position is that pedestrianising the centre will increase footfall for local businesses."},{"i":1,"speaker":"M_US","text":"And in most comparable cities it has. What tends to get left out is the timeline."},{"i":2,"speaker":"M_US","text":"Footfall recovers, yes, but typically after eighteen months to two years, and a lot of independent retailers simply don't have that runway."},{"i":3,"speaker":"F_GB","text":"So you'd oppose the scheme."},{"i":4,"speaker":"M_US","text":"No, I'd sequence it differently. Support first, restriction second. Doing them in the opposite order is how you end up with an empty pedestrian zone and a very unpopular council."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c1-03","level":"C1","file":"c1/src-l-c1-03.mp3","playsAllowed":1,"durationSec":27.53,"wpm":170,"lines":[{"i":0,"speaker":"F_US","text":"Are we heading for a recession or not?"},{"i":1,"speaker":"M_GB","text":"I'd resist the framing, if you don't mind."},{"i":2,"speaker":"M_GB","text":"The indicators that historically preceded contractions are behaving unusually this cycle. Employment is holding in a way it typically doesn't, and consumer spending has stayed resilient longer than most of us forecast."},{"i":3,"speaker":"F_US","text":"That sounds like a no."},{"i":4,"speaker":"M_GB","text":"It sounds like a \"the model that would tell us is currently not working\". Which is a less satisfying answer, but a more honest one."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c1-04","level":"C1","file":"c1/src-l-c1-04.mp3","playsAllowed":1,"durationSec":28.53,"wpm":168,"lines":[{"i":0,"speaker":"F_GB","text":"I wanted to talk about the client presentation on Thursday."},{"i":1,"speaker":"M_US","text":"Sure. I thought it landed reasonably well."},{"i":2,"speaker":"F_GB","text":"The content was strong. Genuinely. The analysis was the best work you've done here."},{"i":3,"speaker":"M_US","text":"I'm sensing there's more."},{"i":4,"speaker":"F_GB","text":"There were about forty slides for a fifty-minute slot, and we got through nineteen. The client saw a fifth of your argument and none of your conclusion."},{"i":5,"speaker":"M_US","text":"Right. So the problem wasn't what I said, it's what they never got to hear."},{"i":6,"speaker":"F_GB","text":"That's exactly it."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c1-05","level":"C1","file":"c1/src-l-c1-05.mp3","playsAllowed":1,"durationSec":34.8,"wpm":167,"lines":[{"i":0,"speaker":"M_GB","text":"Every technology introduced into classrooms in the last forty years was going to transform learning, and none of them did."},{"i":1,"speaker":"F_US","text":"I'd accept that for interactive whiteboards. I'm less sure it holds here."},{"i":2,"speaker":"F_US","text":"The earlier tools changed how material was delivered. They didn't change who could give a student individual attention at the moment they were stuck."},{"i":3,"speaker":"M_GB","text":"Assuming the attention is any good."},{"i":4,"speaker":"F_US","text":"Assuming that, yes. Which is an empirical question rather than a reason to dismiss it in advance."},{"i":5,"speaker":"M_GB","text":"Then we agree on the question. We just disagree about how confident anyone should be about the answer."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c2-01","level":"C2","file":"c2/src-l-c2-01.mp3","playsAllowed":1,"durationSec":28.4,"wpm":180,"lines":[{"i":0,"speaker":"F_GB","text":"So the piece came in at four thousand words."},{"i":1,"speaker":"M_US","text":"Against a brief of eighteen hundred."},{"i":2,"speaker":"F_GB","text":"Against a brief of eighteen hundred, yes."},{"i":3,"speaker":"M_GB","text":"In fairness, it's four thousand rather good words."},{"i":4,"speaker":"F_GB","text":"Nobody's disputing that. I'm disputing the arithmetic."},{"i":5,"speaker":"M_GB","text":"I suppose what I'm asking is whether we cut it or find it more room."},{"i":6,"speaker":"M_US","text":"We could find it more room. We'd just be finding it at the expense of something else, and I notice nobody's volunteering their own copy."},{"i":7,"speaker":"M_GB","text":"That does tend to be how it works."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c2-02","level":"C2","file":"c2/src-l-c2-02.mp3","playsAllowed":1,"durationSec":27.35,"wpm":182,"lines":[{"i":0,"speaker":"F_US","text":"The headline finding has been picked up more or less everywhere."},{"i":1,"speaker":"M_GB","text":"It has, which is the part I find difficult."},{"i":2,"speaker":"M_GB","text":"The paper says the association holds within a narrowly defined subgroup and explicitly declines to generalise. The coverage says the opposite, and cites the paper."},{"i":3,"speaker":"F_US","text":"Are the authors pushing back?"},{"i":4,"speaker":"M_GB","text":"Not conspicuously."},{"i":5,"speaker":"F_US","text":"Well. There are worse things than being famous for something you didn't quite claim."},{"i":6,"speaker":"M_GB","text":"There are. Though I'd have thought a correction was cheaper than the reputation of a whole subfield."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c2-03","level":"C2","file":"c2/src-l-c2-03.mp3","playsAllowed":1,"durationSec":30.25,"wpm":180,"lines":[{"i":0,"speaker":"M_US","text":"So, the new production. Ambitious?"},{"i":1,"speaker":"F_GB","text":"Ambitious is the word everyone reaches for, and it's doing a great deal of work in this case."},{"i":2,"speaker":"M_US","text":"Meaning?"},{"i":3,"speaker":"F_GB","text":"Meaning the staging is genuinely inventive, the design is beautiful, and roughly forty minutes in it becomes apparent that nobody involved has decided what the play is about."},{"i":4,"speaker":"M_GB","text":"That's rather harsh."},{"i":5,"speaker":"F_GB","text":"Is it? I'd say it's harsher to pretend a production is finished when what you've seen is a very expensive rehearsal."},{"i":6,"speaker":"M_US","text":"And yet you'd recommend it."},{"i":7,"speaker":"F_GB","text":"I'd recommend seeing it. I wouldn't recommend paying full price."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c2-04","level":"C2","file":"c2/src-l-c2-04.mp3","playsAllowed":1,"durationSec":28.34,"wpm":180,"lines":[{"i":0,"speaker":"F_GB","text":"I'll grant you the policy was badly communicated."},{"i":1,"speaker":"M_US","text":"Thank you."},{"i":2,"speaker":"F_GB","text":"Badly communicated, poorly timed, and announced by someone who plainly hadn't read it."},{"i":3,"speaker":"M_US","text":"I feel the concession slipping away."},{"i":4,"speaker":"F_GB","text":"It is, slightly. Because none of that touches whether the policy itself was right, and the entire debate since has been about the announcement."},{"i":5,"speaker":"M_GB","text":"That's often how it goes, though. If you can't win on substance, you litigate the process."},{"i":6,"speaker":"F_GB","text":"Which would be a fair characterisation if anyone had actually tried to win on substance first."}],"lineTimecodes":null,"reconstructed":false},{"id":"src-l-c2-05","level":"C2","file":"c2/src-l-c2-05.mp3","playsAllowed":1,"durationSec":24.16,"wpm":176,"lines":[{"i":0,"speaker":"M_GB","text":"Will you be standing for the leadership?"},{"i":1,"speaker":"F_US","text":"I'm focused entirely on the work in front of me."},{"i":2,"speaker":"M_GB","text":"That isn't a no."},{"i":3,"speaker":"F_US","text":"It isn't a yes either."},{"i":4,"speaker":"M_GB","text":"With respect, you've given that answer four times this month, and the question keeps getting asked because the answer keeps not being one."},{"i":5,"speaker":"F_US","text":"Then perhaps we should both consider what that tells us about the question."},{"i":6,"speaker":"M_GB","text":"Or about the answer."},{"i":7,"speaker":"F_US","text":"Or about the answer, yes."}],"lineTimecodes":null,"reconstructed":false}]};

скрипты выверены по faster-whisper small.","sources":[{"id":"src-v-01","level":"A2","file":"clips/clip1.mp4","durationSec":1.5,"transcript":"Look at the stars."},{"id":"src-v-02","level":"B1","file":"clips/clip2.mp4","durationSec":3.2,"transcript":"I hunt for food, eat, and rest."},{"id":"src-v-03","level":"A2","file":"clips/clip3.mp4","durationSec":1.9,"transcript":"I'd like to see the manager."},{"id":"src-v-05","level":"B2","file":"clips/clip5.mp4","durationSec":1.7,"transcript":"I think that's the first time I've ever missed a meal."},{"id":"src-v-06","level":"B1","file":"clips/clip6.mp4","durationSec":2.0,"transcript":"I'm gonna take care of this myself."},{"id":"src-v-07","level":"C1","file":"clips/clip7.mp4","durationSec":2.4,"transcript":"You're not going to get any younger hanging around here. What do you want?"}],"items":[{"id":"vc-01","source":"src-v-01","level":"A2","options":["Look at the stars.","Look at the cars.","Look at the store.","Look at this dress."],"key":0},{"id":"vc-02","source":"src-v-02","level":"B1","options":["I hunt for food, eat, and rest.","I hunted food and had a rest.","I want some food and a rest.","I hunt for food in the west."],"key":0},{"id":"vc-03","source":"src-v-03","level":"A2","options":["I'd like to see the manager.","I'd like to be the manager.","I like to see the messenger.","I'd like to sing to the manager."],"key":0},{"id":"vc-05","source":"src-v-05","level":"B2","options":["That's the first time I've ever missed a meal.","That's the first time I've ever made a meal.","That's the last time I ever missed the mail.","That's the first time I've never had a meal."],"key":0},{"id":"vc-06","source":"src-v-06","level":"B1","options":["I'm going to take care of this myself.","I'm going to take this chair myself.","I want to take care of you myself.","I'm taking a taxi by myself."],"key":0},{"id":"vc-07","source":"src-v-07","level":"C1","options":["You won't get any younger hanging around here.","You won't get any hungrier hanging around here.","You're not getting younger walking around here.","You'll never get younger working out here."],"key":0}]},"listening2":{"note":"Нарезка из материалов владельца. pod-*: мини-тексты по уровням из подкаста A1–C2; na-*: диалог из test_audio.ogg (первый прогон, без экзаменационных инструкций). Файлы: jts-bank/l2/<id>.mp3.","sources":[{"id":"src-l2-pod-a1","level":"A1","file":"l2/src-l2-pod-a1.mp3","durationSec":9,"lines":[{"i":0,"speaker":"Narrator","text":"My name is Anna. I have a small cat. The cat is black and white. Every morning I drink milk and I eat bread."}]},{"id":"src-l2-pod-a2","level":"A2","file":"l2/src-l2-pod-a2.mp3","durationSec":10,"lines":[{"i":0,"speaker":"Narrator","text":"Last weekend I went to the market with my sister. We bought some fresh apples and a big fish. Then it started to rain so we took the bus home."}]},{"id":"src-l2-pod-b1","level":"B1","file":"l2/src-l2-pod-b1.mp3","durationSec":15,"lines":[{"i":0,"speaker":"Narrator","text":"I've been learning to cook for about a year now. At first I burned almost everything, but I didn't give up. Now I can make a few dishes my friends actually enjoy. Though I still can't bake a cake without checking the recipe twice."}]},{"id":"src-l2-pod-b2","level":"B2","file":"l2/src-l2-pod-b2.mp3","durationSec":16,"lines":[{"i":0,"speaker":"Narrator","text":"What surprised me most about moving abroad wasn't the language. It was the silence. Back home, I was always surrounded by family and noise. Here the evenings can feel empty. I've had to learn that being alone is not the same as being lonely."}]},{"id":"src-l2-pod-c1","level":"C1","file":"l2/src-l2-pod-c1.mp3","durationSec":14,"lines":[{"i":0,"speaker":"Narrator","text":"A good leader doesn't just give instructions. They create the conditions where people feel safe enough to take risks. The moment your team is more afraid of your reaction than of failure itself, innovation quietly dies."}]},{"id":"src-l2-pod-c2","level":"C2","file":"l2/src-l2-pod-c2.mp3","durationSec":21,"lines":[{"i":0,"speaker":"Narrator","text":"Nostalgia is a curious thing. It dresses the past in colors it never actually wore. And yet we'd be poorer without it. We don't so much remember our lives as reinvent them. Each retelling smooths another rough edge, until the story we tell is kinder than the one we lived."}]},{"id":"src-l2-na-1","level":"B1","file":"l2/src-l2-na-1.mp3","cutFrom":"test_audio.ogg","cutStart":2.7,"cutEnd":70.4,"durationSec":68,"summary":"Ник и Анна: оба остались без планов, решают пойти в кино","lines":[{"i":0,"speaker":"Anna","text":"Hi, Nick! Are you waiting for someone?"},{"i":1,"speaker":"Nick","text":"Oh, hi Anna! Yes, I'm waiting for a friend, but he's just called and says he's not coming. We were going to the sports centre, but now I don't feel like going there alone."},{"i":2,"speaker":"Anna","text":"Right, and I promised to meet my mum at the railway station. But she's missed her train and is coming on another one in three hours."},{"i":3,"speaker":"Nick","text":"Which means you need to kill three hours somehow too, and it's rather cold and windy to stay in the street."},{"i":4,"speaker":"Anna","text":"Right, I'm already starting to feel cold."},{"i":5,"speaker":"Nick","text":"Look, I've heard there's an art exhibition in the art gallery, not far from here. How about going there together?"},{"i":6,"speaker":"Anna","text":"Oh no, art exhibitions are not for me, sorry. My alternative suggestion is going to the cinema, which is only two blocks from here. I don't remember the name of the film, but I've heard it's good."},{"i":7,"speaker":"Nick","text":"Fine, let's go. I haven't been to the cinema for a very long time."}]},{"id":"src-l2-na-2","level":"B1","file":"l2/src-l2-na-2.mp3","cutFrom":"test_audio.ogg","cutStart":70.4,"cutEnd":159.8,"durationSec":89,"summary":"Профессии родителей Ника и мечты обоих о будущем","lines":[{"i":0,"speaker":"Nick","text":"I haven't either. Last time it was more than three years ago, a family outing, so I couldn't escape to the stadium."},{"i":1,"speaker":"Anna","text":"It's strange you are so crazy about sports and do not like films. Your parents' careers are connected with the film industry somehow, aren't they?"},{"i":2,"speaker":"Nick","text":"Well, not exactly. My mum is a playwright — a person who writes texts for plays. And my dad is a cameraman. He shoots different programmes, interviews, concerts."},{"i":3,"speaker":"Anna","text":"I would like to work in the world of theatre and TV. It's so glamorous."},{"i":4,"speaker":"Nick","text":"It's not very glamorous, in my opinion. The TV industry does not attract me at all. My ambition is more down to earth. I want to build bridges and buildings."},{"i":5,"speaker":"Anna","text":"Architecture?"},{"i":6,"speaker":"Nick","text":"No, engineering. I think it's a very important profession."},{"i":7,"speaker":"Anna","text":"It is, but it's a difficult one. You need to know mathematics and science very well."},{"i":8,"speaker":"Nick","text":"Yes, sure. I love mathematics more than any other subject."}]},{"id":"src-l2-na-3","level":"B1","file":"l2/src-l2-na-3.mp3","cutFrom":"test_audio.ogg","cutStart":159.8,"cutEnd":205.9,"durationSec":46,"summary":"Кинотеатр закрыт, нужен план Б","lines":[{"i":0,"speaker":"Nick","text":"Right, okay, as you say. And we've got to the place, I think."},{"i":1,"speaker":"Anna","text":"Fine, but it looks sort of empty and deserted. Oh gosh, no."},{"i":2,"speaker":"Nick","text":"What's wrong?"},{"i":3,"speaker":"Anna","text":"Look at this advertisement. It says that for some reason they have to cancel the films that start after 8 pm this weekend."},{"i":4,"speaker":"Nick","text":"But Sunday was yesterday, wasn't it? And it's only 3 pm anyway. Why is it still closed?"},{"i":5,"speaker":"Anna","text":"Because it says here that on Monday and Tuesday there's nothing on at all. Come back on Wednesday."},{"i":6,"speaker":"Nick","text":"Yeah, we need to switch to plan B, I suppose. Do we have one?"}]}],"items":[{"id":"l2-pod-a1-1","source":"src-l2-pod-a1","level":"A1","type":"mcq","stem":"What does Anna eat in the morning?","options":["Bread","Milk","Apples","Fish"],"key":0},{"id":"l2-pod-a1-2","source":"src-l2-pod-a1","level":"A1","type":"mcq","stem":"What colour is the cat?","options":["Black and white","Black","White and brown","Grey"],"key":0},{"id":"l2-pod-a2-1","source":"src-l2-pod-a2","level":"A2","type":"mcq","stem":"How did they get home?","options":["By bus","By taxi","On foot","By train"],"key":0},{"id":"l2-pod-a2-2","source":"src-l2-pod-a2","level":"A2","type":"tfns","statements":[{"t":"They bought apples and a fish.","key":"T"},{"t":"The weather was sunny all day.","key":"F"},{"t":"The sister likes fish.","key":"NS"}]},{"id":"l2-pod-b1-1","source":"src-l2-pod-b1","level":"B1","type":"mcq","stem":"What can the speaker still not do well?","options":["Bake a cake without checking the recipe","Cook dishes their friends enjoy","Stop burning simple dishes","Follow any recipe at all"],"key":0},{"id":"l2-pod-b1-2","source":"src-l2-pod-b1","level":"B1","type":"tfns","statements":[{"t":"The speaker has been learning to cook for about a year.","key":"T"},{"t":"The speaker gave up after burning the food.","key":"F"},{"t":"The speaker wants to open a café.","key":"NS"}]},{"id":"l2-pod-b2-1","source":"src-l2-pod-b2","level":"B2","type":"mcq","stem":"What surprised the speaker most about moving abroad?","options":["The silence","The language","The food","The people"],"key":0},{"id":"l2-pod-b2-2","source":"src-l2-pod-b2","level":"B2","type":"mcq","stem":"What did the speaker have to learn?","options":["Being alone is not the same as being lonely.","Living abroad always feels lonely.","Family noise is annoying.","Evenings abroad are more fun."],"key":0},{"id":"l2-pod-c1-1","source":"src-l2-pod-c1","level":"C1","type":"mcq","stem":"According to the speaker, what kills innovation?","options":["Fear of the leader's reaction","Lack of mo // ЯДРО: чистая логика, без DOM. Работает и в браузере, и в node

// ---------- CUTS: ВРЕМЕННЫЕ cut-scores до пилота ----------
// Меняются одной правкой здесь. Совпадают с levelLadder банка.
const CUTS = {
  provisional: true, // показывается в UI как «временные»
  bounds: [ // [нижняя граница θ, бакет]
    [-Infinity, 'A0'],
    [-2.5, 'A1'],
    [-1.8, 'A2'],
    [-1.0, 'B1'],
    [0.0, 'B2'],
    [1.0, 'C1'],
    [2.0, 'C2']
  ]
};

// Временные якоря трудности для pilot mode: середины зон levelLadder.
// НЕ записываются в items[].irt.b и НЕ выдаются за калибровку.
// После пилота selectNext()/provisionalB() заменяются на калиброванные b и MFI.
const PROVISIONAL_B = { A1: -2.15, A2: -1.4, B1: -0.5, B2: 0.5, C1: 1.5, C2: 2.5 };
const PROVISIONAL_A = 1.0;

// Целевой хронометраж (справочно, ~15 минут). Обратного отсчёта и
// принудительных переходов в UI НЕТ — студент идёт в своём темпе,
// время на задание пишется в лог для калибровки.
const TARGET_TIME = { totalMin: 15 };

const THETA0_BY_CANDO = [-2.0, -1.2, -0.4, 0.4, 1.2];

// ---------- Два варианта теста ----------

// full 35–45 мин: больше заданий в каждом разделе + видеоклипы + говорение,
// профиль по навыкам (аудирование/грамматика/чтение отдельно).
const VARIANTS = {
  express: {
    label: '15', minpair: 6, listenSources: 2, listenMax: 6, clips: 0, readTexts: 1,
    uoe: 8, uoeOrder: 1, uoeBankfill: 1, uoeMatch: 0, speaking: 0, skillProfile: false
