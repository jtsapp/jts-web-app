// ---------- Слияние дополнительного банка v2 (материалы владельца) ----------
// Ничего в исходном BANK не перезаписывается — только добавление новых
// элементов с собственными id. Обратимо удалением bank2.
function mergeBank2(bank, manifest, bank2) {
  if (!bank2 || bank._bank2merged) return;
  bank._bank2merged = true;
  const S2O = arr => arr.map(t => ({ t }));
  // 1) listening2: mcq/who -> обычные listening-задания; tfns/order — со своим type
  (bank2.listening2.sources || []).forEach(s => {
    manifest.sources.push({
      id: s.id, level: s.level, file: s.file,
      playsAllowed: ['A1', 'A2', 'B1'].includes(s.level) ? 2 : 1,
      durationSec: s.durationSec || null, lines: s.lines || null,
      lineTimecodes: null, reconstructed: false, owner: true
    });
  });
  (bank2.listening2.items || []).forEach(q => {
    const it = { id: q.id, block: 'listening', level: q.level, source: q.source, type: q.type };
    if (q.type === 'mcq' || q.type === 'who') {
      it.stem = q.stem; it.options = S2O(q.options); it.key = q.key;
      it.construct = q.type === 'who' ? 'listening.who' : 'listening.detail';
    } else if (q.type === 'tfns') {
      it.stem = ''; it.statements = q.statements; it.construct = 'listening.tfns';
    } else if (q.type === 'order') {
      it.stem = q.stem; it.steps = q.steps; it.construct = 'listening.sequence';
    }
    bank.items.push(it);
  });
  // 2) видеоклипы: block 'clip'
  (bank2.clips.sources || []).forEach(s => {
    manifest.sources.push({
      id: s.id, level: s.level, file: s.file, video: true,
      playsAllowed: 2, durationSec: s.durationSec || null,
      lines: [{ i: 0, speaker: '', text: s.transcript }], reconstructed: false, owner: true
    });
  });
  (bank2.clips.items || []).forEach(q => {
    bank.items.push({ id: q.id, block: 'clip', level: q.level, source: q.source,
      stem: '', options: S2O(q.options), key: q.key, construct: 'listening.decoding' });
  });
  // 3) minimal pairs: block 'minpair'; аудио pairs/<id>.mp3, фоллбэк — TTS
  (bank2.minpairs || []).forEach(p => {
    bank.items.push({ id: p.id, block: 'minpair', level: p.level,
      word: p.word, distractor: p.distractor, sentence: p.sentence || null,
      file: 'pairs/' + p.id + '.mp3', construct: 'listening.phoneme' });
  });
  // 4) интерактивная грамматика: block 'uoe2'
  (bank2.interactive.order || []).forEach(o => {
    bank.items.push({ id: o.id, block: 'uoe2', type: 'order', level: o.level,
      answer: o.answer, construct: 'grammar.word_order', constructFamily: 'word_order' });
  });
  (bank2.interactive.bankfill || []).forEach(b => {
    bank.items.push({ id: b.id, block: 'uoe2', type: 'bankfill', level: b.level,
      text: b.text, bankWords: b.bank, answers: b.answers, construct: 'grammar.bankfill', constructFamily: 'cohesion' });
  });
  (bank2.interactive.match || []).forEach(m => {
    bank.items.push({ id: m.id, block: 'uoe2', type: 'match', level: m.level,
      pairs: m.pairs, kind: m.kind, construct: 'pragmatics.match', constructFamily: 'pragmatics' });
  });
}

// ---------- Оценка интерактивных форматов (частичный зачёт 0..1) ----------
// Порядок слов: точное совпадение = 1; иначе доля верных биграмм × 0.5
// (собранное «почти верно» — это всё ещё не верная фраза).
function scoreOrderWords(words, arr) {
  // words: эталонная последовательность, arr: собранная
  if (!arr || arr.length !== words.length) return 0;
  if (words.every((w, i) => arr[i] === w)) return 1;
  let good = 0;
  for (let i = 0; i + 1 < words.length; i++) {
    for (let j = 0; j + 1 < arr.length; j++) {
      if (arr[j] === words[i] && arr[j + 1] === words[i + 1]) { good++; break; }
    }
  }
  return 0.5 * good / (words.length - 1);
}
function scoreBankfill(item, answers) {
  const n = item.answers.length;
  let c = 0;
  for (let i = 0; i < n; i++) if ((answers || [])[i] === item.answers[i]) c++;
  return n ? c / n : 0;
}
function scoreMatch(item, mapping) {
  // mapping: для каждой левой части — индекс выбранной правой (или null)
  const n = item.pairs.length;
  let c = 0;
  for (let i = 0; i < n; i++) if ((mapping || [])[i] === i) c++;
  return n ? c / n : 0;
}
function scoreTfns(item, answers) {
  const n = item.statements.length;
  let c = 0;
  for (let i = 0; i < n; i++) if ((answers || [])[i] === item.statements[i].key) c++;
  return n ? c / n : 0;
}

// ---------- RNG: mulberry32, seed фиксируется на сессию ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- θ: EAP по сетке, 3PL ----------
const GRID = (() => { const g = []; for (let i = 0; i <= 160; i++) g.push(-4 + i * 0.05); return g; })();

function p3pl(theta, a, b, c) {
  return c + (1 - c) / (1 + Math.exp(-a * (theta - b)));
}
function itemB(item) {
  // pilot mode: b == null -> временный якорь по уровню
  return (item.irt && item.irt.b != null) ? item.irt.b : PROVISIONAL_B[item.level];
}
function itemA(item) {
  return (item.irt && item.irt.a != null) ? item.irt.a : PROVISIONAL_A;
}
function itemC(item) {
  return (item.irt && item.irt.c != null) ? item.irt.c : (item.options ? 1 / item.options.length : 0);
}

// Апостериор из списка ответов. responses: [{item, correct(0..1)}], lex: {thetaEquiv, sigma}|null
function eapEstimate(theta0, responses, lex) {
  const w = new Array(GRID.length);
  let sum = 0;
  for (let i = 0; i < GRID.length; i++) {
    const t = GRID[i];
    let lw = -((t - theta0) * (t - theta0)) / 2; // приор N(theta0, 1.0), лог
    for (const r of responses) {
      const P = Math.min(0.9999, Math.max(0.0001, p3pl(t, itemA(r.item), itemB(r.item), itemC(r.item))));
      // для градуированных (writing 0..1) — псевдоправдоподобие P^s (1-P)^(1-s)
      lw += r.correct * Math.log(P) + (1 - r.correct) * Math.log(1 - P);
    }
    if (lex) lw += -((t - lex.thetaEquiv) * (t - lex.thetaEquiv)) / (2 * lex.sigma * lex.sigma);
    w[i] = lw;
  }
  const m = Math.max(...w);
  for (let i = 0; i < GRID.length; i++) { w[i] = Math.exp(w[i] - m); sum += w[i]; }
  let eap = 0;
  for (let i = 0; i < GRID.length; i++) eap += GRID[i] * w[i] / sum;
  let v = 0;
  for (let i = 0; i < GRID.length; i++) { const d = GRID[i] - eap; v += d * d * w[i] / sum; }
  return { theta: eap, se: Math.sqrt(v) };
}

function levelFromTheta(theta) {
  let lvl = 'A0';
  for (const [lo, name] of CUTS.bounds) if (theta >= lo) lvl = name;
  return lvl;
}

// ---------- Ответы на безвариантные ----------
function normAns(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '')
    .replace(/[‘’]/g, "'");
}
function checkOpenAnswer(item, text) {
  const t = normAns(text);
  if (!t) return false;
  return (item.answer || []).some(a => normAns(a) === t);
}

// ---------- Раздел слов: слово -> выбор значения ----------
// Вместо yes/no-признания (LexTALE) — matching по значениям (запрос владельца).
// Дистракторы — значения других слов того же/соседнего диапазона.
// Кнопка «Не знаю» отделяет незнание от неудачной догадки.
// Псевдослов больше нет, поэтому флаг yea_saying в этом формате не детектируется
// (честная догадка неотличима); вместо него — поправка на угадывание в балле.
function vocabDraw(vocab, theta0, rnd) {
  // vocab: {word: {band, ru, kk, en}}
  const words = Object.keys(vocab);
  const byBand = {};
  words.forEach(w => { (byBand[vocab[w].band] = byBand[vocab[w].band] || []).push(w); });
  const low = theta0 < -1.0;
  const plan = low
    ? [['B1', 4], ['B2', 4], ['B3', 4]]
    : [['B1', 2], ['B2', 2], ['B3', 2], ['B4', 2], ['B5', 2], ['B6', 2], ['B7', 2]];
  const bands = Object.keys(byBand).sort();
  const items = [];
  plan.forEach(([band, n]) => {
    seededShuffle(byBand[band] || [], rnd).slice(0, n).forEach(w => {
      // дистракторы: слова того же диапазона, при нехватке — соседние
      let pool = (byBand[band] || []).filter(x => x !== w);
      const bi = bands.indexOf(band);
      for (const d of [1, -1, 2, -2]) {
        if (pool.length >= 3) break;
        pool = pool.concat(byBand[bands[bi + d]] || []);
      }
      const distractors = seededShuffle(pool.filter(x => x !== w), rnd).slice(0, 3);
      const options = seededShuffle([w].concat(distractors), rnd);
      items.push({ w, band, options, correctIndex: options.indexOf(w) });
    });
  });
  return seededShuffle(items, rnd);
}
function vocabScore(items, answers) {
  // answers[i]: индекс опции | -1 («не знаю») | null (нет ответа)
  let correct = 0, idk = 0, guessed = 0;
  items.forEach((it, i) => {
    const a = answers[i];
    if (a === -1 || a == null) { idk++; return; }
    guessed++;
    if (a === it.correctIndex) correct++;
  });
  // поправка на угадывание при 4 опциях: c - wrong/3
  const corrected = Math.max(0, correct - (guessed - correct) / 3);
  const p = items.length ? corrected / items.length : 0;
  return {
    n: items.length, correct, idk, guessed,
    score100: Math.round(100 * p),
    invalid: false
  };
}
// Врем. отображение балла в θ-эквивалент (провизорно, калибруется на пилоте)
function lexThetaEquiv(score100) { return -3 + 5 * (score100 / 100); }
const LEX_SIGMA = 0.9;

// ---------- Оценка writing (машинное приближение рубрики 0–9) ----------
const WRITING_FORM_RX = {
  'w-a1-01': /\bi\s+(usually\s+)?(get|go|have|wake|drink|eat|start|make|take)\b/i,
  'w-a2-01': /\b(went|was|were|had|did|saw|stayed|visited|played|watched|\w{3,}ed)\b/i,
  'w-b1-01': /(\bif\b[^.!?]*\b(will|'ll|won't)\b)|(\b(will|'ll)\b[^.!?]*\bif\b)/i,
  'w-b1-02': /\b(i'?d rather|would rather|i would (choose|prefer|pick))\b/i,
  'w-b2-01': /\b(although|though|while|whereas)\b/i,
  'w-c1-01': /\b(on balance|provided( that)?|unless|would recommend|i('| wou)ld suggest)\b/i
};
function scoreWriting(item, text) {
  const t = String(text || '').trim();
  if (!t) return { task: 0, form: 0, range: 0, total: 0 };
  const supports = (item.support || []).flatMap(s => s.split('/').map(x => x.trim().toLowerCase())).filter(Boolean);
  const low = t.toLowerCase();
  const used = supports.filter(s => low.includes(s.replace(/\s+/g, ' ')));
  const task = used.length >= supports.length ? 3 : used.length >= 1 ? 2 : 1;
  const rx = WRITING_FORM_RX[item.id];
  const words = low.replace(/[^a-z'\s]/g, ' ').split(/\s+/).filter(w => w.length > 2);
  const own = words.filter(w => !supports.some(s => s.includes(w)));
  const form = rx ? (rx.test(t) ? 3 : (words.length >= (item.minWords || 5) ? 1 : 0)) : (words.length >= 5 ? 2 : 1);
  const range = own.length >= 3 ? 3 : own.length >= 1 ? 2 : (words.length ? 1 : 0);
  return { task, form, range, total: task + form + range };
}

// ---------- Оценка speaking (без ASR-accuracy) ----------
function scoreSpeaking(item, rec) {
  // rec: {durationSec, voicedSec, transcript|null}
  if (!rec) return null;
  const fluency = rec.voicedSec >= 12 ? 2 : rec.voicedSec >= 6 ? 1 : 0;
  const extension = rec.durationSec >= 20 ? 2 : rec.durationSec >= 10 ? 1 : 0;
  let construction = null; // null = ASR недоступен, критерий исключается
  if (rec.transcript != null) {
    const tr = rec.transcript.toLowerCase();
    construction = (item.expectKeywords || []).some(k => tr.includes(k.toLowerCase())) ? 1 : 0;
  }
  const max = 4 + (construction == null ? 0 : 1);
  const got = fluency + extension + (construction || 0);
  return { construction, fluency, extension, got, max };
}

// ============================================================
// Session — конечный автомат теста
// ============================================================
const BLOCK_SEQ = ['b0', 'b1', 'b2', 'b3', 'b4', 'b5', 'b6', 'b7', 'b8', 'result'];

class Session {
  constructor(bank, manifest, seed, variant) {
    this.bank = bank;
    this.manifest = manifest;
    this.setVariant(variant || 'express');
    this.seed = seed >>> 0;
    this.rnd = mulberry32(this.seed);
    this.lang = 'ru';
    this.theta0 = null;
    this.responses = [];   // входят в θ
    this.log = [];         // всё, включая late и не влияющие
    this.flags = [];
    this.thetaTrace = [];
    this.used = new Set();
    this.blockIdx = 0;
    this.a0 = { branched: false, bridgePassed: null };
    this.lex = null;       // {items, result}
    this.production = { writing: null, speaking: [] };
    this.pilotMode = this.bank.items.some(it => it.irt && it.irt.b == null);
    this.est = { theta: 0, se: 1 };
    this.audioAvailable = true;
    this.micAvailable = true;
  }

  addFlag(f) { if (!this.flags.includes(f)) this.flags.push(f); }

  setVariant(v) { this.variant = v; this.cfg = VARIANTS[v] || VARIANTS.express; }

  setCanDo(idx) {
    this.theta0 = THETA0_BY_CANDO[idx];
    this.est = { theta: this.theta0, se: 1.0 };
    this.thetaTrace.push({ step: 'start', theta: this.est.theta, se: this.est.se });
  }

  updateTheta(stepLabel) {
    const lex = (this.lex && this.lex.result && !this.lex.result.invalid)
      ? { thetaEquiv: lexThetaEquiv(this.lex.result.score100), sigma: LEX_SIGMA } : null;
    this.est = eapEstimate(this.theta0, this.responses, lex);
    this.thetaTrace.push({ step: stepLabel, theta: this.est.theta, se: this.est.se });
  }

  itemsOf(block, level) {
    return this.bank.items.filter(it => it.block === block && (!level || it.level === level) && !this.used.has(it.id));
  }
  pick(arr) { return arr.length ? arr[Math.floor(this.rnd() * arr.length)] : null; }

  // --- Блок 2: роутинг — 6 из пула 12 (2×A2, 2×B1, 1×B2, 1×C1) ---
  buildRouting() {
    const plan = [['A2', 2], ['B1', 2], ['B2', 1], ['C1', 1]];
    const items = [];
    plan.forEach(([lvl, n]) => {
      const pool = seededShuffle(this.itemsOf('routing', lvl), this.rnd);
      items.push(...pool.slice(0, n));
    });
    return seededShuffle(items, this.rnd);
  }

  // --- Блок 3: listening — 2 источника ~5 ответов на текущем уровне ---
  buildListening() {
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), ['A1', 'A2', 'B1', 'B2', 'C1', 'C2']);
    let srcIds = [...new Set(this.bank.items.filter(it => it.block === 'listening').map(it => it.source))];
    if (this.requireLines) {
      // mp3 недоступны, работаем через TTS — только источники с транскриптом
      const hasLines = id => (((this.manifest.sources || []).find(s => s.id === id) || {}).lines || []).length > 0;
      srcIds = srcIds.filter(hasLines);
      if (!srcIds.length) return { sources: [], items: [] };
    }
    const srcLevel = id => (this.bank.items.find(it => it.source === id) || {}).level;
    const near = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const li = near.indexOf(lvl);
    const ordered = srcIds.slice().sort((a, b) =>
      Math.abs(near.indexOf(srcLevel(a)) - li) - Math.abs(near.indexOf(srcLevel(b)) - li));
    const atLevel = ordered.filter(s => srcLevel(s) === lvl);
    const cnt = id => this.bank.items.filter(it => it.source === id).length;
    const nSrc = this.cfg.listenSources || 2;
    let chosen;
    if (nSrc <= 2) {
      // экспресс: предпочитаем 3+2 = 5 ответов на текущем уровне
      const threes = atLevel.filter(s => cnt(s) === 3), twos = atLevel.filter(s => cnt(s) === 2);
      if (threes.length && twos.length) chosen = [this.pick(threes), this.pick(twos)];
      else if (atLevel.length >= 2) chosen = seededShuffle(atLevel, this.rnd).slice(0, 2);
      else chosen = ordered.slice(0, 2);
    } else {
      // полный: лестница уровней — 2 источника на уровне + 1 ступенью ниже +
      // 1 выше (с зажимом на краях); материалы владельца (owner) в приоритете
      const isOwner = id => !!((this.manifest.sources || []).find(s => s.id === id) || {}).owner;
      const want = [lvl, lvl, near[Math.max(0, li - 1)], near[Math.min(near.length - 1, li + 1)]].slice(0, nSrc);
      const used = new Set();
      chosen = [];
      want.forEach(wl => {
        const cand = srcIds.filter(s => !used.has(s) && srcLevel(s) === wl)
          .sort((a, b) => (isOwner(a) ? 0 : 1) - (isOwner(b) ? 0 : 1));
        const p = cand[0] || ordered.find(s => !used.has(s));
        if (p) { used.add(p); chosen.push(p); }
      });
    }
    chosen = chosen.filter(Boolean);
    const items = [];
    chosen.forEach(s => items.push(...this.bank.items.filter(it => it.source === s && !this.used.has(it.id))));
    return { sources: chosen, items: items.slice(0, this.cfg.listenMax || 6) };
  }

  // --- Minimal pairs: лестница вокруг текущего уровня (A1..B2) ---
  buildMinpairs() {
    const n = this.cfg.minpair;
    if (!n) return [];
    const avail = ['A1', 'A2', 'B1', 'B2'];
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), avail);
    const li = avail.indexOf(lvl);
    const seq = [];
    for (let k = 0; k < Math.ceil(n / 2); k++) seq.push(li);
    for (let k = 0; k < Math.ceil(n / 4); k++) seq.push(Math.min(avail.length - 1, li + 1));
    for (let k = 0; k < Math.ceil(n / 4); k++) seq.push(Math.max(0, li - 1));
    const picked = [];
    seq.forEach(idx => {
      const pool = this.itemsOf('minpair', avail[idx]).filter(it => !picked.includes(it));
      const it = this.pick(pool);
      if (it) picked.push(it);
    });
    // добор из любых уровней
    while (picked.length < n) {
      const it = this.pick(this.bank.items.filter(x => x.block === 'minpair' && !this.used.has(x.id) && !picked.includes(x)));
      if (!it) break;
      picked.push(it);
    }
    return seededShuffle(picked.slice(0, n), this.rnd);
  }

  // --- Видеоклипы (только полный вариант) ---
  buildClips() {
    const n = this.cfg.clips;
    if (!n) return [];
    const near = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), near);
    const li = near.indexOf(lvl);
    let pool = this.bank.items.filter(it => it.block === 'clip' && !this.used.has(it.id));
    // clip1 используется в стартовой видео-проверке: показанный заранее
    // фрагмент из теста исключается
    if (this.probeClipSeen) pool = pool.filter(it => it.source !== 'src-v-01');
    return pool.slice().sort((a, b) =>
      Math.abs(near.indexOf(a.level) - li) - Math.abs(near.indexOf(b.level) - li)).slice(0, n);
  }

  // --- Интерактивная грамматика: порядок слов / банк слов / пары ---
  buildInteractive() {
    const near = ['A1', 'A2', 'B1', 'B2', 'C1'];
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), near);
    const li = near.indexOf(lvl);
    const byDist = pool => pool.slice().sort((a, b) =>
      Math.abs(near.indexOf(a.level) - li) - Math.abs(near.indexOf(b.level) - li));
    const takeType = (type, n) =>
      byDist(this.bank.items.filter(it => it.block === 'uoe2' && it.type === type && !this.used.has(it.id))).slice(0, n);
    return [].concat(
      takeType('order', this.cfg.uoeOrder || 0),
      takeType('bankfill', this.cfg.uoeBankfill || 0),
      takeType('match', this.cfg.uoeMatch || 0)
    );
  }

  // --- Блок 5: reading — текст на уровне (2 задания) + 1 с соседнего ---
  buildReading() {
    const avail = ['A2', 'B1', 'B2', 'C1'];
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), avail);
    const texts = this.bank.readingTexts.filter(t => t.level === lvl);
    const main = this.pick(texts);
    let picked = [main];
    let items = this.bank.items.filter(it => it.source === main.id);
    const li = avail.indexOf(lvl);
    // полный вариант: второй текст (тот же уровень, при нехватке — любой другой)
    if ((this.cfg.readTexts || 1) >= 2) {
      const second = this.pick(this.bank.readingTexts.filter(t => t.level === lvl && t.id !== main.id))
        || this.pick(this.bank.readingTexts.filter(t => t.id !== main.id));
      if (second) {
        picked.push(second);
        items = items.concat(this.bank.items.filter(it => it.source === second.id));
      }
    }
    const adjLvl = avail[Math.min(avail.length - 1, li + 1)] === lvl ? avail[Math.max(0, li - 1)] : avail[Math.min(avail.length - 1, li + 1)];
    const adjText = this.pick(this.bank.readingTexts.filter(t => t.level === adjLvl && !picked.some(p => p.id === t.id)));
    const adjItem = adjText ? this.bank.items.filter(it => it.source === adjText.id)[0] : null;
    if (adjText) picked.push(adjText);
    const cap = (this.cfg.readTexts || 1) >= 2 ? 6 : 3;
    return { texts: picked, items: items.concat(adjItem ? [adjItem] : []).slice(0, cap) };
  }

  clampLevel(lvl, avail) {
    if (avail.includes(lvl)) return lvl;
    const all = ['A0', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    let i = all.indexOf(lvl);
    // ближайший доступный
    let best = avail[0], bd = 99;
    avail.forEach(a => { const d = Math.abs(all.indexOf(a) - i); if (d < bd) { bd = d; best = a; } });
    return best;
  }

  // --- Блок 6: UoE — батч из 10 под текущую θ̂ (навигация вперёд/назад) ---
  // ВРЕМЕННАЯ схема (pilot mode): лестница уровней вокруг θ̂, случайно внутри
  // уровня, ≤2 заданий на constructFamily, квоты форматов 4/3/3.
  // После калибровки b заменяется на maximum-information-отбор здесь же.
  buildUoeBatch(n) {
    n = n || this.cfg.uoe || this.bank.blocks.itemsPerSession;
    const avail = ['A1', 'A2', 'B1', 'B2', 'C1'];
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), avail);
    const li = avail.indexOf(lvl);
    // 4 на уровне, 3 уровнем выше, 3 ниже (с зажимом на краях)
    const seq = [];
    for (let k = 0; k < 4; k++) seq.push(li);
    for (let k = 0; k < 3; k++) seq.push(Math.min(avail.length - 1, li + 1));
    for (let k = 0; k < 3; k++) seq.push(Math.max(0, li - 1));
    const famCount = {}, quota = Object.assign({}, this.bank.blocks.formatMix);
    const picked = [];
    const take = (pool) => {
      const c = pool.filter(it => !picked.includes(it) &&
        (famCount[it.constructFamily] || 0) < 2 && (quota[it.format] || 0) > 0);
      const c2 = c.length ? c : pool.filter(it => !picked.includes(it) && (famCount[it.constructFamily] || 0) < 2);
      const c3 = c2.length ? c2 : pool.filter(it => !picked.includes(it));
      if (!c3.length) return null;
      const it = c3[Math.floor(this.rnd() * c3.length)];
      picked.push(it);
      famCount[it.constructFamily] = (famCount[it.constructFamily] || 0) + 1;
      if (quota[it.format] > 0) quota[it.format]--;
      return it;
    };
    seq.forEach(idx => take(this.itemsOf('uoe', avail[idx])));
    while (picked.length < n) {
      const it = take(this.bank.items.filter(x => x.block === 'uoe' && !this.used.has(x.id)));
      if (!it) break;
    }
    return picked.slice(0, n);
  }

  // --- Блоки 7/8: writing/speaking на уровне ---
  pickAtLevel(block, n) {
    const avail = [...new Set(this.bank.items.filter(it => it.block === block).map(it => it.level))];
    const lvl = this.clampLevel(levelFromTheta(this.est.theta), avail);
    let pool = this.itemsOf(block, lvl);
    const all = ['A1', 'A2', 'B1', 'B2', 'C1'];
    let li = all.indexOf(lvl), d = 1;
    while (pool.length < n && d < 5) {
      if (all[li - d]) pool = pool.concat(this.itemsOf(block, all[li - d]));
      if (all[li + d]) pool = pool.concat(this.itemsOf(block, all[li + d]));
      d++;
    }
    return seededShuffle(pool, this.rnd).slice(0, n);
  }

  // --- Запись ответа ---
  answer(item, payload) {
    // payload: {optIndex|null, text|null, tMs, shownOrder, playsUsed}
    let correct = null;
    if (item.options) correct = payload.optIndex === item.key ? 1 : 0;
    else if (item.answer) correct = checkOpenAnswer(item, payload.text) ? 1 : 0;
    const entry = {
      id: item.id, block: item.block, level: item.level,
      optIndex: payload.optIndex != null ? payload.optIndex : null,
      text: payload.text != null ? payload.text : null,
      correct, tMs: payload.tMs || 0,
      shownOrder: payload.shownOrder || null, playsUsed: payload.playsUsed || null
    };
    this.log.push(entry);
    this.used.add(item.id);
    if (correct != null && item.affectsLevel !== false) {
      this.responses.push({ item, correct });
      this.updateTheta(item.id);
    }
    return correct;
  }

  // Градуированный ответ (tfns/order/bankfill/match): correct ∈ [0..1]
  answerGraded(item, fraction, meta) {
    const entry = Object.assign({
      id: item.id, block: item.block, level: item.level, type: item.type || null,
      correct: Math.max(0, Math.min(1, fraction))
    }, meta || {});
    this.log.push(entry);
    this.used.add(item.id);
    if (item.affectsLevel !== false) {
      this.responses.push({ item, correct: entry.correct });
      this.updateTheta(item.id);
    }
    return entry.correct;
  }

  // Профиль по навыкам (полный вариант): отдельная EAP-оценка по подмножествам
  skillProfile() {
    const groups = {
      listening: ['listening', 'minpair', 'clip'],
      grammar: ['uoe', 'uoe2', 'routing'],
      reading: ['reading']
    };
    const out = {};
    Object.keys(groups).forEach(k => {
      const rs = this.responses.filter(r => groups[k].includes(r.item.block));
      if (rs.length >= 4) {
        const est = eapEstimate(this.theta0, rs, null);
        out[k] = { theta: est.theta, se: est.se, level: levelFromTheta(est.theta), n: rs.length };
      } else out[k] = null;
    });
    return out;
  }

  answerWriting(item, text) {
    const sc = scoreWriting(item, text);
    this.production.writing = { id: item.id, text, score: sc };
    this.log.push({ id: item.id, block: 'writing', text, score: sc });
    this.used.add(item.id);
    if (item.affectsLevel !== false) {
      this.responses.push({ item, correct: sc.total / 9 });
      this.updateTheta(item.id);
    }
    return sc;
  }

  answerSpeaking(item, rec) {
    const sc = scoreSpeaking(item, rec);
    this.production.speaking.push({ id: item.id, rec: rec ? { durationSec: rec.durationSec, voicedSec: rec.voicedSec, transcript: rec.transcript } : null, score: sc });
    this.log.push({ id: item.id, block: 'speaking', score: sc });
    this.used.add(item.id);
    // affectsLevel: false — в θ не входит
    return sc;
  }

  finishVocab(answers) {
    this.lex.result = vocabScore(this.lex.items, answers);
    this.updateTheta('vocab');
    this.log.push({ block: 'vocab', answers: answers.slice(), words: this.lex.items.map(i => i.w), result: this.lex.result });
  }

  // --- A0-ветка ---
  routingVerdict() {
    const r = this.log.filter(e => e.block === 'routing');
    const wrong = r.filter(e => e.correct === 0).length + (6 - r.length); // без ответа = провал
    if (wrong >= 4) { this.a0.branched = true; this.addFlag('a0_branch'); }
    return this.a0.branched;
  }
  bridgeItems() { return this.bank.items.filter(it => it.block === 'a0_bridge').slice(0, 2); }
  bridgeVerdict() {
    const b = this.log.filter(e => e.block === 'a0_bridge');
    this.a0.bridgePassed = b.length >= 2 && b.every(e => e.correct === 1);
    if (this.a0.bridgePassed) {
      // возврат в основной тест со старта A1: сбрасываем приор на A1
      this.theta0 = PROVISIONAL_B.A1;
      this.responses = [];
      this.updateTheta('bridge_return');
    }
    return this.a0.bridgePassed;
  }

  // --- Финал ---
  computeFlags() {
    const t = this.est.theta;
    const w = this.production.writing ? this.production.writing.score.total : 0;
    const wMax = this.production.writing ? 9 : 0;
    let s = 0, sMax = 0;
    this.production.speaking.forEach(x => { if (x.score) { s += x.score.got; sMax += x.score.max; } });
    const prodMax = wMax + sMax;
    const prodRatio = prodMax > 0 ? (w + s) / prodMax : null;
    if (prodRatio != null && prodRatio < 0.45 && t >= -1.0) this.addFlag('recognition_gap');
    if (prodRatio != null && prodRatio >= 0.75 && t < -1.8) this.addFlag('underestimated');
    if (this.est.se > 0.6) this.addFlag('unresolved');
    return { prodRatio };
  }

  result() {
    const extras = this.computeFlags();
    const skills = {};
    ['routing', 'listening', 'minpair', 'clip', 'reading', 'uoe', 'uoe2'].forEach(b => {
      const e = this.log.filter(x => x.block === b && x.correct != null);
      // для градуированных «верно» = ≥0.99; частичный зачёт виден в сумме score
      skills[b] = e.length ? {
        n: e.length,
        correct: e.filter(x => x.correct >= 0.99).length,
        score: Math.round(e.reduce((a, x) => a + x.correct, 0) * 10) / 10
      } : null;
    });
    return {
      variant: this.variant,
      skillProfile: this.cfg.skillProfile ? this.skillProfile() : null,
      level: this.a0.branched && !this.a0.bridgePassed ? 'A0' : levelFromTheta(this.est.theta),
      theta: this.est.theta, se: this.est.se,
      cutsProvisional: CUTS.provisional, pilotMode: this.pilotMode,
      flags: this.flags.slice(), skills,
      lex: this.lex && this.lex.result,
      writing: this.production.writing,
      speaking: this.production.speaking,
      prodRatio: extras.prodRatio,
      pronunciation: null // отдельное поле; на уровень не влияет; в этой версии не оценивается
    };
  }

  exportJson() {
    return {
      version: this.bank.version, generated: new Date().toISOString(),
      seed: this.seed, lang: this.lang, theta0: this.theta0,
      pilotMode: this.pilotMode, cuts: CUTS,
      appliedPatches: this.appliedPatches || [],
      flags: this.flags, thetaTrace: this.thetaTrace,
      log: this.log, result: this.result(),
      audioAvailable: this.audioAvailable, micAvailable: this.micAvailable
    };
  }
}

// ---------- Симуляция (используется валидационным прогоном; в браузере не вызывается) ----------
function simulateSession(bank, manifest, vocab, seed, pattern, variant) {
  const s = new Session(bank, manifest, seed, variant || 'express');
  const rnd = mulberry32(seed ^ 0x9E3779B9);
  const pc = {
    random:   { mcq: () => Math.floor(rnd() * 4), openP: 0.05, vocabP: 0.25, idkP: 0.0, cando: 2 },
    position: { mcq: () => 1, openP: 0.0, vocabP: null, idkP: 0.0, cando: 2 }, // vocab: тоже позиция 1
    strong:   { mcqP: 0.92, openP: 0.9, vocabP: 0.93, idkP: 0.05, cando: 4 },
    weak:     { mcqP: 0.25, openP: 0.02, vocabP: 0.3, idkP: 0.3, cando: 0 },
    mid:      { mcqP: 0.6, openP: 0.45, vocabP: 0.6, idkP: 0.1, cando: 2 }
  }[pattern];

  const answerMcq = (item, shown) => {
    let optIndex;
    if (pc.mcq) optIndex = shown[Math.min(pc.mcq(), shown.length - 1)];
    else optIndex = rnd() < pc.mcqP ? item.key : shown.filter(i => i !== item.key)[Math.floor(rnd() * 3)];
    s.answer(item, { optIndex, tMs: 4000, shownOrder: shown });
  };
  const answerOpen = (item) => {
    const ok = rnd() < pc.openP;
    s.answer(item, { text: ok ? item.answer[0] : 'xx', tMs: 6000 });
  };
  const shownOrder = (item) => item.fixedOrder ? item.options.map((_, i) => i) : seededShuffle(item.options.map((_, i) => i), s.rnd);

  s.setCanDo(pc.cando);
  // роутинг
  const routing = s.buildRouting();
  routing.forEach(it => answerMcq(it, shownOrder(it)));
  if (s.routingVerdict()) {
    s.bridgeItems().forEach(it => answerOpen(it));
    if (!s.bridgeVerdict()) return s; // результат A0
  }
  // minimal pairs: бинарные, вероятность как у mcq (но 2 опции)
  s.buildMinpairs().forEach(it => {
    const ok = pc.mcq ? true : rnd() < (pc.mcqP + (1 - pc.mcqP) / 2); // угадывание 50%
    s.answerGraded(it, ok ? 1 : 0, { playsUsed: 1 });
  });
  // listening (mcq/who — как обычные; tfns/order — градуированные)
  const L = s.buildListening();
  L.items.forEach(it => {
    if (it.type === 'tfns') {
      const ans = it.statements.map(st => (pc.mcq ? 'T' : (rnd() < pc.mcqP ? st.key : (st.key === 'T' ? 'F' : 'T'))));
      s.answerGraded(it, scoreTfns(it, ans), { answers: ans });
    } else if (it.type === 'order') {
      const ok = pc.mcq ? false : rnd() < pc.mcqP;
      s.answerGraded(it, ok ? 1 : 0.25, {});
    } else if (it.options) answerMcq(it, shownOrder(it));
  });
  // видеоклипы (full)
  s.buildClips().forEach(it => answerMcq(it, shownOrder(it)));
  // раздел слов (по значениям)
  s.lex = { items: vocabDraw(vocab, s.theta0, s.rnd) };
  const answers = s.lex.items.map(it => {
    if (pc.vocabP == null) return Math.min(1, it.options.length - 1); // «всегда позиция B»
    if (rnd() < pc.idkP) return -1;
    if (rnd() < pc.vocabP) return it.correctIndex;
    const wrong = it.options.map((_, i) => i).filter(i => i !== it.correctIndex);
    return wrong[Math.floor(rnd() * wrong.length)];
  });
  s.finishVocab(answers);
  // reading
  const R = s.buildReading();
  R.items.forEach(it => answerMcq(it, shownOrder(it)));
  // uoe — батч под вариант
  s.buildUoeBatch().forEach(it => answerOpen(it));
  // интерактивная грамматика: порядок слов / банк слов / пары
  s.buildInteractive().forEach(it => {
    const p = pc.mcq ? 0.2 : pc.openP;
    if (it.type === 'order') {
      const words = it.answer.replace(/\.$/, '').split(' ');
      const arr = rnd() < p ? words : seededShuffle(words, s.rnd);
      s.answerGraded(it, scoreOrderWords(words, arr), {});
    } else if (it.type === 'bankfill') {
      const ans = it.answers.map(a => rnd() < p ? a : it.bankWords[0]);
      s.answerGraded(it, scoreBankfill(it, ans), {});
    } else if (it.type === 'match') {
      const map = it.pairs.map((_, i) => rnd() < p ? i : (i + 1) % it.pairs.length);
      s.answerGraded(it, scoreMatch(it, map), {});
    }
  });
  // writing
  const wIt = s.pickAtLevel('writing', 1)[0];
  if (wIt) {

  function playerWidget(srcId) {
    const ctl = getCtl(srcId);
    return `<div class="player" data-player="${srcId}">
      <div class="player-row">
        <button class="btn btn-audio pl-btn"></button>
        <input type="range" class="pl-seek" min="0" max="1000" value="0">
        <span class="pl-time">0:00</span>
      </div>
      <div class="player-sub">
        <span class="plays">${T('listenLeft')}<b class="pl-left"></b></span>
        <span class="audmsg pl-msg" hidden>${T('audioMissing')}</span>
      </div>
    </div>`;
  }
  function wirePlayers(container) {
    const widgets = [...container.querySelectorAll('[data-player]')];
    if (!widgets.length) return;
    const paint = () => {
      widgets.forEach(el => {
        const ctl = getCtl(el.dataset.player);
        const btn = el.querySelector('.pl-btn'), seek = el.querySelector('.pl-seek'),
          time = el.querySelector('.pl-time'), left = el.querySelector('.pl-left'),
          msg = el.querySelector('.pl-msg');
        const leftN = Math.max(0, ctl.allowed - ctl.playsUsed);
        left.textContent = leftN;
        msg.hidden = !ctl.failed;
        const playing = ctl.mode === 'tts' ? (ctl.ttsBusy && !ctl.ttsPaused) : (ctl.au && !ctl.au.paused && !ctl.au.ended);
        const midway = ctl.mode !== 'tts' && ctl.au && !ctl.au.ended && ctl.au.currentTime >= 0.5;
        btn.textContent = playing ? T('playerPause') : (leftN <= 0 && !midway) ? T('playerReplay') : (midway ? T('playerPlay') : T('playerPlay'));
        const ttsMid = ctl.mode === 'tts' && ctl.ttsPaused;
        btn.disabled = !playing && !midway && !ttsMid && leftN <= 0;
        if (ctl.mode === 'tts' || ctl.failed) { seek.style.display = 'none'; time.style.display = 'none'; }
        else if (ctl.au && isFinite(ctl.au.duration) && ctl.au.duration > 0) {
          seek.style.display = ''; time.style.display = '';
          seek.disabled = false;
          if (!ctl._scrub) seek.value = Math.round(1000 * ctl.au.currentTime / ctl.au.duration);
          time.textContent = fmtSec(ctl.au.currentTime) + ' / ' + fmtSec(ctl.au.duration);
        } else { seek.disabled = true; time.textContent = ''; }
      });
    };
    widgets.forEach(el => {
      const ctl = getCtl(el.dataset.player);
      el.querySelector('.pl-btn').onclick = () => { ctlToggle(ctl); setTimeout(paint, 60); };
      const seekEl = el.querySelector('.pl-seek');
      // скраб: пока палец/мышь на слайдере, paint() его не перезаписывает;
      // позиция применяется и по ходу (input), и при отпускании (change)
      const applySeek = v => { if (ctl.au && isFinite(ctl.au.duration) && ctl.au.duration > 0) ctl.au.currentTime = ctl.au.duration * v / 1000; };
      seekEl.onpointerdown = () => { ctl._scrub = true; };
      seekEl.oninput = e => { ctl._scrub = true; applySeek(+e.target.value); };
      seekEl.onchange = e => { applySeek(+e.target.value); ctl._scrub = false; };
      seekEl.onpointerup = e => { ctl._scrub = false; };
      seekEl.onpointercancel = () => { ctl._scrub = false; };
    });
    if (playerInt) clearInterval(playerInt);
    playerInt = setInterval(paint, 250);
    paint();
  }

  // ---------- teacher-подсказка на вопросе ----------
  function teacherHint(item) {
    if (!teacherMode) return '';
    if (item.qs) return ''; // группа вопросов аудирования — подсказки внутри группы
    if (item.block === 'minpair') return `<div class="tpanel">${T('key')}: <b>${item.word}</b> (vs ${item.distractor}) · ${item.level}</div>`;
    if (item.block === 'uoe2' || item.type === 'tfns' || item.type === 'order') {
      let k = '';
      if (item.type === 'order') k = item.answer || (item.steps || []).join(' → ');
      else if (item.type === 'bankfill') k = (item.answers || []).join(', ');
      else if (item.type === 'match') k = (item.pairs || []).map(p => p[0] + ' ↔ ' + p[1]).join('; ');
      else if (item.type === 'tfns') k = (item.statements || []).map(s => s.key).join(', ');
      return `<div class="tpanel">${T('key')}: <b>${k}</b> · ${item.level}</div>`;
    }
    if (item.correctIndex != null && item.options && typeof item.options[0] === 'string') {
      return `<div class="tpanel">${T('key')}: <b>${item.options[item.correctIndex]}</b> · ${item.band}</div>`;
    }
    if (item.options) {
      const mis = item.options.map((o, i) => i === item.key
        ? `<li><b>✔ ${o.t}</b></li>`
        : `<li>${o.t} — ${o.m || '—'}</li>`).join('');
      return `<div class="tpanel"><div>${item.construct || ''} · ${item.level}</div><ul>${mis}</ul></div>`;
    }
    return `<div class="tpanel">${T('key')}: <b>${(item.answer || []).join(' / ')}</b> · ${item.construct || ''} · ${item.level}</div>`;
  }

  // ============================================================
  // Универсальный раздел с навигацией вперёд/назад
  // cfg: {name, intro, items, renderItem(it, draft, refresh) -> {html, wire},
  //       answered(draft), onFinish(drafts)}
  // ============================================================
  function runSection(cfg) {
    const drafts = cfg.items.map(() => ({}));
    const t0 = Date.now();
    let idx = 0;

    const intro = () => show(() => {
      render(`
        <h2>${cfg.name}</h2>
        <p class="hint">${cfg.intro}</p>
        ${thetaLine()}
        <button class="btn btn-primary" id="sec-start">${T('startSection')}</button>`, cfg.name);
      $('#sec-start').onclick = () => { question(); };
    });

    const answeredCount = () => drafts.filter((d, i) => cfg.answered(d, cfg.items[i])).length;

    const question = () => show(() => {
      const it = cfg.items[idx];
      const r = cfg.renderItem(it, drafts[idx], question);
      const n = cfg.items.length;
      const allDone = answeredCount() === n;
      render(`
        <div class="qcount">${T('qOf', { i: idx + 1, n })}</div>
        ${r.html}
        ${teacherHint(it.item || it)}
        <div class="navrow">
          <button class="btn btn-nav" id="nav-back" ${idx === 0 ? 'disabled' : ''}>← ${T('back')}</button>
          ${idx < n - 1
            ? `<button class="btn btn-nav btn-nav-next" id="nav-next">${T('next')} →</button>`
            : `<button class="btn btn-primary btn-fin" id="nav-fin">${T('finishSection')}</button>`}
        </div>
        ${idx < n - 1 && allDone ? `<button class="btn btn-primary btn-fin" id="nav-fin">${T('finishSection')} (${T('answeredOf', { a: answeredCount(), n })})</button>` : ''}`,
        cfg.name);
      if (r.wire) r.wire();
      const back = $('#nav-back'); if (back) back.onclick = () => { stopMedia(); idx--; question(); };
      const next = $('#nav-next'); if (next) next.onclick = () => { stopMedia(); idx++; question(); };
      const fin = $('#nav-fin'); if (fin) fin.onclick = () => {
        stopMedia();
        S.log.push({ sectionDone: cfg.key || cfg.name, elapsedMs: Date.now() - t0 });
        cfg.onFinish(drafts);
      };
    });

    intro();
  }

  // — рендеры типов заданий —
  function mcqRender(item, draft, refresh, extraHtml) {
    if (!item._order) item._order = item.fixedOrder
      ? item.options.map((_, i) => i)
      : seededShuffle(item.options.map((_, i) => i), S.rnd);
    const html = `
      ${extraHtml || ''}
      <div class="stem">${item.stem.replace(/\n/g, '<br>')}</div>
      <div class="opts">${item._order.map((oi, pos) =>
        `<button class="btn opt ${draft.optIndex === oi ? 'sel' : ''}" data-oi="${oi}">${'ABCD'[pos]}. ${item.options[oi].t}</button>`).join('')}</div>`;
    const wire = () => {
      document.querySelectorAll('[data-oi]').forEach(b => b.onclick = () => {
        draft.optIndex = +b.dataset.oi;
        draft.shownOrder = item._order;
        refresh();
      });
    };
    return { html, wire };
  }

  function openRender(item, draft, refresh) {
    let head = '';
    if (item.format === 'wform') head = `<div class="kw">${T('wformRoot')}<b>${item.root}</b> · ${T('hintOneWord')}</div>`;
    else if (item.format === 'transform') head = `<div class="kw">${T('transformKw')}<b>${item.keyword}</b> · ${T('hintTransform')}</div><div class="stem stem-src">${item.stem}</div>`;
    else if (item.block === 'uoe' || item.block === 'a0_bridge') head = `<div class="kw">${T('hintOneWord')}</div>`;
    const stem = item.format === 'transform' ? (item.target || '') : item.stem;
    const html = `
      ${head}
      <div class="stem">${stem.replace(/\n/g, '<br>')}</div>
      <input class="inp" id="open-inp" autocomplete="off" autocapitalize="off"
        placeholder="${T('typeAnswer')}" value="${(draft.text || '').replace(/"/g, '&quot;')}">`;
    const wire = () => {
      const inp = $('#open-inp');
      inp.oninput = () => { draft.text = inp.value; updateNavFin(); };
    };
    return { html, wire };
  }
  // лёгкое обновление кнопки завершения без перерисовки (чтобы не терять фокус ввода)
  function updateNavFin() { /* завершение доступно с последнего вопроса — ничего не требуется */ }

  // — сборка последовательности из плашек (порядок слов / порядок событий) —
  // d.seq: массив выбранных индексов; повторный тап по выбранной плашке убирает её
  function seqHtml(id, labels, d, hint) {
    const seq = d.seq || [];
    return `
      <div class="hint">${hint}</div>
      <div class="tilebank">${labels.map((w, i) => seq.includes(i) ? '' :
        `<button class="btn tile" data-sq="${id}" data-act="add" data-i="${i}">${w}</button>`).join('')}</div>
      <div class="hint seq-your">${T('orderYour')}</div>
      <div class="tileout">${seq.map(i =>
        `<button class="btn tile tile-sel" data-sq="${id}" data-act="rm" data-i="${i}">${labels[i]}</button>`).join('') || '<span class="tile-empty">…</span>'}
      ${seq.length ? `<button class="btn tile btn-idk" data-sq="${id}" data-act="reset">${T('reset')}</button>` : ''}</div>`;
  }
  function wireSeq(container, id, d, refresh) {
    container.querySelectorAll(`[data-sq="${id}"]`).forEach(b => b.onclick = () => {
      const seq = (d.seq || []).slice();
      if (b.dataset.act === 'add') seq.push(+b.dataset.i);
      else if (b.dataset.act === 'rm') seq.splice(seq.indexOf(+b.dataset.i), 1);
      else seq.length = 0;
      d.seq = seq;
      refresh();
    });
  }

  // — T/F/NS: три утверждения, у каждого три кнопки —
  function tfnsHtml(q, d) {
    const cur = d[q.id] || {};
    return `<div class="hint">${T('tfnsHint')}</div>` + q.statements.map((st, si) => `
      <div class="tfrow">

  // — банк слов: пропуски в тексте + плашки —
  function bankfillHtml(item, d) {
    const gaps = d.gaps || (d.gaps = item.answers.map(() => null));
    let gi = 0;
    const text = item.text.replace(/__\d__/g, () => {
      const i = gi++;
      return `<button class="btn gap ${gaps[i] ? 'gap-filled' : ''}" data-bg="${i}">${gaps[i] || '____'}</button>`;
    });
    if (!item._bankOrder) item._bankOrder = seededShuffle(item.bankWords.map((_, i) => i), S.rnd);
    const usedWords = gaps.filter(Boolean);
    const counts = {};
    usedWords.forEach(w => { counts[w] = (counts[w] || 0) + 1; });
    return `
      <span class="iid" hidden data-iid="${item.id}"></span>
      <div class="hint">${T('bankfillHint')}</div>
      <div class="stem bftext">${text}</div>
      <div class="tilebank">${item._bankOrder.map(bi => {
        const w = item.bankWords[bi];
        if (counts[w]) { counts[w]--; return ''; } // уже стоит в пропуске
        return `<button class="btn tile" data-bw="${bi}">${w}</button>`;
      }).join('')}</div>`;
  }
  function wireBankfill(container, item, d, refresh) {
    container.querySelectorAll('[data-bw]').forEach(b => b.onclick = () => {
      const i = d.gaps.indexOf(null);
      if (i >= 0) { d.gaps[i] = item.bankWords[+b.dataset.bw]; refresh(); }
    });
    container.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => {
      d.gaps[+b.dataset.bg] = null; refresh();
    });
  }

  // — пары: тап слева, затем тап справа; повторный тап по паре разрывает —
  function matchHtml(item, d) {
    if (!d.map) d.map = item.pairs.map(() => null);
    if (!item._rOrder) item._rOrder = seededShuffle(item.pairs.map((_, i) => i), S.rnd);
    const usedR = d.map.filter(x => x != null);
    return `
      <span class="iid" hidden data-iid="${item.id}"></span>
      <div class="hint">${T('matchHint')}</div>
      <div class="mgrid">
        <div class="mcol">${item.pairs.map((p, li) => {
          const linked = d.map[li] != null;
          return `<button class="btn mitem ${d.selL === li ? 'sel' : ''} ${linked ? 'mlinked' : ''}" data-ml="${li}">${p[0]}${linked ? ' ↔' : ''}</button>`;
        }).join('')}</div>
        <div class="mcol">${item._rOrder.map(ri => {
          const linkedTo = d.map.indexOf(ri);
          return `<button class="btn mitem ${linkedTo >= 0 ? 'mlinked' : ''}" data-mr="${ri}" ${linkedTo >= 0 && d.selL == null ? '' : ''}>${item.pairs[ri][1]}</button>`;
        }).join('')}</div>
      </div>`;
  }
  function wireMatch(container, item, d, refresh) {
    container.querySelectorAll('[data-ml]').forEach(b => b.onclick = () => {
      const li = +b.dataset.ml;
      if (d.map[li] != null) { d.map[li] = null; d.selL = null; } // разорвать пару
      else d.selL = d.selL === li ? null : li;
      refresh();
    });
    container.querySelectorAll('[data-mr]').forEach(b => b.onclick = () => {
      const ri = +b.dataset.mr;
      const owner = d.map.indexOf(ri);
      if (owner >= 0) { d.map[owner] = null; refresh(); return; } // разорвать пару
      if (d.selL != null) { d.map[d.selL] = ri; d.selL = null; refresh(); }
    });
  }

  // --- Разминка (роутинг) ---
  function sectionRouting() {
    const items = S.buildRouting();
    runSection({
      key: 'routing', name: T('blockRouting'), intro: T('introRouting'),
      items,
      renderItem: (it, d, refresh) => mcqRender(it, d, refresh),
      answered: d => d.optIndex != null,
      onFinish: drafts => {
        items.forEach((it, i) => S.answer(it, { optIndex: drafts[i].optIndex != null ? drafts[i].optIndex : null, shownOrder: drafts[i].shownOrder || null }));
        if (S.routingVerdict()) sectionA0(); else sectionMinpair();
      }
    });
  }

  // --- A0-ветка ---
  function sectionA0() {
    const items = S.bridgeItems();
    runSection({
      key: 'a0_bridge', name: T('a0Title'), intro: T('a0Note'),
      items,
      renderItem: (it, d, refresh) => openRender(it, d, refresh),
      answered: d => !!(d.text && d.text.trim()),
      onFinish: drafts => {
        items.forEach((it, i) => S.answer(it, { text: drafts[i].text || '' }));
        if (S.bridgeVerdict()) sectionMinpair(); else finishTest();
      }
    });
  }

  // --- Различение слов (minimal pairs): mp3 -> TTS-фоллбэк ---
  const mpAudio = {};
  function sectionMinpair() {
    if (!S.audioAvailable) { sectionListening(); return; }
    const items = S.buildMinpairs();
    if (!items.length) { sectionListening(); return; }
    runSection({
      key: 'minpair', name: T('blockMinpair'), intro: T('introMinpair'),
      items,
      renderItem: (it, d, refresh) => {
        if (!it._mporder) it._mporder = seededShuffle([it.word, it.distractor], S.rnd);
        const left = Math.max(0, 2 - (d.plays || 0));
        const html = `
          <span class="iid" hidden data-iid="${it.id}"></span>
          <div class="aud">
            <button class="btn btn-audio" id="mp-play" ${left <= 0 ? 'disabled' : ''}>${T('soundPlay')}</button>
            <span class="plays">${T('listenLeft')}<b>${left}</b></span>
          </div>
          <div class="hint">${T('mpQ')}</div>
          <div class="opts">${it._mporder.map(w =>
            `<button class="btn opt mp-opt ${d.sel === w ? 'sel' : ''}" data-mp="${w.replace(/"/g, '&quot;')}">${w}</button>`).join('')}</div>`;
        const wire = () => {
          const pb = $('#mp-play');
          if (pb) pb.onclick = () => {
            if ((d.plays || 0) >= 2) return;
            d.plays = (d.plays || 0) + 1;
            stopMedia();
            let au = mpAudio[it.id];
            if (!au) { au = new Audio(AUDIO_BASE + it.file); mpAudio[it.id] = au; }
            au.currentTime = 0;
            au.play().catch(() => { ttsSpeak([it.sentence || it.word]); });
            refresh();
          };
          document.querySelectorAll('[data-mp]').forEach(b => b.onclick = () => { d.sel = b.dataset.mp; refresh(); });
        };
        return { html, wire };
      },
      answered: d => d.sel != null,
      onFinish: drafts => {
        items.forEach((it, i) => S.answerGraded(it, drafts[i].sel === it.word ? 1 : 0,
          { sel: drafts[i].sel || null, playsUsed: drafts[i].plays || 0 }));
        sectionListening();
      }
    });
  }

  // --- Аудирование: экран = одна запись + все её вопросы ---
  function sectionListening() {
    if (!S.audioAvailable) { S.addFlag('audio_unavailable'); sectionVocab(); return; }
    const L = S.buildListening();
    const items = L.items.slice(0, 6);
    if (!items.length) { sectionVocab(); return; }
    const groups = L.sources.map(src => ({ source: src, qs: items.filter(q => q.source === src) }))
      .filter(g => g.qs.length);
    runSection({
      key: 'listening', name: T('blockListening'), intro: T('introListening'),
      items: groups,
      renderItem: (grp, d, refresh) => {
        const qHtml = grp.qs.map(q => {
          if (q.type === 'tfns') {
            return `<div class="lq">${tfnsHtml(q, d)}${teacherHint(q)}</div>`;
          }
          if (q.type === 'order') {
            if (!d['_sq_' + q.id]) d['_sq_' + q.id] = {};
            return `<div class="lq"><div class="stem stem-lq">${q.stem}</div>
              ${seqHtml(q.id, q.steps, d['_sq_' + q.id], T('orderSeqHint'))}${teacherHint(q)}</div>`;
          }
          if (!q._order) q._order = q.fixedOrder
            ? q.options.map((_, i) => i)
            : seededShuffle(q.options.map((_, i) => i), S.rnd);
          return `<div class="lq">
            <div class="stem stem-lq">${q.stem.replace(/\n/g, '<br>')}</div>
            <div class="opts">${q._order.map((oi, pos) =>
              `<button class="btn opt ${d[q.id] === oi ? 'sel' : ''}" data-lq="${q.id}" data-oi="${oi}">${'ABCD'[pos]}. ${q.options[oi].t}</button>`).join('')}</div>
            ${teacherHint(q)}
          </div>`;
        }).join('');
        const html = playerWidget(grp.source) + qHtml;
        const wire = () => {
          wirePlayers(app);
          document.querySelectorAll('[data-lq]').forEach(b => b.onclick = () => {
            d[b.dataset.lq] = +b.dataset.oi;
            refresh();
          });
          grp.qs.forEach(q => {
            if (q.type === 'tfns') wireTfns(app, q, d, refresh);
            if (q.type === 'order') wireSeq(app, q.id, d['_sq_' + q.id], refresh);
          });
        };
        return { html, wire };
      },
      answered: (d, grp) => grp ? grp.qs.every(q => {
        if (q.type === 'tfns') return d[q.id] && q.statements.every((_, si) => d[q.id][si] != null);
        if (q.type === 'order') return d['_sq_' + q.id] && (d['_sq_' + q.id].seq || []).length === q.steps.length;
        return d[q.id] != null;
      }) : Object.keys(d).length > 0,
      onFinish: drafts => {
        groups.forEach((g, gi) => g.qs.forEach(q => {
          const d = drafts[gi];
          const plays = getCtl(g.source).playsUsed;
          if (q.type === 'tfns') {
            const ans = q.statements.map((_, si) => (d[q.id] || {})[si] || null);
            S.answerGraded(q, scoreTfns(q, ans), { answers: ans, playsUsed: plays });
          } else if (q.type === 'order') {
            const seq = (d['_sq_' + q.id] || {}).seq || [];
            // эталон — исходный порядок шагов 0..n-1
            const target = q.steps.map((_, i) => i);
            S.answerGraded(q, scoreOrderWords(target, seq), { seq, playsUsed: plays });
          } else {
            S.answer(q, {
              optIndex: d[q.id] != null ? d[q.id] : null,
              shownOrder: q._order || null,
              playsUsed: plays
            });
          }
        }));
        sectionClips();
      }
    });
  }

  // --- Кино на слух: видеофраза + «что вы услышали?» (полный вариант) ---
  function sectionClips() {
    if (!S.cfg.clips || !S.audioAvailable || S.videoAvailable === false) { sectionVocab(); return; }
    const items = S.buildClips();
    if (!items.length) { sectionVocab(); return; }
    const vplays = {}; // просмотры по source id
    runSection({
      key: 'clip', name: T('blockClips'), intro: T('introClips'),
      items,
      renderItem: (it, d, refresh) => {
        const m = MANIFEST.sources.find(x => x.id === it.source) || {};
        if (!it._order) it._order = seededShuffle(it.options.map((_, i) => i), S.rnd);
        const left = Math.max(0, (m.playsAllowed || 2) - (vplays[it.source] || 0));
        const html = `
          <span class="iid" hidden data-iid="${it.id}"></span>
          ${videoTag(m.file)}
          <div class="aud">
            <button class="btn btn-audio" id="v-play" ${left <= 0 ? 'disabled' : ''}>${T('soundPlay')}</button>
            <span class="plays">${T('listenLeft')}<b>${left}</b></span>
            <span class="audmsg" id="v-msg" hidden>${T('videoMissing')}</span>
          </div>
          <div class="stem stem-lq">${T('clipQ')}</div>
          <div class="opts">${it._order.map((oi, pos) =>
            `<button class="btn opt ${d.optIndex === oi ? 'sel' : ''}" data-cq="${oi}">${'ABCD'[pos]}. ${it.options[oi].t}</button>`).join('')}</div>`;
        const wire = () => {
          const v = app.querySelector('.vclip'), pb = $('#v-play');
          // ВАЖНО: никакого refresh() после play() — перерисовка уничтожает
          // <video> и обрывает воспроизведение (AbortError выглядел как
          // «видео не найдено»). Счётчик обновляем точечно, просмотр
          // списываем только когда воспроизведение реально началось.
          const paint = () => {
            const leftNow = Math.max(0, (m.playsAllowed || 2) - (vplays[it.source] || 0));
            const cnt = app.querySelector('.plays b');
            if (cnt) cnt.textContent = leftNow;
            if (pb) pb.disabled = leftNow <= 0;
          };
          if (pb) pb.onclick = () => {
            if ((vplays[it.source] || 0) >= (m.playsAllowed || 2)) return;
            stopMedia();
            v.currentTime = 0;
            v.play().then(() => {
              activeVideo = v;
              vplays[it.source] = (vplays[it.source] || 0) + 1;
              paint();
            }).catch(err => {
              // AbortError — прерывание (пауза/уход с экрана), не сбой файла
              if (v.error || (err && err.name !== 'AbortError')) {
                const ms = $('#v-msg'); if (ms) ms.hidden = false;
              }
            });
          };
          // выбор ответа без перерисовки: не прерываем воспроизведение видео
          document.querySelectorAll('[data-cq]').forEach(b => b.onclick = () => {
            d.optIndex = +b.dataset.cq; d.shownOrder = it._order;
            document.querySelectorAll('[data-cq]').forEach(x => x.classList.toggle('sel', x === b));
          });
        };
        return { html, wire };
      },
      answered: d => d.optIndex != null,
      onFinish: drafts => {
        items.forEach((it, i) => S.answer(it, {
          optIndex: drafts[i].optIndex != null ? drafts[i].optIndex : null,
          shownOrder: drafts[i].shownOrder || null,
          playsUsed: vplays[it.source] || 0
        }));
        sectionVocab();
      }
    });
  }

  // --- Словарь: слово -> значение ---
  function sectionVocab() {
    S.lex = { items: vocabDraw(VOCAB, S.theta0, S.rnd) };
    const items = S.lex.items;
    runSection({
      key: 'vocab', name: T('blockVocab'), intro: T('introVocab'),
      items,
      renderItem: (it, d, refresh) => {
        const gl = w => (VOCAB[w] && (VOCAB[w][S.lang] || VOCAB[w].en)) || w;
        const html = `
          <div class="hint">${T('meaningOf')}:</div>
          <div class="stem stem-word">${it.w}</div>
          <div class="opts">
            ${it.options.map((w, i) => `<button class="btn opt ${d.optIndex === i ? 'sel' : ''}" data-vi="${i}">${gl(w)}</button>`).join('')}
            <button class="btn opt btn-idk ${d.optIndex === -1 ? 'sel' : ''}" data-vi="-1">${T('idk')}</button>
          </div>`;
        const wire = () => {
          document.querySelectorAll('[data-vi]').forEach(b => b.onclick = () => { d.optIndex = +b.dataset.vi; refresh(); });
        };
        return { html, wire };
      },
      answered: d => d.optIndex != null,
      onFinish: drafts => {
        S.finishVocab(drafts.map(d => d.optIndex != null ? d.optIndex : null));
        sectionReading();
      }
    });
  }

  // --- Чтение ---
  function sectionReading() {
    const R = S.buildReading();
    runSection({
      key: 'reading', name: T('blockReading'), intro: T('introReading'),
      items: R.items,
      renderItem: (it, d, refresh) => {
        const text = R.texts.find(t => t.id === it.source);
        return mcqRender(it, d, refresh,
          `<details class="rtext" open><summary>${T('readText')}</summary><div class="rbody">${text.text.replace(/\n/g, '<br>')}</div></details>`);
      },
      answered: d => d.optIndex != null,
      onFinish: drafts => {
        R.items.forEach((it, i) => S.answer(it, { optIndex: drafts[i].optIndex != null ? drafts[i].optIndex : null, shownOrder: drafts[i].shownOrder || null }));
        sectionUoe();
      }
    });
  }

  // --- Грамматика: классические open-задания + интерактивные (uoe2) ---
  function sectionUoe() {
    const open = S.buildUoeBatch();
    const inter = S.buildInteractive();
    // интерактивные равномерно вкраплены между классическими
    const items = open.slice();
    inter.forEach((it, k) => {
      const pos = Math.min(items.length, Math.round((k + 1) * items.length / (inter.length + 1)) + k);
      items.splice(pos, 0, it);
    });
    runSection({
      key: 'uoe', name: T('blockUoe'), intro: T('introUoe'),
      items,
      renderItem: (it, d, refresh) => {
        if (it.block !== 'uoe2') return openRender(it, d, refresh);
        if (it.type === 'order') {
          if (!it._words) {
            it._words = it.answer.replace(/\.$/, '').split(' ');
            it._shuffled = seededShuffle(it._words.map((_, i) => i), S.rnd);
            // защита: перемешивание не должно случайно дать верный порядок
            if (it._shuffled.every((v, i) => v === i)) it._shuffled.reverse();
          }
          const labels = it._shuffled.map(i => it._words[i]);
          if (!d.sq) d.sq = {};
          const html = `<span class="iid" hidden data-iid="${it.id}"></span>` + seqHtml(it.id, labels, d.sq, T('orderHint'));
          return { html, wire: () => wireSeq(app, it.id, d.sq, refresh) };
        }
        if (it.type === 'bankfill') {
          return { html: bankfillHtml(it, d), wire: () => wireBankfill(app, it, d, refresh) };
        }
        // match
        return { html: matchHtml(it, d), wire: () => wireMatch(app, it, d, refresh) };
      },
      answered: (d, it) => {
        if (!it || it.block !== 'uoe2') return !!(d.text && d.text.trim());
        if (it.type === 'order') return d.sq && (d.sq.seq || []).length === it._words.length;
        if (it.type === 'bankfill') return d.gaps && d.gaps.every(g => g != null);
        return d.map && d.map.every(m => m != null);
      },
      onFinish: drafts => {
        items.forEach((it, i) => {
          const d = drafts[i];
          if (it.block !== 'uoe2') { S.answer(it, { text: d.text || '' }); return; }
          if (it.type === 'order') {
            const labels = it._shuffled ? it._shuffled.map(x => it._words[x]) : [];
            const arr = ((d.sq && d.sq.seq) || []).map(x => labels[x]);
            S.answerGraded(it, scoreOrderWords(it._words, arr), { built: arr.join(' ') });
          } else if (it.type === 'bankfill') {
            S.answerGraded(it, scoreBankfill(it, d.gaps || []), { gaps: (d.gaps || []).slice() });
          } else {
            S.answerGraded(it, scoreMatch(it, d.map || []), { map: (d.map || []).slice() });
          }
        });
        sectionWriting();
      }
    });
  }

  // --- Письмо ---
  function sectionWriting() {
    const it = S.pickAtLevel('writing', 1)[0];
    if (!it) { sectionSpeaking(); return; }
    let draftText = '';
    const intro = () => show(() => {
      render(`
        <h2>${T('blockWriting')}</h2>
        <p class="hint">${T('introWriting')}</p>
        ${thetaLine()}
        <button class="btn btn-primary" id="sec-start">${T('startSection')}</button>`, T('blockWriting'));
      $('#sec-start').onclick = task;
    });
    const task = () => show(() => {
      render(`
        <div class="stem">${it.stem}</div>
        <p class="hint">${T('writingSupports')}${(it.support || []).join(' · ')} (${T('minWords')}${it.minWords || 5})</p>
        <textarea class="inp inp-ta" id="w-inp" rows="4">${draftText}</textarea>
        ${teacherHint(it)}
        <button class="btn btn-primary" id="w-go">${T('finishSection')}</button>`, T('blockWriting'));
      const ta = $('#w-inp');
      ta.oninput = () => { draftText = ta.value; };
      $('#w-go').onclick = () => { S.answerWriting(it, ta.value); sectionSpeaking(); };

  // --- Говорение (только полный вариант) ---
  function sectionSpeaking() {
    if (!S.cfg.speaking) { finishTest(); return; }
    const items = S.pickAtLevel('speaking', S.cfg.speaking);
    if (!items.length) { finishTest(); return; }
    const skip = () => {
      S.micAvailable = false; S.addFlag('speaking_skipped');
      items.forEach(it => S.answerSpeaking(it, null));
      finishTest();
    };
    show(() => {
      render(`
        <h2>${T('blockSpeaking')}</h2>
        <p class="hint">${T('introSpeaking')}</p>
        ${thetaLine()}
        <div class="row2">
          <button class="btn btn-primary" id="mic-go">${T('micAllow')}</button>
          <button class="btn btn-ghost" id="mic-skip">${T('skip')}</button>
        </div>`, T('blockSpeaking'));
      $('#mic-skip').onclick = skip;
      $('#mic-go').onclick = async () => {
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch (e) { skip(); return; }
        let i = 0;
        const step = () => {
          if (i >= items.length) { stream.getTracks().forEach(t => t.stop()); finishTest(); return; }
          recordItem(items[i++], stream, step);
        };
        step();
      };
    });
  }

  function recordItem(item, stream, onDone) {
    show(() => {
      render(`
        <div class="stem stem-spk">«${item.stem}»</div>
        <p class="hint">${T('recHint')}</p>
        <div class="recrow"><span class="reclight" id="reclight">${T('rec')}</span> <b id="rectime">0:00</b></div>
        <button class="btn btn-primary" id="rec-stop">${T('recStop')}</button>`, T('blockSpeaking'));
      const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s) % 60).padStart(2, '0');
      const mr = new MediaRecorder(stream);
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const srcNode = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser(); an.fftSize = 2048;
      srcNode.connect(an);
      const buf = new Float32Array(an.fftSize);
      let voicedMs = 0, lastT = Date.now();
      const meter = setInterval(() => {
        an.getFloatTimeDomainData(buf);
        let rms = 0; for (let k = 0; k < buf.length; k++) rms += buf[k] * buf[k];
        rms = Math.sqrt(rms / buf.length);
        const now = Date.now();
        if (rms > 0.015) voicedMs += now - lastT;
        lastT = now;
      }, 100);
      const t0 = Date.now();
      const tInt = setInterval(() => { const e = $('#rectime'); if (e) e.textContent = fmt((Date.now() - t0) / 1000); }, 250);
      let transcript = null, rec = null;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        try {
          rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = false;
          transcript = '';
          rec.onresult = e => { for (const r of e.results) transcript += ' ' + r[0].transcript; };
          rec.onerror = () => { transcript = transcript || null; };
          rec.start();
        } catch (e) { rec = null; transcript = null; }
      }
      const stopAll = () => {
        clearInterval(meter); clearInterval(tInt);
        try { mr.stop(); } catch (e) {}
        if (rec) try { rec.stop(); } catch (e) {}
        srcNode.disconnect(); ctx.close().catch(() => {});
        const durationSec = (Date.now() - t0) / 1000;
        S.answerSpeaking(item, { durationSec, voicedSec: voicedMs / 1000, transcript: transcript && transcript.trim() ? transcript.trim() : null });
        // явное подтверждение + кнопка «Далее», без автоперехода
        show(() => {
          render(`
            <div class="stem stem-spk">«${item.stem}»</div>
            <p class="recok">${T('recDone')}</p>
            <button class="btn btn-primary" id="rec-next">${T('next')}</button>`, T('blockSpeaking'));
          $('#rec-next').onclick = onDone;
        });
      };
      mr.start();
      const hardStop = setTimeout(stopAll, 35000);
      $('#rec-stop').onclick = () => { clearTimeout(hardStop); stopAll(); };
    });
  }

  // --- Дельный фидбэк: по конкретным ошибкам, а не пересказ баллов ---
  function buildAdvice(r) {
    const advice = [];
    const byId = {}; BANK.items.forEach(it => { byId[it.id] = it; });
    // грамматика: топ-2 семьи с ошибками
    const famErr = {};
    S.log.forEach(e => {
      if ((e.block === 'uoe' || e.block === 'routing') && e.correct === 0) {
        const it = byId[e.id];
        if (it && it.constructFamily) famErr[it.constructFamily] = (famErr[it.constructFamily] || 0) + 1;
      }
    });
    const famMap = FAM_NAMES[S.lang] || FAM_NAMES.ru;
    const fams = Object.entries(famErr).sort((a, b) => b[1] - a[1]).slice(0, 2)
      .map(([f]) => famMap[f] || f);
    if (fams.length) advice.push(T('advGrammar').replace('{fams}', fams.join(', ')));
    else if (r.skills.uoe && r.skills.uoe.n >= 5) advice.push(T('advGrammarClean'));
    // аудирование: вывод/отношение vs детали
    const lErr = S.log.filter(e => e.block === 'listening' && e.correct === 0);
    if (lErr.length >= 2) {
      const inf = lErr.filter(e => {
        const it = byId[e.id];
        return it && /inference|attitude|discourse/.test(it.construct || '');
      }).length;
      advice.push(inf * 2 >= lErr.length ? T('advListenInf') : T('advListenDet'));
    }
    // словарь: до какого частотного пласта уверенно
    const vLog = S.log.find(e => e.block === 'vocab');
    if (S.lex && S.lex.items && vLog && vLog.answers) {
      const perBand = {};
      S.lex.items.forEach((it, i) => {
        (perBand[it.band] = perBand[it.band] || { n: 0, c: 0 }).n++;
        if (vLog.answers[i] === it.correctIndex) perBand[it.band].c++;
      });
      const WORDS = { B1: '2 000', B2: '3 000', B3: '5 000', B4: '8 000', B5: '12 000', B6: '15 000', B7: '20 000' };
      // «уверенно до N» — только непрерывная лестница: диапазон засчитывается,
      // если пройден и он, и все более частотные до него
      let deepest = null;
      for (const b of Object.keys(perBand).sort()) {
        if (perBand[b].c / perBand[b].n >= 0.5) deepest = b; else break;
      }
      if (deepest) advice.push(T('advVocab').replace('{n}', WORDS[deepest] || deepest));
      else if (S.lex.result && S.lex.result.score100 < 30) advice.push(T('advVocabLow'));
    }
    // письмо: не прозвучала целевая конструкция
    if (r.writing && r.writing.score.form <= 1 && r.writing.score.total > 0) advice.push(T('advWriting'));
    // ближайшая цель по уровню
    const nextKey = { A0: 'advNextA', A1: 'advNextA', A2: 'advNextA2', B1: 'advNextB1', B2: 'advNextB2', C1: 'advNextC', C2: 'advNextC' }[r.level];
    advice.push(T(nextKey));
    return advice.slice(0, 4);
  }

  // --- Результат ---
  let finished = false;
  function finishTest() {
    if (finished) return; finished = true;
    stopMedia();
    const r = S.result();
    show(() => {
      const LEVELS = ['A0', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
      const pos = t => Math.max(0, Math.min(100, (t + 3.5) / 6 * 100));
      const skillName = { routing: T('blockRouting'), listening: T('blockListening'), reading: T('blockReading'), uoe: T('blockUoe'),
        minpair: T('skillMinpair'), clip: T('skillClips'), uoe2: T('skillUoe2') };
      const skillRow = (name, x) => x ? `<div class="skrow"><span>${name}</span><b>${x.score != null && x.score !== x.correct ? x.score : x.correct} / ${x.n}</b></div>` : '';
      const profName = { listening: T('profListening'), grammar: T('profGrammar'), reading: T('profReading') };
      const profRows = r.skillProfile ? Object.keys(r.skillProfile)
        .filter(k => r.skillProfile[k])
        .map(k => `<div class="skrow"><span>${profName[k]}</span><b class="proflvl">${r.skillProfile[k].level}</b></div>`).join('') : '';
      const advice = buildAdvice(r);
      render(`
        <h2 class="congrats">${T('congratsTitle')}</h2>
        <p class="hint">${T('congratsLevel')}:</p>
        <h1 class="reslvl reslvl-${r.level}">${r.level}</h1>
        ${CUTS.provisional && teacherMode ? `<p class="pill pill-warn">${T('provisional')}</p>` : ''}
        <div class="band"><div class="band-fill" style="left:${pos(r.theta - r.se)}%;width:${Math.max(3, pos(r.theta + r.se) - pos(r.theta - r.se))}%"></div>
          <div class="band-ticks">${LEVELS.map(l => `<span>${l}</span>`).join('')}</div></div>
        ${profRows ? `<h3>${T('resProfile')}</h3>${profRows}` : ''}
        <h3>${T('resSkills')}</h3>
        ${skillRow(skillName.routing, r.skills.routing)}
        ${skillRow(skillName.minpair, r.skills.minpair)}
        ${skillRow(skillName.listening, r.skills.listening)}
        ${skillRow(skillName.clip, r.skills.clip)}
        ${skillRow(skillName.reading, r.skills.reading)}
        ${skillRow(skillName.uoe, r.skills.uoe)}
        ${skillRow(skillName.uoe2, r.skills.uoe2)}
        ${r.lex ? `<div class="skrow"><span>${T('blockVocab')}</span><b>${r.lex.score100}/100</b></div>` : ''}
        ${r.writing ? `<div class="skrow"><span>${T('blockWriting')}</span><b>${r.writing.score.total}/9</b></div>` : ''}
        <h3>${T('resFeedback')}</h3>
        <ul class="advice">${advice.map(a => `<li>${a}</li>`).join('')}</ul>
        <div class="welcome">
          <div class="welcome-title">${T('welcomeTitle')}</div>
          <div class="welcome-body">${T('welcomeBody')}</div>
        </div>
        ${teacherMode ? `
          <div class="tpanel">
            <div>θ̂ = ${r.theta.toFixed(2)} · ${T('resSe')} = ${r.se.toFixed(2)}</div>
            ${r.flags.length ? `<div>${T('resFlags')}:</div><ul>${r.flags.map(f => `<li>${T('flag_' + f)}</li>`).join('')}</ul>` : ''}
            ${r.flags.includes('unresolved') ? `<div>${T('resUnresolved')}</div>` : ''}
            <button class="btn btn-ghost" id="exp">${T('resExport')}</button>
          </div>` : ''}
        <button class="btn btn-letsgo" id="letsgo">Let's go 🚀</button>`, null);
      const expBtn = $('#exp');
      if (expBtn) expBtn.onclick = () => {
        const blob = new Blob([JSON.stringify(S.exportJson(), null, 1)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'jts-placement-session-' + S.seed + '.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      };
      const lg = $('#letsgo');
      // Точка входа в онбординг, оставленная автором раннера. Приложение
      // открывает файл в <iframe> (PlacementTestPage.jsx) и ждёт отсюда два
      // сообщения: результат сразу по окончании теста — чтобы уровень не
      // потерялся, если человек закроет вкладку на экране результата, — и
      // подтверждение по кнопке «Let's go». Логика теста не тронута: ниже
      // только отправка наружу того, что вернул S.result().
      JTS_BRIDGE.send('placement:result', r);
      if (lg) lg.onclick = () => {
        lg.classList.add('letsgo-hit');
        JTS_BRIDGE.send('placement:done', r);
      };
    });
  }

  // старт
  screenLang();
})();

</script>
</body>
</html>
