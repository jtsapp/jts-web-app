<style id="phase2-goals-style">

.go-progress{height:5px;background:#f0e6df;border-radius:20px;margin:14px 0 26px;overflow:hidden}
.go-progress>span{display:block;height:100%;background:linear-gradient(90deg,#ffb469,#e46e20);border-radius:20px;transition:width .2s}
.go-heading{text-align:center;margin:0 auto 25px;max-width:730px}
.go-heading h1{font-size:clamp(27px,3.5vw,40px);line-height:1.15;letter-spacing:-1.1px;font-weight:850;margin-bottom:12px}
.go-heading p{font-size:15px;line-height:1.6;color:var(--sub)}
.go-heading h1:focus{outline:none}
.go-card{border:1px solid var(--border);border-radius:24px;background:#ffffffc9;padding:26px;box-shadow:0 12px 36px #543d8008}
.go-category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.go-category{display:grid;grid-template-columns:48px minmax(0,1fr) 24px;align-items:center;gap:14px;padding:20px 17px;min-height:108px;border:1px solid #e9e2ef;border-radius:18px;background:#fff;text-align:left;color:var(--ink);line-height:1.45}
.go-category:last-child{grid-column:1/-1;min-height:88px}
.go-category strong{font-size:15px;font-weight:740}
.go-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#fff2e3;color:#b65a1e}
.go-icon svg{width:26px;height:26px}
.go-check{width:24px;height:24px;display:grid;place-items:center;flex:none;border:1px solid #e4dce9;border-radius:50%;color:#8f849d;font-weight:700}
.go-category:hover,.go-choice:hover{border-color:#df9b64;background:#fffaf5}
.go-category.is-selected,.go-choice.is-selected{background:#fff2e5;border-color:var(--go-orange);box-shadow:inset 0 0 0 1px var(--go-orange)}
.is-selected>.go-check{background:var(--go-orange);border-color:var(--go-orange);color:white}
.go-category:focus-visible,.go-choice:focus-visible,.go-skip:focus-visible{outline:3px solid #e9a65f;outline-offset:3px}
.go-category-group{border:1px solid var(--border);border-radius:17px;background:#fff;margin-bottom:13px;overflow:hidden}
.go-category-group summary{display:flex;align-items:center;gap:12px;padding:17px;cursor:pointer;list-style:none;min-height:64px}
.go-category-group summary:after{content:'+';font-size:22px;margin-left:4px;color:var(--go-dark)}
.go-category-group[open] summary:after{content:'−'}
.go-category-group summary::-webkit-details-marker{display:none}
.go-category-group summary strong{font-size:15px;line-height:1.45}
.go-small-icon{display:flex;color:var(--go-dark);flex:none}
.go-small-icon svg{width:23px;height:23px}
.go-count{margin-left:auto;border-radius:20px;background:var(--go-pale);color:var(--go-dark);min-width:27px;padding:5px;text-align:center;font-size:12px}
.go-group-body{padding:0 17px 18px}
.go-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.go-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:53px;padding:12px 14px;border:1px solid #e9e2ef;background:#fff;border-radius:13px;text-align:left;color:#463753;line-height:1.45;font-size:13px;font-weight:650;overflow-wrap:anywhere}
.go-choice>.go-check{width:21px;height:21px;font-size:12px}
.go-fieldset{border:0;padding:0;margin:0 0 29px;min-width:0}
.go-fieldset:last-child{margin-bottom:0}
.go-fieldset legend{font-size:17px;line-height:1.45;font-weight:750;padding:0;max-width:100%}
.go-optional{font-size:11px;display:block;color:var(--sub);margin:6px 0 12px}
.go-input{display:block;width:100%;resize:vertical;min-height:92px;border:1px solid #dfd4e7;background:#fff;border-radius:13px;padding:13px 15px;font:inherit;font-size:14px;line-height:1.6;color:var(--ink)}
.go-input::placeholder{color:#9a8ca5}
.go-input:focus{outline:3px solid #ffe0bf;border-color:var(--go-orange)}
.go-custom-label{display:block;margin:16px 0 8px;font-size:12px;color:var(--sub);font-weight:650}
.go-primary:empty{display:none}
.go-primary{border-top:1px solid var(--border);margin-top:24px;padding-top:24px}
.go-primary h2{font-size:21px;line-height:1.35;margin:0 0 8px}
.go-help{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:13px}
.go-primary-banner{border-radius:15px;background:var(--go-pale);padding:15px 18px;margin-bottom:26px;overflow-wrap:anywhere}
.go-primary-banner span{display:block;font-size:11px;color:var(--go-dark);margin-bottom:6px}
.go-primary-banner strong{font-size:16px;line-height:1.5}
.go-more{border-top:1px solid var(--border);padding-top:18px;margin-top:20px}
.go-more summary{cursor:pointer;font-weight:700;font-size:14px;color:#755379;padding:4px 0 17px;line-height:1.5}
.go-more[open] summary{margin-bottom:15px}
.go-review{margin:0}
.go-review-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:25px;border-bottom:1px solid #efe8f3;padding:17px 0}
.go-review-row:first-child{padding-top:0}
.go-review-row:last-child{border-bottom:0}
.go-review dt{font-size:13px;line-height:1.6;color:var(--sub)}
.go-review dd{margin:0;line-height:1.6;font-size:14px;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere}
.go-review-row:first-child dd{font-size:18px;color:var(--go-dark)}
.go-review-note{font-size:12px;line-height:1.6;color:var(--sub);margin-top:18px;padding:13px;background:#f8f5fc;border-radius:12px}
.go-error{color:#a52e3b;line-height:1.5;font-size:13px;margin:12px 0}
.go-error:empty{display:none}
.go-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.go-actions .go-next{margin-left:auto;background:linear-gradient(110deg,#ef9342,#dc691f);box-shadow:0 8px 20px #e4852426;color:#fff}

@media(max-width:650px){
 .goals-shell{margin-top:0}.go-card{padding:17px;border-radius:19px}.go-heading{text-align:left;margin-bottom:20px}.go-heading p{font-size:14px}.go-heading h1{letter-spacing:-.6px}
 .go-category-grid,.go-choice-grid{grid-template-columns:1fr}.go-category{min-height:85px;padding:15px;gap:11px;grid-template-columns:42px minmax(0,1fr) 24px}.go-icon{width:42px;height:42px}.go-category:last-child{min-height:85px}
 .go-review-row{grid-template-columns:1fr;gap:6px;padding:14px 0}.go-fieldset legend{font-size:16px}.go-primary h2{font-size:19px}.go-group-body{padding:0 12px 14px}.go-category-group summary{padding:14px 12px;gap:9px}
 .go-actions{gap:8px}.go-actions .ghostbtn,.go-actions .gradbtn{padding:12px 15px;font-size:13px}.go-actions .go-skip{order:3;width:100%;text-align:center}.go-footer small{text-align:left}
 .main:has(.goals-shell) .topbar{gap:8px;padding-left:16px;padding-right:16px}.main:has(.goals-shell) .header-caption{display:none}

{"t":"Confident and relaxed"},{"t":"Bored with the work"},{"t":"Excited and energetic"},{"t":"Constantly exhausted"}],"key":3,"format_final":"mcq","question_number":1,"source_row":44},{"id":"listening-B2-3-q2","skill":"L","level":"B2","source":"listening-B2-3","family":"listening-B2-3","stem":"What changed things for her?","options":[{"t":"She treated sleep as part of her job"},{"t":"She drank more coffee at work"},{"t":"She started working fewer hours"},{"t":"She moved closer to the hospital"}],"key":0,"format_final":"mcq","question_number":2,"source_row":45},{"id":"listening-B2-3-q3","skill":"L","level":"B2","source":"listening-B2-3","family":"listening-B2-3","stem":"Why does she now prefer working at night?","options":[{"t":"The higher pay makes all the late hours worthwhile"},{"t":"The work is calmer and she has more responsibility"},{"t":"There are fewer patients to care for overnight"},{"t":"Her friends are free to meet at the hospital"}],"key":1,"format_final":"mcq","question_number":3,"source_row":46},{"id":"r-b1-02a","block":"reading","level":"B1","skill":"R","family":"inference_written","format_final":"mcq","format":"mcq4","source":"r-b1-02","stem":"What happens if you keep a book more than three weeks after the due date?","options":[{"t":"You must pay a fine for every extra day you keep it."},{"t":"You cannot borrow anything else until you return it."},{"t":"Your library card is cancelled until the end of the year."},{"t":"You have to buy the library a new copy of the book."}],"key":1,"affectsLevel":true,"calibration_status":"needs_expert_review"},{"id":"r-b1-02b","block":"reading","level":"B1","skill":"R","family":"inference_written","format_final":"mcq","format":"mcq4","source":"r-b1-02","stem":"Why will items from the reference collection still have a penalty?","options":[{"t":"They cost much more than ordinary library books."},{"t":"Losing one item can make a complete set useless."},{"t":"Readers asked the library to keep the old rule."},{"t":"They are borrowed more often than other items."}],"key":1,"affectsLevel":true,"calibration_status":"needs_expert_review"},{"id":"r-b2-01a","block":"reading","level":"B2","skill":"R","family":"inference_written","format_final":"mcq","format":"mcq4","source":"r-b2-01","stem":"What is the writer's point about building wider roads?","options":[{"t":"It reduces journey times for many years."},{"t":"Extra space is soon filled by new traffic."},{"t":"It encourages people to use public transport."},{"t":"It costs more than removing existing lanes."}],"key":1,"affectsLevel":true,"calibration_status":"needs_expert_review"},{"id":"r-c1-01b","block":"reading","level":"C1","skill":"R","family":"inference_written","format_final":"mcq","format":"mcq4","source":"r-c1-01","stem":"Why does the writer doubt that tighter definitions alone will solve the problem?","options":[{"t":"Researchers rarely agree on what a definition should include."},{"t":"A term's meaning can shift without researchers noticing it."},{"t":"Definitions written in advance are usually too vague to use."},{"t":"Meta-analyses seldom report the definitions they rely on."}],"key":1,"affectsLevel":true,"calibration_status":"needs_expert_review"}],"reading_texts":[{"id":"r-a2-01","level":"A2","topic":"объявление о смене расписания","text":"NOTICE TO ALL STAFF\n\nFrom Monday 3 March, the staff canteen will open at 11:30, not 12:00. The canteen will still close at 14:30.\n\nWe are making this change because many of you asked for an earlier lunch. The hot food counter will be open for the whole time, but the salad bar will only be ready from 12:00.\n\nIf you usually eat after 14:00, please note that the kitchen stops taking orders fifteen minutes before closing.\n\nQuestions? Speak to Mira in the office, or send an email. Please do not ask the kitchen staff during service.","wordCount":91,"avgSentenceLen":11.4,"offList2k":null},{"id":"r-a2-02","level":"A2","topic":"личное сообщение с просьбой","text":"Hi Dana,\n\nSorry for the late message. I can't come to the flat on Saturday after all — my sister is arriving from Almaty that morning and I have to meet her at the airport.\n\nCould we do Sunday instead? I'm free any time before six. If Sunday doesn't work for you, I can come on Tuesday evening, but that's harder because I finish late.\n\nI've still got your keys, so don't worry about that. I'll bring them either way.\n\nLet me know what suits you.\n\nAigerim","wordCount":86,"avgSentenceLen":9.6,"offList2k":null},{"id":"r-b1-01","level":"B1","topic":"заметка о работе курьером","text":"When Timur started delivering food by bicycle, he assumed the hardest part would be the weather. In fact, he says, the weather was the easiest thing to plan for: you buy the right jacket and the problem is solved.\n\nWhat he had not expected was how much of the job is waiting. Restaurants run late, customers do not answer their phones, and the app keeps counting the minutes as if the courier were responsible for all of it.\n\nHe still recommends the work to students, but with one condition. \"Treat it as a job with bad hours, not as free time that happens to pay,\" he says. \"People who think of it as flexible are the ones who end up working every evening.\"","wordCount":123,"avgSentenceLen":15.4,"offList2k":null},{"id":"r-b1-02","level":"B1","topic":"изменение правил в библиотеке","text":"From September, the city library will no longer charge fines for late returns. Instead, borrowers who keep a book for more than three weeks past the due date will simply be unable to borrow anything else until they bring it back.\n\nThe library says the change is not about being generous. Research from other cities suggests that fines mostly affect readers who were already struggling to visit regularly, while readers who could easily pay were never much deterred by them.\n\nThere is one exception. Items from the reference collection, which cannot normally leave the building, will keep their existing penalty, because a single missing volume can make a whole set useless.","wordCount":111,"avgSentenceLen":18.5,"offList2k":null},{"id":"r-b2-01","level":"B2","topic":"колонка о городском транспорте","text":"Every few years a city announces that it has solved congestion, and every few years the solution turns out to have been a redistribution. Build a wider road and the traffic that was previously deterred by the journey time reappears to fill it; this is well documented enough to have its own name, and yet it continues to surprise the people who commission the roads.\n\nWhat is less often said is that the same logic applies in the other direction. Remove a lane and some of the traffic does not divert — it evaporates. Trips that were marginal simply stop being made, or get made differently.\n\nNone of this makes lane removal automatically correct. It does mean that projections which assume a fixed quantity of traffic, to be pushed from one street to another, are describing a city that does not exist.","wordCount":141,"avgSentenceLen":20.1,"offList2k":null},{"id":"r-b2-02","level":"C1","topic":"рецензия на нон-фикшн","text":"The premise of this book is that most organisational failure is not caused by bad decisions but by decisions nobody remembers making. It is a good premise, and the first hundred pages deliver on it with unusual precision: the case studies are specific, the interviews are recent, and the author resists the temptation to arrive at a single villain.\n\nThe second half is harder to defend. Having established that responsibility is usually diffuse, the author spends four chapters recommending interventions that assume a single person with the authority to implement them. The tension is never acknowledged, let alone resolved.\n\nReaders looking for a diagnosis will find one of the best available. Readers looking for a cure should be warned that the prescription belongs to a different book.","wordCount":127,"avgSentenceLen":18.1,"offList2k":null},{"id":"r-c1-01","level":"C1","topic":"методологическая заметка","text":"A recurring difficulty in the literature is that the construct being measured shifts quietly between studies while the label stays the same. Two papers report on \"engagement\"; one operationalises it as time on task, the other as self-reported interest. Both are defensible choices. The problem arises only when a meta-analysis pools them, at which point the aggregate is a number about nothing in particular.\n\nThe conventional response is to demand tighter definitions in advance. That is reasonable, but it underestimates how much of the drift is invisible even to the researchers involved: a definition written in 2015 is read in 2024 through a decade of intervening usage.\n\nA more tractable remedy is procedural rather than conceptual. If the instrument is reported in full, later readers can reconstruct what was actually measured, whatever the paper chose to call it.","wordCount":136,"avgSentenceLen":17,"offList2k":null},{"id":"r-c1-02","level":"C1","topic":"эссе о профессиональной репутации","text":"There is a species of professional advice that survives not because it works but because failure is unattributable. Tell a hundred people to network relentlessly; the twenty who succeed will credit the advice, and the eighty who do not will conclude, with some encouragement from the literature, that they networked insufficiently. The counsel is thereby insulated from evidence in both directions.\n\nWhat distinguishes genuinely useful guidance is not that it always works — nothing does — but that it specifies the conditions under which it should be abandoned. A recommendation with no failure mode attached is not a recommendation; it is a slogan with a bibliography.\n\nThis is worth saying because the slogans are not harmless. They occupy the attention that might otherwise be spent on advice narrow enough to be wrong.","wordCount":130,"avgSentenceLen":18.6,"offList2k":null},{"id":"new-pre-r1","level":"A0","text":"My name is Dana. I am ten. I have a cat. My cat is white."},{"id":"new-a1-r1","level":"A1","text":"Hello! My name is Sam. I live in Astana with my sister. We go to school at eight. After school, we play football in the park."},{"id":"new-a1-r2","level":"A1","text":"Hi, Anna! The English club meets on Tuesday at four o’clock in Room 12. Please bring your notebook. See you there! — Mira"},{"id":"new-b1-r1","level":"B1","text":"Our local library normally closes at five in the afternoon. From next Monday, it will stay open until seven on Wednesdays. Several students requested the change because their classes finish late. The children's room will still close at five, but visitors can borrow books from the main desk until seven. Staff will review the new schedule after two months before deciding whether to keep it.","review_status":"new_pilot_requires_methodologist_review"},{"id":"new-b2-r1","level":"B2","text":"A six-month trial replaced some city-centre parking spaces with a protected cycle lane. Weekend foot traffic increased, while weekday retail sales remained broadly unchanged. Some shopkeepers argued that deliveries had become harder, although the council received fewer complaints about dangerous crossings. The evaluation team warned against attributing the changes in shopping patterns entirely to the lane: nearby roadworks and seasonal events may also have affected visits, and no comparable street had been tracked. The council has therefore deferred a permanent decision until an additional study is completed.","review_status":"new_pilot_requires_methodologist_review"},{"id":"new-c1-r1","level":"C1","text":"The university's annual student survey reported unusually high satisfaction among participants in its new online seminars. It would be tempting to interpret this as evidence that the virtual format improved teaching. Yet only a minority of eligible students completed the survey, and those who attended the seminars most regularly were disproportionately represented. Moreover, the report did not compare learning outcomes with those of students following an otherwise equivalent face-to-face course. The findings may offer useful insights into what engaged students value, but they cannot, on their own, establish an educational advantage for online delivery.","review_status":"new_pilot_requires_methodologist_review"},{"id":"qa-pre-r-sign","level":"A0","topic":"расписание библиотеки","text":"LIBRARY\nMonday–Friday: 9:00–16:00\nSaturday and Sunday: CLOSED"},{"id":"qa-pre-r-note","level":"A0","topic":"короткое сообщение","text":"Hi, Amir!\nI am at the bus stop. See you at five!\nSam"}],"sources":[],"listening_sources":[{"id":"listening-A0-1","original_id":"A0-1","source_level":"A0","level":"A0","title":"Hi, I'm Aliya","type":"Self-introduction","voice":"Isla","audio_url":"audio/hf_20261011_201654_649a2ac7-91ca-4170-b2c3-dd4cba812912.mp3","transcript":"Hi! My name is Aliya. I'm twenty-six years old. I'm from Kazakhstan. I live in Almaty with my sister. I'm a nurse. I work in a big hospital. I like coffee and music. I don't like cold weather. My favourite day is Saturday.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A0-2","original_id":"A0-2","source_level":"A0","level":"A0","title":"My morning","type":"Daily routine","voice":"Archie","audio_url":"audio/hf_20261011_201654_1ca6cc86-1a4f-485e-8784-1e8b76d6ae0f.mp3","transcript":"Hello. I'm Timur. Every day I get up at seven o'clock. I have a shower and I get dressed. I have breakfast at half past seven. I usually have eggs, bread and tea. I go to work by bus. I start work at nine o'clock. I'm an engineer. I get home at six.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A0-3","original_id":"A0-3","source_level":"A0","level":"A1","title":"Welcome to City Market","type":"Shop announcement","voice":"Imogen","audio_url":"audio/hf_20261011_201654_c766e1fb-a402-4047-8fa2-8dc097aca827.mp3","transcript":"Hello and welcome to City Market! Today we have apples for five hundred tenge a kilo. Bread is two hundred tenge. Fresh milk is in aisle three. The café is on the second floor, next to the toilets. City Market is open every day from eight in the morning to ten at night. Thank you and have a nice day!","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A1-1","original_id":"A1-1","source_level":"A1","level":"A1","title":"A message from Dana","type":"Voicemail","voice":"Raina","audio_url":"audio/hf_20261011_201654_d0ac5e70-b8c5-4ca9-8d86-ceb863bab61c.mp3","transcript":"Hi Arman, it's Dana. Are you free on Saturday? There's a new Italian restaurant near the park, and I'd like to try it. My brother and his wife can come too. Let's meet at the restaurant at seven in the evening. Oh, and please don't be late this time! The restaurant is busy at the weekend, so I'm going to book a table for four people. Call me back when you get this message. Bye!","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A1-2","original_id":"A1-2","source_level":"A1","level":"A2","title":"My last holiday","type":"Personal story","voice":"Alistair","audio_url":"audio/hf_20261011_201654_409bb396-7dd0-474b-a3bc-278f1a0d0981.mp3","transcript":"Last summer I went to Turkey with my family. We stayed in a small hotel near the beach for ten days. The weather was hot and sunny every day. In the mornings we swam in the sea, and in the afternoons we visited old towns and museums. The food was fantastic. I ate fish almost every day. On the last day my son got lost in the market, but a kind shop assistant helped us find him. It was a great holiday, and we want to go back next year.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A1-3","original_id":"A1-3","source_level":"A1","level":"A2","title":"A walk around the old town","type":"Tour guide","voice":"Harrison","audio_url":"audio/hf_20261011_201654_ebd1e232-5897-4776-b8c7-8aed95b808ec.mp3","transcript":"Good morning, everyone, and welcome to our walking tour. We are now in the main square. The building in front of you is the old library. It's more than two hundred years old. On your left there is a small museum. It's free on Mondays, so you are lucky today! Next, we are going to walk along the river to the bridge. Please stay together and don't cross the road without me. The tour takes about two hours, and we finish at a nice café where you can have lunch.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A2-1","original_id":"A2-1","source_level":"A2","level":"B1","title":"Information for passengers","type":"Station announcement","voice":"Harrison","audio_url":"audio/hf_20261011_201715_929e5d9b-096a-47d4-a9a6-39b201c2ff65.mp3","transcript":"Good afternoon, ladies and gentlemen. This is an announcement for passengers travelling to Astana. Unfortunately, the fourteen thirty train is delayed by forty-five minutes because of bad weather on the line. It will now leave at quarter past three from platform six, not platform two. Passengers with first-class tickets can wait in the lounge on the upper floor, where free drinks are available. We are sorry for the delay. Please keep your luggage with you at all times and report any bags without owners to station staff.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A2-2","original_id":"A2-2","source_level":"A2","level":"A2","title":"Five tips for better sleep","type":"Podcast","voice":"Isla","audio_url":"audio/hf_20261011_201715_fe59080f-0394-4101-af9f-42b1f6356e2f.mp3","transcript":"Do you often feel tired in the morning? You're not alone. Here are a few simple tips for better sleep. First, try to go to bed and get up at the same time every day, even at the weekend. Second, don't drink coffee after three in the afternoon. Third, put your phone away at least an hour before bed, because the light from the screen keeps your brain awake. Fourth, keep your bedroom cool and dark. And finally, if you can't sleep after twenty minutes, get up and read a book for a while instead of lying in bed and worrying.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-A2-3","original_id":"A2-3","source_level":"A2","level":"A2","title":"My first job","type":"Personal story","voice":"Archie","audio_url":"audio/hf_20261011_201715_c8474e14-b288-4a26-a2de-2de9e4fcc345.mp3","transcript":"My first job was in a small bakery when I was nineteen. I worked there during my summer holidays. I had to start at five in the morning, which was really hard for me because I'm not a morning person. At first I only cleaned the kitchen and served customers, but after a month the owner taught me how to bake bread. I made a lot of mistakes, and once I burnt forty loaves! But I learned to be patient and careful. I didn't earn much money, but I still remember that summer as one of the best times of my life.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-B1-1","original_id":"B1-1","source_level":"B1","level":"B1","title":"City bikes come to Astana","type":"Radio news","voice":"Imogen","audio_url":"audio/hf_20261011_201715_82124741-2086-4798-b1d4-6f7b9b701e95.mp3","transcript":"And now some local news. From next Monday, residents of Astana will be able to use a new bike-sharing scheme. Five hundred bicycles will be available at sixty stations across the city, mostly near metro stations, parks and universities. To use a bike, you need to download the city app and pay either for a single ride or for a monthly pass, which costs around three thousand tenge. The first thirty minutes of every ride are free for students. City officials hope the scheme will reduce traffic jams and air pollution in the centre. However, some residents have complained that there are still not enough safe cycle lanes, and the city has promised to build twenty more kilometres by the end of next year.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-B1-2","original_id":"B1-2","source_level":"B1","level":"B1","title":"Can an app teach you a language?","type":"Short talk","voice":"Alistair","audio_url":"audio/hf_20261011_201715_7739b614-0329-49ca-9f63-7299751dfe1d.mp3","transcript":"Language apps have become incredibly popular, and it's easy to see why. They're cheap, you can use them anywhere, and the little games make studying feel less like work. Many people I know practise for ten minutes on the bus every morning, and that kind of regular practice really does help you remember vocabulary. But apps have limits. Most of them focus on single words and short sentences, so learners often find that they still can't hold a real conversation. In my experience, the people who make the most progress use an app as an extra, not as their only method. They also read, watch films, and, most importantly, speak with real people, even if they feel nervous at first.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-B1-3","original_id":"B1-3","source_level":"B1","level":"B1","title":"The wrong train","type":"Personal story","voice":"Archie","audio_url":"audio/hf_20261011_201715_d52915ca-15ff-4d8b-ab19-971ef38d3bbf.mp3","transcript":"A few years ago I was travelling to an important job interview in another city. I was so nervous that I didn't check the platform properly and got on the wrong train. By the time I realised, it was too late to get off, and I knew I would miss the interview. I called the company to apologise, expecting them to be annoyed. Instead, the manager laughed and told me she had once done exactly the same thing. She offered to do the interview by video call that evening. We ended up talking for over an hour, and I got the job. Looking back, I think being honest about my mistake actually made a better impression than if everything had gone perfectly.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-B2-1","original_id":"B2-1","source_level":"B2","level":"B2","title":"Does remote work make us more productive?","type":"Lecture extract","voice":"Tamsin","audio_url":"audio/hf_20261011_201729_f174c0aa-a1f5-44f5-8a30-7c4a19b11da7.mp3","transcript":"When offices closed during the pandemic, many managers assumed productivity would collapse. In fact, several large studies found the opposite: employees working from home often completed more tasks, partly because they no longer lost an hour or more each day commuting. However, the picture is more complicated than these headlines suggest. Researchers have found that while routine, individual work tends to benefit from a quiet home environment, creative problem-solving and the training of new staff often suffer. Junior employees in particular miss out on the informal learning that happens when you overhear how experienced colleagues handle a difficult client. That is why many organisations are now settling on a hybrid model, with two or three days in the office reserved specifically for collaboration rather than for tasks that could easily be done alone.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-B2-2","original_id":"B2-2","source_level":"B2","level":"B2","title":"Why supermarkets throw away so much food","type":"Podcast","voice":"Tamsin","audio_url":"audio/hf_20261011_201728_8395c750-f11c-419f-99a3-b0ead5f9d765.mp3","transcript":"Roughly a third of all the food produced in the world is never eaten, and supermarkets are responsible for a surprising share of that waste. Part of the problem is appearance: fruit and vegetables that are slightly the wrong shape or size are often rejected before they even reach the shelves, simply because shoppers have come to expect perfect-looking produce. Another issue is the confusion around date labels. Many customers don't realise that a best-before date is about quality, not safety, so perfectly edible food ends up in the bin. Some chains are now fighting back by selling so-called ugly vegetables at a discount and donating unsold food to charities at the end of each day. Critics argue, though, that these schemes are small compared with the scale of the problem, and that real change will require stricter laws rather than voluntary promises.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"},{"id":"listening-B2-3","original_id":"B2-3","source_level":"B2","level":"B2","title":"Life on the night shift","type":"Interview monologue","voice":"Tamsin","audio_url":"audio/hf_20261011_201728_41b9e47f-6105-4069-91d1-43c81ccca8c0.mp3","transcript":"People often ask me how I cope with working nights in the emergency department. Honestly, the first year was brutal. I was constantly exhausted, I barely saw my friends, and I put on weight because I was snacking all night to stay awake. What eventually made the difference was treating sleep as part of the job rather than something I'd fit in around everything else. I invested in blackout curtains, switched my phone to silent, and told my family that the hours between nine and four were off limits. I also stopped relying on coffee and started bringing proper meals to work. The strange thing is that I now prefer nights. The hospital is calmer, the team is smaller and closer, and you're trusted to make decisions on your own, which I find incredibly rewarding.","playsAllowed":2,"source_workbook":"jts_listening_pack_A0-B2 (1).xlsx","source_sheet":"Listening A0-B2","calibration_status":"user_supplied_pilot_label"}]};

function save(){if(SELFTEST_ACTIVE)return;try{localStorage.setItem(STORAGE,JSON.stringify({lang,app}))}catch(e){}}
function levelIdx(level){return Math.max(0,LEVELS.indexOf(level))}
function getQ(id){return ANSWER_BY_ID[id]}
function testFlag(type){return app.flags.some(f=>(typeof f==='string'?f:f?.type)===type)}
function addFlag(type,details){if(!testFlag(type))app.flags.push(details?{type,...details}:type)}
function hash32(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),16777619)}h^=h>>>16;h=Math.imul(h,0x7feb352d);h^=h>>>15;return h>>>0}
function stableQuestionOrder(q){if(q.fixedOrder)return q.options.map((_,i)=>i);return q.options.map((_,i)=>i).sort((a,b)=>hash32(app.id+'|'+q.id+'|'+a)-hash32(app.id+'|'+q.id+'|'+b))}
function closestBands(target,levels=LEVELS){const idx=levels.indexOf(target);return levels.slice().sort((a,b)=>{const da=Math.abs(levels.indexOf(a)-idx),db=Math.abs(levels.indexOf(b)-idx);return da-db||levels.indexOf(a)-levels.indexOf(b)})}
function skillCountLimit(skill){if(done(skill))return Math.max(1,totalAnswered(skill));return skill==='LU'?(app.skills.LU.upperTrial?RULES.LU.HARD_STOP:RULES.LU.STANDARD_STOP):skill==='R'?(app.skills.R.branchA0?RULES.R.A0_TEXTS:RULES.R.TEXTS)*RULES.R.PAIR_SIZE:RULES.L.RECORDINGS*RULES.L.ITEMS_PER_RECORDING}
function answerRows(skill){return (app.skills[skill]?.items||[]).filter(x=>x.answer!==null&&x.answer.kind!=='technical')}
function segmentRows(run,segment){return run.items.filter(x=>x.answer!==null&&x.segment===segment&&!x.special)}
function getLUAttempts(){const groups=new Map();for(const row of answerRows('LU')){if(row.special)continue;const key=row.segment??0;if(!groups.has(key))groups.set(key,{level:row.level,rows:[]});groups.get(key).rows.push(row)}return [...groups.values()].map(g=>({...g,n:g.rows.length,c:g.rows.filter(r=>r.correct).length,errors:g.rows.filter(r=>!r.correct).length,pass:g.rows.filter(r=>r.correct).length>=RULES.LU.PASS_CORRECT&&g.rows.filter(r=>r.correct).length/g.rows.length>=RULES.LU.PASS_ACCURACY&&(g.level==='A0'||g.rows.some(r=>r.correct&&getQ(r.id).format_final==='short_answer')),failed:g.rows.filter(r=>!r.correct).length>=RULES.LU.FAILED_ERRORS&&g.rows.filter(r=>r.correct).length/g.rows.length<RULES.LU.FAILED_ACCURACY}))}
function highestPassedLU(){const levels=getLUAttempts().filter(a=>a.pass).map(a=>a.level);return levels.length?LEVELS[Math.max(...levels.map(levelIdx))]:null}
function failedLU(level){return getLUAttempts().some(a=>a.level===level&&a.failed)}
function shiftTarget(run,next){if(next&&next!==run.target){run.target=next;run.segmentIndex++;run.switches=(run.switches||0)+1}}
function specialIsRequired(run){const best=highestPassedLU(),n=totalAnswered('LU');if(!run.probeUsed&&!best&&run.routing.done&&n>=RULES.LU.ROUTING_MAX){const normals=answerRows('LU').filter(r=>!r.special);if(normals.slice(-RULES.LU.PROBE_LAST_WRONG).length===RULES.LU.PROBE_LAST_WRONG&&normals.slice(-RULES.LU.PROBE_LAST_WRONG).every(r=>!r.correct)){run.probeUsed=true;run.specialQueue.push({type:'probe',level:'B1'});}}
 if(best&&levelIdx(best)>=levelIdx(RULES.LU.ANCHORS_FROM)&&n>=RULES.LU.EARLY_STOP&&!run.anchorUsed){run.anchorUsed=true;run.specialQueue.push({type:'anchor',level:'A1'},{type:'anchor',level:'A2'})}}
function shouldFinishLU(){const run=app.skills.LU,n=totalAnswered('LU'),best=highestPassedLU();if(n>=RULES.LU.HARD_STOP)return true;if(!run.routing.done||n<RULES.LU.MIN_ANSWERS)return false;if(run.specialQueue.length)return false;if(best&&levelIdx(best)>=levelIdx(RULES.LU.ANCHORS_FROM)&&!run.anchorUsed)return false;const above=best&&LEVELS[levelIdx(best)+1];if(n>=RULES.LU.MIN_ANSWERS&&best&&(best==='C1'||(above&&failedLU(above))))return true;
 if(n>=RULES.LU.STANDARD_STOP){if(best&&best!=='C1'&&!run.upperTrial){run.upperTrial=true;if(above&&!failedLU(above)&&!getLUAttempts().some(x=>x.level===above)){shiftTarget(run,above)}}else if(!best){return !run.specialQueue.length;}else if(best==='C1'||(above&&(failedLU(above)||getLUAttempts().some(x=>x.level===above))))return true;}
 return false}

function selectNext(skill){const run=app.skills[skill];if(run.status==='done')return null;
 if(skill==='LU'){
  specialIsRequired(run);if(shouldFinishLU()){run.status='done';return null}
  const used=new Set(run.items.map(x=>x.id));let special=run.specialQueue.shift()||null;
  const target=special?.level||run.target;
  let list=[];let actualLevel=target;
  for(const level of closestBands(target)) {list=BANK.items.filter(q=>q.skill==='LU'&&q.level===level&&!used.has(q.id));if(list.length){actualLevel=level;break}}
  if(!list.length){run.status='done';run.stopReason='bank_exhausted';return null}
  if(!special&&actualLevel!==run.target)shiftTarget(run,actualLevel);
  const currentSegment=segmentRows(run,run.segmentIndex);
  if(!special&&actualLevel!=='A0'&&currentSegment.filter(r=>r.correct).length>=2&&!currentSegment.some(r=>r.correct&&getQ(r.id)?.format_final==='short_answer')){const open=list.filter(q=>q.format_final==='short_answer');if(open.length)list=open;}
  const familyCount={};for(const x of answerRows('LU'))familyCount[x.family]=(familyCount[x.family]||0)+1;
  const step=run.items.length+1,seed=app.id+'|'+step;
  list.sort((a,b)=>(familyCount[a.family||a.construct||'general']||0)-(familyCount[b.family||b.construct||'general']||0)||hash32(seed+'|'+a.id)-hash32(seed+'|'+b.id));
  const q=list[0];const row={id:q.id,level:q.level,family:q.family||q.construct||'general',answer:null,correct:null,segment:run.segmentIndex,special:special?.type||null};
  run.items.push(row);run.cursor=run.items.length-1;run.status='in_progress';return row;
 }
 if(skill==='R'){
   const count=run.items.length/RULES.R.PAIR_SIZE;if(count>=(run.branchA0?RULES.R.A0_TEXTS:RULES.R.TEXTS)){run.status='done';return null}
   const usedSrc=new Set(run.items.map(x=>getQ(x.id)?.source));const usedIds=new Set(run.items.map(x=>x.id));
   let group=null,chosenLevel=null;
   for(const level of closestBands(run.target)){
    const bySource=new Map();for(const q of BANK.items){if(q.skill!=='R'||q.level!==level||!q.source||usedSrc.has(q.source)||usedIds.has(q.id)||!READ_BY_ID[q.source]?.text)continue;if(!bySource.has(q.source))bySource.set(q.source,[]);bySource.get(q.source).push(q)}
    const possible=[...bySource.entries()].filter(([id,questions])=>questions.length>=RULES.R.PAIR_SIZE).sort((a,b)=>hash32(app.id+'|R|'+count+'|'+a[0])-hash32(app.id+'|R|'+count+'|'+b[0]));
    if(possible.length){group=possible[0][1].slice(0,RULES.R.PAIR_SIZE);chosenLevel=level;break}
   }
   if(!group){run.status='done';run.stopReason='bank_exhausted';return null}
   run.target=chosenLevel;const pos=run.items.length;for(const q of group)run.items.push({id:q.id,answer:null,correct:null,level:q.level,family:q.source});run.cursor=pos;run.status='in_progress';return run.items[pos]
 }
 return null;
}
function adjust(skill){if(skill==='R'){const run=app.skills.R;const pair=currentReadingGroup();const score=pair.filter(r=>r.correct).length;const level=pair[0]?.level||run.target;const idx=levelIdx(level);run.target=LEVELS[Math.max(0,Math.min(LEVELS.length-1,idx+(score===RULES.R.UP_SCORE?1:score===RULES.R.DOWN_SCORE?-1:0)))];return}
 const run=app.skills.LU;const last=answerRows('LU').at(-1);if(!last)return;
 if(last.special){if(last.special==='probe'){if(last.level==='B1'&&last.correct){run.specialQueue.push({type:'probe',level:'B2'});}else if(last.level==='B2'&&last.correct){const probes=answerRows('LU').filter(x=>x.special==='probe');if(probes.length>=2&&probes.slice(-2).every(x=>x.correct))addFlag('inconsistent')}}
  if(last.special==='anchor'){const anchors=answerRows('LU').filter(x=>x.special==='anchor');if(anchors.length>=2&&anchors.slice(-2).every(x=>!x.correct))addFlag('inconsistent')}
  return;
 }
 if(!run.routing.done){run.routing.asked++;const targetIndex=levelIdx(last.level),nextIndex=Math.max(0,Math.min(LEVELS.length-1,targetIndex+(last.correct?1:-1))),direction=Math.sign(nextIndex-targetIndex);
  const reversal=direction&&run.routing.lastDirection&&direction!==run.routing.lastDirection;
  if(direction)run.routing.lastDirection=direction;
  shiftTarget(run,LEVELS[nextIndex]);if(reversal||run.routing.asked>=RULES.LU.ROUTING_MAX)run.routing.done=true;return}
 const seg=segmentRows(run,run.segmentIndex),err=seg.filter(x=>!x.correct).length,correct=seg.filter(x=>x.correct).length,n=seg.length,idx=levelIdx(run.target);
 if(err>=RULES.LU.DOWN_ERRORS&&idx>0){shiftTarget(run,LEVELS[idx-1]);return}
 if(correct>=RULES.LU.UP_CORRECT&&n&&correct/n>=RULES.LU.UP_ACCURACY&&(run.target==='A0'||seg.some(r=>r.correct&&getQ(r.id)?.format_final==='short_answer'))&&idx<LEVELS.length-1&&!failedLU(LEVELS[idx+1])){shiftTarget(run,LEVELS[idx+1]);return}
}
function current(skill){const run=app.skills[skill];if(!run.items.length&&run.status!=='done')selectNext(skill);if(!run.items.length)return null;run.cursor=Math.max(0,Math.min(run.cursor,run.items.length-1));return run.items[run.cursor]}

  if(levels.length===3)level=LEVELS[levels[1]];
  else if(levels.length===2)level=LEVELS[Math.max(levelIdx(lu)-1,levels[0])];
  else level=lu;
 }
 if(skills.L.ceiling)addFlag('ceiling');
 const flags=[...new Set(app.flags.map(f=>typeof f==='string'?f:f?.type))];
 return {appId:app.id,id:app.id,overall:{level,preliminary:true,partial:!allCoreDone()||app.speaking.status!=='completed'},levels:{LU:skills.LU.level,R:skills.R.level,L:skills.L.level,S:skills.S?.level||null},skills,flags};

sult-actions"><button class="ghostbtn" data-sectionlist>${esc(x('recheck'))}</button><button class="text-button" id="restart">${esc(t('restart'))}</button></div></section>`);document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>feature(b.dataset.feature));document.querySelector('#restart').onclick=()=>{if(confirm(lang==='ru'?'Начать новую попытку? Текущие ответы будут удалены.':'Start a new attempt? Current answers will be removed.')){stopCurrentMedia();app=newState();save();render()}};}
function feature(name){const payload=buildResultPayload();const d={section:name,placementSessionId:app.id,level:payload.overall.level,skills:payload.skills,flags:payload.flags,payload};const config=window.JTSPlacementConfig||{};if(typeof config.navigate==='function'){config.navigate(d);return}if(APP_CONFIG.parentOrigin)window.parent.postMessage({type:'JTS_NAVIGATE',...d},APP_CONFIG.parentOrigin);const url=['practice','shadowing'].includes(name)?APP_CONFIG.practiceUrl:APP_CONFIG.appUrl;window.open(url,'_blank','noopener,noreferrer')}

// Hidden browser-only harness. It exercises the production selectNext, submitAnswer,
// submitReadingGroup, submitListening, adjustListening, estimateSkill and buildResultPayload.
function simulateRealProfile(profile,rating,iteration){
 SELFTEST_ACTIVE=true;app=newState();app.id='SELFTEST_'+profile+'_'+rating+'_'+iteration;app.screen='sections';applyStartRating(rating);
 let seed=hash32(app.id);
 const rand=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296};
 const isRandom=profile==='A0',unstable=profile==='unstable',twoMiss=profile==='B1+2';let luFirstMiss=0;
 const respond=q=>{
  let success=!isRandom&&(unstable?levelIdx(q.level)>=levelIdx('B1'):levelIdx(q.level)<=levelIdx(twoMiss?'B1':profile));
  if(twoMiss&&q.skill==='LU'&&luFirstMiss<2){success=false;luFirstMiss++}
  if(q.format_final==='mcq')return String(isRandom?Math.floor(rand()*q.options.length):success?q.key:(Number(q.key)+1)%q.options.length);
  return success?String((q.answer||[])[0]||''): 'nonword_error_xyz';
 };
 let steps=0;app.active='LU';
 while(!done('LU')&&steps++<RULES.LU.HARD_STOP+10){const row=current('LU');if(!row){if(done('LU'))break;continue}if(row.answer!==null){moveNext();continue}submitAnswer(respond(getQ(row.id)))}
 if(!done('LU'))throw Error('LU routing loop exceeded guard: '+profile+'/'+rating);
 app.active='R';const lu=estimateSkill('LU').level;app.skills.R.target=lu||'A0';app.skills.R.branchA0=app.skills.R.target==='A0';steps=0;
 while(!done('R')&&steps++<RULES.R.TEXTS+5){const group=currentReadingGroup();if(!group.length){if(done('R'))break;continue}if(group.every(r=>r.answer!==null)){moveNextReading();continue}for(const row of group)app.drafts[row.id]=respond(getQ(row.id));submitReadingGroup()}
 if(!done('R'))throw Error('R routing loop exceeded guard: '+profile+'/'+rating);
 app.active='L';app.skills.L.target=lu?(lu==='C1'?'B2':lu):'A0';steps=0;
 while(!done('L')&&steps++<RULES.L.RECORDINGS+5){const group=currentListeningGroup();if(!group){if(done('L'))break;continue}if(group.rows.every(r=>r.answer!==null)){nextListeningGroup();continue}audioState(group.source).started=true;for(const row of group.rows)app.drafts[row.id]=respond(getQ(row.id));submitListening()}
 if(!done('L'))throw Error('L routing loop exceeded guard: '+profile+'/'+rating);
 const payload=buildResultPayload();const duplicate=CORE.some(k=>{const ids=app.skills[k].items.map(x=>x.id);return ids.length!==new Set(ids).size});
 return {profile,rating,iteration,overall:payload.overall.level||'Foundation',LU:payload.levels.LU||null,R:payload.levels.R||null,L:payload.levels.L||null,ceiling:!!payload.skills.L.ceiling,flags:payload.flags,luN:totalAnswered('LU'),rN:totalAnswered('R'),lN:listeningGroups().length,duplicate,paths:Object.fromEntries(CORE.map(k=>[k,app.skills[k].items.filter((x,i)=>k==='LU'||(k==='R'&&i%RULES.R.PAIR_SIZE===0)||(k==='L'&&i%RULES.L.ITEMS_PER_RECORDING===0)).map(x=>x.id+' ['+x.level+'] '+(x.correct?'✓':'×'))]))};
}
async function runSelfTests(){const host=document.getElementById('app');host.innerHTML='<div style="max-width:1100px;margin:40px auto;font:15px Arial,sans-serif"><h1>JTS v11 — automated self-test</h1><p>Real selection and scoring functions are running. 5,000 random A0 attempts plus 35 full skill profiles.</p><p id="selfProgress">Starting…</p></div>';
 await new Promise(resolve=>setTimeout(resolve,30));const started=performance.now();const summary=[],errors=[],paths=[];const profiles=['A0','A1','A2','B1','B2','C1','unstable','B1+2'],matchRating={A0:0,A1:1,A2:2,B1:3,B2:4,C1:4,unstable:3,'B1+2':3};
 const remembered=app;
 for(const profile of profiles){for(let rating=0;rating<START_BANDS.length;rating++){const n=profile==='A0'?1000:1;let rows=[];for(let i=0;i<n;i++){try{rows.push(simulateRealProfile(profile,rating,i))}catch(e){errors.push({profile,rating,i,message:String(e)});if(errors.length>20)break}}
 const distribution={};for(const r of rows)distribution[r.overall]=(distribution[r.overall]||0)+1;
 const representative=rows[0];let ok=rows.every(r=>r.luN>=RULES.LU.MIN_ANSWERS&&r.rN>=(r.LU==='A0'||!r.LU?RULES.R.A0_TEXTS*RULES.R.PAIR_SIZE:8)&&r.lN<=RULES.L.RECORDINGS&&!r.duplicate);
 if(profile==='A0'){const allowed=(distribution.Foundation||0)+(distribution.A0||0);ok=ok&&allowed/n>=.98&&Object.keys(distribution).every(k=>levelIdx(k)<=levelIdx('A1')||k==='Foundation')}
 else if(['A1','A2','B1','B2','C1'].includes(profile))ok=ok&&rows.every(r=>r.overall===profile&&r.LU===profile&&(profile!=='C1'||(r.L==='B2'&&r.ceiling)));
 else if(profile==='unstable')ok=ok&&rows.every(r=>r.flags.includes('inconsistent'));
 else if(profile==='B1+2')ok=ok&&rows.every(r=>r.overall==='B1');
 summary.push({profile,rating,n,result:JSON.stringify(distribution),LU:representative?.LU||'—',R:representative?.R||'—',L:representative?.L||'—',flags:(representative?.flags||[]).join(','),LU_questions:representative?.luN,R_questions:representative?.rN,L_recordings:representative?.lN,status:ok?'PASS':'FAIL'});
 if(rating===matchRating[profile]&&representative)paths.push({profile,rating,LU:representative.paths.LU.join(' → '),R:representative.paths.R.join(' → '),L:representative.paths.L.join(' → ')});
 }
 document.getElementById('selfProgress').textContent='Completed profile '+profile+'; running next…';await new Promise(resolve=>setTimeout(resolve,5));}
 SELFTEST_ACTIVE=false;app=remembered;
 const duration=((performance.now()-started)/1000).toFixed(2),passed=summary.every(x=>x.status==='PASS')&&!errors.length;
 const escapeText=x=>esc(x??'');const makeTable=(rows,cols)=>`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font:12px Arial,sans-serif"><thead><tr>${cols.map(c=>`<th style="padding:7px;border:1px solid #ddd;background:#f1eaff;text-align:left">${escapeText(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td style="vertical-align:top;padding:7px;border:1px solid #ddd;max-width:370px;overflow-wrap:anywhere;${c==='status'?(r[c]==='PASS'?'color:green':'color:red'):''}">${escapeText(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 host.innerHTML=`<div style="padding:24px;max-width:1440px;margin:auto;font:15px Arial,sans-serif"><h1>JTS v11 — real-function self-test</h1><p><b style="color:${passed?'green':'red'}">${passed?'ALL ACCEPTANCE CHECKS PASSED':'SOME CHECKS FAILED'}</b> · ${duration}s · ${summary.length} matrix cells · 5,000 random A0 + 35 other scenarios · errors: ${errors.length}</p><h2>Profile × self-rating → final level and skill levels</h2>${makeTable(summary,['profile','rating','n','result','LU','R','L','flags','LU_questions','R_questions','L_recordings','status'])}<h2>Question paths at matching self-rating</h2>${makeTable(paths,['profile','rating','LU','R','L'])}<h2>Errors</h2><pre>${escapeText(JSON.stringify(errors,null,2))}</pre></div>`;
 console.table(summary);console.table(paths);console.log('JTS v11 selftest results',{passed,duration,errors,summary,paths});}

function state(){
 app.studentGoals??=blank();
 app.goalOnboarding??={step:0,selections:{},customText:{},followUpDrafts:{},returnScreen:null};
 const g=app.studentGoals,d=app.goalOnboarding;
 d.selections??={};d.customText??={};d.followUpDrafts??={};
 g.preferenceCustomAnswers??={};
 return {g,d};
}
function sync(){
 const {g,d}=state();
 g.selectedCategories=[...new Set(g.selectedCategories)].filter(id=>CAT.has(id));
 g.selectedSubcategories=g.selectedCategories.flatMap(cid=>[...new Set(d.selections[cid]||[])].filter(id=>GOAL.get(id)?.categoryId===cid).map(id=>({id,categoryId:cid})));
 const ids=g.selectedSubcategories.map(x=>x.id);
 if(ids.length===1)g.primaryGoal=ids[0];
 if(!ids.includes(g.primaryGoal))g.primaryGoal=null;
 g.secondaryGoals=ids.filter(id=>id!==g.primaryGoal);
 g.customGoals=ids.filter(id=>GOAL.get(id).custom).map(id=>({id,categoryId:GOAL.get(id).categoryId,text:d.customText[id]??''}));
 const relevant=new Set(ids.flatMap(id=>GOAL.get(id).questionIds));
 g.followUpAnswers=Object.fromEntries(Object.entries(d.followUpDrafts).filter(([id,a])=>relevant.has(id)&&a&&(Array.isArray(a.value)?a.value.length:a.value!==''||a.customText)));
 const deadline=g.followUpAnswers.deadline;
 g.desiredDeadline=deadline?.value?{optionId:deadline.value,customText:deadline.customText||''}:null;
}
function persist(){
 sync();app.studentGoals.updatedAt=new Date().toISOString();save();
 try{storageProblem=JSON.parse(localStorage.getItem(STORAGE))?.app?.studentGoals?.updatedAt!==app.studentGoals.updatedAt}catch(e){storageProblem=true}
 const note=document.getElementById('goalSaveNote');if(note)note.textContent=u(storageProblem?'storageFail':'local');
}
function displayGoal(id){const goal=GOAL.get(id);return goal?.custom?(state().d.customText[id]||label(goal.label)):label(goal?.label);}
function questionOrder(){
 const {g}=state();const ids=[g.primaryGoal,...g.secondaryGoals].filter(Boolean);
 const unique=[...new Set(ids.flatMap(id=>GOAL.get(id)?.questionIds||[]))];
 const first=unique.filter(id=>id!=='deadline').slice(0,4);
 if(unique.includes('deadline'))first.push('deadline');
 return {main:first,extra:unique.filter(id=>!first.includes(id))};
}

function pref(key,title,multi){const {g}=state();const value=g[key];return `<fieldset class="go-fieldset" data-pref-field="${key}"><legend>${esc(u(title))}</legend><span class="go-optional">${esc(u(multi?'multiple':'optional'))}</span>${buttons(PREFS[key],value,`data-pref="${key}"`,!multi)}${(Array.isArray(value)?value.includes('other'):value==='other')?customField('pref-'+key,g.preferenceCustomAnswers[key],`data-pref-custom="${key}"`,u('otherPlaceholder')):''}</fieldset>`;}
function prefLabel(key){const {g}=state();const val=g[key],ids=Array.isArray(val)?val:[val];return ids.filter(Boolean).map(id=>id==='other'&&g.preferenceCustomAnswers[key]?g.preferenceCustomAnswers[key]:label(PREFS[key].find(o=>o.id===id)?.label)).join(', ')||u('empty');}
function answerLabel(id,a){const q=CFG.questions[id];if(q.kind==='text')return a.value;const ids=Array.isArray(a.value)?a.value:[a.value];return ids.filter(Boolean).map(v=>['other','custom'].includes(v)&&a.customText?a.customText:label(q.options.find(o=>o.id===v)?.label)).join(', ');}
function row(k,value){return `<div class="go-review-row"><dt>${esc(k)}</dt><dd>${esc(value||u('empty'))}</dd></div>`;}
function review(){const {g}=state();return `<dl class="go-review">${row(u('mainGoal'),displayGoal(g.primaryGoal))}${g.secondaryGoals.length?row(u('secondary'),g.secondaryGoals.map(displayGoal).join('\n')):''}${Object.entries(g.followUpAnswers).map(([id,a])=>row(label(CFG.questions[id].label),answerLabel(id,a))).join('')}${row(u('motivation'),prefLabel('motivationFactors'))}${row(u('activities'),prefLabel('preferredActivities'))}${row(u('availability'),prefLabel('studyAvailability'))}${row(u('feedback'),prefLabel('feedbackPreference'))}${g.personalExpectations?row(u('expectations'),g.personalExpectations):''}</dl><p class="go-review-note">${esc(u('reviewReminder'))}</p>`;}
function validate(){const {g,d}=state();if(d.step===0&&!g.selectedCategories.length)return 'chooseCategory';if(d.step===1){if(g.selectedCategories.some(cid=>!g.selectedSubcategories.some(x=>x.categoryId===cid)))return 'chooseGoal';if(g.customGoals.some(x=>!x.text.trim()))return 'writeCustom';if(!g.primaryGoal)return 'choosePrimary';}return null;}
function renderGoals(focusHeading=false){
 const {g,d}=state();sync();d.step=Math.max(0,Math.min(5,Number(d.step)||0));
 const titles=['title','goalsTitle','detailsTitle','prefsTitle','paceTitle','reviewTitle'];
 const subtitles=['subtitle','goalsSub','detailsSub','prefsSub','paceSub','reviewSub'];
 const content=d.step===0?mainCategories():d.step===1?specificGoals():d.step===2?details():d.step===3?pref('motivationFactors','motivation',true)+pref('preferredActivities','activities',true):d.step===4?pref('studyAvailability','availability',false)+pref('feedbackPreference','feedback',false)+`<fieldset class="go-fieldset"><legend>${esc(u('expectations'))}</legend><span class="go-optional">${esc(u('optional'))}</span>${textField('go-expectations',g.personalExpectations,'data-expectations',u('expectPlaceholder'),4)}</fieldset>`:review();
 chrome(`<section class="goals-shell"><div class="go-topline"><span class="go-badge">${esc(u('goalsLabel'))}</span><span>${esc(u('step'))} ${d.step+1} / 6</span></div><div class="go-progress" role="progressbar" aria-label="${esc(u('step'))}" aria-valuenow="${d.step+1}" aria-valuemin="1" aria-valuemax="6"><span style="width:${(d.step+1)/6*100}%"></span></div><header class="go-heading"><h1 id="goHeading" tabindex="-1">${esc(u(titles[d.step]))}</h1><p>${esc(u(subtitles[d.step]))}</p></header><div class="go-card">${content}</div><p id="goError" class="go-error" role="alert"></p><div class="go-actions"><button type="button" class="ghostbtn" id="goBack">← ${esc(u('back'))}</button>${[2,3,4].includes(d.step)?`<button type="button" class="go-skip" id="goSkip">${esc(u('skip'))}</button>`:''}${d.step===5?`<button type="button" class="go-skip" id="goEdit">${esc(u('edit'))}</button>`:''}<button type="button" class="gradbtn go-next" id="goNext">${esc(u(d.step===5?'continueTest':'next'))} →</button></div><footer class="go-footer"><span>${esc(u('nonScored'))}</span><span id="goalSaveNote" role="status">${esc(u(storageProblem?'storageFail':'local'))}</span><small>${esc(u('saveNote'))}</small></footer></section>`,u('goalsLabel'));
 bind();if(focusHeading){document.getElementById('goHeading').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}
}
function toggle(list,id){return list.includes(id)?list.filter(v=>v!==id):[...list,id];}
// Preserve focused controls and expanded optional groups during local re-renders.
function repaint(){const el=document.activeElement,key=el?.getAttributeNames?.().filter(a=>a.startsWith('data-')).map(a=>[a,el.getAttribute(a)])||[];const open=[...document.querySelectorAll('.go-category-group[open]')].map(e=>[...e.parentNode.children].indexOf(e));const more=document.querySelector('.go-more')?.open;const y=window.scrollY;renderGoals();document.querySelectorAll('.go-category-group').forEach((e,i)=>e.open=open.includes(i));if(more&&document.querySelector('.go-more'))document.querySelector('.go-more').open=true;const selector=key.filter(([a])=>a!=='data-value').map(([a,v])=>`[${a}="${CSS.escape(v)}"]`).join('')+(el?.dataset?.value?`[data-value="${CSS.escape(el.dataset.value)}"]`:'');if(selector)document.querySelector(selector)?.focus({preventScroll:true});window.scrollTo(0,y);}
function updateInput(e,fn){fn(e.target.value);persist();}
function bind(){const {g,d}=state();
 document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{g.selectedCategories=toggle(g.selectedCategories,b.dataset.category);if(b.dataset.category==='custom'&&g.selectedCategories.includes('custom'))d.selections.custom=['custom_other'];persist();repaint()});
 document.querySelectorAll('[data-goal-category]').forEach(b=>b.onclick=()=>{const cid=b.dataset.goalCategory;d.selections[cid]=toggle(d.selections[cid]||[],b.dataset.value);persist();repaint()});
 document.querySelectorAll('[data-custom-goal]').forEach(el=>el.oninput=e=>updateInput(e,v=>{d.customText[el.dataset.customGoal]=v;const primary=document.querySelector('[data-primary][data-value="'+el.dataset.customGoal+'"] span');if(primary)primary.textContent=v||label(GOAL.get(el.dataset.customGoal).label)}));
 document.querySelectorAll('[data-primary]').forEach(b=>b.onclick=()=>{g.primaryGoal=b.dataset.value;persist();repaint()});
 document.querySelectorAll('[data-follow-text]').forEach(el=>el.oninput=e=>updateInput(e,v=>d.followUpDrafts[el.dataset.followText]={value:v,customText:''}));
 document.querySelectorAll('[data-follow-choice]').forEach(b=>b.onclick=()=>{const id=b.dataset.followChoice,q=CFG.questions[id],a=d.followUpDrafts[id]??={value:q.kind==='multi'?[]:'',customText:''};a.value=q.kind==='multi'?toggle(Array.isArray(a.value)?a.value:[],b.dataset.value):a.value===b.dataset.value?'':b.dataset.value;persist();repaint()});
 document.querySelectorAll('[data-follow-custom]').forEach(el=>el.oninput=e=>updateInput(e,v=>d.followUpDrafts[el.dataset.followCustom].customText=v));
 document.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>{const key=b.dataset.pref;g[key]=Array.isArray(g[key])?toggle(g[key],b.dataset.value):g[key]===b.dataset.value?null:b.dataset.value;persist();repaint()});
 document.querySelectorAll('[data-pref-custom]').forEach(el=>el.oninput=e=>updateInput(e,v=>g.preferenceCustomAnswers[el.dataset.prefCustom]=v));
 const expectation=document.querySelector('[data-expectations]');if(expectation)expectation.oninput=e=>updateInput(e,v=>g.personalExpectations=v);
 document.getElementById('goBack').onclick=()=>{if(d.step===0){app.screen='selfcheck';persist();render();return}d.step--;persist();renderGoals(true)};
 const advance=()=>{const error=validate();if(error){const e=document.getElementById('goError');e.textContent=u(error);e.scrollIntoView({block:'nearest'});return}if(d.step<5){d.step++;persist();renderGoals(true)}else{g.completed=true;const returnScreen=d.returnScreen;d.returnScreen=null;app.screen=returnScreen||'sound';persist();render()}};
 document.getElementById('goNext').onclick=advance;
 document.getElementById('goSkip')?.addEventListener('click',advance);
 document.getElementById('goEdit')?.addEventListener('click',()=>{d.step=0;persist();renderGoals(true)});
}
selfCheck=function(){originalSelfCheck();const b=document.getElementById('selfContinue');if(!b)return;const previous=b.onclick;b.onclick=()=>{if(app.selfRating===null)return;const {g}=state();if(g.completed)return previous();app.screen='goals';persist();renderGoals(true)};};
// Guard only new attempts before scored questions. Existing started attempts
// remain usable and can open the questionnaire explicitly through edit().
function needsOnboarding(){return !state().g.completed&&app.selfRating!==null&&!CORE.some(k=>app.skills[k]?.items?.length)&&app.speaking.status==='not_assessed';}
render=function(){if(SELFTEST_ACTIVE)return originalRender();if(app&&app.screen==='goals')return renderGoals();if(app&&needsOnboarding()&&!['welcome','selfcheck'].includes(app.screen)){app.returnAfterSound=null;app.screen='goals';persist();return renderGoals(true)}return originalRender();};
openSkill=function(skill){if(!SELFTEST_ACTIVE&&app&&['LU','R','L','S'].includes(skill)&&needsOnboarding()){app.queuedSkill=skill;app.screen='goals';persist();renderGoals(true);return}return originalOpenSkill(skill);};
window.JTSStudentGoals=Object.freeze({
 getData(){sync();return clone(app.studentGoals)},
 exportJSON(){sync();return JSON.stringify({schemaVersion:1,placementSessionId:app.id,questionnaire:clone(app.studentGoals)},null,2)},
 getConfiguration(){return clone({categories:CFG.categories,questions:CFG.questions,preferences:PREFS})},
 edit(){stopCurrentMedia();const {d}=state();d.returnScreen=app.screen==='goals'?d.returnScreen:app.screen;d.step=app.studentGoals.completed?5:d.step;app.studentGoals.completed=false;app.screen='goals';persist();renderGoals(true)}
});
})();

function buildRecommendations(assessment,goals,locale='ru'){
 const g=copy(goals||{}),p=copy(assessment||{});p.skills??={};p.overall??={level:null};
 const selected=(g.selectedSubcategories||[]).map(v=>typeof v==='string'?v:v.id);const primary=selected.includes(g.primaryGoal)?g.primaryGoal:null;
 const target=targetFor(primary,g,locale);const secondaryTargets=selected.filter(id=>id!==primary).map(id=>targetFor(id,g,locale));
 const current=p.overall.level,targetAlreadyMet=rank(current)>=0&&rank(target.targetCEFR)>=0&&rank(current)>=rank(target.targetCEFR);
 const priorities=new Map();const add=(id,score,goalId)=>{const prev=priorities.get(id);if(!prev||score>prev.score)priorities.set(id,{id,score,goalId})};
 target.priorities.forEach((id,i)=>add(id,100-i*15,primary));secondaryTargets.forEach(s=>s.priorities.forEach((id,i)=>add(id,45-i*5,s.goalId)));
 if(!primary||!target.priorities.length){Object.entries(skillMap).filter(([id,k])=>usable(p.skills[k],k)).sort((a,b)=>rank(p.skills[a[1]].level)-rank(p.skills[b[1]].level)).forEach(([id],i)=>add(id,90-i*15,null));if(!priorities.size){add('vocabulary',70,null);add('speaking',60,null);}}
 for(const [id,k] of Object.entries(skillMap)){const r=p.skills[k];if(!usable(r,k))continue;const demand=rank(target.targetCEFR);if(demand>=0&&rank(r.level)<demand&&priorities.has(id))priorities.get(id).score+=20;if(r.total>=4&&r.correct/r.total<.6)add(id,95,primary);}
 const prioritySkills=[...priorities.values()].sort((a,b)=>b.score-a.score).slice(0,3).map(v=>{const k=skillMap[v.id];const measured=k&&usable(p.skills[k],k);return {id:v.id,goalId:v.goalId,title:skillName(v.id,locale),reason:msg(v.goalId?'priorityGoal':'priorityGeneral',{goal:goalText(v.goalId,g,locale),reason:loc(C.skillReasons[v.id],locale)},locale),assessedLevel:measured?p.skills[k].level:null,basis:measured?'goal_and_assessment':'goal_requirement',note:measured?'':msg('unmeasuredPriority',{},locale)};});
 return window.JTSPracticeRecommendations.recommend(p,g,locale,{...target,secondaryTargets:secondaryTargets.map(({priorities,...s})=>s),targetAlreadyMet,prioritySkills,sourceReferences:copy(C.sources)},window.JTSPlacementConfig?.practiceRecommendationContext||{});
}

function compareHTML(p,r,g){const known=rank(p.overall.level)>=0,current=known?p.overall.level:['LU','R','L'].some(k=>p.skills[k]?.total)?'Foundation':msg('unassessed');return `<section class="pr-panel"><span class="pr-kicker">04</span><h2>${esc(msg('comparison'))}</h2><div class="pr-comparison"><article><span>${esc(msg('pointA'))}</span><strong>${esc(current)}</strong></article><span class="pr-arrow" aria-hidden="true">→</span><article class="pr-target"><span>${esc(msg('pointB'))}</span><strong>${esc(r.targetCEFR||msg('clarify'))}</strong></article></div><p class="pr-note">${esc(msg('notRoadmap'))}</p><h3 class="pr-subtitle">${esc(msg('basis'))}</h3><p>${esc(r.targetExplanation)}</p>${r.targetStatus==='provisional'?`<p class="pr-note">${esc(msg('provisional'))}</p>`:''}${r.targetAlreadyMet?`<p class="pr-met">${esc(msg('met'))}</p>`:''}<p class="pr-note">${esc(msg('indicative'))}</p>${r.secondaryTargets.length?`<details class="pr-secondary"><summary>${esc(msg('secondaryTargets'))}</summary><p class="pr-note">${esc(msg('notHigher'))}</p>${r.secondaryTargets.map(s=>`<p><b>${esc(goalText(s.goalId,g))}: ${esc(s.targetCEFR||msg('clarify'))}</b><br>${esc(s.targetExplanation)}</p>`).join('')}</details>`:''}<p class="pr-source">${esc(msg('sourceNote'))} <a href="${C.sources[0]}" target="_blank" rel="noopener noreferrer">${esc(msg('viewSource'))} ↗</a></p></section>`;}

function activitiesHTML(r,g){return window.JTSPracticeRecommendations.render(r,g,lang);}
let pending=false;
function download(){const blob=new Blob([JSON.stringify(fullPayload(),null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JTS_Placement_Result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function continueLearning(){if(pending)return;save();let status=document.getElementById('prIntegrationStatus');const button=document.getElementById('prLearn');const adapter=window.JTSPlacementConfig?.openLearning;
 if(typeof adapter!=='function'){status.hidden=false;status.textContent=msg('fallback');document.getElementById('prDownload').hidden=false;return}
 const payload=fullPayload(),attemptId=app.id;pending=true;button.disabled=true;status.hidden=false;status.textContent=msg('sending');let timer;
 try{const confirmation=await Promise.race([Promise.resolve().then(()=>adapter(copy(payload),{intent:'open_existing_roadmap',attemptId,requestId:attemptId+'_'+Date.now()})),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('handoff_timeout')),10000)})]);
 if(app.id!==attemptId||!document.getElementById('prIntegrationStatus'))return;
 status=document.getElementById('prIntegrationStatus');status.hidden=false;status.textContent=msg(confirmation?.persisted===true?'confirmed':confirmation?.navigated===true?'opened':confirmation?.accepted===true?'accepted':'failed');document.getElementById('prDownload').hidden=false;
 }catch(e){if(app.id===attemptId&&document.getElementById('prIntegrationStatus')){status=document.getElementById('prIntegrationStatus');status.hidden=false;status.textContent=msg('failed');document.getElementById('prDownload').hidden=false;}}
 finally{clearTimeout(timer);pending=false;const currentButton=document.getElementById('prLearn');if(currentButton)currentButton.disabled=false;}
}
result=function(){
 ORIGINAL_RESULT();const original=document.querySelector('.results');if(!original)return;
 const p=buildResultPayload();app.phase3ResultMeta??={resultsViewedAt:new Date().toISOString(),completedAt:null};if(!p.overall.partial&&!app.phase3ResultMeta.completedAt)app.phase3ResultMeta.completedAt=new Date().toISOString();save();
 const g=goalSnapshot(),r=buildRecommendations(p,g,lang),current=p.overall.level||(['LU','R','L'].some(k=>p.skills[k]?.total)?'Foundation':msg('unassessed'));
 const host=document.createElement('section');host.className='personal-results';host.innerHTML=`<header class="pr-hero"><div><span class="pr-badge">${esc(msg('result'))}</span><h1>${esc(msg('today'))}</h1><div class="pr-level ${rank(current)<0?'pr-no-level':''}" data-current-cefr="${esc(p.overall.level||'')}">${esc(current)}</div><p>${esc(p.overall.level?x('partial'):['LU','R','L'].some(k=>p.skills[k]?.total)?x('beginnerResult'):msg('noEvidence'))}</p>${p.overall.partial?`<p class="pr-note">${esc(msg('partial'))}</p>`:''}</div><div class="pr-mascot">${img('pr-approved-mascot')}</div></header><div class="pr-skills">${skillCards(p)}</div>${evidence(p,r)}${window.JTSHostSpeakingFeedback?window.JTSHostSpeakingFeedback(p.skills.S,lang):''}${goalsHTML(g)}${compareHTML(p,r,g)}${prioritiesHTML(r)}${activitiesHTML(r,g)}<section class="pr-first"><span class="pr-kicker">07</span><h2>${esc(msg('first'))}</h2><p>${esc(r.firstAction?.text||msg('unknownPractice'))}</p><small>${esc(r.firstAction?.timeAdvice||'')}</small></section><section class="pr-continue"><p>${esc(msg('platform'))}</p><div class="pr-actions"><button type="button" class="gradbtn" id="prLearn">${esc(msg('learn'))} →</button><button type="button" class="ghostbtn" id="prDetailsButton">${esc(msg('detail'))}</button></div><p class="pr-integration-status" id="prIntegrationStatus" role="status" hidden></p><button type="button" class="pr-text-button" id="prDownload" hidden>${esc(msg('download'))}</button></section>`;
 original.before(host);const details=document.createElement('details');details.className='pr-original';details.id='prOriginalDetails';details.innerHTML=`<summary>${esc(msg('detailsHeading'))}</summary><p class="pr-note">${esc(msg('detailsNote'))}</p>`;host.appendChild(details);details.appendChild(original);
 window.JTSPracticeRecommendations.bind(r,lang);
 document.getElementById('prLearn').disabled=pending;document.getElementById('prLearn').onclick=continueLearning;document.getElementById('prDownload').onclick=download;
 document.getElementById('prDetailsButton').onclick=()=>{details.open=true;details.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});details.querySelector('summary').focus()};
 document.getElementById('prEditGoals').onclick=()=>window.JTSStudentGoals.edit();
};
window.JTSPersonalizedResults=Object.freeze({ruleVersion:3.1,getPayload:()=>copy(fullPayload()),exportJSON:()=>JSON.stringify(fullPayload(),null,2),recommend:(p,g,locale=lang)=>copy(buildRecommendations(p,g,['ru','kk','en'].includes(locale)?locale:'en'))});
})();

 };
