<script type="application/json" id="course">{"cats":[{"id":"place","title":{"en":"Place and position","kk":"Орын және орналасу","ru":"Место и положение"},"blurb":{"en":"In, on, at, under, behind, between and more: where things and people are.","kk":"In, on, at, under, behind, between және басқалар: заттар мен адамдардың қайда екені.","ru":"In, on, at, under, behind, between и другие: где находятся предметы и люди."},"lessons":[{"id":"place-in-on-at","title":{"en":"In, on, at: place","kk":"In, on, at: орын","ru":"In, on, at: место"},"preps":"in · on · at","lead":{"en":"Choose in, on or at to say exactly where something or someone is.","kk":"Біреудің немесе бір нәрсенің қайда екенін дәл айту үшін in, on немесе at таңдауды үйренесіз.","ru":"Вы научитесь выбирать in, on или at, чтобы точно сказать, где что-то или кто-то находится."},"screens":[{"h":{"en":"The big idea","kk":"Негізгі идея","ru":"Главная идея"},"blocks":[{"t":"scene","sc":"f_in","a":"a","p":"in","b":"t","c":null},{"t":"rule","h":{"en":"in = inside a space","kk":"in = кеңістіктің ішінде","ru":"in = внутри пространства"},"p":{"en":"Use in for a place that is inside a bigger space: a room, a box, a city, a country, water.","kk":"Үлкенірек кеңістіктің ішіндегі орынға in қолданамыз: бөлме, қорап, қала, ел, су.","ru":"In используется для места внутри большего пространства: комната, коробка, город, страна, вода."},"ex":[{"en":"The clothes are in the wardrobe.","kk":"Киімдер шкафта тұр.","ru":"Одежда в шкафу."},{"en":"My cousin lives in Astana.","kk":"Менің туысым Астанада тұрады.","ru":"Мой двоюродный брат живёт в Астане."}],"pat":"in + room / box / city / country / water"},{"t":"scene","sc":"f_onrock","a":"a","p":"on","b":"rock","c":null},{"t":"rule","h":{"en":"on = on a surface or a line","kk":"on = бетке немесе сызыққа","ru":"on = на поверхности или на линии"},"p":{"en":"Use on for a surface (a wall, a floor, a table) and for lines such as streets and rivers. We also use on for public transport: a bus, a train, a plane.","kk":"Бетке (қабырға, еден, үстел) және көше, өзен сияқты сызықтарға on қолданамыз. Қоғамдық көлікке де on айтамыз: автобус, пойыз, ұшақ.","ru":"On используется для поверхности (стена, пол, стол) и для линий: улица, река. Также on говорим про общественный транспорт: автобус, поезд, самолёт."},"ex":[{"en":"The books are on the desk.","kk":"Кітаптар үстелдің үстінде.","ru":"Книги на столе."},{"en":"He's on the bus now.","kk":"Ол қазір автобуста.","ru":"Он сейчас в автобусе."},{"en":"London is on the River Thames.","kk":"Лондон Темза өзенінің жағасында орналасқан.","ru":"Лондон стоит на реке Темзе."}],"pat":"on + surface / line / bus, train, plane"},{"t":"rule","h":{"en":"at = a point, or a place for an activity","kk":"at = нүкте немесе әрекетке арналған орын","ru":"at = точка или место для действия"},"p":{"en":"Use at for a point where something happens: at home, at work, at the station, at the door. At also gives an exact position or an address.","kk":"Бір нәрсе болатын нүктеге at қолданамыз: at home, at work, at the station, at the door. At нақты орынды немесе мекенжайды да көрсетеді.","ru":"At используется для точки, где что-то происходит: at home, at work, at the station, at the door. At также показывает точное место или адрес."},"ex":[{"en":"I'm at work.","kk":"Мен жұмыстамын.","ru":"Я на работе."},{"en":"Wait for me at the door.","kk":"Мені есік алдында күте тұр.","ru":"Подожди меня у двери."},{"en":"I live at 15 Craig Street.","kk":"Мен Крейг көшесі, 15-үйде тұрамын.","ru":"Я живу по адресу: Крейг-стрит, 15."}],"pat":"at + point / activity place / address"},{"t":"note","p":{"en":"Kazakh uses one ending (-да/-де) and Russian often uses в or на for all three. English makes a choice, so learn the common phrases as whole chunks.","kk":"Қазақ тілінде үшеуіне де бір жалғау (-да/-де) қолданылады, орыс тілінде көбіне в немесе на айтылады. Ағылшын тілінде таңдау бар, сондықтан жиі кездесетін тіркестерді тұтас үйреніңіз.","ru":"В казахском для всех трёх случаев один падеж (-да/-де), в русском чаще в или на. В английском нужно выбирать, поэтому учите частые сочетания целиком."}}]},{"h":{"en":"IN · ON · AT table","kk":"IN · ON · AT кестесі","ru":"Таблица IN · ON · AT"},"blocks":[{"t":"table","cols":[{"en":"IN","kk":"IN","ru":"IN"},{"en":"ON","kk":"ON","ru":"ON"},{"en":"AT","kk":"AT","ru":"AT"}],"rows":[{"label":{"en":"Rooms and homes","kk":"Бөлме және үй","ru":"Комнаты и дом"},"cells":[{"en":"in the kitchen","kk":"ас үйде","ru":"на кухне"},{"en":"on the floor","kk":"еденде","ru":"на полу"},{"en":"at home","kk":"үйде","ru":"дома"}]},{"label":{"en":"Vehicles and stops","kk":"Көлік және аялдама","ru":"Транспорт и остановки"},"cells":[{"en":"in a taxi","kk":"таксиде","ru":"в такси"},{"en":"on the bus","kk":"автобуста","ru":"в автобусе"},{"en":"at the bus stop","kk":"аялдамада","ru":"на остановке"}]},{"label":{"en":"Pictures and pages","kk":"Сурет және бет","ru":"Картинки и страницы"},"cells":[{"en":"in the picture","kk":"суретте","ru":"на картинке"},{"en":"on the page","kk":"бетте","ru":"на странице"},{"en":"at the top of the page","kk":"беттің жоғарғы жағында","ru":"в верхней части страницы"}]},{"label":{"en":"Bigger places","kk":"Үлкен орындар","ru":"Крупные места"},"cells":[{"en":"in Kazakhstan","kk":"Қазақстанда","ru":"в Казахстане"},{"en":"on the coast","kk":"жағалауда","ru":"на побережье"},{"en":"at the airport","kk":"әуежайда","ru":"в аэропорту"}]}],"h":{"en":"Same idea, three prepositions","kk":"Бір идея, үш предлог","ru":"Одна идея, три предлога"}},{"t":"note","p":{"en":"Lakes and water: swim in a lake (in the water), but a house on a lake is beside it.","kk":"Көл мен су: көлде жүземіз (судың ішінде), ал on a lake үй көлдің жағасында дегенді білдіреді.","ru":"Озёра и вода: плаваем in a lake (в воде), а a house on a lake — дом на берегу озера."}}]},{"h":{"en":"Chunks to learn","kk":"Жаттауға арналған тіркестер","ru":"Сочетания для запоминания"},"blocks":[{"t":"list","h":{"en":"Common place phrases","kk":"Жиі кездесетін орын тіркестері","ru":"Частые сочетания места"},"items":[{"k":"at home","ex":{"en":"Is Luna at home?","kk":"Луна үйде ме?","ru":"Луна дома?"}},{"k":"at the station","ex":{"en":"We met at the station.","kk":"Біз вокзалда кездестік.","ru":"Мы встретились на вокзале."}},{"k":"in bed","ex":{"en":"Dexter is still in bed.","kk":"Декстер әлі төсекте жатыр.","ru":"Декстер ещё в постели."}},{"k":"in the sky","ex":{"en":"There are no clouds in the sky.","kk":"Аспанда бұлт жоқ.","ru":"В небе нет облаков."}},{"k":"in a car / a taxi","ex":{"en":"We went there in a taxi.","kk":"Біз ол жаққа таксимен бардық.","ru":"Мы поехали туда на такси."}},{"k":"on the wall","ex":{"en":"A map is on the wall.","kk":"Қабырғада карта ілулі тұр.","ru":"На стене висит карта."}},{"k":"on the left / right","ex":{"en":"The bank is on the left.","kk":"Банк сол жақта.","ru":"Банк слева."}},{"k":"on the second floor","ex":{"en":"Her office is on the second floor.","kk":"Оның кеңсесі екінші қабатта.","ru":"Её офис на втором этаже."}}]}]},{"h":{"en":"Careful: corners, streets, floors","kk":"Назар аудар: бұрыш, көше, қабат","ru":"Осторожно: углы, улицы, этажи"},"blocks":[{"t":"rule","h":{"en":"corner: in, on or at?","kk":"corner: in, on әлде at?","ru":"corner: in, on или at?"},"p":{"en":"Inside a room, a box or a cafe, say in the corner. For the place where two streets meet (outside), say on the corner or at the corner.","kk":"Бөлменің, қораптың немесе кафенің ішінде in the corner дейміз. Екі көше түйісетін жерде (сыртта) on the corner немесе at the corner дейміз.","ru":"Внутри комнаты, коробки или кафе говорим in the corner. Для места, где сходятся две улицы (снаружи), говорим on the corner или at the corner."},"ex":[{"en":"The lamp is in the corner of the room.","kk":"Шам бөлменің бұрышында тұр.","ru":"Лампа стоит в углу комнаты."},{"en":"There's a hotel on the corner of my street.","kk":"Менің көшемнің бұрышында қонақ үй бар.","ru":"На углу моей улицы есть отель."},{"en":"Turn right at the corner of Abay Street and Satpaev Street.","kk":"Абай мен Сәтбаев көшелерінің қиылысында оңға бұрылыңыз.","ru":"Поверните направо на углу улиц Абая и Сатпаева."}]},{"t":"rule","h":{"en":"at the top, bottom or end of","kk":"at the top, bottom, end of: жоғарғы, төменгі, соңғы нүкте","ru":"at the top, bottom, end of: верх, низ, конец"},"p":{"en":"For the highest point, the lowest point or the last point of something, use at the top / the bottom / the end of.","kk":"Бір нәрсенің ең жоғарғы, ең төменгі немесе соңғы нүктесіне at the top / the bottom / the end of қолданамыз.","ru":"Для самой верхней, самой нижней или последней точки чего-либо используем at the top / the bottom / the end of."},"ex":[{"en":"She was standing at the top of the stairs.","kk":"Ол баспалдақтың жоғарғы жағында тұрды.","ru":"Она стояла наверху лестницы."},{"en":"Sign your name here, at the bottom of the page.","kk":"Атыңызды мұнда, беттің төменгі жағына қойыңыз.","ru":"Поставьте подпись здесь, внизу страницы."},{"en":"The cinema is at the end of the street.","kk":"Кинотеатр көшенің аяғында.","ru":"Кинотеатр в конце улицы."}]},{"t":"rule","h":{"en":"street: in or on?","kk":"street: in әлде on?","ru":"street: in или on?"},"p":{"en":"Both are used. British English often says in the street. American English usually says on the street, and on Abay Street with a street name. With a house number, use at.","kk":"Екеуі де қолданылады. Британ ағылшынында көбіне in the street, американ ағылшынында әдетте on the street және көше атымен on Abay Street айтылады. Үй нөмірімен at қолданылады.","ru":"Используются оба. В британском английском часто in the street, в американском обычно on the street, а с названием улицы — on Abay Street. С номером дома используется at."},"ex":[{"en":"A couple were arguing in the street.","kk":"Бір жұп көшеде ұрысып тұрды.","ru":"Пара ссорилась на улице."},{"en":"He lives on Abay Street.","kk":"Ол Абай көшесінде тұрады.","ru":"Он живёт на улице Абая."},{"en":"They live at 20 Abay Street.","kk":"Олар Абай көшесі, 20-үйде тұрады.","ru":"Они живут по адресу: улица Абая, 20."}]},{"t":"note","p":{"en":"Floors: in British English the ground floor is at street level and the first floor is above it. In North American English the first floor is at street level.","kk":"Қабаттар: британ ағылшынында ground floor көше деңгейінде, first floor оның үстінде. Солтүстік америкалық ағылшында first floor көше деңгейіндегі қабат.","ru":"Этажи: в британском английском ground floor — уровень улицы, а first floor — этаж выше. В североамериканском английском first floor — уровень улицы."}}]}],"mistakes":[{"bad":"I met her in the bus stop.","good":"I met her at the bus stop.","note":{"en":"A bus stop is a point, so use at.","kk":"Аялдама – нүкте, сондықтан at қолданамыз.","ru":"Остановка — точка, поэтому используем at."}},{"bad":"I'm in the bus.","good":"I'm on the bus.","note":{"en":"We usually use on for a bus, a train or a plane. Use in for a car or a taxi.","kk":"Автобус, пойыз, ұшаққа әдетте on, ал машина мен таксиге in қолданамыз.","ru":"Для автобуса, поезда и самолёта обычно on, для машины и такси — in."}},{"bad":"He lives in the third floor.","good":"He lives on the third floor.","note":{"en":"We use on with floors.","kk":"Қабаттармен on қолданылады.","ru":"С этажами используется on."}},{"bad":"She lives on Almaty.","good":"She lives in Almaty.","note":{"en":"A city is a space, so use in.","kk":"Қала – кеңістік, сондықтан in.","ru":"Город — пространство, поэтому in."}}],"memory":{"en":"IN = inside the box · ON = touching a surface or line · AT = a point on the map.","kk":"IN = қораптың ішінде · ON = бетке немесе сызыққа тиіп · AT = картадағы нүкте.","ru":"IN = внутри коробки · ON = на поверхности или линии · AT = точка на карте."},"src":["bc_place","bc_adv","old_at","old_on","old_corner","old_street","old_floor","old_top","blog_street"],"practice":[{"type":"scene","lv":1,"sc":"f_in","a":"a","p":"in","b":"t","c":null},{"type":"scene","lv":1,"sc":"f_onrock","a":"a","p":"on","b":"rock","c":null},{"type":"gap","lv":1,"stem":"Spark is ___ work until six.","opts":["in","on","at"],"ans":"at","why":{"en":"We say at work for the place where you work.","kk":"Жұмыс орнын at work деп айтамыз.","ru":"Место работы выражаем через at work."},"tr":{"kk":"Спарк алтыға дейін жұмыста.","ru":"Спарк на работе до шести."}},{"type":"gap","lv":1,"stem":"The picture is ___ the wall.","opts":["in","on","at"],"ans":"on","why":{"en":"A picture touches the surface of a wall, so we use on.","kk":"Сурет қабырғаның бетіне тиіп тұр, сондықтан on.","ru":"Картина касается поверхности стены, поэтому on."},"tr":{"kk":"Сурет қабырғада ілулі тұр.","ru":"Картина висит на стене."}},{"type":"gap","lv":1,"stem":"We live ___ Almaty.","opts":["in","on","at"],"ans":"in","why":{"en":"A city is a big space, so we use in.","kk":"Қала – үлкен кеңістік, сондықтан in.","ru":"Город — большое пространство, поэтому in."},"tr":{"kk":"Біз Алматыда тұрамыз.","ru":"Мы живём в Алматы."}},{"type":"gap","lv":2,"stem":"Wait for me ___ the bus stop.","opts":["in","on","at"],"ans":"at","why":{"en":"A bus stop is a point where we wait, so we use at.","kk":"Аялдама – біз күтетін нүкте, сондықтан at.","ru":"Остановка — точка, где мы ждём, поэтому at."},"tr":{"kk":"Мені аялдамада күте тұр.","ru":"Подожди меня на остановке."}},{"type":"gap","lv":2,"stem":"We came here ___ a taxi.","opts":["in","on","at"],"ans":"in","why":{"en":"We go in a car or a taxi, but on a bus or a train.","kk":"Көлікке және таксиге in, ал автобус пен пойызға on айтамыз.","ru":"Про машину и такси говорим in, про автобус и поезд — on."},"tr":{"kk":"Біз мұнда таксимен келдік.","ru":"Мы приехали сюда на такси."}},{"type":"gap","lv":2,"stem":"Dexter's flat is ___ the fifth floor.","opts":["in","on","at"],"ans":"on","why":{"en":"We use on with floors of a building.","kk":"Ғимарат қабаттарымен on қолданамыз.","ru":"С этажами здания используем on."},"tr":{"kk":"Декстердің пәтері бесінші қабатта.","ru":"Квартира Декстера на пятом этаже."}},{"type":"gap","lv":2,"stem":"Write your name ___ the top of the page.","opts":["in","by","at"],"ans":"at","why":{"en":"The top of something is a point, so we say at the top of.","kk":"Бір нәрсенің жоғарғы жағы – нүкте, сондықтан at the top of.","ru":"Верх чего-либо — это точка, поэтому at the top of."},"tr":{"kk":"Атыңызды беттің жоғарғы жағына жазыңыз.","ru":"Напишите своё имя вверху страницы."}},{"type":"gap","lv":3,"stem":"Sorry, I can't talk now. I'm ___ the number 5 bus.","opts":["in","on","at"],"ans":"on","why":{"en":"We use on for buses, trains and planes.","kk":"Автобус, пойыз және ұшаққа on қолданамыз.","ru":"С автобусами, поездами и самолётами используем on."},"tr":{"kk":"Кешіріңіз, қазір сөйлесе алмаймын. Мен 5-автобуста келе жатырмын.","ru":"Извини, сейчас не могу говорить. Я в автобусе номер 5."}},{"type":"gap","lv":3,"stem":"Aizere put the old chair ___ the corner of the room.","opts":["in","on","at"],"ans":"in","why":{"en":"Inside a room we say in the corner.","kk":"Бөлменің ішінде in the corner айтамыз.","ru":"Внутри комнаты говорим in the corner."},"tr":{"kk":"Айзере ескі орындықты бөлменің бұрышына қойды.","ru":"Айзере поставила старый стул в угол комнаты."}},{"type":"fix","lv":2,"stem":"I met Luna [in] the bus stop.","wrong":"in","opts":["at","on","into"],"ans":"at","why":{"en":"A bus stop is a point, so we say at the bus stop.","kk":"Аялдама – нүкте, сондықтан at the bus stop.","ru":"Остановка — точка, поэтому at the bus stop."},"tr":{"kk":"Мен Лунамен аялдамада кездестім.","ru":"Я встретил Луну на остановке."}},{"type":"fix","lv":3,"stem":"Dexter is reading [at] bed.","wrong":"at","opts":["in","on","by"],"ans":"in","why":{"en":"We say in bed for lying in your bed.","kk":"Төсекте жатқанда in bed деп айтамыз.","ru":"Про того, кто лежит в кровати, говорим in bed."},"tr":{"kk":"Декстер төсекте кітап оқып жатыр.","ru":"Декстер читает в постели."}},{"type":"compare","lv":3,"ask":{"en":"Which sentence is about a place inside a room?","kk":"Қай сөйлем бөлменің ішіндегі орын туралы?","ru":"Какое предложение о месте внутри комнаты?"},"opts":["Luna put the plant in the corner.","Luna waited on the corner."],"ans":0,"why":{"en":"In the corner means inside a room. On the corner means where two streets meet.","kk":"In the corner – бөлменің ішінде. On the corner – екі көше түйісетін жер.","ru":"In the corner — внутри комнаты. On the corner — там, где сходятся две улицы."},"tr":{"kk":["Луна өсімдікті бұрышқа қойды.","Луна көше бұрышында күтті."],"ru":["Луна поставила растение в угол.","Луна ждала на углу."]}}]},{"id":"place-inside-outside-within","title":{"en":"Inside, outside, out of, within","kk":"Inside, outside, out of, within","ru":"Inside, outside, out of, within"},"preps":"inside · outside · out of · within","lead":{"en":"Say if something is in a place, on the outer side of it, away from it, or within its limits.","kk":"Бір нәрсе орынның ішінде ме, сыртында ма, одан тыс па, әлде шегінің ішінде ме – соны айтуды үйренесіз.","ru":"Вы научитесь говорить, что предмет внутри места, снаружи, вне его или в его пределах."},"screens":[{"h":{"en":"Inside and outside","kk":"Іште және сыртта","ru":"Внутри и снаружи"},"blocks":[{"t":"scene","sc":"f_in","a":"a","p":"in","b":"t","c":null},{"t":"rule","h":{"en":"in and inside","kk":"in және inside","ru":"in и inside"},"p":{"en":"Inside means in the inner part of something. It is the clear opposite of outside. In many sentences you can use in or inside; inside makes it clear that something is not outside.","kk":"Inside – бір нәрсенің ішкі бөлігінде дегенді білдіреді. Бұл outside сөзінің нақты қарама-қарсысы. Көп сөйлемде in не inside қолдануға болады; inside затты сыртта емес екенін айқын көрсетеді.","ru":"Inside означает «во внутренней части чего-либо» и является прямой противоположностью outside. Во многих предложениях подходят и in, и inside; inside ясно показывает, что предмет не снаружи."},"ex":[{"en":"Aizere is in the hollow tree.","kk":"Айзере ағаштың қуысында.","ru":"Айзере в дупле дерева."},{"en":"Go inside the house.","kk":"Үйдің ішіне кіріңіз.","ru":"Зайдите в дом."},{"en":"Inside the box was a gold watch.","kk":"Қораптың ішінде алтын сағат болды.","ru":"Внутри коробки были золотые часы."}],"pat":"in / inside + the house, the box, the tent"},{"t":"scene","sc":"sp_in","a":"l","p":"inside","b":"sh","c":null},{"t":"rule","h":{"en":"outside","kk":"outside: сыртында","ru":"outside: снаружи"},"p":{"en":"Outside means on the outer side of a place, not in it. Use it for something that is by the outside of a building, a tent or a town.","kk":"Outside – орынның ішінде емес, сыртқы жағында дегенді білдіреді. Ғимараттың, шатырдың немесе қаланың сыртқы жағындағы нәрсеге қолданамыз.","ru":"Outside означает «с внешней стороны места, не внутри него». Используем для того, что находится снаружи здания, палатки или города."},"ex":[{"en":"You can park your car outside our house.","kk":"Көлігіңізді біздің үйдің сыртына қоюға болады.","ru":"Вы можете поставить машину у нашего дома."},{"en":"We live in a small village just outside Leeds.","kk":"Біз Лидстің дәл сыртындағы шағын ауылда тұрамыз.","ru":"Мы живём в маленькой деревне сразу за Лидсом."}],"pat":"outside + building / tent / town"},{"t":"scene","sc":"f_out","a":"a","p":"outside","b":"tent","c":null}]},{"h":{"en":"Outside and out of","kk":"Outside және out of","ru":"Outside и out of"},"blocks":[{"t":"scene","sc":"f_intent","a":"t","p":"outside","b":"tent","c":null},{"t":"rule","h":{"en":"out of = not in a place","kk":"out of = орында жоқ","ru":"out of = не в месте"},"p":{"en":"Out of means away from the inside of a place. For people, out of town or out of the office means they are not at home or at work. Always write both words: out of.","kk":"Out of – орынның ішінен тыс дегенді білдіреді. Адамдарға қатысты out of town немесе out of the office олардың үйде не жұмыста жоқ екенін көрсетеді. Әрдайым екі сөзді жазыңыз: out of.","ru":"Out of означает «вне внутренней части места». Про людей out of town или out of the office значит, что их нет дома или на работе. Всегда пишите оба слова: out of."},"ex":[{"en":"Mr Green is out of town this week.","kk":"Грин мырза бұл аптада қалада жоқ.","ru":"Мистер Грин на этой неделе не в городе."},{"en":"I got an out-of-office reply to my email.","kk":"Мен электрондық хатыма «кеңседе жоқ» деген жауап алдым.","ru":"Я получил на своё письмо автоответ «нет в офисе»."},{"en":"The kids are out of the pool now.","kk":"Балалар енді бассейннен шықты.","ru":"Дети уже вылезли из бассейна."}],"pat":"out of + town / the office / the pool"},{"t":"compare","h":{"en":"outside or out of?","kk":"outside немесе out of?","ru":"outside или out of?"},"a":{"label":"outside","p":{"en":"Outside tells us where something is: on the outer side of a place.","kk":"Outside затты қай жерде екенін айтады: орынның сыртқы жағында.","ru":"Outside говорит, где находится предмет: с внешней стороны места."},"ex":{"en":"Aizere is waiting outside the office.","kk":"Мия кеңсенің сыртында күтіп тұр.","ru":"Мия ждёт снаружи у офиса."}},"b":{"label":"out of","p":{"en":"Out of tells us that someone is not in the place.","kk":"Out of біреудің орында жоқ екенін айтады.","ru":"Out of говорит, что человека нет в этом месте."},"ex":{"en":"Aizere is out of the office today.","kk":"Мия бүгін кеңседе жоқ.","ru":"Мии сегодня нет в офисе."}}},{"t":"note","p":{"en":"In North American English you also hear outside of the house and inside of the house. In British English, outside the house and inside the house are the usual forms.","kk":"Солтүстік америкалық ағылшында outside of the house және inside of the house дегенді де естисіз. Британ ағылшынында әдетте outside the house және inside the house айтылады.","ru":"В североамериканском английском также говорят outside of the house и inside of the house. В британском английском обычно outside the house и inside the house."}}]},{"h":{"en":"within","kk":"within","ru":"within"},"blocks":[{"t":"rule","h":{"en":"within = not farther than","kk":"within = одан алыс емес","ru":"within = не дальше чем"},"p":{"en":"Use within for a distance or an area that is not bigger than a limit. You can say within 5 km, within walking distance or within the city walls.","kk":"Белгілі шектен аспайтын қашықтыққа немесе аумаққа within қолданамыз. Within 5 km, within walking distance, within the city walls деп айтуға болады.","ru":"Within используем для расстояния или территории, не превышающих предела: within 5 km, within walking distance, within the city walls."},"ex":[{"en":"There is a bank within 500 metres of the station.","kk":"Вокзалдан 500 метрдің ішінде банк бар.","ru":"В пределах 500 метров от вокзала есть банк."},{"en":"Is it within walking distance?","kk":"Бұл жаяу жететін жерде ме?","ru":"Это в пределах пешей доступности?"},{"en":"The old town lies within the city walls.","kk":"Ескі қала қала қабырғаларының ішінде орналасқан.","ru":"Старый город находится внутри городских стен."}],"pat":"within + distance / area","note":{"en":"Within is more formal than inside. The noise seems to be coming from within the building.","kk":"Within inside сөзіне қарағанда ресмирек. The noise seems to be coming from within the building.","ru":"Within более официально, чем inside. The noise seems to be coming from within the building."}},{"t":"note","p":{"en":"Within 5 km means 5 km or less. For a limit, do not say in 5 km of. You also find within with time (within a week); that belongs to the time lessons.","kk":"Within 5 km – 5 шақырым немесе одан аз. Шек үшін in 5 km of деп айтпаңыз. Within уақытпен де қолданылады (within a week), бұл уақыт сабақтарында қарастырылады.","ru":"Within 5 km — это 5 км или меньше. Для предела не говорите in 5 km of. Within встречается и со временем (within a week), это тема уроков про время."}}]}],"mistakes":[{"bad":"Aizere is out the office today.","good":"Aizere is out of the office today.","note":{"en":"Write out of with both words.","kk":"Out of деп екі сөзді де жазыңыз.","ru":"Пишите out of — оба слова."}},{"bad":"Is there a bank in 500 metres of here?","good":"Is there a bank within 500 metres of here?","note":{"en":"For a distance limit, use within.","kk":"Қашықтық шегі үшін within қолданылады.","ru":"Для предела расстояния используется within."}}],"memory":{"en":"INSIDE = in the box · OUTSIDE = on the outer side of the box · OUT OF = not in the box at all · WITHIN = not more than the limit.","kk":"INSIDE = қораптың ішінде · OUTSIDE = қораптың сыртқы жағында · OUT OF = қорапта мүлде жоқ · WITHIN = шектен аспайды.","ru":"INSIDE = в коробке · OUTSIDE = снаружи коробки · OUT OF = вовсе не в коробке · WITHIN = не больше предела."},"src":["old_inside","old_outside","old_out","old_within","bc_place"],"practice":[{"type":"gap","lv":1,"stem":"The keys are ___ the car. We can see them through the window.","opts":["inside","out of","outside"],"ans":"inside","why":{"en":"We can see them through the window, so the keys are in the car.","kk":"Терезеден көріп тұрмыз, демек, кілттер көліктің ішінде.","ru":"Мы видим их через окно, значит, ключи внутри машины."},"tr":{"kk":"Кілттер көліктің ішінде. Біз оларды терезеден көріп тұрмыз.","ru":"Ключи в машине. Мы видим их через окно."}},{"type":"gap","lv":1,"stem":"It is raining, so the children are playing ___ the house.","opts":["outside","out of","inside"],"ans":"inside","why":{"en":"Because of the rain, the children stay in the house.","kk":"Жаңбыр жауып тұрғандықтан, балалар үйдің ішінде ойнап жатыр.","ru":"Из-за дождя дети играют в доме."},"tr":{"kk":"Жаңбыр жауып тұр, сондықтан балалар үйдің ішінде ойнап жатыр.","ru":"Идёт дождь, поэтому дети играют в доме."}},{"type":"gap","lv":1,"stem":"Luna can't go in. She is waiting ___ the classroom.","opts":["inside","within","outside"],"ans":"outside","why":{"en":"She cannot go in, so she is on the outer side of the classroom.","kk":"Ол кіре алмайды, демек, сыныптың сыртында күтіп тұр.","ru":"Она не может войти, поэтому ждёт снаружи у класса."},"tr":{"kk":"Луна кіре алмайды. Ол сыныптың сыртында күтіп тұр.","ru":"Луна не может войти. Она ждёт снаружи у класса."}},{"type":"scene","lv":1,"sc":"f_out","a":"a","p":"outside","b":"tent","c":null},{"type":"scene","lv":1,"sc":"sp_in","a":"l","p":"inside","b":"sh","c":null},{"type":"gap","lv":2,"stem":"We don't live in Almaty. We live in a small village just ___ the city.","opts":["in","outside","inside"],"ans":"outside","why":{"en":"Just outside means close to the city but not in it.","kk":"Just outside – қалаға жақын, бірақ қаланың ішінде емес дегенді білдіреді.","ru":"Just outside значит «рядом с городом, но не в нём»."},"tr":{"kk":"Біз Алматыда тұрмаймыз. Біз қаланың дәл сыртындағы шағын ауылда тұрамыз.","ru":"Мы живём не в Алматы, а в маленькой деревне сразу за городом."}},{"type":"gap","lv":2,"stem":"Mr Brown is not here. He is ___ town until Friday.","opts":["within","out of","inside"],"ans":"out of","why":{"en":"Out of town means that the person is away from the town.","kk":"Out of town – адам қалада жоқ дегенді білдіреді.","ru":"Out of town значит, что человека нет в городе."},"tr":{"kk":"Браун мырза мұнда жоқ. Ол жұма күніне дейін қалада жоқ.","ru":"Мистера Брауна здесь нет. Его не будет в городе до пятницы."}},{"type":"gap","lv":2,"stem":"Is there a cafe ___ 500 metres of the school?","opts":["in","outside","within"],"ans":"within","why":{"en":"Within 500 metres means 500 metres or less.","kk":"Within 500 metres – 500 метр немесе одан аз.","ru":"Within 500 metres значит 500 метров или меньше."},"tr":{"kk":"Мектептен 500 метрдің ішінде кафе бар ма?","ru":"Есть ли кафе в пределах 500 метров от школы?"}},{"type":"gap","lv":3,"stem":"Most students live ___ 3 km of the university, so they walk to class.","opts":["out of","within","outside"],"ans":"within","why":{"en":"They walk to class, so they live no farther than 3 km away.","kk":"Олар сабаққа жаяу барады, яғни 3 шақырымнан алыс тұрмайды.","ru":"Они ходят на занятия пешком, значит, живут не дальше 3 км."},"tr":{"kk":"Студенттердің көбі университеттен 3 шақырымның ішінде тұрады, сондықтан сабаққа жаяу барады.","ru":"Большинство студентов живёт в пределах 3 км от университета, поэтому ходит на занятия пешком."}},{"type":"scene","lv":2,"sc":"f_intent","a":"t","p":"outside","b":"tent","c":null},{"type":"dialogue","lv":3,"lines":["A: Where is Mr Ali? I need him now.","B: He's ___ the office today. He's at a conference."],"opts":["inside","out of","in"],"ans":"out of","why":{"en":"He is at a conference, so he is not in the office today.","kk":"Ол конференцияда, демек, бүгін кеңседе жоқ.","ru":"Он на конференции, значит, сегодня его нет в офисе."},"tr":{"kk":["A: Әли мырза қайда? Маған ол қазір керек.","B: Ол бүгін кеңседе жоқ. Ол конференцияда."],"ru":["A: Где мистер Али? Он мне нужен прямо сейчас.","B: Сегодня его нет в офисе. Он на конференции."]}},{"type":"fix","lv":3,"stem":"Dexter lives [in] 5 km of the city centre.","wrong":"in","opts":["on","outside","within"],"ans":"within","why":{"en":"For a distance that is not more than a limit, we use within.","kk":"Шектен аспайтын қашықтыққа within қолданамыз.","ru":"Для расстояния, не превышающего предел, используем within."},"tr":{"kk":"Декстер қала орталығынан 5 шақырымның ішінде тұрады.","ru":"Декстер живёт в пределах 5 км от центра города."}}]}],"integrated":[{"type":"passage","lv":4,"text":"My cousin lives ___(1) Astana. Her flat is ___(2) the fifth floor. The park is ___(3) her building, on the other side of the street. A bakery is ___(4) the bank and the pharmacy. She waits for the bus ___(5) the bus stop in front of the park.","gaps":[{"opts":["in","on","at"],"ans":"in","why":{"en":"A city is a big space, so in.","kk":"Қала – үлкен кеңістік, сондықтан in.","ru":"Город — большое пространство, поэтому in."}},{"opts":["on","in","at"],"ans":"on","why":{"en":"We use on with floors.","kk":"Қабаттармен on қолданылады.","ru":"С этажами используется on."}},{"opts":["behind","opposite","under"],"ans":"opposite","why":{"en":"The other side of the street means opposite.","kk":"Көшенің қарсы жағы – opposite.","ru":"Другая сторона улицы — opposite."}},{"opts":["between","above","among"],"ans":"between","why":{"en":"Two named places: between the bank and the pharmacy.","kk":"Аталған екі орын: between the bank and the pharmacy.","ru":"Два названных места: between the bank and the pharmacy."}},{"opts":["at","in","on"],"ans":"at","why":{"en":"A bus stop is a point, so at.","kk":"Аялдама – нүкте, сондықтан at.","ru":"Остановка — точка, поэтому at."}}],"tr":{"kk":"Менің туысым Астанада тұрады. Оның пәтері бесінші қабатта. Саябақ оның үйінің қарсы бетінде, көшенің екінші жағында. Наубайхана банк пен дәріхананың арасында. Ол саябақтың алдындағы автобус аялдамасында автобусты күтеді.","ru":"Моя двоюродная сестра живёт в Астане. Её квартира на пятом этаже. Парк напротив её дома, на другой стороне улицы. Пекарня находится между банком и аптекой. Она ждёт автобус на остановке перед парком."}},{"type":"passage","lv":4,"text":"There is a map ___(1) the wall ___(2) my bed. My desk is ___(3) the window, so I can see the garden. My cat sleeps ___(4) my bed, on the floor.","gaps":[{"opts":["on","in","at"],"ans":"on","why":{"en":"A map touches the surface of a wall, so on.","kk":"Карта қабырғаның бетіне тиіп тұр, сондықтан on.","ru":"Карта касается поверхности стены, поэтому on."}},{"opts":["above","between","under"],"ans":"above","why":{"en":"The map is higher than the bed, so above.","kk":"Карта кереуеттен биік, сондықтан above.","ru":"Карта выше кровати, поэтому above."}},{"opts":["among","next to","between"],"ans":"next to","why":{"en":"The desk is at the side of the window, so next to.","kk":"Үстел терезенің қасында, сондықтан next to.","ru":"Стол рядом с окном, поэтому next to."}},{"opts":["above","over","under"],"ans":"under","why":{"en":"On the floor, below the bed, means under.","kk":"Еденде, кереуеттің астында – under.","ru":"На полу, ниже кровати, значит under."}}],"tr":{"kk":"Қабырғада менің кереуетімнің үстінде карта ілулі тұр. Менің жазу үстелім терезенің қасында, сондықтан бақшаны көремін. Мысығым еденде, менің кереуетімнің астында ұйықтайды.","ru":"На стене над моей кроватью висит карта. Мой стол стоит рядом с окном, поэтому я вижу сад. Моя кошка спит под моей кроватью, на полу."}},{"type":"gap","lv":4,"stem":"She sat ___ me at dinner, so we could look at each other across the table.","opts":["beside","behind","opposite"],"ans":"opposite","why":{"en":"Across the table, looking at each other, means opposite.","kk":"Үстелдің арғы жағында бір-біріне қарау – opposite.","ru":"Через стол, лицом друг к другу, значит opposite."},"tr":{"kk":"Ол кешкі асқа менің қарсымда отырды, сондықтан біз үстелдің арғы жағынан бір-бірімізге қарай алдық.","ru":"За ужином она сидела напротив меня, так что мы могли смотреть друг на друга через стол."}},{"type":"gap","lv":4,"stem":"The village is 1,500 metres ___ sea level.","opts":["below","beside","above"],"ans":"above","why":{"en":"A fixed level of height is expressed with above.","kk":"Тұрақты биіктік деңгейі above арқылы айтылады.","ru":"Фиксированный уровень высоты выражается через above."},"tr":{"kk":"Ауыл теңіз деңгейінен 1 500 метр биікте.","ru":"Деревня находится на высоте 1 500 метров над уровнем моря."}},{"type":"gap","lv":4,"stem":"The cat is hiding ___ the sofa, so you can't see it from the door.","opts":["within","behind","between"],"ans":"behind","why":{"en":"Something at the back of the sofa is hidden from the door.","kk":"Диванның артындағы нәрсе есіктен көрінбейді.","ru":"То, что за диваном, не видно от двери."},"tr":{"kk":"Мысық диванның артына тығылған, сондықтан оны есіктен көре алмайсың.","ru":"Кошка спряталась за диваном, поэтому её не видно от двери."}},{"type":"gap","lv":4,"stem":"There are four cafes ___ 300 metres of the school.","opts":["among","around","within"],"ans":"within","why":{"en":"Within 300 metres means 300 metres or less.","kk":"Within 300 metres – 300 метр немесе одан аз.","ru":"Within 300 metres значит 300 метров или меньше."},"tr":{"kk":"Мектептен 300 метрдің ішінде төрт кафе бар.","ru":"В пределах 300 метров от школы есть четыре кафе."}},{"type":"gap","lv":4,"stem":"The children are sitting ___ the fire, listening to a story.","opts":["against","around","beyond"],"ans":"around","why":{"en":"The children are on all sides of the fire, so around.","kk":"Балалар оттың айналасында отыр, сондықтан around.","ru":"Дети сидят вокруг костра, поэтому around."},"tr":{"kk":"Балалар отты айнала отырып, ертегі тыңдап отыр.","ru":"Дети сидят вокруг костра и слушают рассказ."}}],"sources":{"bc_place":["British Council LearnEnglish: Prepositions of place (A1-A2)","https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar/prepositions-place"],"bc_adv":["British Council LearnEnglish: Adverbials of location (reference)","https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference/adverbials-location"],"old_at":["Oxford Learner's Dictionaries: at","https://www.oxfordlearnersdictionaries.com/definition/english/at?q=at"],"old_on":["Oxford Learner's Dictionaries: on","https://www.oxfordlearnersdictionaries.com/definition/english/on_1"],"old_corner":["Oxford Learner's Dictionaries: corner","https://www.oxfordlearnersdictionaries.com/definition/english/corner_1"],"old_street":["Oxford Learner's Dictionaries: street","https://www.oxfordlearnersdictionaries.com/definition/english/street_1"],"old_floor":["Oxford Learner's Dictionaries: floor","https://www.oxfordlearnersdictionaries.com/definition/english/floor_1"],"old_top":["Oxford Learner's Dictionaries: top","https://www.oxfordlearnersdictionaries.com/definition/english/top_1"],"blog_street":["Not One-Off Britishisms: in the street (British) vs on the street (American)","https://notoneoffbritishisms.com/2017/06/04/in-the-street/"],"old_inside":["Oxford Learner's Dictionaries: inside","https://www.oxfordlearnersdictionaries.com/definition/english/inside_1"],"old_outside":["Oxford Learner's Dictionaries: outside","https://www.oxfordlearnersdictionaries.com/definition/english/outside_2"],"old_out":["Oxford Learner's Dictionaries: out (out of)","https://www.oxfordlearnersdictionaries.com/definition/english/out_1"],"old_within":["Oxford Learner's Dictionaries: within","https://www.oxfordlearnersdictionaries.com/definition/english/within_1"],"old_above":["Oxford Learner's Dictionaries: above (with Which Word? above/over)","https://www.oxfordlearnersdictionaries.com/definition/english/above_1"],"old_over":["Oxford Learner's Dictionaries: over","https://www.oxfordlearnersdictionaries.com/definition/english/over"],"old_under":["Oxford Learner's Dictionaries: under","https://www.oxfordlearnersdictionaries.com/definition/english/under_1"],"old_below":["Oxford Learner's Dictionaries: below (preposition)","https://www.oxfordlearnersdictionaries.com/definition/english/below_2"],"old_underneath":["Oxford Learner's Dictionaries: underneath","https://www.oxfordlearnersdictionaries.com/definition/english/underneath_1"],"old_beneath":["Oxford Learner's Dictionaries: beneath","https://www.oxfordlearnersdictionaries.com/definition/english/beneath"],"old_front":["Oxford Learner's Dictionaries: front (in front of; at/in the front of; Which Word?)","https://www.oxfordlearnersdictionaries.com/definition/english/front_1"],"old_behind":["Oxford Learner's Dictionaries: behind","https://www.oxfordlearnersdictionaries.com/definition/english/behind_1"],"old_opposite":["Oxford Learner's Dictionaries: opposite (preposition)","https://www.oxfordlearnersdictionaries.com/definition/english/opposite_3"],"old_across":["Oxford Learner's Dictionaries: across (preposition)","https://www.oxfordlearnersdictionaries.com/definition/english/across_1"],"old_across_adv":["Oxford Learner's Dictionaries: across (adverb, across from)","https://www.oxfordlearnersdictionaries.com/definition/english/across_2"],"old_nextto":["Oxford Learner's Dictionaries: next to","https://www.oxfordlearnersdictionaries.com/definition/english/next-to"],"old_beside":["Oxford Learner's Dictionaries: beside","https://www.oxfordlearnersdictionaries.com/definition/english/beside"],"old_near":["Oxford Learner's Dictionaries: near","https://www.oxfordlearnersdictionaries.com/definition/english/near"],"old_by":["Oxford Learner's Dictionaries (American English): by","https://www.oxfordlearnersdictionaries.com/definition/american_english/by_1"],"old_nextdoor":["Oxford Learner's Dictionaries: next door (adverb)","https://www.oxfordlearnersdictionaries.com/definition/english/next-door_2"],"mw_close":["Merriam-Webster: close","https://www.merriam-webster.com/dictionary/close"],"old_between":["Oxford Learner's Dictionaries: between","https://www.oxfordlearnersdictionaries.com/definition/english/between_1"],"old_among":["Oxford Learner's Dictionaries: among","https://www.oxfordlearnersdictionaries.com/definition/english/among"],"mw_between":["Merriam-Webster: Between vs. Among","https://www.merriam-webster.com/grammar/between-among"],"old_around":["Oxford Learner's Dictionaries: around","https://www.oxfordlearnersdictionaries.com/definition/english/around"],"old_against":["Oxford Learner's Dictionaries: against","https://www.oxfordlearnersdictionaries.com/definition/english/against?q=against"],"mw_against":["Merriam-Webster: against","https://www.merriam-webster.com/dictionary/against"],"old_beyond":["Oxford Learner's Dictionaries: beyond","https://www.oxfordlearnersdictionaries.com/definition/english/beyond_1"]},"inventory":[{"prep":"in","meaning":"inside a bigger space (room, city, country, car, taxi, water, sky, picture, bed)","patterns":["in the kitchen","in Astana","in a taxi","in the sky","in bed"],"lesson":"place-in-on-at","source":"bc_place"},{"prep":"on","meaning":"surface, line, public transport, floors, left/right","patterns":["on the wall","on the bus","on the third floor","on the left"],"lesson":"place-in-on-at","source":"old_on"},{"prep":"at","meaning":"point, activity place, address, top/bottom/end","patterns":["at home","at the bus stop","at 15 Craig Street","at the top of"],"lesson":"place-in-on-at","source":"old_at"},{"prep":"in / on / at","meaning":"corner (inside vs street corner); street UK vs US; floor numbering UK vs US","patterns":["in the corner of the room","on/at the corner of the street","in/on the street"],"lesson":"place-in-on-at","source":"old_corner"},{"prep":"in vs inside","meaning":"inside = inner part, opposite of outside; inside of (NAmE)","patterns":["inside the house","inside of the house"],"lesson":"place-inside-outside-within","source":"old_inside"},{"prep":"outside","meaning":"on the outer side; just outside a town; outside of (NAmE)","patterns":["outside the tent","just outside Leeds"],"lesson":"place-inside-outside-within","source":"old_outside"},{"prep":"out of","meaning":"away from the inside; not at home/work (out of town/office)","patterns":["out of town","out of the office","out of the pool"],"lesson":"place-inside-outside-within","source":"old_out"},{"prep":"within","meaning":"not farther than a distance; inside limits/area (formal)","patterns":["within 500 metres","within walking distance","within the city walls"],"lesson":"place-inside-outside-within","source":"old_within"},{"prep":"above","meaning":"higher, no contact; fixed level or scale","patterns":["above the clouds","above sea level","above zero"],"lesson":"place-above-below-under","source":"old_above"},{"prep":"over","meaning":"straight above; covering; across / other side","patterns":["a lamp over the table","a blanket over the child","over the wall"],"lesson":"place-above-below-under","source":"old_over"},{"prep":"under","meaning":"below, often right beneath, covered","patterns":["under the bed","under the chair"],"lesson":"place-above-below-under","source":"old_under"},{"prep":"below","meaning":"lower level or position; scale (below zero, below average); rank","patterns":["below this line","below freezing"],"lesson":"place-above-below-under","source":"old_below"},{"prep":"underneath","meaning":"under, esp. hidden or covered","patterns":["underneath the piano"],"lesson":"place-above-below-under","source":"old_underneath"},{"prep":"beneath","meaning":"formal under","patterns":["beneath the waves"],"lesson":"place-above-below-under","source":"old_beneath"},{"prep":"in front of","meaning":"further forward, not far; in the presence of","patterns":["in front of the house","in front of the children"],"lesson":"place-front-behind-opposite","source":"old_front"},{"prep":"behind","meaning":"at the back of, often hidden","patterns":["behind the clouds","behind Jan"],"lesson":"place-front-behind-opposite","source":"old_behind"},{"prep":"opposite / across from","meaning":"on the other side, facing","patterns":["opposite the supermarket","across from our house"],"lesson":"place-front-behind-opposite","source":"old_opposite"},{"prep":"at/in the front/back of","meaning":"front or back part inside a place","patterns":["at the front of the bus","in the front of the car"],"lesson":"place-front-behind-opposite","source":"old_front"},{"prep":"next to / beside","meaning":"side by side, right beside","patterns":["next to each other","beside the stream"],"lesson":"place-next-to-near-by","source":"old_nextto"},{"prep":"near / close to","meaning":"short distance, not touching","patterns":["near Glasgow","close to the university"],"lesson":"place-next-to-near-by","source":"old_near"},{"prep":"by","meaning":"near, at the side of","patterns":["by the window","a house by the river"],"lesson":"place-next-to-near-by","source":"old_by"},{"prep":"next door","meaning":"in the next house/flat/room; next-door (adjective)","patterns":["next door to the bank","next-door neighbours"],"lesson":"place-next-to-near-by","source":"old_nextdoor"},{"prep":"between","meaning":"in the space separating two or more named things","patterns":["between Jo and Diana"],"lesson":"place-between-among-around","source":"old_between"},{"prep":"among","meaning":"surrounded by, in the middle of a group","pat const PDEF={"in":{"def":{"en":"Inside a space or a container: a room, a box, a city, water.","kk":"Бөлме, қорап, қала, су сияқты кеңістіктің ішінде.","ru":"Внутри пространства или вместилища: комната, коробка, город, вода."},"word":{"kk":"ішінде","ru":"в"},"note":{"en":"Use in for rooms, boxes, cities and water. For the top of a flat thing, use on.","kk":"Бөлме, қорап, қала мен су үшін in қолданылады. Жалпақ заттың беті үшін on қолданылады.","ru":"In — для комнат, коробок, городов и воды. Для верхней поверхности используйте on."}},"inside":{"def":{"en":"In the inner part of something. It is the opposite of outside.","kk":"Бір нәрсенің ішкі бөлігінде. Қарама-қарсысы — outside.","ru":"Во внутренней части чего-либо. Противоположное слово — outside."},"word":{"kk":"ішінде","ru":"внутри"},"note":{"en":"In and inside are often very close in meaning. Inside is the clear opposite of outside.","kk":"In және inside мағынасы жиі өте жақын. Inside — outside сөзінің нақты қарама-қарсысы.","ru":"In и inside часто очень близки по смыслу. Inside — прямая противоположность outside."}},"outside":{"def":{"en":"Not in a place, but on its outer side.","kk":"Орынның ішінде емес, оның сыртқы жағында.","ru":"Не внутри места, а с его внешней стороны."},"word":{"kk":"сыртында","ru":"снаружи"},"note":{"en":"Outside is the opposite of inside.","kk":"Outside — inside сөзінің қарама-қарсысы.","ru":"Outside — противоположность inside."}},"on":{"def":{"en":"Touching a surface, usually its top: on the table.","kk":"Бетке тиіп тұр, көбіне үстінде: on the table.","ru":"Касается поверхности, чаще всего сверху: on the table."},"word":{"kk":"үстінде","ru":"на"},"note":{"en":"On means touching a surface. If it is higher and not touching, use above.","kk":"On — бетке тиіп тұр. Жоғарырақ, бірақ тимесе — above.","ru":"On — касается поверхности. Если выше и не касается — above."}},"under":{"def":{"en":"Lower than something, often with something directly above it.","kk":"Бір нәрседен төмен, көбіне дәл үстінде бір зат тұрады.","ru":"Ниже чего-либо; обычно прямо над ним что-то находится."},"word":{"kk":"астында","ru":"под"},"note":{"en":"Under is lower. On is touching the top.","kk":"Under — төменде. On — үстіне тиіп тұр.","ru":"Under — ниже. On — на самом верху, с касанием."}},"above":{"def":{"en":"Higher than something. It does not touch it.","kk":"Бір нәрседен биік. Оған тимейді.","ru":"Выше чего-либо. Не касается его."},"word":{"kk":"жоғарыда","ru":"над, выше"},"note":{"en":"Above and over can both mean higher. Only over also shows movement across something.","kk":"Above және over екеуі де «жоғары» дегенді білдіре алады. Тек over бір нәрсенің үстінен өтуді де көрсетеді.","ru":"Above и over оба могут значить «выше». Только over ещё показывает движение через что-то."}},"over":{"def":{"en":"Higher than something, not touching it. Also: from one side to the other.","kk":"Бір нәрседен биік, оған тимейді. Сондай-ақ: бір жағынан екінші жағына өту.","ru":"Выше чего-либо, не касаясь. Также: с одной стороны на другую."},"word":{"kk":"үстінен","ru":"над, через"},"note":{"en":"Jump over a log = from one side to the other. Over can also mean covering something.","kk":"Бөренеден секіру — бір жағынан екінші жағына өту. Over жабуды да білдіре алады.","ru":"Прыгнуть через бревно — с одной стороны на другую. Over также может значить «накрывать»."}},"below":{"def":{"en":"At a lower level than something.","kk":"Бір нәрседен төмен деңгейде.","ru":"На более низком уровне, чем что-то."},"word":{"kk":"төменде","ru":"ниже"},"note":{"en":"Below means lower. Under usually means right beneath, closer to the thing.","kk":"Below — төменірек. Under әдетте дәл астында, затқа жақын дегенді білдіреді.","ru":"Below — ниже. Under обычно значит «прямо под», ближе к предмету."}},"beneath":{"def":{"en":"A formal word for under.","kk":"Under сөзінің ресми баламасы.","ru":"Более формальное слово для under."},"word":{"kk":"астында","ru":"под"},"note":{"en":"Beneath is formal. In everyday speech, people usually say under.","kk":"Beneath — ресми сөз. Күнделікті сөйлеуде әдетте under айтылады.","ru":"Beneath — формальное слово. В повседневной речи обычно говорят under."}},"infront":{"def":{"en":"At the front of something, or ahead of it.","kk":"Бір нәрсенің алдыңғы жағында.","ru":"Перед чем-либо, с его передней стороны."},"word":{"kk":"алдында","ru":"перед"},"note":{"en":"In front of is the opposite of behind.","kk":"In front of — behind сөзінің қарама-қарсысы.","ru":"In front of — противоположность behind."}},"behind":{"def":{"en":"At the back of something, often hidden by it.","kk":"Бір нәрсенің артқы жағында, көбіне сол зат оны жасырады.","ru":"С задней стороны чего-либо, часто скрыт им."},"word":{"kk":"артында","ru":"за"},"note":{"en":"Behind is near the back of the thing. It is not part of it.","kk":"Behind — заттың артқы жағының жанында. Ол заттың бөлігі емес.","ru":"Behind — у задней стороны предмета. Это не часть предмета."}},"nextto":{"def":{"en":"Right beside something.","kk":"Дәл қасында.","ru":"Прямо рядом с чем-либо."},"word":{"kk":"жанында","ru":"рядом с"},"note":{"en":"Next to means right beside. Near is not so close.","kk":"Next to — дәл қасында. Near — онша жақын емес.","ru":"Next to — вплотную рядом. Near — не так близко."}},"beside":{"def":{"en":"Next to or at the side of something.","kk":"Бір нәрсенің қасында немесе бір жағында.","ru":"Рядом с чем-либо или сбоку от него."},"word":{"kk":"қасында","ru":"возле"},"note":{"en":"Beside = next to. Do not confuse it with besides, which means “also”.","kk":"Beside = next to. Besides («сонымен қатар») сөзімен шатастырмаңыз.","ru":"Beside = next to. Не путайте с besides («кроме того»)."}},"near":{"def":{"en":"A short distance from something.","kk":"Бір нәрседен аз қашықтықта.","ru":"На небольшом расстоянии от чего-либо."},"word":{"kk":"жақын","ru":"около, недалеко от"},"note":{"en":"Near has a small space between. Next to has almost none.","kk":"Near-де аздаған қашықтық бар. Next to-да қашықтық жоқтың қасы.","ru":"У near есть небольшое расстояние. У next to — почти нет."}},"between":{"def":{"en":"In the space that separates two things.","kk":"Екі затты бөліп тұрған кеңістікте.","ru":"В пространстве, которое разделяет два предмета."},"word":{"kk":"арасында (екі заттың)","ru":"между"},"note":{"en":"Use between for two named things.","kk":"Between екі аталған зат үшін қолданылады.","ru":"Between — для двух названных предметов."}},"among":{"def":{"en":"Surrounded by many things; in the middle of them.","kk":"Көп заттың қоршауында; олардың ортасында.","ru":"В окружении многих предметов; посреди них."},"word":{"kk":"ортасында (көптің)","ru":"среди"},"note":{"en":"Simple rule: between for two things, among for a group. Native speakers sometimes use between for more than two, so this is a helpful simplification.","kk":"Қарапайым ереже: екі зат — between, топ — among. Ағылшын тілін білетіндер кейде between-ді екіден көп зат үшін де қолданады, сондықтан бұл ыңғайлы жеңілдету.","ru":"Простое правило: между двумя — between, среди группы — among. Носители иногда используют between и для более чем двух, так что это удобное упрощение."}},"into":{"def":{"en":"Movement to a position inside something.","kk":"Бір нәрсенің ішіне қарай қозғалыс.","ru":"Движение внутрь чего-либо."},"word":{"kk":"ішіне","ru":"в, внутрь"},"note":{"en":"In shows where something is. Into shows the movement to the inside.","kk":"In — заттың қайда екенін көрсетеді. Into — ішке қарай қозғалысты көрсетеді.","ru":"In показывает, где предмет. Into показывает движение внутрь."}},"onto":{"def":{"en":"Movement to the top of something.","kk":"Бір нәрсенің үстіне қарай қозғалыс.","ru":"Движение на верхнюю поверхность чего-либо."},"word":{"kk":"үстіне","ru":"на (поверхность)"},"note":{"en":"On shows where something is. Onto shows the movement up to the top. People also say “on” for this.","kk":"On — заттың қайда екенін көрсетеді. Onto — үстіне қарай қозғалысты көрсетеді. Мұнда on да айтылады.","ru":"On показывает, где предмет. Onto показывает движение наверх. Иногда для этого говорят и просто on."}},"out of":{"def":{"en":"Movement away from the inside of something.","kk":"Бір нәрсенің ішінен сыртқа қарай қозғалыс.","ru":"Движение прочь из внутренней части чего-либо."},"word":{"kk":"ішінен","ru":"из"},"note":{"en":"Out of is the opposite of into.","kk":"Out of — into сөзінің қарама-қарсысы.","ru":"Out of — противоположность into."}}};

/* ===== Sentences and question building (all truth comes from geometry) ===== */
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
function nameOf(sc,id){ return sc.get(id).name; }
function sentence(scId,a,p,b,c,verb){
  const sc=SC[scId], A=cap(nameOf(sc,a));
  let B = p==='among' && sc.amongName ? sc.amongName : nameOf(sc,b);
  if(c) B += ' and '+nameOf(sc,c);
  if(MOVE.includes(p)){ const v = verb || (p==='out of'?'coming':'going'); return `${A} is ${v} ${PH[p]} ${B}.`; }
  return `${A} is ${PH[p]} ${B}.`;
}
function trueSet(sc,a,b,c,pool){ return pool.filter(p=>rel(sc,sc.get(a),p,sc.get(b),c?sc.get(c):null)); }
function syns(p){ const out=new Set([p]); SYN.forEach(g=>{ if(g.includes(p)) g.forEach(x=>out.add(x)); }); if(p==='on'){out.add('above');out.add('over');} return out; }
function pickBad(sc,a,p,b,c,pool,n){
  const tr=trueSet(sc,a,b,c,MOVE.includes(p)?MOVE:Object.keys(PH)); const ban=new Set(); [p,...tr].forEach(t=>syns(t).forEach(x=>ban.add(x)));
  const cont=id=>{ const m=sc.get(id).meta; return !!(m&&m.cont); };
  const sensible=(x,id)=>{ if(['in','inside','into','out of','outside'].includes(x)&&!cont(id)) return false; if(x==='onto'&&!(sc.get(id).meta&&sc.get(id).meta.deck!=null)) return false; return true; };
  let cand=pool.filter(x=>!ban.has(x) && MOVE.includes(x)===MOVE.includes(p) && sensible(x,b)).filter(x=>x!=='between'||c).filter(x=>x!=='among'||p==='among')
    .map(x=>({p:x,b,c}));
  if(MOVE.includes(p)){ sc.items.filter(o=>o.id!==a&&o.id!==b).forEach(o=>MOVE.forEach(x=>{ if(sensible(x,o.id)&&!rel(sc,sc.get(a),x,o,null)) cand.push({p:x,b:o.id}); })); }
  return shuffle(cand).slice(0,n);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Questions ---------- */
const fill=(s,a)=>a==='–'?s.replace(/ ?___ ?/,' ').replace(/ +/g,' ').replace(/ ([.,?!])/g,'$1'):s.replace('___',a);
function sceneQ(q){ // build a gap question from a validated picture
  q=Object.assign({},q); if(q.p==='among'&&String(q.b).includes('+')) q.b=SC[q.sc].among[0];
  const sc=SC[q.sc], pool=MOVE.includes(q.p)?MOVE:Object.keys(PH);
  const bad=pickBad(sc,q.a,q.p,q.b,q.c,pool,2).filter(x=>x.b===q.b);
  if(bad.length<2){ /* top up to 3 options with scene-validated false words (never a true or synonymous one) */
    const have=new Set([q.p,...bad.map(x=>x.p)]), ban=new Set(); [q.p,...trueSet(sc,q.a,q.b,q.c,pool)].forEach(t=>syns(t).forEach(x=>ban.add(x)));
    const extra=shuffle(pool.filter(x=>!ban.has(x)&&!have.has(x)&&(x!=='between'||q.c)&&(x!=='among'||q.p==='among')));
    while(bad.length<2&&extra.length) bad.push({p:extra.shift(),b:q.b,c:q.c}); }
  if(!rel(sc,sc.get(q.a),q.p,sc.get(q.b),q.c?sc.get(q.c):null)) throw new Error('scene fact false '+q.sc);
  const verb=MOVE.includes(q.p)?(q.p==='out of'?'coming':(q.verb||'going')):null;
  const B=(q.p==='among'&&sc.amongName)?sc.amongName:nameOf(sc,q.b)+(q.c?' and '+nameOf(sc,q.c):'');
  const stem=`${cap(nameOf(sc,q.a))} is ${verb?verb+' ':''}___ ${B}.`;
  const d=PDEF[q.p]; const why=d?{en:`${PH[q.p]}: ${d.def.en}`,kk:`${PH[q.p]} (${d.word.kk}): ${d.def.kk}`,ru:`${PH[q.p]} (${d.word.ru}): ${d.def.ru}`}:{en:PH[q.p],kk:PH[q.p],ru:PH[q.p]};
  return {type:'scene',lv:q.lv,scene:sc,ringA:q.a,ringB:q.p==='among'?null:q.b,stem,opts:[PH[q.p],...bad.map(x=>PH[x.p])],ans:PH[q.p],why,tr:null};
}
/* options are stored with the key first; shuffle once per question so the answer position is not predictable ('–' stays last) */
const shufO=a=>{ const s=shuffle(a); const i=s.indexOf('–'); if(i>=0){ s.splice(i,1); s.push('–'); } return s; };
function shufOpts(r){
  if(r.type==='compare'){ const a=r.opts[r.ans]; r.opts=shuffle(r.opts); r.ans=r.opts.indexOf(a); }
  else if(r.type==='passage'){ r.gaps.forEach(g=>{ g.opts=shufO(g.opts); }); }
  else if(r.opts) r.opts=shufO(r.opts);
  return r;
}
function normQ(q,lesson){
  let r=q.type==='scene'?sceneQ(q):JSON.parse(JSON.stringify(q)); r._id=q._id; r.lesson=lesson.id; r.cat=lesson.cat.id; return shufOpts(r);
}
function sentenceOf(q){
  switch(q.type){ case 'gap': case 'scene': return fill(q.stem,q.ans); case 'dialogue': return q.lines.map(l=>fill(l,q.ans)).join(' ');
   case 'fix': return q.stem.replace(/\[[^\]]+\]/,q.ans); case 'compare': return q.opts[q.ans];
   case 'passage': { let t=q.text; q.gaps.forEach((g,i)=>{ t=t.replace(`___(${i+1})`,g.ans); }); return t; } }
  return '';
}
function trOf(q){ if(!q.tr||LANG==='en') return ''; const v=q.tr[LANG]; if(!v) return ''; if(Array.isArray(v)) return q.type==='compare'?v[q.ans]:v.join(' '); return v; }
const blankHTML=s=>esc(s).replace('___','<span class="blank">___</span>');
const optBtns=(opts,cls)=>`<div class="opts ${opts.length>3?'four':''}">${opts.map((o,k)=>`<button class="opt ${cls||''}" data-k="${k}" type="button"><span class="ol">${'ABCD'[k]}</span><span class="ov">${o==='–'?'– (no word)':esc(o)}</span></button>`).join('')}</div>`;
function picBox(q){ const sp=PICS[q._id]; if(!sp) throw new Error('no picture for '+q._id); const sc=mkPic(sp); return `<div class="stage pstage" data-qid="${q._id}">${picSVG(sc,{alt:sp.alt})}<div class="pcap" aria-live="polite"></div></div>`; }
function qBody(q){
  switch(q.type){
   case 'gap': return picBox(q)+`<p class="stem">${blankHTML(q.stem)}</p>${optBtns(q.opts)}`;
   case 'scene': return `<div class="stage">${sceneSVG(q.scene,{alt:'Scene',ring:[{id:q.ringA,c:'a'}].concat(q.ringB?[{id:q.ringB,c:'b'}]:[])})}</div><p class="stem">${blankHTML(q.stem)}</p>${optBtns(q.opts)}`;
   case 'dialogue': return picBox(q)+`<div class="dlg">${q.lines.map((l,i)=>`<div class="bub ${i%2?'r':'l'}">${blankHTML(l)}</div>`).join('')}</div>${optBtns(q.opts)}`;
   case 'fix': return picBox(q)+`<p class="hintq">One preposition is wrong. Choose the correct one.</p><p class="stem">${esc(q.stem).replace(/\[([^\]]+)\]/,'<span class="wrongw">$1</span>')}</p>${optBtns(q.opts)}`;
   case 'compare': return picBox(q)+`<p class="hintq">${esc(q.ask.en)}</p>${tr(q.ask)?`<p class="ls-trs" lang="${LANG}">${esc(q.ask[LANG])}</p>`:''}<div class="cmpopts">${q.opts.map((o,k)=>`<button class="opt wide" data-k="${k}" type="button"><span class="ol">${'AB'[k]}</span><span class="ov">${esc(o)}</span></button>`).join('')}</div>`;
   case 'passage': return picBox(q)+`<p class="hintq">Choose the correct word for each gap.</p><p class="passage">${esc(q.text).replace(/___\((\d)\)/g,(m,n)=>`<span class="pgap" data-g="${n}">${n}</span>`)}</p>${q.gaps.map((g,i)=>`<div class="pg" data-g="${i}"><span class="pgn">${i+1}</span>${g.opts.map((o,k)=>`<button class="opt small" data-g="${i}" data-k="${k}" type="button">${esc(o)}</button>`).join('')}</div>`).join('')}`;
  }
}
/* ---------- recorded sentence audio (practice only) ---------- */
let AUD={}; try{ AUD=JSON.parse(document.getElementById('aud').textContent)||{}; }catch(e){ AUD={}; }
function fnv(s){ let x=0x811c9dc5; for(let i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,0x01000193)>>>0; } return ('00000000'+x.toString(16)).slice(-8); }
function audKeys(text){ const k=fnv(text); if(AUD[k]) return [k]; const ks=[]; for(let i=0;AUD[k+'_'+i];i++) ks.push(k+'_'+i); return ks; }
let CUR=null, PQ=0;
function audBtnState(on){ const b=$('#audbtn'); if(b) b.classList.toggle('on',!!on); }
function stopAud(){ PQ++; if(CUR){ try{ CUR.pause(); }catch(e){} CUR=null; } audBtnState(false); }
function playAud(text){
  const ks=audKeys(text); if(!ks.length) return false; stopAud(); const my=PQ; let i=0; audBtnState(true);
  const done=()=>{ if(my===PQ){ CUR=null; audBtnState(false); } };
  const next=()=>{ if(my!==PQ) return; if(i>=ks.length) return done();
    try{ const a=new Audio(AUD[ks[i++]]); CUR=a; a.onended=()=>{ if(i<ks.length) setTimeout(next,380); else done(); }; a.onerror=done; const pr=a.play(); if(pr&&pr.catch) pr.catch(done); }catch(e){ done(); } };
  next(); return true;
}
const audBtn=t=>audKeys(t).length?`<button class="speak aud" id="audbtn" type="button" aria-label="Listen again" title="Listen again">${IC.spk}</button>`:'';
let S=null;
function startSession(key,title,qs,back,meta){
  S={key,title,qs,i:0,res:[],back,meta,locked:false}; renderQ();
}
function renderQ(){
  stopAud(); const q=S.qs[S.i], n=S.qs.length; S.locked=false;
  const lessonTitle=LBY[q.lesson]?LBY[q.lesson].title.en:'';
  $('#app').innerHTML=`<header class="top game"><a class="icon-btn" href="${S.back}" aria-label="Back">${IC.back}</a><div class="gt"><b role="heading" aria-level="1">${esc(S.title)}</b><small>Question ${S.i+1} of ${n}</small></div><div class="ls-seg mini" role="group" aria-label="Translation">${LANGS.map(([k,nm])=>`<button data-tr="${k}" lang="${k}" aria-pressed="${LANG===k}">${k==='en'?'EN':k==='kk'?'ҚАЗ':'РУС'}</button>`).join('')}</div></header>
   <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><span style="width:${S.i/n*100}%"></span></div>
   <main id="main" tabindex="-1" class="gmain"><div class="qbox"><p class="qtag">${esc(lessonTitle)}${q.lv?` · level ${q.lv}`:''}</p>${qBody(q)}<div id="fb" class="fb" role="status" aria-live="polite"></div></div></main>`;
  $$('[data-tr]').forEach(b=>b.onclick=()=>{ LANG=b.dataset.tr; try{localStorage.setItem(LKEY,LANG);}catch(e){} const fbh=$('#fb').innerHTML; if(S.locked){ showFb(q,S.lastOk); } else renderQ(); $$('[data-tr]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tr===LANG)); if(S.locked) {} });
  bindQ(q); bindPic();
  const mn=$('#main'); if(mn) mn.focus({preventScroll:true}); /* keep keyboard / screen-reader focus inside the new question */
}
function bindPic(){
  const st=$('.pstage'); if(!st) return; const cap=$('.pcap',st);
  $$('.hot',st).forEach(h=>{ const go=()=>{ const id=h.dataset.id, g=$(`.it[data-id="${id}"]`,st); if(g){ g.classList.remove('tap'); void g.getBoundingClientRect(); g.classList.add('tap'); } cap.textContent=h.getAttribute('aria-label'); cap.classList.add('on'); clearTimeout(cap._t); cap._t=setTimeout(()=>cap.classList.remove('on'),1800); };
    h.addEventListener('click',go); h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }); });
}
function reactPic(ok){
  const st=$('.pstage'); if(!st) return; st.classList.add(ok?'is-ok':'is-no');
  $$('.it.mas',st).forEach((g,i)=>{ g.style.animationDelay=(i*90)+'ms'; g.classList.add(ok?'cheer':'oops'); });
  if(ok){ const ov=$('.ov',st); if(ov){ let b=''; for(let i=0;i<14;i++){ const a=i/14*6.283, r=70+Math.random()*90; b+=`<circle class="spk" cx="500" cy="270" r="${4+Math.random()*5}" style="--dx:${Math.cos(a)*r*2.2}px;--dy:${Math.sin(a)*r*1.1-40}px;animation-delay:${i*18}ms" fill="${['#ffc83d','#2fb6a8','#a98be6','#ff8f4a'][i%4]}"/>`; } ov.innerHTML=b; } }
}
function showFb(q,ok){
  const fb=$('#fb'); const full=sentenceOf(q), t=trOf(q);
  let why='';
  if(q.type==='passage') why=`<ul class="whys">${q.gaps.map((g,i)=>`<li><b>${i+1}. ${esc(g.ans)}</b> ${esc(g.why.en)}${tr(g.why)?`<span class="ls-trs" lang="${LANG}">${esc(g.why[LANG])}</span>`:''}</li>`).join('')}</ul>`;
  else why=`<p class="fbm">${esc(q.why.en)}</p>${tr(q.why)?`<p class="fbm tr" lang="${LANG}">${esc(q.why[LANG])}</p>`:''}`;
  const head = ok?'Correct!':(q.type==='compare'?'Not quite.':q.type==='passage'?'Not quite. See the answers:':`Not quite. The answer is <span class="answ">${esc(q.ans)}</span>.`);
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=`<div class="fbt"><b>${head}</b></div><div class="fbs"><span>${esc(full)}</span>${audBtn(full)}</div>${t?`<p class="fbm tr" lang="${LANG}">${esc(t)}</p>`:''}${why}<button class="btn primary" id="nxt">${S.i===S.qs.length-1?'See results':'Next'}</button>`;
  const ab=$('#audbtn'); if(ab) ab.onclick=()=>playAud(full);
  const nb=$('#nxt'); nb.onclick=nextQ; nb.focus({preventScroll:true}); fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finishQ(q,ok){ S.locked=true; S.lastOk=ok; reactPic(ok); S.res.push({lesson:q.lesson,cat:q.cat,ok}); showFb(q,ok); if(ok){ const full=sentenceOf(q), qq=q; setTimeout(()=>{ if(S&&S.locked&&S.qs[S.i]===qq) playAud(full); },420); } }
function bindQ(q){
  if(q.type==='passage'){
    const answered={}; let right=0;
    $$('.opt.small').forEach(b=>b.onclick=()=>{ const g=+b.dataset.g; if(answered[g]!=null) return; const k=+b.dataset.k, gp=q.gaps[g], ok=gp.opts[k]===gp.ans; answered[g]=k; if(ok) right++;
      $$(`.opt.small[data-g="${g}"]`).forEach((x,kk)=>{ x.disabled=true; if(gp.opts[kk]===gp.ans) x.classList.add('good'); else if(kk===k) x.classList.add('bad'); });
      const gl=$(`.pgap[data-g="${g+1}"]`); if(gl){ gl.textContent=gp.ans; gl.classList.add(ok?'good':'bad'); }
      if(Object.keys(answered).length===q.gaps.length) finishQ(q,right===q.gaps.length); });
    return; }
  $$('.opt').forEach(b=>b.onclick=()=>{ if(S.locked) return; const k=+b.dataset.k; const ok=q.type==='compare'?k===q.ans:q.opts[k]===q.ans;
    $$('.opt').forEach((x,kk)=>{ x.disabled=true; const right=q.type==='compare'?kk===q.ans:q.opts[kk]===q.ans; if(right) x.classList.add('good'); else if(kk===k) x.classList.add('bad'); });
    finishQ(q,ok); });
}
function nextQ(){ if(S.i<S.qs.length-1){ S.i++; renderQ(); scrollTo(0,0); } else endSession(); }
function endSession(){
  stopAud();
  const n=S.res.length, ok=S.res.filter(r=>r.ok).length, p=ok/n, st=starsFor(p);
  const prev=MEM.score[S.key]; MEM.score[S.key]={best:Math.max(prev?prev.best:0,p),stars:Math.max(prev?prev.stars:0,st)}; save();
  const miss={}; S.res.filter(r=>!r.ok).forEach(r=>{ miss[r.lesson]=(miss[r.lesson]||0)+1; });
  const ml=Object.keys(miss).sort((a,b)=>miss[b]-miss[a]).slice(0,5);
  const msg=st===3?'Excellent!':st===2?'Well done!':'Good try!';
  $('#app').innerHTML=`<header class="top game"><a class="icon-btn" href="${S.back}" aria-label="Back">${IC.back}</a><div class="gt"><b role="heading" aria-level="1">${esc(S.title)}</b><small>Results</small></div></header>
   <main id="main" tabindex="-1" class="endm"><div class="end"><span class="starsbig">${stars(st)}</span><h1>${msg}</h1><p class="score">${ok} of ${n} correct</p><div class="mm">${mascot(S.meta&&S.meta.m||'dexter',170)}</div>
   ${ml.length?`<div class="weak"><p>Review these lessons:</p>${ml.map(id=>`<a href="#/learn/${id}">${esc(LBY[id].title.en)} <small>${miss[id]} missed</small></a>`).join('')}</div>`:'<p class="allok">No mistakes. Great work!</p>'}
   <div class="navrow center"><button class="btn ghost" id="again">Try again</button><a class="btn primary" href="${S.back}">${S.meta&&S.meta.next?'Back to practice':'Continue'}</a></div></div></main>`;
  $('#again').onclick=()=>{ if(S.meta&&S.meta.rebuild) S.meta.rebuild(); };
  scrollTo(0,0);
}
/* session builders */
const lvSort=(a,b)=>(a.lv||0)-(b.lv||0);
function lessonSession(id){
  const l=LBY[id]; if(!l||!studied(l)) return location.hash='#/practice';
  const qs=l.practice.map(q=>normQ(q,l)).sort(lvSort);
  startSession('L:'+id,l.title.en,qs,'#/practice',{m:CATM[l.cat.id],rebuild:()=>lessonSession(id),next:1});
}
const pickN=(a,n)=>shuffle(a).slice(0,n);
function catSession(id){
  const c=CBY[id]; if(!c||!catStudied(c)) return location.hash='#/practice';
  let qs=[]; c.lessons.forEach(l=>{ const pool=l.practice.filter(q=>q.lv>=2&&q.type!=='scene'); qs=qs.concat(pickN(pool,2).map(q=>normQ(q,l))); });
  const lastL=c.lessons[c.lessons.length-1]; qs=qs.concat(c.integrated.map(q=>normQ(q,lastL)).map(q=>Object.assign(q,{lesson:q.lesson})));
  qs=shuffle(qs).sort(lvSort);
  startSession('C:'+id,c.title.en+': review',qs,'#/practice',{m:CATM[id],rebuild:()=>catSession(id),next:1});
}
function finalSession(){
  if(!allStudied()) return location.hash='#/practice';
  let qs=[]; LES.forEach(l=>{ const pool=l.practice.filter(q=>q.lv>=2); qs=qs.concat(pickN(pool,2).map(q=>normQ(q,l))); });
  CATS.forEach(c=>{ const lastL=c.lessons[c.lessons.length-1]; qs=qs.concat(pickN(c.integrated,2).map(q=>normQ(q,lastL))); });
  qs=shuffle(qs);
  startSession('F','Final review',qs,'#/practice',{m:'dexter',rebuild:finalSession,next:1});
}

/* ---------- router ---------- */
function route(){
  const h=(location.hash||'#/').slice(1).split('/').filter(Boolean);
  try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} stopAud();
  if(h[0]==='learn') viewLesson(h[1],+h[2]||0);
  else if(h[0]==='practice'&&h[1]==='lesson') lessonSession(h[2]);
  else if(h[0]==='practice'&&h[1]==='cat') catSession(h[2]);
  else if(h[0]==='practice'&&h[1]==='final') finalSession();
  else if(h[0]==='practice') viewPractice();
  else viewHome();
  if(h[0]!=='learn') scrollTo(0,0);
}
document.body.insertAdjacentHTML('afterbegin',globalDefs()); injectArt();
addEventListener('hashchange',route); route();
window.__PREP={MEM,save,CATS,LES,SC,route,normQ,sentenceOf,get S(){return S;},LBY};
