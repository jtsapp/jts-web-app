{type:"forge",title:"Correct the labels",level:"A2–B2",
intro:"<p>Type the word that fits each gap: an adjective, an adverb, or a comparative or superlative.</p>",
learned:"Use <i>-ly</i> adverbs for manner (with exceptions like <i>well</i>, <i>fast</i>, <i>hard</i>); one syllable takes <i>-er/-est</i>; long adjectives take <i>more/most</i>.",
items:[
{s:"The artist painted very ___ in her later years.",base:"quick",a:["quickly"],why:"Describes how she painted: adverb."},
{s:"This is the ___ painting in the collection.",base:"old",a:["oldest"],why:"Superlative of a one-syllable adjective."},
{s:"Her early work is ___ than her late work.",base:"colourful",a:["more colourful"],why:"Three syllables: <i>more</i>.",hint:"Long adjectives use a separate word."},
{s:"The restorers did their job ___ .",base:"good",a:["well"],why:"The adverb of <i>good</i> is <i>well</i>."},
{s:"The visitors left ___ disappointed.",base:"deep",a:["deeply"],why:"A degree adverb modifying the adjective <i>disappointed</i>."},
{s:"The gallery is ___ than the museum.",base:"busy",a:["busier"],why:"Two syllables ending in <i>-y</i>: <i>-ier</i>."}

{type:"rebuild",title:"Rewrite the forged descriptions",level:"B1–C1",
intro:"<p>The forger scrambled the word order. Rebuild each label so the adjectives follow their usual order and the adverbs sit in natural positions.</p>",

items:[

{w:["an","elegant","old","silver","mirror"],a:["an elegant old silver mirror"],why:"Opinion, age, material."},

{w:["She","described","the","scene","vividly"],a:["She described the scene vividly"],why:"Manner adverb after the object, not between verb and object."},

{type:"fault",title:"Expose the forged labels",level:"B2–C1",
intro:"<p>Each label contains one modifier error that a curator would never make. Find it and repair it.</p>",

{s:"The [[asleep]] child in the corner is the artist's son.",fix:["sleeping","sleepy asleep","sleeps"],why:"<i>asleep</i> is predicative-only: <i>the child is asleep</i>, but <i>the sleeping child</i>."},
{s:"The painting looks [[beautifully]] in the new light.",fix:["beautiful","beauty","beautifuly"],why:"<i>look</i> is linking here: adjective <i>beautiful</i>."},
{s:"She paints [[good]] with both hands.",fix:["well","goodly","better good"],why:"Describes how she paints: adverb <i>well</i>."},
{s:"The gallery [[hardly works]] to protect its collection.",fix:["works hard","hard works","hardly work"],why:"<i>hardly</i> means 'almost not'; the intended meaning is <i>works hard</i>."}

CASES.push({
id:"c08",unit:"u09",short:"Map Room",title:"The Map Room",place:"Cartography office, Harbour District",mark:"→",color:"#6d5a3a",level:"A1–C1",
who:{name:"Olzhas Berik",role:"City cartographer"},
brief:"<p>The fault scrambled the descriptions in our street directory. Couriers are getting lost because <i>opposite</i> became <i>next to</i>, and <i>in</i> became <i>on</i>.</p><p>Go into the field with the plan. Read each message, find the place it describes, and then help me repair the directory and the phrasal verbs our staff keep misusing.</p>",
debrief:"<p>The directory is reliable again. You interpreted spatial prepositions on a real plan, distinguished prepositions from particles, chose the prepositions that verbs and adjectives select, and corrected particle placement.</p><p>The cartographer's rule: a preposition relates a noun phrase to the rest of the sentence; a particle belongs to its verb and can move after the object.</p>",
stages:[
{type:"map",title:"Find the deliveries",level:"A1–B1",
intro:"<p>Each courier message describes one building. Read the prepositions carefully and tap the right place on the plan.</p>",
learned:"<i>opposite</i> = facing across a road; <i>between</i> = with one on each side; <i>next to</i> = beside; <i>on the corner of</i> = where two roads meet.",
plan:{w:760,h:440,
roads:[[0,140,760,44,"MAIN STREET"],[0,300,760,44,"RIVER ROAD"],[348,0,40,440,""]],
deco:['<text x="368" y="230" text-anchor="middle" font-size="11" fill="var(--ink3)" transform="rotate(-90 368 230)" letter-spacing="1">PARK LANE</text>'],
spots:[
{id:"bank",label:"Bank",x:30,y:40,w:140,h:80},{id:"cafe",label:"Café",x:190,y:40,w:140,h:80},{id:"library",label:"Library",x:406,y:40,w:140,h:80},{id:"hotel",label:"Hotel",x:566,y:40,w:160,h:80},
{id:"pharmacy",label:"Pharmacy",x:30,y:200,w:140,h:80},{id:"post",label:"Post office",x:190,y:200,w:140,h:80},{id:"park",label:"Park",x:406,y:200,w:140,h:80},{id:"museum",label:"Museum",x:566,y:200,w:160,h:80},
{id:"station",label:"Station",x:30,y:360,w:140,h:70},{id:"school",label:"School",x:190,y:360,w:140,h:70},{id:"bakery",label:"Bakery",x:406,y:360,w:140,h:70},{id:"gym",label:"Gym",x:566,y:360,w:160,h:70}]},
items:[
{from:"Courier 1",instr:"The parcel goes to the building between the bank and Park Lane, on Main Street.",a:"cafe",why:"Between the bank (left) and Park Lane (right) on the north side of Main Street: the café."},
{from:"Courier 2",instr:"Deliver it to the building opposite the café, across Main Street.",a:"post",why:"<i>opposite</i> = facing it on the other side of the road: the post office."},
{from:"Courier 3",instr:"It's on River Road, opposite the pharmacy.",a:"station",why:"Across River Road from the pharmacy: the station."},
{from:"Courier 4",instr:"The flowers are for the building next to the park, opposite the hotel.",a:"museum",why:"Beside the park and facing the hotel across Main Street: the museum."},
{from:"Courier 5",instr:"Leave the box at the building on the corner of Main Street and Park Lane, on the right of the lane, facing the park.",a:"library",why:"North side of Main Street, on the right of Park Lane, across from the park: the library."},
{from:"Courier 6",instr:"It's on River Road, between the school and the gym.",a:"bakery",why:"With the school on one side and the gym on the other: the bakery."},
{from:"Courier 7",instr:"The keys are in the building opposite the station, on the other side of River Road.",a:"pharmacy",why:"Facing the station across River Road: the pharmacy."}
]},
{type:"sort",title:"Preposition or particle?",level:"B1–B2",bins:["preposition","particle"],
intro:"<p>Directory entries use small words like <i>up, off, in</i>. Decide whether each bold word is a preposition (with a noun phrase after it) or a particle belonging to the verb. Try moving it after the object.</p>",
learned:"A particle can follow a noun object and must follow a pronoun object (<i>turn it off</i>); a preposition stays before its noun phrase (<i>look at it</i>).",
items:[
{w:"up",ctx:"The courier ran <b>up</b> the hill.",a:"preposition",why:"<i>up the hill</i> is a place phrase; *ran the hill up is impossible."},
{w:"up",ctx:"Please pick <b>up</b> the parcel at nine.",a:"particle",why:"<i>pick the parcel up</i> is possible: phrasal verb."},
{w:"off",ctx:"Turn <b>off</b> the engine before unloading.",a:"particle",why:"<i>turn the engine off / turn it off</i>."},
{w:"off",ctx:"The box fell <b>off</b> the van.",a:"preposition",why:"<i>off the van</i>: movement away from a place."},
{w:"in",ctx:"Fill <b>in</b> the delivery form.",a:"particle",why:"<i>fill the form in / fill it in</i>."},
{w:"at",ctx:"Look <b>at</b> the map again.",a:"preposition",why:"Prepositional verb: *look the map at is impossible."},
{w:"down",ctx:"Write <b>down</b> the address.",a:"particle",why:"<i>write the address down / write it down</i>."}
]},
{type:"forge",title:"Repair the directory phrases",level:"B1–C1",
intro:"<p>Each phrase needs the preposition that its verb, adjective or noun selects. Choose from the chips or type it.</p>",
learned:"Dependent prepositions are selected by the word before them and must be learned with it.",
items:[
{s:"Delivery times depend ___ the traffic.",chips:["on","of","from","at"],a:["on"],why:"<i>depend on</i>."},
{s:"The driver is responsible ___ the vehicle.",chips:["for","of","about","on"],a:["for"],why:"<i>responsible for</i>."},
{s:"We apologise ___ the delay.",chips:["for","about","of","at"],a:["for"],why:"<i>apologise for</i> something (<i>to</i> someone)."},
{s:"She's very good ___ reading maps.",chips:["at","in","on","with"],a:["at"],why:"<i>good at</i> + noun or <i>-ing</i>."},
{s:"There's been an increase ___ deliveries.",chips:["in","of","on","for"],a:["in"],why:"<i>an increase in</i> something."},
{s:"We arrived ___ the airport at six.",chips:["at","to","in","on"],a:["at"],why:"<i>arrive at</i> a point (<i>arrive in</i> a city or country); never *arrive to."}
]},
{type:"fault",title:"Correct the staff notes",level:"B1–B2",
intro:"<p>The staff notes contain preposition and particle errors. Find each and repair it.</p>",
learned:"Some verbs take a direct object with no preposition; particles follow pronoun objects; dependent prepositions are fixed.",
items:[
{s:"We discussed [[about]] the new routes.",fix:["(remove about)","on","over about"],why:"<i>discuss</i> takes a direct object."},
{s:"The radio is too loud; please [[turn down it]].",fix:["turn it down","down turn it","it turn down"],why:"With a pronoun object, the particle follows it: <i>turn it down</i>."},
{s:"She entered [[into]] the building at noon.",fix:["(remove into)","in","inside of"],why:"<i>enter</i> a place takes a direct object."},
{s:"He is married [[with]] the station manager.",fix:["to","by","at"],why:"<i>married to</i> someone."},
{s:"The meeting is [[in]] Monday.",fix:["on","at","by"],why:"Days take <i>on</i>."}
]}
]});

CASES.push({
id:"c09",unit:"u10",also:"u11",short:"City Archive",title:"The Torn Diary",place:"City Archive, reading room",mark:"&",color:"#4b5563",level:"A2–B2",
who:{name:"Timur Sain",role:"Junior archivist"},
brief:"<p>A diary donated to the archive was damaged in the fault. The sentences survived, but every word that joined them disappeared. Without the links we cannot tell cause from contrast, or which event happened first.</p><p>Restore the connections, then help me prepare a phone call to the donor's family without sounding like a textbook.</p>",
debrief:"<p>The diary reads as one story again. You restored coordinators and subordinators according to meaning, separated conjunctions from linking adverbs such as <i>however</i>, removed doubled links, and used inserts appropriately in conversation.</p><p>The archivist's rule: one relationship, one link. <i>Although</i> or <i>but</i>, never both.</p>",
stages:[
{type:"forge",title:"Restore the links",level:"A2–B1",
intro:"<p>Choose the connecting word that restores the meaning of each diary entry.</p>",
learned:"<i>because</i> = reason, <i>so</i> = result, <i>but</i> and <i>although</i> = contrast, <i>when</i>, <i>until</i>, <i>before</i> = time, <i>unless</i> = negative condition.",
items:[
{s:"We stayed indoors ___ the storm was too strong.",chips:["because","so","although","unless"],a:["because"],why:"The storm is the reason: <i>because</i>."},
{s:"The storm was too strong, ___ we stayed indoors.",chips:["so","because","although","until"],a:["so"],why:"Staying indoors is the result: <i>so</i>."},
{s:"___ it was late, my father kept writing.",chips:["Although","Because","So","Unless"],a:["Although"],why:"Contrast between being late and continuing: <i>Although</i>."},
{s:"We waited at the pier ___ the boat arrived.",chips:["until","unless","so","but"],a:["until"],why:"Waiting continues up to the time of arrival: <i>until</i>."},
{s:"You can't sail ___ you have a licence.",chips:["unless","until","because","and"],a:["unless"],why:"<i>unless</i> = if not: sailing is allowed only with a licence."},
{s:"I wanted to write more, ___ the candle went out.",chips:["but","so","because","although"],a:["but"],why:"Contrast between two equal clauses: the coordinator <i>but</i>."}
]},
{type:"sort",title:"Classify the linking words",level:"B1–B2",bins:["coordinator","subordinator","linking adverb","insert"],
intro:"<p>The archive index needs the class of each linking word. Use the clue: could the clause stand alone, and how is the word punctuated?</p>",
learned:"Coordinators join equals; subordinators make a dependent clause; linking adverbs begin a new sentence or follow a semicolon; inserts stand outside the clause.",
items:[
{w:"because",ctx:"We left early <b>because</b> it was dark.",a:"subordinator",why:"<i>because it was dark</i> cannot stand alone."},
{w:"However",ctx:"The house was cold. <b>However</b>, nobody complained.",a:"linking adverb",why:"It begins a new sentence and is followed by a comma."},
{w:"and",ctx:"My mother cooked <b>and</b> my father read aloud.",a:"coordinator",why:"Joins two equal clauses."},
{w:"well",ctx:"<b>Well</b>, I'm not sure that's right.",a:"insert",why:"A discourse marker outside the clause."},
{w:"although",ctx:"<b>Although</b> we were poor, we were happy.",a:"subordinator",why:"Introduces a dependent clause of contrast."},
{w:"therefore",ctx:"The road was closed; <b>therefore</b>, we walked.",a:"linking adverb",why:"After a semicolon and followed by a comma: an adverb."},
{w:"oh",ctx:"<b>Oh</b>, I almost forgot the date.",a:"insert",why:"An interjection outside the clause."},
{w:"or",ctx:"We could take the bus <b>or</b> walk.",a:"coordinator",why:"Joins two equal verb phrases."}
]},
{type:"fault",title:"The transcriber's errors",level:"B1–B2",
intro:"<p>A transcriber typed the diary but doubled some links and misused others. Find each error and repair it.</p>",
learned:"Use one link per relationship; <i>however</i> cannot join two clauses with a comma; correlatives come in fixed pairs.",
items:[
{s:"Although we had little money, [[but]] we travelled every summer.",fix:["(remove but)","so","and"],why:"<i>Although</i> already expresses the contrast."},
{s:"Because the bridge was closed, [[so]] we took the ferry.",fix:["(remove so)","but","therefore"],why:"<i>Because</i> already expresses the reason."},
{s:"The ferry was late, [[however]] we caught the train.",fix:["but","however,","although,"],why:"<i>however</i> is an adverb and cannot join two clauses with a comma; <i>but</i> can."},
{s:"Neither my brother [[or]] my sister wrote back.",fix:["nor","and","but"],why:"<i>neither</i> pairs with <i>nor</i>."},
{s:"Either we leave now [[nor]] we miss the last ferry.",fix:["or","and","but"],why:"<i>either</i> pairs with <i>or</i>; <i>nor</i> goes with <i>neither</i>."}
]},
{type:"dialogue",title:"The phone call",level:"A2–B1",
intro:"<p>You call the donor's granddaughter, Aruzhan. Inserts such as <i>well</i>, <i>oh</i> and <i>sorry</i>, and stance adverbs such as <i>actually</i>, manage the conversation. Choose natural replies.</p>",
learned:"Inserts do social work: softening, correcting, reacting, apologising. They belong to speech, not to formal writing.",
items:[
{who:"Aruzhan",lines:[["Aruzhan","Hello? Who's speaking?"]],prompt:"Open the call:",options:[
{t:"Hi, this is Timur from the City Archive. Is this a good time?",ok:true,reply:"Yes, of course. How can I help?",why:"Greeting + a polite check: natural opening."},
{t:"The diary. Bring information.",ok:false,reply:"Sorry? I'm not sure who this is.",why:"No greeting, no context: the call feels abrupt and unclear."},
{t:"Dear Madam, I am writing to inform you…",ok:false,reply:"Writing? We're on the phone…",why:"Formal written formulae are out of place in speech."}]},
{who:"Aruzhan",lines:[["Aruzhan","So the diary was completely destroyed?"]],prompt:"Correct her politely: it is damaged, not destroyed.",options:[
{t:"Actually, it's only damaged. We can still read most of it.",ok:true,reply:"Oh, what a relief!",why:"<i>Actually</i> signals a polite correction."},
{t:"No. Wrong.",ok:false,reply:"Oh. I see…",why:"Accurate, but too blunt: nothing softens the correction."},
{t:"Yeah, totally destroyed, but also we can read it.",ok:false,reply:"I'm confused. Is it destroyed or not?",why:"Agreeing first contradicts the correction."}]},
{who:"Aruzhan",lines:[["Aruzhan","Could you send me a copy of the pages you've restored?"]],prompt:"Agree, and promise to send them tomorrow:",options:[
{t:"Sure, I'll send them tomorrow.",ok:true,reply:"Thank you so much.",why:"A response form (<i>Sure</i>) followed by a clear promise."},
{t:"Um, er, well, yes, um.",ok:false,reply:"Is that a yes?",why:"Hesitators hold the turn, but too many leave the message unclear."},
{t:"Well, actually, anyway.",ok:false,reply:"Sorry, I didn't catch that.",why:"Discourse words alone carry no message."}]}
]}
]});

CASES.push({
id:"c10",unit:"u12",short:"Laboratory",title:"The Laboratory Notebook",place:"University Language Laboratory",mark:"-ing",color:"#b4650f",level:"B1–C1",
who:{name:"Dr Asel Nur",role:"Laboratory director"},
brief:"<p>My laboratory studies how forms change their jobs. The fault damaged our notebook exactly where verbs become non-finite: <i>-ing</i> forms, infinitives, and adjectives made from participles.</p><p>One <i>-ing</i> form can do several jobs. Your task is to identify the job each time, then repair the notebook.</p>",
debrief:"<p>The notebook is restored. You classified <i>-ing</i> forms by their function, chose between <i>-ing</i> and <i>to</i>-infinitive after verbs, distinguished feeling-causing <i>-ing</i> adjectives from feeling-experiencing <i>-ed</i> adjectives, and justified your analyses with evidence.</p><p>The laboratory's principle: ask what job a form is doing, not what it is called.</p>",
stages:[
{type:"sort",title:"Sample analysis",level:"B1–B2",bins:["progressive verb","noun-like (gerund)","adjective","adverbial clause"],
intro:"<p>Each sample contains an <i>-ing</i> form. Sort it by the job it does in its sentence.</p>",
learned:"The <i>-ing</i> form appears in progressive verb phrases, in noun-phrase positions, as a modifier, and in adverbial clauses.",
items:[
{w:"testing",ctx:"<b>Testing</b> each sample takes an hour.",a:"noun-like (gerund)",why:"It heads the subject, but it also takes an object (<i>each sample</i>), a verbal property."},
{w:"testing",ctx:"The students are <b>testing</b> the samples now.",a:"progressive verb",why:"<i>are</i> + <i>-ing</i>."},
{w:"amazing",ctx:"The results were <b>amazing</b>.",a:"adjective",why:"It describes the results after <i>were</i>; <i>the results seemed amazing</i> and <i>amazing results</i> are both possible: an adjective."},
{w:"Looking",ctx:"<b>Looking</b> at the data again, she saw the error.",a:"adverbial clause",why:"A participle clause giving the circumstances of <i>she saw</i>."},
{w:"working",ctx:"We need a <b>working</b> microscope.",a:"adjective",why:"A participial modifier before a noun meaning 'that works'."},
{w:"measuring",ctx:"She's good at <b>measuring</b> small changes.",a:"noun-like (gerund)",why:"After the preposition <i>at</i>, in a noun-phrase position."},
{w:"waiting",ctx:"We were <b>waiting</b> for the results.",a:"progressive verb",why:"<i>were</i> + <i>-ing</i>."},
{w:"Knowing",ctx:"<b>Knowing</b> the risk, they wore gloves.",a:"adverbial clause",why:"A participle clause of reason."}
]},
{type:"forge",title:"Repair the procedure",level:"B1–B2",
intro:"<p>The procedure lost its verb forms. Type <i>-ing</i> or <i>to</i> + verb, as the main verb requires.</p>",
learned:"The verb decides: <i>enjoy, avoid, finish, suggest</i> + <i>-ing</i>; <i>decide, plan, refuse, hope</i> + <i>to</i>; <i>remember, stop, try</i> change meaning.",
items:[
{s:"Avoid ___ the samples with bare hands.",base:"touch",a:["touching"],why:"<i>avoid</i> + <i>-ing</i>."},
{s:"We decided ___ the experiment.",base:"repeat",a:["to repeat"],why:"<i>decide</i> + <i>to</i>-infinitive."},
{s:"Remember ___ the lid before you leave.",base:"close",a:["to close"],why:"<i>remember to</i> = a future task."},
{s:"I remember ___ that machine for the first time in 2019.",base:"use",a:["using"],why:"<i>remember</i> + <i>-ing</i> = a past memory."},
{s:"She suggested ___ the temperature.",base:"lower",a:["lowering"],why:"<i>suggest</i> + <i>-ing</i> (not object + <i>to</i>)."},
{s:"We look forward to ___ the results.",base:"share",a:["sharing"],why:"<i>to</i> is a preposition here, so <i>-ing</i> follows.",hint:"Is <i>to</i> part of an infinitive, or a preposition?"},
{s:"He stopped ___ a sandwich and then continued.",base:"eat",a:["to eat"],why:"<i>stop to do</i> = stop in order to do something."}
]},
{type:"dialogue",title:"Feedback from volunteers",level:"B1",
intro:"<p>Volunteers describe how they felt during the study. Choose the reply that understands them correctly.</p>",
learned:"<i>-ing</i> adjectives describe the cause of a feeling; <i>-ed</i> adjectives describe the person who feels it.",
items:[
{who:"Volunteer",lines:[["Volunteer","Honestly, I was bored after the first hour."]],prompt:"Respond:",options:[
{t:"Sorry the session felt so long. We'll add a break.",ok:true,reply:"That would help.",why:"<i>bored</i> = how she felt; you respond to her feeling."},
{t:"I don't think you're boring at all!",ok:false,reply:"I didn't say I was boring. I said I was bored!",why:"<i>boring</i> would describe her as the cause of boredom."},
{t:"So you made the others bored?",ok:false,reply:"No, the task did.",why:"<i>-ed</i> describes the experiencer, not the cause."}]},
{who:"Volunteer",lines:[["Volunteer","The last task was really confusing."]],prompt:"Respond:",options:[
{t:"Thanks, we'll rewrite the instructions.",ok:true,reply:"Great.",why:"<i>confusing</i> describes the task as the cause."},
{t:"Don't worry, many people are confusing.",ok:false,reply:"I meant the task, not people!",why:"<i>confusing</i> people cause confusion; the volunteer meant the task."},
{t:"So you confused the task?",ok:false,reply:"No, it confused me.",why:"The task caused the confusion."}]},

CASES.push({

items:[

{type:"sort",title:"Sort the suffixes",level:"B1–B2",bins:["noun","verb","adjective","adverb"],

items:[
{s:"Please [[email]] the proofs to the editor.",classes:["noun","verb"],a:"verb",evidence:["Imperative position with an object, <i>the proofs</i>; it can become <i>emailed</i>","It refers to technology","It is a short word"],why:"Noun → verb conversion."},

CASES.push({

sec:[
{h:{en:"What a part of speech is",kk:"Сөз табы деген не",ru:"Что такое часть речи"},
b:L3(function(l){return ({
en:"<p>A part of speech, or <b>word class</b>, is a group of words that behave alike: they take the same kinds of endings, appear in the same positions and combine with the same neighbours. Modern grammars insist on separating this from two related ideas (Huddleston &amp; Pullum, 2002). A <b>grammatical category</b> is a system of contrasts marked on a class, such as number on nouns (<i>book/books</i>) or tense on verbs (<i>walk/walked</i>). A <b>function</b> is the job a word or phrase does in a particular sentence, such as subject, object or modifier.</p><p>The distinction matters because the same class can do different jobs. Compare these phrases:</p>",
kk:"<p>Сөз табы — өзін бірдей ұстайтын сөздер тобы: олар бірдей жалғаулар мен жұрнақтар қабылдайды, сөйлемде бірдей орындарда тұрады және бірдей сөздермен тіркеседі. Қазіргі грамматикалар мұны екі ұқсас ұғымнан ажыратуды талап етеді (Huddleston &amp; Pullum, 2002). <b>Грамматикалық категория</b> — бір сөз табында берілетін қарама-қарсы мағыналар жүйесі, мысалы, зат есімдегі сан (<i>book/books</i>) немесе етістіктегі шақ (<i>walk/walked</i>). <b>Қызмет</b> — сөздің немесе сөз тіркесінің нақты сөйлемде атқаратын рөлі, мысалы, бастауыш, толықтауыш немесе анықтауыш.</p><p>Бұл айырма маңызды, өйткені бір сөз табы әртүрлі қызмет атқара алады. Мына тіркестерді салыстырыңыз:</p>",
ru:"<p>Часть речи, или <b>класс слов</b>, — это группа слов, которые ведут себя одинаково: принимают одни и те же окончания, занимают одни и те же позиции и сочетаются с одними и теми же соседями. Современные грамматики требуют отделять это понятие от двух смежных (Huddleston &amp; Pullum, 2002). <b>Грамматическая категория</b> — система противопоставленных форм внутри класса, например число у существительных (<i>book/books</i>) или время у глаголов (<i>walk/walked</i>). <b>Функция</b> — роль слова или группы слов в конкретном предложении: подлежащее, дополнение, определение и т. д.</p><p>Различие важно, потому что один и тот же класс может выполнять разные функции. Сравните:</p>"})[l]+
X(l,[["an [adj:old] [n:wall]",{en:"<i>old</i> is an adjective functioning as a modifier.",kk:"<i>old</i> — анықтауыш қызметіндегі сын есім.",ru:"<i>old</i> — прилагательное в функции определения."}],
["a [n:stone] [n:wall]",{en:"<i>stone</i> is still a noun; here it functions as a modifier.",kk:"<i>stone</i> бұрынғыдай зат есім; мұнда ол анықтауыш қызметін атқарады.",ru:"<i>stone</i> остаётся существительным; здесь оно выполняет функцию определения."}],
["a [adv:very] [adj:old] [n:wall] / {x:a very stone wall}",{en:"Evidence: adjectives accept <i>very</i>; the noun <i>stone</i> does not.",kk:"Дәлел: сын есім <i>very</i> сөзімен тіркеседі, ал <i>stone</i> зат есімі тіркеспейді.",ru:"Доказательство: прилагательное сочетается с <i>very</i>, а существительное <i>stone</i> — нет."}]])+
({en:"<p>Many learner materials call <i>stone</i> \"an adjective here\". Both major reference grammars reject this: it is a noun doing a modifier's job (Quirk et al., 1985; Huddleston &amp; Pullum, 2002). Keeping class and function apart is the single most useful habit in this course.</p>",
kk:"<p>Көптеген оқу құралдарында <i>stone</i> сөзін «бұл жерде сын есім» деп атайды. Екі негізгі анықтамалық грамматика да мұны қабылдамайды: бұл — анықтауыш қызметін атқаратын зат есім (Quirk et al., 1985; Huddleston &amp; Pullum, 2002). Сөз табы мен қызметті ажырату — осы курстағы ең пайдалы дағды.</p>",
ru:"<p>Во многих учебных материалах <i>stone</i> называют «здесь прилагательным». Обе ведущие справочные грамматики это отвергают: это существительное в функции определения (Quirk et al., 1985; Huddleston &amp; Pullum, 2002). Разграничение класса и функции — самая полезная привычка в этом курсе.</p>"})[l];})},

{h:{en:"Three kinds of evidence",kk:"Дәлелдің үш түрі",ru:"Три вида признаков"},
b:L3(function(l){return ({
en:"<p>Grammarians use three criteria to decide a word's class. Meaning is the most intuitive but the least reliable; form and position are decisive (Quirk et al., 1985; Aarts, 2011).</p>",
kk:"<p>Грамматистер сөздің табын анықтау үшін үш белгіні қолданады. Мағына — ең түсінікті, бірақ ең сенімсіз белгі; форма мен орын шешуші рөл атқарады (Quirk et al., 1985; Aarts, 2011).</p>",
ru:"<p>Грамматисты используют три критерия. Значение — самый интуитивный, но наименее надёжный; решающими являются форма и позиция (Quirk et al., 1985; Aarts, 2011).</p>"})[l]+

[{en:"Form (morphological)",kk:"Форма (морфологиялық)",ru:"Форма (морфологический)"},{en:"Which endings can it take?",kk:"Қандай жалғаулар мен жұрнақтар қабылдайды?",ru:"Какие окончания и суффиксы принимает?"},{en:"Plural <i>-s</i>, past <i>-ed</i>, comparative <i>-er</i> are strong clues",kk:"Көпше <i>-s</i>, өткен шақ <i>-ed</i>, салыстырмалы <i>-er</i> — нақты белгілер",ru:"Множественное <i>-s</i>, прошедшее <i>-ed</i>, сравнительное <i>-er</i> — надёжные признаки"},{en:"<i>the, must, very</i> never change form; <i>friendly</i> ends in <i>-ly</i> but is an adjective",kk:"<i>the, must, very</i> формасын өзгертпейді; <i>friendly</i> <i>-ly</i>-ге аяқталса да, сын есім",ru:"<i>the, must, very</i> не изменяются; <i>friendly</i> оканчивается на <i>-ly</i>, но это прилагательное"}],
[{en:"Position (distributional)",kk:"Орын (дистрибутивтік)",ru:"Позиция (дистрибутивный)"},{en:"Where can it stand? What can it combine with?",kk:"Қай жерде тұра алады? Немен тіркеседі?",ru:"Где может стоять? С чем сочетается?"},{en:"The most decisive test in modern grammars",kk:"Қазіргі грамматикалардағы ең шешуші тәсіл",ru:"Самый решающий тест в современных грамматиках"},{en:"Needs a sentence; more abstract",kk:"Сөйлемді қажет етеді; абстрактілеу",ru:"Требует предложения; более абстрактен"}]
])+
({en:"<p>In practice you combine them. Faced with <i>She gave a brilliant <b>performance</b></i>, you can note that <i>performance</i> follows <i>a</i> and an adjective (position), that it could be made plural, <i>two performances</i> (form), and that the <i>-ance</i> suffix typically forms nouns. Three independent clues point to the same answer.</p>",
kk:"<p>Іс жүзінде бұл белгілер бірге қолданылады. <i>She gave a brilliant <b>performance</b></i> сөйлемінде <i>performance</i> сөзі <i>a</i> артиклі мен сын есімнен кейін тұр (орны), оны көпше түрге қоюға болады — <i>two performances</i> (формасы), ал <i>-ance</i> жұрнағы әдетте зат есім жасайды. Үш тәуелсіз белгі бір жауапқа әкеледі.</p>",
ru:"<p>На практике критерии сочетаются. В предложении <i>She gave a brilliant <b>performance</b></i> слово <i>performance</i> стоит после <i>a</i> и прилагательного (позиция), может стоять во множественном числе — <i>two performances</i> (форма), а суффикс <i>-ance</i> обычно образует существительные. Три независимых признака ведут к одному ответу.</p>"})[l];})},

{h:{en:"The classes at a glance",kk:"Сөз таптарына шолу",ru:"Обзор частей речи"},
b:L3(function(l){return ({
en:"<p>This course uses the traditional class names with two additions that most modern descriptions make: <b>determiners</b> and <b>auxiliary verbs</b> are treated as classes of their own (Quirk et al., 1985; Biber et al., 2021). Classes are also grouped in two ways. <b>Open classes</b> accept new members freely (new nouns and verbs appear every year); <b>closed classes</b> have a small, stable membership. <b>Lexical words</b> carry most of the content of a message, while <b>function words</b> signal grammatical relationships.</p>",
kk:"<p>Бұл курс дәстүрлі атауларды қолданады және қазіргі сипаттамалардың көбінде кездесетін екі толықтыру енгізеді: <b>детерминативтер</b> мен <b>көмекші етістіктер</b> жеке таптар ретінде қарастырылады (Quirk et al., 1985; Biber et al., 2021). Таптар екі түрлі топтастырылады. <b>Ашық таптарға</b> жаңа сөздер еркін қосылады (жыл сайын жаңа зат есімдер мен етістіктер пайда болады); <b>жабық таптардың</b> құрамы шағын әрі тұрақты. <b>Толық мағыналы сөздер</b> хабардың негізгі мазмұнын береді, ал <b>көмекші (қызметші) сөздер</b> грамматикалық байланысты көрсетеді.</p>",
ru:"<p>В курсе используются традиционные названия с двумя дополнениями, принятыми в большинстве современных описаний: <b>детерминативы</b> и <b>вспомогательные глаголы</b> рассматриваются как отдельные классы (Quirk et al., 1985; Biber et al., 2021). Классы группируются двумя способами. <b>Открытые классы</b> свободно пополняются (новые существительные и глаголы появляются каждый год); <b>закрытые классы</b> имеют небольшой и стабильный состав. <b>Знаменательные слова</b> несут основное содержание высказывания, а <b>служебные</b> выражают грамматические отношения.</p>"})[l]+

{h:{en:"One word, several classes: the case of clean",kk:"Бір сөз — бірнеше тап: clean мысалы",ru:"Одно слово — несколько классов: пример clean"},
b:L3(function(l){return ({
en:"<p>English uses very little inflection and allows a word to move into another class without any change of form. This process is called <b>conversion</b> (Bauer et al., 2013). As a result, you can decide the class of <i>clean</i> only by looking at the sentence and testing it:</p>",
kk:"<p>Ағылшын тілінде сөз түрлену өте аз, және сөз формасын өзгертпей-ақ басқа сөз табына ауыса алады. Бұл құбылыс <b>конверсия</b> деп аталады (Bauer et al., 2013). Сондықтан <i>clean</i> сөзінің табын тек сөйлемге қарап, тексеру арқылы ғана анықтауға болады:</p>",
ru:"<p>В английском очень мало словоизменения, и слово может перейти в другой класс без изменения формы. Это явление называется <b>конверсией</b> (Bauer et al., 2013). Поэтому часть речи <i>clean</i> можно определить, только посмотрев на предложение и применив тесты:</p>"})[l]+

sec:[
{h:{en:"What makes a word a noun",kk:"Сөзді зат есім ететін белгілер",ru:"Что делает слово существительным"},
b:L3(function(l){return ({
en:"<p>Nouns name people, places, things and ideas, but the reliable evidence is grammatical. A noun is the word that <b>heads a noun phrase</b>: it can follow a determiner such as <i>the, a, my, this</i>, it can be modified by an adjective before it, and it usually has a plural and a genitive form (Huddleston &amp; Pullum, 2002; Quirk et al., 1985). Abstract nouns such as <i>decision</i> or <i>happiness</i> pass these tests just as concrete ones do, which is why meaning alone is not enough.</p>",
kk:"<p>Зат есім адамдарды, жерлерді, заттарды және ұғымдарды атайды, бірақ сенімді дәлел — грамматикалық белгілер. Зат есім — <b>зат есімді тіркестің ұйытқы (басты) сөзі</b>: ол <i>the, a, my, this</i> сияқты детерминативтен кейін тұра алады, алдынан сын есім арқылы анықтала алады және әдетте көпше және тәуелдік формалары болады (Huddleston &amp; Pullum, 2002; Quirk et al., 1985). <i>decision</i> немесе <i>happiness</i> сияқты дерексіз зат есімдер де бұл белгілерге деректі зат есімдер сияқты сай келеді, сондықтан тек мағынаға сүйену жеткіліксіз.</p>",
ru:"<p>Существительные называют людей, места, предметы и понятия, но надёжные признаки — грамматические. Существительное является <b>главным словом именной группы</b>: оно может стоять после детерминатива (<i>the, a, my, this</i>), иметь перед собой определение-прилагательное и обычно имеет формы множественного числа и притяжательного падежа (Huddleston &amp; Pullum, 2002; Quirk et al., 1985). Абстрактные существительные (<i>decision</i>, <i>happiness</i>) проходят эти тесты так же, как конкретные, поэтому одного значения недостаточно.</p>"})[l]+

{h:{en:"Types of noun",kk:"Зат есімнің түрлері",ru:"Типы существительных"},
b:L3(function(l){return ({
en:"<p>The most important distinction for learners is between <b>count</b> and <b>non-count</b> (mass) uses, because it controls plural forms, articles and quantifiers. Count nouns refer to things that can be counted as separate units (<i>a chair, three chairs</i>). Non-count nouns treat their referent as an undivided mass or abstraction (<i>furniture, information, advice, water</i>); they take no plural and no <i>a/an</i>. Quirk et al. (1985) stress that this is a property of a noun's <b>use</b>, not only of the word: <i>coffee</i> is non-count as a substance but count when it means a cup of coffee.</p>",
kk:"<p>Оқушы үшін ең маңызды айырма — зат есімнің <b>саналатын</b> және <b>саналмайтын</b> қолданысы, өйткені ол көпше түрді, артикльді және мөлшер сөздерін анықтайды. Саналатын зат есімдер жеке бірліктерге бөлінетін заттарды білдіреді (<i>a chair, three chairs</i>). Саналмайтын зат есімдер затты бөлінбейтін масса немесе дерексіз ұғым ретінде береді (<i>furniture, information, advice, water</i>); олар көпше түрге қойылмайды және <i>a/an</i> алмайды. Quirk et al. (1985) бұл тек сөздің емес, оның <b>қолданысының</b> қасиеті екенін атап өтеді: <i>coffee</i> зат ретінде саналмайды, ал «бір кесе кофе» мағынасында саналады.</p>",
ru:"<p>Для изучающих язык важнее всего различие между <b>исчисляемым</b> и <b>неисчисляемым</b> употреблением: от него зависят множественное число, артикли и слова количества. Исчисляемые существительные обозначают то, что можно считать отдельными единицами (<i>a chair, three chairs</i>). Неисчисляемые представляют предмет как нерасчленённую массу или абстракцию (<i>furniture, information, advice, water</i>); они не имеют мн. ч. и не употребляются с <i>a/an</i>. Quirk et al. (1985) подчёркивают, что это свойство <b>употребления</b>, а не только слова: <i>coffee</i> неисчисляемо как вещество, но исчисляемо в значении «чашка кофе».</p>"})[l]+

{h:{en:"Forms: plural and genitive",kk:"Формалары: көпше түр және тәуелдік",ru:"Формы: множественное число и притяжательный падеж"},
b:L3(function(l){return ({
en:"<p>Most nouns form the plural with <i>-s</i> or <i>-es</i> (<i>cats, boxes, cities</i>). A small, closed set of irregular plurals must be learned as vocabulary because they are frequent: change of vowel (<i>man/men, foot/feet, mouse/mice</i>), <i>-en</i> (<i>child/children</i>), no change (<i>sheep, fish</i>), and plurals borrowed from Latin or Greek, mostly in academic English (<i>criterion/criteria, analysis/analyses</i>). The <b>genitive</b> is marked with <i>'s</i> on singular nouns and an apostrophe alone on regular plurals (<i>the student's notes</i>, <i>the students' notes</i>).</p>",
kk:"<p>Зат есімдердің көбі көпше түрді <i>-s</i> немесе <i>-es</i> арқылы жасайды (<i>cats, boxes, cities</i>). Жиі қолданылатын ерекше (дұрыс емес) көпше формалардың шағын, жабық тобын сөздік ретінде жаттау қажет: дауысты дыбыстың өзгеруі (<i>man/men, foot/feet, mouse/mice</i>), <i>-en</i> (<i>child/children</i>), өзгермейтіндер (<i>sheep, fish</i>) және көбіне ғылыми тілде кездесетін латын не грек тілінен енген формалар (<i>criterion/criteria, analysis/analyses</i>). <b>Тәуелдік форма</b> жекеше зат есімде <i>'s</i>, ал жүйелі көпше түрде тек апостроф арқылы беріледі (<i>the student's notes</i>, <i>the students' notes</i>).</p>",
ru:"<p>Большинство существительных образуют мн. ч. с помощью <i>-s</i> или <i>-es</i> (<i>cats, boxes, cities</i>). Небольшую закрытую группу частотных неправильных форм нужно учить как лексику: чередование гласной (<i>man/men, foot/feet, mouse/mice</i>), <i>-en</i> (<i>child/children</i>), совпадение форм (<i>sheep, fish</i>) и заимствования из латыни и греческого, в основном в академическом языке (<i>criterion/criteria, analysis/analyses</i>). <b>Притяжательный падеж</b> обозначается <i>'s</i> у существительных в ед. ч. и одним апострофом у правильных форм мн. ч. (<i>the student's notes</i>, <i>the students' notes</i>).</p>"})[l]+

en:"In Kazakh, a noun after a numeral stays singular (<i>екі кітап</i>), so learners often write {x:two book}. In English the plural is required after any number above one: <i>two books</i>. Russian learners usually mark the plural but may pluralise nouns that are non-count in English (<i>советы</i> → {x:advices}).",
kk:"Қазақ тілінде сан есімнен кейінгі зат есім жекеше түрде тұрады (<i>екі кітап</i>), сондықтан оқушылар жиі {x:two book} деп жазады. Ағылшын тілінде бірден көп кез келген саннан кейін көпше түр міндетті: <i>two books</i>. Орыс тілінде сөйлейтін оқушылар әдетте көпше түрді қояды, бірақ ағылшын тілінде саналмайтын зат есімдерді көпше түрге қоюы мүмкін (<i>советы</i> → {x:advices}).",
ru:"В казахском существительное после числительного стоит в ед. ч. (<i>екі кітап</i>), поэтому учащиеся часто пишут {x:two book}. В английском после любого числа больше единицы нужно мн. ч.: <i>two books</i>. Русскоязычные учащиеся обычно ставят мн. ч., но могут образовывать его от слов, неисчисляемых в английском (<i>советы</i> → {x:advices})."});})},

en:"<p>A noun phrase can fill most of the main positions in a clause. Notice that in each case it is the whole phrase, built around the noun, that does the job (Quirk et al., 1985):</p>",

ru:"<p>Именная группа может занимать большинство основных позиций в предложении. Обратите внимание: в каждом случае функцию выполняет вся группа, построенная вокруг существительного (Quirk et al., 1985):</p>"})[l]+
TB(l,{en:["Function","Example"],kk:["Қызметі","Мысал"],ru:["Функция","Пример"]},[
[{en:"Subject",kk:"Бастауыш",ru:"Подлежащее"},"<b>The new library</b> opens at nine."],
[{en:"Object",kk:"Толықтауыш",ru:"Дополнение"},"We visited <b>the new library</b>."],

[{en:"Complement of a preposition",kk:"Предлогтан кейінгі толықтауыш",ru:"Дополнение предлога"},"She works in <b>the library</b>."],

])+({en:"<p>The last row connects to Unit 1. When a noun modifies another noun, it is normally singular even if the meaning is plural: <i>a shoe shop</i>, not {x:a shoes shop}; <i>a ten-year-old girl</i>, not {x:a ten-years-old girl} (Swan, 2016).</p>",
kk:"<p>Соңғы жол 1-бөліммен байланысты. Зат есім басқа зат есімді анықтағанда, мағынасы көпше болса да, әдетте жекеше түрде тұрады: {x:a shoes shop} емес, <i>a shoe shop</i>; {x:a ten-years-old girl} емес, <i>a ten-year-old girl</i> (Swan, 2016).</p>",

sec:[
{h:{en:"What a pronoun does",kk:"Есімдіктің қызметі",ru:"Что делает местоимение"},
b:L3(function(l){return ({
en:"<p>A pronoun normally stands for a <b>whole noun phrase</b>, not just a noun. In <i>The old woman next door was ill, so we visited <b>her</b></i>, the pronoun replaces <i>the old woman next door</i>. This is why pronouns rarely take determiners or adjectives in front of them. Pronouns form a small closed class, and the personal pronouns, together with <i>who/whom</i>, are the only words in English that still show <b>case</b> for subject and object: a different form for each (<i>I/me, she/her, they/them</i>). Nouns mark only the genitive (<i>the teacher's</i>). Huddleston and Pullum (2002) analyse pronouns as a subclass of nouns, because they head noun phrases; Quirk et al. (1985) and most teaching materials treat them as a separate class. Both views agree on how pronouns behave.</p>",
kk:"<p>Есімдік әдетте жеке зат есімнің емес, <b>тұтас зат есімді тіркестің</b> орнына жүреді. <i>The old woman next door was ill, so we visited <b>her</b></i> сөйлемінде есімдік <i>the old woman next door</i> тіркесінің орнын басады. Сондықтан есімдіктің алдында детерминатив не сын есім сирек тұрады. Есімдік — шағын жабық тап, ал жіктеу есімдіктері <i>who/whom</i> сөзімен бірге ағылшын тілінде бастауыш пен толықтауыш үшін <b>септікті</b> әлі де ажырататын жалғыз сөздер: әрқайсысының бөлек формасы бар (<i>I/me, she/her, they/them</i>). Зат есімдер тек ілік формасын белгілейді (<i>the teacher's</i>). Huddleston мен Pullum (2002) есімдікті зат есімнің бір түрі деп қарайды, өйткені ол зат есімді тіркестің ұйытқысы бола алады; Quirk et al. (1985) және оқу құралдарының көбі оны жеке сөз табы ретінде береді. Есімдіктің қолданысы туралы екі көзқарас та бірдей пікірде.</p>",
ru:"<p>Местоимение обычно заменяет <b>всю именную группу</b>, а не одно существительное. В предложении <i>The old woman next door was ill, so we visited <b>her</b></i> местоимение заменяет <i>the old woman next door</i>. Поэтому перед местоимениями редко стоят детерминативы или прилагательные. Местоимения — небольшой закрытый класс, а личные местоимения вместе с <i>who/whom</i> — единственные слова в английском, которые ещё различают <b>падеж</b> подлежащего и дополнения: у каждого своя форма (<i>I/me, she/her, they/them</i>). Существительные отмечают только притяжательную форму (<i>the teacher's</i>). Huddleston и Pullum (2002) считают местоимения подклассом существительных, поскольку они возглавляют именные группы; Quirk et al. (1985) и большинство учебников выделяют их в отдельную часть речи. В описании поведения местоимений оба подхода совпадают.</p>"})[l];})},

[{en:"Personal (subject / object)",kk:"Жіктеу (атау / объектілік)",ru:"Личные (подлежащее / дополнение)"},"I/me, you, he/him, she/her, it, we/us, they/them","[pr:They] called [pr:us]."],
[{en:"Possessive (independent)",kk:"Тәуелдеу (дербес)",ru:"Притяжательные (самостоятельные)"},"mine, yours, his, hers, ours, theirs","This seat is [pr:mine]."],

[{en:"Indefinite",kk:"Белгісіздік",ru:"Неопределённые"},"someone, anything, nobody, everything","[pr:Nobody] answered."]
])+({en:"<p>The demonstratives, interrogatives and some indefinites (<i>this, which, some</i>) also work as determiners when a noun follows (<i>this book</i>). Unit 4 explains the test.</p>",
kk:"<p>Сілтеу, сұрау және кейбір белгісіздік сөздері (<i>this, which, some</i>) өзінен кейін зат есім тұрғанда детерминатив қызметінде жұмсалады (<i>this book</i>). Оны ажырату тәсілі 4-бөлімде түсіндіріледі.</p>",
ru:"<p>Указательные, вопросительные и некоторые неопределённые слова (<i>this, which, some</i>) при наличии последующего существительного выступают как детерминативы (<i>this book</i>). Тест для разграничения — в разделе 4.</p>"})[l];})},

{h:{en:"Case, person and gender",kk:"Септік, жақ және жыныс",ru:"Падеж, лицо и род"},
b:L3(function(l){return ({
en:"<p>Use the subject form when the pronoun is the subject of a finite verb, and the object form after a verb or a preposition. English gender is <b>natural</b>: <i>he</i> and <i>she</i> refer to people (and often to animals whose sex is known); <i>it</i> is used for things, abstract ideas and animals in general. Singular <i>they</i> is well established for a person whose gender is unknown or not relevant (Swan, 2016).</p>",
kk:"<p>Есімдік жіктелетін етістіктің бастауышы болса, атау формасын, ал етістік пен предлогтан кейін объектілік форманы қолданыңыз. Ағылшын тіліндегі жыныс — <b>табиғи</b> жыныс: <i>he</i> мен <i>she</i> адамдарға (кейде жынысы белгілі жануарларға) қатысты қолданылады; <i>it</i> заттарға, дерексіз ұғымдарға және жалпы жануарларға қолданылады. Жынысы белгісіз немесе маңызды емес адамға жекеше мағынада <i>they</i> қолдану қалыптасқан (Swan, 2016).</p>",
ru:"<p>Форма подлежащего употребляется, когда местоимение является подлежащим личного глагола, объектная форма — после глагола или предлога. Род в английском <b>естественный</b>: <i>he</i> и <i>she</i> обозначают людей (и иногда животных известного пола); <i>it</i> — предметы, абстрактные понятия и животных вообще. Единственное <i>they</i> закрепилось для человека, пол которого неизвестен или не важен (Swan, 2016).</p>"})[l]+
X(l,[["[pr:She] invited [pr:him] and [pr:me].",{en:"object forms after the verb <i>invited</i>.",kk:"<i>invited</i> етістігінен кейін объектілік формалар.",ru:"после глагола <i>invited</i> — объектные формы."}],
["The table is old, but [pr:it] is still strong.",{en:"<i>it</i> for an object: never <i>he</i> or <i>she</i>.",kk:"затқа <i>it</i> қолданылады, <i>he</i> немесе <i>she</i> емес.",ru:"для предмета только <i>it</i>, не <i>he</i>/<i>she</i>."}],
["If a student is late, [pr:they] should report to the office.",{en:"singular <i>they</i> for an unspecified person.",kk:"белгісіз адамға жекеше мағыналы <i>they</i>.",ru:"единственное <i>they</i> для неопределённого лица."}]])+
NB(l,"info",T_.kzru,{
en:"Kazakh has one third-person pronoun, <i>ол</i>, with no gender distinction (Muhamedowa, 2016), so <i>he/she</i> mix-ups are common. Russian assigns grammatical gender to all nouns (Timberlake, 2004), so learners may call a table <i>he</i> (<i>стол — он</i>). In English, only natural gender counts.",
kk:"Қазақ тілінде үшінші жақтың бір ғана есімдігі бар — <i>ол</i>, онда жыныс ажыратылмайды (Muhamedowa, 2016), сондықтан <i>he/she</i> есімдіктерін шатастыру жиі кездеседі. Орыс тілінде барлық зат есімнің грамматикалық тегі болады (Timberlake, 2004), сол себепті оқушылар үстелді <i>he</i> деп атауы мүмкін (<i>стол — он</i>). Ағылшын тілінде тек табиғи жыныс ескеріледі.",
ru:"В казахском одно местоимение третьего лица — <i>ол</i>, без различия рода (Muhamedowa, 2016), поэтому путаница <i>he/she</i> встречается часто. В русском все существительные имеют грамматический род (Timberlake, 2004), и учащиеся могут назвать стол <i>he</i> (<i>стол — он</i>). В английском значение имеет только естественный род."});})},

{h:{en:"Two pronouns with no meaning of their own",kk:"Өз мағынасы жоқ екі есімдік",ru:"Два местоимения без собственного значения"},
b:L3(function(l){return ({
en:"<p>English requires a subject in every finite clause, even when there is nothing to refer to. <b>Dummy <i>it</i></b> fills the subject position with weather, time and distance, and anticipates a later clause. <b>Existential <i>there</i></b> introduces something new into the conversation. Biber et al. (2021) treat existential <i>there</i> separately because it behaves differently from the place adverb <i>there</i>.</p>",
kk:"<p>Ағылшын тілінде әр жіктелетін сөйлемде бастауыш болуы міндетті, тіпті ол ештеңені білдірмесе де. <b>Формалды <i>it</i></b> ауа райы, уақыт және қашықтық туралы сөйлемдерде бастауыштың орнын толтырады және кейінгі бөлікті алдын ала көрсетеді. <b>Болмысты білдіретін <i>there</i></b> әңгімеге жаңа нәрсені енгізеді. Biber et al. (2021) бұл <i>there</i>-ді «сонда» мағынасындағы мекен үстеуінен бөлек қарастырады, өйткені оның қолданысы басқа.</p>",
ru:"<p>В английском в каждом личном предложении должно быть подлежащее, даже если ему нечего обозначать. <b>Формальное <i>it</i></b> занимает позицию подлежащего в высказываниях о погоде, времени и расстоянии и предваряет последующую часть предложения. <b>Бытийное <i>there</i></b> вводит в разговор что-то новое. Biber et al. (2021) рассматривают бытийное <i>there</i> отдельно, так как оно ведёт себя иначе, чем наречие места <i>there</i>.</p>"})[l]+
X(l,[["[pr:It]'s raining again. / [pr:It]'s ten kilometres to the airport.",null],
["[pr:It] is important to sleep well.",{en:"<i>it</i> anticipates the real subject, <i>to sleep well</i>.",kk:"<i>it</i> нақты бастауышты — <i>to sleep well</i> — алдын ала көрсетеді.",ru:"<i>it</i> предваряет истинное подлежащее <i>to sleep well</i>."}],
["[pr:There] is a pharmacy on the corner.",{en:"existential <i>there</i>; compare <i>Put it <b>there</b></i>, a place adverb.",kk:"болмысты білдіретін <i>there</i>; салыстырыңыз: <i>Put it <b>there</b></i> — мекен үстеуі.",ru:"бытийное <i>there</i>; сравните <i>Put it <b>there</b></i> — наречие места."}]]);})},

sec:[
{h:{en:"What determiners do",kk:"Детерминативтердің қызметі",ru:"Что делают детерминативы"},
b:L3(function(l){return ({
en:"<p>A determiner opens a noun phrase and tells the listener <b>which</b> or <b>how much</b> of something is meant: <i>the</i> book, <i>this</i> book, <i>my</i> book, <i>every</i> book, <i>two</i> books. Determiners do not describe qualities as adjectives do, and they cannot be graded: {x:a very the book} is impossible. Quirk et al. (1985) introduced determiners as a separate closed class; Huddleston and Pullum (2002) call the class <b>determinatives</b> and keep the term <b>determiner</b> for the function, because a genitive phrase can also fill that slot (<i><b>the teacher's</b> book</i>).</p><p>One rule follows directly: a <b>singular count noun</b> cannot stand alone in a noun phrase. It needs a determiner: {x:I bought car} → <i>I bought <b>a</b> car</i>.</p>",
kk:"<p>Детерминатив зат есімді тіркесті ашады және тыңдаушыға нәрсенің <b>қайсысы</b> немесе <b>қаншасы</b> туралы айтылып тұрғанын білдіреді: <i>the</i> book, <i>this</i> book, <i>my</i> book, <i>every</i> book, <i>two</i> books. Детерминативтер сын есім сияқты сапаны сипаттамайды және шырай қабылдамайды: {x:a very the book} деп айтуға болмайды. Quirk et al. (1985) детерминативтерді жеке жабық тап ретінде бөліп көрсетті; Huddleston мен Pullum (2002) бұл тапты <b>determinatives</b> деп атайды, ал <b>determiner</b> терминін қызметке қалдырады, өйткені бұл орынды тәуелдік тіркес те толтыра алады (<i><b>the teacher's</b> book</i>).</p><p>Осыдан бір маңызды ереже шығады: <b>жекеше саналатын зат есім</b> тіркесте жалғыз тұра алмайды. Оған детерминатив керек: {x:I bought car} → <i>I bought <b>a</b> car</i>.</p>",
ru:"<p>Детерминатив открывает именную группу и сообщает слушателю, <b>какой именно</b> предмет или <b>сколько</b> его имеется в виду: <i>the</i> book, <i>this</i> book, <i>my</i> book, <i>every</i> book, <i>two</i> books. В отличие от прилагательных детерминативы не описывают качества и не имеют степеней: {x:a very the book} невозможно. Quirk et al. (1985) выделили детерминативы в отдельный закрытый класс; Huddleston и Pullum (2002) называют класс <b>determinatives</b>, а термин <b>determiner</b> оставляют для функции, так как эту позицию может занимать и притяжательная группа (<i><b>the teacher's</b> book</i>).</p><p>Отсюда важное правило: <b>исчисляемое существительное в ед. ч.</b> не может стоять в группе одно. Ему нужен детерминатив: {x:I bought car} → <i>I bought <b>a</b> car</i>.</p>"})[l]+
TB(l,{en:["Type","Members","Example"],kk:["Түрі","Құрамы","Мысал"],ru:["Тип","Состав","Пример"]},[
[{en:"Articles",kk:"Артикльдер",ru:"Артикли"},"a/an, the","[det:the] report"],
[{en:"Demonstratives",kk:"Сілтеу",ru:"Указательные"},"this, that, these, those","[det:those] shoes"],
[{en:"Possessives",kk:"Тәуелдік",ru:"Притяжательные"},"my, your, his, her, its, our, their","[det:their] flat"],

{h:{en:"Articles: a/an, the, or no article",kk:"Артикльдер: a/an, the немесе артикльсіз",ru:"Артикли: a/an, the или без артикля"},
b:L3(function(l){return ({
en:"<p>The choice of article depends on what the speaker assumes the listener can <b>identify</b>. <b>The</b> signals that the listener can tell which particular thing is meant, because it was mentioned before, because it is unique in the situation, or because the rest of the phrase specifies it. <b>A/an</b> introduces a singular count noun without assuming the listener can identify it; <i>an</i> is used before a vowel <b>sound</b> (<i>an hour, a university</i>). <b>No article</b> is used with plural and non-count nouns when they refer to things in general (Quirk et al., 1985; Swan, 2016).</p>",
kk:"<p>Артикльдің таңдалуы сөйлеушінің тыңдаушы нені <b>анықтай алады</b> деп ойлайтынына байланысты. <b>The</b> тыңдаушы нақты қай нәрсе туралы айтылып тұрғанын біледі дегенді білдіреді: ол бұрын аталған, сол жағдайда жалғыз немесе тіркестің қалған бөлігі оны нақтылайды. <b>A/an</b> жекеше саналатын зат есімді тыңдаушы оны таниды деп болжамай енгізеді; <i>an</i> дауысты <b>дыбыстың</b> алдында қолданылады (<i>an hour, a university</i>). Көпше және саналмайтын зат есімдер жалпы мағынада қолданылғанда <b>артикль қойылмайды</b> (Quirk et al., 1985; Swan, 2016).</p>",
ru:"<p>Выбор артикля зависит от того, что, по мнению говорящего, слушатель может <b>опознать</b>. <b>The</b> сигнализирует, что слушатель знает, о каком именно предмете речь: он уже упоминался, он единственный в данной ситуации или его уточняет остальная часть группы. <b>A/an</b> вводит исчисляемое существительное в ед. ч., не предполагая, что слушатель его опознает; <i>an</i> ставится перед гласным <b>звуком</b> (<i>an hour, a university</i>). <b>Без артикля</b> употребляются существительные во мн. ч. и неисчисляемые, когда речь идёт о предметах вообще (Quirk et al., 1985; Swan, 2016).</p>"})[l]+
X(l,[["I saw [det:a] fox in the garden. [det:The] fox was eating apples.",{en:"first mention → <i>a</i>; second mention, now identifiable → <i>the</i>.",kk:"алғаш аталуы → <i>a</i>; қайта аталуы, енді белгілі → <i>the</i>.",ru:"первое упоминание → <i>a</i>; повторное, уже известное → <i>the</i>."}],
["Could you close [det:the] window?",{en:"unique in the situation: the listener knows which window.",kk:"сол жағдайда біреу ғана: тыңдаушы қай терезе екенін біледі.",ru:"единственный в ситуации: слушатель знает, какое окно."}],
["[det:The] book that you lent me was excellent.",{en:"the relative clause makes the book identifiable.",kk:"қатыстық бағыныңқы кітапты нақтылайды.",ru:"придаточное предложение делает книгу определённой."}],
["Cats sleep a lot. / Water boils at 100°C.",{en:"plural and non-count nouns in general statements take no article.",kk:"жалпы тұжырымдағы көпше және саналмайтын зат есімдер артикльсіз.",ru:"мн. ч. и неисчисляемые в общих утверждениях — без артикля."}]])+
NB(l,"info",T_.kzru,{
en:"Neither Kazakh nor Russian has articles, and article errors are among the most frequent errors documented for Kazakhstani learners (Argynbayev et al., 2014). Research with Russian speakers shows that their errors are systematic, not random: learners often use <i>the</i> for something specific that the listener cannot yet identify (Ionin et al., 2004). The question to ask is always <i>Can my listener identify it?</i>, not <i>Is it a particular thing?</i>",
kk:"Қазақ тілінде де, орыс тілінде де артикль жоқ, және артикль қателері қазақстандық оқушыларда ең жиі тіркелетін қателердің бірі (Argynbayev et al., 2014). Орыс тілінде сөйлейтіндермен жүргізілген зерттеулер бұл қателердің кездейсоқ емес, жүйелі екенін көрсетеді: оқушылар тыңдаушыға әлі белгісіз, бірақ нақты бір нәрсе үшін жиі <i>the</i> қолданады (Ionin et al., 2004). Әрдайым <i>Бұл нақты бір зат па?</i> деп емес, <i>Тыңдаушым оны анықтай ала ма?</i> деп сұраңыз.",
ru:"Ни в казахском, ни в русском нет артиклей, и ошибки в артиклях — одни из самых частых, зафиксированных у казахстанских учащихся (Argynbayev et al., 2014). Исследования с русскоязычными учащимися показывают, что ошибки не случайны, а системны: учащиеся часто употребляют <i>the</i> для конкретного предмета, который слушатель ещё не может опознать (Ionin et al., 2004). Задавайте себе вопрос не <i>Это конкретный предмет?</i>, а <i>Может ли слушатель его опознать?</i>"});})},

{h:{en:"Quantifiers and countability",kk:"Мөлшер сөздері және саналу",ru:"Квантификаторы и исчисляемость"},
b:L3(function(l){return ({
en:"<p>Several quantifiers are restricted to count or non-count nouns, so they depend directly on Unit 2. The pairs <i>few/a few</i> and <i>little/a little</i> also differ in meaning: without <i>a</i> they stress how small the amount is; with <i>a</i> they present it as some, enough to matter (Swan, 2016).</p>",
kk:"<p>Кейбір мөлшер сөздері тек саналатын немесе тек саналмайтын зат есімдермен қолданылады, сондықтан олар тікелей 2-бөлімге байланысты. <i>few/a few</i> және <i>little/a little</i> жұптарының мағынасы да әртүрлі: <i>a</i>-сыз мөлшердің аз екенін баса көрсетеді, ал <i>a</i>-мен оны «біршама, жеткілікті» деп береді (Swan, 2016).</p>",
ru:"<p>Некоторые квантификаторы употребляются только с исчисляемыми или только с неисчисляемыми существительными, поэтому они напрямую связаны с разделом 2. Пары <i>few/a few</i> и <i>little/a little</i> различаются и по значению: без <i>a</i> подчёркивается недостаточность, с <i>a</i> — наличие некоторого количества (Swan, 2016).</p>"})[l]+
TB(l,{en:["With plural count nouns","With non-count nouns","With both"],kk:["Көпше саналатынмен","Саналмайтынмен","Екеуімен де"],ru:["С исчисляемыми во мн. ч.","С неисчисляемыми","С обоими"]},[

{h:{en:"Order of determiners",kk:"Детерминативтердің реті",ru:"Порядок детерминативов"},
b:L3(function(l){return ({
en:"<p>When determiners combine, they follow a fixed order. Quirk et al. (1985) distinguish <b>predeterminers</b> (<i>all, both, half, double</i>), <b>central determiners</b> (articles, demonstratives, possessives) and <b>postdeterminers</b> (numerals, <i>many, few, other</i>). Only one central determiner is allowed: {x:the my book} must be <i>my book</i> or <i>the book of mine</i>.</p>",
kk:"<p>Детерминативтер қатар келгенде, белгілі бір тәртіппен орналасады. Quirk et al. (1985) <b>алдыңғы детерминативтерді</b> (<i>all, both, half, double</i>), <b>орталық детерминативтерді</b> (артикльдер, сілтеу, тәуелдік сөздер) және <b>кейінгі детерминативтерді</b> (сан есімдер, <i>many, few, other</i>) ажыратады. Тек бір орталық детерминатив қолданылады: {x:the my book} емес, <i>my book</i> немесе <i>the book of mine</i>.</p>",
ru:"<p>При сочетании детерминативы следуют строгому порядку. Quirk et al. (1985) выделяют <b>преддетерминативы</b> (<i>all, both, half, double</i>), <b>центральные детерминативы</b> (артикли, указательные, притяжательные) и <b>постдетерминативы</b> (числительные, <i>many, few, other</i>). Центральный детерминатив может быть только один: не {x:the my book}, а <i>my book</i> или <i>the book of mine</i>.</p>"})[l]+
TB(l,{en:["Predeterminer","Central","Postdeterminer","Noun"],kk:["Алдыңғы","Орталық","Кейінгі","Зат есім"],ru:["Преддетерминатив","Центральный","Постдетерминатив","Существительное"]},[
["all","the","other","students"],["both","my","—","parents"],["half","the","—","class"],["—","these","two","rooms"]]);})},

{tag:T_.conf,h:{en:"Determiner or pronoun?",kk:"Детерминатив пе, әлде есімдік пе?",ru:"Детерминатив или местоимение?"},
b:L3(function(l){return ({
en:"<p>Many words can be either. The test is simple: if a noun follows and the word introduces it, it is a determiner; if the word stands alone as the whole noun phrase, it is a pronoun. Possessives have separate forms for the two jobs (<i>my/mine, your/yours</i>), which shows that English treats them as different (Quirk et al., 1985).</p>",
kk:"<p>Көп сөздер екеуі де бола алады. Тексеру тәсілі қарапайым: егер сөзден кейін зат есім келіп, сөз оны енгізіп тұрса — бұл детерминатив; егер сөз тұтас зат есімді тіркестің орнында жалғыз тұрса — бұл есімдік. Тәуелдік сөздердің екі қызмет үшін бөлек формалары бар (<i>my/mine, your/yours</i>), бұл ағылшын тілінің оларды ажырататынын көрсетеді (Quirk et al., 1985).</p>",
ru:"<p>Многие слова могут быть и тем, и другим. Тест простой: если за словом следует существительное, которое оно вводит, — это детерминатив; если слово само составляет всю именную группу — местоимение. У притяжательных слов для двух функций есть разные формы (<i>my/mine, your/yours</i>), что показывает различие этих употреблений (Quirk et al., 1985).</p>"})[l]+
TB(l,{en:["Determiner","Pronoun"],kk:["Детерминатив","Есімдік"],ru:["Детерминатив","Местоимение"]},[
["[det:This] coffee is cold.","[pr:This] is cold."],["[det:Some] students left early.","[pr:Some] left early."],["It's [det:my] phone.","It's [pr:mine]."]]);})}
],

{h:{en:"What makes a word a verb",kk:"Сөзді етістік ететін белгілер",ru:"Что делает слово глаголом"},
b:L3(function(l){return ({
en:"<p>The verb is the centre of the clause. It is the only class that carries <b>tense</b> (<i>walks/walked</i>) and agrees with the subject (<i>she walks</i>). An English lexical verb has at most five forms, a strikingly small set compared with Kazakh or Russian (Huddleston &amp; Pullum, 2002; Quirk et al., 1985). Forms that carry tense are <b>finite</b>; the others are <b>non-finite</b> and appear after auxiliaries or in subordinate structures (Unit 12).</p>",
kk:"<p>Етістік — сөйлемнің орталығы. Тек етістік қана <b>шақты</b> білдіреді (<i>walks/walked</i>) және бастауышпен қиысады (<i>she walks</i>). Ағылшын тіліндегі негізгі етістіктің ең көбі бес формасы бар, бұл қазақ немесе орыс тілімен салыстырғанда өте аз (Huddleston &amp; Pullum, 2002; Quirk et al., 1985). Шақты білдіретін формалар <b>жіктелетін (finite)</b> деп аталады; қалғандары <b>жіктелмейтін (non-finite)</b> формалар, олар көмекші етістіктен кейін немесе бағыныңқы құрылымдарда қолданылады (12-бөлім).</p>",
ru:"<p>Глагол — центр предложения. Только он выражает <b>время</b> (<i>walks/walked</i>) и согласуется с подлежащим (<i>she walks</i>). У английского смыслового глагола не более пяти форм — поразительно мало по сравнению с казахским или русским (Huddleston &amp; Pullum, 2002; Quirk et al., 1985). Формы, выражающие время, называются <b>личными (finite)</b>; остальные — <b>неличные (non-finite)</b>, они стоят после вспомогательных глаголов или в зависимых конструкциях (раздел 12).</p>"})[l]+

{h:{en:"Lexical, primary and modal verbs",kk:"Негізгі, бастапқы және модальді етістіктер",ru:"Смысловые, первичные и модальные глаголы"},
b:L3(function(l){return ({
en:"<p>Quirk et al. (1985) and Biber et al. (2021) divide verbs into three groups. <b>Lexical verbs</b> (<i>run, think, give</i>) are an open class that carries the main meaning. The <b>primary verbs</b> <i>be, have</i> and <i>do</i> can be either lexical verbs or auxiliaries. The <b>modal verbs</b> (<i>can, must, will</i> and others) are always auxiliaries. This unit deals with lexical verbs; Unit 6 is devoted to auxiliaries and modals.</p>",
kk:"<p>Quirk et al. (1985) және Biber et al. (2021) етістіктерді үш топқа бөледі. <b>Негізгі (лексикалық) етістіктер</b> (<i>run, think, give</i>) — негізгі мағынаны беретін ашық тап. <b>Бастапқы етістіктер</b> <i>be, have</i> және <i>do</i> негізгі етістік те, көмекші етістік те бола алады. <b>Модальді етістіктер</b> (<i>can, must, will</i> және т.б.) әрқашан көмекші. Бұл бөлім негізгі етістіктерге арналған; көмекші және модальді етістіктер 6-бөлімде қарастырылады.</p>",
ru:"<p>Quirk et al. (1985) и Biber et al. (2021) делят глаголы на три группы. <b>Смысловые глаголы</b> (<i>run, think, give</i>) — открытый класс, несущий основное значение. <b>Первичные глаголы</b> <i>be, have</i> и <i>do</i> могут быть как смысловыми, так и вспомогательными. <b>Модальные глаголы</b> (<i>can, must, will</i> и др.) всегда вспомогательные. Этот раздел посвящён смысловым глаголам; вспомогательным и модальным — раздел 6.</p>"})[l]+
X(l,[["She [v:has] two brothers.",{en:"<i>has</i> is the lexical verb (possession).",kk:"<i>has</i> — негізгі етістік (иелік).",ru:"<i>has</i> — смысловой глагол (обладание)."}],
["She [aux:has] [v:finished] the report.",{en:"<i>has</i> is an auxiliary; <i>finished</i> is the lexical verb.",kk:"<i>has</i> — көмекші етістік; <i>finished</i> — негізгі етістік.",ru:"<i>has</i> — вспомогательный; <i>finished</i> — смысловой глагол."}]]);})},

{h:{en:"What a verb needs after it",kk:"Етістіктің өзінен кейін талап ететіні",ru:"Чего требует глагол после себя"},
b:L3(function(l){return ({
en:"<p>Every lexical verb selects the elements that must follow it. This property is called <b>valency</b> or <b>complementation</b>. A sentence missing a required element is incomplete: <i>She put the book</i> lacks the place that <i>put</i> requires. Learning a verb therefore means learning its pattern, not only its meaning (Huddleston &amp; Pullum, 2002).</p>",
kk:"<p>Әр негізгі етістік өзінен кейін міндетті түрде келетін элементтерді «таңдайды». Бұл қасиет <b>валенттілік</b> немесе <b>толықтауыштық құрылым</b> деп аталады. Қажетті элементі жоқ сөйлем толық емес: <i>She put the book</i> сөйлемінде <i>put</i> етістігі талап ететін мекен жоқ. Сондықтан етістікті үйрену — оның мағынасын ғана емес, құрылымын да үйрену (Huddleston &amp; Pullum, 2002).</p>",
ru:"<p>Каждый смысловой глагол «выбирает» элементы, которые обязательно за ним следуют. Это свойство называется <b>валентностью</b> или <b>управлением</b>. Предложение без обязательного элемента неполно: в <i>She put the book</i> не хватает обстоятельства места, которого требует <i>put</i>. Поэтому выучить глагол — значит выучить его модель, а не только значение (Huddleston &amp; Pullum, 2002).</p>"})[l]+

{h:{en:"Linking verbs and action verbs",kk:"Байланыстырушы және қимыл етістіктері",ru:"Глаголы-связки и глаголы действия"},
b:L3(function(l){return ({
en:"<p>A <b>linking verb</b> (<i>be, seem, become, look, sound, smell, taste, feel, get</i>) connects the subject to a description of it. What follows describes the subject, so it is an <b>adjective</b> (or a noun phrase), not an adverb. Several of these verbs are also action verbs with a different meaning, and then an adverb is natural. The test: can you replace the verb with <i>be</i> and keep a similar meaning? (Quirk et al., 1985).</p>",
kk:"<p><b>Байланыстырушы етістік</b> (<i>be, seem, become, look, sound, smell, taste, feel, get</i>) бастауышты оның сипаттамасымен байланыстырады. Одан кейінгі сөз бастауышты сипаттайтындықтан, ол үстеу емес, <b>сын есім</b> (немесе зат есімді тіркес) болады. Бұл етістіктердің бірнешеуі басқа мағынада қимыл етістігі де бола алады, ондайда үстеу орынды. Тексеру тәсілі: етістікті <i>be</i>-мен алмастырғанда мағына ұқсас болып қала ма? (Quirk et al., 1985).</p>",
ru:"<p><b>Глагол-связка</b> (<i>be, seem, become, look, sound, smell, taste, feel, get</i>) соединяет подлежащее с его характеристикой. То, что следует за связкой, описывает подлежащее, поэтому это <b>прилагательное</b> (или именная группа), а не наречие. Некоторые из этих глаголов имеют и значение действия, и тогда естественно наречие. Тест: можно ли заменить глагол на <i>be</i> без большой потери смысла? (Quirk et al., 1985).</p>"})[l]+

en:"Russian usually omits the present tense of <i>быть</i> (<i>Она врач</i>), so learners may write {x:She doctor} or {x:He very tired} (Timberlake, 2004). In English the linking verb is obligatory: <i>She is a doctor. He is very tired.</i>",
kk:"Орыс тілінде осы шақта <i>быть</i> етістігі әдетте түсіріліп айтылады (<i>Она врач</i>), сондықтан оқушылар {x:She doctor} немесе {x:He very tired} деп жазуы мүмкін (Timberlake, 2004). Ағылшын тілінде байланыстырушы етістік міндетті: <i>She is a doctor. He is very tired.</i>",
ru:"В русском настоящее время <i>быть</i> обычно опускается (<i>Она врач</i>), поэтому учащиеся пишут {x:She doctor} или {x:He very tired} (Timberlake, 2004). В английском связка обязательна: <i>She is a doctor. He is very tired.</i>"});})},

{h:{en:"Dynamic and stative verbs",kk:"Қимыл және қалып-күй етістіктері",ru:"Динамические и статические глаголы"},
b:L3(function(l){return ({
en:"<p>Dynamic verbs describe actions and events (<i>run, write, change</i>) and occur freely in progressive forms. <b>Stative verbs</b> describe states of mind, possession, senses and relations (<i>know, believe, own, belong, contain, seem</i>) and are normally not used in the progressive. Many verbs have both a stative and a dynamic meaning, and the progressive is possible only with the dynamic one (Quirk et al., 1985; Swan, 2016).</p>",
kk:"<p>Қимыл етістіктері әрекеттер мен оқиғаларды білдіреді (<i>run, write, change</i>) және созылыңқы формада еркін қолданылады. <b>Қалып-күй етістіктері</b> ойлау, иелену, сезім мүшелері және қатынастарды білдіреді (<i>know, believe, own, belong, contain, seem</i>), олар әдетте созылыңқы формада қолданылмайды. Көп етістіктің әрі қалып-күй, әрі қимыл мағынасы бар, созылыңқы форма тек қимыл мағынасында мүмкін (Quirk et al., 1985; Swan, 2016).</p>",
ru:"<p>Динамические глаголы обозначают действия и события (<i>run, write, change</i>) и свободно употребляются в продолженных формах. <b>Статические глаголы</b> обозначают состояния сознания, обладание, восприятие и отношения (<i>know, believe, own, belong, contain, seem</i>) и обычно не употребляются в продолженной форме. У многих глаголов есть оба значения, и продолженная форма возможна только в динамическом (Quirk et al., 1985; Swan, 2016).</p>"})[l]+
X(l,[["{x:I am knowing the answer.} → I [v:know] the answer.",{en:"<i>know</i> describes a mental state.",kk:"<i>know</i> ойлау күйін білдіреді.",ru:"<i>know</i> обозначает состояние сознания."}],
["I [v:think] it's a good idea. / I [aux:'m] [v:thinking] about the problem.",{en:"<i>think</i> = believe (stative) vs. think = consider (dynamic).",kk:"<i>think</i> = сену (қалып-күй) және ойлану (қимыл).",ru:"<i>think</i> = считать (статическое) и обдумывать (динамическое)."}],
["She [v:has] a car. / She [aux:'s] [v:having] lunch.",{en:"possession (stative) vs. an activity (dynamic).",kk:"иелену (қалып-күй) және әрекет (қимыл).",ru:"обладание (статическое) и действие (динамическое)."}]]);})}
],

sec:[
{h:{en:"How auxiliaries differ from lexical verbs",kk:"Көмекші етістіктің негізгі етістіктен айырмасы",ru:"Чем вспомогательные глаголы отличаются от смысловых"},
b:L3(function(l){return ({
en:"<p>Auxiliaries come before a lexical verb and add grammatical information: aspect, voice, modality, or the support needed for questions and negatives. Huddleston and Pullum (2002) define the class by four syntactic properties, often remembered as <b>NICE</b>. Lexical verbs fail all four tests in standard English; auxiliaries pass them. The one important exception is <i>be</i>: even when it is the only verb, it passes every test (<i>She isn't a nurse. Is she a nurse?</i>). For this reason Huddleston and Pullum classify every use of <i>be</i> as an auxiliary, while Quirk et al. (1985) call it a main verb when it stands alone. This course follows Quirk et al. and labels it a lexical (main) verb in that use.</p>",
kk:"<p>Көмекші етістіктер негізгі етістіктің алдында тұрып, грамматикалық ақпарат қосады: аспект, етіс, модальдық немесе сұрақ пен болымсыздыққа қажетті көмек. Huddleston мен Pullum (2002) бұл тапты төрт синтаксистік белгі арқылы анықтайды, оларды көбіне <b>NICE</b> деп есте сақтайды. Әдеби ағылшын тілінде негізгі етістіктер бұл төрт тексерістің ешқайсысынан өтпейді, ал көмекші етістіктер өтеді. Маңызды бір ерекшелік — <i>be</i>: ол сөйлемдегі жалғыз етістік болса да, барлық тексерістен өтеді (<i>She isn't a nurse. Is she a nurse?</i>). Сондықтан Huddleston мен Pullum <i>be</i> етістігінің барлық қолданысын көмекші етістік деп санайды, ал Quirk et al. (1985) ол жалғыз тұрғанда оны негізгі етістік деп атайды. Бұл курс Quirk et al. жүйесін ұстанып, мұндай қолданыста оны негізгі (лексикалық) етістік деп белгілейді.</p>",
ru:"<p>Вспомогательные глаголы стоят перед смысловым и добавляют грамматическую информацию: вид, залог, модальность или поддержку, необходимую для вопроса и отрицания. Huddleston и Pullum (2002) определяют этот класс четырьмя синтаксическими свойствами, которые часто запоминают как <b>NICE</b>. Смысловые глаголы в нормативном английском не проходят ни одного теста, вспомогательные — проходят все. Важное исключение — <i>be</i>: даже будучи единственным глаголом, он проходит все тесты (<i>She isn't a nurse. Is she a nurse?</i>). Поэтому Huddleston и Pullum считают вспомогательным любое употребление <i>be</i>, а Quirk et al. (1985) называют его основным глаголом, когда он стоит один. Этот курс следует Quirk et al. и в таком употреблении относит его к смысловым (основным) глаголам.</p>"})[l]+
TB(l,{en:["Property","Auxiliary","Lexical verb"],kk:["Белгі","Көмекші етістік","Негізгі етістік"],ru:["Свойство","Вспомогательный","Смысловой"]},[
[{en:"<b>N</b>egation with <i>not</i>",kk:"<i>not</i>-пен <b>б</b>олымсыздық (Negation)",ru:"<b>О</b>трицание с <i>not</i> (Negation)"},"She [aux:can]not swim.","{x:She swims not.} → She doesn't swim."],
[{en:"<b>I</b>nversion with the subject",kk:"Бастауышпен <b>о</b>рын ауыстыру (Inversion)",ru:"<b>И</b>нверсия с подлежащим (Inversion)"},"[aux:Can] she swim?","{x:Swims she?} → Does she swim?"],
[{en:"<b>C</b>ode (standing for a repeated verb phrase)",kk:"Қайталанатын етістікті тіркестің орнына жүру (Code)",ru:"Замещение повторяемой глагольной группы (Code)"},"Yes, she [aux:can].","Yes, she does."],
[{en:"<b>E</b>mphasis by stress",kk:"Екпін арқылы <b>к</b>үшейту (Emphasis)",ru:"<b>У</b>силение ударением (Emphasis)"},"She CAN swim!","She DOES swim!"]
])+({en:"<p>The right-hand column shows the key consequence: when a lexical verb needs any of these four operations, English inserts <i>do</i>. This is called <b>do-support</b>.</p>",kk:"<p>Оң жақ баған басты салдарды көрсетеді: негізгі етістікке осы төрт операцияның бірі қажет болғанда, ағылшын тілі <i>do</i> етістігін қосады. Бұл <b>do-көмегі (do-support)</b> деп аталады.</p>",ru:"<p>Правый столбец показывает главное следствие: когда смысловому глаголу нужна одна из этих четырёх операций, английский вставляет <i>do</i>. Это называется <b>do-поддержкой (do-support)</b>.</p>"})[l];})},

])+NB(l,"info",T_.kzru,{
en:"Kazakh and Russian form questions without an auxiliary, so learners produce {x:Where he live?} or {x:What need you from me?} Word-order errors in questions were among the most frequent errors in a study of Kazakhstani university students translating from Russian into English (Argynbayev et al., 2014). In English, a question with a lexical verb needs <i>do/does/did</i>, and the lexical verb returns to its base form: <i>Where does he live?</i>",
kk:"Қазақ және орыс тілдерінде сұрақ көмекші етістіксіз жасалады, сондықтан оқушылар {x:Where he live?} немесе {x:What need you from me?} деп айтады. Орыс тілінен ағылшын тіліне аударған қазақстандық студенттерге жүргізілген зерттеуде сұраулы сөйлемдегі сөз тәртібі қателері ең жиі кездесетін қателердің қатарында болған (Argynbayev et al., 2014). Ағылшын тілінде негізгі етістігі бар сұраққа <i>do/does/did</i> қажет, ал негізгі етістік бастапқы түріне оралады: <i>Where does he live?</i>",
ru:"В казахском и русском вопрос образуется без вспомогательного глагола, поэтому учащиеся говорят {x:Where he live?} или {x:What need you from me?} Ошибки порядка слов в вопросах были среди самых частых в исследовании казахстанских студентов, переводивших с русского на английский (Argynbayev et al., 2014). В английском вопрос со смысловым глаголом требует <i>do/does/did</i>, а смысловой глагол возвращается в базовую форму: <i>Where does he live?</i>"});})},

{h:{en:"The modal verbs",kk:"Модальді етістіктер",ru:"Модальные глаголы"},
b:L3(function(l){return ({
en:"<p>The central modals are <i>can, could, may, might, must, shall, should, will, would</i>. They share a distinctive grammar: no <i>-s</i> in the third person, no infinitive or <i>-ing</i> form, and a bare infinitive after them (<i>she can swim</i>, not {x:she can to swim}). Because they have no non-finite forms, two modals cannot follow each other: {x:will can} becomes <i>will be able to</i> (Quirk et al., 1985). Their meanings fall into two broad areas: possibility and certainty, and obligation and permission.</p>",
kk:"<p>Негізгі модальдер: <i>can, could, may, might, must, shall, should, will, would</i>. Олардың грамматикасы ерекше: үшінші жақта <i>-s</i> жалғанбайды, тұйық етістік және <i>-ing</i> формалары жоқ, өзінен кейін <i>to</i>-сыз тұйық етістік келеді (<i>she can swim</i>, {x:she can to swim} емес). Жіктелмейтін формалары болмағандықтан, екі модаль қатар тұра алмайды: {x:will can} орнына <i>will be able to</i> айтылады (Quirk et al., 1985). Олардың мағыналары екі негізгі салаға бөлінеді: мүмкіндік пен сенімділік, міндет пен рұқсат.</p>",
ru:"<p>Центральные модальные глаголы: <i>can, could, may, might, must, shall, should, will, would</i>. У них особая грамматика: нет <i>-s</i> в 3-м лице, нет инфинитива и формы на <i>-ing</i>, после них — инфинитив без <i>to</i> (<i>she can swim</i>, а не {x:she can to swim}). Поскольку у них нет неличных форм, два модальных глагола не могут следовать друг за другом: вместо {x:will can} говорят <i>will be able to</i> (Quirk et al., 1985). Их значения относятся к двум областям: возможность и уверенность; обязанность и разрешение.</p>"})[l]+
TB(l,{en:["Modal","Possibility / certainty","Obligation / permission / ability"],kk:["Модаль","Мүмкіндік / сенімділік","Міндет / рұқсат / қабілет"],ru:["Модальный","Возможность / уверенность","Обязанность / разрешение / способность"]},[
["can / could","It [aux:could] rain later.","She [aux:can] speak three languages."],
["may / might","He [aux:might] be at home.","[aux:May] I come in?"],
["must","That [aux:must] be the right address.","You [aux:must] wear a seat belt."],
["should","They [aux:should] arrive by six.","You [aux:should] see a doctor."],
["will / would","That [aux:will] be the courier.","[aux:Would] you help me?"]
])+({en:"<h3>Marginal modals and semi-modals</h3><p><i>Ought to, need, dare</i> and <i>used to</i> share only some modal properties; <i>have to, be able to, be going to</i> behave like ordinary verbs and can therefore combine with modals (<i>will have to</i>). <i>Need</i> and <i>dare</i> are modal mainly in negatives and questions (<i>You needn't come</i>) and lexical elsewhere (<i>You don't need to come</i>) (Quirk et al., 1985; Swan, 2016).</p>",
kk:"<h3>Шеткері және жартылай модальдер</h3><p><i>Ought to, need, dare</i> және <i>used to</i> модальдердің кейбір белгілеріне ғана ие; <i>have to, be able to, be going to</i> кәдімгі етістік сияқты, сондықтан модальмен тіркесе алады (<i>will have to</i>). <i>Need</i> пен <i>dare</i> негізінен болымсыз және сұраулы сөйлемде модаль ретінде (<i>You needn't come</i>), ал басқа жағдайда негізгі етістік ретінде қолданылады (<i>You don't need to come</i>) (Quirk et al., 1985; Swan, 2016).</p>",
ru:"<h3>Маргинальные и полумодальные глаголы</h3><p><i>Ought to, need, dare</i> и <i>used to</i> обладают лишь частью модальных свойств; <i>have to, be able to, be going to</i> ведут себя как обычные глаголы и поэтому сочетаются с модальными (<i>will have to</i>). <i>Need</i> и <i>dare</i> модальны в основном в отрицаниях и вопросах (<i>You needn't come</i>), а в остальных случаях это смысловые глаголы (<i>You don't need to come</i>) (Quirk et al., 1985; Swan, 2016).</p>"})[l];})},
