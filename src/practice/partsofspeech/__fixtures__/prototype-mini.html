sec:[
{h:{en:"What makes a word an adjective",kk:"Сөзді сын есім ететін белгілер",ru:"Что делает слово прилагательным"},
b:L3(function(l){return ({
en:"<p>Typical adjectives describe a quality of a noun's referent, and they have two characteristic positions: <b>attributive</b>, between a determiner and a noun (<i>a <b>quiet</b> street</i>), and <b>predicative</b>, after a linking verb (<i>the street is <b>quiet</b></i>). Typical adjectives are also <b>gradable</b>: they accept degree words such as <i>very, quite, too</i> and have comparative and superlative forms (Huddleston &amp; Pullum, 2002). These properties give you two quick tests: <i>very ___</i> and <i>It seems ___</i>. Unlike Kazakh and Russian adjectives, English adjectives never change form to agree with the noun: <i>a quiet street, two quiet streets</i>.</p>",
kk:"<p>Тән сын есімдер зат есім білдіретін нәрсенің сапасын сипаттайды және екі тән орында тұрады: <b>анықтауыш</b> ретінде детерминатив пен зат есімнің арасында (<i>a <b>quiet</b> street</i>) және <b>баяндауыштың есім бөлігі</b> ретінде байланыстырушы етістіктен кейін (<i>the street is <b>quiet</b></i>). Тән сын есімдер <b>шырай</b> қабылдай алады: <i>very, quite, too</i> сияқты дәреже сөздерімен тіркеседі және салыстырмалы, күшейтпелі формалары болады (Huddleston &amp; Pullum, 2002). Осыдан екі жылдам тексеру шығады: <i>very ___</i> және <i>It seems ___</i>. Қазақ және орыс тілдерінен айырмашылығы, ағылшын сын есімі зат есіммен қиыспайды және формасын өзгертпейді: <i>a quiet street, two quiet streets</i>.</p>",
ru:"<p>Типичные прилагательные обозначают качество предмета и имеют две характерные позиции: <b>атрибутивную</b> — между детерминативом и существительным (<i>a <b>quiet</b> street</i>) и <b>предикативную</b> — после связки (<i>the street is <b>quiet</b></i>). Типичные прилагательные также <b>градуальны</b>: сочетаются со словами степени <i>very, quite, too</i> и имеют сравнительную и превосходную степени (Huddleston &amp; Pullum, 2002). Отсюда два быстрых теста: <i>very ___</i> и <i>It seems ___</i>. В отличие от казахского и русского, английское прилагательное не согласуется с существительным и не меняет форму: <i>a quiet street, two quiet streets</i>.</p>"})[l]+

{h:{en:"Adjectives that break the pattern",kk:"Әдеттегі заңдылыққа бағынбайтын сын есімдер",ru:"Прилагательные-исключения"},
b:L3(function(l){return ({
en:"<p>Not every adjective has both positions. Quirk et al. (1985) and Huddleston and Pullum (2002) describe a group used only attributively and another used only predicatively. Many predicative-only adjectives begin with <i>a-</i>.</p>",
kk:"<p>Әр сын есім екі орында да тұра бермейді. Quirk et al. (1985) және Huddleston мен Pullum (2002) тек анықтауыш болатын және тек баяндауыш болатын сын есімдер топтарын сипаттайды. Тек баяндауыш болатын сын есімдердің көбі <i>a-</i>-дан басталады.</p>",
ru:"<p>Не все прилагательные употребляются в обеих позициях. Quirk et al. (1985) и Huddleston и Pullum (2002) описывают группу только атрибутивных и группу только предикативных прилагательных. Многие предикативные начинаются на <i>a-</i>.</p>"})[l]+

{h:{en:"Gradability and comparison",kk:"Шырай және салыстыру",ru:"Градуальность и степени сравнения"},
b:L3(function(l){return ({
en:"<p>One-syllable adjectives normally take <i>-er/-est</i>; adjectives of three or more syllables take <i>more/most</i>; two-syllable adjectives vary, with those ending in <i>-y</i> usually taking <i>-er</i> (<i>happier</i>) (Swan, 2016). A few are irregular. <b>Non-gradable</b> adjectives either classify (<i>annual, chemical, Kazakh</i>) or already express an extreme (<i>unique, perfect, enormous</i>), so they do not normally combine with <i>very</i> or comparison (forms such as <i>more perfect</i> do occur, but only for special effect). Extreme adjectives combine with <i>absolutely</i> or <i>completely</i> instead: <i>absolutely enormous</i>.</p>",
kk:"<p>Бір буынды сын есімдер әдетте <i>-er/-est</i> қабылдайды; үш және одан көп буынды сын есімдер <i>more/most</i> арқылы шырайланады; екі буынды сын есімдер әртүрлі, <i>-y</i>-ге аяқталатындары әдетте <i>-er</i> алады (<i>happier</i>) (Swan, 2016). Бірнешеуі ерекше түрленеді. <b>Шырайсыз</b> сын есімдер не жіктейді (<i>annual, chemical, Kazakh</i>), не шектен тыс сапаны білдіреді (<i>unique, perfect, enormous</i>), сондықтан әдетте <i>very</i>-мен де, шыраймен де тіркеспейді (<i>more perfect</i> сияқты формалар кездеседі, бірақ тек ерекше әсер үшін). Шектен тыс сапа білдіретін сын есімдер <i>absolutely</i> немесе <i>completely</i> сөздерімен тіркеседі: <i>absolutely enormous</i>.</p>",
ru:"<p>Односложные прилагательные обычно принимают <i>-er/-est</i>; трёх- и более сложные — <i>more/most</i>; двусложные колеблются, причём оканчивающиеся на <i>-y</i> обычно принимают <i>-er</i> (<i>happier</i>) (Swan, 2016). Несколько форм неправильные. <b>Неградуальные</b> прилагательные либо классифицируют (<i>annual, chemical, Kazakh</i>), либо уже выражают крайнюю степень (<i>unique, perfect, enormous</i>), поэтому обычно не сочетаются с <i>very</i> и не имеют степеней (формы вроде <i>more perfect</i> встречаются, но лишь ради особого эффекта). Прилагательные крайней степени сочетаются с <i>absolutely</i> или <i>completely</i>: <i>absolutely enormous</i>.</p>"})[l]+

{h:{en:"Order of adjectives",kk:"Сын есімдердің реті",ru:"Порядок прилагательных"},
b:L3(function(l){return ({
en:"<p>When several adjectives precede a noun, opinion adjectives usually come before descriptive ones, and adjectives closest to the noun express the most permanent, classifying properties such as origin, material and purpose. Reference grammars present this as a strong tendency rather than an absolute rule; an unusual order can be used for emphasis (Quirk et al., 1985; Swan, 2016).</p>",
kk:"<p>Зат есімнің алдында бірнеше сын есім келгенде, баға беретін сын есімдер әдетте сипаттайтын сын есімдерден бұрын тұрады, ал зат есімге ең жақын сын есімдер шығу тегі, материалы, мақсаты сияқты ең тұрақты, жіктеуші белгілерді білдіреді. Анықтамалық грамматикалар мұны қатаң ереже емес, күшті үрдіс ретінде сипаттайды; ерекше реттілік мән беру үшін қолданылуы мүмкін (Quirk et al., 1985; Swan, 2016).</p>",
ru:"<p>Когда перед существительным стоят несколько прилагательных, оценочные обычно предшествуют описательным, а ближе всего к существительному стоят прилагательные с наиболее постоянными, классифицирующими признаками: происхождение, материал, назначение. Справочные грамматики описывают это как сильную тенденцию, а не абсолютное правило; необычный порядок может использоваться для выделения (Quirk et al., 1985; Swan, 2016).</p>"})[l]+

{h:{en:"What adverbs do",kk:"Үстеудің қызметі",ru:"Что делают наречия"},
b:L3(function(l){return ({
en:"<p>Adverbs are the most heterogeneous class in English. Quirk et al. (1985) describe them by what they modify: verbs and whole verb phrases (<i>she spoke <b>quietly</b></i>), adjectives (<i><b>extremely</b> useful</i>), other adverbs (<i><b>quite</b> slowly</i>) and whole clauses (<i><b>Fortunately</b>, nobody was hurt</i>). Huddleston and Pullum (2002) give a compact characterisation: adverbs typically modify anything except nouns. That is the key difference from adjectives, which modify nouns.</p>",
kk:"<p>Үстеу — ағылшын тіліндегі ең әркелкі сөз табы. Quirk et al. (1985) үстеуді не анықтайтынына қарай сипаттайды: етістікті және тұтас етістікті тіркесті (<i>she spoke <b>quietly</b></i>), сын есімді (<i><b>extremely</b> useful</i>), басқа үстеуді (<i><b>quite</b> slowly</i>) және тұтас сөйлемді (<i><b>Fortunately</b>, nobody was hurt</i>). Huddleston мен Pullum (2002) қысқа сипаттама береді: үстеу әдетте зат есімнен басқаның бәрін анықтайды. Сын есімнен басты айырмашылығы осында, өйткені сын есім зат есімді анықтайды.</p>",
ru:"<p>Наречия — самый разнородный класс английского языка. Quirk et al. (1985) описывают их по тому, что они определяют: глаголы и целые глагольные группы (<i>she spoke <b>quietly</b></i>), прилагательные (<i><b>extremely</b> useful</i>), другие наречия (<i><b>quite</b> slowly</i>) и целые предложения (<i><b>Fortunately</b>, nobody was hurt</i>). Huddleston и Pullum (2002) дают краткую характеристику: наречия обычно определяют всё, кроме существительных. В этом главное отличие от прилагательных, которые определяют существительные.</p>"})[l]+
X(l,[["[pr:She] [v:speaks] English [adv:well].",{en:"<i>well</i> modifies the verb: how she speaks.",kk:"<i>well</i> етістікті анықтайды: қалай сөйлейді.",ru:"<i>well</i> определяет глагол: как она говорит."}],
["[pr:Her] English [v:is] [adj:good].",{en:"<i>good</i> is a predicative adjective describing <i>her English</i>.",kk:"<i>good</i> — <i>her English</i>-ті сипаттайтын баяндауыш сын есім.",ru:"<i>good</i> — предикативное прилагательное, характеризующее <i>her English</i>."}]]);})},

{h:{en:"How adverbs are formed",kk:"Үстеудің жасалуы",ru:"Образование наречий"},
b:L3(function(l){return ({
en:"<p>Most adverbs of manner are formed by adding <i>-ly</i> to an adjective (<i>quick → quickly</i>). The ending is a clue, not a proof: <i>friendly, lovely, lonely, costly</i> are adjectives, and they have no adverb form (use <i>in a friendly way</i>). A group of <b>flat adverbs</b> share the form of the adjective (<i>fast, hard, late, early, straight</i>), and some <i>-ly</i> forms of these words have a different meaning (Swan, 2016):</p>",
kk:"<p>Сын-қимыл үстеулерінің көбі сын есімге <i>-ly</i> жұрнағын қосу арқылы жасалады (<i>quick → quickly</i>). Бұл жұрнақ — дәлел емес, белгі ғана: <i>friendly, lovely, lonely, costly</i> — сын есімдер, олардың үстеу формасы жоқ (<i>in a friendly way</i> тіркесін қолданыңыз). <b>Сын есіммен тұлғалас үстеулер</b> тобы бар (<i>fast, hard, late, early, straight</i>), ал олардың кейбірінің <i>-ly</i> формасы басқа мағына береді (Swan, 2016):</p>",
ru:"<p>Большинство наречий образа действия образуются прибавлением <i>-ly</i> к прилагательному (<i>quick → quickly</i>). Окончание — признак, но не доказательство: <i>friendly, lovely, lonely, costly</i> — прилагательные, и у них нет наречной формы (используйте <i>in a friendly way</i>). Есть группа наречий, <b>совпадающих по форме с прилагательными</b> (<i>fast, hard, late, early, straight</i>), а формы на <i>-ly</i> у некоторых из них имеют другое значение (Swan, 2016):</p>"})[l]+
TB(l,{en:["Flat adverb","Meaning","-ly form","Meaning"],kk:["Тұлғалас үстеу","Мағынасы","-ly формасы","Мағынасы"],ru:["Наречие без -ly","Значение","Форма на -ly","Значение"]},[
["She works [adv:hard].",{en:"with effort",kk:"көп күш салып",ru:"усердно"},"She [adv:hardly] works.",{en:"almost not",kk:"әрең, дерлік жоқ",ru:"почти не"}],

["The bird flew [adv:high].",{en:"at a height",kk:"биікке",ru:"высоко"},"It's [adv:highly] unlikely.",{en:"very (degree)",kk:"өте (дәреже)",ru:"весьма (степень)"}]
]);})},

{h:{en:"Types of adverb",kk:"Үстеудің түрлері",ru:"Типы наречий"},
b:L3(function(l){return ({
en:"<p>Grammars group adverbs by meaning and by their relation to the clause. Quirk et al. (1985) distinguish adjuncts, subjuncts, disjuncts and conjuncts; Biber et al. (2021) use the clearer labels circumstance, stance and linking adverbials. The table combines the two.</p>",
kk:"<p>Грамматикалар үстеулерді мағынасына және сөйлемге қатысына қарай топтастырады. Quirk et al. (1985) adjunct, subjunct, disjunct және conjunct түрлерін ажыратады; Biber et al. (2021) түсініктірек атауларды қолданады: мән-жай, көзқарас және байланыстырушы үстеулер. Кестеде екі жүйе біріктірілген.</p>",
ru:"<p>Грамматики группируют наречия по значению и по отношению к предложению. Quirk et al. (1985) различают adjuncts, subjuncts, disjuncts и conjuncts; Biber et al. (2021) используют более ясные названия: обстоятельственные, оценочные и связующие. В таблице обе системы объединены.</p>"})[l]+

[{en:"Manner",kk:"Сын-қимыл",ru:"Образа действия"},{en:"how?",kk:"қалай?",ru:"как?"},"carefully, quickly, well"],

{h:{en:"Where adverbs go",kk:"Үстеудің сөйлемдегі орны",ru:"Место наречия в предложении"},
b:L3(function(l){return ({
en:"<p>Adverbs have three main positions: <b>front</b> (before the subject), <b>mid</b> (before the main verb, but after the first auxiliary and after <i>be</i>) and <b>end</b> (after the verb and its object). Different types prefer different positions: frequency and focusing adverbs usually take mid position, manner, place and time adverbs usually take end position, and stance and linking adverbs often take front position (Quirk et al., 1985; Swan, 2016). One restriction is firm: an adverb does not normally come between a verb and its direct object.</p>",
kk:"<p>Үстеудің үш негізгі орны бар: <b>сөйлем басы</b> (бастауыштың алдында), <b>ортасы</b> (негізгі етістіктің алдында, бірақ бірінші көмекші етістіктен және <i>be</i>-ден кейін) және <b>соңы</b> (етістік пен толықтауыштан кейін). Түрлі үстеулер түрлі орынды қалайды: жиілік және шектеу үстеулері әдетте ортада, сын-қимыл, мекен және мезгіл үстеулері әдетте соңында, ал көзқарас пен байланыстырушы үстеулер жиі басында тұрады (Quirk et al., 1985; Swan, 2016). Бір шектеу берік: үстеу әдетте етістік пен тура толықтауыштың арасына қойылмайды.</p>",
ru:"<p>У наречий три основные позиции: <b>начальная</b> (перед подлежащим), <b>срединная</b> (перед смысловым глаголом, но после первого вспомогательного и после <i>be</i>) и <b>конечная</b> (после глагола и дополнения). Разные типы предпочитают разные позиции: частотные и ограничительные обычно стоят в середине, наречия образа действия, места и времени — в конце, оценочные и связующие — часто в начале (Quirk et al., 1985; Swan, 2016). Одно ограничение строгое: наречие обычно не ставится между глаголом и прямым дополнением.</p>"})[l]+
X(l,[["She [adv:always] [v:takes] the bus. / She [aux:has] [adv:never] [v:been] late. / She [v:is] [adv:usually] on time.",{en:"mid position: before the main verb, after the first auxiliary, after <i>be</i>.",kk:"ортасы: негізгі етістіктің алдында, бірінші көмекшіден кейін, <i>be</i>-ден кейін.",ru:"срединная: перед смысловым глаголом, после первого вспомогательного, после <i>be</i>."}],

{tag:T_.conf,h:{en:"Adjective or adverb?",kk:"Сын есім бе, әлде үстеу ме?",ru:"Прилагательное или наречие?"},
b:L3(function(l){return ({
en:"<p>Ask what the word describes. If it describes a noun or the subject after a linking verb, use the adjective; if it describes how an action is done, use the adverb. <i>Good</i> is an adjective; its adverb is <i>well</i>. Note that <i>well</i> is also an adjective meaning 'healthy' (<i>I don't feel well</i>), and that <i>I feel bad</i> (adjective after the linking verb <i>feel</i>) is the standard form.</p>",
kk:"<p>Сөздің нені сипаттайтынын сұраңыз. Егер ол зат есімді немесе байланыстырушы етістіктен кейін бастауышты сипаттаса — сын есім, ал әрекеттің қалай орындалатынын сипаттаса — үстеу қолданыңыз. <i>Good</i> — сын есім, оның үстеуі — <i>well</i>. <i>Well</i> «сау» мағынасында сын есім де бола алатынын (<i>I don't feel well</i>) және <i>I feel bad</i> (байланыстырушы <i>feel</i> етістігінен кейінгі сын есім) әдеби форма екенін ескеріңіз.</p>",
ru:"<p>Спросите себя, что описывает слово. Если существительное или подлежащее после связки — нужно прилагательное; если то, как выполняется действие, — наречие. <i>Good</i> — прилагательное, соответствующее наречие — <i>well</i>. Учтите, что <i>well</i> бывает и прилагательным в значении «здоровый» (<i>I don't feel well</i>), а <i>I feel bad</i> (прилагательное после связки <i>feel</i>) — нормативная форма.</p>"})[l];})}
],

{h:{en:"What a preposition is",kk:"Предлог деген не",ru:"Что такое предлог"},
b:L3(function(l){return ({
en:"<p>A preposition typically takes a noun phrase after it, its <b>complement</b>, and relates it to the rest of the sentence: <i><b>under</b> the bridge, <b>after</b> the lesson, <b>because of</b> the weather</i>. Prepositions do not change form. Most are single words (<b>simple</b> prepositions), but English also has <b>complex</b> prepositions of two or three words that work as a unit: <i>in front of, according to, in spite of</i> (Quirk et al., 1985). A pronoun after a preposition takes the object form: <i>with <b>her</b></i>, <i>for <b>us</b></i>.</p>",
kk:"<p>Предлог әдетте өзінен кейін зат есімді тіркесті — өзінің <b>толықтауышын</b> алып, оны сөйлемнің қалған бөлігімен байланыстырады: <i><b>under</b> the bridge, <b>after</b> the lesson, <b>because of</b> the weather</i>. Предлогтар түрленбейді. Көбі бір сөзден тұрады (<b>жай</b> предлогтар), бірақ ағылшын тілінде бір бірлік ретінде қолданылатын екі-үш сөзден тұратын <b>күрделі</b> предлогтар да бар: <i>in front of, according to, in spite of</i> (Quirk et al., 1985). Предлогтан кейінгі есімдік объектілік формада тұрады: <i>with <b>her</b></i>, <i>for <b>us</b></i>.</p>",
ru:"<p>Предлог обычно присоединяет следующую за ним именную группу — своё <b>дополнение</b> — и связывает её с остальной частью предложения: <i><b>under</b> the bridge, <b>after</b> the lesson, <b>because of</b> the weather</i>. Предлоги не изменяются. Большинство из них — одно слово (<b>простые</b>), но есть и <b>составные</b> предлоги из двух-трёх слов, действующие как единое целое: <i>in front of, according to, in spite of</i> (Quirk et al., 1985). Местоимение после предлога стоит в объектной форме: <i>with <b>her</b></i>, <i>for <b>us</b></i>.</p>"})[l]+
NB(l,"info",T_.kzru,{
en:"Kazakh expresses many of these relations with case endings and with <b>postpositions</b>, which follow the noun (Muhamedowa, 2016): <i>мектепте</i> 'at school', <i>сабақтан кейін</i> 'after the lesson'. English places the preposition <b>before</b> the noun phrase, and the choice of preposition rarely maps one-to-one onto a Kazakh case or a Russian preposition.",
kk:"Қазақ тілі бұл қатынастардың көбін септік жалғаулары және зат есімнен <b>кейін</b> тұратын септеуліктер арқылы береді (Muhamedowa, 2016): <i>мектепте</i> — 'at school', <i>сабақтан кейін</i> — 'after the lesson'. Ағылшын тілінде предлог зат есімді тіркестің <b>алдында</b> тұрады, және предлогтың таңдалуы қазақ септігіне немесе орыс предлогына сирек дәл сәйкес келеді.",
ru:"В казахском многие из этих отношений выражаются падежными окончаниями и <b>послелогами</b>, которые стоят после существительного (Muhamedowa, 2016): <i>мектепте</i> — 'at school', <i>сабақтан кейін</i> — 'after the lesson'. В английском предлог стоит <b>перед</b> именной группой, и его выбор редко однозначно соответствует казахскому падежу или русскому предлогу."});})},

{h:{en:"Time and place: in, on, at",kk:"Уақыт және мекен: in, on, at",ru:"Время и место: in, on, at"},
b:L3(function(l){return ({
en:"<p>The three most frequent prepositions of time and place follow a consistent logic: <i>at</i> for a point, <i>on</i> for a day or a surface, <i>in</i> for a longer period or an enclosed space (Swan, 2016).</p>",
kk:"<p>Уақыт пен мекенді білдіретін ең жиі үш предлог бір жүйеге бағынады: <i>at</i> — нүкте, <i>on</i> — күн немесе бет (үсті), <i>in</i> — ұзағырақ кезең немесе жабық кеңістік (Swan, 2016).</p>",
ru:"<p>Три самых частотных предлога времени и места подчиняются единой логике: <i>at</i> — точка, <i>on</i> — день или поверхность, <i>in</i> — более длительный период или замкнутое пространство (Swan, 2016).</p>"})[l]+
TB(l,{en:["","Time","Place"],kk:["","Уақыт","Мекен"],ru:["","Время","Место"]},[
["<b>at</b>","at 7 o'clock, at noon, at the weekend (BrE)","at the bus stop, at the door, at work"],
["<b>on</b>","on Monday, on 16 December, on my birthday","on the table, on the wall, on the second floor"],
["<b>in</b>","in May, in 2026, in the morning, in summer","in the box, in Almaty, in the kitchen"]
]);})},

{h:{en:"Prepositions chosen by other words",kk:"Басқа сөз талап ететін предлогтар",ru:"Предлоги, выбираемые другими словами"},
b:L3(function(l){return ({
en:"<p>Many prepositions are not chosen for their own meaning but are <b>selected</b> by a verb, adjective or noun: <i>depend <b>on</b>, interested <b>in</b>, the reason <b>for</b></i>. These dependent prepositions must be learned together with the word that selects them. Equally important are verbs that take a direct object with no preposition at all, where learners often add one under the influence of their first language (Swan, 2016; Parrott, 2010).</p>",
kk:"<p>Көптеген предлогтар өз мағынасы үшін емес, етістік, сын есім немесе зат есім талап еткендіктен <b>таңдалады</b>: <i>depend <b>on</b>, interested <b>in</b>, the reason <b>for</b></i>. Мұндай тәуелді предлогтарды оларды талап ететін сөзбен бірге үйрену керек. Тура толықтауышты предлогсыз алатын етістіктер де сондай маңызды: оқушылар ана тілінің әсерімен оларға жиі предлог қосып жібереді (Swan, 2016; Parrott, 2010).</p>",
ru:"<p>Многие предлоги выбираются не по собственному значению, а <b>управляются</b> глаголом, прилагательным или существительным: <i>depend <b>on</b>, interested <b>in</b>, the reason <b>for</b></i>. Такие зависимые предлоги нужно учить вместе с управляющим словом. Не менее важны глаголы, которые принимают прямое дополнение без предлога: под влиянием родного языка учащиеся часто добавляют предлог (Swan, 2016; Parrott, 2010).</p>"})[l]+
X(l,[["It [v:depends] [p:on] the weather. / She's [adj:interested] [p:in] linguistics.",null],
["{x:We discussed about the plan.} → We discussed the plan.",{en:"<i>discuss</i> takes a direct object.",kk:"<i>discuss</i> тура толықтауышты предлогсыз алады.",ru:"<i>discuss</i> присоединяет прямое дополнение без предлога."}],
["{x:She entered into the room.} → She entered the room.",{en:"<i>enter</i> (a place) takes a direct object.",kk:"<i>enter</i> (бір жерге кіру) тура толықтауыш алады.",ru:"<i>enter</i> (войти куда-то) — с прямым дополнением."}]]);})},

{h:{en:"Prepositions at the end of a clause",kk:"Сөйлем соңындағы предлог",ru:"Предлог в конце предложения"},
b:L3(function(l){return ({
en:"<p>In questions, relative clauses and passives, English often leaves the preposition at the end, separated from its complement. This is called <b>stranding</b>, and it is fully grammatical and usual, especially in speech. The alternative with the preposition at the front is more formal (Biber et al., 2021; Swan, 2016).</p>",
kk:"<p>Сұрақтарда, қатыстық бағыныңқыларда және ырықсыз етісте ағылшын тілі предлогты жиі сөйлемнің соңында, оның толықтауышынан бөлек қалдырады. Бұл <b>предлогтың соңында қалуы (stranding)</b> деп аталады; бұл толығымен грамматикалық, әсіресе сөйлеу тілінде кең тараған. Предлог алда тұратын нұсқа ресмирек (Biber et al., 2021; Swan, 2016).</p>",
ru:"<p>В вопросах, относительных придаточных и пассиве английский часто оставляет предлог в конце, отдельно от его дополнения. Это называется <b>stranding</b> («висячий» предлог); это полностью грамматично и обычно, особенно в устной речи. Вариант с предлогом впереди более официален (Biber et al., 2021; Swan, 2016).</p>"})[l]+
X(l,[["Who are you waiting [p:for]? / Formal: [p:For] whom are you waiting?",null],
["This is the flat I told you [p:about].",null]]);})},

{h:{en:"Particles and multi-word verbs",kk:"Бөлшектер және көп сөзді етістіктер",ru:"Частицы и многословные глаголы"},
b:L3(function(l){return ({
en:"<p>Words like <i>up, off, out, in, down</i> are prepositions when a noun phrase follows them (<i>He climbed <b>up</b> the ladder</i>), but they can also stand without a complement and combine with a verb into a <b>multi-word verb</b> (<i>She gave <b>up</b></i>). Quirk et al. (1985) distinguish three types, and a simple movement test tells them apart:</p>",
kk:"<p><i>up, off, out, in, down</i> сияқты сөздер өзінен кейін зат есімді тіркес келгенде предлог болады (<i>He climbed <b>up</b> the ladder</i>), бірақ олар толықтауышсыз да тұрып, етістікпен бірге <b>көп сөзді етістік</b> құрай алады (<i>She gave <b>up</b></i>). Quirk et al. (1985) үш түрін ажыратады, оларды қарапайым орын ауыстыру тәсілі арқылы айыруға болады:</p>",
ru:"<p>Слова <i>up, off, out, in, down</i> являются предлогами, когда за ними следует именная группа (<i>He climbed <b>up</b> the ladder</i>), но могут стоять и без дополнения, образуя с глаголом <b>многословный глагол</b> (<i>She gave <b>up</b></i>). Quirk et al. (1985) выделяют три типа, которые различаются простым тестом перестановки:</p>"})[l]+
TB(l,{en:["Type","Example","Can the particle move after a noun object?","With a pronoun object"],kk:["Түрі","Мысал","Бөлшек зат есім толықтауыштан кейін ауыса ма?","Есімдік толықтауышпен"],ru:["Тип","Пример","Может ли частица стоять после дополнения?","С местоимением"]},[
[{en:"Phrasal verb (verb + particle)",kk:"Фразалық етістік (етістік + бөлшек)",ru:"Фразовый глагол (глагол + частица)"},"turn off the light",{en:"yes: <i>turn the light off</i>",kk:"иә: <i>turn the light off</i>",ru:"да: <i>turn the light off</i>"},"turn [pr:it] off / {x:turn off it}"],
[{en:"Prepositional verb (verb + preposition)",kk:"Предлогты етістік (етістік + предлог)",ru:"Предложный глагол (глагол + предлог)"},"look at the picture",{en:"no: {x:look the picture at}",kk:"жоқ: {x:look the picture at}",ru:"нет: {x:look the picture at}"},"look at [pr:it]"],
[{en:"Phrasal-prepositional verb",kk:"Фразалық-предлогты етістік",ru:"Фразово-предложный глагол"},"put up with the noise",{en:"no: fixed order",kk:"жоқ: тұрақты рет",ru:"нет: порядок фиксирован"},"put up with [pr:it]"]
])+({en:"<p>Phrasal verbs are very frequent and highly polysemous: in a corpus study, 100 phrasal verbs accounted for more than half of all phrasal-verb occurrences in the British National Corpus, and the most frequent ones had several meanings each (Gardner &amp; Davies, 2007). Learners whose first language has no phrasal verbs tend to avoid them in favour of single-word verbs (Dagut &amp; Laufer, 1985), which makes their English sound formal. Learn the most frequent ones by meaning, in context.</p>",
kk:"<p>Фразалық етістіктер өте жиі қолданылады және көп мағыналы: корпустық зерттеуде Британ ұлттық корпусындағы барлық фразалық етістік қолданыстарының жартысынан көбі 100 фразалық етістікке тиесілі болған, ал ең жиілерінің әрқайсысының бірнеше мағынасы бар (Gardner &amp; Davies, 2007). Ана тілінде фразалық етістік жоқ оқушылар оларды бір сөзді етістіктермен алмастырып, қолданудан қашады (Dagut &amp; Laufer, 1985), сондықтан олардың ағылшын тілі тым ресми естіледі. Ең жиілерін контекст арқылы, мағынасы бойынша үйреніңіз.</p>",
ru:"<p>Фразовые глаголы очень частотны и многозначны: по данным корпусного исследования, 100 фразовых глаголов составили более половины всех употреблений фразовых глаголов в Британском национальном корпусе, а самые частотные имели по нескольку значений (Gardner &amp; Davies, 2007). Учащиеся, в родном языке которых нет фразовых глаголов, склонны избегать их, заменяя однословными глаголами (Dagut &amp; Laufer, 1985), отчего их речь звучит излишне официально. Учите самые частотные в контексте, по значениям.</p>"})[l]+
NB(l,"info",{en:"Two analyses",kk:"Екі түрлі талдау",ru:"Два подхода"},{
en:"Traditional grammar calls <i>up</i> in <i>give up</i> an adverb or adverb particle. Huddleston and Pullum (2002) analyse it as an intransitive preposition, a preposition without a complement, and they extend the class further to include words like <i>before</i> and <i>after</i> when they introduce clauses. This course uses the term <b>particle</b> for the multi-word-verb use; Unit 15 returns to the debate.",
kk:"Дәстүрлі грамматика <i>give up</i> тіркесіндегі <i>up</i>-ты үстеу немесе үстеулік бөлшек деп атайды. Huddleston мен Pullum (2002) оны салт предлог, яғни толықтауышсыз предлог деп талдайды және бұл тапқа бағыныңқы сөйлемді енгізетін <i>before</i>, <i>after</i> сияқты сөздерді де қосады. Бұл курста көп сөзді етістіктегі қолданыс үшін <b>бөлшек (particle)</b> термині қолданылады; бұл пікірталасқа 15-бөлімде қайта ораламыз.",
ru:"Традиционная грамматика называет <i>up</i> в <i>give up</i> наречием или наречной частицей. Huddleston и Pullum (2002) анализируют его как непереходный предлог, то есть предлог без дополнения, и включают в этот класс также <i>before</i> и <i>after</i>, когда они вводят придаточные. В этом курсе для употребления в многословных глаголах используется термин <b>частица (particle)</b>; к этой дискуссии мы вернёмся в разделе 15."});})}
],

{h:{en:"Two ways of linking",kk:"Байланыстырудың екі тәсілі",ru:"Два способа связи"},
b:L3(function(l){return ({
en:"<p>Conjunctions link words, phrases and clauses. They do this in two different ways. <b>Coordinators</b> join units of equal grammatical status, so either part could stand alone (<i>I called, <b>but</b> nobody answered</i>). <b>Subordinators</b> make one clause part of another, so the subordinate clause cannot stand alone as a sentence (<i>Nobody answered <b>because</b> they were out</i>) (Quirk et al., 1985; Biber et al., 2021).</p>",
kk:"<p>Жалғаулықтар сөздерді, тіркестерді және сөйлемдерді байланыстырады. Олар мұны екі түрлі жолмен жасайды. <b>Салаластырушы жалғаулықтар</b> грамматикалық дәрежесі тең бірліктерді біріктіреді, сондықтан әр бөлігі жеке тұра алады (<i>I called, <b>but</b> nobody answered</i>). <b>Сабақтастырушы жалғаулықтар</b> бір сөйлемді екіншісінің құрамына енгізеді, сондықтан бағыныңқы сөйлем жеке сөйлем ретінде тұра алмайды (<i>Nobody answered <b>because</b> they were out</i>) (Quirk et al., 1985; Biber et al., 2021).</p>",
ru:"<p>Союзы связывают слова, группы слов и предложения двумя разными способами. <b>Сочинительные</b> союзы соединяют грамматически равноправные единицы, поэтому каждая часть могла бы стоять отдельно (<i>I called, <b>but</b> nobody answered</i>). <b>Подчинительные</b> делают одно предложение частью другого, и придаточное не может быть самостоятельным предложением (<i>Nobody answered <b>because</b> they were out</i>) (Quirk et al., 1985; Biber et al., 2021).</p>"})[l]+
TB(l,{en:["Type","Members","Example"],kk:["Түрі","Құрамы","Мысал"],ru:["Тип","Состав","Пример"]},[
[{en:"Coordinators",kk:"Салаластырушы",ru:"Сочинительные"},"and, or, but (central); nor, so, yet, for","tea [cj:or] coffee; small [cj:but] comfortable"],

{h:{en:"Subordinators and what they introduce",kk:"Сабақтастырушылар және олар енгізетін бөліктер",ru:"Подчинительные союзы и вводимые ими придаточные"},
b:L3(function(l){return ({
en:"<p>Subordinators express relationships of time, reason, condition, contrast and purpose, or they simply mark a clause as the content of a verb (<i>I think <b>that</b> she's right</i>). A subordinate clause can come before or after the main clause; when it comes first, it is usually followed by a comma.</p>",
kk:"<p>Сабақтастырушы жалғаулықтар мезгіл, себеп, шарт, қарсылық және мақсат қатынастарын білдіреді немесе жай ғана бір сөйлемді етістіктің мазмұны ретінде белгілейді (<i>I think <b>that</b> she's right</i>). Бағыныңқы сөйлем басыңқы сөйлемнің алдында да, соңында да тұра алады; алдында тұрса, одан кейін әдетте үтір қойылады.</p>",
ru:"<p>Подчинительные союзы выражают отношения времени, причины, условия, уступки и цели или просто оформляют предложение как содержание глагола (<i>I think <b>that</b> she's right</i>). Придаточное может стоять до или после главного; если оно стоит первым, после него обычно ставится запятая.</p>"})[l]+
TB(l,{en:["Meaning","Subordinators","Example"],kk:["Мағынасы","Жалғаулықтар","Мысал"],ru:["Значение","Союзы","Пример"]},[
[{en:"Time",kk:"Мезгіл",ru:"Время"},"when, while, before, after, until, since","[cj:When] the film ended, we left."],

[{en:"Purpose",kk:"Мақсат",ru:"Цель"},"so that, in order that","Speak slowly [cj:so that] everyone understands."],

])+NB(l,"info",{en:"Two analyses",kk:"Екі түрлі талдау",ru:"Два подхода"},{
en:"Huddleston and Pullum (2002) keep only <i>that, whether, if</i> (and a few others) as subordinators and treat <i>before, after, since, because</i> as prepositions that can take a clause, just as they take a noun phrase (<i>before the lesson / before the lesson started</i>). Most teaching grammars, including this course, call them subordinating conjunctions. The two analyses describe the same sentences.",
kk:"Huddleston мен Pullum (2002) сабақтастырушы ретінде тек <i>that, whether, if</i> (және тағы бірнешеуін) қалдырады, ал <i>before, after, since, because</i> сөздерін зат есімді тіркесті де, сөйлемді де ала алатын предлогтар деп қарайды (<i>before the lesson / before the lesson started</i>). Оқу грамматикаларының көбі, соның ішінде осы курс, оларды сабақтастырушы жалғаулық деп атайды. Екі талдау бір сөйлемдерді сипаттайды.",
ru:"Huddleston и Pullum (2002) оставляют в классе подчинительных союзов только <i>that, whether, if</i> (и немногие другие), а <i>before, after, since, because</i> считают предлогами, способными присоединять как именную группу, так и предложение (<i>before the lesson / before the lesson started</i>). Большинство учебных грамматик, включая этот курс, называют их подчинительными союзами. Оба подхода описывают одни и те же предложения."});})},

{tag:T_.conf,h:{en:"Conjunction or linking adverb?",kk:"Жалғаулық па, әлде байланыстырушы үстеу ме?",ru:"Союз или связующее наречие?"},
b:L3(function(l){return ({
en:"<p><i>However, therefore, moreover, nevertheless</i> express relations similar to <i>but</i> and <i>so</i>, but they are <b>adverbs</b>, not conjunctions (Unit 8). They do not join two clauses into one sentence; each clause remains a sentence, separated by a full stop or a semicolon. A second frequent error is using two links for one relationship, a pattern that is grammatical in some other languages but not in English (Swan, 2016).</p>",
kk:"<p><i>However, therefore, moreover, nevertheless</i> сөздері <i>but</i> пен <i>so</i>-ға ұқсас қатынасты білдіреді, бірақ олар жалғаулық емес, <b>үстеу</b> (8-бөлім). Олар екі сөйлемді бір сөйлемге біріктірмейді; әр бөлігі нүкте не нүктелі үтірмен бөлінген жеке сөйлем болып қала береді. Тағы бір жиі қате — бір қатынас үшін екі байланыстырушы сөзді қолдану; бұл кейбір тілдерде грамматикалық, бірақ ағылшын тілінде қате (Swan, 2016).</p>",
ru:"<p><i>However, therefore, moreover, nevertheless</i> выражают отношения, похожие на <i>but</i> и <i>so</i>, но это <b>наречия</b>, а не союзы (раздел 8). Они не объединяют два предложения в одно; каждая часть остаётся предложением и отделяется точкой или точкой с запятой. Другая частая ошибка — два связующих слова для одного отношения: в некоторых языках это грамматично, в английском — нет (Swan, 2016).</p>"})[l]+

{h:{en:"Words outside the clause",kk:"Сөйлемнен тыс сөздер",ru:"Слова вне предложения"},
b:L3(function(l){return ({
en:"<p><b>Interjections</b> such as <i>oh, wow, ouch, oops, hey</i> express emotion or attract attention. They do not combine with other words into phrases and they play no role in clause structure: removing them leaves a complete sentence (Quirk et al., 1985). Biber et al. (2021) place interjections in a wider family of <b>inserts</b>, words that are extremely frequent in conversation and rare in formal writing. Inserts carry social and interactional meaning rather than content: they open and close exchanges, signal agreement, buy time and soften requests.</p>",
kk:"<p><i>oh, wow, ouch, oops, hey</i> сияқты <b>одағайлар</b> сезімді білдіреді немесе назар аудартады. Олар басқа сөздермен тіркесіп сөз тіркесін құрмайды және сөйлем құрылымында ешқандай рөл атқармайды: оларды алып тастаса, толық сөйлем қалады (Quirk et al., 1985). Biber et al. (2021) одағайларды кеңірек топқа — <b>қыстырма элементтерге (inserts)</b> жатқызады; бұл сөздер сөйлеу тілінде өте жиі, ал ресми жазуда сирек кездеседі. Олар мазмұннан гөрі әлеуметтік және қарым-қатынастық мағына береді: әңгімені бастайды және аяқтайды, келісімді білдіреді, ойлануға уақыт береді, өтінішті жұмсартады.</p>",
ru:"<p><b>Междометия</b> (<i>oh, wow, ouch, oops, hey</i>) выражают эмоции или привлекают внимание. Они не образуют групп с другими словами и не участвуют в структуре предложения: если их убрать, предложение останется полным (Quirk et al., 1985). Biber et al. (2021) относят междометия к более широкой группе <b>вставных элементов (inserts)</b> — слов, крайне частотных в разговоре и редких в официальном письме. Они несут не содержательное, а социальное и интерактивное значение: открывают и закрывают обмен репликами, выражают согласие, дают время подумать, смягчают просьбы.</p>"})[l]+

{h:{en:"Inserts in real conversation",kk:"Нақты әңгімедегі қыстырма сөздер",ru:"Вставные элементы в живом разговоре"},
b:L3(function(l){return ({
en:"<p>The same word can be an insert in one sentence and a full member of the clause in another. <i>Well</i> is an adverb in <i>She sings well</i> but a discourse marker in <i>Well, I'm not sure</i>, where it signals that the answer is not straightforward. This is another case where the sentence, not the dictionary entry, decides the class.</p>",
kk:"<p>Бір сөз бір сөйлемде қыстырма сөз, ал басқа сөйлемде сөйлемнің толық мүшесі бола алады. <i>She sings well</i> сөйлемінде <i>well</i> — үстеу, ал <i>Well, I'm not sure</i> сөйлемінде — жауаптың бірден берілмейтінін білдіретін дискурс маркері. Бұл да сөз табын сөздік емес, сөйлем шешетінін көрсетеді.</p>",
ru:"<p>Одно и то же слово может быть вставным элементом в одном предложении и полноправным членом предложения в другом. <i>Well</i> — наречие в <i>She sings well</i>, но дискурсивный маркер в <i>Well, I'm not sure</i>, где сигнализирует, что ответ не так прост. Это ещё один случай, когда часть речи определяет предложение, а не словарь.</p>"})[l]+
X(l,[["A: Can you finish it by Friday?<br>B: [i:Um], [i:well], I'll try, but I [aux:can't] promise.",{en:"<i>um</i> holds the turn; <i>well</i> prepares a less direct answer.",kk:"<i>um</i> сөз кезегін сақтайды; <i>well</i> тікелей емес жауапқа дайындайды.",ru:"<i>um</i> удерживает очередь; <i>well</i> готовит менее прямой ответ."}],

kk:"Қыстырма сөздердің көбі сөйлеу тіліне тән. Эссе, есеп немесе ресми хатта <i>well, you know, yeah</i> және кідіріс сөздерді қолданбаңыз; <i>please</i> және <i>thank you</i> сияқты сыпайылық формулаларын сақтаңыз.",

sec:[
{h:{en:"One -ing form, several jobs",kk:"Бір -ing формасы — бірнеше қызмет",ru:"Одна форма на -ing — несколько функций"},
b:L3(function(l){return ({
en:"<p>Traditional grammar gives the <i>-ing</i> form two names: a <b>gerund</b> when it does a noun's job (<i>Swimming is good exercise</i>) and a <b>present participle</b> when it is part of a progressive verb or describes a noun (<i>She is swimming; a swimming pool</i>). Huddleston and Pullum (2002) point out that no English verb has two different <i>-ing</i> forms, so there is only one form, which they call the <b>gerund-participle</b>; the difference lies in the construction. Quirk et al. (1985) keep the traditional names but show that there is a gradient between noun-like and verb-like uses. The practical conclusion is the same: ask what job the <i>-ing</i> form is doing.</p>",
kk:"<p>Дәстүрлі грамматика <i>-ing</i> формасын екі түрлі атайды: зат есімнің қызметін атқарғанда <b>герундий</b> (<i>Swimming is good exercise</i>), ал созылыңқы етістіктің бөлігі болғанда немесе зат есімді сипаттағанда <b>осы шақ есімшесі</b> (<i>She is swimming; a swimming pool</i>). Huddleston мен Pullum (2002) ағылшын тілінде ешбір етістіктің екі түрлі <i>-ing</i> формасы жоқ екенін атап өтеді, сондықтан форма біреу ғана, олар оны <b>gerund-participle</b> деп атайды; айырма құрылымда. Quirk et al. (1985) дәстүрлі атауларды сақтайды, бірақ зат есімге жақын және етістікке жақын қолданыстардың арасында біртіндеп өтетін аралық бар екенін көрсетеді. Практикалық қорытынды бірдей: <i>-ing</i> формасының қандай қызмет атқарып тұрғанын сұраңыз.</p>",
ru:"<p>Традиционная грамматика даёт форме на <i>-ing</i> два названия: <b>герундий</b>, когда она выполняет функцию существительного (<i>Swimming is good exercise</i>), и <b>причастие настоящего времени</b>, когда она входит в продолженную форму глагола или определяет существительное (<i>She is swimming; a swimming pool</i>). Huddleston и Pullum (2002) отмечают, что ни у одного английского глагола нет двух разных форм на <i>-ing</i>, поэтому форма одна — они называют её <b>gerund-participle</b>, а различие заключено в конструкции. Quirk et al. (1985) сохраняют традиционные названия, но показывают, что между «именными» и «глагольными» употреблениями есть постепенный переход. Практический вывод одинаков: спрашивайте, какую функцию выполняет форма на <i>-ing</i>.</p>"})[l]+

{h:{en:"What infinitives do",kk:"Тұйық етістіктің қызметтері",ru:"Функции инфинитива"},
b:L3(function(l){return ({
en:"<p>The <b>to-infinitive</b> (<i>to leave</i>) and the <b>bare infinitive</b> (<i>leave</i>, after modals and verbs such as <i>make</i> and <i>let</i>) are non-finite: they show no tense or agreement. The <i>to</i>-infinitive performs a wide range of functions (Quirk et al., 1985; Biber et al., 2021):</p>",
kk:"<p><b>To-лы тұйық етістік</b> (<i>to leave</i>) және <b>to-сыз тұйық етістік</b> (<i>leave</i>, модальдерден және <i>make</i>, <i>let</i> сияқты етістіктерден кейін) жіктелмейді: шақты да, қиысуды да білдірмейді. To-лы тұйық етістік көптеген қызмет атқарады (Quirk et al., 1985; Biber et al., 2021):</p>",
ru:"<p><b>Инфинитив с to</b> (<i>to leave</i>) и <b>без to</b> (<i>leave</i> — после модальных и глаголов <i>make</i>, <i>let</i>) являются неличными формами: не выражают времени и согласования. Инфинитив с <i>to</i> выполняет много функций (Quirk et al., 1985; Biber et al., 2021):</p>"})[l]+
TB(l,{en:["Function","Example"],kk:["Қызметі","Мысал"],ru:["Функция","Пример"]},[

[{en:"object of a verb",kk:"етістіктің толықтауышы",ru:"дополнение глагола"},"She decided [v:to stay]."],

{h:{en:"Verb patterns: -ing or to-infinitive?",kk:"Етістік құрылымдары: -ing пе, әлде to-лы тұйық етістік пе?",ru:"Модели глаголов: -ing или инфинитив с to?"},
b:L3(function(l){return ({
en:"<p>Which form follows a verb is a property of that verb, part of its valency (Unit 5). Some verbs take <i>-ing</i>, some take <i>to</i>, and some take both, sometimes with a change of meaning. There is no single rule that predicts every case, so learn each verb with its pattern (Swan, 2016; Parrott, 2010).</p>",
kk:"<p>Етістіктен кейін қай форманың келетіні — сол етістіктің қасиеті, оның валенттілігінің бөлігі (5-бөлім). Кейбір етістіктер <i>-ing</i>, кейбірі <i>to</i> қабылдайды, ал кейбірі екеуін де, кейде мағынасы өзгеріп, қабылдайды. Барлық жағдайды алдын ала білдіретін бір ереже жоқ, сондықтан әр етістікті өз құрылымымен бірге үйреніңіз (Swan, 2016; Parrott, 2010).</p>",
ru:"<p>Какая форма следует за глаголом — свойство самого глагола, часть его валентности (раздел 5). Одни глаголы требуют <i>-ing</i>, другие — <i>to</i>, третьи допускают обе формы, иногда с изменением значения. Единого правила, предсказывающего все случаи, нет, поэтому учите каждый глагол вместе с его моделью (Swan, 2016; Parrott, 2010).</p>"})[l]+
TB(l,{en:["+ -ing","+ to-infinitive","Both, with a change of meaning"],kk:["+ -ing","+ to-лы тұйық етістік","Екеуі де, мағынасы өзгереді"],ru:["+ -ing","+ инфинитив с to","Оба, со сменой значения"]},[
["enjoy, finish, avoid, mind, suggest, consider","want, decide, hope, plan, agree, refuse","stop, remember, forget, try"],
["I enjoy [v:cooking].","We decided [v:to wait].","He stopped [v:smoking]. (= quit) / He stopped [v:to smoke]. (= in order to smoke)"]
]);})},

{h:{en:"-ing and -ed adjectives",kk:"-ing және -ed сын есімдері",ru:"Прилагательные на -ing и -ed"},
b:L3(function(l){return ({
en:"<p>Many <i>-ing</i> and <i>-ed</i> forms have become full adjectives: they take <i>very</i>, appear after <i>seem</i> and can be compared (Quirk et al., 1985). In pairs related to feelings, the <i>-ing</i> adjective describes the cause of the feeling and the <i>-ed</i> adjective describes the person who experiences it.</p>",
kk:"<p>Көптеген <i>-ing</i> және <i>-ed</i> формалары толыққанды сын есімге айналған: олар <i>very</i>-мен тіркеседі, <i>seem</i>-нен кейін тұрады және шырай қабылдайды (Quirk et al., 1985). Сезімге қатысты жұптарда <i>-ing</i> сын есімі сезімнің себебін, ал <i>-ed</i> сын есімі сол сезімді бастан кешіретін адамды сипаттайды.</p>",
ru:"<p>Многие формы на <i>-ing</i> и <i>-ed</i> стали полноценными прилагательными: сочетаются с <i>very</i>, стоят после <i>seem</i> и имеют степени сравнения (Quirk et al., 1985). В парах, связанных с чувствами, прилагательное на <i>-ing</i> описывает причину чувства, а на <i>-ed</i> — того, кто его испытывает.</p>"})[l]+

sec:[
{h:{en:"Why word formation matters",kk:"Сөзжасамның маңызы",ru:"Почему важно словообразование"},
b:L3(function(l){return ({
en:"<p>Choosing the right <b>form</b> of a word is one of the most persistent difficulties for learners. Schmitt and Zimmerman (2002) found that even advanced learners usually knew only some of the derived forms in a word family; producing all four (noun, verb, adjective, adverb) was rare. A later study found that less advanced learners knew derived words less well than their base words, while for advanced learners the gap had closed (Laufer et al., 2021). Understanding how English forms words gives you a system for filling that gap.</p>",
kk:"<p>Сөздің дұрыс <b>формасын</b> таңдау — оқушылар үшін ең тұрақты қиындықтардың бірі. Schmitt пен Zimmerman (2002) тіпті жоғары деңгейдегі оқушылардың да сөз ұясындағы туынды формалардың тек бір бөлігін ғана білетінін анықтады; төрт форманың (зат есім, етістік, сын есім, үстеу) бәрін жасай алу сирек кездескен. Кейінгі зерттеу деңгейі төменірек оқушылар туынды сөздерді түбір сөздерге қарағанда нашар білетінін, ал жоғары деңгейдегі оқушыларда бұл айырма жойылғанын көрсетті (Laufer et al., 2021). Ағылшын тілінде сөздің қалай жасалатынын түсіну бұл олқылықты толтыруға жүйелі жол береді.</p>",
ru:"<p>Выбор правильной <b>формы</b> слова — одна из самых устойчивых трудностей. Schmitt и Zimmerman (2002) обнаружили, что даже продвинутые учащиеся обычно знают лишь часть производных форм гнезда; умение образовать все четыре (существительное, глагол, прилагательное, наречие) встречалось редко. Более позднее исследование показало, что у менее продвинутых учащихся знание производных слов отстаёт от знания исходных, а у продвинутых этот разрыв исчезает (Laufer et al., 2021). Понимание того, как в английском образуются слова, даёт систему для устранения этого пробела.</p>"})[l];})},

{h:{en:"Suffixes that change the class",kk:"Сөз табын өзгертетін жұрнақтар",ru:"Суффиксы, меняющие часть речи"},
b:L3(function(l){return ({
en:"<p>Most class-changing work in English is done by suffixes. A suffix is good evidence of class, though, as Unit 8 showed with <i>friendly</i>, not absolute proof (Bauer et al., 2013).</p>",
kk:"<p>Ағылшын тілінде сөз табын өзгертудің көбін жұрнақтар атқарады. Жұрнақ сөз табының жақсы белгісі, бірақ 8-бөлімде <i>friendly</i> мысалында көрсетілгендей, ол толық дәлел емес (Bauer et al., 2013).</p>",
ru:"<p>Основную работу по смене части речи в английском выполняют суффиксы. Суффикс — хороший признак части речи, но, как показал пример <i>friendly</i> в разделе 8, не абсолютное доказательство (Bauer et al., 2013).</p>"})[l]+

{h:{en:"Conversion: changing class without changing form",kk:"Конверсия: формасын өзгертпей табын өзгерту",ru:"Конверсия: смена части речи без изменения формы"},
b:L3(function(l){return ({
en:"<p>English can also move a word into a new class with no affix at all. This is <b>conversion</b>, or zero derivation, and it is highly productive, especially from noun to verb (<i>to email, to google, to text</i>) and from verb to noun (<i>a run, a look, a guess</i>). Bauer et al. (2013) discuss several theoretical analyses of conversion; for learners, the essential point is that the sentence, not the spelling, decides the class. In some two-syllable pairs, conversion is accompanied by a <b>stress shift</b>: the noun is stressed on the first syllable and the verb on the second.</p>",
kk:"<p>Ағылшын тілі сөзді ешқандай қосымшасыз да жаңа сөз табына көшіре алады. Бұл — <b>конверсия</b> немесе нөлдік деривация, ол өте өнімді, әсіресе зат есімнен етістікке (<i>to email, to google, to text</i>) және етістіктен зат есімге (<i>a run, a look, a guess</i>) өтуде. Bauer et al. (2013) конверсияның бірнеше теориялық талдауын қарастырады; оқушы үшін ең бастысы — сөз табын жазылуы емес, сөйлем шешеді. Кейбір екі буынды жұптарда конверсия <b>екпіннің ауысуымен</b> қатар жүреді: зат есімде екпін бірінші буынға, етістікте екінші буынға түседі.</p>",
ru:"<p>Английский может перевести слово в новый класс и вовсе без аффикса. Это <b>конверсия</b>, или нулевая деривация; она очень продуктивна, особенно от существительного к глаголу (<i>to email, to google, to text</i>) и от глагола к существительному (<i>a run, a look, a guess</i>). Bauer et al. (2013) рассматривают несколько теоретических трактовок конверсии; для учащегося главное — часть речи определяет предложение, а не написание. В некоторых двусложных парах конверсия сопровождается <b>сдвигом ударения</b>: существительное ударно на первом слоге, глагол — на втором.</p>"})[l]+
X(l,[["I'll [v:email] you the details. / I got your [n:email].",{en:"noun → verb.",kk:"зат есім → етістік.",ru:"существительное → глагол."}],
["Let's have a [n:look]. / [v:Look] at this.",{en:"verb → noun.",kk:"етістік → зат есім.",ru:"глагол → существительное."}],

{h:{en:"Compounds",kk:"Күрделі сөздер",ru:"Сложные слова"},
b:L3(function(l){return ({
en:"<p>A compound combines two or more words into one lexical unit: <i>bookshop, bus stop, mother-in-law, well-known</i>. The class of an English compound is normally set by its right-hand element, the <b>head</b>: <i>greenhouse</i> is a noun because <i>house</i> is, and <i>sugar-free</i> is an adjective because <i>free</i> is (Bauer et al., 2013). Spelling is not a reliable test: compounds may be written as one word, with a hyphen or as two words. Stress is often a better clue: compounds tend to stress the first element (<i>a GREENhouse</i>, a building for plants) whereas phrases stress the second (<i>a green HOUSE</i>, a house painted green).</p>",
kk:"<p>Күрделі сөз екі не одан көп сөзді бір лексикалық бірлікке біріктіреді: <i>bookshop, bus stop, mother-in-law, well-known</i>. Ағылшын күрделі сөзінің табын әдетте оның оң жақтағы сыңары — <b>басты сыңары</b> анықтайды: <i>greenhouse</i> зат есім, өйткені <i>house</i> зат есім; <i>sugar-free</i> сын есім, өйткені <i>free</i> сын есім (Bauer et al., 2013). Жазылуы сенімді белгі емес: күрделі сөздер бірге, дефиспен немесе бөлек жазылуы мүмкін. Екпін жақсырақ белгі: күрделі сөздерде екпін көбіне бірінші сыңарға түседі (<i>a GREENhouse</i> — жылыжай), ал сөз тіркесінде екінші сөзге (<i>a green HOUSE</i> — жасыл түске боялған үй).</p>",
ru:"<p>Сложное слово объединяет два или более слова в одну лексическую единицу: <i>bookshop, bus stop, mother-in-law, well-known</i>. Часть речи английского сложного слова обычно определяется правым компонентом — <b>вершиной</b>: <i>greenhouse</i> — существительное, потому что <i>house</i> — существительное, а <i>sugar-free</i> — прилагательное, потому что <i>free</i> — прилагательное (Bauer et al., 2013). Написание — ненадёжный признак: сложные слова пишутся слитно, через дефис или раздельно. Ударение надёжнее: в сложных словах обычно ударен первый компонент (<i>a GREENhouse</i> — теплица), а в словосочетании — второй (<i>a green HOUSE</i> — дом зелёного цвета).</p>"})[l];})}
],

{h:{en:"Words build phrases",kk:"Сөздер тіркес құрайды",ru:"Слова образуют группы"},

en:"<p>Words do not combine directly into sentences. They first form <b>phrases</b> around a central word, the <b>head</b>, which gives the phrase its name and its behaviour. Phrases then fill the functions of the clause. Seeing this two-level structure is what makes it possible to understand why one word can do many jobs (Quirk et al., 1985; Huddleston &amp; Pullum, 2002). The grammars use the term <i>verb phrase</i> differently: for Quirk et al. it is the verb group alone (<i>has finished</i>), as in the diagrams below; for Huddleston and Pullum it also includes the verb's complements (<i>has finished the report</i>).</p>",
kk:"<p>Сөздер сөйлемге тікелей бірікпейді. Алдымен олар орталық сөз — <b>басты сөз (head)</b> төңірегінде <b>сөз тіркестерін</b> құрайды; тіркестің атауы мен қасиеті осы басты сөзге байланысты. Содан кейін тіркестер сөйлем мүшелерінің қызметін атқарады. Осы екі деңгейлі құрылымды көру бір сөздің неліктен түрлі қызмет атқара алатынын түсінуге мүмкіндік береді (Quirk et al., 1985; Huddleston &amp; Pullum, 2002). Грамматикаларда <i>verb phrase</i> терминінің мағынасы әртүрлі: Quirk et al. үшін бұл тек етістік тобы (<i>has finished</i>), төмендегі сызбалардағыдай; Huddleston мен Pullum үшін оған етістіктің толықтауыштары да кіреді (<i>has finished the report</i>).</p>",
ru:"<p>Слова не соединяются в предложение напрямую. Сначала они образуют <b>группы</b> вокруг центрального слова — <b>вершины (head)</b>, которая определяет название и поведение группы. Затем группы выполняют функции членов предложения. Именно эта двухуровневая структура объясняет, почему одно слово может выполнять разные функции (Quirk et al., 1985; Huddleston &amp; Pullum, 2002). Термин <i>verb phrase</i> грамматики понимают по-разному: у Quirk et al. это только глагольная группа (<i>has finished</i>), как на схемах ниже; у Huddleston и Pullum в неё входят и дополнения глагола (<i>has finished the report</i>).</p>"})[l]+

en:"<p>Quirk et al. (1985) describe five clause elements: <b>Subject (S)</b>, <b>Verb (V)</b>, <b>Object (O)</b>, <b>Complement (C)</b> and <b>Adverbial (A)</b>. In the diagrams below, each box is one phrase: its function is shown at the top and its phrase type (NP, VP, AdjP, PP) underneath.</p>",
kk:"<p>Quirk et al. (1985) сөйлемнің бес элементін сипаттайды: <b>бастауыш (S)</b>, <b>етістік (V)</b>, <b>толықтауыш (O)</b>, <b>есім бөлік (C)</b> және <b>пысықтауыш (A)</b>. Сызбада бір сөйлем көрсетілген: әр қорап — бір тіркес, оның сөйлем мүшесі (жоғарыда) және тіркес түрі белгіленген.</p>",
ru:"<p>Quirk et al. (1985) выделяют пять элементов предложения: <b>подлежащее (S)</b>, <b>глагол (V)</b>, <b>дополнение (O)</b>, <b>предикатив (C)</b> и <b>обстоятельство (A)</b>. На схеме показано одно предложение: каждый блок — группа, с указанием её функции (вверху) и типа группы.</p>"})[l]+
TREE(l,[["S","NP","My younger brother"],["V","VP","sent"],["Oi","NP","me"],["Od","NP","a long message"],["A","PP","after the match"]])+
TREE(l,[["S","NP","The results"],["V","VP","seemed"],["C","AdjP","rather surprising"]])+
({en:"<p>The second diagram shows a <b>subject complement</b>: it describes the subject after a linking verb (Unit 5), and it can be an adjective phrase or a noun phrase (<i>She became <b>a doctor</b></i>).</p>",kk:"<p>Екінші сызбада <b>бастауышқа қатысты есім бөлік</b> көрсетілген: ол байланыстырушы етістіктен кейін бастауышты сипаттайды (5-бөлім) және сын есімді немесе зат есімді тіркес бола алады (<i>She became <b>a doctor</b></i>).</p>",ru:"<p>Вторая схема показывает <b>предикатив подлежащего</b>: он характеризует подлежащее после связки (раздел 5) и может быть адъективной или именной группой (<i>She became <b>a doctor</b></i>).</p>"})[l];})},

en:"<p>The verb determines which elements must appear. Quirk et al. (1985) identify seven basic patterns. They are finite and learnable, and they explain most simple sentences you will meet.</p>",

{h:{en:"Complements and adjuncts",kk:"Міндетті және қосымша элементтер",ru:"Комплементы и адъюнкты"},
b:L3(function(l){return ({
en:"<p>Huddleston and Pullum (2002) distinguish <b>complements</b>, which the verb requires or licenses, from <b>adjuncts</b> (modifiers), which can be added freely. Remove a complement and the sentence becomes incomplete or changes meaning; remove an adjunct and it remains complete. This explains why <i>She put the book</i> sounds unfinished while <i>She read the book</i> does not: <i>put</i> requires a location.</p>",
kk:"<p>Huddleston мен Pullum (2002) етістік талап ететін немесе рұқсат ететін <b>міндетті элементтерді (complements)</b> еркін қосылатын <b>қосымша элементтерден (adjuncts)</b> ажыратады. Міндетті элементті алып тастаса, сөйлем толық болмай қалады немесе мағынасы өзгереді; қосымша элементті алып тастаса, сөйлем толық күйінде қалады. Сондықтан <i>She put the book</i> аяқталмаған болып естіледі, ал <i>She read the book</i> олай естілмейді: <i>put</i> мекенді талап етеді.</p>",
ru:"<p>Huddleston и Pullum (2002) различают <b>комплементы</b>, которых требует или допускает глагол, и <b>адъюнкты</b> (модификаторы), добавляемые свободно. Без комплемента предложение становится неполным или меняет смысл; без адъюнкта остаётся полным. Поэтому <i>She put the book</i> звучит незаконченно, а <i>She read the book</i> — нет: <i>put</i> требует указания места.</p>"})[l]+
X(l,[["She read the book <b>(in the evening)</b>.",{en:"<i>in the evening</i> is an adjunct: optional.",kk:"<i>in the evening</i> — қосымша элемент: міндетті емес.",ru:"<i>in the evening</i> — адъюнкт: необязателен."}],
["She put the book <b>on the shelf</b>.",{en:"<i>on the shelf</i> is a complement of <i>put</i>: required.",kk:"<i>on the shelf</i> — <i>put</i> етістігінің міндетті элементі.",ru:"<i>on the shelf</i> — комплемент глагола <i>put</i>: обязателен."}]])+
NB(l,"info",T_.kzru,{
en:"Kazakh places the verb at the end (SOV) (Muhamedowa, 2016), and Russian allows flexible order because case endings show who did what. English shows these relations mainly by position, so moving an element can change the meaning (<i>The dog bit the man</i> / <i>The man bit the dog</i>). Learners who transfer Kazakh order may produce {x:I English study}.",
kk:"Қазақ тілінде етістік сөйлемнің соңында тұрады (SOV) (Muhamedowa, 2016), ал орыс тілінде септік жалғаулары кімнің не істегенін көрсететіндіктен, сөз тәртібі еркін. Ағылшын тілі бұл қатынастарды негізінен сөздің орны арқылы береді, сондықтан элементтің орнын ауыстыру мағынаны өзгертуі мүмкін (<i>The dog bit the man</i> / <i>The man bit the dog</i>). Қазақ тіліндегі тәртіпті көшірген оқушылар {x:I English study} деуі мүмкін.",
ru:"В казахском глагол стоит в конце (SOV) (Muhamedowa, 2016), а в русском порядок свободен, потому что падежные окончания показывают, кто что сделал. Английский выражает эти отношения в основном позицией, поэтому перестановка может изменить смысл (<i>The dog bit the man</i> / <i>The man bit the dog</i>). Перенося казахский порядок, учащиеся могут сказать {x:I English study}."});})},

{h:{en:"Three key disagreements",kk:"Үш негізгі келіспеушілік",ru:"Три ключевых расхождения"},
b:L3(function(l){return ({
en:"<h3>1. Determinative and determiner</h3><p>Huddleston and Pullum (2002) use <b>determinative</b> for the word class (<i>the, this, some</i>) and <b>determiner</b> for the function at the start of a noun phrase. The distinction is needed because a genitive phrase can perform the function (<i><b>Aigerim's</b> laptop</i>) without belonging to the class, and because a determinative can perform other functions (<i>This is <b>all</b> I need</i>).</p><h3>2. How big is the preposition class?</h3><p>Traditional grammar has three separate classes for <i>before</i>: preposition (<i>before lunch</i>), subordinating conjunction (<i>before we left</i>) and adverb (<i>I've seen it before</i>). The Cambridge Grammar argues that this is one word with one class, a preposition, which may take a noun phrase, a clause or no complement, just as a verb may be transitive or intransitive. The same reasoning makes the particle <i>up</i> in <i>give up</i> an intransitive preposition.</p><h3>3. Pronouns</h3><p>Since pronouns head noun phrases, Huddleston and Pullum treat them as a subclass of nouns. Most pedagogical grammars keep them separate because their forms (case, person) and their closed membership make them behave differently in learning.</p>",
kk:"<h3>1. Determinative және determiner</h3><p>Huddleston мен Pullum (2002) сөз табы үшін <b>determinative</b> (<i>the, this, some</i>), ал зат есімді тіркестің басындағы қызмет үшін <b>determiner</b> терминін қолданады. Бұл айырма қажет, өйткені тәуелдік тіркес тапқа жатпаса да, осы қызметті атқара алады (<i><b>Aigerim's</b> laptop</i>), ал детерминатив басқа қызметтерді де атқара алады (<i>This is <b>all</b> I need</i>).</p><h3>2. Предлог табы қаншалықты кең?</h3><p>Дәстүрлі грамматика <i>before</i> сөзін үш түрлі тапқа жатқызады: предлог (<i>before lunch</i>), сабақтастырушы жалғаулық (<i>before we left</i>) және үстеу (<i>I've seen it before</i>). Cambridge Grammar бұл — бір тапқа, яғни предлогқа жататын бір сөз деп дәлелдейді: етістік сабақты немесе салт бола алатыны сияқты, предлог та зат есімді тіркесті, сөйлемді алуы немесе толықтауышсыз тұруы мүмкін. Осы пайымдау бойынша <i>give up</i> тіркесіндегі <i>up</i> бөлшегі салт предлог болып шығады.</p><h3>3. Есімдіктер</h3><p>Есімдіктер зат есімді тіркестің ұйытқысы болатындықтан, Huddleston мен Pullum оларды зат есімнің түрі деп қарайды. Оқу грамматикаларының көбі оларды жеке қалдырады, өйткені олардың формалары (септік, жақ) мен жабық құрамы үйрену барысында оларды басқаша ұстайды.</p>",
ru:"<h3>1. Determinative и determiner</h3><p>Huddleston и Pullum (2002) используют термин <b>determinative</b> для класса слов (<i>the, this, some</i>) и <b>determiner</b> для функции в начале именной группы. Различие необходимо, потому что эту функцию может выполнять притяжательная группа (<i><b>Aigerim's</b> laptop</i>), не принадлежащая к классу, а детерминатив может выполнять другие функции (<i>This is <b>all</b> I need</i>).</p><h3>2. Насколько широк класс предлогов?</h3><p>Традиционная грамматика относит <i>before</i> к трём разным классам: предлог (<i>before lunch</i>), подчинительный союз (<i>before we left</i>) и наречие (<i>I've seen it before</i>). Cambridge Grammar утверждает, что это одно слово одного класса — предлог, который может присоединять именную группу, предложение или не иметь дополнения, подобно тому как глагол бывает переходным или непереходным. По той же логике частица <i>up</i> в <i>give up</i> — непереходный предлог.</p><h3>3. Местоимения</h3><p>Поскольку местоимения возглавляют именные группы, Huddleston и Pullum считают их подклассом существительных. Большинство учебных грамматик выделяют их отдельно, так как формы (падеж, лицо) и закрытый состав делают их особыми с точки зрения изучения.</p>"})[l];})},

{h:{en:"Gradience: why boundaries are not sharp",kk:"Біртіндік: шекараның неліктен анық емес екені",ru:"Градуальность: почему границы нечёткие"},
b:L3(function(l){return ({
en:"<p>Aarts (2007) shows that word classes have a core and a periphery. <b>Subsective gradience</b> is variation inside a class: <i>happy</i> is a more central adjective than <i>utter</i>, because <i>happy</i> passes every adjective test while <i>utter</i> is only attributive and not gradable. <b>Intersective gradience</b> describes forms that combine properties of two classes. Verbal <i>-ing</i> forms are the classic case: in <i>Reading novels relaxes me</i>, <i>reading</i> takes a direct object like a verb but fills a subject position like a noun phrase.</p>",
kk:"<p>Aarts (2007) сөз таптарының өзегі және шеткері аймағы болатынын көрсетеді. <b>Ішкі біртіндік (subsective gradience)</b> — бір тап ішіндегі айырмашылық: <i>happy</i> — <i>utter</i>-ге қарағанда орталық сын есім, өйткені <i>happy</i> сын есімге тән барлық тексерістен өтеді, ал <i>utter</i> тек анықтауыш болады және шырай қабылдамайды. <b>Аралық біртіндік (intersective gradience)</b> екі таптың белгілерін біріктіретін формаларды сипаттайды. Етістікке жақын <i>-ing</i> формалары — классикалық мысал: <i>Reading novels relaxes me</i> сөйлемінде <i>reading</i> етістік сияқты тура толықтауыш алады, бірақ зат есімді тіркес сияқты бастауыштың орнында тұр.</p>",
ru:"<p>Aarts (2007) показывает, что у классов слов есть ядро и периферия. <b>Субсективная градуальность</b> — различия внутри класса: <i>happy</i> — более «центральное» прилагательное, чем <i>utter</i>, так как <i>happy</i> проходит все тесты, а <i>utter</i> только атрибутивно и не имеет степеней. <b>Интерсективная градуальность</b> описывает формы, сочетающие свойства двух классов. Классический пример — глагольные формы на <i>-ing</i>: в <i>Reading novels relaxes me</i> слово <i>reading</i> имеет прямое дополнение, как глагол, но занимает позицию подлежащего, как именная группа.</p>"})[l]+

model:"<b>Model:</b> In <i>Reading novels relaxes me</i>, <i>reading novels</i> occupies the subject position and could be replaced by a noun phrase (<i>This hobby relaxes me</i>). Yet <i>reading</i> takes a direct object, <i>novels</i>, and cannot take an adjective (*<i>quick reading novels</i>); it can be modified by an adverb (<i>quickly reading novels</i>). These are verbal properties, so it is a verb form heading a non-finite clause that functions as subject: a gerund in traditional terms, a gerund-participle for Huddleston and Pullum (2002). In <i>the reading room</i>, <i>reading</i> classifies the room by purpose; it cannot take <i>very</i>, which suggests it is not an adjective but a modifier of noun-like character. The two uses illustrate intersective gradience (Aarts, 2007)."}

{h:{en:"Why the classes are mixed here",kk:"Бұл жерде таптар неліктен араласып берілген",ru:"Почему здесь классы перемешаны"},
b:L3(function(l){return ({
en:"<p>Earlier units practised one class at a time, which is the right way to begin. Real sentences, however, never announce which class is being tested. Research on <b>interleaved practice</b> shows that mixing similar categories, after they have first been learned separately, improves long-term retention and the ability to tell them apart (Nakata &amp; Suzuki, 2019; Brunmair &amp; Richter, 2019). Expect this unit to feel harder than the others; that difficulty is part of how it works.</p>",
kk:"<p>Алдыңғы бөлімдерде таптар бір-бірлеп жаттықтырылды, бастау үшін бұл дұрыс жол. Алайда нақты сөйлем қай таптың тексеріліп жатқанын ешқашан айтпайды. <b>Аралас жаттығу (interleaving)</b> туралы зерттеулер ұқсас категорияларды алдымен бөлек үйреніп, кейін араластырып жаттықтыру ұзақ мерзімді есте сақтауды және оларды ажырату қабілетін жақсартатынын көрсетеді (Nakata &amp; Suzuki, 2019; Brunmair &amp; Richter, 2019). Бұл бөлім басқаларынан қиынырақ көрінуі мүмкін; бұл қиындық — әдістің бір бөлігі.</p>",
ru:"<p>В предыдущих разделах части речи тренировались по одной — так и нужно начинать. Но настоящее предложение никогда не сообщает, какой класс проверяется. Исследования <b>чередующейся практики (interleaving)</b> показывают, что смешивание похожих категорий после их раздельного изучения улучшает долговременное запоминание и умение их различать (Nakata &amp; Suzuki, 2019; Brunmair &amp; Richter, 2019). Этот раздел может показаться труднее других — эта трудность и есть часть метода.</p>"})[l];})},

{h:{en:"A procedure for any word",kk:"Кез келген сөзге арналған тәсіл",ru:"Алгоритм для любого слова"},
b:L3(function(l){return ({
en:"<ol><li><b>Read the whole sentence first.</b> The class belongs to this use of the word.</li><li><b>Look left.</b> A determiner or adjective before it suggests a noun; a subject or auxiliary before it suggests a verb; <i>very</i> suggests an adjective or adverb.</li><li><b>Look right.</b> A noun phrase after it suggests a verb or a preposition; nothing after it, at the end of a multi-word verb, suggests a particle.</li><li><b>Try changing its form.</b> Plural <i>-s</i>, past <i>-ed</i>, comparative <i>-er</i>.</li><li><b>Ask what it modifies or links.</b> A noun (adjective, determiner), anything else (adverb), two units (conjunction), a noun phrase to the sentence (preposition).</li><li><b>Separate class from function.</b> A noun can be a modifier; an <i>-ing</i> form can be a subject.</li></ol>",
kk:"<ol><li><b>Алдымен бүкіл сөйлемді оқыңыз.</b> Сөз табы сөздің дәл осы қолданысына тиесілі.</li><li><b>Сол жағына қараңыз.</b> Алдында детерминатив не сын есім тұрса — зат есім болуы мүмкін; бастауыш не көмекші етістік тұрса — етістік; <i>very</i> тұрса — сын есім не үстеу.</li><li><b>Оң жағына қараңыз.</b> Одан кейін зат есімді тіркес келсе — етістік не предлог болуы мүмкін; көп сөзді етістіктің соңында ештеңе келмесе — бөлшек.</li><li><b>Формасын өзгертіп көріңіз.</b> Көпше <i>-s</i>, өткен шақ <i>-ed</i>, салыстырмалы <i>-er</i>.</li><li><b>Нені анықтайтынын немесе байланыстыратынын сұраңыз.</b> Зат есімді (сын есім, детерминатив), басқа кез келгенін (үстеу), екі бірлікті (жалғаулық), зат есімді тіркесті сөйлеммен (предлог).</li><li><b>Тап пен қызметті ажыратыңыз.</b> Зат есім анықтауыш бола алады; <i>-ing</i> формасы бастауыш бола алады.</li></ol>",
ru:"<ol><li><b>Сначала прочитайте всё предложение.</b> Часть речи относится к данному употреблению слова.</li><li><b>Посмотрите влево.</b> Детерминатив или прилагательное перед словом указывают на существительное; подлежащее или вспомогательный глагол — на глагол; <i>very</i> — на прилагательное или наречие.</li><li><b>Посмотрите вправо.</b> Именная группа после слова указывает на глагол или предлог; отсутствие продолжения в конце многословного глагола — на частицу.</li><li><b>Попробуйте изменить форму.</b> Мн. ч. <i>-s</i>, прошедшее <i>-ed</i>, сравнительное <i>-er</i>.</li><li><b>Спросите, что слово определяет или связывает.</b> Существительное (прилагательное, детерминатив), всё остальное (наречие), две единицы (союз), именную группу с предложением (предлог).</li><li><b>Разделяйте класс и функцию.</b> Существительное может быть определением; форма на <i>-ing</i> — подлежащим.</li></ol>"})[l];})}

{s:"The [[round]] table seats eight people.",a:"adjective",why:"Between <i>The</i> and a noun, describing its shape; <i>rounder</i> is possible."},
{s:"They walked [[round]] the lake.",a:"preposition",why:"Followed by the noun phrase <i>the lake</i>, expressing place."},
{s:"It was the final [[round]] of the competition.",a:"noun",why:"After <i>the final</i>; plural <i>rounds</i> is possible."},
{s:"[[That]] was a brilliant idea.",a:"pronoun",why:"<i>That</i> is the whole subject; no noun follows."},
{s:"I think [[that]] you're right.",a:"conjunction",why:"<i>that</i> introduces a content clause: a subordinator."},
{s:"[[That]] idea was brilliant.",a:"determiner",why:"<i>That</i> introduces the noun <i>idea</i>."},
{s:"She [[does]] yoga every morning.",a:"verb",why:"<i>does</i> is the only verb here and means 'practises'."},
{s:"She [[does]]n't like loud music.",a:"auxiliary",why:"<i>do</i>-support for the negative of <i>like</i>."},
{s:"The train arrived [[late]].",a:"adverb",why:"Modifies the verb <i>arrived</i>: a flat adverb."},
{s:"We had a [[late]] lunch.",a:"adjective",why:"Between <i>a</i> and a noun; <i>later</i> is possible."},
{s:"[[Oh]], I forgot my keys!",a:"interjection",why:"Stands outside the clause and expresses surprise."},
{s:"I haven't seen her [[since]] March.",a:"preposition",why:"Followed by the noun phrase <i>March</i>: a preposition."},
{s:"[[Since]] you're here, let's start the meeting.",a:"conjunction",why:"Introduces a clause of reason: a subordinating conjunction in this course's terms (a preposition with a clause complement in the Cambridge Grammar, Unit 15)."}
]},
{id:"u16a2",type:"gap",kind:{en:"Mixed transformation",kk:"Аралас өзгерту",ru:"Смешанное преобразование"},
title:{en:"Write the form that the sentence needs",kk:"Сөйлемге қажет форманы жазыңыз",ru:"Напишите форму, которая нужна предложению"},
instr:{en:"The base word may need to become a noun, verb, adjective or adverb.",kk:"Түбір сөз зат есімге, етістікке, сын есімге немесе үстеуге айналуы мүмкін.",ru:"Исходное слово может стать существительным, глаголом, прилагательным или наречием."},
items:[
{s:"Thank you for your ___ .",base:"help",a:["help"],why:"After <i>your</i>: a noun; <i>help</i> is both noun and verb (conversion)."},
{s:"The instructions were very ___ .",base:"help",a:["helpful"],why:"After <i>very</i>, describing the subject: adjective with <i>-ful</i>."},
{s:"She explained the rule very ___ .",base:"clear",a:["clearly"],why:"Describes how she explained: adverb."},
{s:"The ___ of the new library took two years.",base:"build",a:["building"],why:"After <i>The</i>, before <i>of</i>: a noun; here the <i>-ing</i> noun <i>building</i>."},
{s:"Could you ___ the problem a little?",base:"simple",a:["simplify"],why:"After <i>Could you</i>: a verb, formed with <i>-ify</i>."},
{s:"We were ___ by the news.",base:"surprise",a:["surprised"],why:"The people who experienced the feeling: <i>-ed</i> form."}
]},

checklist:["I used at least one noun as a modifier (<i>a city park</i>).","I used at least one linking verb + adjective.","I used a frequency adverb in mid position.","I used one word in two different classes.","Each annotation gives evidence, not only a label."],
model:"<b>Model extract:</b> My favourite place is a small <b>city</b> [noun as modifier: cannot take <i>very</i>] park near my flat. It <b>looks</b> [linking verb] <b>peaceful</b> [adjective after a linking verb] in the morning, and I <b>usually</b> [adverb, mid position before the main verb] walk there before work. Locals <b>park</b> [verb: follows the subject, could be <i>parked</i>] their bikes by the gate, while the <b>park</b> [noun: after <i>the</i>] itself stays quiet."}
]});

 title:{en:"Find only the verbs",kk:"Тек етістіктерді табыңыз",ru:"Найдите только глаголы"},
