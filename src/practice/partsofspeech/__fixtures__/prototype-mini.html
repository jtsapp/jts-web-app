/* sections as chapters */
section.ex{position:relative;padding:4px 0 0 0;margin:0 0 52px}

/* =====================================================================
   v7 — TYPOGRAPHY SYSTEM
   1 Topic  Golos Text 800, the word class's own colour and sign
   2 Term translation  Literata italic 500, directly under the English term
   3 Explanation  Golos Text 400, 17.5/1.7; its translation in Golos, softer
   4 Examples  Literata roman: the English under study
   Golos Text and Literata both carry full Kazakh and Russian Cyrillic.
   ===================================================================== */
:root{
  --f-ui:"Golos Text","PT Root UI",system-ui,sans-serif;
  --f-tl:"Literata",Georgia,serif;
  --display:"Golos Text","PT Root UI",system-ui,sans-serif;
}
body{font-family:var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga"}
section.ex>div,section.ex p,section.ex li{font-size:17.5px;line-height:1.7}
section.ex h2{font-family:var(--f-ui);font-weight:700;letter-spacing:-.025em;line-height:1.15}

/* translations: one language at a time, no labels, quietly elegant */
.trl::before{content:none!important;display:none!important}
.trl{font-family:var(--f-ui);font-weight:400;color:var(--ink2);padding-left:14px;border-left:2px solid var(--tl-c)}
.trl[lang=kk]{--tl-c:#0AC7FF}.trl[lang=ru]{--tl-c:#FF7D1D}
h1 .trl,h2 .trl,h3 .trl,.trl.trl-h{font-family:var(--f-tl);font-style:italic;font-weight:500;letter-spacing:0;border-left:0;padding-left:0;color:var(--ink2)}
h1 .trl{font-size:.42em}h2 .trl,.trl.trl-h{font-size:.68em}h3 .trl{font-size:.8em}
.u-hero .trl{border-left:0;padding-left:0}

/* term pairs: English first, translation right underneath */
.term-en{display:block}
.term-tl{display:block;font-family:var(--f-tl);font-style:italic;font-weight:500;letter-spacing:0;text-transform:none;line-height:1.25;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}

/* --- 1. the topic in the unit hero --- */
.topic-wrap{display:flex;align-items:flex-start;gap:clamp(12px,1.6vw,20px);margin:0 0 16px}
.topic-ico{flex:none;display:grid;place-items:center;width:clamp(48px,5vw,64px);height:clamp(48px,5vw,64px);margin-top:4px;border-radius:20px 20px 20px 6px;background:#fff;color:var(--tc);box-shadow:0 12px 26px -12px rgba(20,12,43,.6)}
.topic-ico svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.u-hero h1.topic{margin:0;font-family:var(--f-ui);font-weight:800;font-size:clamp(34px,4.4vw,58px);line-height:1.02;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 24px rgba(20,12,43,.4);max-width:600px}
.u-hero h1.topic.is-pos{font-size:clamp(46px,6.6vw,92px);letter-spacing:-.015em;text-transform:uppercase;line-height:.95}
.u-hero h1.topic .term-tl{font-size:max(19px,.36em);color:rgba(255,255,255,.92);margin-top:10px;text-shadow:0 2px 12px rgba(20,12,43,.45)}
.u-hero h1.topic.is-pos .term-tl{font-size:max(20px,.34em)}

/* --- topic rows on the map --- */
.w-stop-u a{grid-template-columns:44px minmax(0,1fr) auto 22px;gap:14px;padding:12px 16px 12px 12px;min-height:64px;border-left:0}
.t-ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px 14px 14px 4px;background:color-mix(in srgb,var(--tc) 11%,#fff);color:var(--tc)}
.t-ico svg,.n-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w-stop-u .t{font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.w-stop-u a.is-pos .t .term-en{font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--tc)}
.w-stop-u .t .term-tl{font-size:15px;margin-top:2px}
.w-stop-u a:hover{border-color:var(--tc)}

/* --- side map --- */
.side .nav-r a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 10px}
.n-ico{display:grid;place-items:center;width:30px;height:30px;border-radius:10px 10px 10px 3px;background:color-mix(in srgb,var(--tc) 11%,#fff);color:var(--tc)}

.lg-t .term-tl{font-size:12.5px;margin-top:1px}

/* --- pager --- */

.pg-t .term-tl{font-size:14px;font-weight:500}

/* --- island caption --- */
.isle-cls i{font-family:var(--f-tl);font-style:italic;font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px;opacity:.9}

/* --- examples stay in the reading serif, explanations in sans --- */
.exs .s{font-family:var(--serif)}

@media (max-width:760px){.u-hero h1.topic.is-pos.is-long{font-size:clamp(34px,10vw,46px)}}
@media (max-width:900px){.langs button{padding:6px 10px;font-size:0}.langs button::after{content:attr(data-short);font-size:13px;font-weight:600}}

/* =====================================================================
   v8 — LEARN ⇄ PRACTICE, and a quieter type scale
   Weights: 800 topic names only · 600 headings, buttons, labels · 400 text
   ===================================================================== */
section.ex h2{font-weight:600;font-size:clamp(24px,2.4vw,30px);letter-spacing:-.02em}
.w-map-h,.w-stop-t h3,.q-isle-t h2,.q-hero h1{font-weight:600}
.w-stop-t h3{font-size:clamp(24px,2.4vw,30px);letter-spacing:-.02em}
.btn{font-family:var(--f-ui);font-weight:600;font-size:16px;min-height:48px;padding:12px 22px;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.btn-xl{font-size:17px;min-height:54px;padding:14px 28px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.mode-b:focus-visible,.step:focus-visible{outline:3px solid var(--cyan-2,#0AC7FF);outline-offset:3px}
.tabs a{font-weight:600}

/* --- the switch: two places, two moods --- */
.mode-sw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 30px;max-width:820px}
.mode-b{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:24px;border:1.5px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink2);text-align:left;cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s,transform .2s var(--ease)}
.mode-b:hover{border-color:var(--brand);background:#fff;transform:translateY(-2px)}
.mode-i{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:18px 18px 18px 5px;background:var(--mist-2);color:var(--brand-ink)}
.mode-i svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mode-t{display:grid;gap:2px}
.mode-n .term-en{font-family:var(--f-ui);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.mode-n .term-tl{font-size:15px;margin-top:0}
.mode-t small{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--ink3)}
.mode-l[aria-selected="true"]{background:#fff;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft),var(--shadow);color:var(--ink)}
.mode-l[aria-selected="true"] .mode-i{background:var(--brand);color:#fff}
.mode-p .mode-i{background:#FFF7B8;color:#8A6A00}
.mode-p[aria-selected="true"]{background:var(--dusk);border-color:var(--dusk);box-shadow:0 18px 36px -18px rgba(42,22,112,.7)}
.mode-p[aria-selected="true"] .mode-i{background:var(--yellow);color:var(--night)}
.mode-p[aria-selected="true"] .mode-n .term-en{color:#fff}
.mode-p[aria-selected="true"] .mode-n .term-tl{color:rgba(255,255,255,.8)}
.mode-p[aria-selected="true"] .mode-t small{color:rgba(255,255,255,.7)}
.mode-view[hidden]{display:none!important}

/* --- end of the lesson: the road into practice --- */
.ready{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;max-width:820px;margin:64px 0 0;padding:26px 28px;border-radius:28px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.ready h2{margin:0 0 12px;font-weight:600;font-size:26px;letter-spacing:-.02em}
.ready h2 .term-tl{font-size:17px}
.ready-list{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.ready-list>span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--mist);font-weight:500;font-size:14.5px;color:var(--ink)}
.ready-list .term-tl{display:inline;font-size:13.5px;margin-left:6px}
.ready-list .term-en{display:inline}
.a-ico{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#fff;color:var(--brand-ink)}
.a-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn-practice{background:var(--dusk);color:#fff}
.btn-practice:hover{background:var(--brand);color:#fff}
.btn-practice svg{color:var(--yellow)}

/* --- practice: same world, a more active room --- */
.mv-practice{max-width:860px;padding:26px;border-radius:32px;background:linear-gradient(160deg,var(--dusk) 0%,#3B1F94 60%,#4A2BB8 100%);color:#fff;box-shadow:0 30px 60px -36px rgba(42,22,112,.8)}
.pr-head{display:flex;align-items:center;gap:16px;margin:0 0 22px}
.pr-head .ph-face{width:62px;height:62px;background:#fff}
.pr-k{font-family:var(--f-ui);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.pr-topic{margin:2px 0 0;font-family:var(--f-ui);font-weight:800;font-size:clamp(26px,3vw,36px);letter-spacing:.01em;text-transform:uppercase;color:#fff;line-height:1.05}
.pr-topic .term-tl{text-transform:none;letter-spacing:0;font-size:17px;color:rgba(255,255,255,.82);margin-top:4px;font-weight:500}
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.step{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;text-align:left;cursor:pointer;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.step:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.step[aria-selected="true"]{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 0 0 4px rgba(255,248,5,.55)}
.step-n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);font-family:var(--f-ui);font-weight:600;font-size:14px}
.step[aria-selected="true"] .step-n{background:var(--dusk);color:#fff}
.step.done .step-n{background:var(--green-2);color:#fff}
.step .a-ico{background:rgba(255,255,255,.14);color:#fff}
.step[aria-selected="true"] .a-ico{background:var(--mist);color:var(--brand-ink)}
.step-t{display:grid;gap:1px;min-width:0}
.step-do .term-en{font-family:var(--f-ui);font-weight:600;font-size:16.5px;line-height:1.25}
.step-do .term-tl{font-size:14px;color:inherit;opacity:.78;margin-top:0}
.step-s{font-size:13px;opacity:.7;font-weight:500}
.mv-practice .act{background:#fff;color:var(--ink);border:0;border-radius:26px;margin:0;box-shadow:0 24px 50px -30px rgba(0,0,0,.6)}
.act-do{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px;padding:4px 14px 4px 4px;border-radius:999px;background:var(--mist);font-family:var(--f-ui);font-weight:600;font-size:14.5px;color:var(--brand-ink)}
.act-do .term-en{display:inline}.act-do .term-tl{display:inline;margin:0 0 0 8px;font-size:13.5px}
.act-h h3{font-family:var(--f-ui);font-weight:600;font-size:clamp(21px,2vw,25px);letter-spacing:-.015em;line-height:1.25;margin:0 0 6px}
.act-in{color:var(--ink2);font-size:16px;margin:0}
.act .prog{font-family:var(--f-ui);font-size:14px;font-weight:500}
.act .bar{gap:12px;margin-top:18px}
.done-card .bar .btn{min-width:170px}
.mv-practice .u-quest{margin:26px 0 0;border-radius:26px}
@media (max-width:760px){
  .mode-sw{gap:8px;margin:18px 0 22px}
  .mode-b{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}
  .mode-i{width:44px;height:44px}
  .mode-n .term-en{font-size:19px}
  .mv-practice{padding:16px;border-radius:26px;margin:0 -6px}
  .pr-head .ph-face{width:48px;height:48px}
  .steps{grid-template-columns:1fr}
  .step{padding:11px 14px}
  .ready{padding:20px}
  .btn-practice{width:100%}
}
[hidden]{display:none!important}

/* =====================================================================
   v9 — audit fixes: nothing may sit on top of a mascot or a word
   ===================================================================== */
/* hero words float in open sky only: never over the team or the headline */
.w-tile:nth-child(1){left:48%;top:7%}
.w-tile:nth-child(2){left:60%;top:21%}
.w-tile:nth-child(3){left:55%;top:44%}
.w-tile:nth-child(4){left:88%;top:8%}
.w-tile:nth-child(5){left:48%;top:35%}
.w-tile:nth-child(6){left:77%;top:46%}
.w-tile:nth-child(7){left:62%;top:3%}
/* quest card: text and guide get their own columns, so they can never collide */
.u-quest{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:0 12px}
.u-quest-t{grid-column:1;grid-row:1;align-self:center;max-width:none}
.u-quest-m{position:relative;grid-column:2;grid-row:1;right:auto;bottom:auto;align-self:end;height:200px;margin:12px 22px 0 0}
.mv-practice .u-quest-m{height:170px}
@media (max-width:760px){
  .u-quest-t{padding:22px 0 22px 20px;max-width:none}
  .u-quest-m,.mv-practice .u-quest-m{height:118px;margin-right:10px}
  .u-quest b{font-size:clamp(21px,6vw,26px)}
}
.tree .row{flex-wrap:wrap;row-gap:10px}.tree{overflow-x:visible}
.tree .row{min-width:0!important;flex-wrap:wrap!important}
.side .lv{color:#5f5a66}

    line:{en:"I read the evidence: position, form and the words around. Follow the clues with me.",
          kk:"Мен дәлелді оқимын: сөздің орны, формасы және айналасындағы сөздер. Іздерге менімен бірге ер.",
          ru:"Я читаю улики: место слова, его форму и соседние слова. Иди по следу вместе со мной."}},
  spark:{name:"Spark",img:"m_spark",face:"f_spark",color:"#FF631E",
    role:{en:"Energy and humour",kk:"Қуат пен әзіл",ru:"Энергия и юмор"},
    line:{en:"Action, speed, movement! If a word makes something happen, I'm already there.",
          kk:"Әрекет, жылдамдық, қозғалыс! Сөз бір нәрсені болдыратын болса, мен сол жердемін.",
          ru:"Действие, скорость, движение! Если слово что-то делает, я уже рядом."}},
  luna:{name:"Luna",img:"m_luna",face:"f_luna",color:"#0AAFFF",
    role:{en:"Patient and thoughtful",kk:"Сабырлы әрі ойшыл",ru:"Терпеливая и вдумчивая"},

          ru:"Я замечаю мелочи, которые меняют всё: какой предмет и где именно он находится."}},
  aizere:{name:"Aizere",img:"m_aizere",face:"f_aizere",color:"#C2367D",

          kk:"Мен байланыстырамын: сөзді сөзбен, ойды оймен, ағылшын тілін қазақ және орыс тілдерімен.",

const REGIONS=[
 {id:"gate",name:"The Word Gate",img:"r_gate",guide:"dexter",units:["u01"],cls:"f",hue:"#874BF8",
  intro:{en:"Every journey starts here. Before we cross to the islands, learn the rule that opens every gate: a word's class is decided by the job it does in its sentence.",
         kk:"Әр сапар осы жерден басталады. Аралдарға аттанбас бұрын барлық қақпаны ашатын ережені біл: сөздің табын оның сөйлемде атқаратын қызметі анықтайды.",
         ru:"Каждое путешествие начинается здесь. Прежде чем отправиться на острова, узнай правило, которое открывает все ворота: часть речи слова определяется работой, которую оно выполняет в предложении."}},
 {id:"nouns",name:"The Noun Bazaar",img:"r_nouns",guide:"dexter",units:["u02","u03"],cls:"n",hue:"#1D5FC4",
  intro:{en:"Every stall here holds something with a name: people, places, objects and ideas. When a name has already been said, pronouns stand in for it.",
         kk:"Мұндағы әр сөреде аты бар нәрсе тұр: адамдар, орындар, заттар және идеялар. Аты бұрын аталған болса, оның орнына есімдік келеді.",
         ru:"На каждом прилавке здесь лежит то, у чего есть имя: люди, места, предметы и идеи. Когда имя уже прозвучало, его заменяет местоимение."}},
 {id:"lanterns",name:"The Lantern Quarter",img:"r_lanterns",guide:"aizere",units:["u04"],cls:"det",hue:"#0B7F7A",
  intro:{en:"Here every lantern points at something. Determiners tell the listener which one, whose, and how many.",
         kk:"Мұнда әр шам бір нәрсені нұсқайды. Детерминативтер тыңдаушыға қайсысы, кімдікі және қанша екенін айтады.",
         ru:"Здесь каждый фонарь на что-то указывает. Детерминативы сообщают слушателю, какой именно, чей и сколько."}},
 {id:"foundry",name:"The Verb Foundry",img:"r_foundry",guide:"spark",units:["u05","u06"],cls:"v",hue:"#C8293E",
  intro:{en:"Nothing here stands still! Verbs make things happen, and auxiliaries and modals set the time, the question and the attitude.",
         kk:"Мұнда ештеңе бір орында тұрмайды! Етістіктер іс-әрекетті тудырады, ал көмекші және модальді етістіктер шақты, сұрақты және көзқарасты белгілейді.",
         ru:"Здесь ничто не стоит на месте! Глаголы заставляют всё происходить, а вспомогательные и модальные глаголы задают время, вопрос и отношение."}},
 {id:"gardens",name:"The Adjective Gardens",img:"r_gardens",guide:"luna",units:["u07"],cls:"adj",hue:"#1E7F34",
  intro:{en:"One stroke of the brush and a plain grey teapot becomes small, shiny or old. Adjectives tell us what things are like.",
         kk:"Қылқаламды бір сілтесең, қарапайым сұр шәйнек кішкентай, жылтыр немесе ескі болып шығады. Сын есімдер заттың қандай екенін айтады.",
         ru:"Один взмах кисти, и простой серый чайник становится маленьким, блестящим или старым. Прилагательные сообщают, какие предметы."}},
 {id:"clockworks",name:"The Adverb Clockworks",img:"r_clockworks",guide:"spark",units:["u08"],cls:"adv",hue:"#B85A00",
  intro:{en:"How fast? How often? How much? The clocks, dials and rapids answer. Adverbs change how, when, where and to what degree something happens.",
         kk:"Қаншалықты жылдам? Қаншалықты жиі? Қаншалықты көп? Сағаттар, тетіктер мен сарқырамалар жауап береді. Үстеулер іс-әрекеттің қалай, қашан, қайда және қаншалықты болатынын өзгертеді.",
         ru:"Как быстро? Как часто? Насколько? Отвечают часы, циферблаты и пороги. Наречия меняют то, как, когда, где и в какой степени что-то происходит."}},
 {id:"isles",name:"The Preposition Isles",img:"r_isles",guide:"luna",units:["u09"],cls:"p",hue:"#6B5634",
  intro:{en:"On, under, between, through: on these islands one small word decides where everything is and where it is going.",
         kk:"On, under, between, through: бұл аралдарда бір кішкентай сөз бәрінің қайда тұрғанын және қайда бара жатқанын шешеді.",
         ru:"On, under, between, through: на этих островах одно маленькое слово решает, где всё находится и куда движется."}},
 {id:"bridges",name:"The Conjunction Bridges",img:"r_bridges",guide:"aizere",units:["u10","u11"],cls:"cj",hue:"#4B5563",
  intro:{en:"The islands drifted apart in the storm. Conjunctions knit them back together, and small words like <i>oh</i> and <i>well</i> connect the people in a conversation.",
         kk:"Дауыл кезінде аралдар бір-бірінен алыстап кетті. Жалғаулықтар оларды қайта жалғайды, ал <i>oh</i>, <i>well</i> сияқты шағын сөздер әңгімеге қатысушыларды байланыстырады.",
         ru:"Во время бури острова разошлись. Союзы снова связывают их, а маленькие слова вроде <i>oh</i> и <i>well</i> соединяют собеседников в разговоре."}},

return '<div class="dossier"><a class="g-back" href="#bureau">← City map</a><div class="kicker">The Meridian Bureau</div><h1>Design dossier</h1>'+
'<p class="lede">The research basis, the game architecture and the reasoning behind every mechanic. The game was designed in this order: evidence first, mechanics second, content third, code last.</p>'+

'<section class="ex"><h2>1. What the research says</h2>'+
'<p><b>Games can work, but the design decides.</b> Meta-analyses find that well-designed digital games improve learning compared with conventional instruction, and that design features matter more than the label "game" (Clark et al., 2016; Wouters et al., 2013). Wouters et al. (2013) found serious games more effective for learning and retention, but not more motivating than conventional instruction, and more effective when combined with other instruction and played over several sessions. Mayer (2019) argues for a <i>value-added</i> approach: rather than asking whether games beat lessons, ask which features improve learning. In his review, explanatory feedback, self-explanation and pre-training add value, while elaborate narrative and decoration often do not.</p>'+
'<p><b>Gamification is not game-based learning.</b> Gamification adds game elements such as points, badges and leaderboards to a non-game activity (Deterding et al., 2011); game-based learning makes the activity itself the game (Plass et al., 2015). The gamification meta-analysis by Sailer and Homner (2020) found small positive effects, with the cognitive effect the most stable; tangible expected rewards can undermine intrinsic motivation (Deci et al., 1999). This is why the Bureau has no points, badges or leaderboards.</p>'+
'<p><b>Motivation comes from competence, autonomy and relatedness.</b> Self-Determination Theory explains game enjoyment through these three needs (Ryan &amp; Deci, 2000; Ryan et al., 2006). Flow requires a balance between challenge and skill and clear goals with immediate feedback (Csikszentmihalyi, 1990). Malone (1981) identified challenge, curiosity and fantasy as sources of intrinsic motivation in instructional games, adding that the fantasy should be connected to the skill being learned.</p>'+
'<p><b>Learning science constrains the design.</b> Working memory is limited, so new content must not compete with complex game rules (Sweller, 1988). Retrieval practice, spacing and interleaving of confusable categories improve retention (Roediger &amp; Karpicke, 2006; Nakata &amp; Suzuki, 2019). Mastery learning requires learners to reach a criterion before moving on, with corrective loops for errors (Bloom, 1968). Experiential, situated and constructivist accounts stress learning through action in meaningful contexts (Kolb, 1984; Lave &amp; Wenger, 1991).</p></section>'+

'<section class="ex"><h2>2. From theory to mechanics</h2>'+T(["Principle","Source","How the Bureau applies it"],[
["Explanatory feedback","Hattie &amp; Timperley (2007); Mayer (2019)","Every answer is evaluated immediately and explained grammatically, including wrong clicks in evidence hunts."],
["Mastery and corrective loops","Bloom (1968)","A wrongly answered item returns at the end of the stage; a stage closes only when every item is solved."],
["Challenge–skill balance","Csikszentmihalyi (1990)","Each case escalates from recognition to distinction to application; stages are labelled with CEFR ranges."],
["Competence and autonomy","Ryan et al. (2006)","Visible progress through real completion; every case is open, the map recommends the next one, and completed stages can be replayed in any order."],
["Cognitive load","Sweller (1988)","One mechanic per stage, a single new rule at a time, short sentences when the grammar is new."],
["Retrieval and interleaving","Roediger &amp; Karpicke (2006); Nakata &amp; Suzuki (2019)","Later cases reuse earlier classes; the final case mixes all of them."],
["Situated learning and endogenous fantasy","Lave &amp; Wenger (1991); Malone (1981)","Every task is a job the city needs: a lost-property report, a timetable, a map, a newspaper page. The grammar decision is the action."],
["Limited value of decoration","Mayer (2019)","Narrative frames each case in a few sentences and never delays the task; sound and confetti are brief and can be muted."]
])+'</section>'+

'<section class="ex"><h2>3. The mechanics, evaluated</h2>'+T(["Pattern","How it works","Why it engages","Learning outcome","Limitation","Use for parts of speech","Levels"],[
["Evidence hunt (hidden objects)","Find every word of a class in a document","Search and discovery; curiosity","Recognition in context","Rewards scanning if overused","Nouns, adjectives, adverbs in authentic-style texts; explanatory notes on wrong clicks","A0–B1"],
["Sorting / classification","Place a word in context into a category","Quick, tactile decisions","Distinction between close categories","Can become mechanical","Count/non-count, linking/action, -ing functions","A1–B2"],
["Deduction","Choose the class, then the evidence that proves it","Detective reasoning; certainty earned","Diagnostic tests become a habit","Slower; needs prior explanation","Class vs function; borderline cases","B1–C2"],
["Workbench (transformation)","Produce the form a slot needs","Building something","Productive word-form knowledge","Typing errors on mobile","Plurals, comparatives, derivation, conversion","A2–C1"],
["Fault finding","Locate an error, then repair it","Investigation; error spotting is satisfying","Noticing and accuracy","Exposure to errors must be followed by correct forms","Agreement, auxiliaries, articles, adverb placement","A2–C1"],
["Conversation (branching dialogue)","Choose what to say; wrong choices cause realistic misunderstandings","Social stakes; role-play","Grammar as meaning in communication","Limited branches","Articles, pronoun reference, modals, conjunctions","A2–B2"],
["Reconstruction (sequencing)","Rebuild torn text from pieces, sometimes with decoys","Puzzle completion","Word order and clause patterns","Can be solved by trial and error","Questions, adjective order, clause patterns","A1–B2"],
["Field work (spatial map)","Interpret spatial descriptions on a street plan","Exploration","Prepositional meaning","Spatial use is only part of prepositions","Place prepositions, complex prepositions","A1–B1"],
["Reference tracing","Link a pronoun to what it stands for","Mystery solving","Cohesion and pronoun reference","Text must be carefully controlled","Pronouns, determiners vs pronouns","A2–B2"],
["Blueprint analysis","Label every phrase of a clause with its function","Completing a system","Syntactic functions","Abstract for beginners","S, V, O, C, A; clause patterns","B1–C1"]
])+'<p>Mechanics not used: leaderboards and badges (extrinsic, unstable motivational effects, Sailer &amp; Homner, 2020); time pressure (penalises learners who need processing time and was reported as a source of stress in Kahoot! research, Wang &amp; Tahir, 2020); open sandbox building (high load without clear grammatical decisions).</p></section>'+

'<section class="ex"><h2>4. What we learned from existing products</h2>'+T(["Product or genre","Strength to adapt","Limitation to avoid"],[
["Duolingo","Short sessions, immediate feedback, regular practice. A semester-long study found that learning gains varied widely between learners and were related to the time they spent in the app (Loewen et al., 2019).","Limited explanation of grammar; extrinsic streak mechanics. The Bureau links each case to a full explanation."],
["Kahoot!","Fast feedback and high engagement in class; a review of 93 studies reported positive effects on performance and attitudes (Wang &amp; Tahir, 2020).","Time pressure and a quiz format that rewards speed. The Bureau is untimed."],
["Wordwall","Variety of templates for teacher-made tasks.","Templates rather than designed progression. Each Bureau case is authored as a sequence."],
["Minecraft Education","Exploration and construction in a shared world.","Grammar has to be imposed on the world. In the Bureau the world is made of texts, so the grammar is the world."],
["The Sims","Everyday situations and social interaction.","No explicit language focus. The Bureau adapts the everyday-situation idea for its dialogues."],
["Educational escape rooms","Linked puzzles, a goal and teamwork; a systematic review found strong engagement but few rigorous outcome studies (Veldkamp et al., 2020).","Puzzles can become unrelated to the learning goal. Every Bureau puzzle is a grammar decision."],
["Mystery and adventure games","Curiosity, clues and deduction.","Long narrative passages delay the task. Bureau briefings are short."]
])+'<p>No visual design, character or text from these products has been reproduced; only general design principles have been adapted.</p></section>'+

'<section class="ex"><h2>5. Architecture</h2>'+
'<p><b>Concept.</b> A connected investigation in one city. Thirteen cases follow the order of the explanation units, so each case reinforces what the learner has just studied. The city map is a single route: progress is literally a journey through the parts of speech.</p>'+
'<p><b>Inside a case.</b> A short briefing from a character sets a goal. Four or five stages follow, each with a different mechanic and a rising level: recognition, then distinction, then application, then a final stage that combines the case with earlier knowledge. Each stage ends by stating the principle the learner has established. The case debrief summarises the grammar and reports first-attempt accuracy, the only score shown, because it is the useful one.</p>'+
'<p><b>Adaptation.</b> Difficulty adapts through the mastery loop: items answered wrongly return until solved, so a learner who struggles gets more practice, and one who succeeds moves on quickly. Clues are available on request in the workbench stages. Accuracy below 60% in a case triggers a recommendation to re-read the unit and replay.</p>'+
'<p><b>Levels.</b> Early cases use short sentences and everyday vocabulary (A1–B1). Middle cases add distinctions and production (B1–B2). The last cases require analysis of ambiguity, competing frameworks and multiple simultaneous errors (C1–C2). Difficulty comes from the grammar, not from rare vocabulary.</p>'+
'<p><b>Integration.</b> Each explanation unit links to its case, and each case links back to its unit. Progress is saved on the learner\'s device.</p></section>'+

CASES.push({
id:"c01",unit:"u01",short:"Records Office",title:"The Mislabelled Archive",place:"Records Office",mark:"I",color:"#1f4f8f",level:"A1–C1",
who:{name:"Ines Kerey",role:"Director of the Bureau"},
brief:"<p>Welcome to the Bureau. Last night's fault did not only damage words; it damaged the labels. The Records Office catalogues every document by the word classes it contains, and half of those labels are now wrong.</p><p>Before I send you into the districts, I need to know you can do what the machine could not: decide a word's class from the evidence in its sentence, not from the word alone.</p>",
debrief:"<p>You have shown the Bureau's first principle: a word's class belongs to its use in a sentence. <i>Work, light, clean</i> and <i>fast</i> changed class from sentence to sentence, and you decided each one from position, form and the words around it.</p><p>You also separated class from function: <i>stone</i> in <i>a stone wall</i> is a noun doing a modifier's job. Every later case depends on this distinction.</p>",
stages:[
{type:"sort",title:"Relabel the drawers",level:"A1–B1",bins:["noun","verb","adjective","adverb"],
intro:"<p>Each card shows a word and the sentence it was filed with. Put it in the drawer for its class <b>in that sentence</b>. Drag the card or tap a drawer.</p>",
learned:"The same spelling can be a noun, verb, adjective or adverb. Position and possible endings, not the word itself, decide.",
items:[
{w:"work",ctx:"They <b>work</b> in the city centre.",a:"verb",why:"After the subject <i>they</i>; could become <i>worked</i>."},
{w:"work",ctx:"Her <b>work</b> won a national prize.",a:"noun",why:"After the determiner <i>her</i>, heading the subject noun phrase."},
{w:"light",ctx:"This laptop is very <b>light</b>.",a:"adjective",why:"After <i>very</i> and the linking verb <i>is</i>; <i>lighter</i> is possible."},
{w:"light",ctx:"Could you <b>light</b> the fire?",a:"verb",why:"After <i>you</i> in a question with <i>could</i>, taking the object <i>the fire</i>."},
{w:"fast",ctx:"She types <b>fast</b>.",a:"adverb",why:"It tells us how she types: it modifies the verb."},
{w:"fast",ctx:"We took a <b>fast</b> train.",a:"adjective",why:"Between <i>a</i> and the noun <i>train</i>."},
{w:"clean",ctx:"The kitchen is finally <b>clean</b>.",a:"adjective",why:"A complement after <i>is</i>, describing the subject."},
{w:"clean",ctx:"We <b>clean</b> the office every Friday.",a:"verb",why:"After the subject, with the object <i>the office</i>."},
{w:"round",ctx:"The final <b>round</b> starts at six.",a:"noun",why:"After <i>the final</i>; plural <i>rounds</i> is possible."},
{w:"late",ctx:"The bus arrived <b>late</b> again.",a:"adverb",why:"It modifies the verb <i>arrived</i>: a flat adverb with the same form as the adjective."}
]},
{type:"hunt",title:"Find the verbs in the night report",level:"A2–B1",target:"verb (lexical or auxiliary)",
intro:"<p>The night guard's report lost all its verb labels. Find every verb, including auxiliaries. Some words that look like verbs are being used as nouns.</p>",
trap:"Not a verb here. Check what comes before it: a determiner or adjective means a noun.",
learned:"A verb follows the subject or an auxiliary and can change for tense. A determiner in front signals a noun, even for words like <i>work</i> and <i>walk</i>.",
items:[
{text:"The guard {finished} his {walk} at midnight. The lights {were} off, but the {work} on the third floor {had} not {stopped}. Someone {was} {moving} boxes.",
notes:{finished:"past tense after the subject <i>The guard</i>.",were:"<i>be</i> as a linking verb in the past.",had:"auxiliary for the perfect: <i>had stopped</i>.",stopped:"past participle after <i>had</i>.",was:"auxiliary <i>be</i> for the progressive.",moving:"<i>-ing</i> form after <i>was</i>: progressive."},
traps:{walk:"<i>walk</i> follows <i>his</i>: here it is a noun.",work:"<i>work</i> follows <i>the</i> and heads a noun phrase: a noun here.",lights:"<i>lights</i> follows <i>The</i> and is plural: a noun.",boxes:"<i>boxes</i> is the object noun of <i>moving</i>.",floor:"a noun after <i>the third</i>."},
why:"The verbs carry tense or follow an auxiliary. <i>walk</i> and <i>work</i> were the traps: they follow <i>his</i> and <i>the</i>."}
]},
{type:"deduce",title:"Class or function?",level:"B1–B2",
intro:"<p>The machine labelled every modifier before a noun as an adjective. Decide the true class, then choose the evidence that proves it.</p>",
learned:"A noun can function as a modifier without becoming an adjective. Adjectives accept <i>very</i> and can follow <i>seem</i>; nouns as modifiers cannot.",
items:[
{s:"a [[stone]] bridge",classes:["adjective","noun"],a:"noun",evidence:["*a very stone bridge and *the bridge seems stone are impossible","It comes before another noun","It describes the bridge"],why:"Adjective tests fail, so <i>stone</i> remains a noun functioning as a modifier."},
{s:"a [[narrow]] bridge",classes:["adjective","noun"],a:"adjective",evidence:["a very narrow bridge / the bridge seems narrow / narrower","It comes before another noun","It describes a quality"],why:"All adjective tests succeed."},
{s:"the [[city]] council",classes:["adjective","noun"],a:"noun",evidence:["*a very city council is impossible; <i>the city</i> can stand alone as a noun phrase","It modifies <i>council</i>","It is a common word"],why:"<i>city</i> is a noun modifying another noun."},
{s:"a [[noisy]] council meeting",classes:["adjective","noun"],a:"adjective",evidence:["a very noisy meeting / the meeting seems noisy","It ends in <i>-y</i>","It comes first in the phrase"],why:"The ending <i>-y</i> is only a clue; the tests are the proof."},
{s:"She gave a brilliant [[performance]].",classes:["verb","noun","adjective"],a:"noun",evidence:["It follows <i>a brilliant</i> and can be plural: <i>performances</i>","It names an action","It is a long word"],why:"Meaning (an action) would mislead you; position and form show a noun."},
{s:"Their [[arrival]] was delayed.",classes:["verb","noun"],a:"noun",evidence:["It follows the determiner <i>Their</i> and heads the subject","It describes something happening","It comes before <i>was</i>"],why:"Many nouns name actions. The evidence is grammatical, not semantic."}
]},
{type:"dialogue",title:"Training the new archivist",level:"B1–C1",
intro:"<p>The junior archivist, Timur, has questions about the labels. Choose the reply that gives him a reliable principle.</p>",
learned:"Meaning is a starting point; form and distribution are the decisive evidence.",
items:[
{who:"Timur",lines:[["Timur","<i>Arrival</i> is an action, so it's a verb, right?"]],prompt:"Your reply:",options:[
{t:"Not here. It follows a determiner and can be plural, so it is a noun.",ok:true,reply:"So I should check the grammar around it, not just the meaning. Got it.",why:"Correct: meaning alone misleads; distribution and form decide."},
{t:"Yes. Words for actions are always verbs.",ok:false,reply:"Then why does the label say <i>the arrival</i>? Verbs don't follow <i>the</i>.",why:"Many nouns denote actions: <i>arrival, decision, destruction</i>."},
{t:"It depends on how long the word is.",ok:false,reply:"Length? That can't be how grammarians decide.",why:"Word length has nothing to do with word class."}]},
{who:"Timur",lines:[["Timur","<i>Friendly</i> ends in <i>-ly</i>. Shall I file it with the adverbs?"]],prompt:"Your reply:",options:[
{t:"No. Test it: <i>a very friendly person</i>, <i>she seems friendly</i>. It modifies a noun, so it is an adjective.",ok:true,reply:"So an ending is a clue, not a proof.",why:"Correct: <i>friendly, lovely, costly</i> are adjectives despite <i>-ly</i>."},
{t:"Yes, every <i>-ly</i> word is an adverb.",ok:false,reply:"But we write <i>a friendly person</i>. An adverb can't modify <i>person</i>, can it?",why:"Endings are clues; tests are proof."},
{t:"File it under nouns; it names a quality.",ok:false,reply:"Then why can it follow <i>very</i>? Nouns can't.",why:"Nouns do not take <i>very</i>; adjectives do."}]},
{who:"Timur",lines:[["Timur","Last one: what's the fastest test for whether something is a noun?"]],prompt:"Your reply:",options:[
{t:"Put <i>the</i> in front and try a plural; then check it heads a phrase that can be a subject.",ok:true,reply:"Determiner, plural, subject position. I'll use those three.",why:"These are standard distributional and morphological tests (Huddleston &amp; Pullum, 2002)."},
{t:"Ask whether you can touch it.",ok:false,reply:"I can't touch <i>happiness</i>, but it's still on the noun shelf.",why:"Abstract nouns pass the grammatical tests too."},
{t:"Check whether it starts with a capital letter.",ok:false,reply:"Only proper nouns do that. What about <i>table</i>?",why:"Capitals mark proper nouns only."}]}
]}
]});

CASES.push({
id:"c02",unit:"u02",short:"Lost Property",title:"The Lost Property Office",place:"Lost Property Office, Station Square",mark:"N",color:"#1f5fae",level:"A1–B2",
who:{name:"Dana Ospan",role:"Clerk, Lost Property"},
brief:"<p>Everything that was ever lost in Meridian ends up on my shelves. The fault scrambled the inventory: plurals are wrong, things that can't be counted have been counted, and I can't tell objects from descriptions.</p><p>Help me put the nouns back in order, starting with today's report.</p>",
debrief:"<p>The inventory is clean. You identified nouns by their position after determiners and adjectives, separated count from non-count uses, repaired irregular plurals and genitives, and recognised the jobs noun phrases do in a sentence.</p><p>Remember the shelf rule: non-count nouns such as <i>luggage, advice, information</i> never take <i>-s</i> or <i>a/an</i>.</p>",
stages:[
{type:"hunt",title:"Today's inventory",level:"A1–A2",target:"noun",
intro:"<p>Find every noun in the clerk's notes, including nouns used as modifiers.</p>",
trap:"Not a noun in this sentence. Ask: could it follow <i>the</i> here and become plural?",
learned:"Nouns head noun phrases after determiners and adjectives; a noun before another noun is still a noun.",
items:[
{text:"A {passenger} left a black {umbrella} and two {gloves} on the {train}. The {driver} brought them to the {office} after {lunch}.",
notes:{passenger:"after <i>A</i>; subject.",umbrella:"after <i>a black</i>.",gloves:"plural after <i>two</i>.",train:"after <i>the</i>.",driver:"subject after <i>The</i>.",office:"after <i>the</i>.",lunch:"non-count noun after <i>after</i>."},
traps:{black:"<i>black</i> describes the umbrella: an adjective.",left:"<i>left</i> is the verb.",brought:"a verb in the past.",them:"a pronoun standing for <i>umbrella and gloves</i>."},
why:"Every noun followed a determiner, a number, an adjective or a preposition."},
{text:"Someone found a {wallet} with no {money} but a {library} {card} inside. Its {owner} called about her {luggage} and some important {information}.",
notes:{wallet:"after <i>a</i>.",money:"non-count noun after <i>no</i>.",library:"a noun modifying <i>card</i>.",card:"head of <i>a library card</i>.",owner:"after <i>Its</i>.",luggage:"non-count noun after <i>her</i>.",information:"non-count, after <i>some important</i>."},
traps:{important:"describes <i>information</i>: an adjective.",inside:"an adverb (or preposition without a complement) of place.",Someone:"an indefinite pronoun: it cannot take <i>the</i>.",found:"the verb."},
why:"<i>library</i> was the hard one: a noun modifying another noun."}
]},
{type:"sort",title:"Count or non-count shelf?",level:"A2–B1",bins:["count","non-count"],
intro:"<p>Each item is filed with its sentence. Decide whether the noun is used as count or non-count <b>here</b>.</p>",
learned:"Countability belongs to a use of a noun. <i>coffee</i> is non-count as a substance and count as a cup; <i>advice, luggage, furniture</i> are non-count.",
items:[
{w:"luggage",ctx:"Your <b>luggage</b> is on the second shelf.",a:"non-count",why:"No plural and a singular verb: <i>luggage is</i>."},
{w:"suitcase",ctx:"Two <b>suitcases</b> arrived this morning.",a:"count",why:"A plural after a number."},
{w:"coffee",ctx:"Can I get two <b>coffees</b>, please?",a:"count",why:"Here it means cups of coffee, so it is countable."},
{w:"coffee",ctx:"There's <b>coffee</b> on this jacket.",a:"non-count",why:"A substance with no article."},
{w:"advice",ctx:"She gave me some useful <b>advice</b>.",a:"non-count",why:"<i>advice</i> has no plural; one item is <i>a piece of advice</i>."},
{w:"experience",ctx:"It was <b>an experience</b> I'll never forget.",a:"count",why:"A single event: count use with <i>an</i>."},
{w:"experience",ctx:"She has <b>experience</b> in customer service.",a:"non-count",why:"Accumulated knowledge: non-count, no article."},
{w:"furniture",ctx:"The <b>furniture</b> was damaged in the move.",a:"non-count",why:"A collective non-count noun; count items are <i>chairs, tables</i>."}
]},
{type:"forge",title:"Repair the labels",level:"A2–B2",
intro:"<p>Type the correct form of the noun for each label. Watch for irregular plurals and genitives.</p>",
learned:"Irregular plurals form a small closed set; genitive <i>'s</i> marks singulars and an apostrophe alone marks regular plurals.",
items:[
{s:"Box 14: shoes belonging to three ___",base:"child",a:["children"],why:"Irregular plural: <i>child → children</i>.",hint:"Plural with <i>-ren</i>."},
{s:"Box 15: two ___ of reading glasses",base:"pair",a:["pairs"],why:"Regular plural after <i>two</i>."},
{s:"Found under seat 9: a ___ notebook",base:"student",a:["student's"],why:"Singular genitive: <i>a student's notebook</i>.",hint:"One owner: add apostrophe + s."},
{s:"Found in the staff room: the ___ coats",base:"teacher",a:["teachers'"],why:"Plural genitive of a regular noun: apostrophe after <i>-s</i>.",hint:"Several owners."},
{s:"Box 22: a toy with two ___",base:"mouse",a:["mice"],why:"Vowel change: <i>mouse → mice</i>."},
{s:"Research report: the three ___ for selection",base:"criterion",a:["criteria"],why:"Greek plural used in academic English."},
{s:"Collected from the platform: four ___",base:"sheep",a:["sheep"],why:"<i>sheep</i> has the same form in the plural."}
]},
{type:"fault",title:"The clerk's mistakes",level:"A2–B1",
intro:"<p>A temporary clerk wrote these notes. Find the faulty word in each and choose the repair.</p>",
learned:"Non-count nouns take no plural; numbers above one require a plural; nouns modifying nouns stay singular.",
items:[
{s:"A passenger asked for [[informations]] about her bag.",fix:["information","an information","informationes"],why:"<i>information</i> is non-count."},
{s:"We received two [[umbrella]] this morning.",fix:["umbrellas","umbrellaes","umbrella's"],why:"After <i>two</i>, the plural is required."},
{s:"The owner thanked us for our [[advices]].",fix:["advice","advise","an advice"],why:"<i>advice</i> (noun) is non-count; <i>advise</i> is the verb."},
{s:"It was found in the [[shoes]] department.",fix:["shoe","shoe's","shoeses"],why:"A noun modifying another noun is normally singular: <i>the shoe department</i>."},
{s:"All the new [[furnitures]] arrived damaged.",fix:["furniture","furniture's","furnitur"],why:"<i>furniture</i> is non-count."}
]},
{type:"sort",title:"What is the noun phrase doing?",level:"B1–B2",bins:["subject","object","complement","modifier"],
intro:"<p>Final shelf. Decide the function of the bold phrase in its sentence.</p>",
learned:"Noun phrases can be subjects, objects and complements; a noun can also modify another noun.",
items:[
{w:"the station manager",ctx:"<b>The station manager</b> signed the form.",a:"subject",why:"Before the verb, controlling agreement."},
{w:"the form",ctx:"The station manager signed <b>the form</b>.",a:"object",why:"Receives the action of <i>signed</i>."},
{w:"a librarian",ctx:"The owner of the bag is <b>a librarian</b>.",a:"complement",why:"After the linking verb <i>is</i>, describing the subject."},
{w:"station",ctx:"She left it at the <b>station</b> café.",a:"modifier",why:"A noun modifying <i>café</i>."},
{w:"her keys",ctx:"Did anyone find <b>her keys</b>?",a:"object",why:"Object of <i>find</i>."},
{w:"a mystery",ctx:"The owner remains <b>a mystery</b>.",a:"complement",why:"<i>remain</i> is a linking verb here."}
]}
]});

CASES.push({
id:"c03",unit:"u03",short:"Anonymous Letters",title:"The Anonymous Letters",place:"Police Liaison Desk",mark:"P",color:"#6b4bb0",level:"A2–B2",
who:{name:"Rustem Ali",role:"Inspector, liaison desk"},
brief:"<p>Three letters arrived at the desk overnight, and the fault has made them hard to follow. Every <i>he</i>, <i>she</i>, <i>it</i> and <i>they</i> points somewhere, and if we follow the wrong one, we question the wrong person.</p><p>Trace the pronouns, then help me interview a witness without causing confusion.</p>",
debrief:"<p>The letters make sense again. You traced pronouns back to the noun phrases they stand for, chose subject and object forms correctly, used <i>it</i> for things, and removed pronouns that English does not allow.</p><p>The key insight: a pronoun replaces a whole noun phrase, and English gender is natural, not grammatical.</p>",
stages:[
{type:"link",title:"Trace the references",level:"A2–B1",
intro:"<p>Each pronoun stands for something earlier in the letter. Tap the noun phrase it refers to.</p>",
learned:"A pronoun refers to a whole noun phrase; agreement in number and natural gender, and the logic of the text, identify it.",
items:[
{text:"<<Mrs Abenova>> called <<Mr Daulet>> because [[she]] had lost her key.",p:"she",a:0,why:"<i>she</i> is feminine and singular, so only <i>Mrs Abenova</i> fits."},
{text:"<<The porter>> gave <<the visitors>> a map, but [[they]] still got lost.",p:"they",a:1,why:"<i>they</i> is plural, so it can only refer to <i>the visitors</i>."},
{text:"<<The parcel>> arrived with <<a note>>. Nobody has opened [[it]] yet, but the note was read at once.",p:"it",a:0,why:"The note was read, so the unopened item is <i>the parcel</i>."},
{text:"<<Daniyar>> told <<his sister>> that [[he]] would pay for the repair.",p:"he",a:0,why:"<i>he</i> is masculine singular: <i>Daniyar</i>."},
{text:"<<The two guards>> blamed <<the manager>>, so [[he]] wrote a formal reply.",p:"he",a:1,why:"<i>he</i> is singular; <i>the two guards</i> would be <i>they</i>."},
{text:"If <<a resident>> loses <<a card>>, [[they]] should report it to the desk.",p:"they",a:0,why:"Singular <i>they</i> for an unspecified person: the resident reports, not the card."}
]},
{type:"dialogue",title:"Interviewing the witness",level:"A2–B2",
intro:"<p>Mr Sato saw the delivery van. Your questions must be clear: a wrong pronoun form or reference will confuse him.</p>",
learned:"Subject forms before verbs, object forms after verbs and prepositions; a pronoun needs a clear antecedent.",
items:[
{who:"Mr Sato",lines:[["Mr Sato","The driver and his assistant carried two boxes into the hotel."]],prompt:"Ask about the assistant's appearance:",options:[
{t:"What did the assistant look like?",ok:true,reply:"Tall, grey coat, carrying a clipboard.",why:"Repeating the noun avoids ambiguity: <i>he</i> could mean the driver or the assistant."},
{t:"What did he look like?",ok:false,reply:"Which one? The driver or the assistant?",why:"Two possible masculine antecedents: the pronoun is ambiguous here."},
{t:"What did him look like?",ok:false,reply:"I'm sorry, I don't follow.",why:"<i>him</i> is an object form; the subject of <i>look</i> needs <i>he</i>."}]},
{who:"Mr Sato",lines:[["Mr Sato","Then the van drove off. It was white, quite old."]],prompt:"Confirm the detail about the van:",options:[
{t:"So it was an old white van?",ok:true,reply:"Exactly.",why:"<i>it</i> is the correct pronoun for a thing."},
{t:"So he was an old white van?",ok:false,reply:"He? The van, you mean.",why:"English uses <i>it</i> for objects; Russian <i>фургон — он</i> does not transfer."},
{t:"So she was old and white?",ok:false,reply:"Who? I was talking about the van.",why:"<i>she</i> refers to a female person; the van needs <i>it</i>."}]},
{who:"Mr Sato",lines:[["Mr Sato","The receptionist spoke to the driver and me."]],prompt:"Ask what she said:",options:[
{t:"What did she tell you and him?",ok:true,reply:"That the delivery was a day early.",why:"After <i>tell</i>, object forms: <i>you and him</i>."},
{t:"What did she tell you and he?",ok:false,reply:"Sorry?",why:"After a verb, the object form <i>him</i> is needed."},
{t:"What did her tell you?",ok:false,reply:"Her? Do you mean the receptionist?",why:"The subject of <i>tell</i> needs <i>she</i>."}]},
{who:"Mr Sato",lines:[["Mr Sato","The guests looked after themselves while the porters were busy."]],prompt:"Check that you understood:",options:[
{t:"So the guests carried their own bags?",ok:true,reply:"Yes, they managed alone.",why:"<i>themselves</i> refers back to the subject <i>the guests</i>."},
{t:"So the porters looked after the guests?",ok:false,reply:"No, the porters were busy. The guests helped themselves.",why:"A reflexive pronoun refers to the subject of its own clause."},
{t:"So the guests looked after each other's children?",ok:false,reply:"I didn't say that. Each other is different.",why:"<i>themselves</i> is reflexive; <i>each other</i> is reciprocal."}]}
]},
{type:"fault",title:"Edit the inspector's draft",level:"B1–B2",
intro:"<p>The draft statement has pronoun errors that a translation tool introduced. Find each one and repair it.</p>",
learned:"English needs a subject even for weather and distance (<i>it</i>), no resumptive pronoun in relative clauses, and <i>it</i> for objects.",
items:[
{s:"[[Was]] raining when the van arrived.",task:"A required word is missing. Tap the word where the gap begins.",fix:["It was","There was","Was it"],why:"English needs the dummy subject <i>it</i>: <i>It was raining</i>."},
{s:"The van, which the driver had parked [[it]] outside, was unlocked.",fix:["(remove it)","them","its"],why:"<i>which</i> already stands for the van; the extra pronoun is ungrammatical."},
{s:"The receptionist checked the parcel and said [[he]] was damaged.",fix:["it","she","him"],why:"The parcel is a thing: <i>it</i>."},
{s:"The manager asked my colleague and [[I]] to wait.",fix:["me","myself","mine"],why:"Object of <i>asked</i>: <i>me</i>."},
{s:"The new guard introduced [[hisself]] to the staff.",fix:["himself","his self","himselves"],why:"The reflexive form is <i>himself</i>."}
]},
{type:"rebuild",title:"Restore the summary",level:"B1–B2",
intro:"<p>The final summary was cut into pieces. Restore each sentence. One piece in some sentences is a decoy that does not belong.</p>",
learned:"Existential <i>there</i> introduces new information; dummy <i>it</i> fills the subject before a later clause; relative clauses take no extra pronoun.",
items:[
{w:["There","was","a","white","van","outside","the","hotel"],a:["There was a white van outside the hotel"],why:"Existential <i>there</i> + <i>be</i> introduces the van."},
{w:["It","is","important","to","find","the","driver"],decoy:["him"],a:["It is important to find the driver"],why:"<i>It</i> anticipates the real subject <i>to find the driver</i>."},
{w:["This","is","the","parcel","that","we","found"],decoy:["it"],a:["This is the parcel that we found"],why:"No pronoun after <i>found</i>: <i>that</i> already refers to the parcel."},
{w:["They","blamed","themselves","for","the","delay"],a:["They blamed themselves for the delay"],why:"Reflexive object referring to the subject <i>They</i>."}
]}

CASES.push({
id:"c04",unit:"u04",short:"City Registry",title:"The Registry Desk",place:"City Registry, Old Town",mark:"D",color:"#0f7c7a",level:"A1–C1",
who:{name:"Sabina Tore",role:"Registrar"},
brief:"<p>At the Registry, one small word decides everything: <i>a</i> house or <i>the</i> house, <i>few</i> objections or <i>a few</i>. Since the fault, our clerks have been mixing them up, and citizens leave with the wrong documents.</p><p>Spend a shift at my desk. Every determiner you choose changes what the citizen understands.</p>",
debrief:"<p>The desk is running again. You chose articles by asking what the listener can identify, matched quantifiers to count and non-count nouns, separated determiners from pronouns, and put combined determiners in their fixed order.</p><p>For Kazakh and Russian speakers this is the hardest closed class in English, so this case is worth replaying.</p>",
stages:[
{type:"dialogue",title:"A shift at the desk",level:"A2–B1",
intro:"<p>Citizens come to the desk. Choose what to say. A wrong article or quantifier causes a real misunderstanding.</p>",
learned:"<i>the</i> = the listener can identify it; <i>a/an</i> = introduced as new; no article for general plural and non-count reference.",
items:[
{who:"Citizen",lines:[["Citizen","I'd like to register my new address."],["Registrar","You need to fill in a form first."]],prompt:"The citizen has filled in the form you gave. You say:",options:[
{t:"Please sign the form at the bottom.",ok:true,reply:"Of course. Here you are.",why:"The form is now identifiable to both of you: <i>the</i>."},
{t:"Please sign a form at the bottom.",ok:false,reply:"Which form? A different one?",why:"<i>a</i> suggests a new, unidentified form."},
{t:"Please sign form at the bottom.",ok:false,reply:"Sorry, sign what?",why:"A singular count noun needs a determiner."}]},
{who:"Citizen",lines:[["Citizen","Is there anywhere to wait?"]],prompt:"You tell her about a café she doesn't know:",options:[
{t:"There's a café on the corner.",ok:true,reply:"Lovely, I'll wait there.",why:"New information for the listener: <i>a</i>."},
{t:"There's the café on the corner.",ok:false,reply:"The café? Should I know it?",why:"<i>the</i> assumes she can already identify it."},
{t:"There's café on the corner.",ok:false,reply:"Sorry?",why:"Singular count noun without a determiner."}]},
{who:"Citizen",lines:[["Citizen","Were there many objections to the new car park?"]],prompt:"There were three, which is enough to delay it. You say:",options:[
{t:"Yes, a few, so the decision may be delayed.",ok:true,reply:"I see, so it's not decided yet.",why:"<i>a few</i> presents the number as some, enough to matter."},
{t:"Few, so the decision may be delayed.",ok:false,reply:"Few? Then why the delay?",why:"<i>few</i> without <i>a</i> means almost none, which contradicts the delay."},
{t:"Yes, much objections.",ok:false,reply:"Much? I don't understand.",why:"<i>much</i> goes with non-count nouns; <i>objections</i> is plural count."}]},
{who:"Citizen",lines:[["Citizen","Do I need any documents for my passport?"]],prompt:"He needs some, and you have one sheet of guidance:",options:[
{t:"Yes, some documents. Here's some information about them.",ok:true,reply:"Thank you, that's helpful.",why:"<i>some</i> with plural count and with non-count nouns."},
{t:"Yes, some documents. Here's an information about them.",ok:false,reply:"An information?",why:"<i>information</i> is non-count: no <i>an</i>."},
{t:"Yes, many document. Here's information sheet.",ok:false,reply:"Sorry, could you repeat that?",why:"<i>many</i> needs a plural; <i>information sheet</i> needs a determiner."}]}
]},
{type:"sort",title:"Quantity checks",level:"A2–B1",bins:["much","many","works with both"],
intro:"<p>The quantity column was scrambled. Which word fits each noun in its sentence: <i>much</i>, <i>many</i>, or a quantifier that works with both kinds of noun?</p>",
learned:"<i>much</i> with non-count, <i>many</i> with plural count, and quantifiers such as <i>a lot of</i>, <i>some</i>, <i>no</i> with both.",
items:[
{w:"time",ctx:"We don't have ___ time before closing.",a:"much",why:"<i>time</i> is non-count here."},
{w:"applications",ctx:"How ___ applications came in today?",a:"many",why:"Plural count noun."},
{w:"a lot of",ctx:"Which quantifier works with both <i>money</i> and <i>forms</i>?",a:"works with both",why:"<i>a lot of</i> combines with non-count and plural count nouns."},
{w:"paperwork",ctx:"There's too ___ paperwork.",a:"much",why:"<i>paperwork</i> is non-count."},
{w:"visitors",ctx:"Not ___ visitors come on Mondays.",a:"many",why:"Plural count noun."},
{w:"some",ctx:"Which quantifier works with both <i>advice</i> and <i>questions</i>?",a:"works with both",why:"<i>some</i> combines with both."},
{w:"furniture",ctx:"How ___ furniture is in the storeroom?",a:"much",why:"<i>furniture</i> is non-count."}
]},
{type:"deduce",title:"Determiner or pronoun?",level:"B1–B2",
intro:"<p>The registry index needs to know which job each word is doing. Decide, then prove it.</p>",
learned:"If the word introduces a following noun, it is a determiner; if it stands alone for a whole noun phrase, it is a pronoun.",
items:[
{s:"[[Those]] are the old registers.",classes:["determiner","pronoun"],a:"pronoun",evidence:["No noun follows; <i>Those</i> is the whole subject","It refers to something far away","It is plural"],why:"Standing alone as a noun phrase: pronoun."},
{s:"[[Those]] registers are old.",classes:["determiner","pronoun"],a:"determiner",evidence:["It introduces the noun <i>registers</i>","It is plural","It is at the start of the sentence"],why:"It opens the noun phrase <i>those registers</i>."},
{s:"Is this pen [[yours]]?",classes:["determiner","pronoun"],a:"pronoun",evidence:["<i>yours</i> is the independent possessive form, used without a noun","It shows possession","It comes at the end"],why:"Possessives have separate forms: <i>your</i> (determiner) and <i>yours</i> (pronoun)."},
{s:"[[Each]] applicant receives a number.",classes:["determiner","pronoun"],a:"determiner",evidence:["It introduces the singular noun <i>applicant</i>","It refers to individuals","It starts the sentence"],why:"<i>each</i> + singular count noun."},
{s:"The forms are ready; [[each]] has a number.",classes:["determiner","pronoun"],a:"pronoun",evidence:["No noun follows; <i>each</i> is the subject","It refers to forms","It is singular"],why:"Used alone as the subject: pronoun."}
]},
{type:"fault",title:"Check the certificates",level:"B1–C1",
intro:"<p>Five certificates contain a determiner error. Find it and repair it.</p>",
learned:"Singular count nouns need a determiner; only one central determiner; <i>an</i> depends on sound.",
items:[
{s:"The applicant is [[engineer]] at the power station.",task:"A word is missing before one noun. Tap that noun.",fix:["an engineer","a engineer","the engineers"],why:"A singular count noun needs a determiner; <i>engineer</i> begins with a vowel sound: <i>an</i>."},
{s:"She studied at [[an]] university in Almaty.",fix:["a","the","—"],why:"<i>university</i> begins with the consonant sound /j/: <i>a</i>."},
{s:"Please return [[the my]] documents.",fix:["my","the","my the"],why:"Only one central determiner: <i>my documents</i>."},
{s:"[[The honesty]] is required of all officials.",fix:["Honesty","An honesty","A honesty"],why:"A non-count abstract noun in a general statement takes no article."},
{s:"There isn't [[many]] space in the archive.",fix:["much","a few","several"],why:"<i>space</i> is non-count here: <i>much</i>."}
]},
{type:"rebuild",title:"Order the determiners",level:"B2–C1",
intro:"<p>When determiners combine, their order is fixed: predeterminer, central determiner, postdeterminer. Rebuild each phrase.</p>",
learned:"Predeterminers (<i>all, both, half</i>) precede central determiners (<i>the, my, these</i>), which precede postdeterminers (numerals, <i>other, many</i>).",
items:[
{w:["all","the","other","applicants"],a:["all the other applicants"],why:"Predeterminer + central + postdeterminer."},
{w:["both","my","parents"],a:["both my parents"],why:"Predeterminer <i>both</i> before the possessive."},
{w:["half","the","office"],a:["half the office"],why:"Predeterminer <i>half</i> before <i>the</i>."},
{w:["these","two","rooms"],a:["these two rooms"],why:"Central determiner before the numeral."},
{w:["the","first","three","pages"],a:["the first three pages"],why:"Ordinal before cardinal: <i>the first three</i>."}
]}
]});

CASES.push({
id:"c05",unit:"u05",short:"Central Station",title:"Night at Central Station",place:"Central Station control room",mark:"V",color:"#b23a48",level:"A1–B2",
who:{name:"Arman Kassym",role:"Night station master"},
brief:"<p>Something happened on platform four between eleven and midnight, and the incident log is unreadable. The fault stripped the verbs of their forms and left out the words they need after them.</p><p>Verbs are the engine of every sentence. Rebuild the events in order, and we will know what happened.</p>",
debrief:"<p>The night's events are clear. You found the verbs in the log, recognised what each verb needs after it, repaired tense forms, distinguished linking verbs from action verbs, and reconstructed complete clauses.</p><p>The station master's rule: learn a verb with its pattern, not just its meaning. <i>put</i> needs an object and a place.</p>",
stages:[
{type:"hunt",title:"Read the incident log",level:"A1–A2",target:"lexical verb",
intro:"<p>Find every <b>lexical</b> verb (main verb) in the log. Auxiliaries are not targets; but when <i>be</i> is the only verb in its clause, it is the main verb. Some words that look like verbs are nouns.</p>",
trap:"Not a lexical verb here. Is it an auxiliary before another verb, or a noun after a determiner?",
learned:"The lexical verb carries the main meaning; auxiliaries come before it; nouns like <i>stop</i> or <i>call</i> follow determiners.",
items:[
{text:"At 23:10 a guard {heard} a noise near platform four. He {checked} the gate and {called} the control room. The call {was} short. A man was {standing} by the last carriage.",
notes:{heard:"past of <i>hear</i>, after the subject.",checked:"past tense with the object <i>the gate</i>.",called:"past tense with the object <i>the control room</i>.",standing:"the lexical verb of the progressive <i>was standing</i>.",was:"in <i>The call was short</i>, <i>was</i> is the only verb: a linking verb acting as the main verb."},
traps:{noise:"a noun after <i>a</i>.",call:"<i>The call</i>: a noun after <i>The</i>.",was:"<i>was</i> is the progressive auxiliary here; the lexical verb is <i>standing</i>.",gate:"a noun."},
why:"Five main verbs carried the action. <i>call</i> after <i>The</i> was a noun, and the second <i>was</i> was only an auxiliary."}
]},
{type:"sort",title:"What does the verb need?",level:"B1–B2",bins:["nothing","one object","two objects","a complement (linking)"],
intro:"<p>Each verb in the log selects what must follow it. Sort the verbs by their pattern in the sentence shown.</p>",
learned:"Valency: intransitive verbs need nothing; transitive verbs need objects; linking verbs need a complement describing the subject.",
items:[
{w:"arrived",ctx:"The last train <b>arrived</b> at 23:40.",a:"nothing",why:"<i>at 23:40</i> is optional; <i>arrive</i> is intransitive."},
{w:"showed",ctx:"The guard <b>showed</b> the inspector the tickets.",a:"two objects",why:"Indirect object <i>the inspector</i>, direct object <i>the tickets</i>."},
{w:"seemed",ctx:"The man <b>seemed</b> nervous.",a:"a complement (linking)",why:"<i>nervous</i> describes the subject."},
{w:"locked",ctx:"Someone <b>locked</b> the door.",a:"one object",why:"<i>the door</i> is the object."},
{w:"slept",ctx:"The cleaner <b>slept</b> in the office.",a:"nothing",why:"Intransitive; <i>in the office</i> is an optional adverbial."},
{w:"became",ctx:"The platform <b>became</b> very quiet.",a:"a complement (linking)",why:"<i>very quiet</i> describes the platform."},
{w:"sent",ctx:"Control <b>sent</b> the police a message.",a:"two objects",why:"<i>the police</i> + <i>a message</i>."}
]},
{type:"forge",title:"Repair the timeline",level:"A2–B1",
intro:"<p>Type the correct verb form. Check the subject, the time and any auxiliary.</p>",
learned:"Third person <i>-s</i> in the present; irregular pasts and participles are learned as vocabulary; after <i>have</i> the past participle, after <i>be</i> in the passive the past participle.",
items:[
{s:"At 23:15 the guard ___ a torch from the office.",base:"take",a:["took"],why:"Irregular past: <i>take → took</i>."},
{s:"The night train usually ___ at 23:40.",base:"leave",a:["leaves"],why:"Present simple, third person singular: <i>-s</i>."},
{s:"By midnight, the man had ___ .",base:"go",a:["gone"],why:"After <i>had</i>: past participle <i>gone</i>."},
{s:"The gate was ___ at 00:05.",base:"shut",a:["shut"],why:"Passive: <i>was</i> + past participle; <i>shut</i> has the same form in all three."},
{s:"The cameras ___ nothing unusual that night.",base:"record",a:["recorded"],why:"Regular past: <i>-ed</i>."},
{s:"Who ___ the alarm?",base:"ring",a:["rang"],why:"Irregular past: <i>ring → rang</i>; no <i>did</i> because <i>who</i> is the subject."}
]},
{type:"dialogue",title:"Question the witness",level:"B1–B2",
intro:"<p>A passenger describes what she noticed. Choose the reply that accurately reflects what she means. Linking verbs take adjectives; action verbs take adverbs.</p>",
learned:"After a linking verb, an adjective describes the subject; with an action verb, an adverb describes the action.",
items:[
{who:"Passenger",lines:[["Passenger","The carriage smelled strange, like smoke."]],prompt:"Your summary:",options:[
{t:"So the smell in the carriage was strange.",ok:true,reply:"Yes, exactly.",why:"<i>smell</i> is linking here: the carriage was strange in smell."},
{t:"So you smelled strangely in the carriage.",ok:false,reply:"I beg your pardon? I didn't do anything strangely.",why:"<i>strangely</i> would describe the manner of an action of smelling, which is not what she meant."},
{t:"So the carriage had no smell at all.",ok:false,reply:"No, it smelled of smoke.",why:"She said it <i>smelled strange</i>: linking <i>smell</i> + adjective describes the carriage."}]},
{who:"Passenger",lines:[["Passenger","The man looked carefully at the timetable."]],prompt:"Your summary:",options:[
{t:"So he studied it with care.",ok:true,reply:"Yes, for a long time.",why:"<i>look at</i> is an action here; <i>carefully</i> describes how."},
{t:"So he seemed careful.",ok:false,reply:"I didn't say what he seemed like. I said how he looked at it.",why:"The adverb describes the action, not the man."},
{t:"So the timetable looked careful.",ok:false,reply:"A timetable can't be careful!",why:"The adverb modifies <i>looked</i>, the man's action."}]},
{who:"Passenger",lines:[["Passenger","Afterwards he looked calm."]],prompt:"Your summary:",options:[
{t:"So he appeared calm after the incident.",ok:true,reply:"Yes, surprisingly calm.",why:"<i>look</i> = appear: linking verb + adjective."},
{t:"So he looked at something calmly.",ok:false,reply:"No, I meant how he seemed.",why:"With an adjective, <i>look</i> is linking and describes the subject."},
{t:"So he searched calmly.",ok:false,reply:"That's not what I said.",why:"<i>calm</i> (adjective) describes him, not an action."}]}
]},
{type:"rebuild",title:"Reconstruct the events",level:"B1–B2",
intro:"<p>The final report was torn into pieces. Restore the sentences. Each verb needs its required elements.</p>",
learned:"Every clause follows its verb's pattern: <i>put</i> + object + place, <i>give</i> + two objects, <i>become</i> + complement.",
items:[
{w:["The","man","put","a","bag","on","the","bench"],a:["The man put a bag on the bench"],why:"<i>put</i> requires an object and a place (SVOA)."},
{w:["The","guard","gave","the","driver","a","warning"],a:["The guard gave the driver a warning"],why:"Ditransitive: indirect object before direct object."},
{w:["The","platform","became","completely","empty"],a:["The platform became completely empty"],why:"Linking verb + adjective phrase."},
{w:["The","police","arrived","at","midnight"],decoy:["the station"],a:["The police arrived at midnight"],why:"<i>arrive</i> takes no direct object: *arrived the station is impossible."}
]}
]});

CASES.push({
id:"c06",unit:"u06",short:"Interview Room",title:"The Interview Room",place:"Bureau interview room",mark:"A",color:"#8a2c5c",level:"A2–B2",
who:{name:"Leyla Ermek",role:"Senior interviewer"},
brief:"<p>Interviews depend on questions, and English questions depend on auxiliaries. The fault deleted every <i>do</i>, <i>did</i> and <i>does</i> from our question sheets and mixed up the modal verbs.</p><p>Before the suspect from Central Station arrives, I need a clean set of questions and a clear sense of what <i>must</i>, <i>might</i> and <i>should</i> mean.</p>",
debrief:"<p>The interview went well. You identified auxiliaries with the NICE tests, built questions with inversion and <i>do</i>-support, interpreted modal meanings, and corrected auxiliary errors.</p><p>Remember: in a question with a lexical verb, the tense moves to <i>do/does/did</i>, and the lexical verb returns to its base form.</p>",
stages:[
{type:"deduce",title:"Auxiliary or lexical verb?",level:"A2–B1",
intro:"<p>Decide whether the highlighted verb is an auxiliary or a lexical verb, then choose the evidence.</p>",
learned:"Auxiliaries come before another verb and pass the NICE tests; <i>be, have, do</i> can be either.",
items:[
{s:"The suspect [[has]] left the city.",classes:["auxiliary","lexical verb"],a:"auxiliary",evidence:["It is followed by the participle <i>left</i>, and inversion works: <i>Has he left?</i>","It means possession","It is in the present"],why:"Perfect auxiliary <i>have</i>."},
{s:"The suspect [[has]] two passports.",classes:["auxiliary","lexical verb"],a:"lexical verb",evidence:["It is the only verb and means possession","It ends in <i>-s</i>","It comes after the subject"],why:"Lexical <i>have</i>: questions need <i>do</i>: <i>Does he have…?</i>"},
{s:"He [[didn't]] answer the question.",classes:["auxiliary","lexical verb"],a:"auxiliary",evidence:["<i>do</i> carries the negative and the past; <i>answer</i> is the lexical verb","It is short","It is negative"],why:"<i>do</i>-support for negation."},
{s:"He [[did]] the paperwork himself.",classes:["auxiliary","lexical verb"],a:"lexical verb",evidence:["It is the only verb, meaning 'completed'","It is in the past","It comes after <i>He</i>"],why:"Lexical <i>do</i>."},
{s:"You [[must]] stay in the building.",classes:["auxiliary","lexical verb"],a:"auxiliary",evidence:["It takes a bare infinitive and has no <i>-s</i>: *he musts","It expresses obligation","It is short"],why:"A central modal auxiliary."}
]},
{type:"rebuild",title:"Prepare the question sheet",level:"A2–B1",
intro:"<p>Build each question. Some sentences include a decoy piece that would make the question ungrammatical.</p>",
learned:"Questions invert an auxiliary with the subject; with a lexical verb, add <i>do/does/did</i> and use the base form.",
items:[
{w:["Where","did","you","go","on","Tuesday","?"],decoy:["went"],a:["Where did you go on Tuesday ?"],why:"Past tense is carried by <i>did</i>; <i>go</i> stays in the base form."},
{w:["Does","your","brother","work","at","the","station","?"],decoy:["works"],a:["Does your brother work at the station ?"],why:"Third person: <i>does</i> + base form."},
{w:["Have","you","seen","this","man","before","?"],a:["Have you seen this man before ?"],why:"The perfect auxiliary inverts; no <i>do</i>."},
{w:["Can","you","describe","the","bag","?"],decoy:["to"],a:["Can you describe the bag ?"],why:"Modal + bare infinitive; no <i>to</i>."},
{w:["Why","were","you","waiting","on","platform","four","?"],a:["Why were you waiting on platform four ?"],why:"Progressive auxiliary <i>were</i> inverts with the subject."}
]},
{type:"dialogue",title:"Reading the modals",level:"B1–B2",
intro:"<p>During the interview, the precise modal matters. Choose the interpretation or reply that matches the modal used.</p>",
learned:"<i>must</i> can express obligation or near-certain deduction; <i>might</i> expresses possibility; <i>should</i> expresses advice or expectation.",
items:[
{who:"Suspect",lines:[["Suspect","The bag must be in the left-luggage office."]],prompt:"What is he expressing?",options:[
{t:"He is almost certain it is there.",ok:true,reply:"That's where I'd look first.",why:"Epistemic <i>must</i>: a confident deduction."},
{t:"He is ordering someone to put it there.",ok:false,reply:"I'm not ordering anyone. I'm saying where it probably is.",why:"<i>must be</i> + location here is deduction, not obligation."},
{t:"He has no idea where it is.",ok:false,reply:"No, I'm quite sure.",why:"<i>must</i> expresses strong certainty."}]},
{who:"Suspect",lines:[["Suspect","I might have seen him on the train."]],prompt:"How certain is he?",options:[
{t:"He's not sure; it's a possibility.",ok:true,reply:"Right, I can't be certain.",why:"<i>might have</i> + participle: past possibility."},
{t:"He definitely saw him.",ok:false,reply:"I didn't say that.",why:"<i>might</i> is tentative."},
{t:"He was allowed to see him.",ok:false,reply:"Allowed? No, I mean perhaps I saw him.",why:"<i>might</i> here is possibility, not permission."}]},
{who:"Suspect",lines:[["Suspect","Can I make a phone call?"]],prompt:"Grant permission politely and correctly:",options:[
{t:"Yes, you can call from the office next door.",ok:true,reply:"Thank you.",why:"<i>can</i> + bare infinitive for permission."},
{t:"Yes, you can to call from the office.",ok:false,reply:"Sorry?",why:"No <i>to</i> after a modal."},
{t:"Yes, you cans call from the office.",ok:false,reply:"I don't understand.",why:"Modals take no <i>-s</i>."}]},
{who:"Suspect",lines:[["Suspect","Will I be able to leave tonight?"]],prompt:"Explain that it will be possible tomorrow, not tonight:",options:[
{t:"Not tonight, but you will be able to leave tomorrow.",ok:true,reply:"Fine, I understand.",why:"Standard English does not combine two central modals; <i>be able to</i> works after <i>will</i>."},
{t:"Not tonight, but you will can leave tomorrow.",ok:false,reply:"Will can?",why:"*will can is impossible; use <i>will be able to</i>."},
{t:"Not tonight, but you can will leave tomorrow.",ok:false,reply:"That doesn't sound right.",why:"Two modals cannot follow each other."}]}
]},
{type:"fault",title:"Check the transcript",level:"B1–B2",
intro:"<p>The typist made auxiliary errors in the transcript. Find and repair each one.</p>",
learned:"Tense is marked once; modals take a bare infinitive and no <i>-s</i>; third person singular needs <i>does</i>.",
items:[
{s:"Did you [[saw]] the man on the platform?",fix:["see","seen","seeing"],why:"After <i>did</i>, the base form."},
{s:"He [[don't]] remember the time.",fix:["doesn't","isn't","not"],why:"Third person singular: <i>doesn't</i>."},
{s:"She [[cans]] identify the bag.",fix:["can","could to","is can"],why:"Modals never take <i>-s</i>."},
{s:"Where [[you]] put the ticket?",task:"An auxiliary is missing before one word. Tap that word.",fix:["did you","you did","have"],why:"A question with a lexical verb needs <i>did</i>: <i>Where did you put…?</i>"},
{s:"You should [[to]] wait here.",fix:["(remove to)","must","been"],why:"Modals take the bare infinitive: <i>should wait</i>."}
]}
]});

CASES.push({
id:"c07",unit:"u07",also:"u08",short:"City Gallery",title:"The Gallery Forgery",place:"Meridian City Gallery",mark:"M",color:"#2f7d32",level:"A2–C1",
who:{name:"Mira Ainur",role:"Curator"},
brief:"<p>Our new exhibition opens tomorrow, and someone has tampered with the wall labels. Descriptions now modify the wrong things: adverbs describe paintings, adjectives describe actions, and the word order is clumsy.</p><p>A forger leaves traces. Find out what each modifier really modifies, and the forged labels will expose themselves.</p>",
debrief:"<p>The labels are authentic again. You identified adjectives with the <i>very</i> and <i>seem</i> tests, worked out what each modifier modifies, formed adverbs and comparatives, ordered adjectives naturally and placed adverbs correctly.</p><p>The curator's rule: adjectives modify nouns or describe the subject after a linking verb; adverbs modify everything else.</p>",
stages:[
{type:"hunt",title:"Read the catalogue",level:"A2–B1",target:"adjective",
intro:"<p>Find every adjective in the catalogue entry. Nouns used as modifiers are not adjectives; test with <i>very</i>.</p>",
trap:"Not an adjective here. Try <i>very</i> in front, or check whether it modifies a verb.",
learned:"Adjectives modify nouns or follow linking verbs; nouns as modifiers fail the <i>very</i> test; adverbs modify verbs and adjectives.",
items:[
{text:"This {small} oil painting shows a {quiet} harbour at dawn. The colours are {soft} and {warm}, and the {old} fishing boats look almost {real}.",
notes:{small:"before <i>oil painting</i>; <i>very small</i>.",quiet:"modifies <i>harbour</i>.",soft:"after the linking verb <i>are</i>.",warm:"coordinated with <i>soft</i>.",old:"modifies <i>fishing boats</i>.",real:"after the linking verb <i>look</i>."},
traps:{oil:"<i>oil</i> is a noun modifying <i>painting</i>: *a very oil painting.",fishing:"<i>fishing</i> classifies the boats by purpose; *very fishing boats is impossible.",almost:"<i>almost</i> is a degree adverb modifying <i>real</i>.",dawn:"a noun after <i>at</i>."},
why:"Six adjectives. The traps were nouns and <i>-ing</i> forms used as classifying modifiers, and the adverb <i>almost</i>."}

{type:"sort",title:"What does it modify?",level:"B1–B2",bins:["a noun","a verb","an adjective","the whole sentence"],
intro:"<p>For each bold word on the labels, decide what it modifies.</p>",
learned:"Adjectives modify nouns; adverbs modify verbs, adjectives, other adverbs or whole clauses.",
items:[

{w:"bright",ctx:"A <b>bright</b> sky fills the upper half.",a:"a noun",why:"It modifies <i>sky</i>."},
{w:"extremely",ctx:"The brushwork is <b>extremely</b> fine.",a:"an adjective",why:"A degree adverb modifying <i>fine</i>."},
{w:"Unfortunately",ctx:"<b>Unfortunately</b>, the frame was damaged.",a:"the whole sentence",why:"A stance adverb commenting on the whole clause."},
{w:"slowly",ctx:"The light fades <b>slowly</b> towards the edges.",a:"a verb",why:"It modifies <i>fades</i>."},
{w:"famous",ctx:"It is the gallery's most <b>famous</b> work.",a:"a noun",why:"It modifies <i>work</i>."},
{w:"surprisingly",ctx:"The canvas is <b>surprisingly</b> small.",a:"an adjective",why:"It modifies <i>small</i>."},
{w:"Fortunately",ctx:"<b>Fortunately</b>, the forger left fingerprints.",a:"the whole sentence",why:"The speaker's comment on the situation."}
