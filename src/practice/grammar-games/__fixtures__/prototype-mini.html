he cat?","Under the bed."],["Where is the bus stop?","In front of the school."],["Where is the cafe?","Between the bank and the shop."],["Where are the children?","At school."],["Where is the lamp?","Next to the sofa."]]},"sort":{"task":{"ru":"Разложи: at, in или on?","kk":"Сұрыпта: at, in әлде on?","en":"Sort: at, in or on?"},"cats":[{"ru":"at","kk":"at","en":"at"},{"ru":"in","kk":"in","en":"in"},{"ru":"on","kk":"on","en":"on"}],"items":[["home",0],["school",0],["work",0],["the kitchen",1],["Almaty",1],["the bag",1],["the fridge",1],["the car",1],["the table",2],["the wall",2],["the floor",2],["the shelf",2],["the sofa",2]]},"catch":{"task":{"ru":"Лови только правильные фразы","kk":"Тек дұрыс тіркестерді ұста","en":"Catch only the correct phrases"},"right":["next to the bed","in front of the car","on the table","in the bag","at home","under the chair","between the boxes","behind the door","near the park","at school"],"wrong":["next the bed","in front the car","on table","in home","under of the chair","between the box","behind of the door","near of the park","next of the bed","in front to the car"]},"trans":[{"from":"The cat is in front of the box.","task":{"ru":"Скажи наоборот (behind)","kk":"Керісінше айт (behind)","en":"Say the opposite (behind)"},"to":"The cat is behind the box.","o":["The cat is behind of the box.","The cat is back the box."]},{"from":"The ball is on the box.","task":{"ru":"Скажи наоборот (under)","kk":"Керісінше айт (under)","en":"Say the opposite (under)"},"to":"The ball is under the box.","o":["The ball is under of the box.","The ball is down the box."]},{"from":"The keys are in the bag.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Are the keys in the bag?","o":["The keys are in the bag?","Is the keys in the bag?"]},{"from":"The bank is near the school.","task":{"ru":"Задай вопрос с Where","kk":"Where-мен сұрақ қой","en":"Ask with Where"},"to":"Where is the bank?","o":["Where the bank is?","Where are the bank?"]},{"from":"The dog is behind the sofa.","task":{"ru":"Скажи наоборот (in front of)","kk":"Керісінше айт (in front of)","en":"Say the opposite (in front of)"},"to":"The dog is in front of the sofa.","o":["The dog is in front the sofa.","The dog is front of the sofa."]},{"from":"My phone is on the desk.","task":{"ru":"Сделай отрицание","kk":"Болымсыз сөйлем жаса","en":"Make it negative"},"to":"My phone isn't on the desk.","o":["My phone not on the desk.","My phone aren't on the desk."]},{"from":"The shoes are under the bed.","task":{"ru":"Задай вопрос с Where","kk":"Where-мен сұрақ қой","en":"Ask with Where"},"to":"Where are the shoes?","o":["Where is the shoes?","Where the shoes are?"]},{"from":"The lamp is near the bed.","task":{"ru":"Замени near на next to","kk":"near-ды next to-ға ауыстыр","en":"Change near to next to"},"to":"The lamp is next to the bed.","o":["The lamp is next the bed.","The lamp is next of the bed."]},{"from":"The cafe is next to the bank.","task":{"ru":"Используй between и добавь the shop","kk":"between қолданып, the shop қос","en":"Use between and add the shop"},"to":"The cafe is between the bank and the shop.","o":["The cafe is between the bank or the shop.","The cafe is between of the bank and the shop."]}],"dialog":{"title":{"ru":"Где мои вещи?","kk":"Менің заттарым қайда?","en":"Where are my things?"},"lines":[{"who":"A","t":"Mum, where is my phone?"},{"who":"B","t":"It's ___ the table in the kitchen.","a":"on","o":["in","between"]},{"who":"A","t":"Thanks! And where are my keys?"},{"who":"B","t":"They're ___ your bag.","a":"in","o":["between","next"]},{"who":"A","t":"No, they aren't. My bag is empty!"},{"who":"B","t":"Look ___ the sofa. Maybe they're on the floor.","a":"under","o":["between","next"]},{"who":"A","t":"Yes! They're here. And where is the cat?"},{"who":"B","t":"She's next ___ the window. She loves the sun.","a":"to","o":["of","at"]},{"who":"A","t":"Is Dad ___ home?","a":"at","o":["in","on"]},{"who":"B","t":"No, he's at work. His office is ___ the bank and the post office.","a":"between","o":["next","under"]},{"who":"A","t":"OK. Bye, Mum! The school bus is here, in front ___ our house!","a":"of","o":["to","at"]}]}},{"id":"L2-22","lv":"L2","n":22,"icon":"🧭","color":"#2FB164","title":{"ru":"Should / shouldn't; Have to / don't have to","kk":"Should / shouldn't; Have to / don't have to","en":"Should / shouldn't; Have to / don't have to"},"sub":{"ru":"Советы и обязанности","kk":"Кеңестер мен міндеттер","en":"Advice and obligation"},"intro":{"ru":"Should значит «следует, стоит» — это совет: You should rest. Have to значит «приходится, нужно» — это правило или необходимость: I have to wear a uniform. Важно: don't have to — это «не обязательно», а НЕ «нельзя».","kk":"Should — «керек, жөн болар еді», яғни кеңес: You should rest. Have to — «міндетті, керек», яғни ереже не қажеттілік: I have to wear a uniform. Маңызды: don't have to — «міндетті емес», «болмайды» деген мағына ЕМЕС.","en":"Should gives advice: You should rest. Have to talks about rules and things that are necessary: I have to wear a uniform. Important: don't have to means 'it isn't necessary', NOT 'it isn't allowed'."},"cards":[{"h":{"ru":"Should — совет","kk":"Should — кеңес","en":"Should — advice"},"f":[["s","Subject"],["a","should"],["v","V"],["o","…"]],"more":{"ru":"Should — модальный глагол: одна форма для всех лиц (he should, не he shoulds), после него глагол без to. Используем, когда даём совет или говорим, что что-то правильно: You should drink more water. Часто с I think: I think you should call her.","kk":"Should — модаль етістік: барлық жақта бір түрі бар (he should, he shoulds емес), одан кейін етістік to-сыз келеді. Кеңес бергенде немесе бір нәрсе дұрыс екенін айтқанда қолданамыз: You should drink more water. Жиі I think-пен келеді: I think you should call her.","en":"Should is a modal verb: it has one form for everyone (he should, not he shoulds), and the next verb has no to. We use it to give advice or say what is right: You should drink more water. It often comes with I think: I think you should call her."},"ex":["You should drink more water.","You look tired. You should go to bed."]},{"h":{"ru":"Shouldn't и Should I…?","kk":"Shouldn't және Should I…?","en":"Shouldn't and Should I…?"},"f":[["s","Subject"],["a","shouldn't"],["v","V"],["o","/ Should + subject + V?"]],"more":{"ru":"Shouldn't (= should not) — совет НЕ делать что-то: You shouldn't eat so much sugar. В вопросе should выходит вперёд: Should I call the doctor? Так мы просим совета. Краткие ответы: Yes, you should. / No, you shouldn't.","kk":"Shouldn't (= should not) — бір нәрсені ІСТЕМЕУ туралы кеңес: You shouldn't eat so much sugar. Сұрақта should алға шығады: Should I call the doctor? Осылай кеңес сұраймыз. Қысқа жауаптар: Yes, you should. / No, you shouldn't.","en":"Shouldn't (= should not) is advice NOT to do something: You shouldn't eat so much sugar. In questions should comes first: Should I call the doctor? This is how we ask for advice. Short answers: Yes, you should. / No, you shouldn't."},"ex":["You shouldn't eat so much sugar.","Should I call the doctor?"]},{"h":{"ru":"Have to / has to — нужно, обязан","kk":"Have to / has to — міндетті, керек","en":"Have to / has to — necessary"},"f":[["s","I / you / we / they"],["v","have to"],["v","V"],["o","/ he / she / it + has to + V"]],"more":{"ru":"Have to — это правило, закон или необходимость: так нужно, выбора нет. С he / she / it — has to. В прошедшем времени для всех — had to: Yesterday I had to work late. Have to ведёт себя как обычный глагол, поэтому отрицание и вопрос — через do / does.","kk":"Have to — ереже, заң немесе қажеттілік: солай істеу керек, басқа амал жоқ. He / she / it-пен — has to. Өткен шақта барлығына — had to: Yesterday I had to work late. Have to кәдімгі етістік сияқты, сондықтан болымсыз және сұраулы түрі do / does арқылы жасалады.","en":"Have to is about rules, laws or things that are necessary: there is no choice. With he / she / it we say has to. In the past it's had to for everyone: Yesterday I had to work late. Have to works like a normal verb, so negatives and questions use do / does."},"ex":["I have to wear a uniform at school.","She has to get up at six."]},{"h":{"ru":"Don't have to — не обязательно","kk":"Don't have to — міндетті емес","en":"Don't have to — not necessary"},"f":[["s","Subject"],["a","don't / doesn't"],["v","have to"],["v","V"]],"more":{"ru":"Don't / doesn't have to = «не нужно, не обязательно» — можно сделать, а можно не делать. Это НЕ запрет! «Нельзя» — это can't. Вопрос: Do you have to…? / Does he have to…? Краткие ответы: Yes, I do. / No, he doesn't.","kk":"Don't / doesn't have to = «қажет емес, міндетті емес» — істеуге де, істемеуге де болады. Бұл тыйым ЕМЕС! «Болмайды» — can't. Сұрақ: Do you have to…? / Does he have to…? Қысқа жауаптар: Yes, I do. / No, he doesn't.","en":"Don't / doesn't have to = it isn't necessary: you can do it or not. It is NOT a ban! For 'not allowed' we say can't. Questions: Do you have to…? / Does he have to…? Short answers: Yes, I do. / No, he doesn't."},"ex":["You don't have to bring food. Lunch is free.","He doesn't have to work on Sundays.","Do you have to wear a uniform?"]}],"tables":[{"cap":{"ru":"Should — совет","kk":"Should — кеңес","en":"Should — advice"},"head":["","➕","➖","❓"],"rows":[["I / you / we / they","You should rest.","You shouldn't worry.","Should we go?"],["he / she / it","She should rest.","She shouldn't worry.","Should she go?"]]},{"cap":{"ru":"Have to — необходимость","kk":"Have to — қажеттілік","en":"Have to — necessity"},"head":["","➕","➖","❓"],"rows":[["I / you / we / they","I have to work.","I don't have to work.","Do I have to work?"],["he / she / it","He has to work.","He doesn't have to work.","Does he have to work?"]]}],"mistakes":[{"bad":"You should to see a doctor.","good":"You should see a doctor.","why":{"ru":"После should глагол идёт без to.","kk":"Should-тан кейін етістік to-сыз келеді.","en":"After should, the verb has no to."}},{"bad":"She should goes to bed.","good":"She should go to bed.","why":{"ru":"После should — только начальная форма, без -s.","kk":"Should-тан кейін тек негізгі түрі келеді, -s-сіз.","en":"After should we use the base verb, with no -s."}},{"bad":"He have to study tonight.","good":"He has to study tonight.","why":{"ru":"С he / she / it — has to.","kk":"He / she / it-пен — has to.","en":"With he / she / it we say has to."}},{"bad":"You don't have to smoke here. It's not allowed.","good":"You can't smoke here. It's not allowed.","why":{"ru":"Don't have to = «не обязательно». Для запрета нужно can't.","kk":"Don't have to = «міндетті емес». Тыйым үшін can't керек.","en":"Don't have to means 'not necessary'. For a ban we use can't."}},{"bad":"Do she have to work on Saturday?","good":"Does she have to work on Saturday?","why":{"ru":"С she в вопросе нужно does.","kk":"She-мен сұрақта does керек.","en":"With she, the question needs does."}}],"gap":[{"s":"You look ill. You ___ see a doctor.","a":"should","o":["shouldn't","don't have to"],"pic":"🤒"},{"s":"You ___ eat so many sweets. It's bad for you.","a":"shouldn't","o":["should","have to"],"pic":"🍬"},{"s":"In Kazakhstan, cars ___ drive on the right.","a":"have to","o":["has to","don't have to"],"pic":"🚗"},{"s":"Tomorrow is Sunday, so I ___ get up early.","a":"don't have to","o":["have to","doesn't have to"],"pic":"😴"},{"s":"My mum is a nurse. She ___ work at night sometimes.","a":"has to","o":["have to","don't have to"],"pic":"👩‍⚕️"},{"s":"___ I take an umbrella? — Yes, it's going to rain.","a":"Should","o":["Do","Have"],"pic":"☂️"},{"s":"Students ___ wear a uniform at our school. It's a rule.","a":"have to","o":["has to","don't have to"],"pic":"👔"},{"s":"It's a free museum. You ___ pay.","a":"don't have to","o":["have to","doesn't have to"],"pic":"🏛️"},{"s":"___ your brother have to work on Saturdays?","a":"Does","o":["Do","Is"],"pic":"💼"},{"s":"You ___ talk on your phone in the cinema. It's rude.","a":"shouldn't","o":["should","don't have"],"pic":"🎬"},{"s":"Aruzhan's exam is next week. She ___ study hard.","a":"should","o":["shouldn't","should to"],"pic":"📚"},{"s":"Timur's office is next to his house, so he ___ take a bus.","a":"doesn't have to","o":["has to","don't have to"],"pic":"🏢"},{"s":"You should ___ more vegetables.","a":"eat","o":["to eat","eating"],"pic":"🥦","h":"eat"},{"s":"I ___ go now. My lesson starts in five minutes.","a":"have to","o":["has to","don't have to"],"pic":"⏰"}],"order":[{"s":"You should go to bed before eleven.","x":"goes","pic":"🛏️"},{"s":"Students don't have to wear a uniform on Fridays.","x":"doesn't","pic":"👕"},{"s":"She has to feed the cat.","x":"have","pic":"🐈"},{"s":"You shouldn't drink cold water.","x":"not","pic":"🧊"},{"s":"Should I call the teacher?","x":"Do","pic":"📞"},{"s":"Do you have to work tomorrow?","x":"has","pic":"💼"},{"s":"My dad has to drive to Astana.","x":"have","pic":"🚙"},{"s":"He doesn't have to cook tonight.","x":"don't","pic":"🍳"},{"s":"You should try this soup.","x":"to","pic":"🍜"},{"s":"Does Dana have to pay for the lessons?","x":"has","pic":"💳"}],"fix":[{"s":"You should drinks more water.","w":2,"c":"drink","o":["drink","drinking","to drink"]},{"s":"She have to walk the dog every morning.","w":1,"c":"has","o":["has","is","does"]},{"s":"Do he have to go?","w":0,"c":"Does","o":["Does","Is","Has"]},{"s":"We doesn't have to hurry.","w":1,"c":"don't","o":["don't","isn't","aren't"]},{"s":"You shouldn't worrying about it.","w":2,"c":"worry","o":["worry","worried","worries"]},{"s":"Should I calling my mum?","w":2,"c":"call","o":["call","called","calls"]},{"s":"Ali has to gets up at six.","w":3,"c":"get","o":["get","got","getting"]},{"s":"My sister don't have to work today.","w":2,"c":"doesn't","o":["doesn't","isn't","hasn't"]}],"pairs":{"task":{"ru":"Соедини проблему и совет или вывод","kk":"Мәселені кеңеспен немесе қорытындымен сәйкестендір","en":"Match the problem and the advice or result"},"list":[["I'm always tired.","You should sleep more."],["I'm cold.","You should put on a jacket."],["My tooth hurts.","You should see a dentist."],["It's a free concert.","You don't have to buy a ticket."],["The lesson starts at 8.","I have to leave at 7:30."],["I'm hungry.","You should have a sandwich."],["My English is weak.","You should practise every day."],["There's lots of time.","We don't have to hurry."]]},"trans":[{"from":"You should watch this film.","task":{"ru":"Сделай отрицание","kk":"Болымсыз сөйлем жаса","en":"Make it negative"},"to":"You shouldn't watch this film.","o":["You don't should watch this film.","You shouldn't to watch this film."]},{"from":"I should call him.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Should I call him?","o":["Do I should call him?","Should I to call him?"]},{"from":"We have to wear a tie at work.","task":{"ru":"Сделай отрицание","kk":"Болымсыз сөйлем жаса","en":"Make it negative"},"to":"We don't have to wear a tie at work.","o":["We not have to wear a tie at work.","We doesn't have to wear a tie at work."]},{"from":"She has to work on Sunday.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Does she have to work on Sunday?","o":["Does she has to work on Sunday?","Do she have to work on Sunday?"]},{"from":"He has to get up early.","task":{"ru":"Сделай отрицание","kk":"Болымсыз сөйлем жаса","en":"Make it negative"},"to":"He doesn't have to get up early.","o":["He doesn't has to get up early.","He don't have to get up early."]},{"from":"I have to finish my homework.","task":{"ru":"Замени I на He","kk":"I-ді He-ге ауыстыр","en":"Change I to He"},"to":"He has to finish his homework.","o":["He have to finish his homework.","He has to finishes his homework."]},{"from":"You have to buy a ticket.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Do you have to buy a ticket?","o":["Have you to buy a ticket?","Do you has to buy a ticket?"]},{"from":"Dana should study more.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Should Dana study more?","o":["Does Dana should study more?","Should Dana studies more?"]}],"dialog":{"title":{"ru":"Совет перед экзаменом","kk":"Емтихан алдындағы кеңес","en":"Advice before an exam"},"lines":[{"who":"A","t":"You look tired, Arman. Are you OK?"},{"who":"B","t":"Not really. I have an exam tomorrow, so I ___ study all night.","a":"have to","o":["has to","don't have to"]},{"who":"A","t":"All night? You ___ do that! You need sleep.","a":"shouldn't","o":["should","have to"]},{"who":"B","t":"But I need to learn fifty new words."},{"who":"A","t":"You ___ learn them all tonight. Learn twenty now and thirty in the morning.","a":"don't have to","o":["doesn't have to","have to"]},{"who":"B","t":"Good idea. ___ I drink coffee to stay awake?","a":"Should","o":["Do","Have"]},{"who":"A","t":"No, you ___ drink coffee in the evening. Drink some water.","a":"shouldn't","o":["should","not"]},{"who":"B","t":"OK. And ___ we have to bring a dictionary?","a":"do","o":["does","should"]},{"who":"A","t":"No, you don't. The school gives you one."},{"who":"B","t":"Great! Thanks for the advice."}]},"catch":{"task":{"ru":"Лови только правильные фразы","kk":"Тек дұрыс тіркестерді ұста","en":"Catch only correct phrases"},"right":["you should go","she should go","he has to work","I have to work","we don't have to","he doesn't have to","Should I wait?","Does she have to?","you shouldn't shout","they have to pay"],"wrong":["you should to go","she shoulds go","he have to work","I has to work","we doesn't have to","he don't have to","Do I should wait?","Do she have to?","you shouldn't shouting","they has to pay"]}},{"id":"L3-01","lv":"L3","n":1,"icon":"❓","color":"#1F8FE5","title":{"ru":"Question forms — порядок слов в вопросе","kk":"Question forms — сұраулы сөйлемдегі сөз тәртібі","en":"Question forms — word order"},"sub":{"ru":"Вспомогательный глагол + подлежащее + глагол","kk":"Көмекші етістік + бастауыш + етістік","en":"Auxiliary + subject + verb"},"intro":{"ru":"В русском вопрос часто звучит как утверждение, только с другой интонацией: «Ты любишь кофе?». В английском так нельзя — меняется порядок слов, и перед подлежащим встаёт вспомогательный глагол: Do you like coffee? Запомни схему QASI: Question word – Auxiliary – Subject – Infinitive (глагол).","kk":"Қазақ тілінде сұрақ көбіне ма/ме, ба/бе шылауларымен немесе интонациямен жасалады: «Сен кофе ұнатасың ба?». Ағылшын тілінде сөз тәртібі өзгереді: бастауыштың алдына көмекші етістік шығады: Do you like coffee? QASI схемасын есте сақта: Question word – Auxiliary – Subject – Infinitive (етістік).","en":"In Russian and Kazakh a question can sound like a statement with a different intonation. In English the word order changes: an auxiliary verb comes before the subject: Do you like coffee? Remember QASI: Question word – Auxiliary – Subject – Infinitive (verb)."},"cards":[{"h":{"ru":"Схема QASI","kk":"QASI схемасы","en":"The QASI pattern"},"f":[["q","(Wh-)"],["a","Aux"],["s","Subject"],["v","Verb"],["o","…?"]],"more":{"ru":"Вспомогательный глагол зависит от времени: do / does (Present Simple), did (Past Simple), am / is / are (Present Continuous и to be), have / has (Present Perfect), will (будущее), can и другие модальные. Вопросительное слово (where, what, when, why, how…) всегда стоит перед вспомогательным глаголом. После do / does / did основной глагол стоит в начальной форме — без -s и без -ed.","kk":"Көмекші етістік шаққа байланысты: do / does (Present Simple), did (Past Simple), am / is / are (Present Continuous және to be), have / has (Present Perfect), will (келер шақ), can және басқа модаль етістіктер. Сұраулы сөз (where, what, when, why, how…) әрқашан көмекші етістіктің алдында тұрады. Do / does / did-тен кейін негізгі етістік бастапқы түрде болады — -s және -ed жалғаусыз.","en":"The auxiliary depends on the tense: do / does (Present Simple), did (Past Simple), am / is / are (Present Continuous and to be), have / has (Present Perfect), will (future), can and other modals. A question word (where, what, when, why, how…) always comes before the auxiliary. After do / does / did the main verb is in the base form — no -s, no -ed."},"ex":["Where do you live?","What did you buy yesterday?","Can you help me?"]},{"h":{"ru":"Do / does / did + глагол","kk":"Do / does / did + етістік","en":"Do / does / did + verb"},"f":[["q","Wh-"],["a","do / does / did"],["s","subject"],["v","V1"],["o","…?"]],"more":{"ru":"В Present Simple и Past Simple нужен «помощник». Does — для he / she / it, и окончание -s «переходит» к does: Does she work? (не Does she works?). Did — для всех лиц в прошлом, и он забирает прошедшее время: Did he go? (не Did he went?). Сравни: She works → Does she work? He went → Did he go?","kk":"Present Simple мен Past Simple-де «көмекші» керек. Does — he / she / it үшін, және -s жалғауы does-қа «көшеді»: Does she work? (Does she works? емес). Did — өткен шақта барлық жақ үшін, ол өткен шақты өзіне алады: Did he go? (Did he went? емес). Салыстыр: She works → Does she work? He went → Did he go?","en":"Present Simple and Past Simple need a 'helper'. Does is for he / she / it, and the -s moves to does: Does she work? (not Does she works?). Did is for all persons in the past, and it takes the past form: Did he go? (not Did he went?). Compare: She works → Does she work? He went → Did he go?"},"ex":["Does your sister speak Kazakh?","When did they arrive in Astana?","How often do you go swimming?"]},{"h":{"ru":"Be, can, will, have — просто меняем местами","kk":"Be, can, will, have — орнын ауыстырамыз","en":"Be, can, will, have — just swap"},"f":[["a","am / is / are / can / will / have"],["s","subject"],["v","V / V-ing / V3"],["o","…?"]],"more":{"ru":"Если в предложении уже есть to be, модальный глагол (can, will, should) или have в Present Perfect, do не добавляем — этот глагол сам выходит вперёд: She is working → Is she working? You can swim → Can you swim? They have finished → Have they finished? Никогда не говори Do you can…?","kk":"Егер сөйлемде to be, модаль етістік (can, will, should) немесе Present Perfect-тегі have бар болса, do қоспаймыз — сол етістіктің өзі алға шығады: She is working → Is she working? You can swim → Can you swim? They have finished → Have they finished? Do you can…? деп ешқашан айтпа.","en":"If the sentence already has to be, a modal verb (can, will, should) or have in the Present Perfect, we don't add do — that verb moves to the front: She is working → Is she working? You can swim → Can you swim? They have finished → Have they finished? Never say Do you can…?"},"ex":["Are you watching TV?","Have you ever been to Turkey?","Will you be at home tonight?"]},{"h":{"ru":"Предлог в конце вопроса","kk":"Сұрақтың соңындағы предлог","en":"Preposition at the end"},"f":[["q","Who / Where / What"],["a","aux"],["s","subject"],["v","verb"],["o","+ with / from / about?"]],"more":{"ru":"В разговорном английском предлог обычно уходит в конец вопроса: Who are you talking to? Where are you from? What are you thinking about? В русском предлог стоит в начале («С кем ты разговариваешь?»), поэтому сначала такой порядок кажется странным. Сочетания What kind of…, How long…, How much…, What time… работают как одно вопросительное слово.","kk":"Ауызекі ағылшын тілінде предлог әдетте сұрақтың соңына кетеді: Who are you talking to? Where are you from? What are you thinking about? Орыс тілінде предлог басында тұрады, сондықтан бұл тәртіп алғашында оғаш көрінеді. What kind of…, How long…, How much…, What time… тіркестері бір сұраулы сөз сияқты жұмыс істейді.","en":"In everyday English the preposition usually goes to the end of the question: Who are you talking to? Where are you from? What are you thinking about? In Russian the preposition comes first, so this order feels strange at first. What kind of…, How long…, How much…, What time… work as one question word."},"ex":["Where are you from?","Who did you go with?","What are you thinking about?"]}],"tables":[{"cap":{"ru":"Вопросы в разных временах","kk":"Әр түрлі шақтағы сұрақтар","en":"Questions in different tenses"},"head":[{"ru":"Время","kk":"Шақ","en":"Tense"},"Question word","Aux","Subject","Verb + …"],"rows":[["Present Simple","Where","do","you","live?"],["Present Simple","What","does","he","do?"],["Present Continuous","Why","are","they","laughing?"],["Past Simple","When","did","she","call?"],["Present Perfect","How long","have","you","known him?"],["will","What time","will","we","arrive?"]]},{"cap":{"ru":"Общие вопросы и краткие ответы","kk":"Жалпы сұрақтар және қысқа жауаптар","en":"Yes / No questions and short answers"},"head":["","❓","✅","❌"],"rows":[["be","Are you tired?","Yes, I am.","No, I'm not."],["do / does","Does he play chess?","Yes, he does.","No, he doesn't."],["did","Did you see it?","Yes, I did.","No, I didn't."],["can","Can she drive?","Yes, she can.","No, she can't."],["have","Have they left?","Yes, they have.","No, they haven't."]]}],"mistakes":[{"bad":"You like coffee?","good":"Do you like coffee?","why":{"ru":"Одной интонации мало: в Present Simple нужен do перед подлежащим.","kk":"Тек интонация жеткіліксіз: Present Simple-де бастауыштың алдына do керек.","en":"Intonation is not enough: the Present Simple needs do before the subject."}},{"bad":"Where you live?","good":"Where do you live?","why":{"ru":"После вопросительного слова тоже нужен вспомогательный глагол.","kk":"Сұраулы сөзден кейін де көмекші етістік керек.","en":"You need an auxiliary after the question word too."}},{"bad":"Does she speaks English?","good":"Does she speak English?","why":{"ru":"Окончание -s уже есть в does, поэтому глагол — в начальной форме.","kk":"-s жалғауы does-та бар, сондықтан етістік бастапқы түрде болады.","en":"The -s is already in does, so the verb stays in the base form."}},{"bad":"What time you did get up?","good":"What time did you get up?","why":{"ru":"Порядок QASI: вспомогательный глагол стоит перед подлежащим.","kk":"QASI тәртібі: көмекші етістік бастауыштың алдында тұрады.","en":"QASI order: the auxiliary comes before the subject."}},{"bad":"Do you can swim?","good":"Can you swim?","why":{"ru":"С can, will, should do не нужен — модальный глагол сам выходит вперёд.","kk":"Can, will, should-пен do керек емес — модаль етістіктің өзі алға шығады.","en":"No do with can, will, should — the modal moves to the front."}}],"gap":[{"s":"___ you like spicy food?","a":"Do","o":["Does","Are"],"pic":"🌶️"},{"s":"Where ___ your parents live?","a":"do","o":["does","are"],"pic":"🏡"},{"s":"What time ___ the film start?","a":"does","o":["do","is"],"pic":"🎬"},{"s":"___ you go to the concert last night?","a":"Did","o":["Do","Were"],"pic":"🎸"},{"s":"Why ___ Aruzhan crying?","a":"is","o":["does","did"],"pic":"😢"},{"s":"___ you ever been to London?","a":"Have","o":["Did","Are"],"pic":"🇬🇧"},{"s":"How long ___ it take you to get to work every day?","a":"does","o":["do","is"],"pic":"🚗"},{"s":"___ your brother play the piano? — Yes, he can.","a":"Can","o":["Does","Is"],"pic":"🎹"},{"s":"What ___ you doing at the moment?","a":"are","o":["do","is"],"pic":"💻"},{"s":"Who ___ you talking to on the phone a minute ago?","a":"were","o":["did","was"],"pic":"☎️"},{"s":"Where ___ Timur from?","a":"is","o":["does","do"],"pic":"🌍"},{"s":"___ it rain a lot in Almaty in spring?","a":"Does","o":["Is","Do"],"pic":"🌧️"},{"s":"When ___ you finish school? — In 2019.","a":"did","o":["do","have"],"pic":"🎓"},{"s":"___ you be at the meeting tomorrow?","a":"Will","o":["Are","Do"],"pic":"📅"},{"s":"Did she ___ the email this morning?","a":"send","o":["sent","sends"],"pic":"📧","h":"send"},{"s":"Does Arman ___ in a bank?","a":"work","o":["works","working"],"pic":"🏦","h":"work"}],"order":[{"s":"Where did you spend your summer holiday?","x":"spent","pic":"🏖️"},{"s":"How often do you check your phone?","x":"does","pic":"📱"},{"s":"What book are you reading?","x":"do","pic":"📖"},{"s":"Does your brother live in Astana?","x":"lives","pic":"🏙️"},{"s":"Have you finished your homework yet?","x":"did","pic":"✏️"},{"s":"Who are you waiting for?","x":"wait","pic":"⏳"},{"s":"Can you open the window?","x":"Do","pic":"🪟"},{"s":"How much does this jacket cost?","x":"costs","pic":"🧥"},{"s":"Is Dana coming to the party?","x":"Does","pic":"🎉"},{"s":"What kind of music do you like?","x":"likes","pic":"🎵"},{"s":"Why didn't you answer my message?","x":"answered","pic":"💬"}],"fix":[{"s":"Does she likes chocolate?","w":2,"c":"like","o":["like","liking","liked"]},{"s":"Did you saw the match last night?","w":2,"c":"see","o":["see","seen","seeing"]},{"s":"Where does you live?","w":1,"c":"do","o":["do","are","has"]},{"s":"What time do the bank open?","w":2,"c":"does","o":["does","are","have"]},{"s":"Are you understand the question?","w":0,"c":"Do","o":["Do","Is","Have"]},{"s":"Why is your friends laughing?","w":1,"c":"are","o":["are","do","does"]},{"s":"How many languages does Ali speaks?","w":5,"c":"speak","o":["speak","spoke","speaking"]},{"s":"Have you ever went to Japan?","w":3,"c":"been","o":["been","go","going"]},{"s":"Did they visited their grandparents?","w":2,"c":"visit","o":["visit","visits","visiting"]},{"s":"What are you do this weekend?","w":3,"c":"doing","o":["doing","does","did"]}],"pairs":{"task":{"ru":"Соедини вопрос и краткий ответ","kk":"Сұрақ пен қысқа жауапты сәйкестендір","en":"Match the question and the short answer"},"list":[["Are you hungry?","Yes, I am."],["Does he smoke?","No, he doesn't."],["Did you win?","Yes, we did."],["Can she cook?","Yes, she can."],["Have they arrived?","No, they haven't."],["Is it raining?","Yes, it is."],["Were you at home?","No, I wasn't."],["Will you come?","Yes, I will."]]},"sort":{"task":{"ru":"Какой вспомогательный глагол нужен?","kk":"Қай көмекші етістік керек?","en":"Which auxiliary do you need?"},"cats":[{"ru":"do / does","kk":"do / does","en":"do / does"},{"ru":"did","kk":"did","en":"did"},{"ru":"am / is / are","kk":"am / is / are","en":"am / is / are"},{"ru":"have / has","kk":"have / has","en":"have / has"}],"items":[["___ she work here?",0],["___ you see Tom yesterday?",1],["___ they sleeping now?",2],["___ you ever eaten sushi?",3],["___ your dad drive?",0],["___ it rain last night?",1],["___ he wearing a hat?",2],["___ she finished yet?",3],["___ we need tickets?",0],["___ they move house last May?",1],["___ you feeling OK?",2],["___ he lost his keys?",3]]},"trans":[{"from":"She works in a hospital.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Does she work in a hospital?","o":["Does she works in a hospital?","Works she in a hospital?"]},{"from":"They went to Turkey last summer.","task":{"ru":"Спроси о месте: Where…?","kk":"Орын туралы сұра: Where…?","en":"Ask about the place: Where…?"},"to":"Where did they go last summer?","o":["Where they went last summer?","Where did they went last summer?"]},{"from":"You are learning Chinese.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Are you learning Chinese?","o":["Do you learning Chinese?","You are learning Chinese?"]},{"from":"He can ride a horse.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Can he ride a horse?","o":["Does he can ride a horse?","Can he rides a horse?"]},{"from":"Aigerim has finished the report.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Has Aigerim finished the report?","o":["Did Aigerim has finished the report?","Does Aigerim finished the report?"]},{"from":"The lesson starts at nine.","task":{"ru":"Спроси о времени: What time…?","kk":"Уақыт туралы сұра: What time…?","en":"Ask about the time: What time…?"},"to":"What time does the lesson start?","o":["What time the lesson starts?","What time does the lesson starts?"]},{"from":"Arman is talking to his boss.","task":{"ru":"Спроси: Who … to?","kk":"Сұра: Who … to?","en":"Ask: Who … to?"},"to":"Who is Arman talking to?","o":["To who Arman is talking?","Who Arman is talking to?"]},{"from":"They will arrive tomorrow.","task":{"ru":"Спроси: When…?","kk":"Сұра: When…?","en":"Ask: When…?"},"to":"When will they arrive?","o":["When they will arrive?","When do they will arrive?"]},{"from":"She bought a new phone.","task":{"ru":"Спроси: What…?","kk":"Сұра: What…?","en":"Ask: What…?"},"to":"What did she buy?","o":["What did she bought?","What she bought?"]}],"dialog":{"title":{"ru":"Знакомство с новой соседкой по квартире","kk":"Пәтердегі жаңа көршімен танысу","en":"Meeting a new flatmate"},"lines":[{"who":"A","t":"Hi, I'm Dana. So, where ___ you from?","a":"are","o":["do","is"]},{"who":"B","t":"I'm from Shymkent, but I study here in Almaty."},{"who":"A","t":"Oh, nice! What ___ you study?","a":"do","o":["are","does"]},{"who":"B","t":"Medicine. It's hard, but I love it. And you? ___ you work or study?","a":"Do","o":["Are","Does"]},{"who":"A","t":"I work in a travel agency. ___ you ever travelled abroad?","a":"Have","o":["Did","Do"]},{"who":"B","t":"Yes, I went to Georgia last year."},{"who":"A","t":"Really? Who ___ you go with?","a":"did","o":["do","were"]},{"who":"B","t":"With my cousins. We had a great time."},{"who":"A","t":"Cool! ___ you like cooking? I'm making plov tonight.","a":"Do","o":["Are","Does"]},{"who":"B","t":"Yes, I do! What ___ you need? I can go to the shop.","a":"do","o":["are","does"]},{"who":"A","t":"Some onions and carrots. Thanks!"}]},"catch":{"task":{"ru":"Лови только правильные вопросы","kk":"Тек дұрыс сұрақтарды ұста","en":"Catch only correct questions"},"right":["Do you like it?","Does she know?","Did they win?","Are you ready?","Can he swim?","Have you eaten?","Where do you live?","Why is he late?","What did you say?","Is it raining?","Who are you with?"],"wrong":["Do she like it?","Does she knows?","Did they won?","Do you ready?","Does he can swim?","Have you ate?","Where you live?","Why he is late?","What you said?","Is it rain?"]}},{"id":"L4-01","lv":"L4","n":1,"icon":"⏳","color":"#1F8FE5","title":{"ru":"Present Simple / Continuous / Perfect — сравнение","kk":"Present Simple / Continuous / Perfect — салыстыру","en":"Present Simple / Continuous / Perfect — comparison"},"sub":{"ru":"Три времени о настоящем","kk":"Осы шаққа қатысты үш шақ","en":"Three tenses about now"},"intro":{"ru":"В английском три «настоящих» времени, и у каждого своя задача. Present Simple — для привычек и фактов, Present Continuous — для того, что происходит сейчас или временно, Present Perfect — для прошлого, которое связано с настоящим. В русском и казахском всё это часто передаётся одним настоящим временем («Я живу здесь пять лет»), поэтому важно почувствовать разницу.","kk":"Ағылшын тілінде осы шаққа қатысты үш шақ бар, әрқайсысының өз міндеті бар. Present Simple — әдеттер мен фактілерге, Present Continuous — дәл қазір немесе уақытша болып жатқан іске, Present Perfect — қазіргі сәтпен байланысты өткен іске арналған. Орыс және қазақ тілдерінде мұның бәрі көбіне бір осы шақпен беріледі («Мен мұнда бес жылдан бері тұрамын»), сондықтан айырмашылықты сезіну маңызды.","en":"English has three 'present' tenses, and each has its own job. Present Simple is for habits and facts, Present Continuous is for things happening now or temporarily, and Present Perfect is for the past connected to now. Russian and Kazakh often use one present tense for all of these, so feeling the difference is key."},"cards":[{"h":{"ru":"Present Simple — привычки и факты","kk":"Present Simple — әдеттер мен фактілер","en":"Present Simple — habits and facts"},"f":[["s","Subject"],["v","V / V + s"],["o","always, usually, every day"]],"more":{"ru":"Present Simple описывает постоянное: привычки, распорядок, факты, законы природы и расписания. Слова-маркеры: always, usually, often, sometimes, never, every day, on Mondays, once a week. С he / she / it не забывай окончание -s: she works, he goes, it costs.","kk":"Present Simple тұрақты нәрсені сипаттайды: әдеттерді, күн тәртібін, фактілерді, табиғат заңдарын және кестелерді. Белгі сөздер: always, usually, often, sometimes, never, every day, on Mondays, once a week. he / she / it-пен -s жалғауын ұмытпа: she works, he goes, it costs.","en":"Present Simple describes permanent things: habits, routines, facts, laws of nature and timetables. Signal words: always, usually, often, sometimes, never, every day, on Mondays, once a week. Don't forget -s with he / she / it: she works, he goes, it costs."},"ex":["Aigerim works for a bank in Astana.","Water boils at 100 degrees.","The museum opens at ten every morning."]},{"h":{"ru":"Present Continuous — сейчас и временно","kk":"Present Continuous — қазір және уақытша","en":"Present Continuous — now and temporary"},"f":[["s","Subject"],["a","am / is / are"],["v","V-ing"],["o","now, at the moment, this week"]],"more":{"ru":"Present Continuous — для действий в момент речи (Look! It's raining.), временных ситуаций (I'm staying with my aunt this month) и изменений (Prices are rising). Маркеры: now, right now, at the moment, currently, this week, these days, Look!, Listen!. Вместе с always это время выражает раздражение: He's always losing his keys!","kk":"Present Continuous сөйлеп тұрған сәттегі іске (Look! It's raining.), уақытша жағдайларға (I'm staying with my aunt this month) және өзгерістерге (Prices are rising) қолданылады. Белгі сөздер: now, right now, at the moment, currently, this week, these days, Look!, Listen!. always сөзімен бірге бұл шақ ренішті білдіреді: He's always losing his keys!","en":"Present Continuous is for actions happening at the moment of speaking (Look! It's raining.), temporary situations (I'm staying with my aunt this month) and changes (Prices are rising). Signal words: now, right now, at the moment, currently, this week, these days, Look!, Listen!. With always it shows annoyance: He's always losing his keys!"},"ex":["I'm staying with my aunt until I find a flat.","Prices are rising fast this year.","He's always leaving his socks on the floor!"]},{"h":{"ru":"Present Perfect — прошлое + сейчас","kk":"Present Perfect — өткен + қазір","en":"Present Perfect — past + now"},"f":[["s","Subject"],["a","have / has"],["v","V3"],["o","already, yet, ever, since, for"]],"more":{"ru":"Present Perfect связывает прошлое с настоящим: важен результат сейчас (I've lost my keys — ключей нет), опыт за всю жизнь (Have you ever…?) или ситуация, которая началась в прошлом и длится до сих пор (for / since). С точным временем в прошлом (yesterday, in 2020) его не используют. Маркеры: already, just, yet, ever, never, so far, recently, for, since.","kk":"Present Perfect өткенді қазіргі сәтпен байланыстырады: қазіргі нәтиже маңызды (I've lost my keys — кілттер жоқ), өмірдегі тәжірибе (Have you ever…?) немесе өткенде басталып, әлі жалғасып жатқан жағдай (for / since). Оны өткеннің нақты уақытымен (yesterday, in 2020) қолданбайды. Белгі сөздер: already, just, yet, ever, never, so far, recently, for, since.","en":"Present Perfect links the past to now: the result now matters (I've lost my keys — I don't have them), life experience (Have you ever…?), or a situation that started in the past and still continues (for / since). It is not used with a finished past time (yesterday, in 2020). Signal words: already, just, yet, ever, never, so far, recently, for, since."},"ex":["Timur has lost his keys, so he can't get in.","Have you ever been to Turkistan?","We've lived in Almaty since 2019."]},{"h":{"ru":"Один глагол — три смысла","kk":"Бір етістік — үш мағына","en":"One verb — three meanings"},"f":[["v","lives"],["o","→"],["v","is living"],["o","→"],["v","has lived"]],"more":{"ru":"Сравни: My cousin lives in Shymkent — это его постоянный дом. My cousin is living in Shymkent this year — временно, потом он уедет. My cousin has lived in Shymkent for ten years — сколько времени до сих пор. Вопрос How long…? о периоде до настоящего момента требует Present Perfect, а не Present Simple.","kk":"Салыстыр: My cousin lives in Shymkent — бұл оның тұрақты үйі. My cousin is living in Shymkent this year — уақытша, кейін ол көшеді. My cousin has lived in Shymkent for ten years — осы уақытқа дейін қанша уақыт өткені. Қазіргі сәтке дейінгі кезең туралы How long…? сұрағы Present Simple-ді емес, Present Perfect-ті қажет етеді.","en":"Compare: My cousin lives in Shymkent — it's his permanent home. My cousin is living in Shymkent this year — it's temporary, he'll move later. My cousin has lived in Shymkent for ten years — how long up to now. A How long…? question about a period up to now needs Present Perfect, not Present Simple."},"ex":["My cousin lives in Shymkent.","My cousin is living in Shymkent this year.","My cousin has lived in Shymkent for ten years."]}],"tables":[{"cap":{"ru":"Три времени: формы с she","kk":"Үш шақ: she-мен түрлері","en":"Three tenses: forms with she"},"head":["","➕","➖","❓"],"rows":[["Present Simple","she works","she doesn't work","Does she work?"],["Present Continuous","she is working","she isn't working","Is she working?"],["Present Perfect","she has worked","she hasn't worked","Has she worked?"]]},{"cap":{"ru":"Слова-маркеры","kk":"Белгі сөздер","en":"Signal words"},"head":["Present Simple","Present Continuous","Present Perfect"],"rows":[["always","now","already"],["usually","at the moment","yet"],["every week","currently","ever / never"],["on Mondays","these days","since / for"],["once a year","Look! / Listen!","so far"]]}],"mistakes":[{"bad":"I live in Astana for five years.","good":"I have lived in Astana for five years.","why":{"ru":"«Живу пять лет» — период до сих пор, поэтому нужен Present Perfect, а не Present Simple.","kk":"«Бес жылдан бері тұрамын» — осы уақытқа дейінгі кезең, сондықтан Present Simple емес, Present Perfect керек.","en":"A period up to now needs Present Perfect, not Present Simple."}},{"bad":"Look! It rains.","good":"Look! It's raining.","why":{"ru":"Look! показывает, что действие идёт прямо сейчас — нужен Present Continuous.","kk":"Look! іс дәл қазір болып жатқанын көрсетеді — Present Continuous керек.","en":"Look! shows the action is happening now, so use Present Continuous."}},{"bad":"Usually I am going to work by bus.","good":"I usually go to work by bus.","why":{"ru":"Привычка — это Present Simple. Usually обычно стоит перед смысловым глаголом.","kk":"Әдет — бұл Present Simple. Usually әдетте негізгі етістіктің алдында тұрады.","en":"A habit needs Present Simple. Usually normally goes before the main verb."}},{"bad":"She is working here since May.","good":"She has worked here since May.","why":{"ru":"Со since / for для периода до сих пор нужен Present Perfect, а не Continuous.","kk":"Осы уақытқа дейінгі кезеңді білдіретін since / for-пен Continuous емес, Present Perfect керек.","en":"With since / for for a period up to now, use Present Perfect, not Present Continuous."}},{"bad":"How long do you know Dana?","good":"How long have you known Dana?","why":{"ru":"How long…? о периоде до настоящего — Present Perfect.","kk":"Қазіргі сәтке дейінгі кезең туралы How long…? — Present Perfect.","en":"How long…? about a period up to now takes Present Perfect."}}],"gap":[{"s":"Listen! The baby next door ___ again.","a":"is crying","o":["cries","has cried"],"pic":"👶","h":"cry","alt":["'s crying"]},{"s":"Arman usually ___ from home on Fridays.","a":"works","o":["is working","has worked"],"pic":"🏡","h":"work"},{"s":"We ___ in this flat since 2020.","a":"have lived","o":["live","are living"],"pic":"🏢","h":"live","alt":["'ve lived","have been living"]},{"s":"I can't talk right now — I ___ dinner.","a":"am cooking","o":["cook","have cooked"],"pic":"🍳","h":"cook","alt":["'m cooking"]},{"s":"Dana ___ her phone, so she can't call you back.","a":"has lost","o":["loses","is losing"],"pic":"📱","h":"lose","alt":["'s lost"]},{"s":"The museum ___ at 10 a.m. every day except Monday.","a":"opens","o":["is opening","has opened"],"pic":"🏛️","h":"open"},{"s":"___ you ever tried beshbarmak?","a":"Have","o":["Do","Are"],"pic":"🍲"},{"s":"At the moment, food prices ___ by about 2% a month.","a":"are rising","o":["rise","have risen"],"pic":"📈","h":"rise"},{"s":"My sister normally lives in Almaty, but this month she ___ with us in Shymkent.","a":"is staying","o":["stays","has stayed"],"pic":"🧳","h":"stay","alt":["'s staying"]},{"s":"I ___ three cups of coffee today, and it's only 11 o'clock!","a":"have had","o":["have","am having"],"pic":"☕","h":"have","alt":["'ve had"]},{"s":"How long ___ you known your best friend?","a":"have","o":["do","are"],"pic":"🤝"},{"s":"He ___ to the gym twice a week.","a":"goes","o":["is going","has gone"],"pic":"🏋️","h":"go"},{"s":"Sorry, Timur ___ to the bank and he isn't back yet.","a":"has gone","o":["goes","go"],"pic":"🏦","h":"go","alt":["'s gone"]},{"s":"She ___ her homework yet, so she can't go out.","a":"hasn't finished","o":["doesn't finish","isn't finishing"],"pic":"📚","h":"finish","alt":["has not finished"]}],"order":[{"s":"She has never been to London.","x":"was","pic":"🇬🇧"},{"s":"Why are you wearing a coat today?","x":"wear","pic":"🧥"},{"s":"How long have you lived in Astana?","x":"do","pic":"🏙️"},{"s":"My brother works in a hospital.","x":"working","pic":"🏥"},{"s":"We haven't decided where to go yet.","x":"didn't","pic":"🗺️"},{"s":"Does your father often travel for work?","x":"Is","pic":"✈️"},{"s":"Prices are going up all the time.","x":"goes","pic":"💸"},{"s":"Has the film started yet?","x":"Did","pic":"🎬"},{"s":"The sun rises in the east.","x":"rising","pic":"🌅"},{"s":"They have known each other since school.","x":"know","pic":"👫"},{"s":"Who is Aruzhan talking to on the phone?","x":"talks","pic":"📞"}],"fix":[{"s":"I know Aruzhan since we were children.","w":1,"c":"have known","o":["have known","am knowing","knew"]},{"s":"Listen! Somebody knocks at the door.","w":2,"c":"is knocking","o":["is knocking","has knocked","knock"]},{"s":"My parents live in Taraz all their lives.","w":2,"c":"have lived","o":["have lived","are living","lives"]},{"s":"Water boil at 100 degrees Celsius.","w":1,"c":"boils","o":["boils","is boiling","has boiled"]},{"s":"Have you seen my keys? I can't find them, and I look everywhere.","w":11,"c":"have looked","o":["have looked","looks","looking"]},{"s":"This week I work from home because the office is closed.","w":3,"c":"am working","o":["am working","working","works"]},{"s":"Our team hasn't won a match since two months.","w":6,"c":"for","o":["for","during","from"]},{"s":"It's the first time I visit Astana.","w":5,"c":"have visited","o":["have visited","visits","visiting"]},{"s":"The population of the city grows quickly at the moment.","w":5,"c":"is growing","o":["is growing","has grown","grow"]}],"pairs":{"task":{"ru":"Соедини начало и конец предложения","kk":"Сөйлемнің басы мен соңын сәйкестендір","en":"Match the beginning and the end of the sentence"},"list":[["We've known each other","since primary school."],["Look! The bus","is coming."],["The shop usually","closes at nine."],["Have you ever","been to Turkistan?"],["I'm staying with Dana","until I find a flat."],["Arman hasn't replied","to my message yet."],["Water freezes","at zero degrees."],["Prices are rising","faster than salaries."]]},"sort":{"task":{"ru":"Какое время подсказывает маркер?","kk":"Белгі сөз қай шақты көрсетеді?","en":"Which tense does the signal word suggest?"},"cats":[{"ru":"Present Simple","kk":"Present Simple","en":"Present Simple"},{"ru":"Present Continuous","kk":"Present Continuous","en":"Present Continuous"},{"ru":"Present Perfect","kk":"Present Perfect","en":"Present Perfect"}],"items":[["every Sunday",0],["twice a year",0],["on Mondays",0],["as a rule",0],["right now",1],["at the moment",1],["Look!",1],["Listen!",1],["since 2015",2],["for ages",2],["yet",2],["so far",2],["ever",2]]},"trans":[{"from":"I live in Almaty. I moved here five years ago.","task":{"ru":"Объедини в одно предложение с for","kk":"for арқылы бір сөйлемге біріктір","en":"Make one sentence with for"},"to":"I have lived in Almaty for five years.","o":["I live in Almaty for five years.","I am living in Almaty since five years."]},{"from":"She works at home on Fridays.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Does she work at home on Fridays?","o":["Is she work at home on Fridays?","Does she works at home on Fridays?"]},{"from":"They are watching a series.","task":{"ru":"Сделай вопрос","kk":"Сұрақ жаса","en":"Make a question"},"to":"Are they watching a series?","o":["Do they watching a series?","Are they watch a series?"]},{"from":"He has finished the project.","task":{"ru":"Сделай отрицание с yet","kk":"yet арқылы болымсыз сөйлем жаса","en":"Make it negative with yet"},"to":"He hasn't finished the project yet.","o":["He didn't finished the project yet.","He hasn't finish the project yet."]},{"from":"I usually drink tea.","task":{"ru":"Скажи, что это происходит прямо сейчас (right now)","kk":"Бұл дәл қазір болып жатқанын айт (right now)","en":"Say it is happening right now"},"to":"I'm drinking tea right now.","o":["I drink tea right now.","I drinking tea right now."]},{"from":"Aruzhan met Timur in 2018.","task":{"ru":"Скажи, что она знает его до сих пор (since)","kk":"Ол оны әлі күнге дейін білетінін айт (since)","en":"Say she still knows him (since)"},"to":"Aruzhan has known Timur since 2018.","o":["Aruzhan knows Timur since 2018.","Aruzhan is knowing Timur since 2018."]},{"from":"The kids are playing football.","task":{"ru":"Сделай отрицание","kk":"Болымсыз сөйлем жаса","en":"Make it negative"},"to":"The kids aren't playing football.","o":["The kids don't playing football.","The kids isn't playing football."]},{"from":"You have visited Turkistan.","task":{"ru":"Сделай вопрос с ever","kk":"ever арқылы сұрақ жаса","en":"Make a question with ever"},"to":"Have you ever visited Turkistan?","o":["Did you ever visited Turkistan?","Have you visited ever Turkistan?"]},{"from":"Arman lost his passport, and he still doesn't have it.","task":{"ru":"Скажи одним предложением о результате сейчас","kk":"Қазіргі нәтижені бір сөйлеммен айт","en":"Say it in one sentence about the result now"},"to":"Arman has lost his passport.","o":["Arman is losing his passport.","Arman loses his passport."]}],"dialog":{"title":{"ru":"Встреча старых друзей","kk":"Ескі достардың кездесуі","en":"Old friends meet again"},"lines":[{"who":"A","t":"Aigerim! I haven't seen you for ages! How are you?"},{"who":"B","t":"Hi, Arman! I'm great. I ___ in Astana since last spring.","a":"have lived","o":["live","am living"]},{"who":"A","t":"Wow! What do you do there?"},{"who":"B","t":"I'm a tour guide. I usually ___ groups around Burabay.","a":"take","o":["am taking","have taken"]},{"who":"A","t":"Sounds amazing! ___ you ever taken a group to Charyn Canyon?","a":"Have","o":["Do","Are"]},{"who":"B","t":"Not yet, but at the moment I ___ a new tour there.","a":"am planning","o":["plan","have planned"]},{"who":"B","t":"And you? Are you still at university?"},{"who":"A","t":"No, I've graduated. I ___ as a programmer for six months now.","a":"have worked","o":["work","am working"]},{"who":"A","t":"But this week I ___ until midnight every day because of a big project.","a":"am working","o":["have worked","works"]},{"who":"B","t":"Poor you! Let's meet when you're free."}]},"catch":{"task":{"ru":"Лови только правильные предложения","kk":"Тек дұрыс сөйлемдерді ұста","en":"Catch only correct sentences"},"right":["I've known her for years","Look, it's raining!","He usually walks to work","Have you ever flown?","She's lived here since May","We're busy right now","Water boils at 100°C","I haven't eaten yet","They're living with us now","Prices are rising"],"wrong":["I know her for years","Look, it rains!","He usually walking to work","Did you ever flown?","She lives here since May","We busy right now","Water is boil at 100°C","I don't eat yet","They living with us now","Prices are rise"]}},{"id":"L5-01","lv":"L5","n":1,"icon":"❓","color":"#1F8FE5","title":{"ru":"Question types — subject / object, indirect questions","kk":"Question types — subject / object, indirect questions","en":"Question types — subject / object, indirect questions"},"sub":{"ru":"Подлежащее, дополнение, вежливые вопросы","kk":"Бастауыш, толықтауыш, сыпайы сұрақ","en":"Subject, object, polite questions"},"intro":{"ru":"На этом уровне важно не просто задать вопрос, а выбрать правильный тип: вопрос к подлежащему (Who called?) или к дополнению (Who did you call?), прямой или косвенный (Could you tell me where it is?). В русском порядок слов почти не меняется, а в английском от него зависит смысл и вежливость. Это ключ к деловой переписке, интервью и small talk.","kk":"Бұл деңгейде жай сұрақ қою жеткіліксіз — дұрыс түрін таңдау керек: бастауышқа қойылатын сұрақ (Who called?) немесе толықтауышқа қойылатын сұрақ (Who did you call?), тура немесе жанама сұрақ (Could you tell me where it is?). Қазақ тілінде сұрақ көбіне шылаумен (ма/ме) жасалады, ал ағылшын тілінде мағына мен сыпайылық сөз тәртібіне байланысты. Бұл іскерлік хат, сұхбат және small talk үшін өте маңызды.","en":"At this level it's not enough to ask a question — you need the right type: a subject question (Who called?) or an object question (Who did you call?), a direct or an indirect one (Could you tell me where it is?). In English, word order changes both the meaning and the level of politeness. This is essential for business emails, interviews and small talk."},"cards":[{"h":{"ru":"Вопрос к подлежащему","kk":"Бастауышқа қойылатын сұрақ","en":"Subject questions"},"f":[["q","Who / What / Which…"],["v","V (no do / did)"],["o","…?"]],"more":{"ru":"Если вопросительное слово само является подлежащим (мы не знаем, КТО совершил действие), порядок слов как в утверждении и do / does / did не нужен. Глагол согласуется с вопросительным словом, которое обычно в единственном числе: Who knows…? (не Who know…?). Так же работают what, which + сущ., whose + сущ., how many + сущ.","kk":"Сұрау сөздің өзі бастауыш болса (іс-әрекетті КІМ жасағанын білмейміз), сөз тәртібі хабарлы сөйлемдегідей болады, do / does / did қажет емес. Етістік сұрау сөзбен қиысады, ол әдетте жекеше: Who knows…? (Who know…? емес). What, which + зат есім, whose + зат есім, how many + зат есім де осылай қолданылады.","en":"When the question word IS the subject (we don't know who did the action), the word order stays as in a statement and we don't use do / does / did. The verb agrees with the question word, which is normally singular: Who knows…? (not Who know…?). The same works with what, which + noun, whose + noun and how many + noun."},"ex":["Who sent you these flowers?","What caused the delay?","How many people signed the petition?"]},{"h":{"ru":"Вопрос к дополнению","kk":"Толықтауышқа қойылатын сұрақ","en":"Object questions"},"f":[["q","Who / What / Which…"],["a","do / did / have…"],["s","subject"],["v","V"],["o","…?"]],"more":{"ru":"Если вопросительное слово — дополнение (кто действовал, мы знаем, но не знаем, на кого или на что направлено действие), нужен вспомогательный глагол и обратный порядок слов. Сравни: Who invited Dana? (кто-то пригласил Дану) — Who did Dana invite? (Дана кого-то пригласила). Смысл меняется полностью, поэтому это не вопрос стиля, а вопрос точности.","kk":"Сұрау сөз толықтауыш болса (кім әрекет еткенін білеміз, бірақ әрекет кімге не неге бағытталғанын білмейміз), көмекші етістік пен кері сөз тәртібі қажет. Салыстыр: Who invited Dana? (біреу Дананы шақырды) — Who did Dana invite? (Дана біреуді шақырды). Мағына толық өзгереді, сондықтан бұл стиль емес, дәлдік мәселесі.","en":"When the question word is the object (we know who acted, but not who or what was affected), we need an auxiliary and inverted word order. Compare: Who invited Dana? (someone invited her) — Who did Dana invite? (Dana invited someone). The meaning flips completely, so this is a matter of accuracy, not style."},"ex":["Who did you invite to the reception?","What has she decided?","Which flat did they end up renting?"]},{"h":{"ru":"Предлог в конце вопроса","kk":"Сұрақтың соңындағы предлог","en":"Prepositions at the end"},"f":[["q","Who / What"],["a","aux"],["s","subject"],["v","V"],["o","+ preposition?"]],"more":{"ru":"В живой речи предлог, который относится к глаголу или прилагательному, уходит в конец: Who are you talking to? What are you worried about? Предлог в начале (To whom…? About what…?) звучит очень официально и встречается в основном в документах — и тогда только whom, а не who. В отличие от русского (О чём ты думаешь?), устный английский вопрос почти никогда не начинается с предлога.","kk":"Ауызекі тілде етістікке немесе сын есімге қатысты предлог сұрақтың соңына шығады: Who are you talking to? What are you worried about? Предлогты басына қою (To whom…? About what…?) өте ресми естіледі және негізінен құжаттарда кездеседі — ол кезде who емес, тек whom қолданылады. Орыс тіліндегідей (О чём ты думаешь?) емес, ауызекі ағылшын сұрағы предлогпен сирек басталады.","en":"In natural speech, a preposition that belongs to the verb or adjective goes to the end: Who are you talking to? What are you worried about? Putting it first (To whom…? About what…?) sounds very formal and appears mostly in official writing — and then we must use whom, not who. Unlike Russian, a spoken English question rarely starts with a preposition."},"ex":["What are you so worried about?","Who does this laptop belong to?","To whom should the complaint be addressed?"]},{"h":{"ru":"Косвенные вопросы","kk":"Жанама сұрақтар","en":"Indirect questions"},"f":[["o","Could you tell me / I wonder"],["q","wh- / if / whether"],["s","subject"],["v","verb"],["o","…"]],"more":{"ru":"Косвенные вопросы звучат вежливее и мягче. После вводной фразы порядок слов как в утверждении: без инверсии и без do / does / did. В общих вопросах используем if или whether (whether — более формальное, хорошо сочетается с or not). Знак в конце зависит от начала: Could you tell me…? — вопросительный знак, а I wonder… / I'd like to know… — точка.","kk":"Жанама сұрақтар сыпайырақ әрі жұмсағырақ естіледі. Кіріспе тіркестен кейін сөз тәртібі хабарлы сөйлемдегідей: инверсия да, do / does / did те жоқ. Жалпы сұрақтарда if немесе whether қолданамыз (whether ресмирек, or not-пен жақсы үйлеседі). Соңғы тыныс белгісі басына байланысты: Could you tell me…? — сұрақ белгісі, ал I wonder… / I'd like to know… — нүкте.","en":"Indirect questions sound more polite and tentative. After the opening phrase we use statement word order: no inversion and no do / does / did. Yes/no questions take if or whether (whether is more formal and pairs well with or not). The final punctuation depends on the opening: Could you tell me…? keeps the question mark, but I wonder… / I'd like to know… ends with a full stop."},"ex":["Could you tell me where the registration desk is?","I wonder whether the flight has been delayed.","Do you know what time the gallery closes?"]},{"h":{"ru":"Отрицательные вопросы","kk":"Болымсыз сұрақтар","en":"Negative questions"},"f":[["a","Isn't / Haven't / Didn't"],["s","subject"],["v","V"],["o","…?"]],"more":{"ru":"Отрицательные вопросы выражают удивление (Haven't you finished yet?), просьбу подтвердить то, в чём мы почти уверены (Isn't she from Almaty?), или вежливое предложение (Wouldn't it be better to wait?). Отвечаем по фактам, а не по форме вопроса: Didn't you get my email? — No, I didn't (не получил) / Yes, I did (получил). В русском часто наоборот («Да, не получил»), и это путает.","kk":"Болымсыз сұрақтар таңғалуды (Haven't you finished yet?), сенімді нәрсені растауды сұрауды (Isn't she from Almaty?) немесе сыпайы ұсынысты (Wouldn't it be better to wait?) білдіреді. Сұрақтың түріне емес, фактіге қарай жауап береміз: Didn't you get my email? — No, I didn't (алмадым) / Yes, I did (алдым). Орыс тілінде көбіне керісінше («Да, не получил»), сондықтан шатасу оңай.","en":"Negative questions express surprise (Haven't you finished yet?), ask for confirmation of what we already believe (Isn't she from Almaty?) or make a polite suggestion (Wouldn't it be better to wait?). Answer according to the facts, not the form: Didn't you get my email? — No, I didn't (I didn't get it) / Yes, I did (I got it). In Russian it's often the reverse, which confuses many learners."},"ex":["Haven't you seen the latest figures?","Isn't it a bit late to change the plan?","Didn't you get my email? — No, I didn't."]}],"tables":[{"cap":{"ru":"Вопрос к подлежащему и к дополнению","kk":"Бастауышқа және толықтауышқа қойылатын сұрақ","en":"Subject vs object questions"},"head":[{"ru":"Утверждение","kk":"Хабарлы сөйлем","en":"Statement"},{"ru":"К подлежащему","kk":"Бастауышқа","en":"Subject question"},{"ru":"К дополнению","kk":"Толықтауышқа","en":"Object question"}],"rows":[["Arman called Dana.","Who called Dana?","Who did Arman call?"],["The storm damaged the roof.","What damaged the roof?","What did the storm damage?"],["Aigerim has chosen the blue design.","Who has chosen the blue design?","Which design has Aigerim chosen?"]]},{"cap":{"ru":"Прямой и косвенный вопрос","kk":"Тура және жанама сұрақ","en":"Direct vs indirect questions"},"head":[{"ru":"Прямой","kk":"Тура","en":"Direct"},{"ru":"Косвенный","kk":"Жанама","en":"Indirect"}],"rows":[["Where is the exit?","Could you tell me where the exit is?"],["When does the course start?","Do you know when the course starts?"],["Did they accept the offer?","I wonder if they accepted the offer."],["Has the parcel arrived?","Can you check whether the parcel has arrived?"]]}],"mistakes":[{"bad":"Who did call you last night?","good":"Who called you last night?","why":{"ru":"Вопрос к подлежащему строится без did: порядок слов как в утверждении.","kk":"Бастауышқа қойылатын сұрақта did қолданылмайды: сөз тәртібі хабарлы сөйлемдегідей.","en":"A subject question has no did: the word order is the same as in a statement."}},{"bad":"Could you tell me where is the station?","good":"Could you tell me where the station is?","why":{"ru":"В косвенном вопросе нет инверсии: сначала подлежащее, потом глагол.","kk":"Жанама сұрақта инверсия жоқ: алдымен бастауыш, сосын етістік.","en":"No inversion in an indirect question: subject first, then the verb."}},{"bad":"Do you know what does this word mean?","good":"Do you know what this word means?","why":{"ru":"В косвенном вопросе не используем do / does / did, а глагол получает -s.","kk":"Жанама сұрақта do / does / did қолданылмайды, ал етістікке -s жалғанады.","en":"Indirect questions drop do / does / did, so the verb takes -s itself."}},{"bad":"I wonder will she accept the offer.","good":"I wonder whether she will accept the offer.","why":{"ru":"Общий косвенный вопрос вводится через if / whether, порядок слов прямой.","kk":"Жалпы жанама сұрақ if / whether арқылы енгізіледі, сөз тәртібі тура.","en":"A yes/no indirect question needs if / whether and statement word order."}},{"bad":"About what are you thinking?","good":"What are you thinking about?","why":{"ru":"В разговорном английском предлог уходит в конец вопроса.","kk":"Ауызекі ағылшын тілінде предлог сұрақтың соңына шығады.","en":"In everyday English the preposition goes to the end of the question."}}],"gap":[{"s":"Who ___ the Best Director award at the Astana film festival?","a":"won","o":["did win","did won"],"pic":"🏆","h":"win"},{"s":"Who ___ you invite to last year's conference?","a":"did","o":["was","has"],"pic":"🎤"},{"s":"Do you know what time the bank ___ on Saturdays?","a":"opens","o":["does open","open"],"pic":"🏦","h":"open"},{"s":"I wonder ___ they've received our invoice yet.","a":"whether","o":["that","what"],"pic":"🧾","alt":["if"]},{"s":"What ___ to the old cinema on Abay Avenue?","a":"happened","o":["did happen","was happen"],"pic":"🎬","h":"happen"},{"s":"Which laptop ___ the longest battery life?","a":"has","o":["does have","have"],"pic":"💻","h":"have"},{"s":"Who are you waiting ___?","a":"for","o":["to","at"],"pic":"⏳"},{"s":"What exactly is the novel ___? I couldn't follow the plot.","a":"about","o":["of","on"],"pic":"📖"},{"s":"Nobody could explain ___ the flight had been cancelled.","a":"why","o":["why had","what"],"pic":"✈️"},{"s":"___ you finished the report yet? I thought it was due this morning.","a":"Haven't","o":["Don't","Aren't"],"pic":"📄"},{"s":"How many people ___ the webinar yesterday?","a":"attended","o":["did attend","did they attend"],"pic":"💻","h":"attend"},{"s":"Can you remind me what the deadline ___?","a":"is","o":["does","be"],"pic":"📅"},{"s":"Whose idea ___ the client most at last week's pitch?","a":"impressed","o":["did impress","did impressed"],"pic":"💡","h":"impress"},{"s":"What ___ Timur say when you told him the news?","a":"did","o":["was","has"],"pic":"🗣️"}],"order":[{"s":"Who sent you this message?","x":"did","pic":"📩"},{"s":"Could you tell me where the conference is?","x":"does","pic":"🏢"},{"s":"I wonder whether they have signed the contract.","x":"did","pic":"✍️"},{"s":"What are you looking for?","x":"do","pic":"🔍"},{"s":"Do you know how much the tickets cost?","x":"does","pic":"🎟️"},{"s":"What happened at the board meeting?","x":"did","pic":"👔"},{"s":"Haven't you heard about the new policy?","x":"Didn't","pic":"📢"},{"s":"Who did Arman recommend for the position?","x":"recommended","pic":"🤝"},{"s":"Nobody knows why the project was cancelled.","x":"did","pic":"🚫"},{"s":"Can you explain what this clause means?","x":"does","pic":"📜"},{"s":"Which department does your sister work in?","x":"works","pic":"🏬"}],"fix":[{"s":"Who know the answer to this riddle?","w":1,"c":"knows","o":["knows","knowing","known"]},{"s":"Which team win the cup last season?","w":2,"c":"won","o":["won","winned","winning"]},{"s":"Do you know where Dana live now?","w":5,"c":"lives","o":["lives","living","to live"]},{"s":"What is the documentary of?","w":4,"c":"about","o":["about","in","at"]},{"s":"Who does you meet at the airport yesterday?","w":1,"c":"did","o":["did","do","have"]},{"s":"Don't you finished the essay yet?","w":0,"c":"Haven't","o":["Haven't","Didn't","Weren't"]},{"s":"I wonder that the committee will approve the budget.","w":2,"c":"whether","o":["whether","what","which"]},{"s":"How many guests comes to the wedding last Saturday?","w":3,"c":"came","o":["came","come","coming"]},{"s":"Could you tell me how long the flight take?","w":8,"c":"takes","o":["takes","taking","to take"]}],"pairs":{"task":{"ru":"Соедини прямой вопрос с косвенным (Do you know…)","kk":"Тура сұрақты жанама сұрақпен сәйкестендір (Do you know…)","en":"Match the direct question with its indirect form (Do you know…)"},"list":[["Where is the exit?","…where the exit is"],["When does it start?","…when it starts"],["Did she call?","…whether she called"],["What does it mean?","…what it means"],["Has he left?","…if he has left"],["Who did they hire?","…who they hired"],["How much is it?","…how much it is"],["Why was it cancelled?","…why it was cancelled"]]},"sort":{"task":{"ru":"Разложи: какой это тип вопроса?","kk":"Сұрыпта: бұл сұрақтың қай түрі?","en":"Sort: which type of question is it?"},"cats":[{"ru":"К подлежащему","kk":"Бастауышқа","en":"Subject question"},{"ru":"К дополнению","kk":"Толықтауышқа","en":"Object question"},{"ru":"Косвенный","kk":"Жанама","en":"Indirect question"}],"items":[["Who called you?",0],["Who did you call?",1],["What happened?",0],["What did she say?",1],["Which team won?",0],["Which team do you support?",1],["Do you know where he lives?",2],["I wonder if it's true.",2],["Who lives next door?",0],["Who are you texting?",1],["Could you tell me what it costs?",2],["How many people came?",0],["What do you mean?",1],["Nobody knows why she left.",2]]},"catch":{"task":{"ru":"Лови только правильные вопросы","kk":"Тек дұрыс сұрақтарды ұста","en":"Catch only the correct questions"},"right":["Who called you?","What happened?","Who did you call?","…where she lives","…what time it is","I wonder if he knows.","Which team won?","Who are you waiting for?","Haven't you heard?","…whether it's true"],"wrong":["Who did called you?","What was happened?","Who you called?","…where does she live","…what time is it","I wonder does he know.","Which team winned?","Who are you waiting?","Didn't you heard?","… function gPick(tp){R.items=shuffle(tp.gap).map(g=>({...g,opts:shuffle([{x:g.a,ok:1},...g.o.map(x=>({x}))])}));drawPick();}
function qhtml(g,fill){return esc(g.s).replace('___',`<span class="blank" id="blank">${fill?esc(fill):'?'}</span>`)+(g.h?` <span class="hint">(${esc(g.h)})</span>`:'');}
function drawPick(){const g=R.items[R.i];R.lock=false;$('app').innerHTML=frame(`<div class="pic">${g.pic||'✏️'}</div><div class="q">${qhtml(g)}</div><div class="opts">${g.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pickAns(${k})">${esc(o.x)}</button>`).join('')}</div><div class="fb" id="fb"></div>`,{progress:prog()});}
function pickAns(k){if(R.lock)return;R.lock=true;const g=R.items[R.i],o=g.opts[k],right=g.opts.findIndex(x=>x.ok);$('blank').textContent=g.a;
 if(o.ok){R.ok++;R.score+=10;$('o'+k).classList.add('ok');fb('ok',R.ok%4===0?'great':'ok');}else{R.miss++;$('o'+k).classList.add('bad');$('o'+right).classList.add('ok');fb('bad','bad');mist(g.s+(g.h?' ('+g.h+')':''),[g.a,...g.o],g.a);}

/* ---- 2. match ---- */
function gMatch(tp){const pl=tp.pairs.list;R.pairs=pl;R.task=tp.pairs.task;R.cards=shuffle(pl.flatMap((p,i)=>[{t:p[0],side:0,p:i},{t:p[1],side:1,p:i}]));R.open=[];R.done=new Set();R.moves=0;R.long=pl.some(p=>p[0].length>12||p[1].length>12);drawMatch();}
function drawMatch(){$('app').innerHTML=frame(`<div class="taskline">${esc(L(R.task))}</div><p class="ginst">${t('matchHint')}</p><div class="cards ${R.long?'long':''}">${R.cards.map((c,k)=>`<div class="mc ${R.open.includes(k)||R.done.has(k)?'flip':''} ${R.done.has(k)?'done':''}" onclick="mflip(${k})"><div class="in"><div class="f">?</div><div class="b" ${/[A-Za-z0-9А-я]/.test(c.t)?'':'style="font-size:34px"'}>${esc(c.t)}</div></div></div>`).join('')}</div>`,{progress:R.done.size/R.cards.length*100,right:`<span class="pill">${t('moves')}: ${R.moves}</span>`});}
function mflip(k){if(R.lock||R.done.has(k)||R.open.includes(k))return;R.open.push(k);beep('pop');drawMatch();
 if(R.open.length===2){R.moves++;const [a,b]=R.open.map(i=>R.cards[i]);R.lock=true;const okp=a.side!==b.side&&R.pairs.some(p=>(p[0]===a.t&&p[1]===b.t)||(p[0]===b.t&&p[1]===a.t));
  if(okp){setTimeout(()=>{R.open.forEach(i=>R.done.add(i));R.open=[];R.lock=false;beep('ok');const l=a.side===0?a:b,r=a.side===0?b:a;say(l.t+' — '+r.t);drawMatch();if(R.done.size===R.cards.length){const n=R.pairs.length;finish(R.moves<=n+3?3:R.moves<=Math.round(n*1.8)?2:1,`${t('moves')}: ${R.moves}`);}},450);}
  else setTimeout(()=>{R.open=[];R.lock=false;beep('bad');drawMatch();},950);}}
/* ---- 3. sort ---- */
function gSort(tp){R.task=tp.sort.task;R.cats=tp.sort.cats;R.items=shuffle(tp.sort.items).map(x=>({w:x[0],c:x[1]}));R.placed=[];R.sel=null;drawSort();}
function drawSort(badK){const left=R.items.map((x,k)=>({...x,k})).filter(x=>!R.placed.includes(x.k));
 $('app').innerHTML=frame(`<div class="taskline">${esc(L(R.task))}</div><p class="ginst">${t('sortHint')}</p><div class="chips">${left.map(x=>`<button class="chip2 ${R.sel===x.k?'sel':''} ${badK===x.k?'bad':''}" onclick="R.sel=${x.k};beep('pop');drawSort()">${esc(x.w)}</button>`).join('')}</div>
 <div class="buckets" style="grid-template-columns:repeat(${R.cats.length},minmax(0,1fr))">${R.cats.map((c,ci)=>`<div class="bucket" onclick="sortDrop(${ci})"><h5>${esc(L(c))}</h5><div class="in">${R.placed.filter(k=>R.items[k].c===ci).map(k=>`<span>${esc(R.items[k].w)}</span>`).join('')}</div></div>`).join('')}</div>`,{progress:R.placed.length/R.items.length*100,right:`<span class="pill">${t('mist')}: ${R.miss}</span>`});}
function sortDrop(ci){if(R.sel==null){toast(t('sortHint'));return;}const it=R.items[R.sel];if(it.c===ci){R.placed.push(R.sel);R.ok++;R.sel=null;beep('ok');say(it.w);drawSort();if(R.placed.length===R.items.length)setTimeout(()=>finish(R.miss<=1?3:R.miss<=4?2:1,`${t('mist')}: ${R.miss}`),500);}else{R.miss++;beep('bad');const k=R.sel;drawSort(k);}}
/* ---- 4. build ---- */
function gBuild(tp){R.items=shuffle(tp.order);newBuild();}
function newBuild(){const it=R.items[R.i];R.target=it.s.split(' ');R.pool=shuffle([...R.target.map(w=>({w})),{w:it.x,extra:1}]);R.sel=[];R.tries=0;R.solved=false;R.showSol=false;drawBuild();}
function drawBuild(state){const it=R.items[R.i];const full=R.sel.length===R.target.length;
 $('app').innerHTML=frame(`<div class="pic">${it.pic||'🧩'}</div><p class="ginst">${t('build')}</p><div class="answer ${state||''}">${R.sel.map((pi,k)=>`<button class="word" onclick="unpick(${k})">${esc(R.pool[pi].w)}</button>`).join('')||'&nbsp;'}</div>
 <div class="bubbles">${R.pool.map((p,k)=>`<button class="bub ${R.sel.includes(k)?'used':''}" onclick="bpick(${k})">${esc(p.w)}</button>`).join('')}</div>
 ${R.solved?'':`<div class="row"><button class="btn line" onclick="R.sel=[];drawBuild()">${t('clear')}</button><button class="btn" ${full?'':'disabled'} onclick="bcheck()">${t('check')}</button></div>`}
 <div class="fb ${state==='ok'?'ok':state==='bad'?'bad':''}">${state==='ok'?t('ok'):state==='bad'?t('again'):''}</div>
 ${R.showSol?`<div class="solution">${t('answerIs')} <b>${esc(it.s)}</b></div><div class="row"><button class="btn" onclick="bnext()">${t('next')}</button></div>`:''}`,{progress:prog()});}
function bpick(k){if(R.solved||R.sel.includes(k)||R.sel.length>=R.target.length)return;R.sel.push(k);beep('pop');drawBuild();}
function unpick(k){if(R.solved)return;R.sel.splice(k,1);drawBuild();}
function bcheck(){const it=R.items[R.i];const got=R.sel.map(k=>R.pool[k].w).join(' ');R.tries++;
 if(got===it.s){R.ok+=R.tries===1?1:.5;R.score+=R.tries===1?10:5;R.solved=true;beep('ok');say(it.s);drawBuild('ok');setTimeout(bnext,1300);}
 else{beep('bad');R.miss++;if(R.tries>=2){R.solved=true;R.showSol=true;say(it.s);}drawBuild('bad');}}
function bnext(){nextOr(newBuild,()=>[acc(R.ok,R.items.length),`${Math.round(R.ok)} / ${R.items.length} ${t('correctOf')}`]);}
/* ---- 5. transformer ---- */
function gTrans(tp){R.items=shuffle(tp.trans).map(x=>({...x,opts:shuffle([{x:x.to,ok:1},...x.o.map(y=>({x:y}))])}));drawTrans();}
function drawTrans(){const it=R.items[R.i];R.lock=false;$('app').innerHTML=frame(`<p class="ginst">${t('transHint')}</p><div class="tbox"><div class="tfrom">${esc(it.from)}</div><br><span class="ttask">⚙️ ${esc(L(it.task))}</span><div class="arrow">⬇</div></div><div class="opts col">${it.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="transAns(${k})">${esc(o.x)}</button>`).join('')}</div><div class="fb" id="fb"></div>`,{progress:prog()});}
function transAns(k){if(R.lock)return;R.lock=true;const it=R.items[R.i],o=it.opts[k],r=it.opts.findIndex(x=>x.ok);if(o.ok){R.ok++;R.score+=10;$('o'+k).classList.add('ok');fb('ok','ok');}else{R.miss++;$('o'+k).classList.add('bad');$('o'+r).classList.add('ok');fb('bad','bad');mist(it.from+' → '+L(it.task),[it.to,...it.o],it.to);}
 say(it.to);setTimeout(()=>nextOr(drawTrans,()=>[acc(R.ok,R.items.length),`${R.ok} / ${R.items.length} ${t('correctOf')}`]),o.ok?1200:2200);}
/* ---- 6. fix ---- */
const trail=w=>{const m=w.match(/[.,!?;:]+$/);return m?m[0]:'';};
function gFix(tp){R.items=shuffle(tp.fix);R.step=0;R.err=0;drawFix();}
function drawFix(state){const it=R.items[R.i];const words=it.s.split(' ');
 $('app').innerHTML=frame(`<div class="pic">🔍</div><div class="taskline">${R.step===0?t('clickWrong'):t('chooseFix')}</div>
 <div class="sentence">${words.map((w,k)=>`<button class="word ${R.step>0&&k===it.w?(state==='fixed'?'fixed':'sel'):''} ${R.missK===k?'miss':''}" onclick="fixWord(${k})">${esc(R.step>0&&k===it.w&&state==='fixed'?it.c+trail(w):w)}</button>`).join('')}</div>
 ${R.step===1?`<div class="opts">${R.opts.map((o,k)=>`<button class="opt" id="fo${k}" onclick="fixPick(${k})">${esc(o)}</button>`).join('')}</div>`:''}
 <div class="fb ${state==='fixed'?'ok':state==='bad'?'bad':''}">${state==='fixed'?t('ok'):state==='bad'?t('bad'):''}</div>`,{progress:prog()});R.missK=null;}
function fixWord(k){if(R.step!==0)return;const it=R.items[R.i];if(k===it.w){R.step=1;R.opts=shuffle(it.o);beep('pop');drawFix();}else{R.err++;R.miss++;R.missK=k;beep('bad');drawFix('bad');}}
function fixPick(k){if(R.step!==1)return;const it=R.items[R.i];const o=R.opts[k];
 if(o===it.c){R.step=2;R.ok+=R.err?.5:1;R.score+=10;beep('ok');const w=it.s.split(' ');w[it.w]=it.c+trail(w[it.w]);say(w.join(' '));drawFix('fixed');setTimeout(()=>{R.step=0;R.err=0;nextOr(drawFix,()=>[acc(R.ok,R.items.length),`${Math.round(R.ok)} / ${R.items.length} ${t('correctOf')}`]);},1400);}
 else{R.err++;R.miss++;beep('bad');const b=$('fo'+k);if(b)b.classList.add('bad');const w=it.s.split(' ');const good=w.slice();good[it.w]=it.c+trail(w[it.w]);mist(t('isCorrect'),[good.join(' '),it.s],good.join(' '));}}
/* ---- 7. place ---- */
const ZONES={on:[220,108],in:[220,190],under:[220,268],next:[82,262],between:[362,262],front:[268,322],behind:[304,150]};
function gPlace(tp){R.items=shuffle(tp.place);drawPlace();}
function drawPlace(state,zk){const it=R.items[R.i];const pos=zk?ZONES[zk]:null;R.lock=!!state;
 $('app').innerHTML=frame(`<div class="taskline" style="font-size:22px" data-s="${esc(it.s)}">${esc(it.s)} <button class="spk" onclick="say(this.parentNode.dataset.s,1)">🔊</button></div><p class="ginst">${t('placeHint')} ${it.item}</p>
 <div class="scenewrap" id="sw"><div class="scene" id="scene"><div class="boxA"></div><div class="legA" style="left:158px"></div><div class="legA" style="left:270px"></div><div class="boxB"></div>
 ${Object.entries(ZONES).map(([k,[x,y]])=>`<div class="zone ${zk===k?state:''}" style="left:${x}px;top:${y}px" onclick="placeAt('${k}')"></div>`).join('')}
 ${pos?`<div class="thing z-${['behind','in','front'].includes(zk)?zk:'other'}" style="left:${pos[0]}px;top:${pos[1]}px">${it.item}</div>`:''}</div></div>
 <div class="fb ${state||''}">${state==='ok'?t('ok'):state==='bad'?t('bad'):''}</div>`,{progress:prog()});fitScene();}
function fitScene(){const w=$('sw'),s=$('scene');if(!w||!s)return;const k=Math.min(1,w.clientWidth/580);s.style.transform=`scale(${k})`;w.style.height=(360*k)+'px';}

/* ---- 8. type ---- */
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').replace(/[.!?,]+$/,'').trim();
function gType(tp){R.items=shuffle(tp.gap).slice(0,10);newType();}

function drawType(state,val){const g=R.items[R.i];$('app').innerHTML=frame(`<div class="pic">${g.pic||'⌨️'}</div><p class="ginst">${t('typeHint')}</p><div class="q">${qhtml(g,state==='ok'||state==='show'?g.a:null)}</div>
 <div class="tin"><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" class="${state==='ok'?'ok':state==='bad'?'bad':''}" value="${esc(val||'')}" onkeydown="if(event.key==='Enter')typeCheck()" ${state==='ok'||state==='show'?'disabled':''}><button class="btn" onclick="typeCheck()" ${state==='ok'||state==='show'?'disabled':''}>${t('check')}</button></div>
 <div class="row" style="margin-top:12px">${state==='ok'||state==='show'?'':`<button class="btn line" onclick="typeHint()">${t('hintBtn')}</button>`}</div>
 <div class="fb ${state==='ok'?'ok':state?'bad':''}">${state==='ok'?t('ok'):state==='bad'?t('again'):state==='show'?t('answerIs')+' '+esc(g.a):''}</div>

function typeHint(){const g=R.items[R.i];R.hint=Math.min(g.a.length,R.hint+1);const i=$('tin');if(i){i.value=g.a.slice(0,R.hint);i.focus();}}

 else{R.miss++;beep('bad');if(R.tries>=2){say(sentOf(g.s,g.a));mist(g.s+(g.h?' ('+g.h+')':''),[g.a,...g.o],g.a);drawType('show',v);}else{drawType('bad',v);setTimeout(()=>{const i=$('tin');if(i){i.focus();i.select();}},30);}}}

 ${ask?`<div class="msg ${l.who}"><span class="av">${av[l.who]}</span><div class="bb">${esc(l.t).replace('___','<span class="blank">?</span>')}</div></div>`:''}</div>

function drawListen(){const it=R.items[R.i];R.lock=false;R.peek=false;$('app').innerHTML=frame(`<p class="ginst">${t('listenHint')}</p><button class="lbtn" id="lb" onclick="listenPlay()">🔊</button>
