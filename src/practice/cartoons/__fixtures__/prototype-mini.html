e so afraid of it?"},{"kw":["climb","continue","keep","onward","now","tonight","hurry"],"say":"You want me to go on? Part of me wants to run up that mountain tonight. Anyway, the innkeeper just told me something bad. The villagers plan to hunt a dangerous beast tomorrow morning. They mean my dragon. Why do you think they are so afraid of it?"}],"other":"Hmm, I need to think about that. Anyway, the innkeeper just told me something bad. The villagers plan to hunt a dangerous beast tomorrow morning. They mean my dragon. Why do you think they are so afraid of it?"},{"ask":"Explain why the villagers might be afraid of the dragon.","prompts":["Their fears","What they might do"],"hints":["They are afraid because...","They might think it will..."],"starters":[],"paths":[{"kw":["afraid","fear","scared","danger","burn","fire","attack","hurt"],"say":"You are right, fear makes people act fast. But he was only a baby when I last saw him. I want to speak to the village leader before the hunt. How can I convince her to wait a few days? What should I say?"},{"kw":["rumour","story","misunderstand","know","never","strange","unknown"],"say":"True, people fear what they do not know. That is exactly my problem. I want to speak to the village leader before the hunt. How can I convince her to wait a few days? What should I say?"}],"other":"Maybe. I cannot say for sure. I want to speak to the village leader before the hunt. How can I convince her to wait a few days? What should I say?"},{"ask":"Persuade the leader to wait. Tell Sintel what to say.","prompts":["Your main argument","One promise she can make"],"hints":["You could say that... If she waits, ...","Tell her you will..."],"starters":[],"paths":[{"kw":["promise","wait","days","proof","safe","trust","careful","guarantee"],"say":"A promise. Good. I will make one and I will keep it. The leader listened, but she wants proof first. She says the dragon is harmless only if we can show it. What could we do to prove it?"},{"kw":["truth","story","explain","dragon","small","raised","saved"],"say":"Maybe the truth is my best weapon. I did raise him, after all. The leader listened, but she wants proof first. She says the dragon is harmless only if we can show it. What could we do to prove it?"}],"other":"Hmm, I will try something like that. The leader listened, but she wants proof first. She says the dragon is harmless only if we can show it. What could we do to prove it?"},{"ask":"Suggest a way to show the dragon is harmless.","prompts":["Your idea","Why it could work"],"hints":["We could... This would show that...","How about... It might work because..."],"starters":[],"paths":[{"kw":["show","bring","calm","feed","gentle","test","watch","meet"],"say":"That would be a real test. I like that it is simple. The innkeeper has her own idea. She says we should leave meat on the hill with a lantern and wait for the dragon. She is very proud of it. Is that a good idea, in your opinion?"},{"kw":["letter","write","tell","speak","talk","sign","paper"],"say":"Words again. They are not my strongest point, but I will try. The innkeeper has her own idea. She says we should leave meat on the hill with a lantern and wait for the dragon. She is very proud of it. Is that a good idea, in your opinion?"}],"other":"That is something to think about. The innkeeper has her own idea. She says we should leave meat on the hill with a lantern and wait for the dragon. She is very proud of it. Is that a good idea, in your opinion?"},{"ask":"Give your opinion on the innkeeper's idea and say why.","prompts":["Good or bad idea","Your reason"],"hints":["In my opinion, it is... because...","It might work, but it could also..."],"starters":[],"paths":[{"kw":["good","great","smart","clever","agree","work","yes","brilliant"],"say":"I hope you are right. She will be happy to hear it. Now I must choose a route tomorrow. The north pass is short but icy, and the forest path is long but safe. Which one would you choose, and why?"},{"kw":["bad","risky","scare","wrong","dangerous","stupid","disagree"],"say":"Hm, you may be right. A lantern could frighten him away. Now I must choose a route tomorrow. The north pass is short but icy, and the forest path is long but safe. Which one would you choose, and why?"}],"other":"I am not sure, but I understand. Now I must choose a route tomorrow. The north pass is short but icy, and the forest path is long but safe. Which one would you choose, and why?"},{"ask":"Choose a route for Sintel and explain your decision.","prompts":["North pass or forest path","Your reason"],"hints":["I would take... because it is more...","The north pass is quicker, but..."],"starters":[],"paths":[{"kw":["north","pass","short","quick","fast","ice","icy"],"say":"The north pass. Bold. My dragon was always at home in the cold. Good. We need a plan for the morning. Who will do what? I will need to pack, ask the leader for help, and watch the hills. How will we share the jobs?"},{"kw":["forest","long","safe","safer","slow","trees"],"say":"The forest, then. Slower, but I will not slip on the ice. Good. We need a plan for the morning. Who will do what? I will need to pack, ask the leader for help, and watch the hills. How will we share the jobs?"}],"other":"I will weigh both ways. Good. We need a plan for the morning. Who will do what? I will need to pack, ask the leader for help, and watch the hills. How will we share the jobs?"},{"ask":"Make a plan with Sintel. Share the jobs.","prompts":["Your job","Sintel's job"],"hints":["I am going to... and you will...","First we will... then..."],"starters":[],"paths":[{"kw":["pack","food","rope","bring","carry","lantern","blanket"],"say":"Good, a clear list helps. I feel a little calmer already. Hours later, we found a cave with scales on the floor. There is a low sound inside. It may be my dragon, but he may also be afraid of me now. Should I go in slowly, or call him from outside?"},{"kw":["watch","lead","guide","search","map","ask","help"],"say":"That makes sense. Two people with two jobs are better than one person with ten. Hours later, we found a cave with scales on the floor. There is a low sound inside. It may be my dragon, but he may also be afraid of me now. Should I go in slowly, or call him from outside?"}],"other":"I will remember that. Hours later, we found a cave with scales on the floor. There is a low sound inside. It may be my dragon, but he may also be afraid of me now. Should I go in slowly, or call him from outside?"},{"ask":"Persuade Sintel to go in slowly or call from outside.","prompts":["Your choice","Why it is the best way"],"hints":["If you go in slowly, he will...","I would call from outside because..."],"starters":[],"paths":[{"kw":["slowly","quiet","inside","enter","gentle","soft","careful"],"say":"Slowly, then. I will keep my hands open and my voice low. It is almost dawn, and the hunters are on the road. Whatever happens in this cave, you helped me. What do you promise to do for the dragon and for the town?"},{"kw":["call","outside","voice","name","wait","sing","whistle"],"say":"My voice. He might still know it. That is a hopeful thought. It is almost dawn, and the hunters are on the road. Whatever happens in this cave, you helped me. What do you promise to do for the dragon and for the town?"}],"other":"Maybe. I will try to stay calm. It is almost dawn, and the hunters are on the road. Whatever happens in this cave, you helped me. What do you promise to do for the dragon and for the town?"},{"ask":"Make a promise to Sintel about what you will do.","prompts":["Your promise","Why it matters"],"hints":["I promise I will...","I will make sure that..."],"starters":[],"close":"Thank you. I will remember that promise on every cold road. Whatever the hunters do, I know now that someone in this town was on our side. Goodbye for now, my friend."}],"end":"Sintel's search goes on, with your help."}},"elephants-dream":{"basis":"episode","theme":"space","fmt":"Chat with Proog","title":"Emo and Proog: Lost in the Machine","brief":"You are watching Emo and Proog wander around a strange machine-like world. Proog, the older and more confident one, contacts you, and he would like an outsider's opinion on a disagreement with Emo.","goal":"Help Proog and Emo decide whether to trust the strange machine world by reasoning, negotiating, advising and persuading.","purpose":"Narrate and justify","focus":"Past narrative tenses, third conditional, descriptive language","vocab":["labyrinth","mechanism","reckless","convince","had it not been for","overwhelming","uncharted"],"ru":{"title":"Эмо и Пруг: потерянные в машине","goal":"Помочь Пругу и Эмо решить, доверять ли странному миру-машине, используя рассуждения, переговоры, советы и убеждение."},"kk":{"title":"Эмо мен Пруг: машинада адасқандар","goal":"Пруг пен Эмоға ерекше машина әлеміне сену-сенбеуді шешуге көмектесу: ой жүгірту, келіссөз, кеңес және сендіру арқылы."},"chat":{"who":{"name":"Proog","role":"An older, confident traveller in a strange machine"},"open":["Proog here. Emo and I are wandering through this enormous machine, and, frankly, we disagree.","I say we go further in. Emo wants to turn back. If you were us, which would you choose, and why?"],"turns":[{"ask":"Choose: go further or turn back, and justify.","prompts":["your choice","your reason"],"hints":["I would go further because...","On balance, turning back is wiser since..."],"starters":["I would...","It would be wiser to..."],"paths":[{"kw":["further","forward","ahead","explore","discover","curious","inside","continue"],"say":"Bold. I like that. Emo will not, but I do. Since we cannot agree, Emo is sulking. How would you reconcile the two of us?"},{"kw":["back","return","safe","danger","leave","careful","risk","home"],"say":"Cautious, then. Emo will enjoy hearing that, and I will not. Since we cannot agree, Emo is sulking. How would you reconcile the two of us?"}],"other":"Hm. Not a clear answer, but I will consider it. Since we cannot agree, Emo is sulking. How would you reconcile the two of us?"},{"ask":"Explain how you would reconcile Proog and Emo.","prompts":["a compromise","what each person gives up"],"hints":["I would suggest a compromise: ...","If each of you gave up..., you could..."],"starters":[],"paths":[{"kw":["compromise","middle","both","together","half","share","agree"],"say":"A compromise. Sensible, if irritating. Emo might even accept it. Meanwhile, we found a huge door covered in moving symbols. Emo says it is a warning. I say it is an invitation. How should we deal with something we do not understand?"},{"kw":["listen","talk","discuss","understand","apologise","apologize","calm"],"say":"Listening first. A fair point, though I am not good at it. Meanwhile, we found a huge door covered in moving symbols. Emo says it is a warning. I say it is an invitation. How should we deal with something we do not understand?"}],"other":"Hm. I will keep that in mind. Meanwhile, we found a huge door covered in moving symbols. Emo says it is a warning. I say it is an invitation. How should we deal with something we do not understand?"},{"ask":"Give your view on dealing with something you do not understand.","prompts":["your approach","a possible risk"],"hints":["It might be wise to observe first, since...","The risk is that..."],"starters":[],"paths":[{"kw":["observe","watch","study","test","careful","slowly","gather","evidence"],"say":"Observation first. Patient advice. I may be too impatient for it. Emo wants to mark our route with scratches on the walls so we can find the way back. Is that a clever idea, or could it cause trouble? How would you improve it?"},{"kw":["ignore","avoid","leave","dangerous","unknown","trust","instinct"],"say":"Caution, again. You and Emo would get along. Emo wants to mark our route with scratches on the walls so we can find the way back. Is that a clever idea, or could it cause trouble? How would you improve it?"}],"other":"A thoughtful point, I suppose. Emo wants to mark our route with scratches on the walls so we can find the way back. Is that a clever idea, or could it cause trouble? How would you improve it?"},{"ask":"Evaluate Emo's idea and improve it.","prompts":["a strength","an improvement"],"hints":["It is clever, although...","It would work better if..."],"starters":[],"paths":[{"kw":["clever","useful","smart","good","sensible","helpful","wise"],"say":"So you approve. Emo will be insufferably pleased. Our supplies are limited, enough for a short time only. Emo wants one hour, I want much longer. Negotiate a time limit for us, and justify it."},{"kw":["damage","trouble","danger","problem","wrong","harm","noise"],"say":"Fair. We might wake something. Emo will not like that. Our supplies are limited, enough for a short time only. Emo wants one hour, I want much longer. Negotiate a time limit for us, and justify it."}],"other":"Hm. Perhaps. I will tell Emo. Our supplies are limited, enough for a short time only. Emo wants one hour, I want much longer. Negotiate a time limit for us, and justify it."},{"ask":"Propose a time limit and justify it.","prompts":["how long","your reason"],"hints":["I propose a limit of..., because...","If we agreed on..., we could..."],"starters":[],"paths":[{"kw":["hour","minutes","limit","deadline","short","enough","half"],"say":"A firm limit. Emo and I can respect a number. Probably. Something strange: whenever we approach, the lights in the corridor switch on. It seems almost aware of us. Should we treat this machine politely, as if it were alive? Give your opinion."},{"kw":["longer","extra","flexible","depends","supplies","food","water"],"say":"Flexibility has its charm, but Emo will want a number. Something strange: whenever we approach, the lights in the corridor switch on. It seems almost aware of us. Should we treat this machine politely, as if it were alive? Give your opinion."}],"other":"Hm. I will pass that on. Something strange: whenever we approach, the lights in the corridor switch on. It seems almost aware of us. Should we treat this machine politely, as if it were alive? Give your opinion."},{"ask":"Give an opinion on treating the machine as if it were alive.","prompts":["yes or no","your reasoning"],"hints":["I think we should be polite, because...","There is no evidence that..."],"starters":[],"paths":[{"kw":["alive","polite","respect","living","conscious","aware","careful","kind"],"say":"Respect for the machine. Unusual, but it appeals to me. Emo has found a lever and wants to pull it immediately. I am hesitant, for once. Warn him, or encourage him, but explain the consequences."},{"kw":["machine","object","evidence","nonsense","programmed","device","tool"],"say":"A tool, then. Proog the sceptic might agree. Emo has found a lever and wants to pull it immediately. I am hesitant, for once. Warn him, or encourage him, but explain the consequences."}],"other":"An interesting thought, I suppose. Emo has found a lever and wants to pull it immediately. I am hesitant, for once. Warn him, or encourage him, but explain the consequences."},{"ask":"Warn or encourage Emo about the lever.","prompts":["your advice","the possible consequence"],"hints":["I would advise against it, since...","If he pulled it, ..."],"starters":[],"paths":[{"kw":["warn","wait","stop","careful","danger","risk","dangerous"],"say":"Good, a warning. Emo will grumble, but he will listen. Let us plan properly, then. Who goes first, who waits at the entrance, and how do we signal each other?"},{"kw":["pull","try","encourage","brave","chance","discover"],"say":"Encouragement. Emo will love that, and I may regret it. Let us plan properly, then. Who goes first, who waits at the entrance, and how do we signal each other?"}],"other":"Hm. Noted, though I cannot tell what he will do. Let us plan properly, then. Who goes first, who waits at the entrance, and how do we signal each other?"},{"ask":"Propose roles and a signal system.","prompts":["who does what","a signal"],"hints":["I suggest that Emo goes first while you...","We could use a signal such as..."],"starters":[],"paths":[{"kw":["first","behind","entrance","wait","guard","lead","scout","stay"],"say":"A clear order of roles. Emo may even like it. Before I write to Emo, I must admit something: I am always confident, and sometimes wrong. Is such confidence a strength or a weakness in a leader?"},{"kw":["signal","shout","whistle","light","rope","tap","sign"],"say":"A signal. Practical. I like practical. Before I write to Emo, I must admit something: I am always confident, and sometimes wrong. Is such confidence a strength or a weakness in a leader?"}],"other":"Hm. I will try to remember that. Before I write to Emo, I must admit something: I am always confident, and sometimes wrong. Is such confidence a strength or a weakness in a leader?"},{"ask":"Give your view on whether confidence is a strength or a weakness in a leader.","prompts":["strength or weakness","your reasoning"],"hints":["Confidence is a strength provided that...","It becomes a weakness when..."],"starters":[],"paths":[{"kw":["strength","inspire","trust","lead","decisive","encourage","motivate"],"say":"Strength, then. Flattering, and perhaps deserved. Emo still sulks and refuses to trust my plan. Write him a short message to persuade him."},{"kw":["weakness","arrogant","stubborn","wrong","blind","overconfident","mistakes"],"say":"Arrogance. Ouch. Emo would applaud that. Emo still sulks and refuses to trust my plan. Write him a short message to persuade him."}],"other":"Hm. A diplomatic non-answer. I will let it pass. Emo still sulks and refuses to trust my plan. Write him a short message to persuade him."},{"ask":"Write a short message to persuade Emo, then name our final decision.","prompts":["your persuasion","your final decision"],"hints":["Emo, please trust us because...","In the end, I recommend that we..."],"starters":[],"close":"Thank you. I will read it to Emo, and he will pretend not to listen. Whatever we decide, we decide together this time. The machine can wait a little longer for us."}],"end":"Proog and Emo decide together, at last."}},"sprite-fright":{"basis":"episode","theme":"forest","fmt":"Incident report chat","title":"What We Saw in the Forest","brief":"Imagine you went to a picnic in the forest with a group of friends when strange mushroom creatures appeared. Nobody believes your story. The park ranger writes to you and asks for the facts.","goal":"Describe, explain and debate a strange forest incident with the ranger, from detailed facts to theories, compromise and a plan.","purpose":"Report, describe and speculate","focus":"Past Simple and Past Perfect, modals of deduction (might, must), formal linkers","vocab":["eyewitness","to emerge","fungi","unexpected","at that point","it must have been","to investigate"],"ru":{"title":"Что мы видели в лесу","goal":"Описать, объяснить и обсудить странный случай в лесу с рейнджером: от подробных фактов и теорий до компромисса и плана."},"kk":{"title":"Орманда не көргеніміз","goal":"Орман ретінде болған оғаш оқиғаны рейнджермен бірге сипаттау, түсіндіру және талқылау: нақты деректерден теорияларға, келісімге және жоспарға дейін."},"chat":{"who":{"name":"Ranger Collins","role":"Park ranger writing a report"},"open":["Good evening. I am Ranger Collins. I am writing the official report about the incident in the forest.","I need facts, not rumours. Please describe the creatures you saw."],"turns":[{"ask":"Describe the creatures to the ranger in detail.","prompts":["Appearance and size","Movement and sound"],"hints":["They were about... with...","They seemed to... and made a... noise."],"starters":[],"paths":[{"kw":["mushroom","cap","small","tall","green","brown","skin","eyes"],"say":"Mushroom-like, you say. That is a precise description, and I am noting every detail. Now the sequence. The forest is large, and I must place each detail on a timeline. Can you explain clearly what happened first, next and finally?"},{"kw":["fast","moved","noise","sound","scream","walk","jump","whisper"],"say":"Movement and sound. Useful, since people usually remember appearance only. Now the sequence. The forest is large, and I must place each detail on a timeline. Can you explain clearly what happened first, next and finally?"}],"other":"I shall record that as it stands. Now the sequence. The forest is large, and I must place each detail on a timeline. Can you explain clearly what happened first, next and finally?"},{"ask":"Explain the order of events clearly.","prompts":["What happened first","What happened next and last"],"hints":["First... After that... Eventually...","Before we noticed..., we had already..."],"starters":[],"paths":[{"kw":["first","after","finally","before","next","later","started"],"say":"Thank you, that is a clear sequence. It will go straight into the report. Here is my difficulty. The report needs a likely explanation, and I am short of one. What is your theory about what those creatures were?"},{"kw":["picnic","food","sandwich","games","music","evening","arrived","sat"],"say":"So the picnic was calm before anything happened. That matters for the report. Here is my difficulty. The report needs a likely explanation, and I am short of one. What is your theory about what those creatures were?"}],"other":"Right. I will arrange the order myself. Here is my difficulty. The report needs a likely explanation, and I am short of one. What is your theory about what those creatures were?"},{"ask":"Give your theory using might, must or can't.","prompts":["Your theory","The evidence for it"],"hints":["They must have been... because...","They can't have been... since..."],"starters":[],"paths":[{"kw":["magic","spirit","monster","mushroom","alien","nature","spores","fungus"],"say":"An interesting theory, though the committee prefers evidence to imagination. Speaking of which, one of your friends told me it was a costume prank, and your group made it all up. How do you respond to that?"},{"kw":["prank","costume","joke","trick","fake","dream","imagine","people"],"say":"A prank, perhaps. I have heard that theory today already. Speaking of which, one of your friends told me it was a costume prank, and your group made it all up. How do you respond to that?"}],"other":"A theory is not evidence, I am afraid, but noted. Speaking of which, one of your friends told me it was a costume prank, and your group made it all up. How do you respond to that?"},{"ask":"Defend your account politely but firmly.","prompts":["Your response","One proof"],"hints":["That cannot be true because...","If it were a prank, we would have..."],"starters":[],"paths":[{"kw":["prank","true","truth","costume","joke","fake","lie","honest"],"say":"Understood. I never said I believed it. I only need to hear you out. The next question concerns safety. At the moment the creatures appeared, you made a decision to stay or leave. What did you do, and why?"},{"kw":["proof","evidence","photo","witness","saw","trace","footprint","everyone"],"say":"Evidence would help your case. Is there any left in the forest? The next question concerns safety. At the moment the creatures appeared, you made a decision to stay or leave. What did you do, and why?"}],"other":"I see. I shall consider both versions. The next question concerns safety. At the moment the creatures appeared, you made a decision to stay or leave. What did you do, and why?"},{"ask":"Explain your decision at that moment and justify it.","prompts":["Stay or leave","Your reasoning"],"hints":["We decided to... since...","Looking back, I would..."],"starters":[],"paths":[{"kw":["leave","left","run","ran","escape","hide","hid","away"],"say":"Leaving was sensible. Self-preservation is hardly a crime. My colleague has a theory of his own. He says the spores in the damp forest could make people imagine things. Do you find that convincing?"},{"kw":["stay","stayed","watch","stand","look","wait","stood","investigate"],"say":"Staying took nerve. I would not have judged you for leaving, though. My colleague has a theory of his own. He says the spores in the damp forest could make people imagine things. Do you find that convincing?"}],"other":"Fair enough. Decisions made in fear are hard to explain. My colleague has a theory of his own. He says the spores in the damp forest could make people imagine things. Do you find that convincing?"},{"ask":"Say whether the spore theory convinces you.","prompts":["Your opinion","A counter-argument"],"hints":["I am not convinced because...","That is plausible, but..."],"starters":[],"paths":[{"kw":["spore","convinc","possible","plausible","agree","science","believe","logical"],"say":"A fair view. My colleague will be pleased, though it does not explain everything. The park committee wants to close the forest for a week. That would ruin things for local families. How would you suggest we compromise?"},{"kw":["impossible","disagree","everyone","same","together","real","wrong","nonsense"],"say":"A good point. Several people seeing the same thing is hard to explain. The park committee wants to close the forest for a week. That would ruin things for local families. How would you suggest we compromise?"}],"other":"Noted. I will pass your view on to him. The park committee wants to close the forest for a week. That would ruin things for local families. How would you suggest we compromise?"},{"ask":"Negotiate a compromise about the forest closure.","prompts":["Your proposal","Why it is fair"],"hints":["Instead of closing it, why not...","If we..., then both sides..."],"starters":[],"paths":[{"kw":["partial","section","area","warning","sign","patrol","guide","hours"],"say":"A partial measure. That is something I can put to the committee. Suppose the forest stays open. How should we prevent another incident? What measures would you recommend to future picnickers?"},{"kw":["close","safe","week","short","reopen","check","inspect","days"],"say":"A shorter closure with an inspection. The committee might accept that. Suppose the forest       st.appendChild(el("p", { text: kind === "api" ? t("apiFailedHint") : t("videoErrorHint") }));
      st.appendChild(el("a", { class: "ct-btn", href: ep.video.watchUrl, target: "_blank", rel: "noopener", text: t("watchOnYoutube") }));
      st.appendChild(el("p", { class: "ct-video__code" }, [t("reportHint") + " ", el("code", { text: ep.id })]));
    }
  };

  /* ------------------------------------------------------------------ */
  /* Router                                                              */
  /* ------------------------------------------------------------------ */
  function route() {
    var m = /^#watch\/(.+)$/.exec(location.hash || "");
    var lib = $("#ct-library"), player = $("#ct-player-view");
    if (m) {
      lib.hidden = true; player.hidden = false;
      Watch.open(decodeURIComponent(m[1]));
      window.scrollTo(0, 0);
      $("#ct-main").focus({ preventScroll: true });
    } else {
      Watch.close();
      player.hidden = true; lib.hidden = false;
      Library.render();
      $("#ct-crumb-current").textContent = "";
      document.title = t("navLibrary") + " — Just to Study";
    }
  }

  function setUiLang(lang) {
    state.ui = lang; Store.write({ ui: lang });
    applyStaticText();
    Library.buildControls(); Library.render();
    if (Watch.ep) {
      Watch.renderMeta(Watch.ep);
      Mission.flush();
      if (Mission.m) { if (Mission.open) Mission.render(); else Mission.renderTeaser(); }
    } else document.title = t("navLibrary") + " — Just to Study";
  }


  /* ------------------------------------------------------------------ */
  /* Availability check by cover.                                        */
  /* A video that was deleted or made private has no real thumbnail: YouTube serves a 120px placeholder or fails.   */
  /* Such videos are hidden. If most covers fail to load (offline / blocked network) nothing is hidden.            */
  /* Results are cached per browser for 3 days. Add ?audit=1 to the address to see the hidden list.              */
  /* ------------------------------------------------------------------ */
  var Avail = {
    map: {}, ttl: 3 * 24 * 3600 * 1000, running: false, summary: null,
    load: function () {
      var m = Store.read().avail || {}, now = Date.now();
      for (var id in m) if (m[id] && m[id].s && now - m[id].t < this.ttl) this.map[id] = m[id];
    },
    bad: function (ep) { var r = this.map[ep.video.id]; return !!(r && r.s === "bad"); },
    probe: function (id, done) {
      var tries = 0;
      (function go() {
        var im = new Image(), settled = false, timer = setTimeout(function () { fin("err"); }, 12000);
        function fin(r) {
          if (settled) return; settled = true; clearTimeout(timer); im.onload = im.onerror = null;
          if (r === "err" && tries++ < 1) { go(); return; }
          done(r);
        }
        im.onload = function () { fin(im.naturalWidth <= 120 ? "bad" : "ok"); };
        im.onerror = function () { fin("err"); };
        im.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
      })();
    },
    run: function () {
      var self = this, now = Date.now(), ids = [], seen = {};
      ALL.forEach(function (e) { var id = e.video.id; if (!seen[id] && !self.map[id]) { seen[id] = 1; ids.push(id); } });
      if (!ids.length || this.running) { this.finish(); return; }
      this.running = true;
      var res = {}, next = 0, active = 0, finished = 0, LIMIT = 8;
      function pump() {
        while (active < LIMIT && next < ids.length) {
          (function (id) {
            active++;
            self.probe(id, function (r) {
              res[id] = r; active--; finished++;
              if (r === "bad") { self.map[id] = { s: "bad", t: Date.now() }; }
              if (r === "ok") { self.map[id] = { s: "ok", t: Date.now() }; }
              if (finished % 25 === 0 || finished === ids.length) refresh();
              if (finished === ids.length) done(); else pump();
            });
          })(ids[next++]);
        }
      }
      function refresh() { if (!Watch.ep) { Library.buildControls(); Library.render(); } }
      function done() {
        var errs = ids.filter(function (i) { return res[i] === "err"; }), oks = ids.filter(function (i) { return res[i] === "ok"; });
        /* network trouble: do not hide videos only because covers could not be loaded */
        if (errs.length && errs.length <= 0.3 * ids.length && oks.length) errs.forEach(function (i) { self.map[i] = { s: "bad", t: Date.now() }; });
        Store.write({ avail: self.map }); self.running = false; self.finish(); refresh();
      }
      pump();
    },
    finish: function () {
      var self = this, hidden = ALL.filter(function (e) { return self.bad(e); });
      this.summary = { total: ALL.length, hidden: hidden.length };
      if (/[?&]audit=1/.test(location.search)) this.panel(hidden);
    },
    panel: function (hidden) {
      var old = $("#ct-audit"); if (old) old.remove();
      var text = hidden.map(function (e) { return e.level + "\t" + e.audience + "\t" + e.title + "\thttps://www.youtube.com/watch?v=" + e.video.id; }).join("\n");
      var box = el("details", { id: "ct-audit", class: "ct-view", open: true }, [
        el("summary", { text: "Проверка обложек: скрыто " + hidden.length + " из " + ALL.length }),
        el("p", { class: "ct-credit", text: "Скрыты видео без обложки (удалены или закрыты). Список можно скопировать и передать на замену." }),
        el("textarea", { readonly: true, rows: 10, style: "width:100%;font:12px ui-monospace,monospace" }),
        el("button", { type: "button", class: "ct-btn ct-btn--ghost", text: "Копировать", onclick: function () { try { navigator.clipboard.writeText(text); } catch (e) { /* ignore */ } } })]);
      box.querySelector("textarea").value = text;
      $("#ct-main").appendChild(box);
    }
  };
  function live() { return ALL.filter(function (e) { return !Avail.bad(e); }); }

  function boot() {
    if (!DATA.length) { $("#ct-count").textContent = "Cartoon list failed to load."; return; }
    applyStaticText();
    Avail.load();
    Library.init(); Library.buildControls(); Library.render();
    Watch.init();
    Avail.run();
    $all("[data-ui-lang]").forEach(function (b) { b.addEventListener("click", function () { setUiLang(b.getAttribute("data-ui-lang")); }); });
    $all("[data-route='library']").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); if (location.hash) location.hash = ""; else route(); });
    });
    window.addEventListener("hashchange", route);
    route();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

  // Exposed for platform integration and tests.
  window.JTSCartoons = { Avail: Avail, state: state, Watch: Watch, Library: Library, Mission: Mission, Progress: Progress, findEpisode: findEpisode, MISSIONS: MISSIONS };
})();
</script>
</body>
